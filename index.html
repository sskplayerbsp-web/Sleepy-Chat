", "these", "thick", "thing", "think", "third", "those", "three", "threw", "throw", "tight", "times", "tired", "title", "today", "topic", "total", "touch", "tough", "tower", "track", "trade", "train", "treat", "trend", "trial", "tribe", "trick", "tried", "tries", "truck", "truly", "trust", "truth", "twice", "uncle", "under", "union", "unity", "until", "upper", "urban", "usage", "usual", "valid", "value", "video", "virus", "visit", "vital", "voice", "waste", "watch", "water", "wheel", "where", "which", "while", "white", "whole", "whose", "woman", "world", "worry", "worse", "worst", "worth", "would", "wound", "write", "wrong", "wrote", "yield", "young", "yours", "youth", "zebra"];
  var MAX_GUESSES = 6;
  var ROWS = MAX_GUESSES;

  // Deterministic daily word — everyone sees the same on the same day
  function todayStr(){
    var d = new Date();
    var y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), dd = String(d.getDate()).padStart(2,'0');
    return y + '-' + m + '-' + dd;
  }
  function dayNumber(s){
    var d = new Date(s + 'T00:00:00Z');
    return Math.floor(d.getTime() / 86400000);
  }
  function todayIndex(){
    return dayNumber(todayStr()) % WORDS.length;
  }
  function todayWord(){
    return WORDS[todayIndex()];
  }
  function tomorrowIn(){
    var now = new Date();
    var t = new Date(now.getFullYear(), now.getMonth(), now.getDate()+1, 0, 0, 0);
    var diff = t - now;
    var h = Math.floor(diff/3600000);
    var m = Math.floor((diff%3600000)/60000);
    var s = Math.floor((diff%60000)/1000);
    return h + 'h ' + m + 'm ' + s + 's';
  }

  // Game state
  var game = {
    row: 0,
    col: 0,
    guesses: [],       // array of strings
    results: [],       // array of arrays: 'correct'|'present'|'absent'
    solved: false,
    over: false,
    keyState: {},      // letter -> 'correct'|'present'|'absent'
  };

  function scoreGuess(guess, answer){
    var res = new Array(5).fill('absent');
    var ansArr = answer.split('');
    var used = new Array(5).fill(false);
    // First pass: exact matches
    for (var i = 0; i < 5; i++){
      if (guess[i] === ansArr[i]){ res[i] = 'correct'; used[i] = true; }
    }
    // Second pass: present but wrong spot
    for (var i = 0; i < 5; i++){
      if (res[i] === 'correct') continue;
      for (var j = 0; j < 5; j++){
        if (!used[j] && guess[i] === ansArr[j]){
          res[i] = 'present';
          used[j] = true;
          break;
        }
      }
    }
    return res;
  }

  // ---------- Persistence ----------
  async function loadTodayResult(){
    if (!window.ME) return;
    var r = await sb.from('daily_game_results').select('*').eq('user_id', window.ME.id).eq('game_date', todayStr()).maybeSingle();
    if (!r.data) return;
    game.guesses = (r.data.guesses || []).map(function(g){ return typeof g === 'string' ? g : g.word; });
    game.results = [];
    game.solved = r.data.solved;
    game.over = r.data.solved;
    game.row = game.guesses.length;
    game.col = 0;
    var ans = todayWord();
    game.guesses.forEach(function(g, i){
      var res = scoreGuess(g, ans);
      game.results[i] = res;
      if (game.guesses[i] === ans) game.solved = true;
      res.forEach(function(st, idx){
        var L = g[idx];
        var cur = game.keyState[L];
        if (cur === 'correct') return;
        if (st === 'correct') game.keyState[L] = 'correct';
        else if (st === 'present' && cur !== 'correct') game.keyState[L] = 'present';
        else if (st === 'absent' && !cur) game.keyState[L] = 'absent';
      });
    });
    if (!game.solved && game.row >= MAX_GUESSES) game.over = true;
  }

  async function saveTodayResult(){
    if (!window.ME) return;
    var payload = {
      user_id: window.ME.id,
      game_date: todayStr(),
      guesses: game.guesses,
      solved: game.solved,
      attempts: game.guesses.length,
      updated_at: new Date().toISOString(),
    };
    var r = await sb.from('daily_game_results').upsert(payload);
    if (r.error) log("save failed:", r.error.message);
  }

  async function loadStreak(){
    if (!window.ME) return null;
    var r = await sb.from('user_streaks').select('*').eq('user_id', window.ME.id).maybeSingle();
    return r.data;
  }
  async function updateStreak(won){
    if (!window.ME) return;
    var today = todayStr();
    var cur = await loadStreak();
    if (!cur){
      // First game ever
      await sb.from('user_streaks').insert({
        user_id: window.ME.id,
        current_streak: won ? 1 : 0,
        longest_streak: won ? 1 : 0,
        last_played: today,
        total_games: 1,
        total_wins: won ? 1 : 0,
      });
      return;
    }
    if (cur.last_played === today) return; // already counted
    var yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
    var yStr = yesterday.getFullYear() + '-' + String(yesterday.getMonth()+1).padStart(2,'0') + '-' + String(yesterday.getDate()).padStart(2,'0');
    var newCurrent;
    if (won){
      newCurrent = cur.last_played === yStr ? (cur.current_streak + 1) : 1;
    } else {
      newCurrent = 0;
    }
    var newLongest = Math.max(cur.longest_streak, newCurrent);
    await sb.from('user_streaks').update({
      current_streak: newCurrent,
      longest_streak: newLongest,
      last_played: today,
      total_games: (cur.total_games || 0) + 1,
      total_wins: (cur.total_wins || 0) + (won ? 1 : 0),
      updated_at: new Date().toISOString(),
    }).eq('user_id', window.ME.id);
  }

  // ---------- UI ----------

    if (!body) return;
    var ans = todayWord();

    var html = '<div class="dg-wrap">';

    // Header
    html += '<div class="dg-head">' +

      '<div class="sub">Guess the 5-letter word in 6 tries</div>' +

    '</div>';

    // Streak stats
    html += '<div class="dg-streak-row">' +
      '<div class="dg-stat' + (streak.current_streak > 0 ? ' hot' : '') + '">' +
        '<div class="v">' + (streak.current_streak || 0) + '</div>' +

      '</div>' +
    '</div>';

    // Grid
    html += '<div class="dg-grid">';
    for (var r = 0; r < ROWS; r++){
      var guess = game.guesses[r] || '';
      var res = game.results[r];
      for (var c = 0; c < 5; c++){
        var letter = guess[c] ? guess[c].toUpperCase() : '';
        var cls = 'dg-cell';
        if (letter) cls += ' filled';
        if (res && res[c]) cls += ' ' + res[c];
        // Current typing row
        if (r === game.row && !game.over){
          if (c < game.col) cls += ' filled';
        }
        html += '<div class="' + cls + '" data-cell="' + r + '-' + c + '">' + esc(letter) + '</div>';
      }
    }
    html += '</div>';

    // Win/lose message
    if (game.solved){
      var solvedOn = game.guesses.length;
      html += '<div class="dg-msg win">' +
        '🎉 Solved in ' + solvedOn + ' ' + (solvedOn === 1 ? 'try' : 'tries') + '!' +
        '<div class="word">' + esc(ans) + '</div>' +
      '</div>';
    } else if (game.over){
      html += '<div class="dg-msg lose">' +
        '😵 Out of tries. The word was:' +
        '<div class="word">' + esc(ans) + '</div>' +
      '</div>';
    }

    // Keyboard
    if (!game.over){
      var kRows = ['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'];
      html += '<div class="dg-keyboard">';
      kRows.forEach(function(kr, ki){
        html += '<div class="dg-krow">';
        if (ki === 2) html += '<button class="dg-key wide" data-key="ENTER">Enter</button>';
        kr.split('').forEach(function(ch){
          var st = game.keyState[ch] || '';
          html += '<button class="dg-key ' + st + '" data-key="' + ch + '">' + ch + '</button>';
        });
        if (ki === 2) html += '<button class="dg-key wide" data-key="BACK">⌫</button>';
        html += '</div>';
      });
      html += '</div>';
    }

    // Actions
    html += '<div class="dg-actions">' +
      '<button class="primary" id="dg-leaderboard">🏆 Leaderboard</button>' +
      '<button id="dg-how">How to play</button>' +
    '</div>';

    // Timer
    html += '<div class="dg-timer" id="dg-timer">Next word in ' + tomorrowIn() + '</div>';

    html += '</div>';
    body.innerHTML = html;

    // Wire keyboard
    body.querySelectorAll('[data-key]').forEach(function(k){
      k.onclick = function(){
        var key = k.dataset.key;
        if (key === 'ENTER') submitGuess();
        else if (key === 'BACK') backspace();
        else typeLetter(key);
      };
    });

    var lb = document.getElementById('dg-leaderboard');
    if (lb) lb.onclick = openLeaderboard;
    var how = document.getElementById('dg-how');
    if (how) how.onclick = openHowTo;
  }

  function updateTimer(){
    var t = document.getElementById('dg-timer');
    if (t) t.textContent = 'Next word in ' + tomorrowIn();
  }
  setInterval(updateTimer, 1000);

  function typeLetter(L){
    if (game.over || game.row >= MAX_GUESSES || game.col >= 5) return;
    var row = game.row;
    if (!game.guesses[row]) game.guesses[row] = '';
    if (game.guesses[row].length >= 5) return;
    game.guesses[row] += L.toLowerCase();
    game.col = game.guesses[row].length;
    redrawCurrentRow();
  }
  function backspace(){
    if (game.over) return;
    var row = game.row;
    if (!game.guesses[row] || !game.guesses[row].length) return;
    game.guesses[row] = game.guesses[row].slice(0, -1);
    game.col = game.guesses[row].length;
    redrawCurrentRow();
  }
  function redrawCurrentRow(){
    var row = game.row;
    var guess = game.guesses[row] || '';
    for (var c = 0; c < 5; c++){
      var cell = document.querySelector('[data-cell="' + row + '-' + c + '"]');
      if (!cell) continue;
      var L = guess[c] ? guess[c].toUpperCase() : '';
      cell.textContent = L;
      cell.classList.toggle('filled', !!L);
    }
  }

  async function submitGuess(){
    if (game.over) return;
    var row = game.row;
    var guess = (game.guesses[row] || '').toLowerCase();
    if (guess.length !== 5) {
      window.toast("Not enough letters", "Guess must be 5 letters.", "err");
      return;
    }
    if (WORDS.indexOf(guess) < 0){
      window.toast("Not a word", guess.toUpperCase() + " isn't in the list.", "err");
      return;
    }

    var ans = todayWord();
    var res = scoreGuess(guess, ans);
    game.results[row] = res;

    // Update key states
    res.forEach(function(st, idx){
      var L = guess[idx].toUpperCase();
      var cur = game.keyState[L];
      if (cur === 'correct') return;
      if (st === 'correct') game.keyState[L] = 'correct';
      else if (st === 'present' && cur !== 'correct') game.keyState[L] = 'present';
      else if (st === 'absent' && !cur) game.keyState[L] = 'absent';
    });

    // Flip animation on the row
    for (var c = 0; c < 5; c++){
      var cell = document.querySelector('[data-cell="' + row + '-' + c + '"]');
      if (cell){
        cell.classList.add('flip');
        (function(cell, st){
          setTimeout(function(){
            cell.classList.remove('flip');
            cell.classList.remove('filled');
            cell.classList.add(st);
          }, 250);
        })(cell, res[c]);
      }
    }

    if (guess === ans){
      game.solved = true;
      game.over = true;
      await saveTodayResult();
      await updateStreak(true);
      window.__myStreak = await loadStreak();
      setTimeout(renderGame, 700);
      setTimeout(function(){ window.toast("You won!", "Solved in " + game.guesses.length + " tries.", "ok"); }, 800);
      return;
    }

    game.row++;
    game.col = 0;

    if (game.row >= MAX_GUESSES){
      game.over = true;
      await saveTodayResult();
      await updateStreak(false);
      window.__myStreak = await loadStreak();
      setTimeout(renderGame, 700);
      return;
    }

    await saveTodayResult();
    setTimeout(renderGame, 550);
  }

      if (window.CURRENT && window.CURRENT.type === 'daily_game'){
        var el = document.getElementById('chat-head');
        if (el){
          el.innerHTML =
            '<button class="hbtn mobile-only" data-act="toggle-panel">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="width:20px;height:20px"><path d="M3 6h18M3 12h18M3 18h18"/></svg>' +
            '</button>' +
            '<div class="title"><span style="font-size:16px">🎯</span><span class="txt">Daily Word</span></div>' +
            '<div class="spacer"></div>' +
            '<button class="hbtn" id="dg-lb-head" title="Leaderboard">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:17px;height:17px"><path d="M6 4v7a6 6 0 0 0 12 0V4M4 4h16M9 21h6M12 14v7"/></svg>' +
            '</button>';
          var lbh = document.getElementById('dg-lb-head');
          if (lbh) lbh.onclick = openLeaderboard;
        }
        return;
      }
      return origRenderChatHead.apply(this, arguments);
    };
  }

  var origRenderComposer = window.renderComposer;
  if (typeof origRenderComposer === 'function'){
    window.renderComposer = function(){
      if (window.CURRENT && window.CURRENT.type === 'daily_game'){
        var w = document.getElementById('composer-wrap'); if (w) w.innerHTML = '';
        var t = document.getElementById('typing-bar'); if (t) t.innerHTML = '';
        return;
      }
      return origRenderComposer.apply(this, arguments);
    };
  }

  // ---------- Physical keyboard ----------
  document.addEventListener('keydown', function(e){
    if (!window.CURRENT || window.CURRENT.type !== 'daily_game') return;
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
    if (game.over) return;
    if (e.key === 'Enter'){ e.preventDefault(); submitGuess(); return; }
    if (e.key === 'Backspace'){ e.preventDefault(); backspace(); return; }
    if (/^[a-zA-Z]$/.test(e.key)) typeLetter(e.key.toUpperCase());
  });

  // ---------- Boot ----------
  setTimeout(async function(){
    if (!window.ME) return;
    injectRailButton();
    // Prime the streak for the badge
    window.__myStreak = await loadStreak() || { current_streak: 0, longest_streak: 0, total_wins: 0 };
    updateStreakBadgeOnRail();
  }, 3500);

  setInterval(injectRailButton, 3000);

  log("daily game ready");
})();
</script>

<script>
(function(){
  "use strict";
  if (window.__sleepyFishing) return;
  window.__sleepyFishing = true;
  function log(){ try{console.log.apply(console,["[Fish]"].concat([].slice.call(arguments)));}catch(e){} }
  function esc(s){ return window.esc(s); }

  var BANK_ID = '00000000-0000-0000-0000-0000000000ba';
  var CURE_COST = 100;
  var POISON_DRAIN_PER_MIN = 10;

  var FISH = [
    { name: 'Minnow',         emoji: '🐟', tier: 'common',    value: 10,   weight: 25 },
    { name: 'Sardine',        emoji: '🐟', tier: 'common',    value: 15,   weight: 20 },
    { name: 'Bass',           emoji: '🐟', tier: 'common',    value: 25,   weight: 15 },
    { name: 'Trout',          emoji: '🐟', tier: 'uncommon',  value: 50,   weight: 10 },
    { name: 'Salmon',         emoji: '🐠', tier: 'uncommon',  value: 75,   weight: 8 },
    { name: 'Tuna',           emoji: '🐟', tier: 'uncommon',  value: 100,  weight: 7 },
    { name: 'Clownfish',      emoji: '🐠', tier: 'rare',      value: 150,  weight: 4 },
    { name: 'Swordfish',      emoji: '🐟', tier: 'rare',      value: 250,  weight: 3 },
    { name: 'Golden Koi',     emoji: '🐠', tier: 'legendary', value: 500,  weight: 1 },
    { name: 'Mythic Arowana', emoji: '🐉', tier: 'legendary', value: 1000, weight: 0.5 },
    { name: 'Pufferfish',     emoji: '🐡', tier: 'puffer',    value: 0,    weight: 6.5 }
  ];

  var BADGES = [
    { id:'first_catch',  emoji:'🎣', name:'First Catch',    desc:'Caught your first fish' },
    { id:'catch_10',     emoji:'🐟', name:'Getting Started',desc:'Caught 10 fish' },
    { id:'catch_50',     emoji:'🎏', name:'Avid Angler',    desc:'Caught 50 fish' },
    { id:'catch_100',    emoji:'🏆', name:'Master Angler',  desc:'Caught 100 fish' },
    { id:'legendary_1',  emoji:'⭐', name:'Legend Hunter',  desc:'Caught a legendary fish' },
    { id:'legendary_5',  emoji:'🌟', name:'Legend Master',  desc:'Caught 5 legendary fish' },
    { id:'puffer_1',     emoji:'☠️', name:'Poisoned',       desc:'Caught a pufferfish' },
    { id:'puffer_5',     emoji:'💀', name:'Cursed',         desc:'Caught 5 pufferfish' },
    { id:'rich_1000',    emoji:'💰', name:'Thousandaire',   desc:'Reached 1,000 coins' },
    { id:'rich_10000',   emoji:'💎', name:'Ten Thousand',   desc:'Reached 10,000 coins' }
  ];

  var state = {
    account: null,
    catches: [],
    badges: [],
    casting: false,
    result: null,
    bankConvId: null,
  };

  function tierLabel(t){ return t === 'puffer' ? 'Hazard' : t; }

  // ---------- Load ----------
  async function ensureAccount(){
    var r = await sb.from('bank_accounts').select('*').eq('user_id', window.ME.id).maybeSingle();
    if (r.data){ state.account = r.data; return r.data; }
    var ins = await sb.from('bank_accounts').insert({ user_id: window.ME.id, balance: 100 }).select().single();
    if (ins.error) log("create failed:", ins.error.message);
    state.account = ins.data;
    // Bank welcome DM
    setTimeout(bankWelcome, 800);
    return ins.data;
  }

  async function loadCatches(){
    var r = await sb.from('fishing_catches').select('*').eq('user_id', window.ME.id).order('caught_at', { ascending: false }).limit(30);
    state.catches = r.data || [];
  }
  async function loadBadges(){
    var r = await sb.from('user_badges').select('*').eq('user_id', window.ME.id);
    state.badges = (r.data || []).map(function(b){ return b.badge_id; });
  }

  // ---------- Badges ----------
  async function awardBadge(id){
    if (state.badges.indexOf(id) >= 0) return false;
    var r = await sb.from('user_badges').insert({ user_id: window.ME.id, badge_id: id });
    if (r.error) return false;
    state.badges.push(id);
    var b = BADGES.find(function(x){ return x.id === id; });
    if (b) window.toast("Badge unlocked!", b.emoji + " " + b.name, "ok");
    return true;
  }

  async function checkBadges(){
    var count = state.catches.length;
    var legendaryCount = state.catches.filter(function(c){ return c.fish_tier === 'legendary'; }).length;
    var pufferCount = state.catches.filter(function(c){ return c.fish_tier === 'puffer'; }).length;
    var balance = state.account ? state.account.balance : 0;

    if (count >= 1)   await awardBadge('first_catch');
    if (count >= 10)  await awardBadge('catch_10');
    if (count >= 50)  await awardBadge('catch_50');
    if (count >= 100) await awardBadge('catch_100');
    if (legendaryCount >= 1) await awardBadge('legendary_1');
    if (legendaryCount >= 5) await awardBadge('legendary_5');
    if (pufferCount >= 1) await awardBadge('puffer_1');
    if (pufferCount >= 5) await awardBadge('puffer_5');
    if (balance >= 1000)  await awardBadge('rich_1000');
    if (balance >= 10000) await awardBadge('rich_10000');
  }

  // ---------- Bank bot ----------
  async function ensureBankDM(){
    if (state.bankConvId) return state.bankConvId;
    try {
      var r = await sb.rpc('ensure_bank_dm');
      if (!r.error && r.data){
        state.bankConvId = r.data;
        await window.fetchProfiles([BANK_ID]);
        return state.bankConvId;
      }
    } catch(e){ log("ensure_bank_dm failed:", e.message); }
    return null;
  }
  async function bankSay(msg){
    var convId = await ensureBankDM();
    if (!convId) return;
    try { await sb.rpc('bank_say', { conv: convId, msg: msg }); } catch(e){ log("bank_say failed:", e.message); }
  }
  async function bankWelcome(){
    await ensureBankDM();
    await bankSay(
      "Welcome to the Bank 💰\n" +
      "You start with 100 coins. Cast your line in the Fishing game to earn more.\n\n" +
      "Watch out for 🐡 Pufferfish — catching one poisons you and drains 10 coins per minute " +
      "until you pay 100 to cure. Type 'balance' any time to check your coins."
    );
  }

  // ---------- Poison tick ----------
  async function tickPoison(){
    try {
      var r = await sb.rpc('tick_poison');
      if (!r.error && r.data && r.data.drained > 0){
        log("poison tick drained", r.data.drained);
        state.account = await ensureAccount();
        if (r.data.drained >= 20){
          bankSay("☠️ Poison drain: -" + r.data.drained + " coins (" + r.data.minutes + " min).\n" +
                  "Balance: " + r.data.new_balance + " coins. Type 'cure' to pay 100 and heal.");
        }
      }
    } catch(e){ log("tick failed:", e.message); }
  }

  // ---------- Fishing ----------
  function rollFish(){
    var total = FISH.reduce(function(s, f){ return s + f.weight; }, 0);
    var r = Math.random() * total;
    var acc = 0;
    for (var i = 0; i < FISH.length; i++){
      acc += FISH[i].weight;
      if (r < acc) return FISH[i];
    }
    return FISH[0];
  }

  async function castLine(){
    if (state.casting) return;
    if (!state.account) await ensureAccount();
    if (state.account && state.account.poisoned){
      window.toast("You're poisoned", "Cure yourself before fishing.", "err");
      return;
    }
    state.casting = true;
    state.result = null;
    renderFishing();

    var caught = rollFish();
    var wait = 2500 + Math.random() * 1500;

    setTimeout(async function(){
      try {
        var r = await sb.rpc('record_catch', {
          fish_name: caught.name,
          fish_emoji: caught.emoji,
          fish_tier: caught.tier,
          fish_value: caught.value
        });
        if (r.error) throw r.error;

        state.account = await ensureAccount();
        await loadCatches();
        state.result = caught;
        state.casting = false;

        if (caught.tier === 'puffer'){
          bankSay("🐡 You caught a Pufferfish! You are now POISONED.\n" +
                  "Losing " + POISON_DRAIN_PER_MIN + " coins per minute.\n" +
                  "Type 'cure' to pay " + CURE_COST + " and heal instantly.");
        } else if (caught.tier === 'legendary'){
          bankSay("⭐ LEGENDARY CATCH! " + caught.emoji + " " + caught.name +
                  " — +" + caught.value + " coins.\n" +
                  "New balance: " + state.account.balance);
        }

        await checkBadges();
        renderFishing();
      } catch(e){
        state.casting = false;
        log("catch failed:", e.message);
        window.toast("Error", e.message || String(e), "err");
        renderFishing();
      }
    }, wait);
  }

  async function cure(){
    try {
      var r = await sb.rpc('cure_poison');
      if (r.error) throw r.error;
      state.account = await ensureAccount();
      await bankSay("✨ Poison cured. -100 coins.\nNew balance: " + state.account.balance);
      window.toast("Cured", "You're healthy again.", "ok");
      renderFishing();
    } catch(e){
      window.toast("Could not cure", e.message || String(e), "err");
    }
  }

  // ---------- UI ----------
  function renderFishing(){
    var body = document.getElementById('chat-body');
    if (!body) return;

    var acc = state.account || { balance: 0, poisoned: false };
    var drained = state.casting ? '<div class="cast-overlay"><div class="lbl">Casting...</div><div class="bar"><i></i></div></div>' : '';
    var resultHTML = state.result ? resultOverlay(state.result) : '';

    var html = '<div class="fish-wrap">';

    html += '<div class="fish-head">' +
      '<div class="ico">🎣</div>' +
      '<h2>Fishing</h2>' +
      '<div class="sub">Cast your line and reel in some coins</div>' +
    '</div>';

    html += '<div class="bank-balance">' +
      '<div class="amt"><span class="coin">🪙</span>' + acc.balance.toLocaleString() + '</div>' +
      '<div class="lbl">Your Balance</div>' +
    '</div>';

    if (acc.poisoned){
      var minsLeft = Math.floor(acc.balance / POISON_DRAIN_PER_MIN);
      html += '<div class="poison-bar">' +
        '<div class="icon">🐡</div>' +
        '<div class="info"><div class="t">POISONED</div>' +
          '<div class="d">-10 coins/min · ' + minsLeft + ' min until broke</div></div>' +
        '<button id="fish-cure"' + (acc.balance < CURE_COST ? ' disabled' : '') + '>Cure -100</button>' +
      '</div>';
    }

    html += '<div class="water-scene">' +
      drained + resultHTML +
      '<div class="swimmer">🐟</div><div class="swimmer">🐠</div><div class="swimmer">🐟</div>' +
      '<div class="swimmer">🐡</div><div class="swimmer">🐠</div><div class="swimmer">🐟</div>' +
    '</div>';

    var disabled = state.casting || acc.poisoned;
    html += '<button class="cast-btn" id="fish-cast"' + (disabled ? ' disabled' : '') + '>' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20 12 12M12 12l8-8M12 12H4M12 12v8"/></svg>' +
      (acc.poisoned ? 'Cure first to fish' : state.casting ? 'Casting...' : 'Cast Line') +
    '</button>';

    // Recent catches
    if (state.catches.length){
      html += '<div class="fish-recent"><h3>Recent catches</h3>';
      state.catches.slice(0, 6).forEach(function(c){
        var v = c.fish_tier === 'puffer'
          ? '<span class="val bad">POISON</span>'
          : '<span class="val">+' + c.value + '</span>';
        html += '<div class="fish-item">' +
          '<span class="emoji">' + c.fish_emoji + '</span>' +
          '<span class="name">' + esc(c.fish_name) + '</span>' +
          '<span style="font-size:10.5px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em">' + esc(tierLabel(c.fish_tier)) + '</span>' +
          v +
        '</div>';
      });
      html += '</div>';
    }

    html += '<div class="fish-actions">' +
      '<button id="fish-lb">🏆 Leaderboard</button>' +
      '<button id="fish-inv">🎒 Inventory</button>' +
      '<button id="fish-badges">🏅 Badges</button>' +
    '</div>';

    html += '</div>';
    body.innerHTML = html;

    var c = document.getElementById('fish-cast');
    if (c) c.onclick = castLine;
    var cu = document.getElementById('fish-cure');
    if (cu && !cu.disabled) cu.onclick = cure;
    var lb = document.getElementById('fish-lb');
    if (lb) lb.onclick = openLeaderboard;
    var inv = document.getElementById('fish-inv');
    if (inv) inv.onclick = openInventory;
    var bg = document.getElementById('fish-badges');
    if (bg) bg.onclick = openBadges;
    var closeRes = document.getElementById('fish-res-close');
    if (closeRes) closeRes.onclick = function(){ state.result = null; renderFishing(); };
  }

  function resultOverlay(fish){
    var isPuff = fish.tier === 'puffer';
    var valueHTML = isPuff
      ? '<div class="value bad">+ POISON</div>'
      : '<div class="value">+' + fish.value + '</div>';
    return '<div class="catch-result">' +
      '<div class="catch-card">' +
        '<div class="emoji">' + fish.emoji + '</div>' +
        '<div class="name">' + esc(fish.name) + '</div>' +
        '<div class="tier ' + fish.tier + '">' + esc(tierLabel(fish.tier)) + '</div>' +
        valueHTML +
        '<br><button class="close" id="fish-res-close">Close</button>' +
      '</div>' +
    '</div>';
  }

  // ---------- Modals ----------
  async function openLeaderboard(){
    var r = await sb.from('bank_accounts').select('*').order('balance', { ascending: false }).limit(20);
    var rows = r.data || [];
    var ids = rows.map(function(x){ return x.user_id; });
    await window.fetchProfiles(ids);
    var html = '<div class="lb-list">';
    if (!rows.length) html += '<div class="empty" style="padding:20px">No accounts yet.</div>';
    rows.forEach(function(row, i){
      var p = window.PROFILES[row.user_id] || { username: 'user', display_name: 'User' };
      var rank = i + 1;
      var cls = rank === 1 ? 'gold' : rank === 2 ? 'silver' : rank === 3 ? 'bronze' : '';
      var me = row.user_id === window.ME.id;
      html += '<div class="lb-row' + (me ? ' me' : '') + '">' +
        '<div class="rank ' + cls + '">' + rank + '</div>' +
        '<div style="position:relative">' + window.avatarHTML(row.user_id, 34) + '</div>' +
        '<div class="info"><div class="nm">' + esc(p.display_name || p.username) + (me ? ' (you)' : '') + '</div>' +
          '<div class="un">' + row.total_earned + ' earned total</div></div>' +
        '<div class="val">🪙 ' + row.balance.toLocaleString() + '</div>' +
      '</div>';
    });
    html += '</div>';
    window.openModal("Wealth Leaderboard", html, { wide: true });
  }

  async function openInventory(){
    var r = await sb.from('fishing_catches').select('*').eq('user_id', window.ME.id);
    var rows = r.data || [];
    var counts = {};
    rows.forEach(function(c){
      if (!counts[c.fish_name]) counts[c.fish_name] = { ...c, count: 0, total: 0 };
      counts[c.fish_name].count++;
      counts[c.fish_name].total += c.value;
    });
    var entries = Object.keys(counts).map(function(k){ return counts[k]; });
    entries.sort(function(a, b){ return b.count - a.count; });

    var html = '';
    if (!entries.length){
      html = '<div class="empty" style="padding:20px">You haven\'t caught any fish yet.</div>';
    } else {
      html = '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px">' +
        entries.map(function(e){
          return '<div style="padding:12px;border-radius:10px;background:rgba(255,255,255,.03);display:flex;align-items:center;gap:10px">' +
            '<span style="font-size:26px">' + e.fish_emoji + '</span>' +
            '<div style="flex:1;min-width:0"><div style="font-weight:600;font-size:13px">' + esc(e.fish_name) + '</div>' +
            '<div style="font-size:11px;color:var(--text3)">x' + e.count + ' · ' + e.total + ' coins</div></div>' +
          '</div>';
        }).join('') + '</div>';
    }
    window.openModal("Fish Inventory", html, { wide: true });
  }

  async function openBadges(){
    await loadBadges();
    var html = '<div class="badge-grid">';
    BADGES.forEach(function(b){
      var owned = state.badges.indexOf(b.id) >= 0;
      html += '<div class="badge-card ' + (owned ? 'unlocked' : 'locked') + '">' +
        '<div class="be">' + b.emoji + '</div>' +
        '<div class="bn">' + esc(b.name) + '</div>' +
        '<div class="bd">' + esc(b.desc) + '</div>' +
      '</div>';
    });
    html += '</div>';
    window.openModal("Your Badges", html, { wide: true });
  }

  // ---------- Rail button ----------
  function updateRailPill(){
    var btn = document.querySelector('.rail-btn.fishing-btn');
    if (!btn) return;
    var acc = state.account;
    if (!acc) return;
    var pill = btn.querySelector('.fish-pill');
    var label = acc.poisoned ? 'POISON' : (acc.balance >= 1000 ? (acc.balance >= 10000 ? '10K+' : Math.floor(acc.balance/1000) + 'K') : acc.balance);
    if (!pill){
      btn.insertAdjacentHTML('beforeend', '<span class="fish-pill' + (acc.poisoned ? ' poison' : '') + '">' + label + '</span>');
    } else {
      pill.textContent = label;
      pill.classList.toggle('poison', !!acc.poisoned);
    }
  }

  function injectRailButton(){
    var rail = document.getElementById('rail');
    if (!rail) return;
    if (rail.querySelector('.fishing-btn')){ updateRailPill(); return; }
    var btn = document.createElement('button');
    btn.className = 'rail-btn fishing-btn';
    btn.title = 'Fishing';
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:22px;height:22px"><path d="M4 20 12 12M12 12l8-8M12 12H4M12 12v8"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>';
    btn.onclick = openFishing;
    var anchor = rail.querySelector('[data-rail="create-community"]') || rail.querySelector('[data-rail="find"]');
    if (anchor) rail.insertBefore(btn, anchor.nextSibling);
    else rail.appendChild(btn);
    updateRailPill();
  }

  async function openFishing(){
    window.CURRENT = { type: 'fishing', server: null, channel: null, conv: null, ticket: null };
    await ensureAccount();
    await Promise.all([loadCatches(), loadBadges()]);
    window.renderChatHead();
    renderFishing();
    updateRailPill();
  }

  // ---------- Hook into render loop ----------
  var origRenderRail = window.renderRail;
  if (typeof origRenderRail === 'function'){
    window.renderRail = function(){
      var r = origRenderRail.apply(this, arguments);
      setTimeout(injectRailButton, 10);
      return r;
    };
  }

  var origRenderChat = window.renderChat;
  if (typeof origRenderChat === 'function'){
    window.renderChat = function(){
      if (window.CURRENT && window.CURRENT.type === 'fishing'){ renderFishing(); return; }
      return origRenderChat.apply(this, arguments);
    };
  }

  var origRenderChatHead = window.renderChatHead;
  if (typeof origRenderChatHead === 'function'){
    window.renderChatHead = function(){
      if (window.CURRENT && window.CURRENT.type === 'fishing'){
        var el = document.getElementById('chat-head');
        if (el){
          el.innerHTML =
            '<button class="hbtn mobile-only" data-act="toggle-panel">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="width:20px;height:20px"><path d="M3 6h18M3 12h18M3 18h18"/></svg>' +
            '</button>' +
            '<div class="title"><span style="font-size:16px">🎣</span><span class="txt">Fishing</span></div>' +
            '<div class="spacer"></div>';
        }
        return;
      }
      return origRenderChatHead.apply(this, arguments);
    };
  }

  var origRenderComposer = window.renderComposer;
  if (typeof origRenderComposer === 'function'){
    window.renderComposer = function(){
      if (window.CURRENT && window.CURRENT.type === 'fishing'){
        var w = document.getElementById('composer-wrap'); if (w) w.innerHTML = '';
        var t = document.getElementById('typing-bar'); if (t) t.innerHTML = '';
        return;
      }
      return origRenderComposer.apply(this, arguments);
    };
  }

  // ---------- Bank bot interception ----------
  // The Bank bot should color its messages gold and offer quick actions
  document.addEventListener('click', function(e){
    var btn = e.target.closest('[data-bank-action]');
    if (!btn) return;
    var action = btn.dataset.bankAction;
    if (action === 'cure') cure();
    if (action === 'balance') { window.toast("Balance", (state.account ? state.account.balance : 0) + " coins", "ok"); }
    if (action === 'fish') openFishing();
  }, true);

  // ---------- Boot ----------
  setTimeout(async function(){
    if (!window.ME) return;
    try {
      await ensureAccount();
      await Promise.all([loadCatches(), loadBadges()]);
      injectRailButton();
      await tickPoison();
      setInterval(tickPoison, 60000);
      setInterval(updateRailPill, 5000);
      log("boot complete");
    } catch(e){ log("boot error:", e.message); }
  }, 3500);

  log("fishing game ready");
})();
</script>

<script>
(function(){
  "use strict";
  if (window.__sleepyBankTheme) return;
  window.__sleepyBankTheme = true;
  function log(){ try{console.log.apply(console,["[Bank2]"].concat([].slice.call(arguments)));}catch(e){} }
  function esc(s){ return window.esc(s); }

  var BANK_ID = '00000000-0000-0000-0000-0000000000ba';

  // ------------------------------------------------------------
  // 1. BANK BOT RESPONDS to messages in its DM
  // ------------------------------------------------------------
  // Watch for messages sent in any DM where the other user is BANK_ID.
  // On insert, run a bot reply after a beat.

  var BOT_RESPONSES = {
    balance:  null,   // filled in dynamically
    cure:     null,
    fish:     null,
    help:     null,
    hi:       null,
    hello:    null,
    hey:      null,
    streak:   null,
    badges:   null,
    leaderboard: null,
    top:      null,
  };

  async function myAccount(){
    try {
      var r = await sb.from('bank_accounts').select('*').eq('user_id', window.ME.id).maybeSingle();
      if (r.data) return r.data;
      var ins = await sb.from('bank_accounts').insert({ user_id: window.ME.id, balance: 100 }).select().single();
      return ins.data;
    } catch(e){ return null; }
  }

  async function myCatches(){
    var r = await sb.from('fishing_catches').select('*').eq('user_id', window.ME.id);
    return r.data || [];
  }
  async function myBadges(){
    var r = await sb.from('user_badges').select('badge_id').eq('user_id', window.ME.id);
    return (r.data || []).map(function(x){ return x.badge_id; });
  }

  async function buildReply(text){
    var t = String(text || "").trim().toLowerCase();

    if (/^(hi|hello|hey|yo|sup)/.test(t)) {
      return "Hello! 👋\nI'm the Bank. I manage your coins.\n\nTry:\n• `balance` — check your coins\n• `fish` — opens the fishing game\n• `cure` — heal from pufferfish poison\n• `badges` — see what you've unlocked\n• `leaderboard` — top richest players";
    }
    if (t === 'balance' || t === 'bal' || t === 'coins' || t === 'money' || t === 'wallet') {
      var acc = await myAccount();
      if (!acc) return "Hmm, I couldn't find your account. Try reloading.";
      return "💰 **Your balance: " + acc.balance.toLocaleString() + " coins**\n" +
             "Total earned: " + acc.total_earned.toLocaleString() + "\n" +
             "Total spent: " + acc.total_spent.toLocaleString() +
             (acc.poisoned ? "\n\n⚠️ **You're poisoned** — losing 10 coins/min. Type `cure` to heal." : "");
    }
    if (t === 'cure' || t === 'heal') {
      var acc2 = await myAccount();
      if (!acc2) return "Account not found.";
      if (!acc2.poisoned) return "You're not poisoned. Nothing to cure.";
      if (acc2.balance < 100) return "You need 100 coins to cure, but you only have " + acc2.balance + ". Catch more fish (once you're not poisoned).";
      var r = await sb.rpc('cure_poison');
      if (r.error) return "Cure failed: " + r.error.message;
      var acc3 = await myAccount();
      return "✨ **Poison cured!** -100 coins.\nNew balance: **" + acc3.balance + " coins**";
    }
    if (t === 'fish' || t === 'fishing' || t === 'cast') {
      setTimeout(function(){
        if (typeof window.openFishing === 'function') window.openFishing();
      }, 400);
      return "🎣 Opening the fishing game for you...\nCast your line to catch fish and earn coins. Watch out for 🐡 pufferfish!";
    }
    if (t === 'badges' || t === 'badge') {
      var badges = await myBadges();
      if (!badges.length) return "You haven't unlocked any badges yet. Keep playing to earn some! 🏅\n\nEarn badges by:\n• Catching your first fish\n• Catching 10, 50, 100 fish total\n• Catching legendary fish\n• Getting poisoned by a pufferfish\n• Reaching 1,000 or 10,000 coins";
      return "🏅 **You've unlocked " + badges.length + " badge" + (badges.length === 1 ? "" : "s") + "!**\n\n" + badges.join(", ");
    }
    if (t === 'leaderboard' || t === 'top' || t === 'rich') {
      var r = await sb.from('bank_accounts').select('*').order('balance', { ascending: false }).limit(5);
      var rows = r.data || [];
      if (!rows.length) return "No one has an account yet.";
      var ids = rows.map(function(x){ return x.user_id; });
      await window.fetchProfiles(ids);
      var out = "🏆 **Top 5 richest players:**\n\n";
      rows.forEach(function(row, i){
        var p = window.PROFILES[row.user_id] || { username: 'user' };
        var medal = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : "  ";
        out += medal + " **" + (p.display_name || p.username) + "** — " + row.balance.toLocaleString() + " 🪙\n";
      });
      return out;
    }
    if (t === 'help' || t === 'commands') {
      return "**Bank commands:**\n" +
             "• `balance` — check your coins\n" +
             "• `fish` — open the fishing game\n" +
             "• `cure` — heal from poison (-100 coins)\n" +
             "• `badges` — see your unlocks\n" +
             "• `leaderboard` — top richest players\n" +
             "• `stats` — your full stats";
    }
    if (t === 'stats' || t === 'profile') {
      var acc4 = await myAccount();
      var catches = await myCatches();
      var badges = await myBadges();
      var legendary = catches.filter(function(c){ return c.fish_tier === 'legendary'; }).length;
      var puffer = catches.filter(function(c){ return c.fish_tier === 'puffer'; }).length;
      return "📊 **Your fishing stats:**\n" +
             "💰 Balance: " + (acc4 ? acc4.balance : 0) + " coins\n" +
             "🐟 Total catches: " + catches.length + "\n" +
             "⭐ Legendary catches: " + legendary + "\n" +
             "🐡 Pufferfish: " + puffer + "\n" +
             "🏅 Badges: " + badges.length;
    }
    // Fallback
    return "I didn't understand that. Type `help` to see what I can do.";
  }

  // Intercept send to Bank: whenever a message is inserted into a Bank DM,
  // reply after a short delay.
  async function handleBankIncoming(msg){
    try {
      var conv = (window.CONVERSATIONS || []).filter(function(c){ return c.id === msg.conversation_id; })[0];
      if (!conv) return;
      if (conv.memberIds.indexOf(BANK_ID) < 0) return;
      if (msg.sender_id === BANK_ID) return;   // it's already the bot
      if (msg.sender_id !== window.ME.id) return; // ignore other users' messages

      // Wait a moment for realism
      setTimeout(async function(){
        var reply = await buildReply(msg.content);
        var convId = msg.conversation_id;
        try {
          await sb.rpc('bank_say', { conv: convId, msg: reply });
        } catch(e){
          log("bank_say failed:", e.message);
          // Fallback: insert directly if RPC missing
          await sb.from('messages').insert({
            conversation_id: convId,
            sender_id: BANK_ID,
            content: reply
          });
        }
      }, 220);
    } catch(e){ log("handleBankIncoming failed:", e.message); }
  }

  // Hook into the global message subscription by wrapping it.
  // The global subscription lives in a Supabase channel created by the core app.
  // Easier: poll the messages table for new bank DMs every 3 seconds.
  // (Polling avoids having to find and rewire the existing channel.)
  var lastSeen = {};
  async function pollBankIncoming(){
    if (!window.ME) return;
    try {
      // Find all my DM conversations with Bank
      var { data: cms } = await sb.from('conversation_members').select('conversation_id').eq('user_id', window.ME.id);
      var myIds = (cms || []).map(function(c){ return c.conversation_id; });
      if (!myIds.length) return;
      var { data: bankConvs } = await sb.from('conversation_members').select('conversation_id').eq('user_id', BANK_ID).in('conversation_id', myIds);
      if (!bankConvs || !bankConvs.length) return;
      var convIds = bankConvs.map(function(c){ return c.conversation_id; });

      for (var i = 0; i < convIds.length; i++){
        var cid = convIds[i];
        var { data: recent } = await sb.from('messages')
          .select('*')
          .eq('conversation_id', cid)
          .order('id', { ascending: false })
          .limit(5);
        (recent || []).forEach(function(m){
          var key = cid + ':' + m.id;
          if (lastSeen[key]) return;
          lastSeen[key] = 1;
          // Only respond to my own messages (avoid loops)
          if (m.sender_id === window.ME.id){
            // Wait — check this message hasn't already been answered
            // Actually just call handleBankIncoming; it filters by sender
            handleBankIncoming(m);
          }
        });
      }
    } catch(e){ log("poll failed:", e.message); }
  }

  // Seed lastSeen with existing messages so we don't spam-reply on boot
  async function seedSeen(){
    if (!window.ME) return;
    try {
      var { data: cms } = await sb.from('conversation_members').select('conversation_id').eq('user_id', window.ME.id);
      var myIds = (cms || []).map(function(c){ return c.conversation_id; });
      if (!myIds.length) return;
      var { data: bankConvs } = await sb.from('conversation_members').select('conversation_id').eq('user_id', BANK_ID).in('conversation_id', myIds);
      if (!bankConvs || !bankConvs.length) return;
      for (var i = 0; i < bankConvs.length; i++){
        var cid = bankConvs[i].conversation_id;
        var { data: recent } = await sb.from('messages').select('id').eq('conversation_id', cid).order('id', { ascending: false }).limit(10);
        (recent || []).forEach(function(m){ lastSeen[cid + ':' + m.id] = 1; });
      }
    } catch(e){}
  }

  // ------------------------------------------------------------
  // 2. COINS IN USER BAR
  // ------------------------------------------------------------
  var cachedAccount = null;
  async function refreshAccount(){
    if (!window.ME) return;
    try {
      var r = await sb.from('bank_accounts').select('*').eq('user_id', window.ME.id).maybeSingle();
      cachedAccount = r.data;
      paintCoinChip();
    } catch(e){}
  }

  function paintCoinChip(){
    var bar = document.getElementById('user-bar');
    if (!bar) return;
    var existing = bar.querySelector('.coin-chip');
    if (existing) existing.remove();
    if (!cachedAccount){
      // Create default look
      var chip = document.createElement('span');
      chip.className = 'coin-chip';
      chip.innerHTML = '🪙 ...';
      chip.onclick = function(){ if (window.openFishing) window.openFishing(); };
      bar.appendChild(chip);
      return;
    }
    var chip2 = document.createElement('span');
    chip2.className = 'coin-chip' + (cachedAccount.poisoned ? ' poison' : '');
    chip2.innerHTML = cachedAccount.poisoned
      ? '☠️ ' + cachedAccount.balance
      : '🪙 ' + cachedAccount.balance.toLocaleString();
    chip2.title = cachedAccount.poisoned ? 'Poisoned! Click to cure' : 'Click to open Fishing';
    chip2.onclick = async function(){
      if (cachedAccount.poisoned){
        if (confirm("You're poisoned and losing 10 coins/min. Cure for 100 coins?")){
          var r = await sb.rpc('cure_poison');
          if (r.error) window.toast("Could not cure", r.error.message, "err");
          else { window.toast("Cured", "You feel better.", "ok"); await refreshAccount(); }
        }
      } else {
        if (window.openFishing) window.openFishing();
      }
    };
    bar.appendChild(chip2);
  }

  // Re-paint on every user bar render
  var origRenderUserBar = window.renderUserBar;
  if (typeof origRenderUserBar === 'function'){
    window.renderUserBar = function(){
      var r = origRenderUserBar.apply(this, arguments);
      setTimeout(paintCoinChip, 10);
      return r;
    };
  }
  // Also poll periodically (safe and light)
  setInterval(refreshAccount, 15000);

  // ------------------------------------------------------------
  // 3. BADGE STRIP IN PROFILE
  // ------------------------------------------------------------
  async function loadBadgesFor(uid){
    var r = await sb.from('user_badges').select('badge_id').eq('user_id', uid);
    return (r.data || []).map(function(x){ return x.badge_id; });
  }

  var BADGE_DEFS = {
    first_catch:  { emoji:'🎣', name:'First Catch' },
    catch_10:     { emoji:'🐟', name:'Getting Started' },
    catch_50:     { emoji:'🎏', name:'Avid Angler' },
    catch_100:    { emoji:'🏆', name:'Master Angler' },
    legendary_1:  { emoji:'⭐', name:'Legend Hunter' },
    legendary_5:  { emoji:'🌟', name:'Legend Master' },
    puffer_1:     { emoji:'☠️', name:'Poisoned' },
    puffer_5:     { emoji:'💀', name:'Cursed' },
    rich_1000:    { emoji:'💰', name:'Thousandaire' },
    rich_10000:   { emoji:'💎', name:'Ten Thousand' },
  };

  var origOpenProfile = window.openProfile;
  if (typeof origOpenProfile === 'function'){
    window.openProfile = function(uid){
      origOpenProfile.apply(this, arguments);
      setTimeout(async function(){
        var body = document.getElementById('modal-body');
        if (!body) return;
        if (body.querySelector('.badge-rail')) return;
        var card = body.querySelector('.profile-card') || body;
        // Fetch their badges + account
        var badges = await loadBadgesFor(uid);
        var accR = await sb.from('bank_accounts').select('*').eq('user_id', uid).maybeSingle();
        var acc = accR.data;

        var strip = document.createElement('div');
        strip.className = 'badge-rail';
        var html = '';

        if (acc){
          html += '<span class="badge-chip" style="background:linear-gradient(135deg,rgba(255,200,87,.22),rgba(255,159,28,.14));color:#ffd166">🪙 ' + acc.balance.toLocaleString() + '</span>';
        }
        badges.forEach(function(b){
          var d = BADGE_DEFS[b];
          if (!d) return;
          html += '<span class="badge-chip">' + d.emoji + ' ' + esc(d.name) + '</span>';
        });
        if (!html){
          html = '<span style="font-size:11.5px;color:var(--text3)">No badges yet.</span>';
        }
        strip.innerHTML = html;
        card.appendChild(strip);
      }, 350);
    };
  }

  // ------------------------------------------------------------
  // 4. BANK MESSAGE STYLING
  // ------------------------------------------------------------
  var origMessageHTML = window.messageHTML;
  if (typeof origMessageHTML === 'function'){
    window.messageHTML = function(m, grouped){
      var html = origMessageHTML.apply(this, arguments);
      // Only touch bank messages
      if (m.sender_id !== BANK_ID) return html;
      // Wrap in a class
      html = html.replace('class="msg"', 'class="msg bank-msg"');
      // Author color
      html = html.replace(/(<span class="author"[^>]*>)/, function(open){
        if (open.indexOf('bank-author') >= 0) return open;
        return open.replace('class="author', 'class="author bank-author');
      });
      // Add quick action buttons under the message
      var actions = '<div class="bank-actions">' +
        '<button data-bank-quick="balance">💰 Balance</button>' +
        '<button data-bank-quick="fish" class="primary">🎣 Fish</button>' +
        '<button data-bank-quick="badges">🏅 Badges</button>' +
        '<button data-bank-quick="leaderboard">🏆 Top</button>' +
        '<button data-bank-quick="help">❓ Help</button>' +
      '</div>';
      // Insert actions right before the closing body div
      html = html.replace('</div><div class="toolbar">', actions + '</div><div class="toolbar">');
      return html;
    };
  }

  // Handle quick action clicks in bank messages
  document.addEventListener('click', async function(e){
    var btn = e.target.closest('[data-bank-quick]');
    if (!btn) return;
    e.preventDefault(); e.stopPropagation();
    var action = btn.dataset.bankQuick;
    // Find the conversation id from the DOM
    var msgEl = btn.closest('[data-msg]');
    var convId = window.CURRENT && window.CURRENT.conv ? window.CURRENT.conv.id : null;
    if (!convId) return;

    // Send the action as if the user typed it
    try {
      await sb.from('messages').insert({
        conversation_id: convId,
        sender_id: window.ME.id,
        content: action
      });
    } catch(err){ log("send failed:", err.message); }
  }, true);

  // ------------------------------------------------------------
  // 5. BOOT
  // ------------------------------------------------------------
  setTimeout(async function(){
    if (!window.ME) return;
    await seedSeen();
    await refreshAccount();
    setInterval(pollBankIncoming, 3000);
    log("bank bot online");
  }, 4000);

  log("bank theme ready");
})();
</script>

<!-- SLEEPY_HIDDEN_PUFFER_V1 -->
<script>
(function(){
  "use strict";
  if (window.__sleepyHiddenPuffer) return;
  window.__sleepyHiddenPuffer = true;
  function log(){ try{console.log.apply(console,["[Puffer]"].concat([].slice.call(arguments)));}catch(e){} }

  // ============================================================
  // HIDDEN MECHANIC
  // ------------------------------------------------------------
  // After 10 consecutive non-puffer catches, the next catch is
  // forced to be a pufferfish. Then the counter resets.
  //
  // Nothing in the UI shows this. The player just experiences it
  // as bad luck. The puffer still poisons them normally.
  // ============================================================

  var THRESHOLD = 10;
  var PUFFER = {
    fish_name:  'Pufferfish',
    fish_emoji: '🐡',
    fish_tier:  'puffer',
    fish_value: 0
  };

  // Count non-puffer catches since the last puffer.
  async function countSinceLastPuffer(){
    if (!window.ME) return 0;
    try {
      // Fetch the most recent 20 catches (enough to cover the threshold)
      var r = await sb.from('fishing_catches')
        .select('fish_tier, caught_at')
        .eq('user_id', window.ME.id)
        .order('caught_at', { ascending: false })
        .limit(20);

      var rows = r.data || [];
      // Find the most recent puffer
      var pufferAt = -1;
      for (var i = 0; i < rows.length; i++){
        if (rows[i].fish_tier === 'puffer'){ pufferAt = i; break; }
      }
      // Count is everything more recent than that puffer (or all catches if never puffed)
      if (pufferAt < 0){
        // No puffer in recent history: count how many we fetched
        // But if they have 20+ catches with no puffer, they're already overdue
        return rows.length;
      }
      return pufferAt; // items at index 0..pufferAt-1 are non-puffer catches AFTER the puffer
    } catch(e){
      log("count failed:", e.message);
      return 0;
    }
  }

  // ============================================================
  // Intercept sb.rpc('record_catch') and silently swap the fish
  // ============================================================
  // The fishing game calls sb.rpc('record_catch', params) after
  // rolling the fish. We hook in, check the cycle, and if the
  // threshold is reached, replace the params before the server
  // ever sees them.

  var origRpc = sb.rpc.bind(sb);
  var lastForcedAt = 0;   // guard against double-swaps

  sb.rpc = async function(fn, params, options){
    if (fn === 'record_catch' && params){
      // Don't swap if the roll already came up puffer (random puffer)
      var alreadyPuffer = params.fish_name === 'Pufferfish';

      if (!alreadyPuffer){
        var count = await countSinceLastPuffer();

        // Debounce: if we just forced one, don't force again immediately
        var sinceLastForce = Date.now() - lastForcedAt;
        if (count >= THRESHOLD && sinceLastForce > 3000){
          log("forcing puffer after", count, "non-puffer catches");
          lastForcedAt = Date.now();
          params = Object.assign({}, PUFFER);
        }
      }
    }
    return origRpc(fn, params, options);
  };

  log("hidden puffer cycle active");
})();
</script>
