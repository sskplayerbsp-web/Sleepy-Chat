.cast-streak .dot.miss{background:var(--rose)}

/* More shop items */
.shop-cat{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin:16px 0 8px;padding:0 4px;font-family:'JetBrains Mono',monospace}
</style>
<script>
(function(){
  "use strict";
  if (window.__sleepyGameRoomV2) return;
  window.__sleepyGameRoomV2 = true;
  function log(){ try{console.log.apply(console,["[GR2]"].concat([].slice.call(arguments)));}catch(e){} }
  function esc(s){ return window.esc(s); }

  var BANK_ID = '00000000-0000-0000-0000-0000000000ba';

  // ============================================================
  // 1. COSMETICS CACHE
  // ============================================================
  window.__cosmetics = {};   // uid -> { name_color, title, profile_frame, badges: [] }
  window.__catchStreak = []; // recent timing result: 'perfect'|'great'|'ok'|'miss'

  async function loadCosmetics(){
    try {
      var eq = await sb.from('shop_equipped').select('*');
      var byUser = {};
      (eq.data || []).forEach(function(x){
        byUser[x.user_id] = byUser[x.user_id] || {};
        byUser[x.user_id].name_color = x.name_color;
        byUser[x.user_id].title = x.title;
        byUser[x.user_id].profile_frame = x.profile_frame;
      });
      var bg = await sb.from('user_badges').select('user_id, badge_id');
      (bg.data || []).forEach(function(x){
        byUser[x.user_id] = byUser[x.user_id] || {};
        byUser[x.user_id].badges = byUser[x.user_id].badges || [];
        byUser[x.user_id].badges.push(x.badge_id);
      });
      window.__cosmetics = byUser;
    } catch(e){ log("cosmetics load failed:", e.message); }
  }

  var BADGE_RARITY = {
    rich_10000:   { e:'💎', c:'legendary', name:'Ten Thousand' },
    legendary_5:  { e:'🌟', c:'legendary', name:'Legend Master' },
    legendary_1:  { e:'⭐', c:'gold',      name:'Legend Hunter' },
    rich_1000:    { e:'💰', c:'gold',      name:'Thousandaire' },
    catch_100:    { e:'🏆', c:'gold',      name:'Master Angler' },
    puffer_5:     { e:'💀', c:'gold',      name:'Cursed' },
    catch_50:     { e:'🎏', c:'common',    name:'Avid Angler' },
    puffer_1:     { e:'☠️', c:'common',    name:'Poisoned' },
    catch_10:     { e:'🐟', c:'common',    name:'Getting Started' },
    first_catch:  { e:'🎣', c:'common',    name:'First Catch' },
  };

  function badgesFor(uid){
    var c = window.__cosmetics[uid];
    if (!c || !c.badges) return [];
    var order = ['legendary','gold','common'];
    return c.badges
      .map(function(b){ return BADGE_RARITY[b] ? { id:b, ...BADGE_RARITY[b] } : null; })
      .filter(Boolean)
      .sort(function(a,b){ return order.indexOf(a.c) - order.indexOf(b.c); })
      .slice(0, 4);
  }
  function titleFor(uid){
    var c = window.__cosmetics[uid];
    if (!c || !c.title) return null;
    return { title_angler:'Angler', title_champion:'Champion', title_legend:'Legend' }[c.title] || null;
  }
  function frameFor(uid){
    var c = window.__cosmetics[uid];
    if (!c) return null;
    if (c.profile_frame === 'frame_gold') return 'frame_gold';
    if (c.profile_frame === 'frame_glow') return 'frame_glow';
    return null;
  }
  function nameColorClass(uid){
    var c = window.__cosmetics[uid];
    if (!c || !c.name_color) return '';
    return {
      name_color_gold:'nc-gold', name_color_rose:'nc-rose',
      name_color_teal:'nc-teal', name_color_rainbow:'nc-rainbow'
    }[c.name_color] || '';
  }

  // ============================================================
  // 2. MESSAGE HTML — inject badges, titles, frames
  // ============================================================
  var origMessageHTML = window.messageHTML;
  if (typeof origMessageHTML === 'function'){
    window.messageHTML = function(m, grouped){
      var html = origMessageHTML.apply(this, arguments);
      if (m.deleted) return html;

      var uid = m.sender_id;
      var frame = frameFor(uid);

      // Wrap avatar with frame
      if (frame && !grouped){
        html = html.replace(
          /(<div style="position:relative">)(.*?)(<\/div>)/,
          function(all, open, inner, close){
            if (inner.indexOf('avatar-frame-wrap') >= 0) return all;
            return open.replace('position:relative',
              'position:relative;display:inline-flex;padding:3px;border-radius:50%;' +
              (frame === 'frame_gold'
                ? 'box-shadow:0 0 0 2px rgba(255,200,87,.85),0 0 14px rgba(255,200,87,.5);'
                : 'box-shadow:0 0 0 2px rgba(94,231,215,.85),0 0 20px rgba(94,231,215,.6);animation:frameGlow 2.4s ease-in-out infinite;')
            ) + inner + close;
          }
        );
      }

      // Add badges + title to the author line
      var badges = badgesFor(uid);
      var title = titleFor(uid);
      if (badges.length || title){
        var injected = '';
        if (title) injected += '<span class="chat-title">' + esc(title) + '</span>';
        if (badges.length){
          injected += '<span class="chat-badges">' +
            badges.map(function(b){
              return '<span class="cb ' + b.c + '" title="' + esc(b.name) + '">' + b.e + '</span>';
            }).join('') +
          '</span>';
        }
        // Insert after </span> closing the author, before the uid span
        html = html.replace(
          /(<span class="author[^"]*"[^>]*>.*?<\/span>)(\s*<span class="uid">)/,
          function(all, authorClose, uidOpen){
            return authorClose + injected + uidOpen;
          }
        );
      }

      // Apply name color class
      var nc = nameColorClass(uid);
      if (nc){
        html = html.replace('<span class="author"', '<span class="author ' + nc + '"');
        // remove inline role-color style so name color wins
        html = html.replace(/(<span class="author[^"]*")\s+style="[^"]*"/, '$1');
      }

      return html;
    };
  }

  // ============================================================
  // 3. GAME ROOM — move fishing in, distinct visual
  // ============================================================
  var ACTIVE_TAB = 'play'; // 'play' | 'shop' | 'fishing'

  function setGameRoomMode(on){
    document.body.classList.toggle('in-game-room', !!on);
  }

  // Which "game room" tab is currently rendered
  function isGameRoom(){ return window.CURRENT && window.CURRENT.type === 'games'; }
  function isFishing(){ return window.CURRENT && window.CURRENT.type === 'fishing'; }

  // When in games/fishing, replace the panel with the game nav
  function renderGamePanel(){
    var body = document.getElementById('panel-body');
    if (!body) return;
    var on = isGameRoom() || isFishing();
    if (!on) return;
    // Save the DM list DOM so we can restore it later
    if (!window.__savedPanelHTML && body.innerHTML && !body.querySelector('.game-nav')){
      window.__savedPanelHTML = body.innerHTML;
    }

    var head = document.getElementById('panel-head');
    if (head) head.innerHTML = '<div class="ttl">🎮 Game Room</div>';

    var tabs = [
      { id:'play',    e:'🎮', l:'Play',    s:'Tic-Tac-Toe matches' },
      { id:'fishing', e:'🎣', l:'Fishing', s:'Cast & earn coins' },
      { id:'shop',    e:'🛒', l:'Shop',    s:'Spend your coins' }
    ];
    var current = isFishing() ? 'fishing' : ACTIVE_TAB;

    var html = '<div class="game-nav">';
    html += '<h3>Games</h3>';
    tabs.forEach(function(t){
      var active = current === t.id ? ' active' : '';
      html += '<button class="gbtn' + active + '" data-gtab="' + t.id + '">' +
        '<span class="emoji">' + t.e + '</span>' +
        '<span class="lbl">' + t.l + '<span class="sub">' + t.s + '</span></span>' +
      '</button>';
    });
    html += '</div>';
    body.innerHTML = html;

    body.querySelectorAll('[data-gtab]').forEach(function(b){
      b.onclick = function(){
        var t = b.dataset.gtab;
        if (t === 'fishing'){
          if (typeof window.openFishing === 'function') window.openFishing();
        } else {
          ACTIVE_TAB = t;
          if (!isGameRoom()){
            if (typeof window.openGames === 'function') window.openGames();
          } else {
            if (typeof window.renderGames === 'function') window.renderGames();
          }
        }
        setTimeout(renderGamePanel, 10);
      };
    });
  }

  // Restore panel when leaving game room
  function restorePanelIfNeeded(){
    var on = isGameRoom() || isFishing();
    if (on){ setGameRoomMode(true); return; }
    setGameRoomMode(false);
    var body = document.getElementById('panel-body');
    if (body && window.__savedPanelHTML){
      // Only restore if we're showing the game nav
      if (body.querySelector('.game-nav')){
        body.innerHTML = window.__savedPanelHTML;
        window.__savedPanelHTML = null;
        if (typeof window.renderPanel === 'function') window.renderPanel();
      }
    }
  }

  // Wrap renderPanel to inject the game nav when needed
  var origRenderPanel = window.renderPanel;
  if (typeof origRenderPanel === 'function'){
    window.renderPanel = function(){
      var r = origRenderPanel.apply(this, arguments);
      setTimeout(function(){
        if (isGameRoom() || isFishing()){
          renderGamePanel();
          setGameRoomMode(true);
        } else {
          restorePanelIfNeeded();
        }
      }, 15);
      return r;
    };
  }

  // Also hook renderChatHead for the fishing page header restyle
  var origRenderChatHead = window.renderChatHead;
  if (typeof origRenderChatHead === 'function'){
    window.renderChatHead = function(){
      var r = origRenderChatHead.apply(this, arguments);
      if (isFishing()){
        var el = document.getElementById('chat-head');
        if (el && !el.querySelector('.title .txt').textContent.match(/Fishing/i)){
          // Let the fishing patch handle it
        }
      }
      setTimeout(function(){
        if (isGameRoom() || isFishing()){
          setGameRoomMode(true);
          renderGamePanel();
        } else {
          setGameRoomMode(false);
        }
      }, 10);
      return r;
    };
  }

  // ============================================================
  // 4. FISHING MINIGAME — timing bar
  // ============================================================
  // The fishing patch has its own castLine. We override it here to
  // add the timing minigame: cast → wait for bite → click to hook →
  // click in the green zone for the best result.

  var fishingState = {
    phase: 'idle',  // idle | casting | waiting | bite | timing | result
    castAt: 0,
    biteAt: 0,
    timingStart: 0,
    timingRAF: null,
    timingPos: 0,
    direction: 1,
    timingWindow: 3000,  // ms for the marker to travel across
    resultQuality: null, // perfect | great | ok | miss
    pendingRoll: null
  };

  function stopTiming(){
    if (fishingState.timingRAF){
      cancelAnimationFrame(fishingState.timingRAF);
      fishingState.timingRAF = null;
    }
  }

  async function doFishCast(){
    if (fishingState.phase !== 'idle') return;
    if (!window.ME) return;
    // Need bank account
    try {
      var r = await sb.from('bank_accounts').select('*').eq('user_id', window.ME.id).maybeSingle();
      if (!r.data){
        await sb.from('bank_accounts').insert({ user_id: window.ME.id, balance: 100 });
      } else if (r.data.poisoned){
        window.toast("You're poisoned", "Cure yourself before fishing.", "err");
        return;
      }
    } catch(e){}

    fishingState.phase = 'casting';
    fishingState.castAt = Date.now();
    renderFishingScene();

    // Wait, then a bite comes at a random time
    var wait = 1200 + Math.random() * 2600;
    setTimeout(function(){
      if (fishingState.phase !== 'casting') return;
      fishingState.phase = 'bite';
      fishingState.biteAt = Date.now();
      renderFishingScene();
      if (navigator.vibrate) try { navigator.vibrate(60); } catch(e){}

      // If user doesn't click within 1.5s, miss
      setTimeout(function(){
        if (fishingState.phase === 'bite'){
          finishCast('miss');
        }
      }, 1500);
    }, wait);
  }

  function startTiming(){
    fishingState.phase = 'timing';
    fishingState.timingStart = Date.now();
    fishingState.timingPos = 0;
    fishingState.direction = 1;
    renderFishingScene();

    var update = function(){
      var elapsed = Date.now() - fishingState.timingStart;
      // Marker goes 0 -> 100 in `timingWindow` ms, then bounces
      var t = (elapsed % (fishingState.timingWindow * 2)) / fishingState.timingWindow;
      fishingState.timingPos = t <= 1 ? t * 100 : (2 - t) * 100;
      var el = document.getElementById('timing-mark');
      if (el) el.style.left = 'calc(' + fishingState.timingPos + '% - 2px)';
      fishingState.timingRAF = requestAnimationFrame(update);
    };
    update();
  }

  function hookTimingClick(){
    if (fishingState.phase !== 'timing') return;
    var pos = fishingState.timingPos;
    stopTiming();

    // Zones:
    // 0-20 or 80-100: perfect | 20-30 or 70-80: great | 30-45 or 55-70: ok | 45-55: perfect | else: miss
    // Simplify with distance from center (50)
    var d = Math.abs(pos - 50);
    var quality;
    if (d <= 6) quality = 'perfect';
    else if (d <= 14) quality = 'great';
    else if (d <= 28) quality = 'ok';
    else quality = 'miss';

    finishCast(quality);
  }

  async function finishCast(quality){
    fishingState.phase = 'result';
    fishingState.resultQuality = quality;
    window.__catchStreak.unshift(quality);
    window.__catchStreak = window.__catchStreak.slice(0, 10);

    if (quality === 'miss'){
      setTimeout(function(){
        fishingState.phase = 'idle';
        renderFishingScene();
      }, 1800);
      window.toast("Missed!", "The fish got away.", "err");
      renderFishingScene();
      return;
    }

    // Roll a fish
    var FISH = [
      { name:'Minnow',         emoji:'🐟', tier:'common',    value:10,   weight:25 },
      { name:'Sardine',        emoji:'🐟', tier:'common',    value:15,   weight:20 },
      { name:'Bass',           emoji:'🐟', tier:'common',    value:25,   weight:15 },
      { name:'Trout',          emoji:'🐟', tier:'uncommon',  value:50,   weight:10 },
      { name:'Salmon',         emoji:'🐠', tier:'uncommon',  value:75,   weight:8 },
      { name:'Tuna',           emoji:'🐟', tier:'uncommon',  value:100,  weight:7 },
      { name:'Clownfish',      emoji:'🐠', tier:'rare',      value:150,  weight:4 },
      { name:'Swordfish',      emoji:'🐟', tier:'rare',      value:250,  weight:3 },
      { name:'Golden Koi',     emoji:'🐠', tier:'legendary', value:500,  weight:1 },
      { name:'Mythic Arowana', emoji:'🐉', tier:'legendary', value:1000, weight:0.5 },
      { name:'Pufferfish',     emoji:'🐡', tier:'puffer',    value:0,    weight:6.5 }
    ];
    var total = FISH.reduce(function(s,f){ return s + f.weight; }, 0);
    var r = Math.random() * total;
    var acc = 0;
    var caught = FISH[0];
    for (var i = 0; i < FISH.length; i++){
      acc += FISH[i].weight;
      if (r < acc){ caught = FISH[i]; break; }
    }

    // Apply quality multiplier (except for puffer, which stays puffer)
    var mult = quality === 'perfect' ? 2 : quality === 'great' ? 1.5 : 1;

    try {
      // Check hidden puffer cycle
      var pr = await sb.from('fishing_catches')
        .select('fish_tier').eq('user_id', window.ME.id)
        .order('caught_at', { ascending: false }).limit(20);
      var rows = pr.data || [];
      var lastPuffIdx = -1;
      for (var j = 0; j < rows.length; j++) if (rows[j].fish_tier === 'puffer'){ lastPuffIdx = j; break; }
      var nonPuff = lastPuffIdx < 0 ? rows.length : lastPuffIdx;
      if (nonPuff >= 10 && caught.tier !== 'puffer'){
        caught = { name:'Pufferfish', emoji:'🐡', tier:'puffer', value:0 };
      }

      var rec = await sb.rpc('record_catch', {
        fish_name:  caught.name,
        fish_emoji: caught.emoji,
        fish_tier:  caught.tier,
        fish_value: Math.round(caught.value * mult)
      });
      if (rec.error) throw rec.error;

      // Reload account
      var ar = await sb.from('bank_accounts').select('*').eq('user_id', window.ME.id).maybeSingle();
      window.__myAccount = ar.data;

      renderFishingScene(caught, quality, mult);
      setTimeout(function(){
        fishingState.phase = 'idle';
        renderFishingScene();
      }, 3000);
    } catch(e){
      log("catch save failed:", e.message);
      window.toast("Error", e.message || String(e), "err");
      fishingState.phase = 'idle';
      renderFishingScene();
    }
  }

  function renderFishingScene(caught, quality, mult){
    var body = document.getElementById('chat-body');
    if (!body) return;
    var phase = fishingState.phase;

    var acc = window.__myAccount || { balance: 0, poisoned: false };

    var stageHTML = '<div class="fish-cast-stage">';
    // Swimmers always present
    stageHTML += '<div class="cast-swimmer">🐟</div>' +
                 '<div class="cast-swimmer">🐠</div>' +
                 '<div class="cast-swimmer">🐟</div>' +
                 '<div class="cast-swimmer">🐡</div>';
    if (phase === 'casting'){
      stageHTML += '<div class="cast-state-overlay">' +
        '<div class="msg">Casting...</div>' +
        '<div class="hint">Wait for a bite...</div>' +
      '</div>';
    } else if (phase === 'bite'){
      stageHTML += '<div class="cast-state-overlay" id="bite-overlay" style="cursor:pointer">' +
        '<div class="bite">❗</div>' +
        '<div class="msg">CLICK NOW!</div>' +
        '<div class="hint">Hook the fish before it escapes</div>' +
      '</div>';
    } else if (phase === 'timing'){
      stageHTML += '<div class="cast-state-overlay">' +
        '<div class="msg">Reel it in!</div>' +
        '<div class="hint">Click when the marker is in the center zone</div>' +
      '</div>';
    }
    stageHTML += '</div>';

    var h = '<div class="fish-wrap">';

    h += '<div class="fish-head">' +
      '<div class="ico">🎣</div>' +
      '<h2>Fishing</h2>' +
      '<div class="sub">Cast, hook, and reel — timing matters</div>' +
    '</div>';

    h += '<div class="bank-balance">' +
      '<div class="amt"><span class="coin">🪙</span>' + (acc.balance || 0).toLocaleString() + '</div>' +
      '<div class="lbl">Your Balance</div>' +
    '</div>';

    if (acc.poisoned){
      h += '<div class="poison-bar">' +
        '<div class="icon">🐡</div>' +
        '<div class="info"><div class="t">POISONED</div>' +
          '<div class="d">-10 coins/min</div></div>' +
        '<button id="fish-cure2">Cure -100</button>' +
      '</div>';
    }

    h += stageHTML;

    // Timing bar
    if (phase === 'timing'){
      h += '<div class="timing-wrap">' +
        '<div class="timing-bar">' +
          '<div class="timing-mark" id="timing-mark" style="left:0"></div>' +
        '</div>' +
        '<div class="timing-labels">' +
          '<span>Miss</span><span>OK</span><span><b>PERFECT</b></span><span>OK</span><span>Miss</span>' +
        '</div>' +
      '</div>';
      // Restart animation
      setTimeout(startTiming, 0);
    }

    // Result overlay
    if (phase === 'result' && caught){
      var q = quality || 'ok';
      var qLabel = { perfect:'🌟 PERFECT!', great:'✨ Great!', ok:'👍 Nice', miss:'💨 Missed' }[q];
      var qCls = q;
      var rarityCls = caught.tier === 'legendary' ? 'rarity-legendary' : caught.tier === 'rare' ? 'rarity-rare' : '';
      h += '<div class="catch-result">' +
        '<div class="catch-card ' + rarityCls + '">' +
          '<div class="emoji">' + caught.emoji + '</div>' +
          '<div class="name">' + esc(caught.name) + '</div>' +
          '<div class="tier ' + caught.tier + '">' + esc(caught.tier === 'puffer' ? 'HAZARD' : caught.tier) + '</div>' +
          (caught.tier !== 'puffer'
            ? '<div class="value">+' + Math.round(caught.value * (mult || 1)) + ' 🪙' + (mult > 1 ? ' (x' + mult + ')' : '') + '</div>'
            : '<div class="value bad">+ POISON</div>') +
          '<div class="timing-hit ' + qCls + '" style="margin-top:14px">' + qLabel + '</div>' +
        '</div>' +
      '</div>';
    }

    // Cast button (only when idle)
    if (phase === 'idle'){
      h += '<button class="cast-btn" id="fish-cast2">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20 12 12M12 12l8-8M12 12H4M12 12v8"/></svg>' +
        (acc.poisoned ? 'Cure first' : 'Cast Line') +
      '</button>';
    }

    // Streak
    if (window.__catchStreak.length){
      h += '<div class="cast-streak">' +
        window.__catchStreak.map(function(q){
          return '<span class="dot ' + q + '"></span>';
        }).join('') +
      '</div>';
    }

    h += '<div style="text-align:center;margin-top:20px;font-size:11.5px;color:var(--text3);line-height:1.6">' +
      'Perfect timing = <b style="color:var(--gold)">2x coins</b> · ' +
      'Great = <b style="color:var(--green)">1.5x</b> · ' +
      'Miss = no catch' +
    '</div>';

    h += '</div>';
    body.innerHTML = h;

    var castBtn = document.getElementById('fish-cast2');
    if (castBtn && phase === 'idle') castBtn.onclick = doFishCast;

    var bite = document.getElementById('bite-overlay');
    if (bite) bite.onclick = function(){
      if (fishingState.phase === 'bite'){
        startTiming();
      }
    };

    var stage = document.querySelector('.fish-cast-stage');
    if (stage && (phase === 'timing')){
      stage.style.cursor = 'pointer';
      stage.onclick = hookTimingClick;
    }

    var cure = document.getElementById('fish-cure2');
    if (cure) cure.onclick = async function(){
      try {
        var r = await sb.rpc('cure_poison');
        if (r.error) throw r.error;
        var ar = await sb.from('bank_accounts').select('*').eq('user_id', window.ME.id).maybeSingle();
        window.__myAccount = ar.data;
        renderFishingScene();
        window.toast("Cured", "You're healthy again.", "ok");
      } catch(e){ window.toast("Error", e.message || String(e), "err"); }
    };
  }

  // Override the fishing open
  var origOpenFishing = window.openFishing;
  if (typeof origOpenFishing === 'function'){
    window.openFishing = async function(){
      window.CURRENT = { type: 'fishing', server: null, channel: null, conv: null, ticket: null };
      // Load account
      try {
        var r = await sb.from('bank_accounts').select('*').eq('user_id', window.ME.id).maybeSingle();
        if (!r.data){
          var ins = await sb.from('bank_accounts').insert({ user_id: window.ME.id, balance: 100 }).select().single();
          window.__myAccount = ins.data;
        } else {
          window.__myAccount = r.data;
        }
      } catch(e){}
      fishingState.phase = 'idle';
      setGameRoomMode(true);
      window.renderChatHead();
      renderFishingScene();
      setTimeout(renderGamePanel, 30);
    };
  }

  // ============================================================
  // 5. HOOK GAME ROOM OPEN to close overrides from the game room patch
  // ============================================================
  var origOpenGames = window.openGames;
  if (typeof origOpenGames === 'function'){
    window.openGames = async function(){
      setGameRoomMode(true);
      var r = await origOpenGames.apply(this, arguments);
      setTimeout(renderGamePanel, 20);
      return r;
    };
  }

  // ============================================================
  // 6. BOOT
  // ============================================================
  setTimeout(async function(){
    if (!window.ME) return;
    await loadCosmetics();
    // Reload periodically
    setInterval(loadCosmetics, 30000);
    log("game room v2 online");
  }, 5000);

  // ============================================================
  // 7. More shop items (added via existing shop system)
  // ============================================================
  // We can't add new shop item types easily without an SQL change.
  // But we CAN add new affordable items using the existing
  // name_color/title/frame categories. The patch author for the
  // shop patch is SQL-based; we suggest them via toast on first
  // open, but adding new item types requires an SQL update which
  // the user runs separately (documented in the message).

  log("game room v2 ready");
})();
</script>

<!-- SLEEPY_FIX_JOIN_GAME_V1 -->
<script>
(function(){
  "use strict";
  if (window.__sleepyFixJoinGame) return;
  window.__sleepyFixJoinGame = true;
  function log(){ try{console.log.apply(console,["[JoinFix]"].concat([].slice.call(arguments)));}catch(e){} }
  function esc(s){ return window.esc(s); }

  var FOCUS_GAME_ID = null;
  var FOCUS_GAME = null;
  var MY_GAMES_CACHE = [];
  var LOBBY_CACHE = [];
  var LAST_ACCOUNT = null;

  // ------------------------------------------------------------
  // Replace the rail button's handler with our own
  // ------------------------------------------------------------
  function wireRailButton(){
    var btn = document.querySelector('.rail-btn.games-btn');
    if (!btn) return;
    if (btn.__sleepyWired) return;
    btn.__sleepyWired = true;
    btn.onclick = openGameRoomFixed;
    log("rail button rewired");
  }

  async function openGameRoomFixed(){
    window.CURRENT = { type: 'games', server: null, channel: null, conv: null, ticket: null };
    FOCUS_GAME_ID = null;
    FOCUS_GAME = null;
    await refreshAll();
    window.renderChatHead && window.renderChatHead();
    renderFixed();
  }
  window.openGameRoomFixed = openGameRoomFixed;

  // ------------------------------------------------------------
  // Data
  // ------------------------------------------------------------
  async function refreshAll(){
    await refreshAccount();
    await Promise.all([refreshLobby(), refreshMyGames()]);
  }
  async function refreshAccount(){
    if (!window.ME) return;
    var r = await sb.from('bank_accounts').select('*').eq('user_id', window.ME.id).maybeSingle();
    if (!r.data){
      var ins = await sb.from('bank_accounts').insert({ user_id: window.ME.id, balance: 100 }).select().single();
      LAST_ACCOUNT = ins.data;
    } else {
      LAST_ACCOUNT = r.data;
    }
  }
  async function refreshLobby(){
    var r = await sb.from('game_challenges').select('*').eq('status', 'open')
      .order('created_at', { ascending: false }).limit(30);
    LOBBY_CACHE = r.data || [];
    var ids = LOBBY_CACHE.map(function(x){ return x.creator_id; });
    if (ids.length) await window.fetchProfiles(ids);
  }
  async function refreshMyGames(){
    var r = await sb.from('game_challenges').select('*')
      .or('creator_id.eq.' + window.ME.id + ',opponent_id.eq.' + window.ME.id)
      .order('created_at', { ascending: false }).limit(30);
    MY_GAMES_CACHE = r.data || [];
    var ids = [];
    MY_GAMES_CACHE.forEach(function(g){
      ids.push(g.creator_id);
      if (g.opponent_id) ids.push(g.opponent_id);
    });
    if (ids.length) await window.fetchProfiles(ids);
  }
  async function fetchOneGame(id){
    var r = await sb.from('game_challenges').select('*').eq('id', id).maybeSingle();
    return r.data;
  }

  // ------------------------------------------------------------
  // Render
  // ------------------------------------------------------------
  function renderFixed(){
    var body = document.getElementById('chat-body');
    if (!body) return;
    if (FOCUS_GAME) {
      renderBoard(FOCUS_GAME);
      return;
    }
    var bal = LAST_ACCOUNT ? LAST_ACCOUNT.balance : 0;

    var html = '<div class="games-wrap">';
    html += '<div class="games-head">' +
      '<div class="ico">🎮</div>' +
      '<h2>Game Room</h2>' +
      '<div class="sub">Play against other Sleepers. Winner takes the pot.</div>' +
      '<div class="bal">🪙 ' + bal.toLocaleString() + '</div>' +
    '</div>';

    // ACTIVE GAMES — most important section
    var inProgress = MY_GAMES_CACHE.filter(function(g){ return g.status === 'in_progress'; });
    if (inProgress.length){
      html += '<h3 style="font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--gold);margin:20px 0 10px">' +
        '⚡ Your active games — ' + inProgress.length + '</h3>';
      html += '<div class="challenge-list">';
      inProgress.forEach(function(g){
        var iAmCreator = g.creator_id === window.ME.id;
        var other = iAmCreator ? g.opponent_id : g.creator_id;
        var op = other ? window.PROFILES[other] : null;
        var myMark = iAmCreator ? 'X' : 'O';
        var turn = g.state && g.state.turn;
        var itsMyTurn = turn === myMark;
        html += '<div class="challenge-row" style="border-color:rgba(255,200,87,.55);background:rgba(255,200,87,.06)">' +
          '<div style="position:relative">' + (other ? window.avatarHTML(other, 38) : '<div class="avatar" style="width:38px;height:38px;background:var(--surface2)"></div>') + '</div>' +
          '<div class="info">' +
            '<div class="nm">' + (op ? esc(op.display_name || op.username) : 'Waiting...') + '</div>' +
            '<div class="meta">' +
              (itsMyTurn ? '<span style="color:var(--green);font-weight:700">● Your turn (' + myMark + ')</span>' : '<span style="color:var(--text3)">⏳ Their turn — you are ' + myMark + '</span>') +
            '</div>' +
          '</div>' +
          '<div class="bet">' + (g.bet_amount > 0 ? '🪙 ' + g.bet_amount : 'Free') + '</div>' +
          '<button class="accept" data-enter="' + g.id + '">Play</button>' +
        '</div>';
      });
      html += '</div>';
    }

    // Open challenges — mine first, then others
    var myOpen = LOBBY_CACHE.filter(function(c){ return c.creator_id === window.ME.id; });
    var othersOpen = LOBBY_CACHE.filter(function(c){ return c.creator_id !== window.ME.id; });

    html += '<h3 style="font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text3);margin:20px 0 10px">Open challenges</h3>';
    if (!myOpen.length && !othersOpen.length){
      html += '<div style="padding:20px;text-align:center;color:var(--text3);font-size:13px;border:1px dashed var(--border);border-radius:10px">No open challenges. Create one below!</div>';
    } else {
      html += '<div class="challenge-list">';
      myOpen.forEach(function(c){
        html += '<div class="challenge-row mine">' +
          '<div style="position:relative">' + window.avatarHTML(c.creator_id, 38) + '</div>' +
          '<div class="info"><div class="nm">You (waiting)</div>' +
            '<div class="meta">Waiting for an opponent...</div></div>' +
          '<div class="bet">' + (c.bet_amount > 0 ? '🪙 ' + c.bet_amount : 'Free') + '</div>' +
          '<button class="cancel" data-cancel="' + c.id + '">Cancel</button>' +
        '</div>';
      });
      othersOpen.forEach(function(c){
        var p = window.PROFILES[c.creator_id] || { username: 'user', display_name: 'User' };
        html += '<div class="challenge-row">' +
          '<div style="position:relative">' + window.avatarHTML(c.creator_id, 38) + '</div>' +
          '<div class="info"><div class="nm">' + esc(p.display_name || p.username) + '</div>' +
            '<div class="meta">Tic-Tac-Toe · ' + Math.floor((Date.now() - new Date(c.created_at).getTime()) / 60000) + 'm ago</div></div>' +
          '<div class="bet">' + (c.bet_amount > 0 ? '🪙 ' + c.bet_amount : 'Free') + '</div>' +
          '<button class="accept" data-accept="' + c.id + '">Accept</button>' +
        '</div>';
      });
      html += '</div>';
    }

    // Create challenge
    html += '<div class="new-challenge" style="margin-top:24px">' +
      '<h3>Create a Challenge · Tic-Tac-Toe</h3>' +
      '<div class="bet-picks" id="bet-picks">' +
        [0, 50, 100, 250, 500, 1000].map(function(v){
          return '<button data-bet="' + v + '"' + (v === 100 ? ' class="sel"' : '') + '>' + (v === 0 ? 'Free' : '🪙 ' + v) + '</button>';
        }).join('') +
      '</div>' +
      '<div class="custom-bet"><input id="custom-bet" type="number" min="0" max="100000" placeholder="Custom bet"></div>' +
      '<button class="go" id="create-challenge">Create Challenge</button>' +
    '</div>';

    // Recent
    var finished = MY_GAMES_CACHE.filter(function(g){ return g.status === 'finished'; }).slice(0, 8);
    if (finished.length){
      html += '<h3 style="font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text3);margin:24px 0 10px">Recent</h3>';
      html += '<div class="challenge-list">';
      finished.forEach(function(g){
        var iAmCreator = g.creator_id === window.ME.id;
        var other = iAmCreator ? g.opponent_id : g.creator_id;
        var op = other ? window.PROFILES[other] : null;
        var result, cls;
        if (!g.winner_id){ result = 'Draw'; cls = 'watch'; }
        else if (g.winner_id === window.ME.id){ result = 'Won'; cls = 'accept'; }
        else { result = 'Lost'; cls = 'cancel'; }
        html += '<div class="challenge-row">' +
          '<div style="position:relative">' + (other ? window.avatarHTML(other, 38) : '<div class="avatar" style="width:38px;height:38px;background:var(--surface2)"></div>') + '</div>' +
          '<div class="info"><div class="nm">' + (op ? esc(op.display_name || op.username) : 'Unknown') + '</div>' +
            '<div class="meta">' + new Date(g.finished_at || g.created_at).toLocaleString() + '</div></div>' +
          '<div class="bet">' + (g.bet_amount > 0 ? '🪙 ' + g.bet_amount : 'Free') + '</div>' +
          '<button class="' + cls + '" style="cursor:default">' + result + '</button>' +
        '</div>';
      });
      html += '</div>';
    }

    html += '</div>';
    body.innerHTML = html;
    wireLobby();
  }

  function renderBoard(g){
    var body = document.getElementById('chat-body');
    if (!body) return;
    var isCreator = g.creator_id === window.ME.id;
    var myMark = isCreator ? 'X' : 'O';
    var opId = isCreator ? g.opponent_id : g.creator_id;
    var op = opId ? (window.PROFILES[opId] || { username: 'user', display_name: 'User' }) : null;
    var me = window.PROFILES[window.ME.id];

    var board = (g.state && g.state.board) || ['','','','','','','','',''];
    var turn = g.state ? g.state.turn : 'X';
    var winning = (g.state && g.state.winning_line) || null;
    var isOver = g.status === 'finished';
    var myTurn = !isOver && turn === myMark;
    var iWon = g.winner_id === window.ME.id;
    var isDraw = isOver && !g.winner_id;

    var html = '<div class="board-wrap">';
    html += '<div class="board-players">' +
      '<div class="p"><span class="mark X">X</span> ' + esc(me.display_name || me.username) + (isCreator ? ' <span style="font-size:10px;color:var(--gold);margin-left:4px">(host)</span>' : '') + '</div>' +
      '<div class="p"><span class="mark O">O</span> ' + (op ? esc(op.display_name || op.username) : 'Waiting...') + (!isCreator ? ' <span style="font-size:10px;color:var(--gold);margin-left:4px">(host)</span>' : '') + '</div>' +
    '</div>';

    if (g.bet_amount > 0){
      html += '<div style="text-align:center;font-size:12px;color:var(--text3);margin-bottom:12px">Pot: <b style="color:var(--gold);font-family:monospace">🪙 ' + (g.bet_amount * 2) + '</b></div>';
    }

    if (isOver){
      if (isDraw) html += '<div class="board-result draw">🤝 Draw — bets refunded</div>';
      else if (iWon) html += '<div class="board-result win">🏆 You won!' + (g.bet_amount > 0 ? ' +' + (g.bet_amount * 2) + ' 🪙' : '') + '</div>';
      else html += '<div class="board-result lose">😔 You lost' + (g.bet_amount > 0 ? ' -' + g.bet_amount + ' 🪙' : '') + '</div>';
    } else {
      html += '<div class="board-turn ' + (myTurn ? 'mine' : 'theirs') + '">' +
        (myTurn ? '🎯 Your turn — you are ' + myMark : '⏳ Waiting for ' + (op ? esc(op.display_name || op.username) : 'opponent')) +
      '</div>';
    }

    html += '<div class="ttt">';
    for (var i = 0; i < 9; i++){
      var v = board[i] || '';
      var cls = 'ttt-cell';
      if (v) cls += ' taken ' + v;
      if (winning && winning.indexOf(i) >= 0) cls += ' win';
      html += '<div class="' + cls + '" data-cell="' + i + '">' + esc(v) + '</div>';
    }
    html += '</div>';

    html += '<div style="margin-top:16px;text-align:center">' +
      '<button class="btn" id="board-back">← Back to lobby</button>' +
    '</div>';
    html += '</div>';
    body.innerHTML = html;

    body.querySelectorAll('[data-cell]').forEach(function(c){
      c.onclick = async function(){
        if (isOver) return;
        if (c.classList.contains('taken')) return;
        if (!myTurn){ window.toast("Not your turn", "", "err"); return; }
        try {
          var r = await sb.rpc('make_game_move', { cid: g.id, p_cell: parseInt(c.dataset.cell, 10) });
          if (r.error) throw r.error;
        } catch(e){ window.toast("Move rejected", e.message || String(e), "err"); }
      };
    });

    var back = document.getElementById('board-back');
    if (back) back.onclick = async function(){
      FOCUS_GAME = null;
      FOCUS_GAME_ID = null;
      await refreshAll();
      renderFixed();
    };
  }

  function wireLobby(){
    var body = document.getElementById('chat-body');
    if (!body) return;

    body.querySelectorAll('[data-bet]').forEach(function(b){
      b.onclick = function(){
        body.querySelectorAll('[data-bet]').forEach(function(x){ x.classList.remove('sel'); });
        b.classList.add('sel');
        var inp = document.getElementById('custom-bet');
        if (inp) inp.value = '';
      };
    });

    var cc = document.getElementById('create-challenge');
    if (cc) cc.onclick = async function(){
      var sel = body.querySelector('[data-bet].sel');
      var custom = document.getElementById('custom-bet');
      var bet = 100;
      if (custom && custom.value !== '') bet = parseInt(custom.value, 10);
      else if (sel) bet = parseInt(sel.dataset.bet, 10);
      if (isNaN(bet) || bet < 0 || bet > 100000) return window.toast("Invalid bet", "0-100000", "err");
      try {
        var r = await sb.rpc('create_game_challenge', { p_bet: bet });
        if (r.error) throw r.error;
        window.toast("Challenge created", "Waiting for an opponent.", "ok");
        await refreshAll();
        renderFixed();
      } catch(e){ window.toast("Failed", e.message || String(e), "err"); }
    };

    body.querySelectorAll('[data-accept]').forEach(function(b){
      b.onclick = async function(){
        b.disabled = true; b.textContent = "...";
        try {
          var r = await sb.rpc('accept_game_challenge', { cid: b.dataset.accept });
          if (r.error) throw r.error;
          await refreshAccount();
          await refreshMyGames();
          var fresh = MY_GAMES_CACHE.find(function(g){ return g.id === b.dataset.accept; });
          if (fresh){
            FOCUS_GAME = fresh;
            FOCUS_GAME_ID = fresh.id;
            renderFixed();
          }
        } catch(e){
          window.toast("Failed", e.message || String(e), "err");
          b.disabled = false; b.textContent = "Accept";
        }
      };
    });

    body.querySelectorAll('[data-cancel]').forEach(function(b){
      b.onclick = async function(){
        try {
          var r = await sb.rpc('cancel_game_challenge', { cid: b.dataset.cancel });
          if (r.error) throw r.error;
          await refreshAccount();
          await refreshAll();
          renderFixed();
        } catch(e){ window.toast("Failed", e.message || String(e), "err"); }
      };
    });

    body.querySelectorAll('[data-enter]').forEach(function(b){
      b.onclick = function(){
        var g = MY_GAMES_CACHE.find(function(x){ return x.id === b.dataset.enter; });
        if (g){ FOCUS_GAME = g; FOCUS_GAME_ID = g.id; renderFixed(); }
      };
    });
  }

  // ------------------------------------------------------------
  // Realtime — refresh and auto-enter
  // ------------------------------------------------------------
  function subscribeFixed(){
    sb.channel('game-room-fix-' + window.ME.id)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'game_challenges' }, async function(p){
        var row = p.new;
        if (!row) return;
        var isMine = row.creator_id === window.ME.id || row.opponent_id === window.ME.id;
        if (!isMine) return;

        // Refresh caches
        await refreshAccount();
        await Promise.all([refreshLobby(), refreshMyGames()]);

        // Are we on the games page?
        var onGames = window.CURRENT && window.CURRENT.type === 'games';

        if (onGames){
          // If we're viewing a specific game, refresh its data
          if (FOCUS_GAME_ID){
            var fresh = MY_GAMES_CACHE.find(function(g){ return g.id === FOCUS_GAME_ID; });
            if (fresh){ FOCUS_GAME = fresh; }
            else {
              // Game disappeared
              FOCUS_GAME = null;
              FOCUS_GAME_ID = null;
            }
          }

          // Auto-enter if we have exactly one in-progress game and we're in the lobby
          if (!FOCUS_GAME){
            var inProgress = MY_GAMES_CACHE.filter(function(g){ return g.status === 'in_progress'; });
            if (inProgress.length === 1){
              FOCUS_GAME = inProgress[0];
              FOCUS_GAME_ID = inProgress[0].id;
            }
          }

          renderFixed();
        } else {
          // Not on games page — notifications
          if (p.eventType === 'UPDATE' && row.status === 'in_progress' && p.old && p.old.status === 'open'){
            if (row.creator_id === window.ME.id){
              window.toast("Challenge accepted!", "Open Game Room to play.", "ok");
            } else if (row.opponent_id === window.ME.id){
              window.toast("You're in a game!", "Open Game Room to play.", "ok");
            }
          }
          if (p.eventType === 'UPDATE' && row.status === 'finished'){
            if (row.winner_id === window.ME.id){
              window.toast("You won a game!", "+" + ((row.bet_amount || 0) * 2) + " 🪙", "ok");
            } else if (row.winner_id && row.winner_id !== window.ME.id && (row.creator_id === window.ME.id || row.opponent_id === window.ME.id)){
              window.toast("You lost a game", "-" + (row.bet_amount || 0) + " 🪙", "err");
            }
          }
        }
      })
      .subscribe();
  }

  // ------------------------------------------------------------
  // Render overrides
  // ------------------------------------------------------------
  var origRC = window.renderChat;
  window.renderChat = function(){
    if (window.CURRENT && window.CURRENT.type === 'games'){
      renderFixed();
      return;
    }
    return origRC.apply(this, arguments);
  };

  // ------------------------------------------------------------
  // Boot
  // ------------------------------------------------------------
  setTimeout(async function(){
    if (!window.ME) return;
    wireRailButton();
    await refreshAll();
    subscribeFixed();
    log("joined-game fix online");
  }, 7000);

  setInterval(wireRailButton, 2000);

  // Also expose for testing
  window.__forceEnterGame = async function(gameId){
    var g = await fetchOneGame(gameId);
    if (!g) return window.toast("Not found", "", "err");
    window.CURRENT = { type: 'games', server: null, channel: null, conv: null, ticket: null };
    await refreshAll();
    FOCUS_GAME = g;
    FOCUS_GAME_ID = g.id;
    renderFixed();
  };

  log("join fix ready");
})();
</script>

<style>

<script>
(function(){
  "use strict";
  if (window.__sleepyFishInMenu) return;
  window.__sleepyFishInMenu = true;
  function log(){ try{console.log.apply(console,["[FishMenu]"].concat([].slice.call(arguments)));}catch(e){} }
  function esc(s){ return window.esc(s); }

  var BANK_ID = '00000000-0000-0000-0000-0000000000ba';
  var GAME_TAB = 'play';   // 'play' | 'fishing' | 'shop'

  // ----------------------------------------------------------------
  // State for the fishing minigame
  // ----------------------------------------------------------------
  var fish = {
    phase: 'idle',   // idle | casting | bite | timing | result
    biteTimer: null,
    missTimer: null,
    raf: null,
    pos: 0,
    start: 0,
    window: 2600,   // ms for marker to cross from 0 to 100
    quality: null,
    caught: null,
    mult: 1
  };

  function clearTimers(){
    if (fish.biteTimer){ clearTimeout(fish.biteTimer); fish.biteTimer = null; }
    if (fish.missTimer){ clearTimeout(fish.missTimer); fish.missTimer = null; }
    if (fish.raf){ cancelAnimationFrame(fish.raf); fish.raf = null; }
  }

  // ----------------------------------------------------------------
  // Ensure account is loaded
  // ----------------------------------------------------------------
  var ACCOUNT = null;
  async function loadAccount(){
    if (!window.ME) return null;
    try {
      var r = await sb.from('bank_accounts').select('*').eq('user_id', window.ME.id).maybeSingle();
      if (r.data){ ACCOUNT = r.data; return ACCOUNT; }
      var ins = await sb.from('bank_accounts').insert({ user_id: window.ME.id, balance: 100 }).select().single();
      ACCOUNT = ins.data;
    } catch(e){ log("account load failed:", e.message); }
    return ACCOUNT;
  }

  // ----------------------------------------------------------------
  // Open the game room (from anywhere)
  // ----------------------------------------------------------------
  async function openGameRoom(tab){
    window.CURRENT = { type: 'games', server: null, channel: null, conv: null, ticket: null };
    GAME_TAB = tab || GAME_TAB || 'play';
    clearTimers();
    fish.phase = 'idle';
    fish.caught = null;
    await loadAccount();
    window.renderChatHead && window.renderChatHead();
    renderGameRoom();
    setTimeout(renderGamePanel, 30);
  }
  window.openGameRoom = openGameRoom;

  // ----------------------------------------------------------------
  // Render the current tab
  // ----------------------------------------------------------------
  function renderGameRoom(){
    var body = document.getElementById('chat-body');
    if (!body) return;

    // Build the tab bar
    var tabs = '<div class="gr-tabs">' +
      '<button class="' + (GAME_TAB==='play'?'active':'') + '" data-gr="play"><span class="em">🎮</span>Play</button>' +
      '<button class="' + (GAME_TAB==='fishing'?'active':'') + '" data-gr="fishing"><span class="em">🎣</span>Fishing</button>' +
      '<button class="' + (GAME_TAB==='shop'?'active':'') + '" data-gr="shop"><span class="em">🛒</span>Shop</button>' +
    '</div>';

    var content = '';
    if (GAME_TAB === 'fishing') content = renderFishingTab();
    else if (GAME_TAB === 'shop') content = renderShopTab();
    else content = renderPlayTab();

    body.innerHTML = tabs + content;
    wireBody();
  }

  // ----------------------------------------------------------------
  // PLAY TAB (delegates to the existing lobby renderer if present)
  // ----------------------------------------------------------------
  function renderPlayTab(){
    // The join-game fix patch renders its own lobby. Just trigger it.
    if (typeof window.openGameRoomFixed === 'function'){
      // We already set CURRENT.type = 'games'
      // Call the underlying render after this tick
      setTimeout(function(){
        // Tell the other patch to render into our chat body
        if (window.__sleepyFixJoinGame && typeof window.renderFixed === 'function'){
          // renderFixed is private, call via the exposed method
        }
      }, 0);
    }
    // Fallback: simple message
    return '<div style="padding:40px 20px;text-align:center;color:var(--text3);font-size:13px">' +
      'Loading Play tab...' +
    '</div>';
  }

  // ----------------------------------------------------------------
  // SHOP TAB
  // ----------------------------------------------------------------
  function renderShopTab(){
    // Delegate to whatever shop renderer the gaming_area patch installed
    return '<div style="padding:40px 20px;text-align:center;color:var(--text3);font-size:13px">' +
      'Loading Shop...' +
    '</div>';
  }

  // ----------------------------------------------------------------
  // FISHING TAB — the minigame, self-contained
  // ----------------------------------------------------------------
  var FISH_TABLE = [
    { name:'Minnow',         emoji:'🐟', tier:'common',    value:10,   weight:25 },
    { name:'Sardine',        emoji:'🐟', tier:'common',    value:15,   weight:20 },
    { name:'Bass',           emoji:'🐟', tier:'common',    value:25,   weight:15 },
    { name:'Trout',          emoji:'🐠', tier:'uncommon',  value:50,   weight:10 },
    { name:'Salmon',         emoji:'🐠', tier:'uncommon',  value:75,   weight:8 },
    { name:'Tuna',           emoji:'🐟', tier:'uncommon',  value:100,  weight:7 },
    { name:'Clownfish',      emoji:'🐠', tier:'rare',      value:150,  weight:4 },
    { name:'Swordfish',      emoji:'🐟', tier:'rare',      value:250,  weight:3 },
    { name:'Golden Koi',     emoji:'🐠', tier:'legendary', value:500,  weight:1 },
    { name:'Mythic Arowana', emoji:'🐉', tier:'legendary', value:1000, weight:0.5 },
    { name:'Pufferfish',     emoji:'🐡', tier:'puffer',    value:0,    weight:6.5 }
  ];

  function rollFish(){
    var total = FISH_TABLE.reduce(function(s,f){ return s + f.weight; }, 0);
    var r = Math.random() * total, acc = 0;
    for (var i = 0; i < FISH_TABLE.length; i++){
      acc += FISH_TABLE[i].weight;
      if (r < acc) return FISH_TABLE[i];
    }
    return FISH_TABLE[0];
  }

  function renderFishingTab(){
    var bal = ACCOUNT ? ACCOUNT.balance : 0;
    var poisoned = ACCOUNT && ACCOUNT.poisoned;

    var h = '<div style="max-width:560px;margin:0 auto;padding:0 20px 60px">';

    // Balance strip
    h += '<div style="text-align:center;padding:14px;border-radius:14px;' +
      'background:linear-gradient(135deg,rgba(255,200,87,.1),rgba(0,230,118,.06));' +
      'border:1px solid rgba(255,200,87,.3);margin-bottom:20px">' +
      '<div style="font-family:\'Space Grotesk\',sans-serif;font-size:32px;font-weight:700;' +
      'color:#ffd166;line-height:1;text-shadow:0 0 24px rgba(255,200,87,.4)">🪙 ' + bal.toLocaleString() + '</div>' +
      '<div style="font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-top:5px">Balance</div>' +
    '</div>';

    // Poison warning
    if (poisoned){
      h += '<div style="display:flex;align-items:center;gap:12px;padding:14px;border-radius:12px;' +
        'background:rgba(255,45,111,.08);border:1px solid rgba(255,45,111,.4);margin-bottom:16px">' +
        '<span style="font-size:24px">🐡</span>' +
        '<div style="flex:1"><div style="font-weight:700;font-size:13px;color:#ff8aa8">POISONED</div>' +
          '<div style="font-size:11.5px;color:var(--text3)">Losing 10 coins/min</div></div>' +
        '<button id="fish-cure-btn" style="padding:8px 14px;border-radius:8px;' +
          'background:linear-gradient(135deg,#ff2d6f,#c41d54);color:#fff;border:none;' +
          'font-weight:700;font-size:12px;cursor:pointer' +
          (bal < 100 ? ';opacity:.5;cursor:not-allowed' : '') + '"' +
          (bal < 100 ? ' disabled' : '') + '>Cure -100</button>' +
      '</div>';
    }

    // Water stage
    h += '<div id="fish-stage" style="position:relative;height:280px;border-radius:16px;' +
      'background:linear-gradient(180deg, rgba(0,80,140,.5), rgba(0,40,90,.7));' +
      'border:1px solid rgba(0,200,255,.3);overflow:hidden;margin-bottom:16px">';

    // Water lines
    h += '<div style="position:absolute;inset:0;' +
      'background:repeating-linear-gradient(90deg,transparent 0 40px,rgba(0,255,224,.05) 40px 42px);' +
      'animation:waterMove 8s linear infinite"></div>';

    // Swimmers
    var swimmers = ['🐟','🐠','🐟','🐡','🐠','🐟'];
    swimmers.forEach(function(e, i){
      var positions = [{t:'20%',l:'10%'},{t:'50%',l:'70%'},{t:'75%',l:'25%'},{t:'35%',l:'50%'},{t:'65%',l:'80%'},{t:'15%',l:'45%'}][i];
      h += '<div style="position:absolute;top:' + positions.t + ';left:' + positions.l + ';font-size:24px;' +
        'filter:drop-shadow(0 0 6px rgba(0,200,255,.5));opacity:.75;' +
        'animation:swimFloat ' + (4 + i * .3) + 's ease-in-out infinite">' + e + '</div>';
    });

    // Overlay per phase
    if (fish.phase === 'casting'){
      h += '<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;' +
        'justify-content:center;background:rgba(10,10,15,.5);backdrop-filter:blur(4px)">' +
        '<div style="font-family:\'Space Grotesk\';font-size:16px;font-weight:700;color:var(--cyan);' +
          'letter-spacing:.06em;text-transform:uppercase">Casting...</div>' +
        '<div style="font-size:12px;color:var(--text3);margin-top:6px">Wait for a bite...</div>' +
      '</div>';
    }
    if (fish.phase === 'bite'){
      h += '<div id="fish-bite" style="position:absolute;inset:0;display:flex;flex-direction:column;' +
        'align-items:center;justify-content:center;background:rgba(10,10,15,.6);backdrop-filter:blur(4px);cursor:pointer">' +
        '<div style="font-size:64px;animation:fishBite .3s ease">❗</div>' +
        '<div style="font-family:\'Space Grotesk\';font-size:18px;font-weight:700;color:var(--cyan);' +
          'margin-top:8px;text-shadow:0 0 12px rgba(94,231,215,.6)">CLICK NOW!</div>' +
        '<div style="font-size:11.5px;color:var(--text3);margin-top:4px">Hook the fish fast</div>' +
      '</div>';
    }
    if (fish.phase === 'timing'){
      h += '<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;' +
        'justify-content:center;background:rgba(10,10,15,.55);backdrop-filter:blur(4px)">' +
        '<div style="font-family:\'Space Grotesk\';font-size:16px;font-weight:700;color:var(--cyan)">Reel it in!</div>' +
        '<div style="font-size:11.5px;color:var(--text3);margin-top:4px">Click the stage when the marker is centered</div>' +
      '</div>';
    }
    if (fish.phase === 'result' && fish.caught){
      var c = fish.caught;
      var rarity = c.tier === 'legendary' ? 'linear-gradient(135deg, rgba(255,200,87,.22), rgba(255,45,111,.14))' :
                    c.tier === 'rare' ? 'linear-gradient(135deg, rgba(94,231,215,.22), rgba(139,124,255,.12))' :
                    c.tier === 'puffer' ? 'linear-gradient(135deg, rgba(255,45,111,.24), rgba(255,45,111,.1))' :
                    'linear-gradient(135deg, rgba(139,124,255,.18), rgba(94,231,215,.1))';
      var valueLine = c.tier === 'puffer'
        ? '<div style="font-family:\'Space Grotesk\';font-size:22px;font-weight:700;color:#ff8aa8;margin-top:6px">+ POISON</div>'
        : '<div style="font-family:\'Space Grotesk\';font-size:26px;font-weight:700;color:#ffd166;margin-top:6px">+' + Math.round(c.value * fish.mult) + ' 🪙' + (fish.mult > 1 ? ' (x' + fish.mult + ')' : '') + '</div>';
      h += '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;' +
        'background:rgba(10,10,15,.88);z-index:6;animation:fishPop .35s ease">' +
        '<div style="text-align:center;padding:28px;border-radius:16px;' +
          'background:' + rarity + ';border:1px solid rgba(255,200,87,.4)">' +
          '<div style="font-size:72px;line-height:1;margin-bottom:10px;' +
            'animation:fishBounce .6s ease">' + c.emoji + '</div>' +
          '<div style="font-family:\'Space Grotesk\';font-size:20px;font-weight:700;color:var(--text);margin-bottom:4px">' + esc(c.name) + '</div>' +
          '<div style="font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;' +
            'color:var(--text3);padding:2px 10px;border-radius:99px;background:rgba(0,0,0,.3);display:inline-block">' +
            esc(c.tier === 'puffer' ? 'HAZARD' : c.tier) + '</div>' +
          valueLine +
          (fish.quality ? '<div style="margin-top:12px;font-size:13px;font-weight:700;' +
            (fish.quality === 'perfect' ? 'color:#ffd166' : fish.quality === 'great' ? 'color:#4ade80' : 'color:#ffc857') + '">' +
            (fish.quality === 'perfect' ? '🌟 PERFECT!' : fish.quality === 'great' ? '✨ Great!' : '👍 Nice') + '</div>' : '') +
        '</div>' +
      '</div>';
    }

    h += '</div>';

    // Timing bar (only in timing phase)
    if (fish.phase === 'timing'){
      h += '<div style="margin-top:6px">' +
        '<div style="position:relative;height:36px;border-radius:10px;overflow:hidden;' +
          'background:linear-gradient(90deg, ' +
            'rgba(255,45,111,.4) 0%, rgba(255,171,0,.4) 20%, rgba(74,222,128,.5) 40%, ' +
            'rgba(94,231,215,.75) 48%, rgba(94,231,215,.75) 52%, ' +
            'rgba(74,222,128,.5) 60%, rgba(255,171,0,.4) 80%, rgba(255,45,111,.4) 100%);' +
          'border:1px solid rgba(94,231,215,.4)">' +
          '<div id="fish-marker" style="position:absolute;top:-3px;bottom:-3px;left:0;width:4px;' +
            'background:#fff;border-radius:2px;box-shadow:0 0 12px #fff,0 0 24px rgba(94,231,215,.9)"></div>' +
        '</div>' +
        '<div style="display:flex;justify-content:space-between;margin-top:6px;font-size:10.5px;color:var(--text3);font-family:monospace">' +
          '<span>Miss</span><span>OK</span><span style="color:var(--cyan);font-weight:700">PERFECT</span><span>OK</span><span>Miss</span>' +
        '</div>' +
      '</div>';
    }

    // Cast button
    if (fish.phase === 'idle'){
      h += '<button id="fish-cast-btn"' + (poisoned ? ' disabled' : '') + ' style="width:100%;margin-top:16px;' +
        'padding:16px;border-radius:14px;background:linear-gradient(135deg,#5ee7d7,#0096ff);' +
        'color:#04120f;font-weight:800;font-size:15px;letter-spacing:.04em;border:none;cursor:pointer;' +
        'display:flex;align-items:center;justify-content:center;gap:10px;font-family:inherit' +
        (poisoned ? ';opacity:.5;cursor:not-allowed' : '') + '">' +
        '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M4 20 12 12M12 12l8-8M12 12H4M12 12v8"/></svg>' +
        (poisoned ? 'Cure first to fish' : 'Cast Line') +
      '</button>';
    }

    // Recent catches
    h += '<div style="margin-top:24px"><h3 style="font-size:10.5px;font-weight:700;letter-spacing:.14em;' +
      'text-transform:uppercase;color:var(--text3);margin-bottom:10px;font-family:\'JetBrains Mono\',monospace">' +
      'Recent catches</h3><div id="fish-recent" style="display:flex;flex-direction:column;gap:5px">' +
      '<div style="color:var(--text3);font-size:12.5px">Loading...</div></div></div>';

    h += '</div>';
    return h;
  }

  // ----------------------------------------------------------------
  // Fishing actions
  // ----------------------------------------------------------------
  async function doCast(){
    if (fish.phase !== 'idle') return;
    if (!ACCOUNT) await loadAccount();
    if (ACCOUNT && ACCOUNT.poisoned){
      window.toast("You're poisoned", "Cure first.", "err");
      return;
    }
    fish.phase = 'casting';
    fish.caught = null;
    fish.quality = null;
    fish.mult = 1;
    renderGameRoom();

    var wait = 1400 + Math.random() * 2400;
    fish.biteTimer = setTimeout(function(){
      if (fish.phase !== 'casting') return;
      fish.phase = 'bite';
      renderGameRoom();
      if (navigator.vibrate) try { navigator.vibrate(60); } catch(e){}

      fish.missTimer = setTimeout(function(){
        if (fish.phase === 'bite') finishCast('miss');
      }, 1600);
    }, wait);
  }

  function startTiming(){
    fish.phase = 'timing';
    fish.start = Date.now();
    fish.pos = 0;
    renderGameRoom();

    var tick = function(){
      var elapsed = Date.now() - fish.start;
      var t = (elapsed % (fish.window * 2)) / fish.window;
      fish.pos = t <= 1 ? t * 100 : (2 - t) * 100;
      var m = document.getElementById('fish-marker');
      if (m) m.style.left = 'calc(' + fish.pos + '% - 2px)';
      fish.raf = requestAnimationFrame(tick);
    };
    tick();
  }

  function hookTiming(){
    if (fish.phase !== 'timing') return;
    clearTimers();
    var d = Math.abs(fish.pos - 50);
    var quality = d <= 6 ? 'perfect' : d <= 14 ? 'great' : d <= 28 ? 'ok' : 'miss';
    finishCast(quality);
  }

  async function finishCast(quality){
    fish.phase = 'result';
    fish.quality = quality;
    if (quality === 'miss'){
      fish.caught = null;
      renderGameRoom();
      window.toast("Missed", "The fish got away.", "err");
      setTimeout(function(){ fish.phase = 'idle'; renderGameRoom(); loadRecent(); }, 1500);
      return;
    }

    // Roll a fish
    var caught = rollFish();

    // Hidden puffer cycle: force after 10 non-puffer
    try {
      var pr = await sb.from('fishing_catches').select('fish_tier')
        .eq('user_id', window.ME.id).order('caught_at', { ascending: false }).limit(20);
      var rows = pr.data || [];
      var lastIdx = -1;
      for (var i = 0; i < rows.length; i++) if (rows[i].fish_tier === 'puffer'){ lastIdx = i; break; }
      var nonPuff = lastIdx < 0 ? rows.length : lastIdx;
      if (nonPuff >= 10 && caught.tier !== 'puffer'){
        caught = { name:'Pufferfish', emoji:'🐡', tier:'puffer', value:0 };
      }
    } catch(e){}

    var mult = quality === 'perfect' ? 2 : quality === 'great' ? 1.5 : 1;
    fish.mult = mult;
    fish.caught = caught;

    try {
      var r = await sb.rpc('record_catch', {
        fish_name: caught.name,
        fish_emoji: caught.emoji,
        fish_tier: caught.tier,
        fish_value: Math.round(caught.value * mult)
      });
      if (r.error) throw r.error;
      await loadAccount();
      renderGameRoom();
      loadRecent();
      setTimeout(function(){
        if (fish.phase === 'result'){ fish.phase = 'idle'; renderGameRoom(); }
      }, 2800);
    } catch(e){
      log("catch failed:", e.message);
      window.toast("Error", e.message || String(e), "err");
      fish.phase = 'idle';
      renderGameRoom();
    }
  }

  async function loadRecent(){
    var el = document.getElementById('fish-recent');
    if (!el || !window.ME) return;
    try {
      var r = await sb.from('fishing_catches').select('*')
        .eq('user_id', window.ME.id).order('caught_at', { ascending: false }).limit(6);
      var rows = r.data || [];
      if (!rows.length){
        el.innerHTML = '<div style="color:var(--text3);font-size:12.5px">No catches yet. Cast your line!</div>';
        return;
      }
      el.innerHTML = rows.map(function(c){
        var v = c.fish_tier === 'puffer'
          ? '<span style="font-family:monospace;font-weight:700;color:#ff8aa8">POISON</span>'
          : '<span style="font-family:monospace;font-weight:700;color:#ffd166">+' + c.value + '</span>';
        return '<div style="display:flex;align-items:center;gap:12px;padding:9px 12px;' +
          'border-radius:9px;background:rgba(255,255,255,.03);font-size:13px">' +
          '<span style="font-size:20px">' + c.fish_emoji + '</span>' +
          '<span style="flex:1;font-weight:600;color:var(--text)">' + esc(c.fish_name) + '</span>' +
          '<span style="font-size:10.5px;color:var(--text3);letter-spacing:.06em;text-transform:uppercase">' + esc(c.fish_tier) + '</span>' +
          v +
        '</div>';
      }).join('');
    } catch(e){}
  }

  async function doCure(){
    try {
      var r = await sb.rpc('cure_poison');
      if (r.error) throw r.error;
      await loadAccount();
      window.toast("Cured", "You're healthy.", "ok");
      renderGameRoom();
    } catch(e){ window.toast("Error", e.message || String(e), "err"); }
  }

  // ----------------------------------------------------------------
  // Wire the rendered body
  // ----------------------------------------------------------------
  function wireBody(){
    var body = document.getElementById('chat-body');
    if (!body) return;

    body.querySelectorAll('[data-gr]').forEach(function(b){
      b.onclick = function(){
        GAME_TAB = b.dataset.gr;
        if (GAME_TAB === 'fishing'){ loadAccount().then(renderGameRoom).then(loadRecent); }
        else renderGameRoom();
        setTimeout(renderGamePanel, 10);
      };
    });

    var cast = document.getElementById('fish-cast-btn');
    if (cast) cast.onclick = doCast;

    var bite = document.getElementById('fish-bite');
    if (bite) bite.onclick = startTiming;

    var stage = document.getElementById('fish-stage');
    if (stage && fish.phase === 'timing'){
      stage.style.cursor = 'pointer';
      stage.onclick = hookTiming;
    }

    var cure = document.getElementById('fish-cure-btn');
    if (cure && !cure.disabled) cure.onclick = doCure;

    if (GAME_TAB === 'fishing') loadRecent();
  }

  // ----------------------------------------------------------------
  // Left panel nav
  // ----------------------------------------------------------------
  function renderGamePanel(){
    if (!window.CURRENT || window.CURRENT.type !== 'games') return;
    var body = document.getElementById('panel-body');
    if (!body) return;
    if (!window.__savedPanelHTML && !body.querySelector('.game-nav')){
      window.__savedPanelHTML = body.innerHTML;
    }
    var head = document.getElementById('panel-head');
    if (head) head.innerHTML = '<div class="ttl">🎮 Game Room</div>';

    var h = '<div class="game-nav">' +
      '<h3>Games</h3>' +
      '<button class="gbtn ' + (GAME_TAB==='play'?'active':'') + '" data-gpanel="play">' +
        '<span class="emoji">🎮</span><span class="lbl">Play<span class="sub">Tic-Tac-Toe matches</span></span></button>' +
      '<button class="gbtn ' + (GAME_TAB==='fishing'?'active':'') + '" data-gpanel="fishing">' +
        '<span class="emoji">🎣</span><span class="lbl">Fishing<span class="sub">Cast & earn coins</span></span></button>' +
      '<button class="gbtn ' + (GAME_TAB==='shop'?'active':'') + '" data-gpanel="shop">' +
        '<span class="emoji">🛒</span><span class="lbl">Shop<span class="sub">Spend your coins</span></span></button>' +
    '</div>';
    body.innerHTML = h;
    body.querySelectorAll('[data-gpanel]').forEach(function(b){
      b.onclick = function(){
        GAME_TAB = b.dataset.gpanel;
        if (GAME_TAB === 'fishing'){ loadAccount().then(renderGameRoom).then(loadRecent); }
        else renderGameRoom();
        renderGamePanel();
      };
    });
  }

  // ----------------------------------------------------------------
  // Override renderChat for the games page
  // ----------------------------------------------------------------
  var origRC = window.renderChat;
  window.renderChat = function(){
    if (window.CURRENT && window.CURRENT.type === 'games'){
      document.body.classList.add('in-game-room');
      renderGameRoom();
      renderGamePanel();
      return;
    }
    document.body.classList.remove('in-game-room');
    return origRC.apply(this, arguments);
  };

  var origRCH = window.renderChatHead;
  window.renderChatHead = function(){
    if (window.CURRENT && window.CURRENT.type === 'games'){
      var el = document.getElementById('chat-head');
      if (el){
        var label = GAME_TAB === 'fishing' ? 'Fishing' : GAME_TAB === 'shop' ? 'Shop' : 'Game Room';
        var emoji = GAME_TAB === 'fishing' ? '🎣' : GAME_TAB === 'shop' ? '🛒' : '🎮';
        el.innerHTML =
          '<button class="hbtn mobile-only" data-act="toggle-panel">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="width:20px;height:20px"><path d="M3 6h18M3 12h18M3 18h18"/></svg>' +
          '</button>' +
          '<div class="title"><span style="font-size:16px">' + emoji + '</span><span class="txt">' + label + '</span></div>' +
          '<div class="spacer"></div>';
      }
      return;
    }
    return origRCH.apply(this, arguments);
  };

  var origRComp = window.renderComposer;
  window.renderComposer = function(){
    if (window.CURRENT && window.CURRENT.type === 'games'){
      var w = document.getElementById('composer-wrap'); if (w) w.innerHTML = '';
      var t = document.getElementById('typing-bar'); if (t) t.innerHTML = '';
      return;
    }
    return origRComp.apply(this, arguments);
  };

  // ----------------------------------------------------------------
  // Wire the RAIL button
  // ----------------------------------------------------------------
  function wireRail(){
    var btn = document.querySelector('.rail-btn.games-btn');
    if (!btn || btn.__wiredFishMenu) return;
    btn.__wiredFishMenu = true;
    btn.onclick = function(){ openGameRoom('play'); };
  }
  setInterval(wireRail, 2000);

  // ----------------------------------------------------------------
  // Override any old openFishing/openGames to route through ours
  // ----------------------------------------------------------------
  window.openFishing = function(){ openGameRoom('fishing'); };
  window.openGames = function(){ openGameRoom('play'); };

  // ----------------------------------------------------------------
  // BOOT
  // ----------------------------------------------------------------
  setTimeout(async function(){
    if (!window.ME) return;
    await loadAccount();
    wireRail();
    log("fishing in menu ready");
  }, 6000);

  log("loaded");
})();
</script>

<!-- SLEEPY_GUARD_RENDER_V1 -->
<script>
(function(){
  "use strict";
  if (window.__sleepyGuardRender) return;
  window.__sleepyGuardRender = true;
  function log(){ try{console.log.apply(console,["[Guard]"].concat([].slice.call(arguments)));}catch(e){} }

  // ------------------------------------------------------------
  // 1. Guard renderMembers
  // ------------------------------------------------------------
  // The base code (and several patches) call renderMembers()
  // unconditionally. It crashes whenever CURRENT.server is null.
  // We wrap every reference to renderMembers so it always runs
  // through our safe version.

  function safeRenderMembers(){
    try {
      // Only render when we're actually viewing a server
      var c = window.CURRENT;
      if (!c || !c.server) {
        var el = document.getElementById('members');
        if (el) el.innerHTML = '';
        return;
      }
      // Not in server-view types (game room, fishing, tickets hub, ticket, dm)
      if (c.type === 'games' || c.type === 'fishing' || c.type === 'tickets_hub' || c.type === 'ticket' || c.type === 'dm' || c.type === 'home' || c.type === 'dms') {
        var el2 = document.getElementById('members');
        if (el2) el2.innerHTML = '';
        return;
      }
      // Call the underlying render, whatever it is now
      var orig = window.__origRenderMembers;
      if (typeof orig === 'function') return orig.call(window);
    } catch (e) {
      log("renderMembers error (caught):", e && e.message);
    }
  }

  // Capture the current renderMembers, then install the safe wrapper
  if (typeof window.renderMembers === 'function' && !window.__origRenderMembers){
    window.__origRenderMembers = window.renderMembers;
  }
  window.renderMembers = safeRenderMembers;

  // Also patch document.body so any other code that pokes the members panel
  // doesn't crash. Some patches call renderMembers via setters.
  setInterval(function(){
    if (window.renderMembers !== safeRenderMembers){
      // Someone re-wrapped it — recapture and re-install
      if (!window.__origRenderMembers){
        window.__origRenderMembers = window.renderMembers;
      } else if (window.renderMembers !== window.__origRenderMembers){
        // Another wrapper replaced ours; keep theirs as inner
        var theirs = window.renderMembers;
        window.__origRenderMembers = function(){
          try { return theirs.call(window); } catch(e){ log("inner renderMembers error:", e && e.message); }
        };
      }
      window.renderMembers = safeRenderMembers;
    }
  }, 2000);

  // ------------------------------------------------------------
  // 2. Guard loadServerMembers too (used by renderMembers)
  // ------------------------------------------------------------
  if (typeof window.loadServerMembers === 'function' && !window.__origLoadServerMembers){
    window.__origLoadServerMembers = window.loadServerMembers;
  }
  var origLSM = window.__origLoadServerMembers;
  if (typeof origLSM === 'function'){
    window.loadServerMembers = async function(sid){
      if (!sid) return [];
      try { return await origLSM.call(this, sid); } catch(e){ log("loadServerMembers error:", e && e.message); return []; }
    };
  }

  // ------------------------------------------------------------
  // 3. Harden game-create and game-accept
  // ------------------------------------------------------------
  // The rpc calls can fail for various reasons. Wrap them so we
  // always get a clear toast and don't leave the UI stuck.

  // Patch create_game_challenge
  var origCreate = sb.rpc.bind(sb);
  sb.rpc = async function(fn, params, options){
    try {
      var r = await origCreate(fn, params, options);
      // If RPC returned error, log the message but don't throw
      if (r && r.error){
        log("RPC error on " + fn + ":", r.error.message);
      }
      return r;
    } catch(e){
      log("RPC threw on " + fn + ":", e.message);
      throw e;
    }
  };

  // ------------------------------------------------------------
  // 4. Wire the game-room create button with clearer feedback
  // ------------------------------------------------------------
  document.addEventListener('click', async function(e){
    var cc = e.target.closest('#create-challenge');
    if (!cc) return;
    // Skip if disabled or already being processed
    if (cc.disabled) return;
    // If the RPS/game picker patch is loaded, it handles this entirely.
    // Otherwise we'd create a second (TTT) challenge behind its back.
    if (window.__sleepyPickerV2 || window.__pickerWillHandle) return;
    cc.disabled = true;
    var origText = cc.textContent;
    cc.textContent = 'Creating...';

    try {
      // Find bet amount
      var body = cc.closest('.games-wrap') || cc.parentElement;
      var sel = body.querySelector('[data-bet].sel');
      var custom = document.getElementById('custom-bet');
      var bet = 100;
      if (custom && custom.value !== '' && !isNaN(parseInt(custom.value, 10))){
        bet = parseInt(custom.value, 10);
      } else if (sel){
        bet = parseInt(sel.dataset.bet, 10);
      }
      if (isNaN(bet) || bet < 0 || bet > 100000){
        throw new Error('Bet must be between 0 and 100000');
      }

      // Check we have enough coins first (client-side pre-check)
      var acc = null;
      try {
        var ar = await sb.from('bank_accounts').select('balance').eq('user_id', window.ME.id).maybeSingle();
        acc = ar.data;
      } catch(e){}

      if (!acc){
        // Create one
        var ins = await sb.from('bank_accounts').insert({ user_id: window.ME.id, balance: 100 }).select().single();
        acc = ins.data;
      }
      if (acc && acc.balance < bet){
        throw new Error('Insufficient balance (you have ' + acc.balance + ', need ' + bet + ')');
      }

      var r = await sb.rpc('create_game_challenge', { p_bet: bet });
      if (r.error) throw new Error(r.error.message || String(r.error));

      window.toast("Challenge created", "Waiting for an opponent.", "ok");

      // Refresh whatever game view is active
      if (window.CURRENT && window.CURRENT.type === 'games'){
        // Give the wrappers a chance to refresh
        if (typeof window.openGameRoomFixed === 'function'){
          window.openGameRoomFixed();
        } else if (typeof window.openGameRoom === 'function'){
          window.openGameRoom('play');
        }
      }
    } catch(err){
      log("create challenge failed:", err.message);
      window.toast("Could not create challenge", err.message || String(err), "err");
    } finally {
      cc.disabled = false;
      cc.textContent = origText;
    }
  }, true);

  // Same for accept
  document.addEventListener('click', async function(e){
    var ab = e.target.closest('[data-accept]');
    if (!ab || ab.disabled) return;
    var cid = ab.dataset.accept;
    if (!cid) return;
    // Let the other handler do its thing; we just prevent double-click chaos
    ab.disabled = true;
    var orig = ab.textContent;
    ab.textContent = '...';
    setTimeout(function(){
      if (ab.parentElement){
        ab.disabled = false;
        ab.textContent = orig;
      }
    }, 3000);
  }, false); // bubble phase so underlying handler runs first

  // ------------------------------------------------------------
  // 5. Kill any lingering renderAll loops that crash on null server
  // ------------------------------------------------------------
  var origRenderAll = window.renderAll;
  if (typeof origRenderAll === 'function'){
    window.renderAll = function(){
      try {
        return origRenderAll.apply(this, arguments);
      } catch(e){
        log("renderAll error (caught):", e && e.message);
        // Continue — try to render what we can
        try { if (window.renderChat) window.renderChat(); } catch(_){}
        try { if (window.renderPanel) window.renderPanel(); } catch(_){}
      }
    };
  }

  log("guards installed");
})();
</script>
