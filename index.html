<script>
(function(){
  "use strict";
  if (window.__sleepyServerSet) return;
  window.__sleepyServerSet = true;
  function log(){ try{console.log.apply(console,["[SS]"].concat([].slice.call(arguments)));}catch(e){} }
  function esc(s){ return window.esc(s); }

  function modeMeta(mode){
    if (mode === 'owner') return { label:'Owner only', cls:'mode-owner' };
    if (mode === 'roles') return { label:'Specific roles', cls:'mode-roles' };
    return { label:'Everyone', cls:'mode-everyone' };
  }

  function roleById(id){
    return (window.ROLES || []).filter(function(r){ return r.id === id; })[0] || null;
  }

  window.openServerSettings = function(serverId){
    var srv = (window.SERVERS || []).filter(function(s){ return s.id === serverId; })[0];
    if (!srv) return;
    var isOwner = srv.owner_id === window.ME.id;
    if (!isOwner){
      return window.toast("Owner only", "Only the server owner can manage settings.", "err");
    }

    var tab = 'overview';

    // Load everything we need up front
    Promise.all([
      window.loadChannels(serverId),
      sb.from('server_roles').select('*').eq('server_id', serverId).order('position', { ascending: false }),
      sb.from('server_member_roles').select('*').eq('server_id', serverId),
      window.loadServerMembers ? window.loadServerMembers(serverId) : Promise.resolve([])
    ]).then(function(results){
      window.ROLES = results[1].data || [];
      var mr = {};
      (results[2].data || []).forEach(function(r){
        if (!mr[r.user_id]) mr[r.user_id] = [];
        mr[r.user_id].push(r.role_id);
      });
      window.MEMBER_ROLES = mr;
      openModalNow();
    }).catch(function(e){
      log("settings load error", e);
      window.toast("Error", e.message || String(e), "err");
    });

    function roleChipsHTML(uid){
      var mrole = (window.MEMBER_ROLES || {})[uid] || [];
      if (!mrole.length) return '';
      return mrole.map(function(rid){
        var r = roleById(rid);
        if (!r) return '';
        return '<span class="role-chip" style="background:' + esc(r.color) + '22;color:' + esc(r.color) + '">' + esc(r.name) + '</span>';
      }).join('');
    }

    // ==================== OVERVIEW ====================
    function renderOverview(){
      var html = '';
      html += '<h2>Overview</h2>';
      html += '<div class="sub">Basic details about this community. Changes apply to everyone immediately.</div>';
      html += '<div class="section">';
      html += '<div style="display:flex;align-items:center;gap:16px;margin-bottom:16px">';
      html += '<div class="ov-avatar" id="ss-icon">';
      html += srv.icon_url ? '<img src="' + esc(srv.icon_url) + '" alt="">' : esc(srv.name.slice(0, 2).toUpperCase());
      html += '</div>';
      html += '<div>';
      html += '<button class="btn sm" id="ss-icon-btn">Change Icon</button> ';
      if (srv.icon_url) html += '<button class="btn sm danger" id="ss-icon-rm">Remove</button>';
      html += '<div class="hint" style="margin-top:8px">PNG, JPG. Square images work best.</div>';
      html += '</div>';
      html += '<input type="file" id="ss-icon-file" accept="image/*" style="display:none">';
      html += '</div>';
      html += '<div class="field"><label>Server Name</label><input id="ss-name" value="' + esc(srv.name) + '" maxlength="60"></div>';
      html += '<div class="field"><label>Description</label><textarea id="ss-desc" maxlength="200">' + esc(srv.description || '') + '</textarea><div class="hint">Shown to invited users and on server info.</div></div>';
      html += '<button class="btn primary" id="ss-save-overview">Save Changes</button>';
      html += '</div>';
      return html;
    }

    function wireOverview(){
      var iconInp = document.getElementById('ss-icon-file');
      var btnIcon = document.getElementById('ss-icon-btn');
      if (btnIcon) btnIcon.onclick = function(){ iconInp.click(); };
      if (iconInp) iconInp.onchange = async function(e){
        var f = e.target.files[0]; if (!f) return;
        try {
          window.toast("Uploading", "Please wait...", "ok");
          var ext = (f.name.split('.').pop() || 'png').toLowerCase();
          var path = window.ME.id + '/server-' + srv.id + '-' + Date.now() + '.' + ext;
          var { error } = await sb.storage.from('avatars').upload(path, f, { contentType: f.type, upsert: true });
          if (error) throw error;
          var { data: pub } = sb.storage.from('avatars').getPublicUrl(path);
          var { error: e2 } = await sb.from('servers').update({ icon_url: pub.publicUrl }).eq('id', srv.id);
          if (e2) throw e2;
          srv.icon_url = pub.publicUrl;
          window.SERVERS.forEach(function(s){ if (s.id === srv.id) s.icon_url = pub.publicUrl; });
          window.renderRail();
          render();
          window.toast("Saved", "Icon updated.", "ok");
        } catch(err){ window.toast("Upload failed", err.message || String(err), "err"); }
      };
      var rm = document.getElementById('ss-icon-rm');
      if (rm) rm.onclick = async function(){
        try {
          await sb.from('servers').update({ icon_url: null }).eq('id', srv.id);
          srv.icon_url = null;
          window.SERVERS.forEach(function(s){ if (s.id === srv.id) s.icon_url = null; });
          window.renderRail();
          render();
        } catch(e){ window.toast("Error", e.message || String(e), "err"); }
      };
      var sv = document.getElementById('ss-save-overview');
      if (sv) sv.onclick = async function(){
        try {
          var patch = {
            name: document.getElementById('ss-name').value.trim() || srv.name,
            description: document.getElementById('ss-desc').value.trim()
          };
          await sb.from('servers').update(patch).eq('id', srv.id);
          Object.assign(srv, patch);
          window.SERVERS.forEach(function(s){ if (s.id === srv.id) Object.assign(s, patch); });
          window.renderRail();
          window.renderChatHead();
          window.renderPanel();
          window.toast("Saved", "Server updated.", "ok");
        } catch(e){ window.toast("Error", e.message || String(e), "err"); }
      };
    }

    // ==================== CHANNELS ====================
    function renderChannels(){
      var cats = [];
      (window.CHANNELS || []).forEach(function(ch){
        if (cats.indexOf(ch.category) < 0) cats.push(ch.category);
      });
      var html = '';
      html += '<h2>Channels</h2>';
      html += '<div class="sub">Create, edit, or remove channels. Locked channels show a badge with who can post there.</div>';

      cats.forEach(function(cat){
        html += '<div class="section">';
        html += '<h3>' + esc(cat) + '</h3>';
        (window.CHANNELS || []).filter(function(ch){ return ch.category === cat; }).forEach(function(ch){
          var mm = modeMeta(ch.send_mode || 'everyone');
          html += '<div class="ch-row">';
          html += '<svg class="ch-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">' +
                  (ch.type === 'voice'
                    ? '<path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/>'
                    : '<path d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"/>') +
                  '</svg>';
          html += '<span class="ch-name">' + esc(ch.name) + '</span>';
          html += '<span class="ch-mode ' + mm.cls + '">' + mm.label + '</span>';
          html += '<button class="mini-btn" data-ch-edit="' + ch.id + '">Edit</button>';
          html += '<button class="mini-btn danger" data-ch-del="' + ch.id + '">Delete</button>';
          html += '</div>';
        });
        html += '</div>';
      });

      html += '<div class="section" style="margin-top:18px">';
      html += '<button class="btn primary" id="ss-new-channel">+ Create Channel</button>';
      html += '</div>';
      return html;
    }

    function wireChannels(){
      var nc = document.getElementById('ss-new-channel');
      if (nc) nc.onclick = function(){
        window.openAddChannel("Text Channels");
        // Re-render when the create modal closes
        var check = setInterval(function(){
          if (!document.getElementById('modal-root').innerHTML){
            clearInterval(check);
            sb.from('channels').select('*').eq('server_id', srv.id).order('position', { ascending: true })
              .then(function(r){
                window.CHANNELS = r.data || [];
                render();
              });
          }
        }, 250);
      };
      document.querySelectorAll('[data-ch-del]').forEach(function(b){
        b.onclick = function(){
          var ch = (window.CHANNELS || []).filter(function(c){ return c.id === b.dataset.chDel; })[0];
          if (!ch) return;
          window.confirmModal("Delete #" + ch.name + "?", "All messages in this channel will be deleted. This cannot be undone.", async function(){
            try {
              await sb.from('channels').delete().eq('id', ch.id);
              await window.loadChannels(srv.id);
              if (window.CURRENT.channel && window.CURRENT.channel.id === ch.id){
                var first = (window.CHANNELS || []).filter(function(c){ return c.type === 'text'; })[0] || (window.CHANNELS || [])[0];
                window.CURRENT.channel = first || null;
                if (first) await window.loadMessagesForChannel(first.id);
                window.renderAll();
              } else {
                window.renderPanel();
              }
              render();
            } catch(e){ window.toast("Error", e.message || String(e), "err"); }
          }, true);
        };
      });
      document.querySelectorAll('[data-ch-edit]').forEach(function(b){
        b.onclick = function(){
          var chId = b.dataset.chEdit;
          var ch = (window.CHANNELS || []).filter(function(c){ return c.id === chId; })[0];
          if (!ch) return;
          showInlineChannelEditor(chId);
        };
      });
    }

    function showInlineChannelEditor(chId){
      // Insert an editor under the channel row
      var btn = document.querySelector('[data-ch-edit="' + chId + '"]');
      if (!btn) return;
      var row = btn.closest('.ch-row');
      if (!row) return;
      // Toggle off if already open
      var existing = row.nextElementSibling;
      if (existing && existing.classList.contains('perm-editor')) {
        existing.remove();
        return;
      }
      // Remove any other open editor
      document.querySelectorAll('.perm-editor').forEach(function(el){ el.remove(); });

      var ch = (window.CHANNELS || []).filter(function(c){ return c.id === chId; })[0];
      var mode = ch.send_mode || 'everyone';
      var sendRoles = ch.send_roles || [];

      var roles = (window.ROLES || []);
      var roleHTML = roles.map(function(r){
        var checked = sendRoles.indexOf(r.id) >= 0 ? 'checked' : '';
        return '<label><input type="checkbox" data-role="' + r.id + '" ' + checked + '>' +
          '<span class="dot" style="background:' + esc(r.color) + '"></span>' +
          '<span>' + esc(r.name) + '</span></label>';
      }).join('');
      if (!roles.length) roleHTML = '<div style="padding-left:26px;font-size:12px;color:var(--text3)">You have no roles yet. Create some in the Roles tab first.</div>';

      var editor = document.createElement('div');
      editor.className = 'perm-editor';
      editor.innerHTML =
        '<div style="font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin-bottom:10px">' +
          'Who can send messages in #' + esc(ch.name) + '?' +
        '</div>' +
        '<div class="perm-block ' + (mode === 'everyone' ? 'sel' : '') + '" data-mode="everyone">' +
          '<div class="head"><span class="perm-rad"></span><b>Everyone in this server</b></div>' +
          '<div class="desc">Any member can post. Default for chat channels.</div>' +
        '</div>' +
        '<div class="perm-block ' + (mode === 'roles' ? 'sel' : '') + '" data-mode="roles">' +
          '<div class="head"><span class="perm-rad"></span><b>Specific roles only</b></div>' +
          '<div class="desc">Only members with one of the roles below can post.</div>' +
          '<div class="role-checks" style="display:' + (mode === 'roles' ? 'flex' : 'none') + '">' + roleHTML + '</div>' +
        '</div>' +
        '<div class="perm-block ' + (mode === 'owner' ? 'sel' : '') + '" data-mode="owner">' +
          '<div class="head"><span class="perm-rad"></span><b>Only the server owner</b></div>' +
          '<div class="desc">Announcements mode. Everyone can read, only you can write.</div>' +
        '</div>' +
        '<div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end">' +
          '<button class="btn sm" data-cancel>Cancel</button>' +
          '<button class="btn sm primary" data-save>Save</button>' +
        '</div>';

      row.insertAdjacentElement('afterend', editor);

      var currentMode = mode;
      editor.querySelectorAll('.perm-block').forEach(function(block){
        block.onclick = function(e){
          if (e.target.closest('.role-checks')) return;
          currentMode = block.dataset.mode;
          editor.querySelectorAll('.perm-block').forEach(function(b){ b.classList.remove('sel'); });
          block.classList.add('sel');
          var rc = block.querySelector('.role-checks');
          if (rc) rc.style.display = currentMode === 'roles' ? 'flex' : 'none';
        };
      });
      editor.querySelector('[data-cancel]').onclick = function(){ editor.remove(); };
      editor.querySelector('[data-save]').onclick = async function(){
        try {
          var picked = [];
          editor.querySelectorAll('.role-checks input[data-role]').forEach(function(cb){
            if (cb.checked) picked.push(cb.dataset.role);
          });
          var patch = {
            send_mode: currentMode,
            send_roles: currentMode === 'roles' ? picked : []
          };
          var { error } = await sb.from('channels').update(patch).eq('id', chId);
          if (error) throw error;
          Object.assign(ch, patch);
          window.renderPanel();
          window.renderChat(false);
          render();
          window.toast("Saved", "#" + ch.name + " updated.", "ok");
        } catch(e){ window.toast("Error", e.message || String(e), "err"); }
      };
    }

    // ==================== ROLES ====================
    function renderRoles(){
      var html = '';
      html += '<h2>Roles</h2>';
      html += '<div class="sub">Roles can be assigned to members and used to gate channel posting. Higher position = shown first.</div>';

      html += '<div class="section">';
      if (!(window.ROLES || []).length){
        html += '<div class="empty" style="padding:14px">No roles yet. Create your first one below.</div>';
      }
      (window.ROLES || []).forEach(function(r){
        html += '<div class="role-row">' +
          '<span class="swatch" style="background:' + esc(r.color) + '"></span>' +
          '<span class="name">' + esc(r.name) + '</span>' +
          '<span class="pos">pos ' + (r.position || 0) + '</span>' +
          '<button class="mini-btn" data-role-edit="' + r.id + '">Edit</button>' +
          '<button class="mini-btn danger" data-role-del="' + r.id + '">Delete</button>' +
        '</div>';
      });
      html += '</div>';

      html += '<div class="section">';
      html += '<h3>Create Role</h3>';
      html += '<div class="role-edit-form">';
      html += '<div class="grid">';
      html += '<input id="ss-new-role-name" placeholder="Role name, e.g. Moderator" maxlength="32">';
      html += '<input id="ss-new-role-color" value="#b44aff" maxlength="7" placeholder="#00ffe0">';
      html += '</div>';
      html += '<button class="btn primary" id="ss-create-role" style="margin-top:10px">Create Role</button>';
      html += '</div>';
      html += '</div>';
      return html;
    }

    function wireRoles(){
      document.querySelectorAll('[data-role-del]').forEach(function(b){
        b.onclick = async function(){
          var id = b.dataset.roleDel;
          var r = roleById(id);
          if (!r) return;
          window.confirmModal("Delete role " + r.name + "?", "Any members with this role will lose it. Channels gated to this role will no longer allow them to post.", async function(){
            try {
              await sb.from('server_roles').delete().eq('id', id);
              var resp = await sb.from('server_roles').select('*').eq('server_id', srv.id).order('position', { ascending: false });
              window.ROLES = resp.data || [];
              var resp2 = await sb.from('server_member_roles').select('*').eq('server_id', srv.id);
              var mr = {};
              (resp2.data || []).forEach(function(rr){
                if (!mr[rr.user_id]) mr[rr.user_id] = [];
                mr[rr.user_id].push(rr.role_id);
              });
              window.MEMBER_ROLES = mr;
              render();
              window.renderMembers();
              window.renderChat(false);
            } catch(e){ window.toast("Error", e.message || String(e), "err"); }
          }, true);
        };
      });
      document.querySelectorAll('[data-role-edit]').forEach(function(b){
        b.onclick = function(){
          var id = b.dataset.roleEdit;
          var r = roleById(id);
          if (!r) return;
          var row = b.closest('.role-row');
          var existing = row.nextElementSibling;
          if (existing && existing.classList.contains('role-edit-form')) { existing.remove(); return; }
          document.querySelectorAll('.role-edit-form').forEach(function(el){ el.remove(); });
          var form = document.createElement('div');
          form.className = 'role-edit-form';
          form.innerHTML =
            '<div class="grid">' +
              '<input id="ss-edit-name" value="' + esc(r.name) + '" maxlength="32">' +
              '<input id="ss-edit-color" value="' + esc(r.color) + '" maxlength="7">' +
            '</div>' +
            '<div style="display:flex;gap:8px;margin-top:10px">' +
              '<button class="btn sm" data-cancel>Cancel</button>' +
              '<button class="btn sm primary" data-save>Save</button>' +
            '</div>';
          row.insertAdjacentElement('afterend', form);
          form.querySelector('[data-cancel]').onclick = function(){ form.remove(); };
          form.querySelector('[data-save]').onclick = async function(){
            try {
              var patch = {
                name: document.getElementById('ss-edit-name').value.trim() || r.name,
                color: document.getElementById('ss-edit-color').value.trim() || r.color
              };
              await sb.from('server_roles').update(patch).eq('id', id);
              Object.assign(r, patch);
              render();
              window.renderMembers();
              window.renderChat(false);
              window.toast("Saved", "Role updated.", "ok");
            } catch(e){ window.toast("Error", e.message || String(e), "err"); }
          };
        };
      });
      var create = document.getElementById('ss-create-role');
      if (create) create.onclick = async function(){
        var name = document.getElementById('ss-new-role-name').value.trim();
        var color = document.getElementById('ss-new-role-color').value.trim() || '#b44aff';
        if (!name) return window.toast("Name required", "Give the role a name.", "err");
        try {
          await sb.from('server_roles').insert({ server_id: srv.id, name: name, color: color, position: 10 });
          var resp = await sb.from('server_roles').select('*').eq('server_id', srv.id).order('position', { ascending: false });
          window.ROLES = resp.data || [];
          render();
          window.renderMembers();
        } catch(e){ window.toast("Error", e.message || String(e), "err"); }
      };
    }

    // ==================== MEMBERS ====================
    function renderMembersTab(){
      var members = Object.keys(window.PROFILES).filter(function(uid){
        // Only show those who are actually in this server
        // We infer this from the member list rendered earlier, but to be safe use the loaded list
        return true;
      });
      // Better: use the members we fetched
      var actual = [];
      // Read from the visible member list DOM if present, else load server_members
      var el = document.getElementById('members');
      if (el){
        el.querySelectorAll('[data-member]').forEach(function(x){ actual.push(x.getAttribute('data-member')); });
      }
      // Fallback: fetch them
      if (!actual.length){
        // Fire and forget; caller likely already has them
      }

      var html = '';
      html += '<h2>Members</h2>';
      html += '<div class="sub">' + 'Assign roles, remove members. Members keep their own profile.</div>';

      html += '<div class="section" id="ss-members-list">';
      html += '<div class="empty" style="padding:14px">Loading members...</div>';
      html += '</div>';
      return html;
    }

    function wireMembersTab(){
      sb.from('server_members').select('user_id').eq('server_id', srv.id).then(function(r){
        var ids = (r.data || []).map(function(x){ return x.user_id; });
        return window.fetchProfiles(ids).then(function(){ return ids; });
      }).then(function(ids){
        var box = document.getElementById('ss-members-list');
        if (!box) return;
        ids.sort(function(a, b){
          if (a === srv.owner_id) return -1;
          if (b === srv.owner_id) return 1;
          return (window.userLabel(a) || '').localeCompare(window.userLabel(b) || '');
        });
        var html = '';
        ids.forEach(function(uid){
          var p = window.PROFILES[uid] || { username:'unknown', display_name:'Unknown' };
          var isOwner = uid === srv.owner_id;
          html += '<div class="mem-row">' +
            window.avatarHTML(uid, 36) +
            '<div class="meta"><div class="nm">' + esc(p.display_name || p.username) + '</div>' +
            '<div class="un">@' + esc(p.username) + '</div></div>' +
            '<div class="chips">' +
              (isOwner ? '<span class="owner-chip">Owner</span>' : '') +
              roleChipsHTML(uid) +
            '</div>' +
            (isOwner ? '' : '<button class="mini-btn" data-mem-roles="' + uid + '">Manage Roles</button>') +
          '</div>';
        });
        box.innerHTML = html || '<div class="empty">No members yet.</div>';
        document.querySelectorAll('[data-mem-roles]').forEach(function(b){
          b.onclick = function(){
            var uid = b.dataset.memRoles;
            window.openMemberRolesModal(uid);
            // Refresh chips after modal save
            var check = setInterval(function(){
              if (!document.getElementById('modal-root').innerHTML){
                clearInterval(check);
                sb.from('server_member_roles').select('*').eq('server_id', srv.id).then(function(resp){
                  var mr = {};
                  (resp.data || []).forEach(function(rr){
                    if (!mr[rr.user_id]) mr[rr.user_id] = [];
                    mr[rr.user_id].push(rr.role_id);
                  });
                  window.MEMBER_ROLES = mr;
                  render();
                  window.renderMembers();
                });
              }
            }, 250);
          };
        });
      });
    }

    // ==================== PERMISSIONS ====================
    function renderPermissions(){
      var html = '';
      html += '<h2>Permissions</h2>';
      html += '<div class="sub">A quick overview of who can post in each channel. Click Edit to change.</div>';
      html += '<div class="section">';

      var cats = [];
      (window.CHANNELS || []).forEach(function(ch){
        if (cats.indexOf(ch.category) < 0) cats.push(ch.category);
      });

      cats.forEach(function(cat){
        html += '<h3 style="margin-top:14px">' + esc(cat) + '</h3>';
        (window.CHANNELS || []).filter(function(ch){ return ch.category === cat; }).forEach(function(ch){
          var mm = modeMeta(ch.send_mode || 'everyone');
          var detail = '';
          if ((ch.send_mode || 'everyone') === 'roles' && (ch.send_roles || []).length){
            var names = (ch.send_roles || []).map(function(rid){ var r = roleById(rid); return r ? r.name : '?'; });
            detail = names.join(', ');
          }
          html += '<div class="ch-row" data-perm-row="' + ch.id + '">';
          html += '<svg class="ch-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">' +
                  '<path d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"/></svg>';
          html += '<span class="ch-name">' + esc(ch.name) + '</span>';
          if (detail) html += '<span style="font-size:11px;color:var(--text3)">' + esc(detail) + '</span>';
          html += '<span class="ch-mode ' + mm.cls + '">' + mm.label + '</span>';
          html += '<button class="mini-btn" data-perm-edit="' + ch.id + '">Edit</button>';
          html += '</div>';
        });
      });
      html += '</div>';
      return html;
    }

    function wirePermissions(){
      document.querySelectorAll('[data-perm-edit]').forEach(function(b){
        b.onclick = function(){ showInlineChannelEditor(b.dataset.permEdit); };
      });
    }

    // ==================== RENDER + MODAL ====================
    function render(){
      var body = document.getElementById('ss-body');
      if (!body) return;
      var nav =
        '<div class="ss-nav">' +
          '<div class="group">Community</div>' +
          '<button data-tab="overview"' + (tab === 'overview' ? ' class="active"' : '') + '>' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg>' +
            '<span>Overview</span></button>' +
          '<button data-tab="channels"' + (tab === 'channels' ? ' class="active"' : '') + '>' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"/></svg>' +
            '<span>Channels</span></button>' +
          '<button data-tab="roles"' + (tab === 'roles' ? ' class="active"' : '') + '>' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41 13.42 20.58a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><circle cx="7" cy="7" r="1.5"/></svg>' +
            '<span>Roles</span></button>' +
          '<button data-tab="members"' + (tab === 'members' ? ' class="active"' : '') + '>' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/></svg>' +
            '<span>Members</span></button>' +
          '<div class="group">Control</div>' +
          '<button data-tab="permissions"' + (tab === 'permissions' ? ' class="active"' : '') + '>' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>' +
            '<span>Permissions</span></button>' +
        '</div>';

      var content = '';
      if (tab === 'overview') content = renderOverview();
      else if (tab === 'channels') content = renderChannels();
      else if (tab === 'roles') content = renderRoles();
      else if (tab === 'members') content = renderMembersTab();
      else content = renderPermissions();

      body.innerHTML = '<div class="ss-shell">' + nav + '<div class="ss-content">' + content + '</div></div>';

      body.querySelectorAll('.ss-nav button').forEach(function(b){
        b.onclick = function(){ tab = b.dataset.tab; render(); };
      });

      if (tab === 'overview') wireOverview();
      else if (tab === 'channels') wireChannels();
      else if (tab === 'roles') wireRoles();
      else if (tab === 'members') wireMembersTab();
      else wirePermissions();
    }

    function openModalNow(){
      window.openModal("Server Settings — " + srv.name, '<div id="ss-body"></div>', {
        wide: true,
        footer: '<button class="btn" id="ss-close">Done</button>',
        onMount: function(){
          document.getElementById('ss-close').onclick = window.closeModal;
          render();
        }
      });
    }
  };

  // ---------------------------------------------------------------
  // Update the server menu to open Server Settings
  // ---------------------------------------------------------------
  var origOpenServerMenu = window.openServerMenu;
  window.openServerMenu = function(x, y){
    if (!window.CURRENT.server) return;
    var srv = window.CURRENT.server;
    var isOwner = srv.owner_id === window.ME.id;
    var isOfficial = !!srv.is_official;
    var items = [{ head: srv.name + (isOfficial ? " \u2605" : "") }];
    items.push({ id:"invite", label:"Invite People", icon: window.SVG.users, onClick: window.openInviteServer });
    if (isOwner){
      items.push({ id:"settings", label:"Server Settings", icon: window.SVG.gear, onClick: function(){
        window.openServerSettings(srv.id);
      }});
      if (!isOfficial){
        items.push({ sep:true });
        items.push({ id:"del", label:"Delete Server", icon: window.SVG.trash, danger:true, onClick: function(){
          window.confirmModal("Delete " + srv.name + "?", "All channels and messages will be deleted.", async function(){
            try { await window.deleteServer(srv.id); await window.loadServers(); await window.goHome(); window.toast("Deleted","Server removed.","ok"); }
            catch(e){ window.toast("Error", e.message || String(e), "err"); }
          }, true);
        }});
      }
    } else if (!isOfficial){
      items.push({ sep:true });
      items.push({ id:"leave", label:"Leave Server", icon: window.SVG.logout, danger:true, onClick: async function(){
        try { await window.leaveServer(srv.id); await window.loadServers(); await window.goHome(); window.toast("Left","You left " + srv.name + ".","ok"); }
        catch(e){ window.toast("Error", e.message || String(e), "err"); }
      }});
    }
    window.openMenu(x, y, items);
  };

  // ---------------------------------------------------------------
  // Channel header gear -> open Server Settings directly
  // ---------------------------------------------------------------
  document.addEventListener("click", function(e){
    var btn = e.target.closest('#chat-head [data-act="settings"]');
    if (!btn) return;
    if (!window.CURRENT || window.CURRENT.type !== "server" || !window.CURRENT.server) return;
    var srv = window.CURRENT.server;
    if (srv.owner_id !== window.ME.id) return; // non-owner keeps the user settings behaviour
    e.preventDefault(); e.stopImmediatePropagation(); e.stopPropagation();
    window.openServerSettings(srv.id);
  }, true);

  log("server settings hub ready");
})();
</script>

<script>
(function(){

  function log(){ try{console.log.apply(console,["[Verify]"].concat([].slice.call(arguments)));}catch(e){} }

  // ------------------------------------------------------------------

  // We just need to show a friendly toast.
  if (window.location.hash && window.location.hash.includes('access_token')) {
    // Clean the URL so the token isn't sitting in the address bar
    setTimeout(function(){
      window.history.replaceState(null, '', window.location.pathname);
    }, 800);
    setTimeout(function(){
      window.toast("Email verified", "Welcome to Sleepy-Chat! You're all set.", "ok");
    }, 600);
  }

  // ------------------------------------------------------------------
  // 2. Show an "unverified" banner if the user hasn't confirmed yet
  // ------------------------------------------------------------------
  async function checkVerification(){
    if (!window.ME || !window.ME.id) return;
    try {
      var { data, error } = await sb.rpc('is_email_confirmed', { uid: window.ME.id });
      if (error) { log("check error", error.message); return; }
      if (data === false) showBanner();
      else removeBanner();
    } catch(e){ log("verify check failed", e.message || e); }
  }

  function showBanner(){
    if (document.getElementById('verify-banner')) return;
    var banner = document.createElement('div');
    banner.id = 'verify-banner';
    banner.style.cssText =
      'position:fixed;top:0;left:0;right:0;z-index:900;' +
      'background:linear-gradient(90deg,#ffab00,#ff2d6f);' +
      'color:#0a0a0f;font-weight:600;font-size:13px;' +
      'display:flex;align-items:center;justify-content:center;gap:12px;' +
      'padding:8px 16px;box-shadow:0 4px 18px rgba(255,171,0,.35)';
    banner.innerHTML =
      '<span>Your email is not verified yet. Check your inbox.</span>' +
      '<button id="resend-verify" style="background:rgba(0,0,0,.85);color:#fff;border:none;' +
      'padding:5px 12px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer">Resend email</button>';
    document.body.appendChild(banner);

    document.getElementById('resend-verify').onclick = async function(){
      try {
        var { error } = await sb.auth.resend({ type: 'signup', email: window.SESSION.user.email });
        if (error) throw error;
        window.toast("Sent", "Verification email resent to " + window.SESSION.user.email, "ok");
      } catch(e){ window.toast("Error", e.message || String(e), "err"); }
    };
  }

  function removeBanner(){
    var b = document.getElementById('verify-banner');
    if (b) b.remove();
  }

  // Poll every 20 seconds while unverified
  setInterval(function(){
    if (window.ME) checkVerification();
  }, 20000);

  // Run once the app is ready
  var tries = 0;
  var t = setInterval(function(){
    tries++;
    if (window.ME && window.ME.id) {
      clearInterval(t);
      checkVerification();
    }
    if (tries > 120) clearInterval(t);
  }, 250);

  log("verification flow ready");
})();
</script>

<script>
(function(){
  "use strict";
  if (window.__sleepyAvatarFix) return;
  window.__sleepyAvatarFix = true;
  function log(){ try{console.log.apply(console,["[Avatar]"].concat([].slice.call(arguments)));}catch(e){} }

  // ---- 1. Add cache-buster to stored URLs so CDN doesn't serve stale 403 ----
  function bust(url){
    if (!url) return url;
    if (typeof url !== 'string') return url;
    if (url.indexOf('supabase.co/storage') < 0) return url;
    var sep = url.indexOf('?') >= 0 ? '&' : '?';
    return url + sep + 'v=' + Date.now();
  }

  // ---- 2. Global img error handler for avatars/banners ----
  // If an image fails to load (403/404), replace with initials fallback.
  document.addEventListener('error', function(e){
    var img = e.target;
    if (!img || img.tagName !== 'IMG') return;
    var parent = img.parentElement;
    if (!parent) return;
    if (!parent.classList.contains('avatar') && !parent.classList.contains('banner') && !parent.classList.contains('profile-banner') && !parent.classList.contains('ov-avatar')) return;
    log("image failed to load:", img.src);
    if (parent.classList.contains('avatar')){
      // Replace with initials
      var initial = (parent.dataset.initials || '?').toUpperCase().slice(0,2);
      parent.innerHTML = '<span>' + initial + '</span>';
    } else {
      // Banner fallback: leave the gradient
      parent.style.backgroundImage = '';
    }
  }, true);

  // ---- 3. Stash initials on avatars so the error handler knows what to fall back to
  var origAvatarHTML = window.avatarHTML;
  window.avatarHTML = function(uid, size){
    var html = origAvatarHTML(uid, size);
    var p = window.PROFILES && window.PROFILES[uid];
    var name = p ? (p.display_name || p.username || '?') : '?';
    var initials = name.trim().slice(0,2).toUpperCase();
    // Add data-initials to the .avatar div
    html = html.replace('class="avatar', 'data-initials="' + initials.replace(/"/g,'&quot;') + '" class="avatar');
    return html;
  };

  // ---- 4. After a successful upload, append a cache-buster before saving ----
  // Wrap uploadFile so any URL that comes back gets ?v=timestamp
  var origUploadFile = window.uploadFile;
  if (typeof origUploadFile === 'function'){
    window.uploadFile = async function(file, bucket){
      var result = await origUploadFile(file, bucket);
      if (result && result.url) result.url = bust(result.url);
      return result;
    };
  }

  // ---- 5. Diagnostic helper ----
  window.checkAvatar = async function(uid){
    uid = uid || window.ME.id;
    var p = window.PROFILES[uid];
    if (!p){ console.log("No profile for", uid); return; }
    console.log("avatar_url:", p.avatar_url);
    console.log("banner_url:", p.banner_url);
    if (p.avatar_url){
      try {
        var r = await fetch(p.avatar_url, { method: 'HEAD' });
        console.log("avatar HEAD status:", r.status, r.statusText);
      } catch(e){ console.log("avatar fetch error:", e.message); }
    }
    if (p.banner_url){
      try {
        var r2 = await fetch(p.banner_url, { method: 'HEAD' });
        console.log("banner HEAD status:", r2.status, r2.statusText);
      } catch(e){ console.log("banner fetch error:", e.message); }
    }
  };

  // ---- 6. Re-render after boot so existing broken images get retried ----
  var tries = 0;
  var t = setInterval(function(){
    tries++;
    if (window.ME && window.renderAll){
      clearInterval(t);
      try { window.renderAll(); } catch(e){}
    }
    if (tries > 80) clearInterval(t);
  }, 200);

  log("avatar display fix ready");
})();
</script>

<script>
(function(){
  "use strict";
  if (window.__sleepyPwa) return;
  window.__sleepyPwa = true;
  function log(){ try { console.log.apply(console, ["[PWA]"].concat([].slice.call(arguments))); } catch(e){} }

  // ---- 1. Register service worker (requires https:// or localhost) ----
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js', { scope: './' })
        .then(function(reg){ log("SW registered", reg.scope); })
        .catch(function(err){ log("SW failed:", err.message); });
    });
  } else if (location.protocol === 'file:') {
    log("Service worker skipped (file://)");
  }

  // ---- 2. Install prompt capture ----
  var deferred = null;
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferred = e;
    showInstallBanner();
  });

  function showInstallBanner(){
    if (document.getElementById('pwa-install')) return;
    if (localStorage.getItem('sleepy.install.dismissed') === '1') return;
    var el = document.createElement('div');
    el.id = 'pwa-install';
    el.innerHTML =
      '<img class="ico" src="./icon.svg" alt="">' +
      '<div class="txt"><b>Install Sleepy-Chat</b><small>Add to home screen for the full app experience.</small></div>' +
      '<button class="go" id="pwa-install-go">Install</button>' +
      '<button class="close" id="pwa-install-x" aria-label="Dismiss">\u00d7</button>';
    document.body.appendChild(el);
    document.getElementById('pwa-install-go').onclick = async function(){
      if (!deferred) return;
      deferred.prompt();
      var res = await deferred.userChoice;
      deferred = null;
      el.remove();
      if (res.outcome === 'accepted') log("user installed");
      else localStorage.setItem('sleepy.install.dismissed', '1');
    };
    document.getElementById('pwa-install-x').onclick = function(){
      localStorage.setItem('sleepy.install.dismissed', '1');
      el.remove();
    };
  }

  // ---- 3. Long-press gesture to replace right-click ----
  // Right-click has no equivalent on touchscreens. This makes long-press fire
  // the same contextmenu event so the existing menus work on Android.
  function installLongPress(){
    var activeTimer = null;
    var startX = 0, startY = 0;
    var target = null;
    var moveTolerance = 12;

    function fireContextMenu(el, x, y){
      // Visual feedback ring
      var ring = document.createElement('div');
      ring.className = 'lp-ring';
      ring.style.left = x + 'px';
      ring.style.top = y + 'px';
      document.body.appendChild(ring);
      setTimeout(function(){ ring.remove(); }, 500);

      // Haptic
      if (navigator.vibrate) try { navigator.vibrate(12); } catch(e){}

      el.classList.add('long-pressed');
      setTimeout(function(){ el.classList.remove('long-pressed'); }, 260);

      var ev = new MouseEvent('contextmenu', {
        bubbles: true, cancelable: true, view: window,
        clientX: x, clientY: y, button: 2
      });
      el.dispatchEvent(ev);
    }

    document.addEventListener('touchstart', function(e){
      if (e.touches.length !== 1) return;
      var t = e.touches[0];
      startX = t.clientX; startY = t.clientY;
      var el = e.target.closest('[data-member], [data-msg], [data-server]');
      if (!el) return;
      target = el;
      clearTimeout(activeTimer);
      activeTimer = setTimeout(function(){
        if (!target) return;
        fireContextMenu(target, startX, startY);
        target = null;
      }, 480);
    }, { passive: true });

    document.addEventListener('touchmove', function(e){
      if (!activeTimer) return;
      var t = e.touches[0];
      var dx = Math.abs(t.clientX - startX);
      var dy = Math.abs(t.clientY - startY);
      if (dx > moveTolerance || dy > moveTolerance) {
        clearTimeout(activeTimer); activeTimer = null; target = null;
      }
    }, { passive: true });

    document.addEventListener('touchend', function(){
      clearTimeout(activeTimer); activeTimer = null; target = null;
    }, { passive: true });
    document.addEventListener('touchcancel', function(){
      clearTimeout(activeTimer); activeTimer = null; target = null;
    }, { passive: true });
  }
  installLongPress();

  // ---- 4. Keep composer above keyboard ----
  // When the composer gets focus on mobile, scroll it into view once the
  // keyboard animation settles.
  document.addEventListener('focusin', function(e){
    if (e.target && e.target.id === 'composer-input'){
      setTimeout(function(){
        try { e.target.scrollIntoView({ block: 'end', behavior: 'smooth' }); } catch(err){}
      }, 260);
    }
  });

  // ---- 5. Mobile keyboard hint ----
  document.addEventListener('focusin', function(e){
    if (e.target && e.target.tagName === 'TEXTAREA'){
      e.target.setAttribute('enterkeyhint', 'send');
      e.target.setAttribute('autocorrect', 'on');
      e.target.setAttribute('autocapitalize', 'sentences');
      e.target.setAttribute('spellcheck', 'true');
    }
  });

  // ---- 6. Splash screen removal ----
  function removeSplash(){
    var s = document.getElementById('pwa-splash');
    if (!s) return;
    s.classList.add('gone');
    setTimeout(function(){ s.remove(); }, 450);
  }
  // Remove as soon as the app shows the auth or main screen
  var obs = new MutationObserver(function(){
    var app = document.getElementById('app');
    var auth = document.getElementById('auth-screen');
    if ((app && !app.classList.contains('hidden')) || (auth && !auth.classList.contains('hidden'))){
      removeSplash();
      obs.disconnect();
    }
  });
  obs.observe(document.body, { attributes: true, subtree: true, attributeFilter: ['class'] });
  // Safety net: always remove after 6s
  setTimeout(removeSplash, 6000);

  // ---- 7. Android hardware back button ----
  // Push a history entry so the first back press closes overlays instead of
  // leaving the app. On the second press it exits normally.
  history.pushState({ sleepy: true }, '');
  window.addEventListener('popstate', function(){
    // Close whatever's open, in priority order
    var modal = document.getElementById('modal-root');
    if (modal && modal.innerHTML){
      window.closeModal && window.closeModal();
    } else if (typeof window.closeMenu === 'function') {
      window.closeMenu();
    } else if (window.UI && (window.UI.panelOpen || window.UI.membersOpen)){
      window.UI.panelOpen = false;
      window.UI.membersOpen = false;
      if (window.syncMobile) window.syncMobile();
    }
    // Re-push so next back also gets intercepted
    history.pushState({ sleepy: true }, '');
  });

  // ---- 8. Prevent iOS-style rubber band on inputs ----
  document.addEventListener('touchmove', function(e){
    if (e.target.closest('textarea, input')) e.stopPropagation();
  }, { passive: true });

  log("PWA layer ready");
})();
</script>

<style>

<script>
(function(){
  "use strict";
  if (window.__sleepyVoiceVideo) return;
  window.__sleepyVoiceVideo = true;
  function log(){ try{console.log.apply(console,["[VC]"].concat([].slice.call(arguments)));}catch(e){} }

  window.callState = {
    channelId: null,
    localStream: null,
    peers: {},
    audioElements: {},
    videoElements: {},
    muted: false,
    deafened: false,
    videoOn: false,
    signalingChannel: null,
    presenceChannel: null,
    iceServers: null,
    videoGridVisible: false
  };

  async function getMedia(video){
    try {
      var stream = await navigator.mediaDevices.getUserMedia({
        audio: true,
        video: video ? { width: 640, height: 480 } : false
      });
      window.callState.localStream = stream;
      window.callState.videoOn = video;
      log("media acquired, video:", video);
      return stream;
    } catch(e){
      log("media error:", e.message);
      window.toast("Device access blocked", "Please allow mic and camera access.", "err");
      throw e;
    }
  }

  async function getIceServers(){
    if (window.callState.iceServers) return window.callState.iceServers;
    try {
      var session = await sb.auth.getSession();
      var token = session && session.data && session.data.session && session.data.session.access_token;
      var res = await fetch(SUPABASE_URL + "/functions/v1/turn-credentials", {
        method: "POST",
        headers: { "Authorization": "Bearer " + token, "apikey": SUPABASE_ANON_KEY }
      });
      if (!res.ok) throw new Error("TURN fetch failed: " + res.status);
      var data = await res.json();
      window.callState.iceServers = data.iceServers;
      return data.iceServers;
    } catch(e){
      log("fallback to STUN only:", e.message);
      var fallback = [{ urls: "stun:stun.l.google.com:19302" }];
      window.callState.iceServers = fallback;
      return fallback;
    }
  }

  window.joinVoice = async function(channelId, withVideo){
    if (window.callState.channelId === channelId) return;
    if (window.callState.channelId) await window.leaveVoice();

    log("joining call:", channelId, "video:", withVideo);
    window.callState.channelId = channelId;

    await getMedia(withVideo);
    var iceServers = await getIceServers();

    try {
      await sb.from("voice_participants").upsert({
        channel_id: channelId,
        user_id: window.ME.id,
        is_muted: false,
        is_deafened: false,
        is_video_on: withVideo
      });
    } catch(e){ log("participant insert failed:", e.message); }

    var sigName = "call-signal-" + channelId;
    window.callState.signalingChannel = sb.channel(sigName, {
      config: { broadcast: { self: false } }
    });

    window.callState.signalingChannel
      .on("broadcast", { event: "offer" }, async function(payload){
        log("received offer from:", payload.payload.from);
        await handleOffer(payload.payload.from, payload.payload.sdp, iceServers);
      })
      .on("broadcast", { event: "answer" }, async function(payload){
        log("received answer from:", payload.payload.from);
        var pc = window.callState.peers[payload.payload.from];
        if (pc) await pc.setRemoteDescription(new RTCSessionDescription(payload.payload.sdp));
      })
      .on("broadcast", { event: "ice-candidate" }, async function(payload){
        var pc = window.callState.peers[payload.payload.from];
        if (pc && payload.payload.candidate){
          try { await pc.addIceCandidate(new RTCIceCandidate(payload.payload.candidate)); } catch(e){ log("ICE add failed:", e.message); }
        }
      })
      .on("broadcast", { event: "leave-call" }, function(payload){
        log("peer left:", payload.payload.from);
        closePeer(payload.payload.from);
      })
      .on("broadcast", { event: "join-call" }, function(payload){
        var newPeerId = payload.payload.from;
        if (newPeerId === window.ME.id) return;
        if (!window.callState.peers[newPeerId]){
          log("new peer joined, creating offer:", newPeerId);
          createOffer(newPeerId, iceServers);
        }
      })
      .subscribe(async function(status){
        if (status === "SUBSCRIBED"){
          log("signaling channel ready");
          window.callState.signalingChannel.send({
            type: "broadcast", event: "join-call",
            payload: { from: window.ME.id, username: window.ME.username }
          });
        }
      });

    window.callState.presenceChannel = sb.channel("call-presence-" + channelId, {
      config: { presence: { key: window.ME.id } }
    });
    window.callState.presenceChannel
      .on("presence", { event: "sync" }, function(){
        var state = window.callState.presenceChannel.presenceState();
        for (var peerId in state){
          if (peerId !== window.ME.id && !window.callState.peers[peerId]){
            createOffer(peerId, iceServers);
          }
        }
      })
      .on("presence", { event: "leave" }, function(o){ closePeer(o.key); })
      .subscribe(async function(status){
        if (status === "SUBSCRIBED"){
          await window.callState.presenceChannel.track({
            user_id: window.ME.id,
            username: window.ME.username,
            at: new Date().toISOString()
          });
        }
      });

    renderVoiceDock();
    if (withVideo) renderVideoGrid();
    window.toast("Call joined", "You are now in the call.", "ok");
  };

  async function createOffer(peerId, iceServers){
    try {
      var pc = new RTCPeerConnection({ iceServers: iceServers });
      window.callState.peers[peerId] = pc;

      window.callState.localStream.getTracks().forEach(function(track){
        pc.addTrack(track, window.callState.localStream);
      });

      pc.ontrack = function(event){
        var stream = event.streams[0];
        if (stream.getAudioTracks().length){
          var audio = document.createElement("audio");
          audio.srcObject = stream;
          audio.autoplay = true;
          audio.id = "call-audio-" + peerId;
          document.body.appendChild(audio);
          window.callState.audioElements[peerId] = audio;
        }
        if (stream.getVideoTracks().length){
          var vid = document.createElement("video");
          vid.srcObject = stream;
          vid.autoplay = true;
          vid.playsInline = true;
          vid.id = "call-video-" + peerId;
          window.callState.videoElements[peerId] = vid;
          renderVideoGrid();
        }
        applyAudioState();
      };

      pc.onicecandidate = function(event){
        if (event.candidate){
          window.callState.signalingChannel.send({
            type: "broadcast", event: "ice-candidate",
            payload: { from: window.ME.id, candidate: event.candidate }
          });
        }
      };

      pc.onconnectionstatechange = function(){
        log("peer", peerId, "state:", pc.connectionState);
        if (pc.connectionState === "failed" || pc.connectionState === "disconnected") closePeer(peerId);
      };

      var offer = await pc.createOffer();
      await pc.setLocalDescription(offer);

      window.callState.signalingChannel.send({
        type: "broadcast", event: "offer",
        payload: { from: window.ME.id, sdp: pc.localDescription }
      });

      log("offer sent to:", peerId);
    } catch(e){ log("createOffer failed:", e.message); }
  }

  async function handleOffer(peerId, sdp, iceServers){
    try {
      var pc = new RTCPeerConnection({ iceServers: iceServers });
      window.callState.peers[peerId] = pc;

      window.callState.localStream.getTracks().forEach(function(track){
        pc.addTrack(track, window.callState.localStream);
      });

      pc.ontrack = function(event){
        var stream = event.streams[0];
        if (stream.getAudioTracks().length){
          var audio = document.createElement("audio");
          audio.srcObject = stream;
          audio.autoplay = true;
          audio.id = "call-audio-" + peerId;
          document.body.appendChild(audio);
          window.callState.audioElements[peerId] = audio;
        }
        if (stream.getVideoTracks().length){
          var vid = document.createElement("video");
          vid.srcObject = stream;
          vid.autoplay = true;
          vid.playsInline = true;
          vid.id = "call-video-" + peerId;
          window.callState.videoElements[peerId] = vid;
          renderVideoGrid();
        }
        applyAudioState();
      };

      pc.onicecandidate = function(event){
        if (event.candidate){
          window.callState.signalingChannel.send({
            type: "broadcast", event: "ice-candidate",
            payload: { from: window.ME.id, candidate: event.candidate }
          });
        }
      };

      await pc.setRemoteDescription(new RTCSessionDescription(sdp));
      var answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);

      window.callState.signalingChannel.send({
        type: "broadcast", event: "answer",
        payload: { from: window.ME.id, sdp: pc.localDescription }
      });
    } catch(e){ log("handleOffer failed:", e.message); }
  }

  function closePeer(peerId){
    var pc = window.callState.peers[peerId];
    if (pc){ try { pc.close(); } catch(e){} delete window.callState.peers[peerId]; }
    var audio = window.callState.audioElements[peerId];
    if (audio){ audio.remove(); delete window.callState.audioElements[peerId]; }
    var vid = window.callState.videoElements[peerId];
    if (vid){ vid.remove(); delete window.callState.videoElements[peerId]; }
    renderVideoGrid();
    log("closed peer:", peerId);
  }

  window.leaveVoice = async function(){
    log("leaving call");
    if (window.callState.signalingChannel){
      try {
        window.callState.signalingChannel.send({
          type: "broadcast", event: "leave-call",
          payload: { from: window.ME.id }
        });
      } catch(e){}
      sb.removeChannel(window.callState.signalingChannel);
      window.callState.signalingChannel = null;
    }
    if (window.callState.presenceChannel){
      try { await window.callState.presenceChannel.untrack(); } catch(e){}
      sb.removeChannel(window.callState.presenceChannel);
      window.callState.presenceChannel = null;
    }

    if (window.callState.channelId){
      try {
        await sb.from("voice_participants")
          .delete()
          .eq("channel_id", window.callState.channelId)
          .eq("user_id", window.ME.id);
      } catch(e){}
    }

    for (var peerId in window.callState.peers) closePeer(peerId);
    window.callState.peers = {};
    window.callState.audioElements = {};
    window.callState.videoElements = {};

    if (window.callState.localStream){
      window.callState.localStream.getTracks().forEach(function(t){ t.stop(); });
      window.callState.localStream = null;
    }

    window.callState.channelId = null;
    window.callState.videoOn = false;
    window.callState.videoGridVisible = false;
    var grid = document.getElementById("video-grid");
    if (grid) grid.remove();
    renderVoiceDock();
    if (window.renderChat) window.renderChat(false);
    window.toast("Call left", "You left the call.", "ok");
  };

  window.toggleMute = function(){
    var s = window.callState;
    if (!s.localStream) return;
    s.muted = !s.muted;
    s.localStream.getAudioTracks().forEach(function(t){ t.enabled = !s.muted; });
    if (s.channelId){
      sb.from("voice_participants").update({ is_muted: s.muted })
        .eq("channel_id", s.channelId).eq("user_id", window.ME.id).then(function(){});
    }
    renderVoiceDock();
    log("muted:", s.muted);
  };

  window.toggleDeafen = function(){
    var s = window.callState;
    s.deafened = !s.deafened;
    applyAudioState();
    renderVoiceDock();
    log("deafened:", s.deafened);
  };

  window.toggleVideo = function(){
    var s = window.callState;
    if (!s.localStream) return;
    s.videoOn = !s.videoOn;
    s.localStream.getVideoTracks().forEach(function(t){ t.enabled = s.videoOn; });
    if (s.channelId){
      sb.from("voice_participants").update({ is_video_on: s.videoOn })
        .eq("channel_id", s.channelId).eq("user_id", window.ME.id).then(function(){});
    }
    if (s.videoOn) renderVideoGrid();
    renderVoiceDock();
    log("video on:", s.videoOn);
  };

  function applyAudioState(){
    var deafened = window.callState.deafened;
    for (var id in window.callState.audioElements){
      window.callState.audioElements[id].muted = deafened;
    }
  }

  function renderVoiceDock(){
    var existing = document.getElementById("voice-dock");
    if (existing) existing.remove();
    if (!window.callState.channelId) return;

    var ch = window.CHANNELS ? window.CHANNELS.filter(function(c){ return c.id === window.callState.channelId; })[0] : null;
    var chName = ch ? ch.name : "call";
    var peers = Object.keys(window.callState.peers);

    var dock = document.createElement("div");
    dock.id = "voice-dock";
    dock.className = "voice-dock";
    dock.innerHTML =
      '<div class="live"><i></i>Call</div>' +
      '<div class="names">#' + chName + " - " + (peers.length + 1) + " connected</div>" +
      '<button id="call-mute" class="' + (window.callState.muted ? "on" : "") + '" title="Mute">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1M12 18v4M8 22h8"/></svg>' +
      "</button>" +
      '<button id="call-deafen" class="' + (window.callState.deafened ? "on" : "") + '" title="Deafen">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>' +
      "</button>" +
      '<button id="call-video" class="' + (window.callState.videoOn ? "on" : "") + '" title="Camera">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="m22 8-6 4 6 4V8z"/></svg>' +
      "</button>" +
      '<button id="call-leave" class="danger" title="Disconnect">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>' +
      "</button>";

    document.body.appendChild(dock);

    document.getElementById("call-mute").onclick = window.toggleMute;
    document.getElementById("call-deafen").onclick = window.toggleDeafen;
    document.getElementById("call-video").onclick = window.toggleVideo;
    document.getElementById("call-leave").onclick = window.leaveVoice;
  }

  function renderVideoGrid(){
    var grid = document.getElementById("video-grid");
    if (!window.callState.videoOn && Object.keys(window.callState.videoElements).length === 0){
      if (grid) grid.remove();
      return;
    }
    if (!grid){
      grid = document.createElement("div");
      grid.id = "video-grid";
      grid.className = "video-grid";
      grid.onclick = function(e){ if (e.target === grid){ grid.style.display = grid.style.display === "none" ? "flex" : "none"; } };
      document.body.appendChild(grid);
    }
    grid.style.display = "flex";

    var html = '<div class="tiles">';
    if (window.callState.localStream && window.callState.videoOn){
      html += '<div class="tile"><video id="local-video" autoplay playsinline muted></video><div class="label">You</div></div>';
    }
    for (var peerId in window.callState.videoElements){
      var p = window.PROFILES[peerId] || { display_name: "User" };
      html += '<div class="tile"><video id="remote-video-' + peerId + '" autoplay playsinline></video><div class="label">' + window.esc(p.display_name || p.username) + "</div></div>";
    }
    html += "</div>";
    grid.innerHTML = html;

    var localVideo = document.getElementById("local-video");
    if (localVideo && window.callState.localStream) localVideo.srcObject = window.callState.localStream;
    for (var pid in window.callState.videoElements){
      var el = document.getElementById("remote-video-" + pid);
      if (el) el.srcObject = window.callState.videoElements[pid].srcObject;
    }
  }

  log("voice & video chat ready");
})();
</script>

<!-- SLEEPY_VOICE_RENDER_FIX_V1 -->
<script>
(function(){
  "use strict";
  if (window.__sleepyVoiceRenderFix) return;
  window.__sleepyVoiceRenderFix = true;
  function log(){ try{console.log.apply(console,["[VRF]"].concat([].slice.call(arguments)));}catch(e){} }

  function isVoiceChannel(){
    return window.CURRENT && window.CURRENT.type === "server" && window.CURRENT.channel &&
      (window.CURRENT.channel.type === "voice" || window.CURRENT.channel.type === "video");
  }

  async function renderVoiceChannelUI(ch){
    var body = document.getElementById("chat-body");
    if (!body) return;

    var pIds = [];
    try {
      var resp = await sb.from("voice_participants").select("user_id").eq("channel_id", ch.id);
      pIds = (resp.data || []).map(function(r){ return r.user_id; });
      if (pIds.length) await window.fetchProfiles(pIds);
    } catch(e){ log("participant fetch failed:", e.message); }

    var pList = pIds.map(function(uid){
      var p = window.PROFILES[uid] || { username: "user", display_name: "User" };
      var isMe = uid === window.ME.id;
      var cs = window.callState || {};
      var muted = isMe && cs.muted;
      return '<div style="display:flex;flex-direction:column;align-items:center;gap:6px;width:80px">' +
        '<div style="position:relative">' + window.avatarHTML(uid, 52) +
          (muted ? '<span style="position:absolute;bottom:-2px;right:-2px;background:var(--rose);color:#fff;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:10px;border:2px solid var(--void)">M</span>' : "") +
        "</div>" +
        '<div style="font-size:11.5px;color:var(--text2);text-align:center;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + window.esc(p.display_name || p.username) + "</div>" +
      "</div>";
    }).join("");

    var isInChannel = window.callState && window.callState.channelId === ch.id;

    var html = '<div class="empty" style="margin-top:8vh;padding:20px">';

    html += '<div style="width:80px;height:80px;margin:0 auto 16px;border-radius:22px;' +
      "background:linear-gradient(135deg,rgba(0,255,224,.14),rgba(180,74,255,.14));" +
      'border:1px solid rgba(0,255,224,.28);display:flex;align-items:center;justify-content:center">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="#00ffe0" stroke-width="1.8" style="width:38px;height:38px">' +
        '<path d="M11 5 6 9H3v6h3l5 4V5z"/>' +
        '<path d="M15.5 8.5a5 5 0 0 1 0 7"/>' +
        '<path d="M18.5 5.5a9 9 0 0 1 0 13"/>' +
      "</svg>" +
    "</div>";

    html += "<h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:22px;color:var(--text);margin:0 0 8px\">" + window.esc(ch.name) + "</h2>";
    html += '<p style="font-size:13px;color:var(--text3);max-width:400px;margin:0 auto">' +
      (ch.topic ? window.esc(ch.topic) : "Voice and video channel. Join to talk, or start a video call.") + "</p>";

    if (pList){
      html += '<div style="display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:24px">' + pList + "</div>";
      html += '<div style="font-size:11.5px;color:var(--text3);margin-top:12px">' + pIds.length + " connected</div>";
    } else {
      html += '<div style="font-size:12.5px;color:var(--text3);margin-top:20px">Nobody is here yet.</div>';
    }

    html += '<div style="margin-top:26px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">';
    if (isInChannel){
      html += '<button class="btn danger" data-voice-action="leave">Leave Call</button>';
      html += '<button class="btn" data-voice-action="toggle-video">' +
        (window.callState.videoOn ? "Camera Off" : "Camera On") + "</button>";
    } else {
      html += '<button class="btn primary" data-voice-action="join-voice">Join Voice</button>';
      html += '<button class="btn primary" style="background:linear-gradient(135deg,#b44aff,#7c2fd6);color:#fff" data-voice-action="join-video">Join Video</button>';
    }
    html += "</div>";

    html += "</div>";
    body.innerHTML = html;

    var comp = document.getElementById("composer-wrap");
    if (comp) comp.innerHTML = "";
    var typ = document.getElementById("typing-bar");
    if (typ) typ.innerHTML = "";

    body.querySelectorAll("[data-voice-action]").forEach(function(btn){
      btn.onclick = function(){
        var a = btn.dataset.voiceAction;
        if (a === "join-voice") window.joinVoice(ch.id, false);
        else if (a === "join-video") window.joinVoice(ch.id, true);
        else if (a === "leave") window.leaveVoice();
        else if (a === "toggle-video") window.toggleVideo();
      };
    });
  }

  var origRenderChat = window.renderChat;
  window.renderChat = function(scroll){
    if (isVoiceChannel()){
      renderVoiceChannelUI(window.CURRENT.channel);
      return;
    }
    return origRenderChat(scroll);
  };

  // Refresh participant list every 4 seconds while viewing a voice channel
  setInterval(function(){
    if (!isVoiceChannel()) return;
    if (window.renderChat) window.renderChat(false);
  }, 4000);

  log("voice render fix ready");
})();
</script>

<script>
(function(){
  "use strict";
  if (window.__sleepyVoicePermission) return;
  window.__sleepyVoicePermission = true;
  function log(){ try{console.log.apply(console,["[Perm]"].concat([].slice.call(arguments)));}catch(e){} }

  // ---------- Modal helpers ----------
  function showModal(html){
    var bg = document.createElement('div');
    bg.className = 'perm-modal-bg';
    bg.innerHTML = '<div class="perm-modal">' + html + '</div>';
    document.body.appendChild(bg);
    bg.addEventListener('click', function(e){
      if (e.target === bg) bg.remove();
    });
    return bg;
  }
  function hideModal(bg){ if (bg) bg.remove(); }

  function iconMic(){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1M12 18v4M8 22h8"/></svg>';
  }
  function iconVideo(){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="m22 8-6 4 6 4V8z"/></svg>';
  }

  // ---------- Environment check ----------
  function isSecureContext(){
    // HTTPS or localhost count as secure. file:// and http:// (except localhost) do not.
    if (window.isSecureContext) return true;
    var h = location.hostname;
    if (h === 'localhost' || h === '127.0.0.1' || h === '::1') return true;
    return false;
  }

  function protocolLabel(){
    if (location.protocol === 'file:') return 'file://';
    if (location.protocol === 'http:') return 'http://';
    return location.protocol;
  }

  // ---------- Permission state check ----------
  async function getPermissionState(name){
    // name: 'microphone' or 'camera'
    try {
      if (!navigator.permissions || !navigator.permissions.query) return 'unknown';
      var result = await navigator.permissions.query({ name: name });
      return result.state; // 'granted' | 'denied' | 'prompt'
    } catch(e){ return 'unknown'; }
  }

  // ---------- The actual request ----------
  // This is what actually triggers the browser's native popup.
  // If the browser has "denied" cached, it will fail silently and we show instructions.
  async function requestMedia(video){
    var constraints = {
      audio: true,
      video: video ? { width: 640, height: 480 } : false
    };
    var stream = await navigator.mediaDevices.getUserMedia(constraints);
    return stream;
  }

  // ---------- The gate that runs before every join ----------
  window.requestVoicePermission = async function(withVideo){
    // 1) Secure context check
    if (!isSecureContext()){
      var bg1 = showModal(
        '<div class="icon">' + iconMic() + '</div>' +
        '<h3>Voice needs a secure connection</h3>' +
        '<p>Sleepy-Chat can only access your ' + (withVideo ? 'mic and camera' : 'microphone') + ' over <b>HTTPS</b> or <b>localhost</b>.</p>' +
        '<div class="warn">You are on <b>' + protocolLabel() + '</b> right now. Browsers block device access on this protocol for security.</div>' +
        '<p style="font-size:12px">Open the site from your GitHub Pages URL (which is HTTPS) or run a local server.</p>' +
        '<div class="actions"><button class="btn" id="pm-close">Close</button></div>'
      );
      bg1.querySelector('#pm-close').onclick = function(){ hideModal(bg1); };
      return null;
    }

    // 2) If API missing (very old browser)
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      var bg2 = showModal(
        '<div class="icon">' + iconMic() + '</div>' +
        '<h3>Browser not supported</h3>' +
        '<p>Your browser does not support microphone or camera access.</p>' +
        '<p style="font-size:12px">Try the latest Chrome, Edge, or Firefox on desktop or Android.</p>' +
        '<div class="actions"><button class="btn" id="pm-close">Close</button></div>'
      );
      bg2.querySelector('#pm-close').onclick = function(){ hideModal(bg2); };
      return null;
    }

    // 3) Check permission state
    var micState = await getPermissionState('microphone');
    var camState = withVideo ? await getPermissionState('camera') : 'granted';
    log("permission states - mic:", micState, "cam:", camState);

    // 4) If previously denied, show reset instructions
    if (micState === 'denied' || camState === 'denied'){
      var resetHtml =
        '<div class="icon">' + (withVideo ? iconVideo() : iconMic()) + '</div>' +
        '<h3>Access was blocked earlier</h3>' +
        '<p>Your browser remembers that you said "Block" for this site. It won\'t ask again until you reset it.</p>' +
        '<div class="warn"><b>How to reset:</b>' +
          '<br>1. Click the <b>lock</b> or <b>camera</b> icon in your address bar (left of the URL).' +
          '<br>2. Find <b>Microphone</b>' + (withVideo ? ' and <b>Camera</b>' : '') + ' and change it to <b>Allow</b>.' +
          '<br>3. Reload this page and try again.' +
        '</div>' +
        '<div class="actions">' +
          '<button class="btn primary" id="pm-retry">I reset it — try again</button>' +
          '<button class="btn" id="pm-close">Close</button>' +
        '</div>';
      var bg3 = showModal(resetHtml);
      bg3.querySelector('#pm-close').onclick = function(){ hideModal(bg3); };
      bg3.querySelector('#pm-retry').onclick = async function(){
        hideModal(bg3);
        // Try again fresh
        try {
          var s = await requestMedia(withVideo);
          return s;
        } catch(e){
          window.toast("Still blocked", "Check the browser settings for this site and reload.", "err");
          return null;
        }
      };
      return null;
    }

    // 5) Show a friendly pre-prompt so the user understands what happens next
    var bg4 = showModal(
      '<div class="icon">' + (withVideo ? iconVideo() : iconMic()) + '</div>' +
      '<h3>Allow ' + (withVideo ? 'camera and microphone' : 'microphone') + '?</h3>' +
      '<p>Sleepy-Chat is about to ask your browser for ' +
        (withVideo ? 'camera and microphone' : 'microphone') + ' access. ' +
        'This is used only for the voice call and never leaves your device until you join.</p>' +
      '<p style="font-size:12px;color:var(--text3)">Your browser will show a popup. Click <b>Allow</b>.</p>' +
      '<div class="actions">' +
        '<button class="btn primary" id="pm-go">Continue</button>' +
        '<button class="btn" id="pm-close">Cancel</button>' +
      '</div>'
    );
    var proceed = await new Promise(function(resolve){
      bg4.querySelector('#pm-go').onclick = function(){ hideModal(bg4); resolve(true); };
      bg4.querySelector('#pm-close').onclick = function(){ hideModal(bg4); resolve(false); };
    });
    if (!proceed) return null;

    // 6) Now actually request — this triggers the native browser prompt
    try {
      var stream = await requestMedia(withVideo);
      log("media acquired");
      return stream;
    } catch(err){
      log("getUserMedia failed:", err.name, err.message);

      // Map common errors to helpful messages
      var msg = "Could not start the call.";
      if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError'){
        msg = "You (or the browser) blocked access. Check the lock icon in the address bar.";
      } else if (err.name === 'NotFoundError'){
        msg = "No " + (withVideo ? "camera or microphone" : "microphone") + " found on this device.";
      } else if (err.name === 'NotReadableError'){
        msg = "Your device is busy. Close other apps using the " + (withVideo ? "camera" : "mic") + " and try again.";
      } else if (err.name === 'OverconstrainedError'){
        msg = "Your device doesn't support the requested video size.";
      } else if (err.name === 'SecurityError'){
        msg = "Browser blocked this due to security. Make sure the URL is HTTPS.";
      }

      window.toast("Could not start call", msg, "err");
      return null;
    }
  };

  // ---------- Override joinVoice to use the new permission flow ----------
  var origJoinVoice = window.joinVoice;
  if (typeof origJoinVoice === 'function'){
    window.joinVoice = async function(channelId, withVideo){
      // Ask first — the modal handles everything including the browser prompt
      var stream = await window.requestVoicePermission(withVideo);
      if (!stream){
        log("user cancelled or permission denied");
        return;
      }
      // Stash the stream so the original function reuses it instead of asking again
      if (!window.callState) window.callState = {};
      window.callState.localStream = stream;
      window.callState.videoOn = !!withVideo;

      // Now run the original join logic
      return origJoinVoice.call(this, channelId, withVideo);
    };
  }

  log("permission flow ready");
})();
</script>
