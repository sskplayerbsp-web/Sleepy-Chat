/* =========================================================
   MUSIC PLAYER (draggable, clamped, animated ball)
   ========================================================= */
var TRACKS=[
  {id:'jfKfPfyJRdk',title:'lofi hip hop radio',artist:'Lofi Girl'},
  {id:'5qap5aO4i9A',title:'lofi chill beats',artist:'Lofi Girl'},
  {id:'DWcJFNfaw9c',title:'chillhop essentials',artist:'Chillhop'},
  {id:'n61ULEU7CO0',title:'best of chill mix',artist:'Chill Nation'},
  {id:'dQw4w9WgXcQ',title:'never gonna give you up',artist:'Rick Astley'}
];
var MP={x:null,y:null,open:false,drag:null,moved:false};
var ytPlayer=null,ytReady=false,ytIndex=0,ytPlaying=false;

window.onYouTubeIframeAPIReady=function(){ytReady=true;if(MP.open)initYT();};

function mpEl(){return $("#music-player");}
function mpClamp(x,y){
  var el=mpEl();if(!el)return {x:x,y:y};
  var w=el.offsetWidth||56,h=el.offsetHeight||56,m=8;
  return {x:clamp(x,m,Math.max(m,window.innerWidth-w-m)),y:clamp(y,m,Math.max(m,window.innerHeight-h-m))};
}
function mpSetPos(x,y,save){
  var el=mpEl();if(!el)return;
  var p=mpClamp(x,y);
  el.style.left=p.x+'px';el.style.top=p.y+'px';el.style.right='auto';el.style.bottom='auto';
  MP.x=p.x;MP.y=p.y;
  if(save!==false){try{localStorage.setItem('quazi_mp_pos',JSON.stringify({x:p.x,y:p.y}));}catch(e){}}
}
function mpInitPos(){
  var el=mpEl();if(!el)return;
  var saved=null;
  try{saved=JSON.parse(localStorage.getItem('quazi_mp_pos')||'null');}catch(e){}
  if(saved&&typeof saved.x==='number'){
    mpSetPos(saved.x,saved.y,false);
  }else{
    var w=el.offsetWidth||56,h=el.offsetHeight||56;
    var bottomPad=isMobile()?80:20;
    mpSetPos(window.innerWidth-w-18,window.innerHeight-h-bottomPad,false);
  }
}
function mpToggle(force){
  var open=(force===undefined)?!MP.open:!!force;
  MP.open=open;
  var ball=$("#mp-ball"),panel=$("#mp-panel");
  var el=mpEl();
  var cx=el.getBoundingClientRect().left+(el.offsetWidth||56)/2;
  var cy=el.getBoundingClientRect().top+(el.offsetHeight||56)/2;
  ball.classList.toggle('hidden',open);
  panel.classList.toggle('hidden',!open);
  requestAnimationFrame(function(){
    var w=el.offsetWidth,h=el.offsetHeight;
    var x=cx-w/2,y=cy-h/2;
    mpSetPos(x,y,true);
    if(open)initYT();
  });
}
function mpDragStart(e){
  if(e.button!==undefined&&e.button!==0)return;
  var el=mpEl();
  var r=el.getBoundingClientRect();
  MP.drag={dx:e.clientX-r.left,dy:e.clientY-r.top,startX:e.clientX,startY:e.clientY};
  MP.moved=false;
  el.style.transition='none';
  document.addEventListener('pointermove',mpDragMove,{passive:false});
  document.addEventListener('pointerup',mpDragEnd);
}
function mpDragMove(e){
  if(!MP.drag)return;
  e.preventDefault();
  var dx=Math.abs(e.clientX-MP.drag.startX),dy=Math.abs(e.clientY-MP.drag.startY);
  if(dx>4||dy>4)MP.moved=true;
  mpSetPos(e.clientX-MP.drag.dx,e.clientY-MP.drag.dy,false);
}
function mpDragEnd(){
  if(!MP.drag)return;
  MP.drag=null;
  document.removeEventListener('pointermove',mpDragMove);
  document.removeEventListener('pointerup',mpDragEnd);
  if(MP.x!=null)mpSetPos(MP.x,MP.y,true);
}
function initYT(){
  if(ytPlayer||!ytReady||!window.YT||!window.YT.Player)return;
  ytPlayer=new YT.Player('yt-player',{
    height:'1',width:'1',
    videoId:TRACKS[ytIndex].id,
    playerVars:{autoplay:0,controls:0,disablekb:1,playsinline:1},
    events:{
      onReady:function(){mpRenderPanel();},
      onStateChange:function(ev){
        ytPlaying=(ev.data===1);
        var ball=$("#mp-ball");
        if(ball)ball.classList.toggle('spin',ytPlaying);
        mpUpdateUI();
      }
    }
  });
}
function mpPlayIndex(i){
  ytIndex=(i+TRACKS.length)%TRACKS.length;
  if(!ytPlayer){initYT();return;}
  try{
    ytPlayer.loadVideoById(TRACKS[ytIndex].id);
    ytPlaying=true;
  }catch(e){}
  mpRenderPanel();
  setTimeout(mpUpdateUI,300);
}
function mpRenderPanel(){
  var box=$("#mp-tracks");if(!box)return;
  $("#mp-play").innerHTML=ytPlaying?SVG.pause:SVG.play;
  $("#mp-prev").innerHTML=SVG.prev;
  $("#mp-next").innerHTML=SVG.next;
  var t=TRACKS[ytIndex];
  $("#mp-title").textContent=t.title;
  $("#mp-artist").textContent=t.artist;
  box.innerHTML=TRACKS.map(function(tr,i){
    return '<button class="mp-track '+(i===ytIndex?'playing':'')+'" data-mptrack="'+i+'" type="button"><span class="mp-num">'+(i+1)+'</span>'+
      '<span class="mp-ttl">'+esc(tr.title)+'<small>'+esc(tr.artist)+'</small></span>'+
      (i===ytIndex?'<span>🔊</span>':'')+'</button>';
  }).join('');
  $$('[data-mptrack]').forEach(function(b){
    b.onclick=function(e){e.stopPropagation();mpPlayIndex(parseInt(b.dataset.mptrack,10));};
  });
  var ball=$("#mp-ball");
  if(ball)ball.classList.toggle('spin',ytPlaying);
}
function mpUpdateUI(){
  var p=$("#mp-play");
  if(p)p.innerHTML=ytPlaying?SVG.pause:SVG.play;
  var ball=$("#mp-ball");
  if(ball)ball.classList.toggle('spin',ytPlaying);
  mpRenderPanel();
}
function mpInit(){
  var el=mpEl();if(!el)return;
  mpInitPos();
  $("#mp-ball").addEventListener('pointerdown',function(e){
    mpDragStart(e);
  });
  $("#mp-ball").addEventListener('click',function(e){
    if(MP.moved){MP.moved=false;return;}
    mpToggle(true);
  });
  $("#mp-dragbar").addEventListener('pointerdown',mpDragStart);
  $("#mp-close").addEventListener('pointerdown',function(e){e.stopPropagation();});
  $("#mp-close").addEventListener('click',function(e){e.stopPropagation();mpToggle(false);});
  $("#mp-play").onclick=function(){
    if(!ytPlayer){initYT();return;}
    try{
      if(ytPlaying)ytPlayer.pauseVideo();
      else ytPlayer.playVideo();
    }catch(e){}
  };
  $("#mp-prev").onclick=function(){mpPlayIndex(ytIndex-1);};
  $("#mp-next").onclick=function(){mpPlayIndex(ytIndex+1);};
  mpRenderPanel();
  window.addEventListener('resize',function(){
    if(MP.x!=null)mpSetPos(MP.x,MP.y,false);
  });
  window.addEventListener('orientationchange',function(){
    setTimeout(function(){if(MP.x!=null)mpSetPos(MP.x,MP.y,false);},250);
  });
}

    openModal('Edit message','<div class="field"><textarea id="em-text">'+esc(m.content)+'</textarea></div>',{
      footer:'<button class="btn" id="em-c" type="button">Cancel</button><button class="btn primary" id="em-s" type="button">Save</button>',
      onMount:function(){
        $("#em-c").onclick=closeModal;
        $("#em-s").onclick=async function(){
          try{await editMessage(id,$("#em-text").value.trim());closeModal();}catch(err){toast('Error',err.message,'err');}
        };
      }});
    return;
  }
  var delBtn=t.closest('[data-del]');
  if(delBtn){
    var did=delBtn.dataset.del;
    confirmModal('Delete message','This cannot be undone.',async function(){
      try{await deleteMessage(did);}catch(err){toast('Error',err.message,'err');}
    },true);
    return;
  }

  /* user click */
  var userEl=t.closest('[data-user]');
  if(userEl){openProfile(userEl.dataset.user);return;}

  /* actions */
  var actEl=t.closest('[data-act]');
  if(actEl){
    var act=actEl.dataset.act;
    if(act==='toggle-panel'){togglePanelMobile();return;}
    if(act==='toggle-members'){UI.showMembers=!UI.showMembers;renderAll();return;}
    if(act==='settings'){openSettings();return;}
    if(act==='logout'){confirmModal('Sign out','Sign out of Quazi Chat?',doLogout,true);return;}
    if(act==='my-profile'){openProfile(ME.id);return;}
    if(act==='friends'){openFriends();return;}
    if(act==='find'){openFind();return;}
    if(act==='newgroup'){openNewGroup();return;}
    if(act==='shop'){openShop();return;}
    if(act==='daily'){claimDaily();return;}
    if(act==='ai-chat'){openAI();return;}
    if(act==='invite-server'){openInviteModal();return;}
    if(act==='delete-server'){
      confirmModal('Delete server','Delete "'+CURRENT.server.name+'"? This removes all channels.',async function(){
        try{await deleteServer(CURRENT.server.id);await loadServers();await goHome();toast('Server deleted','','ok');}
        catch(err){toast('Error',err.message,'err');}
      },true);
      return;
    }
    if(act==='leave-server'){
      confirmModal('Leave server','Leave "'+CURRENT.server.name+'"?',async function(){
        try{await leaveServer(CURRENT.server.id);await loadServers();await goHome();toast('Left server','','ok');}
        catch(err){toast('Error',err.message,'err');}
      },true);
      return;
    }
    if(act==='delete-channel'){
      if(!CURRENT.channel)return;
      confirmModal('Delete channel','Delete #'+CURRENT.channel.name+'?',async function(){
        try{await deleteChannel(CURRENT.channel.id);await loadChannels(CURRENT.server.id);CURRENT.channel=null;MESSAGES=[];renderAll();toast('Channel deleted','','ok');}
        catch(err){toast('Error',err.message,'err');}
      },true);
      return;
    }
    if(act==='start-call'){
      openCallPicker(actEl.dataset.user);
      return;
    }
    if(act==='view-profile'){openProfile(actEl.dataset.user);return;}
    if(act==='vc-audio'){
      if(!CURRENT.channel)return;
      await joinCall('ch:'+CURRENT.channel.id,{video:false});
      return;
    }
    if(act==='vc-video'){
      if(!CURRENT.channel)return;
      await joinCall('ch:'+CURRENT.channel.id,{video:true});
      return;
    }
    return;
  }

  /* auth tabs */
  var tab=t.closest('[data-tab]');
  if(tab){
    $$('.tab').forEach(function(x){x.classList.remove('active');});
    tab.classList.add('active');
    if(tab.dataset.tab==='login'){
      $("#form-login").classList.remove('hidden');
      $("#form-signup").classList.add('hidden');
    }else{
      $("#form-login").classList.add('hidden');
      $("#form-signup").classList.remove('hidden');
    }
    return;
  }
});

function openCreateServer(){
  openModal('➕ Create a Community',
    '<div class="field"><label>Server name</label><input id="cs-name" maxlength="40" placeholder="My Squad"></div>'+
    '<p style="font-size:11.5px;color:var(--text3)">Servers start with 1 text channel and 1 voice channel. You can add up to 3 text and 1 voice channel total.</p>'+
    '<div class="err" id="cs-err"></div>',
    {footer:'<button class="btn" id="cs-c" type="button">Cancel</button><button class="btn primary" id="cs-go" type="button">Create</button>',
    onMount:function(){
      $("#cs-c").onclick=closeModal;
      $("#cs-go").onclick=async function(){
        try{
          var s=await createServer($("#cs-name").value);
          closeModal();
          renderRail();
          await goServer(s.id);
          toast('Server created!','','ok');
        }catch(err){$("#cs-err").textContent=err.message||String(err);}
      };
    }});
}
function openCreateChannel(category){
  var isVoice=String(category||'').toLowerCase().indexOf('voice')>=0;
  openModal('➕ Create Channel',
    '<div class="field"><label>Channel type</label><select id="cc-type"><option value="text" '+(isVoice?'':'selected')+'>Text channel</option><option value="voice" '+(isVoice?'selected':'')+'>Voice channel</option></select></div>'+
    '<div class="field"><label>Name</label><input id="cc-name" placeholder="new-channel"></div>'+
    '<div class="err" id="cc-err"></div>',
    {footer:'<button class="btn" id="cc-c" type="button">Cancel</button><button class="btn primary" id="cc-go" type="button">Create</button>',
    onMount:function(){
      $("#cc-c").onclick=closeModal;
      $("#cc-go").onclick=async function(){
        var type=$("#cc-type").value;
        var cat=type==='voice'?'Voice Channels':'Text Channels';
        try{
          await createChannel(CURRENT.server.id,$("#cc-name").value,type,cat);
          await loadChannels(CURRENT.server.id);
          closeModal();
          renderPanel();
          toast('Channel created','','ok');
        }catch(err){$("#cc-err").textContent=err.message||String(err);}
      };
    }});
}

/* =========================================================
   AUTH FORM WIRING
   ========================================================= */
$("#form-login").addEventListener('submit',async function(e){
  e.preventDefault();
  var err=$("#li-err");err.textContent='';
  var btn=$("#li-submit");btn.disabled=true;btn.textContent='Signing in...';
  try{
    await doLogin($("#li-email").value.trim(),$("#li-pass").value);
  }catch(ex){err.textContent=ex.message||String(ex);}
  btn.disabled=false;btn.textContent='Sign In';
});
$("#form-signup").addEventListener('submit',async function(e){
  e.preventDefault();
  var err=$("#su-err");err.textContent='';
  var ok=$("#su-ok");ok.textContent='';
  if($("#su-pass").value!==$("#su-confirm").value){err.textContent='Passwords do not match.';return;}
  var btn=$("#su-submit");btn.disabled=true;btn.textContent='Creating...';
  try{
    await doSignup($("#su-email").value.trim(),$("#su-pass").value,$("#su-username").value,$("#su-display").value.trim());
    ok.textContent='Account created! Check your email if confirmation is required, then log in.';
  }catch(ex){err.textContent=ex.message||String(ex);}
  btn.disabled=false;btn.textContent='Create Account';
});
$("#google-login").addEventListener('click',async function(){
  try{await doGoogleLogin();}catch(e){toast('Google login failed',e.message,'err');}
});
$("#guest-login").addEventListener('click',doGuestLogin);

/* =========================================================
   BOOT
   ========================================================= */
async function boot(){
  showApp();
  await loadMe();
  if(!ME){toast('Profile error','Could not load your profile','err');return;}
  loadWallet();loadShop();
  if(EQUIPPED.theme&&EQUIPPED.theme.theme)applyTheme(EQUIPPED.theme.theme);
  await loadFriends();
  await loadServers();
  await loadConversations();
  subscribeGlobalMessages();
  subscribePresence();
  subscribeFriendships();
  subscribeServers();
  subscribeChallenges();
  renderAll();
  if(CONVERSATIONS.length)await goConversation(CONVERSATIONS[0].id);
  else renderAll();
}

(async function(){
  mpInit();
  try{
    var s=await sb.auth.getSession();
    SESSION=s.data.session||null;
  }catch(e){SESSION=null;}
  if(SESSION&&SESSION.user){
    await boot();
  }else{
    showAuth();
  }
  sb.auth.onAuthStateChange(async function(event,session){
    if(event==='SIGNED_IN'&&session&&(!ME||ME.id!==session.user.id)){
      SESSION=session;
      await boot();
    }
    if(event==='SIGNED_OUT'){showAuth();}
  });
})();

if(window.visualViewport){
  window.visualViewport.addEventListener('resize',function(){
    if(MP.x!=null)mpSetPos(MP.x,MP.y,false);
  });
}
