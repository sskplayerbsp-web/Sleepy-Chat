<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Quazi Chat — Built By Gen-Z For Gen-Z</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3CradialGradient id='g'%3E%3Cstop offset='0%25' stop-color='%2300ffe0'/%3E%3Cstop offset='100%25' stop-color='%23b44aff'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='42' fill='url(%23g)'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--void:#0a0a0f;--surface:#12121a;--surface2:#1a1a26;--surface3:#22222f;--border:#2a2a3a;--border2:#3a3a4d;--accent:#00ffe0;--accent2:#00c9b4;--purple:#b44aff;--rose:#ff2d6f;--green:#00e676;--amber:#ffab00;--text:#e8e8f0;--text2:#8f8fa8;--text3:#5a5a72;--glow:0 0 14px rgba(0,255,224,.35);--ease:cubic-bezier(.22,.61,.36,1)}
[data-theme="purple"]{--accent:#b44aff;--accent2:#8a2dd6;--glow:0 0 14px rgba(180,74,255,.4)}
[data-theme="pink"]{--accent:#ff2d6f;--accent2:#d6005a;--glow:0 0 14px rgba(255,45,111,.4)}
[data-theme="green"]{--accent:#00e676;--accent2:#00b85c;--glow:0 0 14px rgba(0,230,118,.4)}
[data-theme="orange"]{--accent:#ff9500;--accent2:#d67a00;--glow:0 0 14px rgba(255,149,0,.4)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',system-ui,sans-serif;font-size:14px;background:var(--void);color:var(--text);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(900px 600px at 12% -10%,rgba(0,255,224,.06),transparent 60%),radial-gradient(900px 700px at 95% 110%,rgba(180,74,255,.07),transparent 60%)}
button,input,textarea,select{font:inherit;color:inherit;outline:none;border:none;background:none}
button{cursor:pointer;touch-action:manipulation}
a{color:var(--accent);text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#2c2c3d;border-radius:99px}::-webkit-scrollbar-thumb:hover{background:#40405a}
.hidden{display:none!important}
h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:8px;font-weight:600;font-size:13px;background:var(--surface2);color:var(--text);border:1px solid var(--border);transition:all .18s var(--ease);white-space:nowrap}
.btn:hover{background:var(--surface3);border-color:var(--border2);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04120f;border-color:transparent;font-weight:700}
.btn.primary:hover{box-shadow:var(--glow)}
.btn.danger{background:rgba(255,45,111,.12);color:#ff7aa2;border-color:rgba(255,45,111,.35)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text2)}
.btn.ghost:hover{background:var(--surface2);color:var(--text)}
.btn.sm{padding:6px 11px;font-size:12px}.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3)}
.field input,.field textarea,.field select{width:100%;padding:11px 13px;border-radius:8px;background:var(--void);border:1px solid var(--border);color:var(--text);transition:border-color .18s,box-shadow .18s}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,255,224,.12)}
.field .hint{font-size:11px;color:var(--text3)}.field .hint.ok{color:var(--green)}.field .hint.err{color:var(--rose)}
.err,.ok{font-size:12.5px;border-radius:8px;transition:all .2s;min-height:0}
.err:not(:empty){padding:10px 13px;background:rgba(255,45,111,.12);border:1px solid rgba(255,45,111,.35);color:#ff8aa8;font-weight:500;margin-top:12px}
.ok:not(:empty){padding:10px 13px;background:rgba(0,230,118,.1);border:1px solid rgba(0,230,118,.3);color:#8affb8;font-weight:500;margin-top:12px}
.avatar{border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;color:#06120f;overflow:hidden;position:relative;user-select:none}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.status-dot{width:11px;height:11px;border-radius:50%;border:2.5px solid var(--surface);position:absolute;right:-1px;bottom:-1px}
.s-online{background:var(--green);box-shadow:0 0 8px rgba(0,230,118,.7)}
.s-idle{background:var(--amber)}.s-dnd{background:var(--rose)}.s-offline{background:#4a4a5e}
.pill-owner{background:rgba(255,171,0,.15);color:var(--amber);font-size:9px;padding:1px 6px;border-radius:99px;text-transform:uppercase;font-weight:700;letter-spacing:.05em;margin-left:5px}
.guest-badge{font-size:9px;padding:1px 6px;border-radius:99px;background:rgba(255,171,0,.15);color:var(--amber);text-transform:uppercase;font-weight:700;letter-spacing:.05em;margin-left:5px;vertical-align:middle}
.auth-screen{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;overflow-y:auto;background:radial-gradient(700px 500px at 20% 10%,rgba(0,255,224,.1),transparent 60%),radial-gradient(700px 500px at 85% 90%,rgba(180,74,255,.13),transparent 60%),var(--void)}
.stars{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.stars::before,.stars::after{content:'';position:absolute;inset:0;background-image:radial-gradient(1.5px 1.5px at 10% 20%,rgba(255,255,255,.8),transparent),radial-gradient(1px 1px at 30% 60%,rgba(0,255,224,.6),transparent),radial-gradient(1.5px 1.5px at 50% 30%,rgba(255,255,255,.7),transparent);animation:starTwinkle 4s ease-in-out infinite alternate}
.stars::after{animation-delay:-2s}
@keyframes starTwinkle{0%{opacity:.35}100%{opacity:1}}
.auth-card{position:relative;z-index:1;width:100%;max-width:440px;background:rgba(18,18,26,.92);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:20px;padding:36px 30px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.brand{text-align:center;margin-bottom:26px}
.brand-mark{width:76px;height:76px;margin:0 auto 16px;border-radius:24px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(0,255,224,.16),rgba(180,74,255,.16));border:1px solid rgba(0,255,224,.3);animation:markPulse 3s ease-in-out infinite}
.brand-mark svg{width:44px;height:44px}
@keyframes markPulse{0%,100%{box-shadow:0 0 20px rgba(0,255,224,.35)}50%{box-shadow:0 0 40px rgba(0,255,224,.6),0 0 70px rgba(180,74,255,.45)}}
.brand h1{font-size:30px;letter-spacing:.05em;font-weight:800}
.brand h1 span{color:var(--accent);text-shadow:0 0 22px rgba(0,255,224,.6)}
.tagline{display:flex;flex-wrap:wrap;justify-content:center;gap:1px;font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;margin-top:14px;line-height:1.6}
.tagline .tchar{display:inline-block;background:linear-gradient(135deg,#00ffe0,#b44aff,#ff2d6f,#00ffe0,#b44aff);background-size:400% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:charPop .7s cubic-bezier(.34,1.56,.64,1) both,gradientShift 4s linear infinite;animation-delay:calc(var(--i) * 35ms),0s}
.tagline .tspace{display:inline-block;width:7px}
@keyframes charPop{0%{opacity:0;transform:translateY(16px) scale(.3) rotate(-15deg)}60%{opacity:1;transform:translateY(-3px) scale(1.18) rotate(3deg)}100%{opacity:1;transform:none}}
@keyframes gradientShift{0%{background-position:0% 50%}100%{background-position:400% 50%}}
.tabs{display:flex;gap:4px;background:var(--void);padding:4px;border-radius:10px;margin-bottom:22px;border:1px solid var(--border)}
.tab{flex:1;padding:10px;border-radius:7px;font-size:13px;font-weight:600;color:var(--text3);transition:all .2s}
.tab.active{background:var(--surface2);color:var(--accent);box-shadow:inset 0 0 0 1px rgba(0,255,224,.22)}
.divider{display:flex;align-items:center;gap:12px;color:var(--text3);font-size:10.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;margin:18px 0}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.google-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px;border-radius:8px;background:#fff;color:#1f1f1f;font-weight:600;font-size:13.5px;border:1px solid #ddd;transition:all .18s}
.google-btn:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(255,255,255,.15)}
.google-btn svg{width:18px;height:18px}
.app{position:relative;z-index:1;display:grid;grid-template-columns:74px 260px 1fr 240px;height:100vh;height:100dvh}
.app.hide-members{grid-template-columns:74px 260px 1fr}
.app>*{min-height:0;min-width:0}
.rail{background:linear-gradient(180deg,#0c0c13,#0a0a0f);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0;overflow-y:auto;overflow-x:hidden}
.rail-sep{width:34px;height:1px;background:var(--border);flex:none;margin:3px 0}
.rail-btn{position:relative;width:48px;height:48px;flex:none;border-radius:16px;display:flex;align-items:center;justify-content:center;background:var(--surface);color:var(--accent);transition:all .22s var(--ease);overflow:hidden;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px}
.rail-btn:hover{border-radius:14px;box-shadow:var(--glow);transform:translateY(-2px)}
.rail-btn.active{border-radius:14px;box-shadow:var(--glow)}
.rail-btn.active::before{content:'';position:absolute;left:-10px;top:50%;transform:translateY(-50%);width:4px;height:26px;border-radius:0 4px 4px 0;background:var(--accent);box-shadow:var(--glow)}
.rail-btn img{width:100%;height:100%;object-fit:cover}
.rail-btn svg{width:22px;height:22px}
.rail-btn.dashed{background:transparent;border:1.5px dashed rgba(0,255,224,.35)}
.rail-btn.dashed:hover{border-style:solid;background:rgba(0,255,224,.1)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--rose);color:#fff;font-size:10px;font-weight:700}
.panel{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column}
.panel-head{height:50px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--border);font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;cursor:pointer}
.panel-head:hover{background:var(--surface2)}
.panel-head .ttl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel-body{flex:1;min-height:0;overflow-y:auto;padding:10px 8px 14px}
.panel-section{margin-bottom:16px}
.panel-label{padding:6px 8px;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);display:flex;align-items:center;gap:6px}
.panel-label .add{margin-left:auto;opacity:0;transition:opacity .15s;cursor:pointer;width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--text3)}
.panel-label:hover .add{opacity:1}
.panel-label .add:hover{background:rgba(255,255,255,.07);color:var(--accent)}
.row{position:relative;display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:8px;cursor:pointer;color:var(--text2);font-size:13.5px;font-weight:500;transition:background .14s,color .14s;width:100%;text-align:left}
.row:hover{background:rgba(255,255,255,.045);color:var(--text)}
.row.active{background:var(--surface2);color:#fff}
.row.active::before{content:'';position:absolute;left:-8px;top:50%;transform:translateY(-50%);width:3px;height:60%;border-radius:0 3px 3px 0;background:var(--accent);box-shadow:var(--glow)}
.row .txt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{font-size:11px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.row svg{width:16px;height:16px;flex:none;opacity:.75}
.user-bar{flex:none;height:60px;display:flex;align-items:center;gap:9px;padding:0 10px;background:rgba(10,10,15,.55);border-top:1px solid var(--border)}
.user-bar .info{flex:1;min-width:0;cursor:pointer;border-radius:6px;padding:3px 5px;transition:background .15s}
.user-bar .info:hover{background:rgba(255,255,255,.05)}
.user-bar .nm{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-bar .uid{font-size:10.5px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-bar .ctl{width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:all .15s}
.user-bar .ctl:hover{background:rgba(255,255,255,.07);color:var(--accent)}
.user-bar .ctl svg{width:16px;height:16px}
.chat{display:flex;flex-direction:column;background:var(--void);position:relative}
.chat-head{height:50px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--border);background:rgba(10,10,15,.7);backdrop-filter:blur(12px)}
.chat-head .title{display:flex;align-items:center;gap:8px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;min-width:0}
.chat-head .title svg{width:18px;height:18px;flex:none;opacity:.75}
.chat-head .title .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-head .topic{font-size:12px;color:var(--text3);border-left:1px solid var(--border);padding-left:10px;margin-left:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-head .spacer{flex:1}
.chat-head .hbtn{width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:all .15s}
.chat-head .hbtn:hover{background:var(--surface2);color:var(--accent)}
.chat-head .hbtn svg{width:17px;height:17px}
.chat-body{flex:1;min-height:0;overflow-y:auto;padding:16px 0 8px}
.empty{padding:40px 20px;text-align:center;color:var(--text3);font-size:13px}
.empty .big{width:64px;height:64px;margin:0 auto 12px;border-radius:20px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(0,255,224,.14),rgba(180,74,255,.14));border:1px solid rgba(0,255,224,.22)}
.empty .big svg{width:30px;height:30px;color:var(--accent)}
.empty h2{font-size:20px;color:var(--text);margin-bottom:6px;font-family:'Space Grotesk'}
.msg{position:relative;display:flex;gap:13px;padding:4px 20px;transition:background .12s}
.msg:hover{background:rgba(255,255,255,.022)}
.msg .body{flex:1;min-width:0}
.msg .head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.msg .author{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;cursor:pointer}
.msg .author:hover{text-decoration:underline}
.msg .uid{font-size:10.5px;color:var(--text3);background:rgba(0,255,224,.07);padding:1px 6px;border-radius:5px;font-family:ui-monospace,monospace}
.msg .time{font-size:10.5px;color:var(--text3);font-family:ui-monospace,monospace}
.msg .edited{font-size:10px;color:var(--text3)}
.msg .content{font-size:14px;color:#dcdce8;word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap;margin-top:1px}
.msg.deleted .content{color:var(--text3);font-style:italic}
.msg .toolbar{position:absolute;top:-12px;right:22px;display:none;align-items:center;gap:1px;background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:2px;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:5}
.msg:hover .toolbar{display:flex}
.msg .toolbar button{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:all .13s}
.msg .toolbar button:hover{background:rgba(0,255,224,.12);color:var(--accent)}
.msg .toolbar button.danger:hover{background:rgba(255,45,111,.15);color:#ff7aa2}
.msg .toolbar svg{width:15px;height:15px}
.day-sep{display:flex;align-items:center;gap:12px;padding:14px 20px 8px;color:var(--text3);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.day-sep::before,.day-sep::after{content:'';flex:1;height:1px;background:var(--border)}
.typing-bar{flex:none;height:22px;padding:0 20px;font-size:12px;color:var(--text3);display:flex;align-items:center;gap:7px}
.dots{display:inline-flex;gap:3px}
.dots i{width:4px;height:4px;border-radius:50%;background:var(--accent);display:block;animation:tdot 1.3s infinite}
.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}
@keyframes tdot{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-3px);opacity:1}}
.composer-wrap{flex:none;padding:0 20px 18px;position:relative}
.composer{display:flex;align-items:flex-end;gap:6px;padding:9px 11px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;transition:border-color .2s,box-shadow .2s}
.composer:focus-within{border-color:rgba(0,255,224,.4);box-shadow:0 0 0 3px rgba(0,255,224,.07)}
.composer textarea{flex:1;resize:none;max-height:190px;min-height:22px;font-size:14px;line-height:1.5;padding:3px 0;background:none}
.composer textarea::placeholder{color:var(--text3)}
.composer .cbtn{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--text3);transition:all .15s;flex:none;font-size:17px}
.composer .cbtn:hover{background:rgba(255,255,255,.07);color:var(--accent)}
.composer .cbtn svg{width:17px;height:17px}
.composer .send{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04120f;border-radius:8px;width:32px;height:32px}
.composer .send:hover{box-shadow:var(--glow);color:#04120f}
.emoji-picker{position:absolute;bottom:64px;right:12px;width:320px;max-height:260px;overflow-y:auto;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:8px;display:grid;grid-template-columns:repeat(8,1fr);gap:2px;box-shadow:0 20px 50px rgba(0,0,0,.7);z-index:10}
.emoji-picker button{width:100%;aspect-ratio:1;border-radius:6px;font-size:20px;display:flex;align-items:center;justify-content:center;transition:all .1s;line-height:1}
.emoji-picker button:hover{background:var(--surface3);transform:scale(1.12)}
.members{background:var(--surface);border-left:1px solid var(--border);overflow-y:auto;padding:14px 10px}
.app.hide-members .members{display:none}
.mgroup{margin-bottom:18px}
.mgroup .glabel{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);padding:0 8px 7px}
.member{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;cursor:pointer;transition:background .14s}
.member:hover{background:rgba(255,255,255,.05)}
.member.offline{opacity:.5}
.member .nm{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.member .uid{font-size:11px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.overlay{position:fixed;inset:0;z-index:300;background:rgba(4,4,8,.75);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.modal{width:100%;max-width:520px;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:0 30px 90px rgba(0,0,0,.7);max-height:88vh;display:flex;flex-direction:column;animation:mIn .26s var(--ease) both}
.modal.wide{max-width:680px}
@keyframes mIn{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}
.modal-head{flex:none;display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:17px}
.modal-body{padding:22px;overflow-y:auto;flex:1}
.modal-foot{flex:none;display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--border);background:rgba(0,0,0,.15)}
.xbtn{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text3);transition:all .15s}
.xbtn:hover{background:var(--surface2);color:var(--text)}
.xbtn svg{width:18px;height:18px}
#toasts{position:fixed;top:20px;right:20px;z-index:500;display:flex;flex-direction:column;gap:9px;pointer-events:none}
.toast{pointer-events:auto;min-width:230px;max-width:340px;padding:12px 15px;background:rgba(26,26,38,.97);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:10px;font-size:13px;box-shadow:0 14px 40px rgba(0,0,0,.6);animation:tInTop .3s var(--ease) both;backdrop-filter:blur(12px)}
@keyframes tInTop{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
.toast.err{border-left-color:var(--rose)}.toast.ok{border-left-color:var(--green)}
.toast .tt{font-weight:700;font-size:12.5px;margin-bottom:2px}
.toast .tb{color:var(--text2);font-size:12.5px}
.mobile-only{display:none}
/* DRAGGABLE MUSIC PLAYER */
.music-player{position:fixed;bottom:20px;right:20px;z-index:380;font-family:'Inter',sans-serif;cursor:grab;touch-action:none}
.music-player.dragging{cursor:grabbing;transition:none}
.mp-collapsed{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--purple));color:#04120f;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 10px 30px rgba(0,255,224,.4);transition:all .2s;animation:mpPulse 2.4s ease-in-out infinite;pointer-events:auto}
.mp-collapsed:hover{transform:scale(1.08)}
@keyframes mpPulse{0%,100%{box-shadow:0 10px 30px rgba(0,255,224,.4)}50%{box-shadow:0 10px 40px rgba(0,255,224,.75),0 0 60px rgba(180,74,255,.45)}}
.mp-expanded{width:340px;background:rgba(18,18,26,.98);border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:0 20px 60px rgba(0,0,0,.7);backdrop-filter:blur(20px);animation:mIn .2s var(--ease) both;cursor:default}
.mp-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.mp-art{width:56px;height:56px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--purple));display:flex;align-items:center;justify-content:center;font-size:24px;flex:none;overflow:hidden;background-size:cover;background-position:center}
.mp-info{flex:1;min-width:0}
.mp-title{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-artist{font-size:12px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-controls{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:12px}
.mp-controls button{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:all .15s}
.mp-controls button:hover{background:var(--surface2);color:var(--accent)}
.mp-controls button svg{width:18px;height:18px}
.mp-controls .mp-play{width:46px;height:46px;background:linear-gradient(135deg,var(--accent),var(--purple));color:#04120f}
.mp-controls .mp-play:hover{transform:scale(1.06);box-shadow:0 0 20px rgba(0,255,224,.5)}
.mp-controls .mp-play svg{width:22px;height:22px}
.mp-actions{display:flex;gap:6px;padding-top:12px;border-top:1px solid var(--border);flex-wrap:wrap}
.mp-actions button{flex:1;min-width:0;padding:7px 8px;border-radius:7px;font-size:11.5px;font-weight:600;background:var(--surface2);color:var(--text2);transition:all .15s;display:flex;align-items:center;justify-content:center;gap:5px}
.mp-actions button:hover{background:var(--surface3);color:var(--accent)}
.mp-actions button.spotify{background:rgba(30,215,96,.12);color:#1ed760}
.mp-tracks{max-height:220px;overflow-y:auto;margin-top:8px;border-top:1px solid var(--border);padding-top:8px}
.mp-track{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:7px;cursor:pointer;font-size:12.5px;transition:background .12s}
.mp-track:hover{background:rgba(255,255,255,.05)}
.mp-track.playing{background:rgba(0,255,224,.08);color:var(--accent)}
.mp-track .mp-num{width:16px;color:var(--text3);font-size:11px;font-variant-numeric:tabular-nums;text-align:center;flex:none}
.mp-track .mp-ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mp-track .mp-ttl small{color:var(--text3);display:block;font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mp-hidden{position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0;pointer-events:none}
/* VOICE / CALL BAR */
.voice-bar{position:fixed;top:0;left:0;right:0;z-index:390;background:linear-gradient(135deg,rgba(0,255,224,.14),rgba(180,74,255,.14));border-bottom:1px solid var(--accent);padding:10px 16px;display:flex;align-items:center;gap:12px;backdrop-filter:blur(20px);font-size:13px}
.voice-bar .vb-info{flex:1;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.voice-bar .vb-avatars{display:flex;gap:-8px}
.voice-bar .vb-avatars>*{margin-left:-8px}
.voice-bar .vb-name{font-weight:700;color:var(--accent)}
.voice-bar .vb-participants{color:var(--text2);font-size:12px}
.voice-bar button{padding:7px 12px;border-radius:8px;font-weight:600;font-size:12px;background:var(--surface2);border:1px solid var(--border);color:var(--text);transition:all .15s}
.voice-bar button:hover{background:var(--surface3);border-color:var(--accent)}
.voice-bar button.danger{background:rgba(255,45,111,.15);color:#ff7aa2;border-color:rgba(255,45,111,.4)}
.voice-bar button.muted{background:rgba(255,45,111,.15);color:#ff7aa2;border-color:rgba(255,45,111,.4)}
/* CALL MODAL */
.call-modal{text-align:center;padding:30px 20px}
.call-modal .call-avatar{width:100px;height:100px;margin:0 auto 18px;position:relative;animation:callRing 1s infinite}
@keyframes callRing{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.call-modal .call-name{font-size:22px;font-weight:800;font-family:'Space Grotesk';margin-bottom:6px}
.call-modal .call-status{color:var(--text2);font-size:14px;margin-bottom:24px}
.call-modal .call-actions{display:flex;gap:16px;justify-content:center}
.call-modal .call-btn{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;transition:all .15s}
.call-modal .call-btn.accept{background:linear-gradient(135deg,#00e676,#00b85c);color:#fff;animation:callRing 1.5s infinite}
.call-modal .call-btn.decline{background:linear-gradient(135deg,#ff2d6f,#d6005a);color:#fff}
.call-modal .call-btn:hover{transform:scale(1.08)}
/* GAMES */
.games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.game-card{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;transition:all .15s;cursor:pointer;color:var(--text)}
.game-card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:var(--glow)}
.game-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.game-score{font-family:'Space Grotesk';font-weight:800;font-size:22px;color:var(--accent)}
.game-timer{font-family:ui-monospace,monospace;font-size:13px;color:var(--text2)}
.fish-pond{position:relative;height:340px;background:linear-gradient(180deg,#062a3a,#0a1020);border-radius:14px;overflow:hidden;cursor:crosshair;border:1px solid var(--border)}
.fish-item{position:absolute;font-size:30px;cursor:pointer;user-select:none;transition:transform .1s;z-index:2}
.fish-item:hover{transform:scale(1.25)}
.ttt-grid{display:grid;grid-template-columns:repeat(3,90px);grid-gap:6px;justify-content:center;margin:20px auto}
.ttt-cell{width:90px;height:90px;border-radius:12px;background:var(--surface2);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;font-family:'Space Grotesk';cursor:pointer;transition:all .15s;color:var(--text)}
.ttt-cell:hover{background:var(--surface3);border-color:var(--accent)}
.ttt-cell.win{background:rgba(0,230,118,.15);border-color:var(--green);color:var(--green)}
.rps-choices{display:flex;gap:14px;justify-content:center;margin:22px 0;flex-wrap:wrap}
.rps-btn{width:88px;height:88px;font-size:42px;border-radius:16px;background:var(--surface2);border:2px solid var(--border);cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center}
.rps-btn:hover{border-color:var(--accent);transform:scale(1.08);box-shadow:var(--glow)}
.rps-result{font-size:16px;font-weight:700;text-align:center;min-height:24px;margin:12px 0;color:var(--accent)}
.rps-scoreline{display:flex;justify-content:center;gap:22px;font-family:'Space Grotesk';font-size:18px;font-weight:700;margin-top:8px}
.memory-grid{display:grid;grid-template-columns:repeat(4,74px);gap:8px;justify-content:center;margin:14px 0}
.mem-card{width:74px;height:74px;border-radius:10px;background:var(--surface2);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:32px;cursor:pointer;transition:transform .2s;user-select:none}
.mem-card.flipped{background:var(--surface3);border-color:var(--accent)}
.mem-card.matched{background:rgba(0,230,118,.15);border-color:var(--green);cursor:default;opacity:.7}
.reaction-pad{height:240px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk';font-weight:800;font-size:24px;cursor:pointer;text-align:center;padding:20px;transition:background .1s}
.reaction-pad.wait{background:#c0392b;color:#fff}
.reaction-pad.go{background:#27ae60;color:#fff}
.reaction-pad.idle{background:var(--surface2);color:var(--text2);border:2px dashed var(--border)}
.snake-grid{display:grid;grid-template-columns:repeat(15,22px);gap:1px;justify-content:center;margin:14px 0;padding:6px;background:var(--void);border-radius:10px;border:1px solid var(--border)}
.snake-cell{width:22px;height:22px;background:var(--surface2);border-radius:2px}
.snake-cell.head{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.snake-cell.body{background:var(--accent2)}
.snake-cell.food{background:var(--rose);border-radius:50%;animation:snakePulse 1s infinite}
@keyframes snakePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
/* BROWSER */
.browser-tabs{display:flex;gap:4px;background:var(--void);padding:4px;border-radius:10px;margin-bottom:12px;border:1px solid var(--border)}
.browser-tab{flex:1;padding:9px;border-radius:7px;font-size:13px;font-weight:600;color:var(--text3);transition:all .15s;cursor:pointer;text-align:center}
.browser-tab.active{background:var(--surface2);color:var(--accent);box-shadow:inset 0 0 0 1px rgba(0,255,224,.22)}
.browser-bar{display:flex;gap:6px;margin-bottom:12px}
.browser-bar input{flex:1;padding:11px 13px;border-radius:8px;background:var(--void);border:1px solid var(--border);color:var(--text)}
.browser-bar input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(0,255,224,.12)}
.browser-frame{width:100%;height:440px;border-radius:12px;border:1px solid var(--border);background:#fff}
.browser-quick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.browser-quick a{padding:7px 11px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);color:var(--text2);font-size:12px;font-weight:600;transition:all .15s}
.browser-quick a:hover{background:var(--surface3);color:var(--accent);border-color:var(--accent)}
/* INVITES */
.invite-card{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px}
.invite-card .pub{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
.invite-card .priv{font-size:12px;color:var(--amber);margin-top:3px}
.invite-card .meta{font-size:11px;color:var(--text3);margin-top:6px;display:flex;flex-wrap:wrap;gap:10px}
.invite-card .code{margin-top:8px;font-family:ui-monospace,monospace;font-size:11px;background:var(--void);padding:6px 10px;border-radius:6px;color:var(--accent);word-break:break-all}
.perm-check{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.perm-check label{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);cursor:pointer;font-size:12.5px;transition:all .15s}
.perm-check label.checked{border-color:var(--accent);background:rgba(0,255,224,.08);color:var(--accent)}
.perm-check input{width:14px;height:14px;accent-color:var(--accent)}
/* AI */
.ai-msg{padding:10px 12px;border-radius:12px;margin-bottom:8px;font-size:14px;line-height:1.55;max-width:88%;white-space:pre-wrap;word-wrap:break-word}
.ai-msg.user{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04120f;margin-left:auto;border-bottom-right-radius:4px}
.ai-msg.assistant{background:var(--surface2);border:1px solid var(--border);border-bottom-left-radius:4px}
.ai-msg.typing{color:var(--text3);font-style:italic}
.ai-input-row{display:flex;gap:8px;margin-top:14px}
.ai-input-row input{flex:1;padding:11px 13px;border-radius:8px;background:var(--void);border:1px solid var(--border);color:var(--text)}
.ai-input-row input:focus{border-color:var(--accent);outline:none}
/* SHOP */
.wallet-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:99px;background:linear-gradient(135deg,rgba(255,215,0,.15),rgba(255,171,0,.1));border:1px solid rgba(255,215,0,.3);font-size:12px;font-weight:700;color:#ffd700;cursor:pointer;transition:all .15s}
.wallet-pill:hover{background:linear-gradient(135deg,rgba(255,215,0,.25),rgba(255,171,0,.2));transform:translateY(-1px)}
.shop-tabs{display:flex;gap:4px;background:var(--void);padding:4px;border-radius:10px;border:1px solid var(--border);margin-bottom:18px;overflow-x:auto}
.shop-tab{flex:none;padding:8px 14px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--text3);transition:all .15s;white-space:nowrap;cursor:pointer}
.shop-tab.active{background:var(--surface2);color:var(--accent);box-shadow:inset 0 0 0 1px rgba(0,255,224,.2)}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.shop-card{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;transition:all .15s;cursor:pointer}
.shop-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.shop-card.owned{opacity:.7}
.shop-card.rarity-rare{border-color:rgba(0,255,224,.4)}
.shop-card.rarity-epic{border-color:rgba(180,74,255,.5);box-shadow:0 0 15px rgba(180,74,255,.15)}
.shop-card.rarity-legendary{border-color:rgba(255,215,0,.5);box-shadow:0 0 20px rgba(255,215,0,.2)}
.shop-preview{height:80px;display:flex;align-items:center;justify-content:center;font-size:32px;background:var(--void);border-radius:8px;position:relative;overflow:hidden}
.shop-name{font-weight:700;font-size:13px}
.shop-desc{font-size:11px;color:var(--text3);line-height:1.4}
.shop-price{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;color:#ffd700;margin-top:auto;min-height:22px}
.shop-price .owned-tag{color:var(--green);font-size:10px;text-transform:uppercase}
.shop-price .equip-tag{color:var(--accent);font-size:10px;text-transform:uppercase}
.badge-icon{font-size:14px;margin-left:4px;vertical-align:middle}
/* EFFECTS */
.fx-glow{box-shadow:0 0 15px var(--accent),0 0 30px var(--accent);animation:fxGlowPulse 2s ease-in-out infinite}
@keyframes fxGlowPulse{0%,100%{box-shadow:0 0 15px var(--accent),0 0 30px var(--accent)}50%{box-shadow:0 0 25px var(--accent),0 0 50px var(--accent)}}
.fx-sparkle{position:relative}
.fx-sparkle::before,.fx-sparkle::after{content:'✨';position:absolute;font-size:16px;animation:fxSparkleOrbit 3s linear infinite;pointer-events:none;z-index:1}
.fx-sparkle::after{animation-delay:-1.5s;content:'⭐';font-size:12px}
@keyframes fxSparkleOrbit{0%{top:0;left:0;opacity:1}25%{top:0;left:100%;opacity:.7}50%{top:100%;left:100%;opacity:1}75%{top:100%;left:0;opacity:.7}100%{top:0;left:0;opacity:1}}
.fx-flame{position:relative;animation:fxFlameShake .15s infinite}
.fx-flame::before{content:'🔥';position:absolute;font-size:22px;bottom:-10px;left:50%;transform:translateX(-50%);animation:fxFlameFloat 1.2s ease-in-out infinite alternate;z-index:1}
@keyframes fxFlameShake{0%,100%{transform:translate(0,0)}50%{transform:translate(-1px,-1px)}}
@keyframes fxFlameFloat{from{transform:translateX(-50%) scaleY(1);opacity:1}to{transform:translateX(-50%) scaleY(1.15) translateY(-4px);opacity:.85}}
.fx-rainbow{padding:3px;background:linear-gradient(90deg,red,orange,yellow,green,blue,indigo,violet,red);background-size:400% 100%;animation:fxRainbow 3s linear infinite;border-radius:50%}
.fx-rainbow>*{border-radius:50%}
@keyframes fxRainbow{0%{background-position:0% 50%}100%{background-position:400% 50%}}
.fx-glitch{position:relative;animation:fxGlitch 2.5s infinite}
@keyframes fxGlitch{0%,90%,100%{transform:none;filter:none}92%{transform:translate(-2px,0);filter:hue-rotate(90deg)}94%{transform:translate(2px,0);filter:hue-rotate(-90deg)}96%{transform:translate(-1px,1px)}}
.name-anim{background-size:400% 100%!important;-webkit-background-clip:text!important;background-clip:text!important;-webkit-text-fill-color:transparent!important;animation:nameGradient 3s linear infinite!important}
@keyframes nameGradient{0%{background-position:0% 50%}100%{background-position:400% 50%}}
@media (max-width:1050px){.app,.app.hide-members{grid-template-columns:74px 240px 1fr}.members{position:fixed;right:0;top:0;bottom:0;width:250px;transform:translateX(100%);transition:transform .28s;z-index:80;box-shadow:-20px 0 50px rgba(0,0,0,.5)}}
@media (max-width:760px){
.app,.app.hide-members{grid-template-columns:1fr;padding-bottom:calc(60px + env(safe-area-inset-bottom))}
.mobile-only{display:flex}
.rail{position:fixed;left:0;right:0;bottom:0;top:auto;height:calc(60px + env(safe-area-inset-bottom));width:auto;flex-direction:row;border-right:none;border-top:1px solid var(--border);padding:0 10px env(safe-area-inset-bottom);gap:8px;z-index:60;overflow-x:auto}
.rail-sep{width:1px;height:30px;margin:0 2px}
.rail-btn{width:42px;height:42px;border-radius:13px}
.panel{position:fixed;left:0;top:0;bottom:calc(60px + env(safe-area-inset-bottom));width:280px;z-index:70;transform:translateX(-100%);transition:transform .28s var(--ease);box-shadow:20px 0 50px rgba(0,0,0,.6)}
.panel.open{transform:none}
.composer-wrap{padding:0 10px 10px}
.msg{padding:4px 12px}
.msg .toolbar{right:12px;display:flex;opacity:.6}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:65}
.music-player{bottom:calc(70px + env(safe-area-inset-bottom));right:12px}
.mp-expanded{width:calc(100vw - 24px);max-width:340px}
.emoji-picker{width:calc(100vw - 40px);max-width:320px;right:10px}
.btn,.row,.rail-btn,.game-card,.ttt-cell,.mem-card,.rps-btn{min-height:44px}
.ttt-cell{width:80px;height:80px;font-size:38px}
.memory-grid{grid-template-columns:repeat(4,68px)}
.mem-card{width:68px;height:68px}
.fish-pond{height:280px}
.modal{max-height:92vh}
.browser-frame{height:360px}
.voice-bar{padding:8px 12px;font-size:12px;flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  }catch(e){}
}

async function doSignup(email,password,username,display){
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))throw new Error("Enter a valid email.");
  username=String(username||"").trim().toLowerCase();
  if(!/^[a-z0-9_]{3,24}$/.test(username))throw new Error("Username must be 3-24 chars: a-z, 0-9, underscore.");
  if(!password||password.length<6)throw new Error("Password must be at least 6 characters.");
  var ex=await sb.from('profiles').select('id').eq('username',username).maybeSingle();
  if(ex.data)throw new Error("That username is already taken.");
  var {data,error}=await sb.auth.signUp({email:email,password:password,options:{data:{username:username,display_name:display||username}}});
  if(error)throw error;return data;
}

async function loadMe(){
  for(var attempt=0;attempt<10;attempt++){
    var {data,error}=await sb.from('profiles').select('*').eq('id',SESSION.user.id).maybeSingle();
    if(error){log("loadMe",error);return;}
    if(data){ME=data;PROFILES[ME.id]=ME;return;}
    if(attempt===0){
      var meta=SESSION.user.user_metadata||{};
      var rawName=meta.username||meta.preferred_username||meta.user_name||(SESSION.user.email||'user').split('@')[0];
      var base=String(rawName).toLowerCase().replace(/[^a-z0-9_]/g,'').slice(0,18)||'user';
      var candidate=base,n=1;
      while(true){var {data:exists}=await sb.from('profiles').select('id').eq('username',candidate).maybeSingle();if(!exists)break;candidate=base+n;n++;if(n>50){candidate=base+Math.floor(Math.random()*10000);break;}}
      var insert={id:SESSION.user.id,username:candidate,display_name:meta.full_name||meta.name||candidate};
      var {data:created,error:ce}=await sb.from('profiles').insert(insert).select().single();
      if(!ce&&created){ME=created;PROFILES[ME.id]=ME;return;}
      log("auto-create failed",ce);
    }
    await new Promise(function(r){setTimeout(r,400);});
  }
}

/* FRIENDS */
async function loadFriends(){if(!ME)return;var {data}=await sb.from('friendships').select('*').or('user_id.eq.'+ME.id+',friend_id.eq.'+ME.id);FRIENDS={accepted:[],incoming:[],outgoing:[]};for(var i=0;i<(data||[]).length;i++){var f=data[i];var other=(f.user_id===ME.id)?f.friend_id:f.user_id;if(f.status==='accepted')FRIENDS.accepted.push({id:f.id,other:other});else if(f.status==='pending'&&f.requested_by!==ME.id)FRIENDS.incoming.push({id:f.id,other:other});else if(f.status==='pending'&&f.requested_by===ME.id)FRIENDS.outgoing.push({id:f.id,other:other});}var ids=[];FRIENDS.accepted.concat(FRIENDS.incoming,FRIENDS.outgoing).forEach(function(f){ids.push(f.other);});await fetchProfiles(ids);}
async function sendFriendRequest(username){var clean=String(username||"").trim().replace(/^@/,'').toLowerCase();if(!clean)throw new Error("Type a username first.");var {data:target}=await sb.from('profiles').select('*').eq('username',clean).maybeSingle();if(!target)throw new Error("No user found with @"+clean);if(target.id===ME.id)throw new Error("You cannot add yourself.");var existing=[].concat(FRIENDS.accepted,FRIENDS.incoming,FRIENDS.outgoing).filter(function(f){return f.other===target.id;});if(existing.length)throw new Error("Already friends or pending.");var {error}=await sb.from('friendships').insert({user_id:ME.id,friend_id:target.id,status:'pending',requested_by:ME.id});if(error)throw error;PROFILES[target.id]=target;await loadFriends();}
async function acceptFriend(id){var {error}=await sb.from('friendships').update({status:'accepted'}).eq('id',id);if(error)throw error;await loadFriends();}
async function removeFriendship(id){var {error}=await sb.from('friendships').delete().eq('id',id);if(error)throw error;await loadFriends();}

/* SERVERS */
async function loadServers(){if(!ME)return;var {data:sm}=await sb.from('server_members').select('server_id').eq('user_id',ME.id);var ids=(sm||[]).map(function(x){return x.server_id;});if(!ids.length){SERVERS=[];return;}var {data:srv}=await sb.from('servers').select('*').in('id',ids);SERVERS=srv||[];}
async function loadServerMembers(serverId,force){var c=SERVER_MEMBERS[serverId];if(!force&&c&&Date.now()-c.ts<60000)return c.ids;var {data}=await sb.from('server_members').select('user_id').eq('server_id',serverId);var ids=(data||[]).map(function(x){return x.user_id;});await fetchProfiles(ids);SERVER_MEMBERS[serverId]={ids:ids,ts:Date.now()};return ids;}
async function loadChannels(serverId){var {data}=await sb.from('channels').select('*').eq('server_id',serverId).order('position',{ascending:true});CHANNELS=data||[];}
async function createServer(name){if(!name||!name.trim())throw new Error("Give your community a name.");var {data:srv,error}=await sb.from('servers').insert({name:name.trim(),owner_id:ME.id}).select().single();if(error)throw error;var {error:e2}=await sb.from('server_members').insert({server_id:srv.id,user_id:ME.id});if(e2)throw e2;await sb.from('channels').insert([{server_id:srv.id,name:"general",type:"text",category:"Text Channels",topic:"General chat",position:0},{server_id:srv.id,name:"lounge",type:"voice",category:"Voice Channels",topic:"Voice hangout",position:1}]);await loadServers();return srv;}
async function createChannel(serverId,name,type,category){if(!name||!name.trim())throw new Error("Give the channel a name.");name=name.trim().toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9_-]/g,'');var {error}=await sb.from('channels').insert({server_id:serverId,name:name,type:type||'text',category:category||'Text Channels',position:CHANNELS.length});if(error)throw error;}
async function deleteChannel(id){var {error}=await sb.from('channels').delete().eq('id',id);if(error)throw error;}
async function leaveServer(serverId){var {error}=await sb.from('server_members').delete().eq('server_id',serverId).eq('user_id',ME.id);if(error)throw error;SERVER_MEMBERS={};}
async function deleteServer(id){var {error}=await sb.from('servers').delete().eq('id',id);if(error)throw error;}

/* CONVERSATIONS */
async function loadConversations(){if(!ME)return;var {data:cms}=await sb.from('conversation_members').select('conversation_id').eq('user_id',ME.id);var ids=(cms||[]).map(function(c){return c.conversation_id;});if(!ids.length){CONVERSATIONS=[];return;}var {data:convs}=await sb.from('conversations').select('*').in('id',ids);var list=convs||[];if(!list.length){CONVERSATIONS=[];return;}var {data:allMembers}=await sb.from('conversation_members').select('conversation_id,user_id').in('conversation_id',ids);var byConv={};(allMembers||[]).forEach(function(m){(byConv[m.conversation_id]=byConv[m.conversation_id]||[]).push(m.user_id);});var allIds=[];Object.keys(byConv).forEach(function(k){allIds=allIds.concat(byConv[k]);});await fetchProfiles(allIds);await Promise.all(list.map(async function(c){c.memberIds=byConv[c.id]||[];var {data:last}=await sb.from('messages').select('*').eq('conversation_id',c.id).order('id',{ascending:false}).limit(1);c.lastMessage=(last&&last[0])||null;}));list.sort(function(a,b){var ta=a.lastMessage?new Date(a.lastMessage.created_at).getTime():new Date(a.created_at).getTime();var tb=b.lastMessage?new Date(b.lastMessage.created_at).getTime():new Date(b.created_at).getTime();return tb-ta;});CONVERSATIONS=list;}
async function getOrCreateDM(otherId){var {data:myCms}=await sb.from('conversation_members').select('conversation_id').eq('user_id',ME.id);var myIds=(myCms||[]).map(function(c){return c.conversation_id;});if(myIds.length){var {data:theirCms}=await sb.from('conversation_members').select('conversation_id').eq('user_id',otherId).in('conversation_id',myIds);for(var i=0;i<(theirCms||[]).length;i++){var cid=theirCms[i].conversation_id;var {data:conv}=await sb.from('conversations').select('*').eq('id',cid).maybeSingle();if(!conv||conv.is_group)continue;var {count}=await sb.from('conversation_members').select('*',{count:'exact',head:true}).eq('conversation_id',cid);if(count===2)return conv;}}var {data:conv2,error:e1}=await sb.from('conversations').insert({is_group:false,created_by:ME.id}).select().single();if(e1)throw e1;var {error:e2}=await sb.from('conversation_members').insert([{conversation_id:conv2.id,user_id:ME.id},{conversation_id:conv2.id,user_id:otherId}]);if(e2)throw e2;return conv2;}
async function createGroupDM(name,memberIds){var ids=[ME.id].concat(memberIds).filter(function(v,i,a){return a.indexOf(v)===i;});if(ids.length<3)throw new Error("Pick at least two friends.");var {data:conv,error:e1}=await sb.from('conversations').insert({is_group:true,name:name||"Group",created_by:ME.id}).select().single();if(e1)throw e1;var rows=ids.map(function(uid){return{conversation_id:conv.id,user_id:uid};});var {error:e2}=await sb.from('conversation_members').insert(rows);if(e2)throw e2;return conv;}

/* NAV */
async function goHome(){CURRENT={type:"home",conv:null,server:null,channel:null};MESSAGES=[];UI.panelOpen=false;syncMobile();await loadConversations();if(CONVERSATIONS.length){await goConversation(CONVERSATIONS[0].id);return;}renderAll();}
async function goServer(serverId){var srv=SERVERS.filter(function(s){return s.id===serverId;})[0];if(!srv)return;CURRENT.type="server";CURRENT.server=srv;CURRENT.conv=null;UI.panelOpen=false;syncMobile();await loadChannels(serverId);subscribeChannels(serverId);var first=CHANNELS.filter(function(c){return c.type==="text";})[0]||CHANNELS[0];CURRENT.channel=first||null;if(first)await loadMessagesForChannel(first.id);else MESSAGES=[];renderAll();}
async function goChannel(channelId){var ch=CHANNELS.filter(function(c){return c.id===channelId;})[0];if(!ch)return;CURRENT.channel=ch;if(ch.type==="text"||ch.type==="announcement"){await loadMessagesForChannel(channelId);subscribeTyping("channel:"+channelId);}else MESSAGES=[];UNREAD[channelId]=0;UI.panelOpen=false;syncMobile();renderAll();if(ch.type==="voice"){joinVoice(channelId);}}
async function goConversation(convId){var conv=CONVERSATIONS.filter(function(c){return c.id===convId;})[0];if(!conv)return;CURRENT={type:"dm",conv:conv,server:null,channel:null};UI.panelOpen=false;syncMobile();await loadMessagesForConversation(convId);subscribeTyping("conv:"+convId);UNREAD[convId]=0;renderAll();}
async function openDMWith(otherId){var conv=await getOrCreateDM(otherId);await loadConversations();await goConversation(conv.id);}

/* MESSAGES */
async function loadMessagesForConversation(convId){var {data,error}=await sb.from('messages').select('*').eq('conversation_id',convId).order('id',{ascending:true}).limit(200);if(error){log(error);MESSAGES=[];return;}MESSAGES=data||[];await fetchProfiles(MESSAGES.map(function(m){return m.sender_id;}));}
async function loadMessagesForChannel(channelId){var {data,error}=await sb.from('messages').select('*').eq('channel_id',channelId).order('id',{ascending:true}).limit(200);if(error){log(error);MESSAGES=[];return;}MESSAGES=data||[];await fetchProfiles(MESSAGES.map(function(m){return m.sender_id;}));}
async function sendMessage(text){var content=text.trim().slice(0,4000);if(!content)return;var payload={sender_id:ME.id,content:content};if(CURRENT.type==="dm")payload.conversation_id=CURRENT.conv.id;else if(CURRENT.type==="server"&&CURRENT.channel)payload.channel_id=CURRENT.channel.id;else return;var {data,error}=await sb.from('messages').insert(payload).select().single();if(error)throw error;sfxSend();if(!MESSAGES.some(function(x){return x.id===data.id;})){MESSAGES.push(data);renderChat();}grantMessageCoins();return data;}
async function editMessage(id,text){var {error}=await sb.from('messages').update({content:text,edited:true}).eq('id',id);if(error)throw error;for(var i=0;i<MESSAGES.length;i++){if(MESSAGES[i].id===id){MESSAGES[i].content=text;MESSAGES[i].edited=true;break;}}renderChat();}
async function deleteMessage(id){var {error}=await sb.from('messages').update({deleted:true,content:''}).eq('id',id);if(error)throw error;for(var i=0;i<MESSAGES.length;i++){if(MESSAGES[i].id===id){MESSAGES[i].deleted=true;MESSAGES[i].content='';break;}}renderChat();}

/* REALTIME */
function subscribeGlobalMessages(){
  if(globalMsgCh){try{sb.removeChannel(globalMsgCh);}catch(e){}}
  globalMsgCh=sb.channel('global-messages')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},function(payload){
      var m=payload.new;var isCurConv=CURRENT.type==="dm"&&CURRENT.conv&&m.conversation_id===CURRENT.conv.id;var isCurChan=CURRENT.type==="server"&&CURRENT.channel&&m.channel_id===CURRENT.channel.id;
      if(isCurConv||isCurChan){if(!MESSAGES.some(function(x){return x.id===m.id;})){fetchProfiles([m.sender_id]).then(function(){MESSAGES.push(m);renderChat();});}if(m.sender_id!==ME.id)sfxRecv();return;}
      var key=m.conversation_id||m.channel_id;if(m.sender_id===ME.id)return;UNREAD[key]=(UNREAD[key]||0)+1;
      if(m.conversation_id){fetchProfiles([m.sender_id]).then(function(){var who=userLabel(m.sender_id);var preview=String(m.content||"").slice(0,60);toast(who,preview,"ok");sfxRecv();});}
      if(m.conversation_id&&!CONVERSATIONS.some(function(c){return c.id===m.conversation_id;})){loadConversations().then(function(){renderPanel();renderRail();});}else{if(m.conversation_id){var c=CONVERSATIONS.filter(function(x){return x.id===m.conversation_id;})[0];if(c)c.lastMessage=m;}renderPanel();}
    })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'messages'},function(payload){var m=payload.new;var isCurConv=CURRENT.type==="dm"&&CURRENT.conv&&m.conversation_id===CURRENT.conv.id;var isCurChan=CURRENT.type==="server"&&CURRENT.channel&&m.channel_id===CURRENT.channel.id;if(isCurConv||isCurChan){for(var i=0;i<MESSAGES.length;i++){if(MESSAGES[i].id===m.id){MESSAGES[i]=m;break;}}renderChat();}})
    .subscribe();
}
function subscribeTyping(target){if(typingCh){try{sb.removeChannel(typingCh);}catch(e){}}typingCh=sb.channel('typing-'+target,{config:{broadcast:{self:false}}}).on('broadcast',{event:'typing'},function(payload){if(!payload||!payload.user_id)return;TYPING[payload.user_id]=Date.now()+3000;renderTyping();}).subscribe();}
function broadcastTyping(){if(!typingCh||!ME)return;var now=Date.now();if(now-typingLast<1500)return;typingLast=now;try{typingCh.send({type:'broadcast',event:'typing',payload:{user_id:ME.id}});}catch(e){}}
setInterval(function(){var changed=false,t=Date.now();for(var u in TYPING){if(TYPING[u]<t){delete TYPING[u];changed=true;}}if(changed)renderTyping();},1000);
function subscribePresence(){if(presenceCh){try{sb.removeChannel(presenceCh);}catch(e){}}presenceCh=sb.channel('quazi-presence',{config:{presence:{key:ME.id}}});presenceCh.on('presence',{event:'sync'},function(){ONLINE=new Set(Object.keys(presenceCh.presenceState()));renderChatHead();renderMembers();renderPanel();}).on('presence',{event:'join'},function(o){ONLINE.add(o.key);renderMembers();renderPanel();}).on('presence',{event:'leave'},function(o){ONLINE.delete(o.key);renderMembers();renderPanel();}).subscribe(function(status){if(status==='SUBSCRIBED')try{presenceCh.track({user_id:ME.id,status:ME.status||'online',at:new Date().toISOString()});}catch(e){}});}
function subscribeFriendships(){if(friendsCh){try{sb.removeChannel(friendsCh);}catch(e){}}friendsCh=sb.channel('friendships-'+ME.id).on('postgres_changes',{event:'*',schema:'public',table:'friendships'},function(){loadFriends().then(function(){renderPanel();renderRail();});}).subscribe();}
function subscribeServers(){if(serversCh){try{sb.removeChannel(serversCh);}catch(e){}}serversCh=sb.channel('servers-'+ME.id).on('postgres_changes',{event:'*',schema:'public',table:'server_members'},function(){SERVER_MEMBERS={};loadServers().then(function(){renderRail();renderMembers();});}).subscribe();}
function subscribeChannels(serverId){if(channelsCh){try{sb.removeChannel(channelsCh);}catch(e){}}channelsCh=sb.channel('channels-'+serverId).on('postgres_changes',{event:'*',schema:'public',table:'channels',filter:'server_id=eq.'+serverId},function(){loadChannels(serverId).then(function(){renderPanel();});}).subscribe();}
function subscribeChallenges(){
  if(challengeCh){try{sb.removeChannel(challengeCh);}catch(e){}}
  challengeCh=sb.channel('challenges-'+ME.id,{config:{broadcast:{self:false}}});
  challengeCh.on('broadcast',{event:'challenge'},function(payload){
    var data=payload.payload||payload;
    if(!data.from||data.from===ME.id)return;
    fetchProfiles([data.from]).then(function(){
      var who=userLabel(data.from);
      var gameName=data.game==='ttt'?'Tic-Tac-Toe':data.game==='rps'?'Rock Paper Scissors':data.game;
      openChallengeModal(who,data.from,data.game,data.sessionId);
    });
  }).subscribe();
}

/* RENDER */
function renderAll(){if(!ME)return;showApp();renderRail();renderPanel();renderChatHead();renderChat();renderMembers();renderUserBar();$("#app").classList.toggle("hide-members",!UI.showMembers||CURRENT.type!=="server"||isMobile());}

  h+='<button class="rail-btn" data-rail="browser" title="Web Browser">🌐</button>';

function renderPanel(){if(CURRENT.type==="server"&&CURRENT.server)renderChannelPanel();else renderDMPanel();}

  var h='<div class="panel-section"><div class="panel-label">Conversations</div>';
  if(!CONVERSATIONS.length)h+='<div class="empty" style="padding:18px 10px">No conversations. Find people and add them.</div>';
  CONVERSATIONS.forEach(function(c){var active=CURRENT.type==="dm"&&CURRENT.conv&&CURRENT.conv.id===c.id;var title=convTitle(c);var sub=c.lastMessage?preview(c.lastMessage):(c.is_group?c.memberIds.length+' members':'No messages yet');var av;if(c.is_group){av='<div class="avatar" style="width:32px;height:32px;font-size:12px;background:linear-gradient(135deg,#b44aff,#00ffe0);color:#06120f">'+esc(title.slice(0,2).toUpperCase())+'</div>';}else{var other=c.memberIds.filter(function(id){return id!==ME.id;})[0];av='<div style="position:relative">'+avatarHTML(other,32)+statusDot(other)+'</div>';}var un=UNREAD[c.id]||0;h+='<button class="row '+(active?"active":"")+'" data-conv="'+c.id+'">'+av+'<span style="flex:1;min-width:0"><span class="txt" style="display:block">'+esc(title)+'</span><span class="sub">'+esc(sub)+'</span></span>'+(un>0&&!active?'<span class="badge">'+(un>99?'99+':un)+'</span>':'')+'</button>';});
  h+='</div>';
  var pend=FRIENDS.incoming.length;
  h+='<div class="panel-section"><div class="panel-label">Social</div>';
  h+='<button class="row" data-act="friends">'+SVG.users+'<span class="txt">Friends</span>'+(pend?'<span class="badge">'+pend+'</span>':'')+'</button>';
  h+='<button class="row" data-act="find">'+SVG.search+'<span class="txt">Find People</span></button>';
  h+='<button class="row" data-act="newgroup">'+SVG.plus+'<span class="txt">New Group DM</span></button>';
  h+='<button class="row" data-act="shop">🛒<span class="txt">Shop</span></button>';
  h+='<button class="row" data-act="ai-chat" style="color:var(--accent)">🤖<span class="txt">Quazi AI</span></button>';
  h+='</div>';
  h+='<div class="panel-section"><div class="panel-label">Wallet</div>';
  h+='<div style="display:flex;gap:8px;padding:6px 8px;align-items:center"><span class="wallet-pill" data-act="wallet">🪙 '+WALLET.coins+' &nbsp; 💎 '+WALLET.gems+'</span><button class="btn sm" data-act="daily">Claim</button></div>';
  h+='</div>';
  $("#panel-body").innerHTML=h;
}
function renderChannelPanel(){
  var srv=CURRENT.server;
  $("#panel-head").innerHTML='<div class="ttl">'+esc(srv.name)+'</div>';
  var cats=[];CHANNELS.forEach(function(ch){if(cats.indexOf(ch.category)<0)cats.push(ch.category);});
  if(!cats.length)cats=["Text Channels"];
  var h="";
  cats.forEach(function(cat){var list=CHANNELS.filter(function(ch){return ch.category===cat;});h+='<div class="panel-section"><div class="panel-label"><span>'+esc(cat)+'</span>';if(srv.owner_id===ME.id)h+='<span class="add" data-addchannel="'+esc(cat)+'" title="Create channel">'+SVG.plus+'</span>';h+='</div>';list.forEach(function(ch){var active=CURRENT.channel&&CURRENT.channel.id===ch.id;var icon=ch.type==="voice"?SVG.vol:SVG.hash;var un=UNREAD[ch.id]||0;var inVC=VC.active===ch.id?' (connected)':'';h+='<button class="row '+(active?"active":"")+'" data-channel="'+ch.id+'">'+icon+'<span class="txt">'+esc(ch.name)+inVC+'</span>'+(un>0&&!active?'<span class="badge">'+(un>99?'99+':un)+'</span>':'')+'</button>';});h+='</div>';});
  h+='<div class="panel-section" style="margin-top:8px">';
  if(srv.owner_id===ME.id){h+='<button class="row" data-act="invite-manager">📨<span class="txt">Invites &amp; Permissions</span></button>';h+='<button class="row" data-act="invite-server">'+SVG.users+'<span class="txt">Add Member</span></button>';h+='<button class="row" data-act="delete-server">'+SVG.trash+'<span class="txt">Delete Server</span></button>';}else{h+='<button class="row" data-act="leave-server">'+SVG.logout+'<span class="txt">Leave Server</span></button>';}
  h+='</div>';
  $("#panel-body").innerHTML=h;
}
function convTitle(c){if(c.is_group)return c.name||"Group DM";var other=c.memberIds.filter(function(id){return id!==ME.id;})[0];return userLabel(other)||"Conversation";}
function preview(m){if(!m||m.deleted)return "message deleted";return (m.sender_id===ME.id?"You: ":"")+String(m.content||"").replace(/\s+/g,' ').slice(0,50);}

function renderChatHead(){
  var el=$("#chat-head");
  if(CURRENT.type==="server"&&CURRENT.server){
    var ch=CURRENT.channel;var icon=ch?(ch.type==="voice"?SVG.vol:SVG.hash):SVG.hash;var isOwner=CURRENT.server.owner_id===ME.id;
    el.innerHTML='<button class="hbtn mobile-only" data-act="toggle-panel">'+SVG.menu+'</button><div class="title">'+icon+'<span class="txt">'+esc(ch?ch.name:"no channel")+'</span>'+(ch&&ch.topic?'<span class="topic">'+esc(ch.topic)+'</span>':'')+'</div><div class="spacer"></div>'+(isOwner&&ch&&ch.type!=="voice"?'<button class="hbtn" data-act="delete-channel" title="Delete channel">'+SVG.trash+'</button>':'')+'<button class="hbtn" data-act="toggle-members" title="Members">'+SVG.users+'</button><button class="hbtn" data-act="settings" title="Settings">'+SVG.gear+'</button>';
    return;
  }
  if(CURRENT.type==="dm"&&CURRENT.conv){
    var other=CURRENT.conv.is_group?null:CURRENT.conv.memberIds.filter(function(id){return id!==ME.id;})[0];var title=convTitle(CURRENT.conv);var sub=CURRENT.conv.is_group?(CURRENT.conv.memberIds.length+" members"):(other?(userLabel(other)+" - "+(ONLINE.has(other)?"online":"offline")):"");
    el.innerHTML='<button class="hbtn mobile-only" data-act="toggle-panel">'+SVG.menu+'</button><div class="title"><span class="txt">'+esc(title)+'</span>'+(sub?'<span class="topic">'+esc(sub)+'</span>':'')+'</div><div class="spacer"></div>'+(other?'<button class="hbtn" data-act="start-call" data-user="'+esc(other)+'" title="Voice Call">'+SVG.phone+'</button>':'')+(other?'<button class="hbtn" data-act="view-profile" data-user="'+esc(other)+'" title="Profile">'+SVG.user+'</button>':'')+'<button class="hbtn" data-act="settings" title="Settings">'+SVG.gear+'</button>';
    return;
  }
  el.innerHTML='<button class="hbtn mobile-only" data-act="toggle-panel">'+SVG.menu+'</button><div class="title">'+SVG.home+'<span class="txt">Direct Messages</span></div><div class="spacer"></div>';
}

function renderChat(){
  var body=$("#chat-body"),wrap=$("#composer-wrap");
  if(CURRENT.type==="server"&&CURRENT.channel&&CURRENT.channel.type==="voice"){
    body.innerHTML='<div class="empty"><div class="big">'+SVG.vol+'</div><h2>'+esc(CURRENT.channel.name)+'</h2><p>'+(VC.active===CURRENT.channel.id?'Connected to voice':'Voice channel — click again to join')+'</p></div>';
    wrap.innerHTML='';return;
  }

function initMusicDraggable(){
  var mp=document.getElementById('music-player');if(!mp)return;
  var dragging=false,wasDragging=false,startX=0,startY=0,startLeft=0,startTop=0;
  function onDown(e){
    if(MP.expanded)return;
    var target=e.target.closest('#mp-toggle');
    if(!target)return;
    var touch=e.touches?e.touches[0]:e;
    dragging=true;wasDragging=false;
    var rect=mp.getBoundingClientRect();
    startX=touch.clientX;startY=touch.clientY;startLeft=rect.left;startTop=rect.top;
    mp.style.left=rect.left+'px';mp.style.top=rect.top+'px';mp.style.right='auto';mp.style.bottom='auto';
    mp.classList.add('dragging');
    e.preventDefault();
  }
  function onMove(e){
    if(!dragging)return;
    var touch=e.touches?e.touches[0]:e;
    var dx=touch.clientX-startX;var dy=touch.clientY-startY;
    if(Math.abs(dx)>4||Math.abs(dy)>4)wasDragging=true;
    var newLeft=Math.max(0,Math.min(window.innerWidth-56,startLeft+dx));
    var newTop=Math.max(0,Math.min(window.innerHeight-56,startTop+dy));
    mp.style.left=newLeft+'px';mp.style.top=newTop+'px';
  }
  function onUp(e){
    if(!dragging)return;
    dragging=false;mp.classList.remove('dragging');
    if(wasDragging){wasDragging=false;e.stopPropagation&&e.stopPropagation();}
  }
  mp.addEventListener('mousedown',onDown);
  mp.addEventListener('touchstart',onDown,{passive:false});
  document.addEventListener('mousemove',onMove);
  document.addEventListener('touchmove',onMove,{passive:false});
  document.addEventListener('mouseup',onUp);
  document.addEventListener('touchend',onUp);
}

/* Multiplayer Tic-Tac-Toe */
function startMultiTTT(sessionId,opponentId){
  var isHost=ME.id<opponentId; // lower UUID = host = X
  var myMark=isHost?'X':'O';
  var board=['','','','','','','','',''];var gameOver=false;var myTurn=isHost;
  var ch=sb.channel('game-'+sessionId,{config:{broadcast:{self:false}}});
  ch.on('broadcast',{event:'move'},function({payload}){if(payload.i!=null&&payload.mark){board[payload.i]=payload.mark;render();checkEnd();myTurn=true;updateStatus();}})
    .on('broadcast',{event:'reset'},function(){board=['','','','','','','','',''];gameOver=false;myTurn=isHost;render();updateStatus();})
    .subscribe();
  var h='<div class="modal-head"><h3>⭕ Tic-Tac-Toe vs '+esc(userLabel(opponentId))+'</h3><button class="xbtn" id="qa-close">'+SVG.x+'</button></div><div class="modal-body"><p style="text-align:center;font-size:12px;color:var(--text3)">You are <b>'+myMark+'</b></p><div class="ttt-grid" id="ttt-grid"></div><p id="ttt-status" style="text-align:center;font-weight:600;color:var(--accent);margin-top:8px">'+(myTurn?'Your turn':'Waiting for opponent')+'</p><div style="text-align:center;margin-top:14px"><button class="btn" id="ttt-reset">Restart</button></div></div>';
  qaModal(h,{wide:false});
  document.getElementById('qa-close').onclick=function(){try{sb.removeChannel(ch);}catch(e){}closeQa();};
  var grid=document.getElementById('ttt-grid');
  function render(){grid.innerHTML=board.map(function(v,i){return '<div class="ttt-cell" data-i="'+i+'">'+v+'</div>';}).join('');grid.querySelectorAll('[data-i]').forEach(function(c){c.onclick=function(){play(parseInt(c.dataset.i));};});}
  function play(i){if(gameOver||board[i]||!myTurn)return;board[i]=myMark;myTurn=false;render();try{ch.send({type:'broadcast',event:'move',payload:{i:i,mark:myMark}});}catch(e){}updateStatus();checkEnd();}
  var lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  function winner(){for(var i=0;i<lines.length;i++){var l=lines[i];if(board[l[0]]&&board[l[0]]===board[l[1]]&&board[l[1]]===board[l[2]])return board[l[0]];}return null;}
  function updateStatus(){var el=document.getElementById('ttt-status');if(!el)return;var w=winner();if(w){el.textContent=w===myMark?'🎉 You win!':(w===null?'Draw':'Opponent wins');return;}if(board.every(function(x){return x;})){el.textContent='Draw';return;}el.textContent=myTurn?'Your turn':'Waiting for opponent';}

  function append(role,text){var el=document.createElement('div');el.className='ai-msg '+role;el.textContent=text;body.appendChild(el);body.scrollTop=body.scrollHeight;return el;}

      var attempts=[
        {messages:[{role:'system',content:AI_SYSTEM_PROMPT}].concat(AI_HISTORY.slice(-12)),user_id:ME?ME.id:null},
        {messages:AI_HISTORY.slice(-12),user_id:ME?ME.id:null},
        {message:text,prompt:text,user_id:ME?ME.id:null}
      ];
      var reply=null,lastErr=null;
      for(var i=0;i<attempts.length;i++){
        try{
          var res=await fetch(SUPABASE_URL+'/functions/v1/ai-chat',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(attempts[i])});
          if(!res.ok){lastErr=new Error('Status '+res.status);continue;}
          var json=await res.json();
          reply=(json&&(json.reply||json.message||json.content||json.text))||(json.choices&&json.choices[0]&&json.choices[0].message&&json.choices[0].message.content)||(json.candidates&&json.candidates[0]&&json.candidates[0].content&&json.candidates[0].content.parts&&json.candidates[0].content.parts[0]&&json.candidates[0].content.parts[0].text);
          if(reply)break;
        }catch(e){lastErr=e;}
      }
      if(!reply)reply=aiLocalFallback(AI_HISTORY);
      thinking.remove();append('assistant',reply);AI_HISTORY.push({role:'assistant',content:reply});
      if(ME)try{await sb.from('ai_messages').insert({user_id:ME.id,role:'assistant',content:reply});}catch(e){}
    }catch(err){
      thinking.remove();
      var fallback=aiLocalFallback(AI_HISTORY);
      append('assistant',fallback);
      log('AI error',err);
    }
  }
  document.getElementById('ai-send').onclick=send;
  input.addEventListener('keydown',function(e){if(e.key==='Enter')send();});
  document.getElementById('ai-clear').onclick=function(){body.innerHTML='<div class="ai-msg assistant">Cleared! Ask me anything 🤖</div>';AI_HISTORY=[];};
  setTimeout(function(){input.focus();},200);
}

/* ===== VOICE CHAT + CALLS (WebRTC) ===== */
var VC={active:null,localStream:null,peers:{},signalingCh:null,isCall:false,remoteUser:null,muted:false,iceServers:[{urls:'stun:stun.l.google.com:19302'}]};
async function loadIceServers(){
  try{
    var {data:sess}=await sb.auth.getSession();
    var token=sess&&sess.session?sess.session.access_token:SUPABASE_ANON_KEY;
    var res=await fetch(SUPABASE_URL+'/functions/v1/turn-credentials',{headers:{'Authorization':'Bearer '+token}});
    if(res.ok){var data=await res.json();if(data.iceServers||data.ice_servers||Array.isArray(data)){VC.iceServers=data.iceServers||data.ice_servers||data;}}
  }catch(e){}
}
async function joinVoice(channelId){
  if(VC.active===channelId){return;}
  if(VC.active){await leaveVoice();}
  try{VC.localStream=await navigator.mediaDevices.getUserMedia({audio:true});}catch(e){toast('Mic denied','Allow microphone to join voice.','err');return;}
  await loadIceServers();
  VC.active=channelId;VC.isCall=false;
  VC.signalingCh=sb.channel('voice-'+channelId,{config:{presence:{key:ME.id},broadcast:{self:false}}});
  VC.signalingCh
    .on('presence',{event:'sync'},function(){VC.signalingCh.presenceState&&renderVoiceBar();})
    .on('presence',{event:'join'},function(o){if(o.key!==ME.id)createPeer(o.key,true);})
    .on('presence',{event:'leave'},function(o){removePeer(o.key);})
    .on('broadcast',{event:'offer'},async function({payload}){if(payload.to!==ME.id)return;var pc=createPeer(payload.from,false);if(!pc)return;await pc.setRemoteDescription(new RTCSessionDescription(payload.offer));var answer=await pc.createAnswer();await pc.setLocalDescription(answer);VC.signalingCh.send({type:'broadcast',event:'answer',payload:{from:ME.id,to:payload.from,answer:answer}});})
    .on('broadcast',{event:'answer'},async function({payload}){if(payload.to!==ME.id)return;var p=VC.peers[payload.from];if(p&&p.pc)await p.pc.setRemoteDescription(new RTCSessionDescription(payload.answer));})
    .on('broadcast',{event:'ice'},async function({payload}){if(payload.to!==ME.id)return;var p=VC.peers[payload.from];if(p&&p.pc)try{await p.pc.addIceCandidate(new RTCIceCandidate(payload.candidate));}catch(e){}})
    .subscribe(async function(status){if(status==='SUBSCRIBED'){await VC.signalingCh.track({user_id:ME.id,joined_at:Date.now()});renderVoiceBar();toast('Joined voice','','ok');}});
  renderVoiceBar();
}
function createPeer(remoteId,initiator){
  if(VC.peers[remoteId]&&VC.peers[remoteId].pc)return VC.peers[remoteId].pc;
  var pc=new RTCPeerConnection({iceServers:VC.iceServers});
  if(VC.localStream)VC.localStream.getTracks().forEach(function(t){pc.addTrack(t,VC.localStream);});
  pc.onicecandidate=function(e){if(e.candidate&&VC.signalingCh){VC.signalingCh.send({type:'broadcast',event:'ice',payload:{from:ME.id,to:remoteId,candidate:e.candidate}});}};
  pc.ontrack=function(e){
    var audio=new Audio();audio.srcObject=e.streams[0];audio.autoplay=true;audio.play().catch(function(){});
    VC.peers[remoteId]=VC.peers[remoteId]||{};VC.peers[remoteId].audio=audio;VC.peers[remoteId].pc=pc;
    renderVoiceBar();
  };
  VC.peers[remoteId]=VC.peers[remoteId]||{};VC.peers[remoteId].pc=pc;
  if(initiator){
    pc.createOffer().then(function(offer){return pc.setLocalDescription(offer).then(function(){VC.signalingCh.send({type:'broadcast',event:'offer',payload:{from:ME.id,to:remoteId,offer:offer}});});}).catch(function(e){log('offer err',e);});
  }
  return pc;
}
function removePeer(id){var p=VC.peers[id];if(p){if(p.pc){try{p.pc.close();}catch(e){}}if(p.audio){try{p.audio.pause();p.audio.srcObject=null;}catch(e){}}delete VC.peers[id];}renderVoiceBar();}
async function leaveVoice(){
  if(VC.localStream){VC.localStream.getTracks().forEach(function(t){try{t.stop();}catch(e){}});VC.localStream=null;}
  Object.keys(VC.peers).forEach(function(id){removePeer(id);});
  if(VC.signalingCh){try{await sb.removeChannel(VC.signalingCh);}catch(e){}VC.signalingCh=null;}
  VC.active=null;VC.isCall=false;VC.remoteUser=null;VC.muted=false;
  renderVoiceBar();renderChannelPanel();renderChat();
  toast('Left voice','','ok');
}
function toggleMute(){
  if(!VC.localStream)return;
  VC.muted=!VC.muted;
  VC.localStream.getAudioTracks().forEach(function(t){t.enabled=!VC.muted;});
  renderVoiceBar();
}
function renderVoiceBar(){
  var slot=document.getElementById('voice-bar-slot');
  if(!VC.active&&!VC.isCall){slot.innerHTML='';return;}
  var others=Object.keys(VC.peers).length;
  var label=VC.isCall?('📞 Call with '+(VC.remoteUser?userLabel(VC.remoteUser):'someone')):('🔊 Voice: '+(CHANNELS.filter(function(c){return c.id===VC.active;})[0]||{name:'channel'}).name);
  slot.innerHTML='<div class="voice-bar"><div class="vb-info"><span class="vb-name">'+label+'</span><span class="vb-participants">'+(others+1)+' connected</span></div><button id="vb-mute" class="'+(VC.muted?'muted':'')+'">'+(VC.muted?'🔇 Unmute':'🎤 Mute')+'</button><button id="vb-leave" class="danger">Leave</button></div>';
  document.getElementById('vb-mute').onclick=toggleMute;
  document.getElementById('vb-leave').onclick=leaveVoice;
}
async function startCall(userId){
  if(VC.active){toast('Already in voice','Leave first.','err');return;}
  try{VC.localStream=await navigator.mediaDevices.getUserMedia({audio:true});}catch(e){toast('Mic denied','Allow mic to call.','err');return;}
  await loadIceServers();
  var roomId='call-'+[ME.id,userId].sort().join('-');
  VC.active=roomId;VC.isCall=true;VC.remoteUser=userId;
  VC.signalingCh=sb.channel('voice-'+roomId,{config:{presence:{key:ME.id},broadcast:{self:false}}});
  VC.signalingCh
    .on('broadcast',{event:'offer'},async function({payload}){if(payload.to!==ME.id)return;var pc=createPeer(payload.from,false);if(!pc)return;await pc.setRemoteDescription(new RTCSessionDescription(payload.offer));var answer=await pc.createAnswer();await pc.setLocalDescription(answer);VC.signalingCh.send({type:'broadcast',event:'answer',payload:{from:ME.id,to:payload.from,answer:answer}});})
    .on('broadcast',{event:'answer'},async function({payload}){if(payload.to!==ME.id)return;var p=VC.peers[payload.from];if(p&&p.pc)await p.pc.setRemoteDescription(new RTCSessionDescription(payload.answer));})
    .on('broadcast',{event:'ice'},async function({payload}){if(payload.to!==ME.id)return;var p=VC.peers[payload.from];if(p&&p.pc)try{await p.pc.addIceCandidate(new RTCIceCandidate(payload.candidate));}catch(e){}})
    .on('presence',{event:'join'},function(o){if(o.key!==ME.id)createPeer(o.key,true);})
    .on('presence',{event:'leave'},function(o){removePeer(o.key);})
    .subscribe(async function(status){if(status==='SUBSCRIBED'){await VC.signalingCh.track({user_id:ME.id});renderVoiceBar();}});
  // Ring the other user
  var ringCh=sb.channel('call-ring-'+userId,{config:{broadcast:{self:false}}});
  ringCh.subscribe(function(s){if(s==='SUBSCRIBED'){ringCh.send({type:'broadcast',event:'incoming',payload:{from:ME.id,roomId:roomId}});setTimeout(function(){try{sb.removeChannel(ringCh);}catch(e){}},3000);}});

  renderVoiceBar();
}

$$(".tab").forEach(function(tab){tab.onclick=function(){$$(".tab").forEach(function(t){t.classList.remove("active");});tab.classList.add("active");var t=tab.dataset.tab;$("#form-login").classList.toggle("hidden",t!=="login");$("#form-signup").classList.toggle("hidden",t!=="signup");};});
$("#form-login").onsubmit=async function(e){e.preventDefault();$("#li-err").textContent="";$("#li-submit").disabled=true;try{await doLogin($("#li-email").value.trim(),$("#li-pass").value);await boot();}catch(err){$("#li-err").textContent=err.message||String(err);}finally{$("#li-submit").disabled=false;}};
$("#form-signup").onsubmit=async function(e){e.preventDefault();$("#su-err").textContent="";$("#su-submit").disabled=true;var email=$("#su-email").value.trim(),user=$("#su-username").value.trim().toLowerCase(),display=$("#su-display").value.trim(),pass=$("#su-pass").value,confirm=$("#su-confirm").value;if(pass!==confirm){$("#su-err").textContent="Passwords don't match.";$("#su-submit").disabled=false;return;}try{await doSignup(email,pass,user,display);$("#su-ok").textContent="Account created! Check your email (if required), then sign in.";}catch(err){$("#su-err").textContent=err.message||String(err);}finally{$("#su-submit").disabled=false;}};
$("#google-login").onclick=async function(){try{await doGoogleLogin();}catch(err){toast("Google login failed",err.message||String(err),"err");}};
$("#guest-login").onclick=doGuestLogin;

async function boot(){
  var {data:sess}=await sb.auth.getSession();
  SESSION=sess.session;
  if(!SESSION){showAuth();return;}
  await loadMe();
  if(!ME){showAuth();return;}
  IS_GUEST=!!(SESSION.user&&SESSION.user.is_anonymous);
  showApp();
  await Promise.all([loadFriends(),loadServers(),loadConversations()]);
  await loadWallet();
  await loadInventory();
  subscribeGlobalMessages();
  subscribePresence();
  subscribeFriendships();
  subscribeServers();
  subscribeChallenges();
  subscribeIncomingCalls();
  renderAll();
  await goHome();
  var code=new URLSearchParams(window.location.search).get('invite');
  if(code){await tryRedeemInvite(code);}
}
sb.auth.onAuthStateChange(function(event,session){
  if(event==='SIGNED_IN'&&session&&!ME){SESSION=session;boot();}
  else if(event==='SIGNED_OUT'){doLogout();}
});
boot();
window.addEventListener('resize',function(){syncMobile();renderAll();});
</script>
</body>
