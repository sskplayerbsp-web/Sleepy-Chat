</style>
<script>
(function(){
  "use strict";
  if (window.__sleepyEnhance) return;
  window.__sleepyEnhance = true;

  // ---- Extra icons ----
  window.SVG.bell  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>';
  window.SVG.smile = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><path d="M9 9h.01M15 9h.01"/></svg>';
  window.SVG.tag   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41 13.42 20.58a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><circle cx="7" cy="7" r="1.5"/></svg>';

  // ---- State ----
  window.INVITES = [];           // incoming pending invites
  window.ROLES = [];             // roles for current server
  window.MEMBER_ROLES = {};      // uid -> [roleId]
  window.REACTIONS = {};         // msgId -> { emoji -> [userId] }
  var lastServerId = null;
  var invitesCh = null;
  var rolesCh = null;
  var currentReactionsSub = null;
  var currentReactionsTarget = null;

  // ---- Emoji set for picker ----
  var EMOJIS = [
    "\u{1F44D}","\u2764\uFE0F","\u{1F602}","\u{1F525}","\u2728","\u{1F319}","\u{1F44E}","\u{1F389}",
    "\u{1F440}","\u{1F60A}","\u{1F60D}","\u{1F621}","\u{1F914}","\u{1F62E}","\u{1F622}","\u{1F4AF}",
    "\u{1F4A1}","\u{1F680}","\u{1F3AE}","\u{1F355}","\u2615","\u{1F3B5}","\u{1F4CC}","\u{1F512}"
  ];

  function log(){ try{ console.log.apply(console, ["[Enhance]"].concat([].slice.call(arguments))); }catch(e){} }

  // ============================================================
  // INVITES
  // ============================================================
  async function loadInvites(){
    if (!window.ME) return;
    var { data, error } = await sb.from('server_invites')
      .select('*').eq('to_user', window.ME.id).eq('status', 'pending');
    if (error) { log("loadInvites", error); return; }
    window.INVITES = data || [];
    // Fetch inviter profiles + server names
    var userIds = INVITES.map(function(i){ return i.from_user; }).filter(function(v,i,a){ return a.indexOf(v)===i; });
    var serverIds = INVITES.map(function(i){ return i.server_id; }).filter(function(v,i,a){ return a.indexOf(v)===i; });
    await window.fetchProfiles(userIds);
    if (serverIds.length) {
      var { data: srvs } = await sb.from('servers').select('*').in('id', serverIds);
      window.INVITE_SERVERS = {};
      (srvs||[]).forEach(function(s){ window.INVITE_SERVERS[s.id] = s; });
    }
  }

  window.acceptInvite = async function(inviteId){
    var invite = INVITES.find(function(i){ return i.id === inviteId; });
    if (!invite) return;
    try {
      var { error: e1 } = await sb.from('server_invites').update({ status: 'accepted' }).eq('id', inviteId);
      if (e1) throw e1;
      var { error: e2 } = await sb.from('server_members').insert({ server_id: invite.server_id, user_id: window.ME.id });
      if (e2 && e2.code !== '23505') throw e2;
      await loadInvites();
      await window.loadServers();
      window.renderRail();
      window.toast("Joined", "Welcome to the server!", "ok");
      await window.goServer(invite.server_id);
    } catch(e) { window.toast("Error", e.message || String(e), "err"); }
  };
  window.rejectInvite = async function(inviteId){
    try {
      await sb.from('server_invites').delete().eq('id', inviteId);
      await loadInvites();
      window.renderRail();
      window.toast("Dismissed", "", "ok");
    } catch(e) { window.toast("Error", e.message || String(e), "err"); }
  };

  window.sendInviteToUser = async function(serverId, username){
    var clean = String(username||"").trim().replace(/^@/,'').toLowerCase();
    if (!clean) throw new Error("Type a username.");
    var { data: target } = await sb.from('profiles').select('*').eq('username', clean).maybeSingle();
    if (!target) throw new Error("No user found with @" + clean);
    if (target.id === window.ME.id) throw new Error("You are already in this server.");
    var { data: existing } = await sb.from('server_members').select('*').eq('server_id', serverId).eq('user_id', target.id).maybeSingle();
    if (existing) throw new Error("That user is already a member.");
    var { data: dupe } = await sb.from('server_invites').select('*').eq('server_id', serverId).eq('to_user', target.id).eq('status','pending').maybeSingle();
    if (dupe) throw new Error("Invite already sent.");
    var { error } = await sb.from('server_invites').insert({ server_id: serverId, from_user: window.ME.id, to_user: target.id });
    if (error) throw error;
    window.PROFILES[target.id] = target;
    return target;
  };

  // Replace openInviteServer
  window.openInviteServer = function(){
    if (!window.CURRENT.server) return;
    var sid = window.CURRENT.server.id;
    window.openModal("Invite People to " + window.CURRENT.server.name,
      '<div class="field"><label>Username to invite</label>' +
      '<div style="display:flex;gap:8px"><input id="inv-input" placeholder="username" style="flex:1">' +
      '<button class="btn primary" id="inv-go">Send Invite</button></div>' +
      '<div class="hint">They will receive a notification and can accept or decline.</div></div>' +
      '<div id="inv-log" style="margin-top:12px;font-size:13px;color:var(--text2)"></div>');
    async function doInvite(){
      var v = document.getElementById('inv-input').value.trim();
      try {
        var t = await window.sendInviteToUser(sid, v);
        document.getElementById('inv-log').innerHTML +=
          '<div style="padding:6px 0;color:var(--green)">Invite sent to ' + window.esc(t.display_name || t.username) + '</div>';
        document.getElementById('inv-input').value = "";
      } catch(e) {
        document.getElementById('inv-log').innerHTML +=
          '<div style="padding:6px 0;color:#ff8aa8">' + window.esc(e.message || String(e)) + '</div>';
      }
    }
    document.getElementById('inv-go').onclick = doInvite;
    document.getElementById('inv-input').addEventListener('keydown', function(e){
      if (e.key === "Enter") doInvite();
    });
  };

  // Replace inviteToServer with a no-op that routes to sendInviteToUser
  window.inviteToServer = function(serverId, username){
    return window.sendInviteToUser(serverId, username);
  };

  // Invites modal
  window.openInvitesModal = function(){
    var list = window.INVITES;
    var h = '';
    if (!list.length) {
      h = '<div class="empty"><div class="big">' + window.SVG.bell + '</div>No pending invites.</div>';
    } else {
      list.forEach(function(inv){
        var srv = (window.INVITE_SERVERS || {})[inv.server_id] || { name: 'Unknown server' };
        var from = window.PROFILES[inv.from_user] || { username: 'unknown', display_name: 'Unknown' };
        h += '<div style="display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;background:rgba(255,255,255,.03);margin-bottom:8px">' +
          '<div style="flex:1;min-width:0"><div style="font-weight:600">' + window.esc(srv.name) + '</div>' +
          '<div style="font-size:12px;color:var(--text3)">Invited by ' + window.esc(from.display_name || from.username) + '</div></div>' +
          '<button class="btn sm primary" data-inv-accept="' + inv.id + '">Accept</button>' +
          '<button class="btn sm danger" data-inv-reject="' + inv.id + '">Decline</button>' +
          '</div>';
      });
    }
    window.openModal("Pending Invites", h);
  };

  // Wire invite buttons
  document.addEventListener("click", function(e){
    var acc = e.target.closest("[data-inv-accept]");
    if (acc) { e.preventDefault(); e.stopPropagation(); window.closeModal(); window.acceptInvite(acc.dataset.invAccept); return; }
    var rej = e.target.closest("[data-inv-reject]");
    if (rej) { e.preventDefault(); e.stopPropagation(); window.closeModal(); window.rejectInvite(rej.dataset.invReject); return; }
    var invBtn = e.target.closest('[data-rail="invites"]');
    if (invBtn) { e.preventDefault(); e.stopPropagation(); window.openInvitesModal(); return; }
  }, true);

  // Rail override to add invites button + badge
  var _origRenderRail = window.renderRail;
  window.renderRail = function(){
    _origRenderRail();
    var rail = document.getElementById('rail');
    if (!rail) return;
    var pending = (window.INVITES || []).length;
    var btn = rail.querySelector('[data-rail="invites"]');
    if (pending > 0 && !btn) {
      btn = document.createElement('button');
      btn.className = 'rail-btn';
      btn.setAttribute('data-rail', 'invites');
      btn.title = 'Invites (' + pending + ')';
      btn.innerHTML = window.SVG.bell + '<span class="badge rail-badge">' + pending + '</span>';
      var anchor = rail.querySelector('[data-rail="find"]');
      if (anchor) rail.insertBefore(btn, anchor);
      else rail.appendChild(btn);
    } else if (pending > 0 && btn) {
      var b = btn.querySelector('.badge');
      if (b) b.textContent = pending;
      else btn.insertAdjacentHTML('beforeend', '<span class="badge rail-badge">' + pending + '</span>');
    } else if (btn) {
      btn.remove();
    }
  };

  function subscribeInvites(){
    if (invitesCh) { try { sb.removeChannel(invitesCh); } catch(e){} }
    if (!window.ME) return;
    invitesCh = sb.channel('invites-' + window.ME.id)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'server_invites', filter: 'to_user=eq.' + window.ME.id },
        async function(payload){
          await loadInvites();
          window.renderRail();
          if (payload.eventType === 'INSERT') {
            var srv = (window.INVITE_SERVERS || {})[payload.new.server_id] || { name: 'a server' };
            window.toast("New invite", "You were invited to " + srv.name, "ok");
          }
        })
      .subscribe();
  }

  // ============================================================
  // ROLES
  // ============================================================
  async function loadRoles(serverId){
    var { data, error } = await sb.from('server_roles').select('*').eq('server_id', serverId).order('position', { ascending: false });
    if (error) { log("loadRoles", error); return; }
    window.ROLES = data || [];
  }
  async function loadMemberRoles(serverId){
    var { data, error } = await sb.from('server_member_roles').select('*').eq('server_id', serverId);
    if (error) { log("loadMemberRoles", error); return; }
    var map = {};
    (data||[]).forEach(function(r){
      if (!map[r.user_id]) map[r.user_id] = [];
      map[r.user_id].push(r.role_id);
    });
    window.MEMBER_ROLES = map;
  }

  window.openRolesModal = async function(){
    if (!window.CURRENT.server) return;
    await loadRoles(window.CURRENT.server.id);
    var roles = window.ROLES.slice();
    var h = '';
    if (!roles.length) h += '<div class="empty" style="padding:12px">No roles yet. Create one below.</div>';
    roles.forEach(function(r){
      h += '<div style="display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;background:rgba(255,255,255,.03);margin-bottom:6px">' +
        '<span style="width:14px;height:14px;border-radius:50%;background:' + window.esc(r.color) + '"></span>' +
        '<span style="flex:1;font-weight:600">' + window.esc(r.name) + '</span>' +
        '<span style="font-size:11px;color:var(--text3)">pos ' + r.position + '</span>' +
        '<button class="btn sm danger" data-del-role="' + r.id + '">Delete</button>' +
        '</div>';
    });
    h += '<hr style="border:none;border-top:1px solid var(--border);margin:16px 0">';
    h += '<div class="field"><label>New role name</label><input id="role-name" placeholder="Moderator" maxlength="32"></div>';
    h += '<div class="field"><label>Color (hex)</label><input id="role-color" value="#b44aff" maxlength="7"></div>';
    h += '<button class="btn primary" id="role-add">Create Role</button>';
    window.openModal("Manage Roles", h, {
      onMount: function(){
        document.getElementById('role-add').onclick = async function(){
          var name = document.getElementById('role-name').value.trim();
          var color = document.getElementById('role-color').value.trim() || '#b44aff';
          if (!name) return window.toast("Name required", "", "err");
          try {
            await sb.from('server_roles').insert({
              server_id: window.CURRENT.server.id, name: name, color: color, position: 10
            });
            await loadRoles(window.CURRENT.server.id);
            window.closeModal();
            window.openRolesModal();
            window.toast("Created", "Role added.", "ok");
          } catch(e) { window.toast("Error", e.message || String(e), "err"); }
        };
        document.querySelectorAll('[data-del-role]').forEach(function(b){
          b.onclick = async function(){
            try {
              await sb.from('server_roles').delete().eq('id', b.dataset.delRole);
              await loadRoles(window.CURRENT.server.id);
              await loadMemberRoles(window.CURRENT.server.id);
              window.closeModal();
              window.openRolesModal();
              window.renderMembers();
            } catch(e) { window.toast("Error", e.message || String(e), "err"); }
          };
        });
      }
    });
  };

  window.openMemberRolesModal = async function(userId){
    if (!window.CURRENT.server) return;
    await loadRoles(window.CURRENT.server.id);
    await loadMemberRoles(window.CURRENT.server.id);
    var current = window.MEMBER_ROLES[userId] || [];
    var p = window.PROFILES[userId] || { username: 'user', display_name: 'User' };
    var roles = window.ROLES.slice();
    var h = '<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">' +
      window.avatarHTML(userId, 44) +
      '<div><div style="font-weight:600">' + window.esc(p.display_name || p.username) + '</div>' +
      '<div style="font-size:12px;color:var(--text3)">@' + window.esc(p.username) + '</div></div></div>';
    if (!roles.length) {
      h += '<div class="empty">No roles yet. Open the server menu → Manage Roles to create some.</div>';
    } else {
      h += '<div style="display:flex;flex-direction:column;gap:4px">';
      roles.forEach(function(r){
        var checked = current.indexOf(r.id) >= 0 ? 'checked' : '';
        h += '<label style="display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;cursor:pointer;background:rgba(255,255,255,.03)">' +
          '<input type="checkbox" data-urole="' + r.id + '" ' + checked + ' style="accent-color:var(--cyan)">' +
          '<span style="width:10px;height:10px;border-radius:50%;background:' + window.esc(r.color) + '"></span>' +
          '<span style="flex:1">' + window.esc(r.name) + '</span></label>';
      });
      h += '</div>';
    }
    window.openModal("Roles for " + (p.display_name || p.username), h, {
      footer: '<button class="btn" id="mr-cancel">Cancel</button><button class="btn primary" id="mr-save">Save</button>',
      onMount: function(){
        document.getElementById('mr-cancel').onclick = window.closeModal;
        document.getElementById('mr-save').onclick = async function(){
          try {
            await sb.from('server_member_roles').delete().eq('server_id', window.CURRENT.server.id).eq('user_id', userId);
            var picked = Array.from(document.querySelectorAll('[data-urole]:checked')).map(function(c){ return c.dataset.urole; });
            if (picked.length) {
              var rows = picked.map(function(rid){ return { server_id: window.CURRENT.server.id, user_id: userId, role_id: rid }; });
              await sb.from('server_member_roles').insert(rows);
            }
            await loadMemberRoles(window.CURRENT.server.id);
            window.closeModal();
            window.renderMembers();
            window.renderChat(false);
            window.toast("Saved", "Roles updated.", "ok");
          } catch(e) { window.toast("Error", e.message || String(e), "err"); }
        };
      }
    });
  };

  // Right-click member -> role menu
  document.addEventListener("contextmenu", function(e){
    var mbr = e.target.closest("[data-member]");
    if (!mbr) return;
    if (window.CURRENT.type !== "server" || !window.CURRENT.server) return;
    e.preventDefault();
    var userId = mbr.dataset.member;
    var isOwner = (window.CURRENT && window.CURRENT.server ? window.CURRENT.server.owner_id : null) === window.ME.id;
    var items = [
      { head: window.PROFILES[userId] ? (window.PROFILES[userId].display_name || window.PROFILES[userId].username) : userId },
      { id: "profile", label: "View Profile", icon: window.SVG.user, onClick: function(){ window.openProfile(userId); } }
    ];
    if (isOwner) {
      items.push({ id: "roles", label: "Manage Roles", icon: window.SVG.tag, onClick: function(){ window.openMemberRolesModal(userId); } });
    }
    window.openMenu(e.clientX, e.clientY, items);
  });

  // Add "Manage Roles" to server menu
  var _origOpenServerMenu = window.openServerMenu;
  window.openServerMenu = function(x, y){
    if (!window.CURRENT.server) return;
    var srv = window.CURRENT.server;
    var isOwner = srv.owner_id === window.ME.id;
    var items = [{ head: srv.name }];
    if (isOwner) {
      items.push({ id: "invite",  label: "Invite People",   icon: window.SVG.users, onClick: window.openInviteServer });
      items.push({ id: "addch",   label: "Create Channel",  icon: window.SVG.plus,  onClick: function(){ window.openAddChannel("Text Channels"); } });
      items.push({ id: "roles",   label: "Manage Roles",    icon: window.SVG.tag,   onClick: window.openRolesModal });
      items.push({ sep: true });
      items.push({ id: "del", label: "Delete Server", icon: window.SVG.trash, danger: true, onClick: function(){
        window.confirmModal("Delete " + srv.name + "?", "All channels and messages will be deleted.", async function(){
          try {
            await window.deleteServer(srv.id);
            await window.loadServers();
            await window.goHome();
            window.toast("Deleted", "Server removed.", "ok");
          } catch(e){ window.toast("Error", e.message || String(e), "err"); }
        }, true);
      }});
    } else {
      items.push({ id: "leave", label: "Leave Server", icon: window.SVG.logout, danger: true, onClick: async function(){
        try {
          await window.leaveServer(srv.id);
          await window.loadServers();
          await window.goHome();
          window.toast("Left", "You left " + srv.name + ".", "ok");
        } catch(e){ window.toast("Error", e.message || String(e), "err"); }
      }});
    }
    window.openMenu(x, y, items);
  };

  function topRoleFor(userId){
    var mr = window.MEMBER_ROLES[userId] || [];
    var best = null;
    mr.forEach(function(rid){
      var r = window.ROLES.find(function(x){ return x.id === rid; });
      if (!r) return;
      if (!best || (r.position || 0) > (best.position || 0)) best = r;
    });
    return best;
  }

  // Render members grouped by top role
  window.renderMembers = async function(){
    var el = document.getElementById('members');
    if (!el) return;
    if (!window.CURRENT || window.CURRENT.type !== 'server' || !window.CURRENT.server) { el.innerHTML = ''; return; }
    if (!window.UI.showMembers) { el.innerHTML = ''; return; }
    var __srv = window.CURRENT.server;
    try {
      if (!window.ROLES.length || Object.keys(window.MEMBER_ROLES).length === 0) {
        await loadRoles(__srv.id);
        await loadMemberRoles(__srv.id);
      }
    } catch(e){ log("roles load failed:", e && e.message); }
    if (!window.CURRENT || window.CURRENT.server !== __srv) return;
    var ids;
    try { ids = await window.loadServerMembers(__srv.id); } catch(e){ el.innerHTML = ''; return; }
    if (!window.CURRENT || window.CURRENT.server !== __srv) return;
    var groups = {};
    var noRole = [];
    ids.forEach(function(uid){
      var top = topRoleFor(uid);
      if (top) {
        if (!groups[top.id]) groups[top.id] = { role: top, list: [] };
        groups[top.id].list.push(uid);
      } else {
        noRole.push(uid);
      }
    });
    var groupIds = Object.keys(groups).sort(function(a,b){
      return (groups[b].role.position || 0) - (groups[a].role.position || 0);
    });
    function memberHTML(uid, color){
      var p = window.PROFILES[uid] || { username: 'unknown', display_name: 'Unknown' };
      var online = window.ONLINE.has(uid);
      var isOwner = uid === (window.CURRENT&&window.CURRENT.server?(window.CURRENT && window.CURRENT.server ? window.CURRENT.server.owner_id : null):null);
      var nameStyle = color ? ' style="color:' + color + '"' : '';
      return '<div class="member ' + (online ? '' : 'offline') + '" data-member="' + window.esc(uid) + '">' +
        '<div style="position:relative">' + window.avatarHTML(uid, 32) + window.statusDot(uid) + '</div>' +
        '<div style="flex:1;min-width:0"><div class="nm"' + nameStyle + '>' + window.esc(p.display_name || p.username) +
        (isOwner ? '<span class="pill" style="background:rgba(255,171,0,.15);color:var(--amber);font-size:9px;padding:1px 6px;border-radius:99px;text-transform:uppercase;font-weight:700">owner</span>' : '') +
        '</div><div class="uid">@' + window.esc(p.username) + '</div></div></div>';
    }
    var h = '';
    groupIds.forEach(function(gid){
      var g = groups[gid];
      g.list.sort(function(a,b){
        var sa = window.ONLINE.has(a) ? 0 : 1, sb = window.ONLINE.has(b) ? 0 : 1;
        if (sa !== sb) return sa - sb;
        return window.userLabel(a).localeCompare(window.userLabel(b));
      });
      h += '<div class="mgroup"><div class="glabel" style="color:' + window.esc(g.role.color) + '">' +
        window.esc(g.role.name) + ' \u2014 ' + g.list.length + '</div>';
      g.list.forEach(function(uid){ h += memberHTML(uid, g.role.color); });
      h += '</div>';
    });
    if (noRole.length) {
      noRole.sort(function(a,b){
        var sa = window.ONLINE.has(a) ? 0 : 1, sb = window.ONLINE.has(b) ? 0 : 1;
        if (sa !== sb) return sa - sb;
        return window.userLabel(a).localeCompare(window.userLabel(b));
      });
      h += '<div class="mgroup"><div class="glabel">Members \u2014 ' + noRole.length + '</div>';
      noRole.forEach(function(uid){ h += memberHTML(uid, null); });
      h += '</div>';
    }
    if (!h) h = '<div class="empty">No members yet.</div>';
    el.innerHTML = h;
  };

  function subscribeRoles(serverId){
    if (rolesCh) { try { sb.removeChannel(rolesCh); } catch(e){} }
    rolesCh = sb.channel('roles-' + serverId)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'server_roles', filter: 'server_id=eq.' + serverId },
        async function(){ await loadRoles(serverId); window.renderMembers(); window.renderChat(false); })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'server_member_roles', filter: 'server_id=eq.' + serverId },
        async function(){ await loadMemberRoles(serverId); window.renderMembers(); window.renderChat(false); })
      .subscribe();
  }

  // ============================================================
  // REACTIONS
  // ============================================================
  async function loadReactionsForMessages(msgs){
    var ids = (msgs || []).map(function(m){ return m.id; });
    window.REACTIONS = {};
    if (!ids.length) return;
    var { data, error } = await sb.from('message_reactions').select('*').in('message_id', ids);
    if (error) { log("loadReactions", error); return; }
    (data||[]).forEach(function(r){
      if (!window.REACTIONS[r.message_id]) window.REACTIONS[r.message_id] = {};
      if (!window.REACTIONS[r.message_id][r.emoji]) window.REACTIONS[r.message_id][r.emoji] = [];
      window.REACTIONS[r.message_id][r.emoji].push(r.user_id);
    });
  }

  window.toggleReaction = async function(messageId, emoji){
    var mine = (window.REACTIONS[messageId] && window.REACTIONS[messageId][emoji] || []).indexOf(window.ME.id) >= 0;
    try {
      if (mine) {
        await sb.from('message_reactions').delete()
          .eq('message_id', messageId).eq('user_id', window.ME.id).eq('emoji', emoji);
        // local update
        if (window.REACTIONS[messageId] && window.REACTIONS[messageId][emoji]) {
          window.REACTIONS[messageId][emoji] = window.REACTIONS[messageId][emoji].filter(function(u){ return u !== window.ME.id; });
          if (!window.REACTIONS[messageId][emoji].length) delete window.REACTIONS[messageId][emoji];
        }
      } else {
        await sb.from('message_reactions').insert({ message_id: messageId, user_id: window.ME.id, emoji: emoji });
        if (!window.REACTIONS[messageId]) window.REACTIONS[messageId] = {};
        if (!window.REACTIONS[messageId][emoji]) window.REACTIONS[messageId][emoji] = [];
        if (window.REACTIONS[messageId][emoji].indexOf(window.ME.id) < 0) {
          window.REACTIONS[messageId][emoji].push(window.ME.id);
        }
      }
      // broadcast
      if (currentReactionsSub) {
        try {
          currentReactionsSub.send({ type: 'broadcast', event: 'rx', payload: { message_id: messageId, emoji: emoji, user_id: window.ME.id, remove: mine } });
        } catch(e){}
      }
      window.renderChat(false);
    } catch(e) { window.toast("Reaction failed", e.message || String(e), "err"); }
  };

  window.openReactionPicker = function(anchor, messageId){
    window.closeMenu();
    var pop = document.createElement('div');
    pop.className = 'emoji-pop';
    pop.innerHTML = EMOJIS.map(function(e){
      return '<button data-pick="' + e + '">' + e + '</button>';
    }).join('');
    document.body.appendChild(pop);
    var r = anchor.getBoundingClientRect();
    var left = Math.max(10, Math.min(r.left - 150, window.innerWidth - 320));
    var top = r.top - pop.offsetHeight - 8;
    if (top < 10) top = r.bottom + 8;
    pop.style.left = left + 'px';
    pop.style.top = top + 'px';
    pop.addEventListener('click', function(e){
      var b = e.target.closest('[data-pick]');
      if (!b) return;
      e.preventDefault();
      e.stopPropagation();
      window.toggleReaction(messageId, b.dataset.pick);
      window.closeMenu();
      pop.remove();
    });
    setTimeout(function(){
      document.addEventListener('click', function h(ev){
        if (!pop.contains(ev.target)) { pop.remove(); document.removeEventListener('click', h, true); }
      }, true);
    }, 0);
  };

  function subscribeReactions(targetKey){
    if (currentReactionsSub && currentReactionsTarget === targetKey) return;
    if (currentReactionsSub) { try { sb.removeChannel(currentReactionsSub); } catch(e){} }
    currentReactionsTarget = targetKey;
    currentReactionsSub = sb.channel('rx-' + targetKey, { config: { broadcast: { self: false } } })
      .on('broadcast', { event: 'rx' }, function(payload){
        var m = payload.message_id, emoji = payload.emoji, uid = payload.user_id;
        if (!window.REACTIONS[m]) window.REACTIONS[m] = {};
        if (!window.REACTIONS[m][emoji]) window.REACTIONS[m][emoji] = [];
        var arr = window.REACTIONS[m][emoji];
        if (payload.remove) {
          window.REACTIONS[m][emoji] = arr.filter(function(x){ return x !== uid; });
          if (!window.REACTIONS[m][emoji].length) delete window.REACTIONS[m][emoji];
        } else if (arr.indexOf(uid) < 0) {
          arr.push(uid);
        }
        window.renderChat(false);
      })
      .subscribe();
  }

  // Override loadMessages to also load reactions + subscribe
  var _origLoadConv = window.loadMessagesForConversation;
  window.loadMessagesForConversation = async function(convId){
    await _origLoadConv(convId);
    await loadReactionsForMessages(window.MESSAGES);
    subscribeReactions('conv:' + convId);
  };
  var _origLoadChan = window.loadMessagesForChannel;
  window.loadMessagesForChannel = async function(channelId){
    await _origLoadChan(channelId);
    await loadReactionsForMessages(window.MESSAGES);
    subscribeReactions('channel:' + channelId);
  };

  // Full messageHTML override with reactions
  window.messageHTML = function(m, grouped){
    if (m.deleted) return '<div class="msg deleted"><div style="width:36px;flex:none"></div><div class="body"><div class="content">This message was deleted.</div></div></div>';
    var p = window.PROFILES[m.sender_id] || { username: 'unknown', display_name: 'Unknown' };
    var mine = m.sender_id === window.ME.id;
    var roleColor = null;
    if (window.CURRENT.type === 'server' && window.CURRENT.server) {
      var top = topRoleFor(m.sender_id);
      if (top) roleColor = top.color;
    }
    var h = '<div class="msg" data-msg="' + m.id + '">';
    if (grouped) h += '<div style="width:36px;flex:none"></div>';
    else h += '<div style="position:relative">' + window.avatarHTML(m.sender_id, 36) + window.statusDot(m.sender_id) + '</div>';
    h += '<div class="body">';
    if (!grouped) {
      var nameStyle = roleColor ? ' style="color:' + window.esc(roleColor) + '"' : '';
      h += '<div class="head"><span class="author"' + nameStyle + ' data-user="' + window.esc(m.sender_id) + '">' +
        window.esc(p.display_name || p.username) + '</span>' +
        '<span class="uid">@' + window.esc(p.username) + '</span>' +
        '<span class="time">' + window.timeLabel(m.created_at) + '</span>' +
        (m.edited ? '<span class="edited">(edited)</span>' : '') + '</div>';
    }
    h += '<div class="content">' + window.esc(m.content || '') + '</div>';
    // Reactions
    var rx = window.REACTIONS[m.id] || {};
    var keys = Object.keys(rx);
    if (keys.length) {
      h += '<div class="reactions">';
      keys.forEach(function(emoji){
        var users = rx[emoji];
        var mineRx = users.indexOf(window.ME.id) >= 0;
        h += '<button class="reaction' + (mineRx ? ' mine' : '') + '" data-rx="' + m.id + '" data-rx-emoji="' + window.esc(emoji) + '">' +
          '<span>' + emoji + '</span><span class="cnt">' + users.length + '</span></button>';
      });
      h += '</div>';
    }
    h += '</div>';
    // Toolbar
    h += '<div class="toolbar">';
    h += '<button data-act="react" data-msg="' + m.id + '" title="Add reaction">' + window.SVG.smile + '</button>';
    if (mine) h += '<button data-act="edit-msg" data-msg="' + m.id + '" title="Edit">' + window.SVG.pencil + '</button>';
    if (mine) h += '<button class="danger" data-act="del-msg" data-msg="' + m.id + '" title="Delete">' + window.SVG.trash + '</button>';
    h += '</div></div>';
    return h;
  };

  // Click handlers for reactions & picker
  document.addEventListener("click", function(e){
    var rx = e.target.closest("[data-rx]");
    if (rx) {
      e.preventDefault(); e.stopPropagation();
      window.toggleReaction(Number(rx.dataset.rx), rx.dataset.rxEmoji);
      return;
    }
    var btn = e.target.closest('[data-act="react"]');
    if (btn) {
      e.preventDefault(); e.stopPropagation();
      window.openReactionPicker(btn, Number(btn.dataset.msg));
      return;
    }
  }, true);

  // ============================================================
  // WATCHDOG — reload roles when current server changes
  // ============================================================
  setInterval(async function(){
    if (!window.ME || !window.CURRENT) return;
    var cur = window.CURRENT.server ? window.CURRENT.server.id : null;
    if (cur !== lastServerId) {
      lastServerId = cur;
      if (cur) {
        await loadRoles(cur);
        await loadMemberRoles(cur);
        subscribeRoles(cur);
      } else {
        window.ROLES = [];
        window.MEMBER_ROLES = {};
      }
      window.renderMembers();
      window.renderChat(false);
    }
  }, 400);

  // ============================================================
  // BOOT EXTENSION
  // ============================================================
  async function enhanceBoot(){
    // Wait until main script has loaded the user
    var tries = 0;
    while (!window.ME && tries++ < 100) {
      await new Promise(function(r){ setTimeout(r, 100); });
    }
    if (!window.ME) return;
    await loadInvites();
    subscribeInvites();
    window.renderRail();
    log("boot extension done");
  }
  enhanceBoot();
})();
</script>

<!-- SLEEPY_PARITY_V1 -->
<style>
.mention-pop{
  position:absolute;z-index:400;background:var(--surface2);border:1px solid var(--border);
  border-radius:10px;padding:5px;box-shadow:0 20px 55px rgba(0,0,0,.7);
  min-width:260px;max-height:280px;overflow-y:auto;
}
.mention-pop .mhead{padding:7px 10px 4px;font-size:10px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--text3)}
.mention-pop button{
  display:flex;align-items:center;gap:9px;width:100%;padding:7px 10px;border-radius:7px;
  font-size:13px;color:var(--text2);text-align:left;transition:all .1s;
}
.mention-pop button:hover,.mention-pop button.sel{
  background:rgba(0,255,224,.13);color:var(--text)
}
.mention-pop .avatar{flex:none}
.mention-pop .role-dot{width:10px;height:10px;border-radius:50%;flex:none}
.mention-pop .sub{font-size:11px;color:var(--text3);margin-left:auto}
.mention-pop .empty{padding:10px;font-size:12px;color:var(--text3);text-align:center}
</style>
<script>
(function(){
  "use strict";
  if (window.__sleepyParity) return;
  window.__sleepyParity = true;

  function log(){ try{ console.log.apply(console,["[Parity]"].concat([].slice.call(arguments))); }catch(e){} }

  /* ============================================================
     1. COMPOSER KEEPS FOCUS AFTER SEND
     ============================================================ */
  // Wrap renderChat so that if the composer was focused before, we
  // re-focus it after the re-render that follows a send.
  var origRenderChat = window.renderChat;
  window.renderChat = function(scroll){
    var hadFocus = false;
    var prior = document.getElementById("composer-input");
    if (prior && document.activeElement === prior) hadFocus = true;
    if (typeof window.__sleepyComposerFocusFlag !== "undefined" && window.__sleepyComposerFocusFlag) {
      hadFocus = true;
      window.__sleepyComposerFocusFlag = false;
    }
    origRenderChat(scroll);
    if (hadFocus) {
      var ta = document.getElementById("composer-input");
      if (ta) {
        ta.focus();
        // restore caret to end
        try { ta.setSelectionRange(ta.value.length, ta.value.length); } catch(e){}
      }
    }
  };

  // Wrap doSendFromComposer to set the flag before the realtime re-render.
  var origSend = window.doSendFromComposer;
  if (typeof origSend === "function") {
    window.doSendFromComposer = async function(){
      window.__sleepyComposerFocusFlag = true;
      try {
        await origSend();
      } finally {
        // If realtime hasn't fired yet, still restore focus immediately.
        setTimeout(function(){
          var ta = document.getElementById("composer-input");
          if (ta && document.activeElement !== ta) ta.focus();
        }, 0);
      }
    };
  }

  /* ============================================================
     2. @ MENTION AUTOCOMPLETE
     ============================================================ */
  var pop = null;
  var currentItems = [];
  var selIndex = 0;
  var anchorStart = -1;   // index in textarea value where @ begins

  function closeMention(){
    if (pop) { pop.remove(); pop = null; }
    currentItems = [];
    selIndex = 0;
    anchorStart = -1;
  }

  function escapeHtml(s){
    return String(s==null?"":s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }

  function buildItems(query){
    var items = [];
    var q = (query || "").toLowerCase();

    // "everyone" and "here" keywords - only when user has permission
    var canEveryone = true; // simplified: any member can use in this build
    if (canEveryone) {
      if (!q || "everyone".indexOf(q) === 0) {
        items.push({ kind:"special", id:"everyone", name:"everyone", label:"@everyone", desc:"Notify everyone" });
      }
      if (!q || "here".indexOf(q) === 0) {
        items.push({ kind:"special", id:"here", name:"here", label:"@here", desc:"Notify online members" });
      }
    }

    // Roles (only when in a server context)
    var roles = window.ROLES || [];
    roles.forEach(function(r){
      var name = r.name || "";
      if (q && name.toLowerCase().indexOf(q) < 0) return;
      items.push({ kind:"role", id:r.id, name:name, label:"@"+name, color:r.color });
    });

    // Users - members of the current server, or friends in DMs
    var userPool = [];
    if (window.CURRENT && window.CURRENT.type === "server" && window.CURRENT.server) {
      // collect server members we know
      for (var uid in window.PROFILES) {
        // we cannot cheaply tell who's a server member here; the member list
        // already filtered it, so use the current member list element if present
      }
      // Read member ids off the rendered member list
      document.querySelectorAll("[data-member]").forEach(function(el){
        var uid = el.getAttribute("data-member");
        if (uid && uid !== window.ME.id) userPool.push(uid);
      });
      // Fallback: everyone we know about
      if (!userPool.length) {
        for (var uid2 in window.PROFILES) {
          if (uid2 !== window.ME.id) userPool.push(uid2);
        }
      }
    } else if (window.CURRENT && window.CURRENT.type === "dm" && window.CURRENT.conv) {
      window.CURRENT.conv.memberIds.forEach(function(uid){
        if (uid !== window.ME.id) userPool.push(uid);
      });
    } else {
      // home: friends
      (window.FRIENDS.accepted || []).forEach(function(f){ userPool.push(f.other); });
    }

    // Dedupe
    var seen = {};
    var deduped = [];
    userPool.forEach(function(uid){ if (!seen[uid]) { seen[uid]=1; deduped.push(uid); } });

    deduped.forEach(function(uid){
      var p = window.PROFILES[uid];
      if (!p) return;
      var uname = p.username || "";
      var dname = p.display_name || uname;
      if (q && uname.toLowerCase().indexOf(q) < 0 && dname.toLowerCase().indexOf(q) < 0) return;
      items.push({ kind:"user", id:uid, name:uname, label:dname, username:uname });
    });

    return items.slice(0, 12);
  }

  function renderPop(){
    if (!pop) return;
    var h = "";
    var groups = { special:[], role:[], user:[] };
    currentItems.forEach(function(it){ groups[it.kind].push(it); });

    var flat = [];
    function addGroup(title, arr){
      if (!arr.length) return;
      h += '<div class="mhead">'+escapeHtml(title)+'</div>';
      arr.forEach(function(it){
        var idx = flat.length;
        flat.push(it);
        var cls = (idx === selIndex) ? "sel" : "";
        var inner = "";
        if (it.kind === "user") {
          inner = window.avatarHTML(it.id, 22) +
            '<span>'+escapeHtml(it.label)+'</span>' +
            '<span class="sub">@'+escapeHtml(it.username)+'</span>';
        } else if (it.kind === "role") {
          inner = '<span class="role-dot" style="background:'+escapeHtml(it.color)+'"></span>' +
            '<span>'+escapeHtml(it.label)+'</span>' +
            '<span class="sub">role</span>';
        } else {
          inner = '<span style="font-weight:700;color:var(--cyan)">'+escapeHtml(it.label)+'</span>' +
            '<span class="sub">'+escapeHtml(it.desc)+'</span>';
        }
        h += '<button data-mention-idx="'+idx+'" class="'+cls+'">'+inner+'</button>';
      });
    }
    addGroup("Special", groups.special);
    addGroup("Roles", groups.role);
    addGroup("Members", groups.user);

    if (!flat.length) h = '<div class="empty">No matches</div>';
    pop.innerHTML = h;

    // Click handler
    pop.querySelectorAll("[data-mention-idx]").forEach(function(btn){
      btn.addEventListener("mousedown", function(e){
        e.preventDefault();
        var idx = parseInt(btn.getAttribute("data-mention-idx"), 10);
        selIndex = idx;
        insertSelected();
      });
    });
  }

  function showPop(ta, items){
    currentItems = items;
    if (selIndex >= items.length) selIndex = 0;
    if (!pop) {
      pop = document.createElement("div");
      pop.className = "mention-pop";
      document.body.appendChild(pop);
    }
    var r = ta.getBoundingClientRect();
    pop.style.left = r.left + "px";
    pop.style.bottom = (window.innerHeight - r.top + 6) + "px";
    pop.style.top = "auto";
    renderPop();
  }

  function insertSelected(){
    var ta = document.getElementById("composer-input");
    if (!ta || anchorStart < 0 || !currentItems.length) return;
    var it = currentItems[selIndex];
    var insert;
    if (it.kind === "special") insert = "@"+it.name+" ";
    else if (it.kind === "role") insert = "@"+it.name.replace(/\s+/g,"-")+" ";
    else insert = "@"+it.name+" ";

    var before = ta.value.slice(0, anchorStart);
    var after = ta.value.slice(ta.selectionStart);
    ta.value = before + insert + after;
    var newPos = anchorStart + insert.length;
    ta.setSelectionRange(newPos, newPos);
    ta.focus();
    if (typeof window.autosize === "function") window.autosize(ta);
    closeMention();
  }

  function handleInput(e){
    var ta = e.target;
    if (!ta || ta.id !== "composer-input") return;
    var pos = ta.selectionStart;
    var text = ta.value.slice(0, pos);
    // Find the @ that starts the current token, if any
    var at = -1;
    for (var i = text.length - 1; i >= 0; i--) {
      var ch = text[i];
      if (ch === "@") { at = i; break; }
      if (ch === " " || ch === "\n" || ch === "\t") { at = -1; break; }
    }
    if (at < 0) { closeMention(); return; }
    // Ensure the char before @ is whitespace or start of input
    if (at > 0) {
      var prev = text[at-1];
      if (prev !== " " && prev !== "\n" && prev !== "\t") { closeMention(); return; }
    }
    anchorStart = at;
    var query = text.slice(at+1);
    var items = buildItems(query);
    if (!items.length) { closeMention(); return; }
    showPop(ta, items);
  }

  // Attach input listener at document level (composer is re-rendered often)
  document.addEventListener("input", handleInput);

  // Capture phase keydown so we win before the composer's own Enter handler
  document.addEventListener("keydown", function(e){
    if (!pop) return;
    var ta = document.getElementById("composer-input");
    if (!ta || document.activeElement !== ta) return;
    if (e.key === "ArrowDown") {
      e.preventDefault(); e.stopPropagation();
      selIndex = (selIndex + 1) % currentItems.length;
      renderPop();
    } else if (e.key === "ArrowUp") {
      e.preventDefault(); e.stopPropagation();
      selIndex = (selIndex - 1 + currentItems.length) % currentItems.length;
      renderPop();
    } else if (e.key === "Tab" || (e.key === "Enter" && !e.shiftKey)) {
      e.preventDefault(); e.stopPropagation();
      insertSelected();
    } else if (e.key === "Escape") {
      e.preventDefault(); e.stopPropagation();
      closeMention();
    }
  }, true);

  // Close popup when clicking elsewhere
  document.addEventListener("mousedown", function(e){
    if (!pop) return;
    if (pop.contains(e.target)) return;
    var ta = document.getElementById("composer-input");
    if (ta && ta === e.target) return;
    closeMention();
  });

  // Close when switching conversations
  var origGoConversation = window.goConversation;
  if (typeof origGoConversation === "function") {
    window.goConversation = async function(id){
      closeMention();
      return origGoConversation(id);
    };
  }

  /* ============================================================
     3. CHAT-HEADER GEAR = SERVER SETTINGS (when in a server)
     ============================================================ */
  // Add a capture-phase click handler for the gear in the chat header.
  document.addEventListener("click", function(e){
    var btn = e.target.closest('#chat-head [data-act="settings"]');
    if (!btn) return;
    var inServer = window.CURRENT && window.CURRENT.type === "server" && window.CURRENT.server;
    if (!inServer) return; // fall through to user settings for DMs
    e.preventDefault(); e.stopImmediatePropagation(); e.stopPropagation();
    // Open the server settings the same way the server-name menu does:
    if (typeof window.openServerMenu === "function") {
      var r = btn.getBoundingClientRect();
      window.openServerMenu(r.left - 180, r.bottom + 4);
    } else if (typeof window.openServerSettings === "function") {
      window.openServerSettings(window.CURRENT.server.id);
    }
  }, true);

  log("parity patch ready");
})();
</script>

<script>
(function(){
  "use strict";
  if (window.__sleepyMRU) return;
  window.__sleepyMRU = true;
  function log(){ try{console.log.apply(console,["[MRU]"].concat([].slice.call(arguments)));}catch(e){} }

  // Attach state
  var PENDING_ATTACH = []; // [{ url, name, size, type, width, height }]
  var REPLY_TO = null;     // message id
  var UPLOAD_IN_PROGRESS = false;

  // ----------------------------------------------------------
  // @ MENTION PARSING
  // ----------------------------------------------------------
  function parseMentions(text){
    var mentionedIds = [];
    var special = { everyone: false, here: false };
    if (!text) return { ids: mentionedIds, everyone: false, here: false };
    // Find @tokens
    var re = /@([a-zA-Z0-9_\-\u00C0-\uFFFF]+)/g;
    var m;
    while ((m = re.exec(text))) {
      var token = m[1].toLowerCase();
      if (token === 'everyone') { special.everyone = true; continue; }
      if (token === 'here') { special.here = true; continue; }
      // Match a user by username (case insensitive)
      var found = null;
      for (var uid in window.PROFILES) {
        var p = window.PROFILES[uid];
        if (!p) continue;
        if ((p.username || '').toLowerCase() === token) { found = uid; break; }
      }
      if (found && found !== window.ME.id && mentionedIds.indexOf(found) < 0) mentionedIds.push(found);
    }
    return { ids: mentionedIds, everyone: special.everyone, here: special.here };
  }

  // Override sendMessage to include reply_to_id, attachments, mentions
  var origSendMessage = window.sendMessage;
  window.sendMessage = async function(text){
    if (!text && !PENDING_ATTACH.length) return;
    var parsed = parseMentions(text || "");
    var payload = {
      sender_id: window.ME.id,
      content: (text || "").slice(0, 4000),
      reply_to_id: REPLY_TO || null,
      attachments: PENDING_ATTACH.slice(),
      mentions: parsed.ids
    };
    if (window.CURRENT.type === "dm") payload.conversation_id = window.CURRENT.conv.id;
    else if (window.CURRENT.type === "server" && window.CURRENT.channel) payload.channel_id = window.CURRENT.channel.id;
    else throw new Error("No active target");
    var { error } = await sb.from('messages').insert(payload);
    if (error) throw error;
    // Fire local notifications for each mentioned user (others get theirs via realtime)
    PENDING_ATTACH = [];
    REPLY_TO = null;
  };

  // ----------------------------------------------------------
  // REPLIES
  // ----------------------------------------------------------
  window.startReply = function(messageId){
    REPLY_TO = messageId;
    renderReplyBar();
    var ta = document.getElementById('composer-input');
    if (ta) { ta.focus(); }
  };
  window.cancelReply = function(){
    REPLY_TO = null;
    renderReplyBar();
  };

  function renderReplyBar(){
    var wrap = document.getElementById('composer-wrap');
    if (!wrap) return;
    var existing = wrap.querySelector('.reply-bar');
    if (existing) existing.remove();
    if (!REPLY_TO) {
      var c = wrap.querySelector('.composer');
      if (c) c.classList.remove('replying');
      return;
    }
    var target = findMessageById(REPLY_TO);
    if (!target) { REPLY_TO = null; return; }
    var p = window.PROFILES[target.sender_id] || { username:'user', display_name:'User' };
    var snippet = String(target.content || '').slice(0, 60);
    var bar = document.createElement('div');
    bar.className = 'reply-bar';
    bar.innerHTML =
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 17-6-6 6-6"/><path d="M3 11h11a6 6 0 0 1 6 6v2"/></svg>' +
      '<span>Replying to <b style="color:var(--cyan)">' + window.esc(p.display_name || p.username) + '</b></span>' +
      '<span class="snippet">' + window.esc(snippet) + '</span>' +
      '<button class="xbtn" id="cancel-reply"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" width="14" height="14"><path d="M18 6 6 18M6 6l12 12"/></svg></button>';
    wrap.insertBefore(bar, wrap.firstChild);
    var c = wrap.querySelector('.composer');
    if (c) c.classList.add('replying');
    var cb = document.getElementById('cancel-reply');
    if (cb) cb.onclick = window.cancelReply;
  }

  function findMessageById(id){
    for (var i=0;i<window.MESSAGES.length;i++) if (window.MESSAGES[i].id === id) return window.MESSAGES[i];
    return null;
  }

  // Override messageHTML to show reply ref + attachments + attachments bar
  var origMessageHTML = window.messageHTML;
  window.messageHTML = function(m, grouped){
    // Build the reply-ref block ourselves; delegate the rest to orig
    var html = origMessageHTML(m, grouped);

    // If the message has reply_to_id, inject a reply reference before the content.
    if (m.reply_to_id && !m.deleted) {
      var parent = findMessageById(m.reply_to_id);
      if (parent) {
        var pp = window.PROFILES[parent.sender_id] || { username:'user', display_name:'User' };
        var snippet = String(parent.content || '').slice(0, 80);
        var ref =
          '<div class="reply-ref" data-jump="' + parent.id + '">' +
            '<span class="bar"></span>' +
            '<span class="who">@' + window.esc(pp.display_name || pp.username) + '</span>' +
            '<span class="snippet">' + window.esc(snippet) + '</span>' +
          '</div>';
        // Insert before the .content div
        html = html.replace('<div class="content">', ref + '<div class="content">');
      }
    }

    // If the message has attachments, render them after .content
    if (m.attachments && m.attachments.length) {
      var att = '<div class="attachments">';
      m.attachments.forEach(function(a){
        if (a.type && a.type.indexOf('image/') === 0) {
          att += '<img src="' + window.esc(a.url) + '" alt="' + window.esc(a.name || '') + '" loading="lazy" data-lightbox="' + window.esc(a.url) + '">';
        } else {
          att += '<a href="' + window.esc(a.url) + '" target="_blank" rel="noopener" style="padding:8px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;display:inline-block;font-size:12.5px">' + window.esc(a.name || 'file') + '</a>';
        }
      });
      att += '</div>';
      html = html.replace('</div><div class="toolbar">', att + '</div><div class="toolbar">');
    }

    // Highlight mentions in the rendered content
    if (m.mentions || /@(everyone|here)\b/.test(m.content || "")) {
      var mentionedMe = (m.mentions && m.mentions.indexOf(window.ME.id) >= 0) ||
                        /@everyone\b/i.test(m.content || "") ||
                        /@here\b/i.test(m.content || "");
      if (mentionedMe) {
        html = html.replace('class="msg"', 'class="msg" style="background:rgba(255,45,111,.045);border-left:2px solid rgba(255,45,111,.4)"');
      }
    }

    // Add reply button to the toolbar
    html = html.replace(
      '<button data-act="react"',
      '<button data-act="reply" data-msg="' + m.id + '" title="Reply">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 17-6-6 6-6"/><path d="M3 11h11a6 6 0 0 1 6 6v2"/></svg>' +
      '</button><button data-act="react"'
    );

    return html;
  };

  // Wire reply button + reply-ref jump + lightbox
  document.addEventListener('click', function(e){
    var rb = e.target.closest('[data-act="reply"]');
    if (rb) { e.preventDefault(); e.stopPropagation(); window.startReply(Number(rb.dataset.msg)); return; }
    var jm = e.target.closest('[data-jump]');
    if (jm) {
      e.preventDefault();
      var el = document.querySelector('[data-msg="' + jm.dataset.jump + '"]');
      if (el) {
        el.scrollIntoView({ behavior:'smooth', block:'center' });
        el.style.transition = 'background .3s';
        el.style.background = 'rgba(0,255,224,.08)';
        setTimeout(function(){ el.style.background = ''; }, 1400);
      }
      return;
    }
    var lb = e.target.closest('[data-lightbox]');
    if (lb) { window.open(lb.dataset.lightbox, '_blank'); return; }
  }, true);

  // ----------------------------------------------------------
  // ATTACHMENTS (chat image upload)
  // ----------------------------------------------------------
  function formatBytes(n){
    if (!n) return '';
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n/1024).toFixed(1) + ' KB';
    return (n/1048576).toFixed(1) + ' MB';
  }

  async function uploadFile(file, bucket){
    if (!file) return null;
    if (file.size > 8 * 1024 * 1024) throw new Error('File is larger than 8 MB.');
    var ext = (file.name.split('.').pop() || 'bin').toLowerCase();
    var path = window.ME.id + '/' + Date.now() + '-' + Math.random().toString(36).slice(2,8) + '.' + ext;
    var { error } = await sb.storage.from(bucket).upload(path, file, { contentType: file.type, upsert: false });
    if (error) throw error;
    var { data: pub } = sb.storage.from(bucket).getPublicUrl(path);
    return { url: pub.publicUrl, name: file.name, size: file.size, type: file.type };
  }

  // Override renderComposer to add reply bar, attach button, pending attachments
  var origRenderComposer = window.renderComposer;
  window.renderComposer = function(){
    origRenderComposer();
    var wrap = document.getElementById('composer-wrap');
    if (!wrap) return;

    // Insert a paperclip button before the send button
    var composer = wrap.querySelector('.composer');
    if (composer && !composer.querySelector('[data-attach]')) {
      var sendBtn = composer.querySelector('#send-btn');
      var attachBtn = document.createElement('button');
      attachBtn.className = 'cbtn';
      attachBtn.setAttribute('data-attach', '1');
      attachBtn.title = 'Attach file';
      attachBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.4 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>';
      composer.insertBefore(attachBtn, sendBtn);
      attachBtn.onclick = function(){
        var inp = document.getElementById('chat-file-input');
        if (!inp) {
          inp = document.createElement('input');
          inp.type = 'file';
          inp.id = 'chat-file-input';
          inp.accept = 'image/*';
          inp.multiple = true;
          inp.style.display = 'none';
          document.body.appendChild(inp);
          inp.addEventListener('change', onFilesChosen);
        }
        inp.click();
      };
    }
    renderReplyBar();
    renderPendingAttachments();
  };

  async function onFilesChosen(e){
    var files = Array.from(e.target.files || []);
    e.target.value = '';
    if (!files.length) return;
    UPLOAD_IN_PROGRESS = true;
    renderPendingAttachments();
    for (var i=0;i<files.length;i++){
      try {
        var info = await uploadFile(files[i], 'attachments');
        if (info) PENDING_ATTACH.push(info);
      } catch(err){
        window.toast('Upload failed', err.message || String(err), 'err');
      }
    }
    UPLOAD_IN_PROGRESS = false;
    renderPendingAttachments();
  }

  function renderPendingAttachments(){
    var wrap = document.getElementById('composer-wrap');
    if (!wrap) return;
    var existing = document.getElementById('pending-attachments');
    if (existing) existing.remove();
    if (!PENDING_ATTACH.length && !UPLOAD_IN_PROGRESS) return;
    var box = document.createElement('div');
    box.id = 'pending-attachments';
    box.style.cssText = 'display:flex;flex-wrap:wrap;gap:6px;padding:8px 0;align-items:center';
    if (UPLOAD_IN_PROGRESS) {
      box.innerHTML = '<div class="upload-progress">Uploading...</div>';
    } else {
      PENDING_ATTACH.forEach(function(a, i){
        var chip = document.createElement('div');
        chip.style.cssText = 'position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--border)';
        if (a.type && a.type.indexOf('image/') === 0){
          chip.innerHTML = '<img src="' + a.url + '" style="width:80px;height:80px;object-fit:cover;display:block">';
        } else {
          chip.innerHTML = '<div style="padding:8px 12px;background:var(--surface2);font-size:12px">' + window.esc(a.name) + '</div>';
        }
        var x = document.createElement('button');
        x.textContent = '\u00d7';
        x.style.cssText = 'position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1;cursor:pointer;border:none';
        x.onclick = function(){ PENDING_ATTACH.splice(i,1); renderPendingAttachments(); };
        chip.appendChild(x);
        box.appendChild(chip);
      });
    }
    var composer = wrap.querySelector('.composer');
    if (composer) composer.parentNode.insertBefore(box, composer);
    else wrap.appendChild(box);
  }

  // ----------------------------------------------------------
  // NOTIFICATIONS FOR MENTIONS
  // ----------------------------------------------------------
  // Extend the realtime messages subscription to fire mention notifications.
  // The main script's global subscriber already updates the app; we just watch
  // the same channel for the INSERT case and trigger a toast when we're mentioned.
  function startMentionWatcher(){
    if (window.__sleepyMentionCh) { try { sb.removeChannel(window.__sleepyMentionCh); } catch(e){} }
    window.__sleepyMentionCh = sb.channel('mention-watch', { config: { broadcast: { self: false } } })
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' },
        function(payload){
          var m = payload.new;
          if (!m || m.sender_id === window.ME.id) return;
          if (m.sender_id && !window.PROFILES[m.sender_id]) {
            window.fetchProfiles([m.sender_id]).then(function(){ afterProfile(); });
          } else afterProfile();
          function afterProfile(){
            var who = window.userLabel(m.sender_id);
            var txt = String(m.content || '').slice(0, 80);
            var mentionedMe = (m.mentions && m.mentions.indexOf(window.ME.id) >= 0);
            var atEveryone = /@everyone\b/i.test(m.content || "");
            var atHere = /@here\b/i.test(m.content || "");
            if (mentionedMe) {
              window.toast('You were mentioned', who + ': ' + txt, 'ok');
              if ('Notification' in window && Notification.permission === 'granted') {
                try { new Notification(who + ' mentioned you', { body: txt }); } catch(e){}
              }
            } else if (atEveryone || atHere) {
              window.toast(atEveryone ? 'everyone' : 'here', who + ': ' + txt, 'ok');
            }
          }
        })
      .subscribe();
  }

  // ----------------------------------------------------------
  // PROFILE ENHANCEMENTS (avatar, banner, accent, pronouns, website)
  // ----------------------------------------------------------
  window.openEditProfile = function(){
    var me = window.ME;
    var newAvatar = me.avatar_url || '';
    var newBanner = me.banner_url || '';
    var newAccent = me.accent_color || '#00ffe0';

    var tints = ['#00ffe0','#b44aff','#ff2d6f','#00e676','#ffab00','#00a3ff','#ff7aa2','#ffffff'];

    var html =
      '<div class="banner-preview" id="ep-banner" style="' + (newBanner ? 'background-image:url(\'' + newBanner + '\')' : '') + '">' +
        '<button class="btn sm change" id="ep-banner-btn">Change Banner</button>' +
      '</div>' +
      '<input type="file" id="ep-banner-file" accept="image/*" style="display:none">' +
      '<div style="display:flex;align-items:center;gap:14px;margin-bottom:14px">' +
        '<div style="position:relative;width:84px;height:84px">' + window.avatarHTML(me.id, 84) + '</div>' +

          '<button class="btn sm danger" id="ep-av-rm">Remove</button>' +

        '<input type="file" id="ep-av-file" accept="image/*" style="display:none">' +
      '</div>' +
      '<div class="field"><label>Display name</label><input id="ep-name" value="' + window.esc(me.display_name||"") + '" maxlength="40"></div>' +
      '<div class="field"><label>Pronouns</label><input id="ep-pronouns" value="' + window.esc(me.pronouns||"") + '" maxlength="40" placeholder="e.g. she/her, they/them"></div>' +
      '<div class="field"><label>Bio</label><textarea id="ep-bio" maxlength="300">' + window.esc(me.bio||"") + '</textarea></div>' +
      '<div class="field"><label>Website</label><input id="ep-web" value="' + window.esc(me.website||"") + '" placeholder="https://example.com"></div>' +
      '<div class="field"><label>Custom status</label><input id="ep-cs" maxlength="60" value="' + window.esc(me.custom_status||"") + '"></div>' +
      '<div class="field"><label>Name accent color</label>' +
        '<div class="tint-swatches" id="ep-tints">' +
          tints.map(function(t){ return '<div class="tint-swatch' + (t === newAccent ? ' sel' : '') + '" data-tint="' + t + '" style="background:' + t + '"></div>'; }).join("") +
        '</div>' +
      '</div>';

    window.openModal("Edit Profile", html, {
      footer: '<button class="btn" id="ep-no">Cancel</button><button class="btn primary" id="ep-yes">Save</button>',
      onMount: function(){
        document.getElementById('ep-av-btn').onclick = function(){ document.getElementById('ep-av-file').click(); };
        document.getElementById('ep-av-rm').onclick = function(){ newAvatar = ''; window.toast('Ready', 'Save to apply.'); };
        document.getElementById('ep-av-file').onchange = async function(e){
          var f = e.target.files[0]; if (!f) return;
          try {
            window.toast('Uploading', 'Avatar uploading...', 'ok');
            var info = await uploadFile(f, 'avatars');
            newAvatar = info.url;
            window.toast('Ready', 'Click Save to apply.', 'ok');
          } catch(err){ window.toast('Upload failed', err.message || String(err), 'err'); }
        };
        document.getElementById('ep-banner-btn').onclick = function(){ document.getElementById('ep-banner-file').click(); };
        document.getElementById('ep-banner-file').onchange = async function(e){
          var f = e.target.files[0]; if (!f) return;
          try {
            window.toast('Uploading', 'Banner uploading...', 'ok');
            var info = await uploadFile(f, 'banners');
            newBanner = info.url;
            document.getElementById('ep-banner').style.backgroundImage = 'url(' + info.url + ')';
            window.toast('Ready', 'Click Save to apply.', 'ok');
          } catch(err){ window.toast('Upload failed', err.message || String(err), 'err'); }
        };
        document.getElementById('ep-tints').onclick = function(e){
          var sw = e.target.closest('[data-tint]'); if (!sw) return;
          newAccent = sw.dataset.tint;
          document.querySelectorAll('.tint-swatch').forEach(function(x){ x.classList.remove('sel'); });
          sw.classList.add('sel');
        };
        document.getElementById('ep-no').onclick = window.closeModal;
        document.getElementById('ep-yes').onclick = async function(){
          try {
            await window.updateProfile({
              display_name: document.getElementById('ep-name').value.trim() || me.username,
              pronouns: document.getElementById('ep-pronouns').value.trim(),
              bio: document.getElementById('ep-bio').value.trim(),
              website: document.getElementById('ep-web').value.trim(),
              custom_status: document.getElementById('ep-cs').value.trim(),
              avatar_url: newAvatar || null,
              banner_url: newBanner || null,
              accent_color: newAccent
            });
            window.closeModal();
            window.toast('Saved', 'Profile updated.', 'ok');
          } catch(err){ window.toast('Error', err.message || String(err), 'err'); }
        };
      }
    });
  };

  // Rich profile view (with banner, pronouns, website)
  var origOpenProfile = window.openProfile;
  window.openProfile = function(uid){
    window.fetchProfiles([uid]).then(function(){
      var p = window.PROFILES[uid]; if (!p) return;
      var isMe = uid === window.ME.id;
      var isFriend = (window.FRIENDS.accepted || []).some(function(f){ return f.other === uid; });
      var pending = (window.FRIENDS.incoming || []).concat(window.FRIENDS.outgoing || []).some(function(f){ return f.other === uid; });
      var actions = "";
      if (isMe) actions = '<button class="btn sm primary" data-pd="edit">Edit Profile</button>';
      else if (isFriend) actions = '<button class="btn sm primary" data-pd="dm">Send Message</button>';
      else if (!pending) actions = '<button class="btn sm primary" data-pd="add">Add Friend</button>';
      else actions = '<span style="font-size:12px;color:var(--text3)">Request pending</span>';

      var accent = p.accent_color || '#00ffe0';
      var body =
        '<div class="banner" style="' + (p.banner_url ? 'background-image:url(\'' + p.banner_url + '\')' : '') + '"></div>' +
        '<div class="body">' +
          '<div class="avatar-row">' +
            '<div style="position:relative">' + window.avatarHTML(uid, 84) + window.statusDot(uid) + '</div>' +
            '<div style="flex:1;padding-bottom:6px">' +
              '<div style="font-family:Space Grotesk;font-size:20px;font-weight:600;color:' + accent + '">' +
                window.esc(p.display_name || p.username) + '</div>' +
              '<div style="color:var(--text3);font-size:13px">@' + window.esc(p.username) +
                (p.pronouns ? ' \u00b7 ' + window.esc(p.pronouns) : '') +
              '</div>' +
            '</div>' +
          '</div>' +
          '<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">' + actions + '</div>' +
          '<hr style="border:none;border-top:1px solid var(--border);margin:16px 0">' +
          '<div class="field"><label>Status</label><div style="font-size:13px;color:var(--text2)">' + window.esc(window.ONLINE.has(uid) ? (p.status||'online') : 'offline') + '</div></div>' +
          (p.custom_status ? '<div class="field"><label>Custom status</label><div style="font-size:13px;color:var(--text2)">' + window.esc(p.custom_status) + '</div></div>' : '') +
          '<div class="field"><label>About</label><div style="font-size:13px;color:var(--text2);white-space:pre-wrap">' + window.esc(p.bio || 'No bio yet.') + '</div></div>' +
          (p.website ? '<div class="field"><label>Website</label><a href="' + window.esc(p.website) + '" target="_blank" rel="noopener" style="font-size:13px">' + window.esc(p.website) + '</a></div>' : '') +
          '<div class="field"><label>Member since</label><div style="font-size:13px;color:var(--text2)">' + new Date(p.created_at).toLocaleDateString() + '</div></div>' +
        '</div>';

      window.openModal(p.display_name || p.username, '<div class="profile-card">' + body + '</div>', {
        onMount: function(){
          document.getElementById('modal-root').addEventListener('click', async function(e){
            var b = e.target.closest('[data-pd]'); if (!b) return;
            var a = b.dataset.pd;
            if (a === 'edit') { window.closeModal(); window.openEditProfile(); }
            if (a === 'dm') { window.closeModal(); await window.openDMWith(uid); }
            if (a === 'add') {
              try { await window.sendFriendRequest(p.username); window.toast('Sent', 'Request sent.', 'ok'); window.closeModal(); }
              catch(err){ window.toast('Error', err.message || String(err), 'err'); }
            }
          });
        }
      });
    });
  };

  // ----------------------------------------------------------
  // ALLOW ALL MEMBERS TO INVITE
  // ----------------------------------------------------------
  // Patch openServerMenu so non-owners also see "Invite People".
  var origOpenServerMenu = window.openServerMenu;
  window.openServerMenu = function(x, y){
    if (!window.CURRENT.server) return;
    var srv = window.CURRENT.server;
    var isOwner = srv.owner_id === window.ME.id;
    var items = [{ head: srv.name }];
    // Everyone can invite
    items.push({ id:"invite", label:"Invite People", icon: window.SVG.users, onClick: window.openInviteServer });
    if (isOwner) {
      items.push({ id:"addch", label:"Create Channel", icon: window.SVG.plus, onClick: function(){ window.openAddChannel("Text Channels"); } });
      items.push({ id:"roles", label:"Manage Roles", icon: window.SVG.tag, onClick: window.openRolesModal });
      items.push({ sep:true });
      items.push({ id:"del", label:"Delete Server", icon: window.SVG.trash, danger:true, onClick: function(){
        window.confirmModal("Delete " + srv.name + "?", "All channels and messages will be deleted.", async function(){
          try { await window.deleteServer(srv.id); await window.loadServers(); await window.goHome(); }
          catch(e){ window.toast("Error", e.message || String(e), "err"); }
        }, true);
      }});
    } else {
      items.push({ sep:true });
      items.push({ id:"leave", label:"Leave Server", icon: window.SVG.logout, danger:true, onClick: async function(){
        try { await window.leaveServer(srv.id); await window.loadServers(); await window.goHome(); }
        catch(e){ window.toast("Error", e.message || String(e), "err"); }
      }});
    }
    window.openMenu(x, y, items);
  };

  // ----------------------------------------------------------
  // KICK OFF
  // ----------------------------------------------------------
  function tryStart(){
    if (window.ME && window.CURRENT) { startMentionWatcher(); log("ready"); return true; }
    return false;
  }
  if (!tryStart()) {
    var tries = 0;
    var t = setInterval(function(){
      tries++;
      if (tryStart() || tries > 80) clearInterval(t);
    }, 150);
  }
})();
</script>

<script>
(function(){
  "use strict";
  if (window.__sleepySettingsV2) return;
  window.__sleepySettingsV2 = true;
  function log(){ try{console.log.apply(console,["[Settings]"].concat([].slice.call(arguments)));}catch(e){} }

  window.openSettings = function(){
    if (!window.ME) return;
    var tab = "account";

    function tabsBar(){
      var tabs = [
        ["account","My Account"],
        ["profile","Profile"],
        ["appearance","Appearance"],
        ["notifications","Notifications"]
      ];
      return '<div style="display:flex;gap:3px;background:var(--void);padding:4px;border-radius:8px;' +
        'border:1px solid var(--border);margin-bottom:20px;overflow-x:auto">' +
        tabs.map(function(t){
          var active = (tab===t[0]);
          return '<button data-stab="'+t[0]+'" style="padding:8px 14px;border-radius:6px;' +
            'font-size:12.5px;font-weight:600;white-space:nowrap;' +
            (active
              ? 'background:var(--surface2);color:var(--cyan);box-shadow:inset 0 0 0 1px rgba(0,255,224,.2)'
              : 'color:var(--text3)') +
            '">'+t[1]+'</button>';
        }).join("") + '</div>';
    }

    function card(){
      var me = window.ME;
      var accent = me.accent_color || '#00ffe0';
      var statusColors = { online:"var(--green)", idle:"var(--amber)", dnd:"var(--rose)", offline:"#4a4a5e" };
      return '<div style="display:flex;align-items:center;gap:14px;padding:16px;border-radius:12px;' +
        'background:linear-gradient(135deg,rgba(0,255,224,.06),rgba(180,74,255,.06));' +
        'border:1px solid var(--border);margin-bottom:18px">' +
        '<div style="position:relative">' + window.avatarHTML(me.id, 56) +
          '<span class="status-dot" style="background:' + (statusColors[me.status]||statusColors.online) +
          ';right:0;bottom:0;border-color:var(--surface)"></span></div>' +
        '<div style="flex:1;min-width:0">' +
          '<div style="font-family:Space Grotesk;font-size:18px;font-weight:600;color:' + accent + '">' +
            window.esc(me.display_name || me.username) + '</div>' +
          '<div style="color:var(--text3);font-size:12.5px">@' + window.esc(me.username) + '</div>' +
        '</div>' +
        '<button class="btn primary" data-open-edit-profile>Edit Profile</button>' +
        '</div>';
    }

    function renderAccount(){
      var me = window.ME;
      var s = me.status || "online";
      var h = card();
      h += '<div class="field"><label>Email</label>' +
        '<div style="font-size:13px;color:var(--text2)">' + window.esc(window.SESSION.user.email || '') + '</div>' +
        '<div class="hint">Emails are unique to one account.</div></div>';
      h += '<div class="field"><label>Username</label>' +
        '<div style="font-size:13px;color:var(--text2)">@' + window.esc(me.username) + '</div>' +
        '<div class="hint">This is your permanent unique ID.</div></div>';
      h += '<div class="field"><label>Status</label><div style="display:flex;gap:6px;flex-wrap:wrap">' +
        ["online","idle","dnd","offline"].map(function(v){
          return '<button class="btn sm ' + (s===v?"primary":"") + '" data-setstatus="' + v + '">' + v + '</button>';
        }).join("") + '</div></div>';
      h += '<hr style="border:none;border-top:1px solid var(--border);margin:20px 0">';
      h += '<div class="field"><label>Sign out</label>' +
        '<button class="btn danger" data-act-here="logout">Log Out</button></div>';
      return h;
    }

    function renderProfile(){
      var me = window.ME;
      var accent = me.accent_color || '#00ffe0';
      var h = card();
      h += '<div class="field"><label>Display name</label>' +
        '<div style="font-size:14px;color:var(--text)">' + window.esc(me.display_name || me.username) + '</div></div>';
      if (me.pronouns) h += '<div class="field"><label>Pronouns</label>' +
        '<div style="font-size:13px;color:var(--text2)">' + window.esc(me.pronouns) + '</div></div>';
      h += '<div class="field"><label>Bio</label>' +
        '<div style="font-size:13px;color:var(--text2);white-space:pre-wrap">' + window.esc(me.bio || 'No bio yet.') + '</div></div>';
      if (me.website) h += '<div class="field"><label>Website</label>' +
        '<a href="' + window.esc(me.website) + '" target="_blank" rel="noopener" style="font-size:13px">' +
        window.esc(me.website) + '</a></div>';
      h += '<div class="field"><label>Name accent color</label>' +
        '<div style="display:flex;align-items:center;gap:10px">' +
        '<span style="width:20px;height:20px;border-radius:50%;background:' + accent + '"></span>' +
        '<span style="font-size:13px;color:var(--text2)">' + accent + '</span></div></div>';
      h += '<hr style="border:none;border-top:1px solid var(--border);margin:20px 0">';
      h += '<button class="btn primary" data-open-edit-profile>Edit Profile</button>';
      return h;
    }

    function renderAppearance(){
      var show = (window.UI && window.UI.showMembers !== false);
      var h = card();
      h += '<div class="switch" style="margin-bottom:16px">' +
        '<input type="checkbox" id="st-members" ' + (show ? "checked" : "") + '>' +
        '<span class="track"></span>' +
        '<span class="lbl">Show the member list on desktop when in a server</span></div>';
      h += '<div class="hint">The member panel is the column on the right of the chat. ' +
        'On mobile it slides in from the right when you tap the people icon in the chat header.</div>';
      return h;
    }

    function renderNotifications(){
      var desktop = false;
      try { desktop = ('Notification' in window && Notification.permission === 'granted'); } catch(e){}
      var h = card();
      h += '<div class="field"><label>Desktop notifications</label>' +
        '<div style="font-size:13px;color:var(--text2);margin-bottom:8px">' +
        (desktop ? 'Enabled' : 'Disabled') + '</div>' +
        '<button class="btn ' + (desktop ? 'danger' : 'primary') + '" id="st-notif-toggle">' +
        (desktop ? 'Turn off (in browser settings)' : 'Enable notifications') + '</button>' +
        '<div class="hint" style="margin-top:6px">' +
        'We use your browser\'s native notification API. You will get pinged for mentions and DMs when the tab is not focused.</div></div>';
      return h;
    }

    function render(){
      var body = document.getElementById('modal-body');
      if (!body) return;
      body.innerHTML =
        tabsBar() +
        (tab === 'account'       ? renderAccount() :
         tab === 'profile'       ? renderProfile() :
         tab === 'appearance'    ? renderAppearance() :
                                   renderNotifications());
      body.querySelectorAll('[data-stab]').forEach(function(b){
        b.onclick = function(){ tab = b.dataset.stab; render(); };
      });
      body.querySelectorAll('[data-open-edit-profile]').forEach(function(b){
        b.onclick = function(){ window.closeModal(); setTimeout(function(){ window.openEditProfile(); }, 60); };
      });
      body.querySelectorAll('[data-setstatus]').forEach(function(b){
        b.onclick = async function(){
          try {
            await window.updateProfile({ status: b.dataset.setstatus });
            if (window.presenceCh) try { window.presenceCh.track({ user_id: window.ME.id, status: window.ME.status, at: new Date().toISOString() }); } catch(e){}
            render();
            window.toast("Updated", "Status is now " + b.dataset.setstatus + ".", "ok");
          } catch(e){ window.toast("Error", e.message || String(e), "err"); }
        };
      });
      var lg = body.querySelector('[data-act-here="logout"]');
      if (lg) lg.onclick = async function(){ window.closeModal(); await window.doLogout(); };
      var nt = document.getElementById('st-notif-toggle');
      if (nt) nt.onclick = function(){
        if (!('Notification' in window)) return window.toast('Unsupported', 'This browser has no Notification API.', 'err');
        Notification.requestPermission().then(function(p){
          window.toast(p === 'granted' ? 'Enabled' : 'Denied', 'Notifications ' + p + '.');
          render();
        });
      };
      var mb = document.getElementById('st-members');
      if (mb) mb.onchange = function(){
        if (!window.UI) window.UI = {};
        window.UI.showMembers = mb.checked;
        try { window.renderAll(); } catch(e){}
      };
    }

    window.openModal("User Settings", '<div id="modal-body"></div>', { wide: true });
    render();
    log("settings opened");
  };

  log("override installed");
})();
</script>
