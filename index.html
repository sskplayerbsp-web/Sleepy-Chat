function renderRail(){
  var rail=$('#rail'); if(!rail)return;
  var html='';
  html+='<button class="rail-btn '+(CURRENT.type==='home'?'active':'')+'" data-nav="home" title="Home">'+SVG.home+'</button>';
  html+='<div class="rail-sep"></div>';
  SERVERS.forEach(function(s){
    var active=CURRENT.type==='server'&&CURRENT.server&&CURRENT.server.id===s.id;
    var unread=0;
    CHANNELS.filter(function(c){return c.server_id===s.id;}).forEach(function(c){unread+=UNREAD[c.id]||0;});
    var inner=s.icon?'<img src="'+esc(s.icon)+'" alt="">':esc(String(s.name||'S').slice(0,2).toUpperCase());
    html+='<button class="rail-btn '+(active?'active':'')+'" data-server="'+esc(s.id)+'" title="'+esc(s.name)+'">'+inner+
      (unread?'<span class="badge" style="position:absolute;bottom:-2px;right:-2px">'+unread+'</span>':'')+'</button>';
  });
  html+='<button class="rail-btn dashed" data-action="new-server" title="Create server">'+SVG.plus+'</button>';
  html+='<button class="rail-btn dashed" data-action="join-invite" title="Join with invite">'+SVG.link+'</button>';
  rail.innerHTML=html;

  $$('[data-nav]',rail).forEach(function(b){b.onclick=function(){ goHome(); };}
  );
  $$('[data-server]',rail).forEach(function(b){b.onclick=function(){ openServer(b.dataset.server); };});
  $$('[data-action]',rail).forEach(function(b){b.onclick=function(){ railAction(b.dataset.action); };});
}
function railAction(a){
  if(a==='new-server')openCreateServer();
  if(a==='join-invite')openJoinInvite();
}

/* ---------------- panel (channels / DMs / home) ---------------- */
function renderPanel(){
  var head=$('#panel-head'), body=$('#panel-body'), ub=$('#user-bar');
  if(!head)return;

  if(CURRENT.type==='server'&&CURRENT.server){
    var srv=CURRENT.server;
    var isOwner=srv.owner_id===ME.id;
    head.innerHTML='<span class="ttl">'+esc(srv.name)+'</span>'+
      (isOwner?'<button class="hbtn" data-panel-action="settings" title="Server settings">'+SVG.gear+'</button>':'')+
      '<button class="hbtn" data-panel-action="invite" title="Invite people">'+SVG.link+'</button>';
  } else if(CURRENT.type==='dm'){
    head.innerHTML='<span class="ttl">Direct Messages</span>';
  } else {
    head.innerHTML='<span class="ttl">Home</span>';
  }
  $$('[data-panel-action]',head).forEach(function(b){
    b.onclick=function(){
      if(b.dataset.panelAction==='settings')openServerSettings();
      if(b.dataset.panelAction==='invite')openInviteCreator();
    };
  });

  var html='';
  /* DM list */
  html+='<div class="panel-section"><div class="panel-label">Direct Messages'+
        '<span class="add" data-panel-action="new-dm" title="New DM">'+SVG.plus+'</span></div>';
  if(!DMS.length)html+='<div style="padding:8px;font-size:12px;color:var(--text3)">No DMs yet.</div>';
  DMS.forEach(function(d){
    var other=d.users.find(function(u){return u!==ME.id;})||d.users[0];
    var active=CURRENT.type==='dm'&&CURRENT.conv&&CURRENT.conv.id===d.id;
    html+='<button class="row '+(active?'active':'')+'" data-dm="'+esc(d.id)+'">'+
      avatarHTML(other,26)+'<span class="txt">'+esc(userLabel(other))+'</span></button>';
  });
  html+='</div>';

  /* server channels */
  if(CURRENT.type==='server'&&CURRENT.server){
    var sid=CURRENT.server.id;
    var textCh=CHANNELS.filter(function(c){return c.server_id===sid&&c.type==='text'&&canViewChannel(sid,c.id,ME.id);}).sort(function(a,b){return (a.position||0)-(b.position||0);});
    var voiceCh=CHANNELS.filter(function(c){return c.server_id===sid&&c.type==='voice'&&canViewChannel(sid,c.id,ME.id);}).sort(function(a,b){return (a.position||0)-(b.position||0);});
    var canManage=hasServerPerm(sid,ME.id,PERMS.MANAGE_CHANNELS);

    html+='<div class="panel-section"><div class="panel-label">Text Channels'+
      (canManage?'<span class="add" data-new-channel="text" title="New text channel">'+SVG.plus+'</span>':'')+'</div>';
    textCh.forEach(function(c){
      var active=CURRENT.channel&&CURRENT.channel.id===c.id;
      var ov=CHANNEL_OVERRIDES[c.id];
      html+='<button class="row '+(active?'active':'')+'" data-channel="'+esc(c.id)+'">'+SVG.hash+
        '<span class="txt">'+esc(c.name)+(ov&&ov.private?' <span class="lock-ico">🔒</span>':'')+'</span>'+
        (UNREAD[c.id]?'<span class="badge">'+UNREAD[c.id]+'</span>':'')+'</button>';
    });
    if(!textCh.length)html+='<div style="padding:8px;font-size:12px;color:var(--text3)">No text channels.</div>';
    html+='</div>';

    html+='<div class="panel-section"><div class="panel-label">Voice Channels'+
      (canManage?'<span class="add" data-new-channel="voice" title="New voice channel">'+SVG.plus+'</span>':'')+'</div>';
    voiceCh.forEach(function(c){
      html+='<button class="row" data-voice="'+esc(c.id)+'">'+SVG.vol+'<span class="txt">'+esc(c.name)+'</span></button>';
    });
    if(!voiceCh.length)html+='<div style="padding:8px;font-size:12px;color:var(--text3)">No voice channels.</div>';
    html+='</div>';
  }

  /* apps */
  html+='<div class="panel-section"><div class="panel-label">Apps</div>'+
    '<button class="row" data-app="games">🎮<span class="txt">Games & Betting</span></button>'+
    '<button class="row" data-app="shop">🛒<span class="txt">Shop</span></button>'+
    '<button class="row" data-app="browser">🌐<span class="txt">Browser</span></button>'+
    '<button class="row" data-app="profile">👤<span class="txt">Profile</span></button>'+
    '</div>';

  body.innerHTML=html;

  /* wire */
  $$('[data-panel-action="new-dm"]',body).forEach(function(b){b.onclick=openNewDm;});
  $$('[data-dm]',body).forEach(function(b){b.onclick=function(){openDm(b.dataset.dm);};});
  $$('[data-channel]',body).forEach(function(b){b.onclick=function(){openChannel(b.dataset.channel);};});
  $$('[data-voice]',body).forEach(function(b){b.onclick=function(){joinVoice(b.dataset.voice);};});
  $$('[data-new-channel]',body).forEach(function(b){b.onclick=function(){openCreateChannel(b.dataset.newChannel);};});
  $$('[data-app]',body).forEach(function(b){b.onclick=function(){openApp(b.dataset.app);};});

  /* user bar */
  ub.innerHTML=avatarHTML(ME.id,34)+statusDot(ME.id)+
    '<div class="info" data-userbar="profile"><div class="nm" style="'+nameStyle()+'">'+esc(ME.display_name||ME.username)+'</div>'+
    '<div class="uid">@'+esc(ME.username)+'</div></div>'+
    '<button class="ctl" data-userbar="sound" title="Sound">'+(SOUND_ON?'🔊':'🔇')+'</button>'+
    '<button class="ctl" data-userbar="logout" title="Sign out">'+SVG.logout+'</button>';
  $$('[data-userbar]',ub).forEach(function(b){
    b.onclick=function(){
      if(b.dataset.userbar==='profile')openProfile(ME.id);
      if(b.dataset.userbar==='sound'){SOUND_ON=!SOUND_ON;localStorage.setItem('cp_sound',SOUND_ON?'on':'off');renderPanel();toast('Sound',SOUND_ON?'On':'Off','ok');}
      if(b.dataset.userbar==='logout')confirmModal('Sign out','You will need to sign in again.',signOut);
    };
  });
}

function nameStyle(){
  var n=EQUIPPED.name;
  if(!n||!n.gradient)return '';
  return 'background:'+n.gradient+';-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-weight:800;';
}

/* ---------------- chat head ---------------- */
function currentChannelId(){
  if(CURRENT.type==='server'&&CURRENT.channel)return CURRENT.channel.id;
  if(CURRENT.type==='dm'&&CURRENT.conv)return CURRENT.conv.id;
  return null;
}

function renderChatHead(){
  var h=$('#chat-head'); if(!h)return;
  var title='', topic='', right='';

  if(CURRENT.type==='home'){
    title='<span class="txt">Welcome back, '+esc(ME.display_name||ME.username)+'</span>';
  } else if(CURRENT.type==='server'&&CURRENT.channel){
    title=SVG.hash+'<span class="txt">'+esc(CURRENT.channel.name)+'</span>';
    if(CURRENT.channel.topic)topic='<span class="topic">'+esc(CURRENT.channel.topic)+'</span>';
  } else if(CURRENT.type==='server'){
    title='<span class="txt">'+esc(CURRENT.server.name)+'</span>';
  } else if(CURRENT.type==='dm'&&CURRENT.conv){
    var other=CURRENT.conv.users.find(function(u){return u!==ME.id;})||CURRENT.conv.users[0];
    title='<span class="txt">@'+esc(userLabel(other))+'</span>';
  }

  right+='<button class="hbtn" data-chat-action="search" title="Search">'+SVG.search+'</button>';
  if(CURRENT.type!=='home')right+='<button class="hbtn" data-chat-action="voice" title="Voice">'+SVG.phone+'</button>';
  right+='<button class="hbtn" data-chat-action="wallet" title="Wallet"><span style="font-size:13px;font-weight:800;color:var(--gold)">🪙 '+WALLET.coins+'</span></button>';

  var drawers='<div class="cp-drawer-btns">'+
    '<button class="hbtn" data-chat-action="drawer-panel" title="Channels">'+SVG.menu+'</button>'+
    '<button class="hbtn" data-chat-action="drawer-members" title="Members">'+SVG.users+'</button></div>';

  h.innerHTML=drawers+'<div class="title">'+title+topic+'</div><div class="spacer"></div>'+right;

  $$('[data-chat-action]',h).forEach(function(b){
    b.onclick=function(){
      var a=b.dataset.chatAction;
      if(a==='drawer-panel')toggleDrawer('panel');
      if(a==='drawer-members')toggleDrawer('members');
      if(a==='search')openSearch();
      if(a==='voice')openVoicePicker();
      if(a==='wallet')openWalletModal();
    };
  });
}

/* ---------------- chat body ---------------- */
function renderChatBody(){
  var body=$('#chat-body'); if(!body)return;

  if(CURRENT.type==='home'){ renderHome(body); return; }

  var cid=currentChannelId();
  if(!cid){ body.innerHTML='<div class="empty"><div class="big">'+SVG.chat+'</div><h2>Pick a channel</h2><div>Choose something from the sidebar.</div></div>'; return; }

  MESSAGES=Store.getMsgs(cid);
  var html='';
  var lastDay='';
  MESSAGES.forEach(function(m){
    var d=new Date(m.created||m.ts||Date.now());
    var dl=dayLabel(d);
    if(dl!==lastDay){ html+='<div class="day-sep">'+esc(dl)+'</div>'; lastDay=dl; }
    html+=renderMessageHTML(m);
  });
  if(!MESSAGES.length){
    html='<div class="empty"><div class="big">'+SVG.chat+'</div><h2>No messages yet</h2><div>Be the first to say something!</div></div>';
  }
  body.innerHTML=html;
  wireMessages(body);
  scrollBottom(true);
}

function renderMessageHTML(m){
  var isMine=m.author_id===ME.id;
  var pinged=m.author_id!==ME.id&&isMentioned(m.content);
  if(pinged&&!PINGS[m.id]){PINGS[m.id]=true;if(!m.__seen)sfxPing();}
  var prof=PROFILES[m.author_id]||{};
  var content=m.deleted?'<span style="color:var(--text3);font-style:italic">message deleted</span>'
    : highlightMentions(esc(m.content||''));
  var replyHtml='';
  if(m.reply_to){
    var parent=MESSAGES.find(function(x){return x.id===m.reply_to;});
    if(parent)replyHtml='<span class="reply-ref">↳ <b>'+esc(userLabel(parent.author_id))+'</b> '+esc(String(parent.content||'').slice(0,60))+'</span>';
  }
  var reacts='';
  if(m.reactions&&Object.keys(m.reactions).length){
    reacts='<div class="react-bar">'+Object.keys(m.reactions).map(function(e){
      var arr=m.reactions[e]||[];
      return '<span class="react-chip '+(arr.indexOf(ME.id)>=0?'mine':'')+'" data-react="'+esc(e)+'" data-mid="'+esc(m.id)+'">'+e+' '+arr.length+'</span>';
    }).join('')+'</div>';
  }
  var canDelete=isMine||(CURRENT.type==='server'&&CURRENT.server&&hasServerPerm(CURRENT.server.id,ME.id,PERMS.MANAGE_MESSAGES));
  return '<div class="msg '+(pinged?'pinged':'')+' '+(m.deleted?'deleted':'')+'" data-mid="'+esc(m.id)+'">'+
    avatarHTML(m.author_id,40)+'<div class="body">'+
      '<div class="head"><span class="author" data-author="'+esc(m.author_id)+'" style="'+(m.author_id===ME.id?nameStyle():'')+'">'+esc(userLabel(m.author_id))+'</span>'+
      roleTagHTML(CURRENT.server?CURRENT.server.id:'',m.author_id)+
      '<span class="time">'+timeLabel(m.created||Date.now())+'</span>'+
      (m.edited?'<span class="edited">(edited)</span>':'')+
      (pinged?'<span class="ping-flag">ping</span>':'')+'</div>'+
      replyHtml+
      '<div class="content">'+content+'</div>'+reacts+
    '</div>'+
    '<div class="toolbar">'+
      '<button data-tool="react" title="React">'+SVG.smile+'</button>'+
      '<button data-tool="reply" title="Reply">'+SVG.reply+'</button>'+
      (isMine&&!m.deleted?'<button data-tool="edit" title="Edit">'+SVG.pencil+'</button>':'')+
      (canDelete&&!m.deleted?'<button class="danger" data-tool="delete" title="Delete">'+SVG.trash+'</button>':'')+
    '</div></div>';
}

function wireMessages(root){
  $$('[data-author]',root).forEach(function(a){a.onclick=function(){openProfile(a.dataset.author);};});
  $$('.msg',root).forEach(function(el){
    var mid=el.dataset.mid;
    $$('[data-tool]',el).forEach(function(b){
      b.onclick=function(e){
        e.stopPropagation();
        var t=b.dataset.tool;
        if(t==='react')openReactionPicker(mid);
        if(t==='reply'){ setReply(mid); }
        if(t==='edit')editMessage(mid);
        if(t==='delete')deleteMessage(mid);
      };
    });
    $$('[data-react]',el).forEach(function(c){
      c.onclick=function(){ toggleReaction(mid,c.dataset.react); };
    });
  });
}

function scrollBottom(instant){
  var b=$('#chat-body'); if(!b)return;
  requestAnimationFrame(function(){ b.scrollTop=b.scrollHeight; });
}

/* ---------------- composer ---------------- */
var EMOJIS=['😀','😂','🥹','😍','🤩','😎','🤔','😴','😭','😡','🥳','🤯','👍','👎','👏','🙏','💪','🔥','✨','💯','❤️','💔','🎉','🎮','⚡','🌈','🍕','🍦','☕','🚀','🌟','👑','💎','🎵','🎧','📌','✅','❌','⚠️','🫡'];

function renderComposer(){
  var wrap=$('#composer-wrap'); if(!wrap)return;
  if(CURRENT.type==='home'){ wrap.innerHTML=''; return; }

  var cid=currentChannelId();
  var canSend=true;
  if(CURRENT.type==='server'&&CURRENT.server&&CURRENT.channel){
    canSend=canSendInChannel(CURRENT.server.id,CURRENT.channel.id,ME.id);
  }
  if(!canSend){
    wrap.innerHTML='<div class="composer locked"><div style="flex:1;padding:8px;color:var(--text3);font-size:13px">You do not have permission to send messages here.</div></div>';
    return;
  }

  wrap.innerHTML=(replyTo?'<div style="font-size:11.5px;color:var(--text3);padding:0 4px 6px">Replying to <b style="color:var(--text2)">'+esc(replyTo.name)+'</b> · <button id="cancel-reply" style="color:var(--rose);font-weight:700">cancel</button></div>':'')+
    '<div class="composer">'+
      '<button class="cbtn" id="emoji-btn" title="Emoji">'+SVG.smile+'</button>'+
      '<textarea id="msg-input" rows="1" placeholder="Message '+(CURRENT.channel?'#'+esc(CURRENT.channel.name):'')+'"></textarea>'+
      '<button class="cbtn send" id="send-btn" title="Send">'+SVG.send+'</button>'+
    '</div>';

  var ta=$('#msg-input');
  ta.addEventListener('input',function(){
    ta.style.height='auto';ta.style.height=Math.min(190,ta.scrollHeight)+'px';
    if(cid)rtSend('typing',{cid:cid,uid:ME.id,ts:Date.now()});
  });
  ta.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}
  });
  $('#send-btn').onclick=sendMessage;
  $('#emoji-btn').onclick=function(e){e.stopPropagation();openEmojiPicker();};
  var cr=$('#cancel-reply'); if(cr)cr.onclick=function(){replyTo=null;renderComposer();};
  ta.focus();
}

function openEmojiPicker(){
  var existing=$('.emoji-picker'); if(existing){existing.remove();return;}
  var p=document.createElement('div');p.className='emoji-picker';
  p.innerHTML=EMOJIS.map(function(e){return '<button type="button">'+e+'</button>';}).join('');
  p.onclick=function(e){
    if(e.target.tagName==='BUTTON'){
      var ta=$('#msg-input'); if(ta){ta.value+=e.target.textContent;ta.focus();}
      p.remove();
    }
  };
  $('#composer-wrap').appendChild(p);
  setTimeout(function(){document.addEventListener('click',function h(){var pp=$('.emoji-picker');if(pp)pp.remove();document.removeEventListener('click',h);});},50);
}

function setReply(mid){
  var m=MESSAGES.find(function(x){return x.id===mid;}); if(!m)return;
  replyTo={id:mid,name:userLabel(m.author_id)};
  renderComposer();
  var ta=$('#msg-input');if(ta)ta.focus();
}

function sendMessage(){
  var ta=$('#msg-input'); if(!ta)return;
  var text=ta.value.trim(); if(!text)return;
  var cid=currentChannelId(); if(!cid)return;

  var m={id:'m_'+uid(),channel_id:cid,author_id:ME.id,content:text,created:Date.now(),edited:false,deleted:false,reply_to:replyTo?replyTo.id:null,reactions:{}};
  var arr=Store.getMsgs(cid);arr.push(m);Store.saveMsgs(cid,arr);
  MESSAGES=arr;
  replyTo=null;
  ta.value='';ta.style.height='auto';
  renderChatBody();renderComposer();
  sfxSend();
  rtSend('msg',m);
  sbUpsert('cp_messages',{id:m.id,channel_id:cid,author_id:ME.id,content:text,reply_to:m.reply_to,created_at:new Date(m.created).toISOString()});
}

function editMessage(mid){
  var m=MESSAGES.find(function(x){return x.id===mid;}); if(!m)return;
  openModal('Edit message','<div class="field"><label>Message</label><textarea id="edit-ta" style="min-height:100px">'+esc(m.content)+'</textarea></div>',{
    footer:'<button class="btn" id="ed-cancel">Cancel</button><button class="btn primary" id="ed-save">Save</button>',
    onMount:function(){
      $('#ed-cancel').onclick=closeModal;
      $('#ed-save').onclick=function(){
        m.content=$('#edit-ta').value;m.edited=true;
        Store.saveMsgs(m.channel_id,Store.getMsgs(m.channel_id).map(function(x){return x.id===m.id?m:x;}));
        closeModal();renderChatBody();
      };
    }
  });
}

function deleteMessage(mid){
  var m=MESSAGES.find(function(x){return x.id===mid;}); if(!m)return;
  confirmModal('Delete message','This cannot be undone.',function(){
    m.deleted=true;m.content='';
    Store.saveMsgs(m.channel_id,Store.getMsgs(m.channel_id).map(function(x){return x.id===m.id?m:x;}));
    renderChatBody();
    sbDel('cp_messages',{id:mid});
  },true);
}

function openReactionPicker(mid){
  openModal('Add reaction','<div style="display:grid;grid-template-columns:repeat(8,1fr);gap:4px">'+
    EMOJIS.map(function(e){return '<button class="btn" data-emo="'+esc(e)+'" style="font-size:20px;padding:6px;min-height:42px">'+e+'</button>';}).join('')+'</div>',{
    onMount:function(){
      $$('[data-emo]').forEach(function(b){
        b.onclick=function(){ closeModal(); toggleReaction(mid,b.dataset.emo); };
      });
    }
  });
}
function toggleReaction(mid,emoji){
  var m=MESSAGES.find(function(x){return x.id===mid;}); if(!m)return;
  m.reactions=m.reactions||{};
  var arr=m.reactions[emoji]||[];
  var idx=arr.indexOf(ME.id);
  if(idx>=0)arr.splice(idx,1); else arr.push(ME.id);
  if(arr.length)m.reactions[emoji]=arr; else delete m.reactions[emoji];
  Store.saveMsgs(m.channel_id,Store.getMsgs(m.channel_id).map(function(x){return x.id===m.id?m:x;}));
  renderChatBody();
}

/* ---------------- typing ---------------- */
function renderTyping(){
  var el=$('#typing-bar'); if(!el)return;
  var cid=currentChannelId(); if(!cid){el.textContent='';return;}
  var now=Date.now();
  var who=Object.keys(TYPING[cid]||{}).filter(function(u){return u!==ME.id&&now-TYPING[cid][u]<4000;});
  if(!who.length){el.innerHTML='';return;}
  el.innerHTML='<span class="dots"><i></i><i></i><i></i></span>'+who.map(userLabel).join(', ')+(who.length>1?' are typing':' is typing');
  clearTimeout(el._t);
  el._t=setTimeout(renderTyping,2000);
}

/* ---------------- members panel ---------------- */
function renderMembers(){
  var box=$('#members'); if(!box)return;
  if(CURRENT.type==='home'||!CURRENT.server){ box.innerHTML=''; return; }

  var sid=CURRENT.server.id;
  var mem=MEMBERS[sid]||{};
  var list=Object.keys(mem);
  if(!list.length)list=[ME.id];

  var online=[],offline=[];
  list.forEach(function(u){ (ONLINE[u]&&Date.now()-ONLINE[u]<90000)?online.push(u):offline.push(u); });

  var html='';
  html+='<div class="mgroup"><div class="glabel">Online — '+online.length+'</div>';
  online.sort(function(a,b){return (mem[b].joinedAt||0)-(mem[a].joinedAt||0);}).forEach(function(u){
    html+='<div class="member" data-mem="'+esc(u)+'">'+avatarHTML(u,32)+statusDot(u)+
      '<div style="min-width:0"><div class="nm" style="'+(u===ME.id?nameStyle():'')+'">'+esc(userLabel(u))+roleTagHTML(sid,u)+'</div>'+
      '<div class="uid">@'+esc((PROFILES[u]&&PROFILES[u].username)||shortId(u))+'</div></div></div>';
  });
  html+='</div>';
  if(offline.length){
    html+='<div class="mgroup"><div class="glabel">Offline — '+offline.length+'</div>';
    offline.forEach(function(u){
      html+='<div class="member offline" data-mem="'+esc(u)+'">'+avatarHTML(u,32)+statusDot(u)+
        '<div style="min-width:0"><div class="nm">'+esc(userLabel(u))+'</div></div></div>';
    });
    html+='</div>';
  }
  box.innerHTML=html;
  $$('[data-mem]',box).forEach(function(b){b.onclick=function(){openProfile(b.dataset.mem);};});
}

/* ================================================================
   NAVIGATION
   ================================================================ */
function goHome(){ CURRENT={type:'home',server:null,channel:null,conv:null}; closeDrawers(); renderAll(); }

function openServer(sid){
  var srv=SERVERS.find(function(s){return s.id===sid;}); if(!srv)return;
  var chans=CHANNELS.filter(function(c){return c.server_id===sid&&c.type==='text'&&canViewChannel(sid,c.id,ME.id);});
  CURRENT={type:'server',server:srv,channel:chans[0]||null,conv:null};
  if(chans[0])UNREAD[chans[0].id]=0;
  closeDrawers();renderAll();
}
function openChannel(cid){
  var c=CHANNELS.find(function(x){return x.id===cid;}); if(!c)return;
  var srv=SERVERS.find(function(s){return s.id===c.server_id;});
  CURRENT={type:'server',server:srv,channel:c,conv:null};
  UNREAD[cid]=0;
  closeDrawers();renderAll();
}
function openDm(did){
  var d=DMS.find(function(x){return x.id===did;}); if(!d)return;
  CURRENT={type:'dm',server:null,channel:null,conv:d};
  closeDrawers();renderAll();
}
function openNewDm(){
  var cands=Object.keys(PROFILES).filter(function(u){return u!==ME.id&&canDM(u);});
  if(!cands.length){toast('No one to DM','Join or invite people first','err');return;}
  openModal('New direct message',
    '<div class="qs-list">'+cands.map(function(u){
      return '<button class="qs-item" data-newdm="'+esc(u)+'">'+avatarHTML(u,30)+'<span>'+esc(userLabel(u))+'</span></button>';
    }).join('')+'</div>',
    {onMount:function(){
      $$('[data-newdm]').forEach(function(b){
        b.onclick=function(){
          closeModal();
          var other=b.dataset.newdm;
          var d=DMS.find(function(x){return x.users.indexOf(ME.id)>=0&&x.users.indexOf(other)>=0;});
          if(!d){ d={id:'d_'+uid(),users:[ME.id,other],created:Date.now()}; DMS.push(d); Store.saveDms(DMS); }
          openDm(d.id);
        };
      });
    }}
  );
}

function openCreateServer(){
  openModal('Create a server',
    '<div class="field"><label>Server name</label><input id="ns-name" maxlength="40" placeholder="My Awesome Server"></div>'+
    '<div class="field"><label>Icon URL (optional)</label><input id="ns-icon" placeholder="https://…"></div>',
    {footer:'<button class="btn" id="ns-cancel">Cancel</button><button class="btn primary" id="ns-create">Create</button>',
     onMount:function(){
       $('#ns-cancel').onclick=closeModal;
       $('#ns-create').onclick=function(){
         var name=$('#ns-name').value.trim(); if(!name){toast('Name required','','err');return;}
         var sid='s_'+uid();
         var srv={id:sid,name:name,icon:$('#ns-icon').value.trim(),owner_id:ME.id,created:Date.now()};
         SERVERS.push(srv);
         MEMBERS[sid]={};MEMBERS[sid][ME.id]={perms:{dm:true,games:true,voice:true,invite:true},joinedAt:Date.now()};
         getServerRoles(sid);
         var c1={id:'c_'+uid(),server_id:sid,name:'general',type:'text',topic:'',position:0};
         var c2={id:'c_'+uid(),server_id:sid,name:'General',type:'voice',topic:'',position:1};
         CHANNELS.push(c1,c2);
         Store.saveServers();Store.saveMembers();Store.saveChannels();
         sbUpsert('cp_servers',{id:sid,name:name,owner_id:ME.id});
         closeModal();openServer(sid);
         toast('Server created',name,'ok');
       };
     }}
  );
}

function openCreateChannel(type){
  if(!CURRENT.server)return;
  var sid=CURRENT.server.id;
  if(!hasServerPerm(sid,ME.id,PERMS.MANAGE_CHANNELS)){toast('No permission','','err');return;}
  openModal('New '+type+' channel',
    '<div class="field"><label>Channel name</label><input id="nc-name" maxlength="30" placeholder="new-channel"></div>'+
    (type==='text'?'<div class="field"><label>Topic (optional)</label><input id="nc-topic" maxlength="80"></div>':'')+
    '<label class="perm-toggle"><input type="checkbox" id="nc-private"> Private (only selected roles)</label>',
    {footer:'<button class="btn" id="nc-cancel">Cancel</button><button class="btn primary" id="nc-create">Create</button>',
     onMount:function(){
       $('#nc-cancel').onclick=closeModal;
       $('#nc-create').onclick=function(){
         var name=$('#nc-name').value.trim().toLowerCase().replace(/\s+/g,'-'); if(!name){toast('Name required','','err');return;}
         var c={id:'c_'+uid(),server_id:sid,name:name,type:type,topic:$('#nc-topic')?$('#nc-topic').value.trim():'',position:CHANNELS.filter(function(x){return x.server_id===sid;}).length};
         CHANNELS.push(c);
         if($('#nc-private').checked){
           CHANNEL_OVERRIDES[c.id]={private:true,allowedRoles:getServerRoles(sid).filter(function(r){return r.id!=='everyone';}).map(function(r){return r.id;})};
           saveChannelOverrides();
         }
         Store.saveChannels();
         sbUpsert('cp_channels',{id:c.id,server_id:sid,name:name,type:type,topic:c.topic});
         closeModal();renderAll();
         toast('Channel created','#'+name,'ok');
       };
     }}
  );
}

/* ---------------- server settings ---------------- */
function openServerSettings(){
  if(!CURRENT.server)return;
  var sid=CURRENT.server.id;
  var srv=CURRENT.server;
  var isOwner=srv.owner_id===ME.id;

  var html='<div class="ss-tabs">'+
    '<button class="ss-tab active" data-sst="general">General</button>'+
    '<button class="ss-tab" data-sst="invites">Invites</button>'+
    '<button class="ss-tab" data-sst="roles">Roles</button>'+
    '<button class="ss-tab" data-sst="members">Members</button>'+
    '<button class="ss-tab" data-sst="channels">Channels</button>'+
    '</div><div id="ss-body"></div>';

  openModal('Server Settings — '+srv.name,html,{wide:true,onMount:function(){
    function paint(tab){
      $$('.ss-tab').forEach(function(t){t.classList.toggle('active',t.dataset.sst===tab);});
      var b=$('#ss-body');
      if(tab==='general')b.innerHTML=generalTab();
      if(tab==='invites')b.innerHTML=invitesTab();
      if(tab==='roles')b.innerHTML=rolesTab();
      if(tab==='members')b.innerHTML=membersTab();
      if(tab==='channels')b.innerHTML=channelsTab();
      wire(tab);
    }
    $$('.ss-tab').forEach(function(t){t.onclick=function(){paint(t.dataset.sst);};});
    paint('general');

    function generalTab(){
      return '<div class="field"><label>Server name</label><input id="ss-name" value="'+esc(srv.name)+'" '+(isOwner?'':'disabled')+'></div>'+
        '<div class="field"><label>Icon URL</label><input id="ss-icon" value="'+esc(srv.icon||'')+'" '+(isOwner?'':'disabled')+'></div>'+
        (isOwner?'<button class="btn primary" id="ss-save">Save changes</button>':'<div style="color:var(--text3);font-size:12.5px">Only the owner can edit server settings.</div>');
    }
    function invitesTab(){
      var list=Object.values(INVITES).filter(function(i){return i.serverId===sid;});
      var h='<button class="btn primary block" id="ss-newinv">➕ Create invite link</button><div style="height:12px"></div>';
      if(!list.length)h+='<div style="color:var(--text3);font-size:12.5px">No invites yet.</div>';
      list.forEach(function(i){
        var url=inviteUrl(i.code);
        var expired=i.expires&&Date.now()>i.expires;
        var maxed=i.maxUses&&i.uses>=i.maxUses;
        h+='<div class="inv-card">'+
          '<div class="ic-code">'+SVG.link+' '+esc(i.code)+'</div>'+
          '<div class="ic-meta">'+
            '<span class="inv-pill '+(i.perms.dm?'on':'off')+'">DM '+(i.perms.dm?'✔':'✖')+'</span>'+
            '<span class="inv-pill '+(i.perms.games?'on':'off')+'">Games '+(i.perms.games?'✔':'✖')+'</span>'+
            '<span class="inv-pill '+(i.perms.voice?'on':'off')+'">Voice '+(i.perms.voice?'✔':'✖')+'</span>'+
            (i.maxUses?'<span class="inv-pill">'+i.uses+'/'+i.maxUses+' uses</span>':'<span class="inv-pill">∞ uses</span>')+
            (expired?'<span class="inv-pill off">expired</span>':'')+
            (maxed?'<span class="inv-pill off">maxed</span>':'')+
          '</div>'+
          '<div class="inv-row">'+
            '<button class="btn sm primary" data-copy="'+esc(url)+'">📋 Copy link</button>'+
            '<button class="btn sm" data-share="'+esc(url)+'">📤 Share</button>'+
            '<button class="btn sm danger" data-revoke="'+esc(i.code)+'">Revoke</button>'+
          '</div></div>';
      });
      return h;
    }
    function rolesTab(){
      var roles=getServerRoles(sid);
      var h='';
      roles.forEach(function(r){
        var count=Object.keys(MEMBER_ROLES[sid]||{}).filter(function(u){return (MEMBER_ROLES[sid][u]||[]).indexOf(r.id)>=0;}).length;
        h+='<div class="role-card" data-role="'+esc(r.id)+'">'+
          '<span class="role-dot" style="background:'+r.color+'"></span>'+
          '<span class="rc-name">'+esc(r.name)+'</span>'+
          '<span class="rc-count">'+count+'</span></div>';
      });
      h+='<button class="btn block" id="ss-newrole" style="margin-top:10px">➕ Create role</button>';
      return h;
    }
    function membersTab(){
      var mem=MEMBERS[sid]||{};
      var h='';
      Object.keys(mem).forEach(function(u){
        var mp=memberPerms(sid,u);
        h+='<div class="channel-priv"><div class="cp-info"><div class="cp-name">'+esc(userLabel(u))+(u===srv.owner_id?' <span class="role-tag" style="background:linear-gradient(135deg,#ffd700,#ffab00);color:#1a1100">Owner</span>':'')+'</div>'+
          '<div class="cp-sub">DM '+(mp.dm?'✔':'✖')+' · Games '+(mp.games?'✔':'✖')+' · Voice '+(mp.voice?'✔':'✖')+'</div></div>'+
          (u!==ME.id?'<button class="btn sm" data-kick="'+esc(u)+'">Kick</button>':'')+'</div>';
      });
      return h;
    }
    function channelsTab(){
      var chans=CHANNELS.filter(function(c){return c.server_id===sid;});
      var h='';
      chans.forEach(function(c){
        var ov=CHANNEL_OVERRIDES[c.id];
        h+='<div class="channel-priv"><div class="cp-info"><div class="cp-name">'+(c.type==='text'?SVG.hash:SVG.vol)+' '+esc(c.name)+'</div>'+
          '<div class="cp-sub">'+c.type+(ov&&ov.private?' · private':'')+'</div></div>'+
          '<button class="btn sm" data-toggle-priv="'+esc(c.id)+'">'+(ov&&ov.private?'Make public':'Make private')+'</button></div>';
      });
      return h;
    }

    function wire(tab){
      var b=$('#ss-body');
      if(tab==='general'){
        var save=$('#ss-save');
        if(save)save.onclick=function(){
          srv.name=$('#ss-name').value.trim()||srv.name;
          srv.icon=$('#ss-icon').value.trim();
          Store.saveServers();sbUpsert('cp_servers',{id:srv.id,name:srv.name,owner_id:srv.owner_id});
          closeModal();renderAll();toast('Saved','Server updated','ok');
        };
      }
      if(tab==='invites'){
        var ni=$('#ss-newinv'); if(ni)ni.onclick=openInviteCreator;
        $$('[data-copy]',b).forEach(function(btn){
          btn.onclick=function(){
            var url=btn.dataset.copy;
            if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(function(){toast('Copied','Link copied to clipboard','ok');});}
            else{ window.prompt('Copy this link:',url); }
          };
        });
        $$('[data-share]',b).forEach(function(btn){
          btn.onclick=function(){
            var url=btn.dataset.share;
            if(navigator.share){navigator.share({title:'Join my server',url:url}).catch(function(){});}
            else if(navigator.clipboard){navigator.clipboard.writeText(url);toast('Copied','Share it anywhere','ok');}
            else{window.prompt('Copy:',url);}
          };
        });
        $$('[data-revoke]',b).forEach(function(btn){
          btn.onclick=function(){ delete INVITES[btn.dataset.revoke];Store.saveInvites();closeModal();openServerSettings(); };
        });
      }
      if(tab==='roles'){
        $$('[data-role]',b).forEach(function(rc){rc.onclick=function(){openRoleEditor(rc.dataset.role);};});
        var nr=$('#ss-newrole'); if(nr)nr.onclick=openCreateRole;
      }
      if(tab==='members'){
        $$('[data-kick]',b).forEach(function(btn){
          btn.onclick=function(){ kickMember(btn.dataset.kick); };
        });
      }
      if(tab==='channels'){
        $$('[data-toggle-priv]',b).forEach(function(btn){
          btn.onclick=function(){
            var cid=btn.dataset.togglePriv;
            var ov=CHANNEL_OVERRIDES[cid];
            if(ov&&ov.private)CHANNEL_OVERRIDES[cid]={private:false,allowedRoles:[]};
            else CHANNEL_OVERRIDES[cid]={private:true,allowedRoles:[]};
            saveChannelOverrides();closeModal();openServerSettings();
          };
        });
      }
    }
  }});
}

function kickMember(uid2){
  if(!CURRENT.server)return;
  var sid=CURRENT.server.id;
  confirmModal('Kick member','Remove '+userLabel(uid2)+' from this server?',function(){
    delete MEMBERS[sid][uid2];
    Store.saveMembers();renderAll();
    toast('Kicked',userLabel(uid2),'ok');
  },true);
}

/* ================================================================
   INVITES — create, parse, redeem
   ================================================================ */
function inviteUrl(code){
  var base=location.origin+location.pathname;
  return base+'#invite='+code;
}
function inviteCodeFromUrl(){
  var m=(location.hash||'').match(/invite=([A-Za-z0-9]+)/);
  if(m)return m[1];
  try{ var p=new URLSearchParams(location.search); if(p.get('invite'))return p.get('invite'); }catch(e){}
  return null;
}
function clearInviteFromUrl(){
  try{ history.replaceState(null,'',location.origin+location.pathname); }catch(e){}
}

function openInviteCreator(){
  if(!CURRENT.server){toast('Open a server first','','err');return;}
  var sid=CURRENT.server.id;
  if(!hasServerPerm(sid,ME.id,PERMS.ADMINISTRATOR)&&CURRENT.server.owner_id!==ME.id){
    toast('No permission','Only admins can create invites','err');return;
  }
  openModal('Create invite link',
    '<div class="field"><label>Permissions for invited members</label>'+
      '<label class="perm-toggle on" id="ip-dm-wrap"><input type="checkbox" id="ip-dm" checked> Allow direct messages</label>'+
      '<label class="perm-toggle on" id="ip-games-wrap" style="margin-top:6px"><input type="checkbox" id="ip-games" checked> Allow games & betting</label>'+
      '<label class="perm-toggle on" id="ip-voice-wrap" style="margin-top:6px"><input type="checkbox" id="ip-voice" checked> Allow voice chat</label>'+
    '</div>'+
    '<div class="field"><label>Max uses (blank = unlimited)</label><input id="ip-max" type="number" min="1" placeholder="∞"></div>'+
    '<div class="field"><label>Expires in (hours, blank = never)</label><input id="ip-exp" type="number" min="1" placeholder="never"></div>',
    {footer:'<button class="btn" id="ip-cancel">Cancel</button><button class="btn primary" id="ip-create">Create link</button>',
     onMount:function(){
       ['dm','games','voice'].forEach(function(k){
         var cb=$('#ip-'+k),wrap=$('#ip-'+k+'-wrap');
         cb.onchange=function(){wrap.classList.toggle('on',cb.checked);};
       });
       $('#ip-cancel').onclick=closeModal;
       $('#ip-create').onclick=function(){
         var code=uid().toUpperCase().slice(0,8);
         var maxUses=parseInt($('#ip-max').value,10)||0;
         var expH=parseFloat($('#ip-exp').value)||0;
         INVITES[code]={
           code:code,serverId:sid,inviterId:ME.id,
           perms:{dm:$('#ip-dm').checked,games:$('#ip-games').checked,voice:$('#ip-voice').checked,invite:true},
           maxUses:maxUses,uses:0,
           expires:expH?Date.now()+expH*3600000:0,
           created:Date.now()
         };
         Store.saveInvites();
         sbUpsert('cp_invites',{code:code,server_id:sid,inviter_id:ME.id,perms:INVITES[code].perms,max_uses:maxUses,uses:0});
         closeModal();
         openInviteCreated(code);
       };
     }}
  );
}

function openInviteCreated(code){
  var url=inviteUrl(code);
  var inv=INVITES[code];
  openModal('Invite link ready',
    '<div style="text-align:center;margin-bottom:14px">'+
      '<div style="font-size:44px">🎉</div>'+
      '<div style="font-size:13px;color:var(--text2);margin-top:6px">Share this link. Anyone who opens it joins <b style="color:var(--text)">'+esc(CURRENT.server?CURRENT.server.name:'the server')+'</b> with the permissions you chose.</div>'+
    '</div>'+
    '<div class="field"><label>Invite link</label><input id="ic-url" value="'+esc(url)+'" readonly style="font-family:ui-monospace,monospace;font-size:12px"></div>'+
    '<div class="ic-meta" style="justify-content:center">'+
      '<span class="inv-pill '+(inv.perms.dm?'on':'off')+'">DM '+(inv.perms.dm?'✔':'✖')+'</span>'+
      '<span class="inv-pill '+(inv.perms.games?'on':'off')+'">Games '+(inv.perms.games?'✔':'✖')+'</span>'+
      '<span class="inv-pill '+(inv.perms.voice?'on':'off')+'">Voice '+(inv.perms.voice?'✔':'✖')+'</span>'+
    '</div>',
    {footer:'<button class="btn" id="ic-close">Close</button><button class="btn" id="ic-share">📤 Share</button><button class="btn primary" id="ic-copy">📋 Copy</button>',
     onMount:function(){
       $('#ic-close').onclick=closeModal;
       $('#ic-copy').onclick=function(){
         if(navigator.clipboard)navigator.clipboard.writeText(url).then(function(){toast('Copied','Paste it anywhere','ok');});
         else{ $('#ic-url').select(); document.execCommand&&document.execCommand('copy'); toast('Copied','','ok'); }
       };
       $('#ic-share').onclick=function(){
         if(navigator.share)navigator.share({title:'Join '+((CURRENT.server&&CURRENT.server.name)||'my server'),url:url}).catch(function(){});
         else if(navigator.clipboard)navigator.clipboard.writeText(url).then(function(){toast('Copied','Sharing not supported, link copied','ok');});
       };
     }}
  );
}

function openJoinInvite(){
  openModal('Join with invite',
    '<div class="field"><label>Paste invite link or code</label><input id="ji-input" placeholder="https://…#invite=ABCD1234 or ABCD1234"></div>',
    {footer:'<button class="btn" id="ji-cancel">Cancel</button><button class="btn primary" id="ji-go">Join</button>',
     onMount:function(){
       $('#ji-cancel').onclick=closeModal;
       $('#ji-go').onclick=function(){
         var raw=$('#ji-input').value.trim();
         var m=raw.match(/invite=([A-Za-z0-9]+)/);
         var code=m?m[1]:raw.toUpperCase();
         var inv=INVITES[code];
         if(!inv){toast('Invalid invite','That code does not exist','err');return;}
         closeModal();
         redeemInvite(code);
       };
     }}
  );
}

function redeemInvite(code){
  var inv=INVITES[code];
  if(!inv){toast('Invalid invite','','err');return;}
  if(inv.expires&&Date.now()>inv.expires){toast('Invite expired','Ask for a new link','err');return;}
  if(inv.maxUses&&inv.uses>=inv.maxUses){toast('Invite maxed out','Ask for a new link','err');return;}

  var srv=SERVERS.find(function(s){return s.id===inv.serverId;});
  if(!srv){toast('Server not found','This invite points to a server you do not have','err');return;}
  if((MEMBERS[srv.id]||{})[ME.id]){ toast('Already joined','Opening server','ok'); openServer(srv.id); return; }

  MEMBERS[srv.id]=MEMBERS[srv.id]||{};
  MEMBERS[srv.id][ME.id]={perms:Object.assign({invite:true},inv.perms),joinedAt:Date.now(),viaInvite:code};
  inv.uses=(inv.uses||0)+1;
  Store.saveMembers();Store.saveInvites();
  sbUpsert('cp_members',{server_id:srv.id,user_id:ME.id,perms:MEMBERS[srv.id][ME.id].perms});
  sbUpsert('cp_invites',{code:code,server_id:inv.serverId,inviter_id:inv.inviterId,perms:inv.perms,max_uses:inv.maxUses,uses:inv.uses});

  toast('Joined!','Welcome to '+srv.name,'ok');

function renderVoiceBar(){
  var slot=$('#voice-bar-slot'); if(!slot)return;

  slot.innerHTML='<div class="voice-bar">'+
    '<div class="vb-info">'+SVG.vol+'<span class="vb-name">'+esc(VC.channel.name)+'</span>'+

    '<button id="vb-leave" class="danger">'+SVG.phoneOff+' Leave</button>'+
    '</div>';

    if(VC.stream)VC.stream.getAudioTracks().forEach(function(t){t.enabled=!VC.muted;});
    renderVoiceBar();
  };

}

async function toggleCam(){
  if(VC.cam){ stopCam(); VC.cam=false; renderVoiceBar(); return; }
  try{
    var s=await navigator.mediaDevices.getUserMedia({video:true});
    VC.cam=true;
    var box=$('#vc-videos');
    box.innerHTML='';
    var tile=document.createElement('div');tile.className='vc-tile';
    var v=document.createElement('video');v.autoplay=true;v.muted=true;v.playsInline=true;v.srcObject=s;
    var nm=document.createElement('div');nm.className='vc-name';nm.textContent='You';
    tile.appendChild(v);tile.appendChild(nm);box.appendChild(tile);
    VC.videoEl={tile:tile,stream:s};
    renderVoiceBar();
  }catch(e){ toast('Camera','Permission denied','err'); }
}
function stopCam(){
  if(VC.videoEl){ try{VC.videoEl.stream.getTracks().forEach(function(t){t.stop();});}catch(e){} VC.videoEl.tile.remove(); VC.videoEl=null; }
  $('#vc-videos').innerHTML='';
}
function leaveVoice(){
  if(VC.stream)try{VC.stream.getTracks().forEach(function(t){t.stop();});}catch(e){}
  stopCam();
  VC={channel:null,stream:null,muted:false,cam:false,videoEl:null};
  renderVoiceBar();
  toast('Voice','Disconnected','ok');
}

/* ---------- Tic-Tac-Toe with optional AI ---------- */
var TT_WINS=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function ttWinner(b){
  for(var i=0;i<TT_WINS.length;i++){var L=TT_WINS[i];if(b[L[0]]&&b[L[0]]===b[L[1]]&&b[L[0]]===b[L[2]])return b[L[0]];}
  return b.indexOf('')<0?'draw':null;
}
function ttMinimax(b,me,turn,depth){
  var w=ttWinner(b);
  if(w==='draw')return{score:0};
  if(w)return{score:w===me?10-depth:depth-10};
  var best={score:turn===me?-Infinity:Infinity,move:null};
  for(var i=0;i<9;i++){
    if(b[i])continue;
    b[i]=turn;
    var r=ttMinimax(b,me,turn==='X'?'O':'X',depth+1);
    b[i]='';
    if(turn===me?r.score>best.score:r.score<best.score)best={score:r.score,move:i};
  }
  return best;
}
function openTTT(){
  GAME.tttAi=true;
  var state={board:Array(9).fill(''),turn:'X',over:false};
  openModal('❌⭕ Tic-Tac-Toe',
    '<div class="cp-ai-bar"><span>Mode</span>'+
      '<button class="cp-ai-btn" data-mode="pvp">👥 2 Players</button>'+
      '<button class="cp-ai-btn active" data-mode="ai">🤖 VS AI</button>'+
    '</div>'+
    '<div class="game-head"><div class="game-score" id="ttt-status">Your turn (X)</div></div>'+
    '<div class="ttt-grid">'+Array(9).fill(0).map(function(_,i){return '<div class="ttt-cell" data-i="'+i+'"></div>';}).join('')+'</div>',
    {onMount:function(){
      function paint(){
        $$('.ttt-cell').forEach(function(c,i){c.textContent=state.board[i];});
        var w=ttWinner(state.board);
        if(w){state.over=true;document.getElementById('ttt-status').textContent=w==='draw'?'Draw!':(w==='X'?'X wins!':'O wins!');}
        else document.getElementById('ttt-status').textContent=(state.turn==='X'?'Your turn (X)':'O’s turn');
      }
      function aiMove(){
        if(state.over)return;
        var r=ttMinimax(state.board.slice(),'O','O',0);
        if(r.move==null)return;
        state.board[r.move]='O';state.turn='X';paint();
      }
      $$('[data-mode]').forEach(function(b){
        b.onclick=function(){
          GAME.tttAi=b.dataset.mode==='ai';
          $$('[data-mode]').forEach(function(x){x.classList.remove('active');});
          b.classList.add('active');
          state.board=Array(9).fill('');state.turn='X';state.over=false;paint();
        };
      });
      $$('.ttt-cell').forEach(function(c){
        c.onclick=function(){
          var i=+c.dataset.i;
          if(state.over||state.board[i])return;
          if(GAME.tttAi&&state.turn!=='X')return;
          state.board[i]=state.turn;
          state.turn=state.turn==='X'?'O':'X';
          paint();
          if(GAME.tttAi&&!state.over)setTimeout(aiMove,300);
        };
      });
      paint();
    }}
  );
}

  function paint(){
    var disp=word.split('').map(function(c){return guessed.indexOf(c)>=0?c:'_';}).join(' ');
    var won=word.split('').every(function(c){return guessed.indexOf(c)>=0;});
    var lost=wrong>=max;
    openModal('🔤 Hangman',
      '<div class="hangman-word">'+disp+'</div>'+

       '<div class="hangman-keys">'+'abcdefghijklmnopqrstuvwxyz'.split('').map(function(l){

       }).join('')+'</div>'),
      {onMount:function(){
        $$('[data-hl]').forEach(function(b){

            var l=b.dataset.hl;

            paint();
          };
        });
      }}
    );
  }

}

/* ---------- Snake ---------- */
function openSnake(){
  var W=15,H=15;
  var snake=[{x:7,y:7}],dir={x:1,y:0},food={x:3,y:3},score=0,dead=false;
  openModal('🐍 Snake',
    '<div class="game-score" style="text-align:center;margin-bottom:8px" id="sn-score">0</div>'+
    '<div class="snake-grid" id="sn-grid">'+Array(W*H).fill(0).map(function(_,i){return '<div class="snake-cell" data-si="'+i+'"></div>';}).join('')+'</div>'+
    '<div style="text-align:center;margin-top:10px;color:var(--text3);font-size:12px">Use arrow keys or WASD</div>',
    {onMount:function(){
      function paint(){
        var cells=$$('.snake-cell');
        cells.forEach(function(c){c.className='snake-cell';});
        snake.forEach(function(s,i){
          var idx=s.y*W+s.x;
          if(cells[idx])cells[idx].className='snake-cell '+(i===0?'head':'body');
        });
        var fi=food.y*W+food.x;
        if(cells[fi])cells[fi].className='snake-cell food';
        $('#sn-score').textContent=score;
      }
      function step(){
        if(dead)return;
        var head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
        if(head.x<0||head.y<0||head.x>=W||head.y>=H||snake.some(function(s){return s.x===head.x&&s.y===head.y;})){
          dead=true;$('#sn-score').textContent='💀 '+score+' points';addCoins(score);return;
        }
        snake.unshift(head);
        if(head.x===food.x&&head.y===food.y){score++;food={x:Math.floor(Math.random()*W),y:Math.floor(Math.random()*H)};}
        else snake.pop();
        paint();
      }
      var t=setInterval(step,170);
      function key(e){
        var k=e.key.toLowerCase();
        if((k==='arrowup'||k==='w')&&dir.y!==1)dir={x:0,y:-1};
        if((k==='arrowdown'||k==='s')&&dir.y!==-1)dir={x:0,y:1};
        if((k==='arrowleft'||k==='a')&&dir.x!==1)dir={x:-1,y:0};
        if((k==='arrowright'||k==='d')&&dir.x!==-1)dir={x:1,y:0};
      }
      document.addEventListener('keydown',key);
      paint();
    }}
  );
}

/* --- TTT vs bot --- */
function betTTT(){
  var state={board:Array(9).fill(''),turn:'X',over:false};
  openModal('❌⭕ Bet: Tic-Tac-Toe',
    '<div class="game-head"><div class="game-score" id="bt-status">Your turn</div><div class="game-timer">Stake: '+BET.stake+'</div></div>'+
    '<div class="ttt-grid">'+Array(9).fill(0).map(function(_,i){return '<div class="ttt-cell" data-i="'+i+'"></div>';}).join('')+'</div>',
    {onMount:function(){
      function paint(){
        $$('.ttt-cell').forEach(function(c,i){c.textContent=state.board[i];});
        var w=ttWinner(state.board);
        if(w&&!state.over){
          state.over=true;
          if(w==='X'){document.getElementById('bt-status').textContent='🏆 You win!';betFinish('win');}
          else if(w==='O'){document.getElementById('bt-status').textContent='💀 Bot wins';betFinish('lose');}
          else {document.getElementById('bt-status').textContent='🤝 Draw';betFinish('draw');}
        }
      }
      function botMove(){
        if(state.over)return;
        var b=state.board.slice();
        var empties=b.map(function(v,i){return v?null:i;}).filter(function(x){return x!==null;});
        if(!empties.length)return;
        var move;
        var diff=BET.diff;
        if(diff==='easy'){ move=empties[Math.floor(Math.random()*empties.length)]; }
        else if(diff==='normal'){
          /* 65% optimal, 35% random */
          move=Math.random()<0.65?ttMinimax(b,'O','O',0).move:empties[Math.floor(Math.random()*empties.length)];
        } else {
          move=ttMinimax(b,'O','O',0).move;
        }
        state.board[move]='O';state.turn='X';paint();
      }
      $$('.ttt-cell').forEach(function(c){
        c.onclick=function(){
          var i=+c.dataset.i;
          if(state.over||state.board[i]||state.turn!=='X')return;
          state.board[i]='X';state.turn='O';paint();
          if(!state.over)setTimeout(botMove,320);
        };
      });
      paint();
    }}
  );
}

/* --- RPS best-of-5 vs bot --- */
function betRPS(){
  var rounds=0,meWins=0,botWins=0,history=[];
  openModal('✊✋✌️ Bet: Rock Paper Scissors',
    '<div class="game-head"><div class="game-score" id="br-score">0 – 0</div><div class="game-timer">Best of 5 · Stake '+BET.stake+'</div></div>'+
    '<div class="rps-choices">'+
      '<button class="rps-btn" data-brps="rock">✊</button>'+
      '<button class="rps-btn" data-brps="paper">✋</button>'+
      '<button class="rps-btn" data-brps="scissors">✌️</button>'+
    '</div><div class="rps-result" id="br-res">Round 1</div>',
    {onMount:function(){
      var moves=['rock','paper','scissors'];
      function beats(a,b){return (a==='rock'&&b==='scissors')||(a==='paper'&&b==='rock')||(a==='scissors'&&b==='paper');}
      $$('[data-brps]').forEach(function(b){
        b.onclick=function(){
          if(rounds>=5)return;
          var me=b.dataset.brps;
          history.push(me);
          var bot;
          var diff=BET.diff;
          if(diff==='easy'){ bot=moves[Math.floor(Math.random()*3)]; }
          else if(diff==='normal'){
            /* bot counters most common recent player move */
            var counts={rock:0,paper:0,scissors:0};
            history.slice(-5).forEach(function(m){counts[m]++;});
            var common=Object.keys(counts).sort(function(a,b){return counts[b]-counts[a];})[0];
            bot=beats('rock',common)?'rock':beats('paper',common)?'paper':'scissors';
            if(Math.random()<0.4)bot=moves[Math.floor(Math.random()*3)];
          } else {
            var c2={rock:0,paper:0,scissors:0};
            history.slice(-8).forEach(function(m){c2[m]++;});
            var com=Object.keys(c2).sort(function(a,b){return c2[b]-c2[a];})[0];
            bot=beats('rock',com)?'rock':beats('paper',com)?'paper':'scissors';
          }
          if(me===bot){} else if(beats(me,bot))meWins++; else botWins++;
          rounds++;
          $('#br-score').textContent=meWins+' – '+botWins;
          $('#br-res').textContent='You: '+me+' · Bot: '+bot+'  (round '+rounds+')';
          if(rounds>=5||meWins>=3||botWins>=3){
            var res=meWins>botWins?'win':(meWins<botWins?'lose':'draw');
            setTimeout(function(){betFinish(res);},400);
          }
        };
      });
    }}
  );
}

/* --- Reaction vs bot --- */
function betReaction(){

  openModal('⚡ Bet: Reaction Test',

    '<div class="reaction-pad idle" id="brc-pad">Tap to start</div>',
    {onMount:function(){

      pad.onclick=function(){
        if(pad.classList.contains('go')){
          var ms=Date.now()-start;
          pad.className='reaction-pad idle';
          if(ms<botMs){pad.textContent='⚡ '+ms+' ms — You win!';betFinish('win');}
          else{pad.textContent='⚡ '+ms+' ms — Bot wins';betFinish('lose');}
          return;
        }
        if(armed){clearTimeout(timer);armed=false;pad.className='reaction-pad idle';pad.textContent='Too soon!';return;}
        pad.className='reaction-pad wait';pad.textContent='Wait for green…';armed=true;
        timer=setTimeout(function(){
          armed=false;start=Date.now();
          pad.className='reaction-pad go';pad.textContent='TAP NOW!';
        },1000+Math.random()*2000);
      };
    }}
  );
}

/* --- Number guess vs bot --- */
function betGuess(){
  var target=Math.floor(Math.random()*100)+1;
  var myTries=0,botTries=0,botLow=1,botHigh=100,botDone=false;
  openModal('🔢 Bet: Number Guess',
    '<div class="game-head"><div class="game-score" id="bg-status">1 – 100</div><div class="game-timer">Bot guesses automatically</div></div>'+
    '<div class="guess-num-display" id="bg-display">?</div>'+
    '<div class="guess-hint" id="bg-hint">Your tries: 0 · Bot tries: 0</div>'+
    '<div class="ai-input-row"><input id="bg-input" type="number" placeholder="Your guess"><button class="btn primary" id="bg-go">Guess</button></div>',
    {onMount:function(){
      function botStep(){
        if(botDone)return;
        botTries++;
        var g=Math.floor((botLow+botHigh)/2);
        if(g===target){
          botDone=true;
          $('#bg-hint').textContent='Bot got it in '+botTries+' tries!';
          if(myTries===0||botTries<myTries){betFinish('lose');}
          return;
        }
        if(g<target)botLow=g+1; else botHigh=g-1;
        $('#bg-hint').textContent='Your tries: '+myTries+' · Bot tries: '+botTries;
        setTimeout(botStep,900);
      }
      setTimeout(botStep,1200);
      $('#bg-go').onclick=function(){
        var v=parseInt($('#bg-input').value,10);
        if(!v||botDone)return;
        myTries++;
        if(v===target){
          $('#bg-display').textContent=v;
          $('#bg-hint').textContent='🎉 You got it in '+myTries+' tries!';
          botDone=true;
          betFinish(myTries<botTries||botTries===0?'win':'lose');
        } else {
          $('#bg-display').textContent=v;
          $('#bg-hint').textContent=(v<target?'⬆️ Higher':'⬇️ Lower')+' · Your tries: '+myTries;
        }
      };
    }}
  );
}

            '<div class="cp-sg-desc">This site blocks embedding. Open it in a new tab — it works perfectly there and on Android will open your installed app.</div>'+
            '<div class="cp-sg-row">'+
              '<button class="btn primary" data-open="'+esc(url)+'">↗ Open in new tab</button>'+
              '<button class="btn" data-try="'+esc(url)+'">Try inside app</button>'+
            '</div></div>';
          $$('[data-open]').forEach(function(b){b.onclick=function(){window.open(b.dataset.open,'_blank','noopener,noreferrer');};});
          $$('[data-try]').forEach(function(b){b.onclick=function(){render(b.dataset.try,null,true);};});
          return;
        }
        var f=document.createElement('iframe');
        f.src=url;f.style.cssText='width:100%;height:100%;border:none;display:block;background:#fff';
        f.setAttribute('allow','clipboard-write; fullscreen; autoplay; encrypted-media; picture-in-picture');
        wrap.appendChild(f);
        var bar=document.createElement('div');bar.className='cp-framebar';
        bar.innerHTML='<button data-open="'+esc(url)+'">↗ Open in tab</button>';
        wrap.appendChild(bar);
        $$('[data-open]',bar).forEach(function(b){b.onclick=function(){window.open(b.dataset.open,'_blank','noopener,noreferrer');};});
      }
      $('#bb-go').onclick=function(){var u=cpNormalize($('#bb-url').value);if(u)render(u,null,false);};
      $('#bb-url').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();$('#bb-go').click();}});
      $('#bb-back').onclick=function(){try{history.back();}catch(e){}};
      $('#bb-fwd').onclick=function(){try{history.forward();}catch(e){}};
      $('#bb-refresh').onclick=function(){var u=$('#bb-url').value;if(u)render(u,null,false);};
      $$('[data-cp-site]').forEach(function(b){
        b.onclick=function(){var s=CP_SITE_MAP[b.dataset.cpSite];if(s)render(s.u,s,false);};
      });
    }}
  );
}

function cpExtractId(u){
  if(!u)return '';
  u=String(u).trim();
  if(/^[\w-]{11}$/.test(u))return u;
  var m=u.match(/(?:v=|\/embed\/|youtu\.be\/|\/shorts\/|\/v\/|\/live\/)([\w-]{11})/);
  return m?m[1]:'';
}
function cpStoredId(i){try{return localStorage.getItem('cp_hindi_id_'+i)||'';}catch(e){return '';}}
function cpSaveId(i,id){try{if(id)localStorage.setItem('cp_hindi_id_'+i,id);else localStorage.removeItem('cp_hindi_id_'+i);}catch(e){}}

var cpYt=null,cpYtWait=null;
function cpYtWith(fn){
  if(window.YT&&window.YT.Player)return fn();
  if(cpYtWait&&cpYtWait._t)return;
  cpYtWait=fn;
  cpYtWait._t=setInterval(function(){
    if(window.YT&&window.YT.Player){clearInterval(cpYtWait._t);var f=cpYtWait;cpYtWait=null;f();}
  },250);
}
function cpYtPlay(id,label){
  cpYtWith(function(){
    if(!cpYt){
      var host=document.getElementById('cp-yt-host');
      if(!host){host=document.createElement('div');host.id='cp-yt-host';host.className='mp-hidden';host.innerHTML='<div id="cp-yt-player"></div>';document.body.appendChild(host);}
      cpYt=new YT.Player('cp-yt-player',{height:'180',width:'320',videoId:id,playerVars:{autoplay:1,controls:0,playsinline:1},events:{onReady:function(e){try{e.target.playVideo();}catch(err){}}}});
      try{var p=YT.get&&YT.get('yt-player');if(p&&p.pauseVideo)p.pauseVideo();}catch(e){}
    } else {
      try{cpYt.loadVideoById(id);cpYt.playVideo();}catch(e){}
      try{var q=YT.get&&YT.get('yt-player');if(q&&q.pauseVideo)q.pauseVideo();}catch(e){}
    }
    toast('🎧 Now playing',label||'','ok');
  });
}

function paintHindiTracks(){
  var box=document.getElementById('mp-tracks'); if(!box||box.querySelector('[data-cp-hindi]'))return;
  var sec=document.createElement('div');sec.className='cp-hindi';sec.setAttribute('data-cp-hindi','1');
  var html='<div style="font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);padding:6px 8px">🇮🇳 Hindi Hits</div>';
  CP_HINDI.forEach(function(s,i){
    var has=!!cpStoredId(i);
    html+='<button class="mp-track'+(has?' hasid':'')+'" data-cp-h="'+i+'" type="button">'+
      '<span class="mp-num">'+(i+1)+'</span>'+
      '<span class="mp-ttl">'+esc(s.t)+'<small>'+esc(s.a)+'</small></span>'+
      '<span class="cp-link" data-cp-hlink="'+i+'" title="Set video link" style="width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:12px;flex:none">🔗</span>'+
    '</button>';
  });
  html+='<div style="font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);padding:8px 8px 6px;margin-top:6px">🌍 Global Hits</div>';
  CP_GLOBAL.forEach(function(s,i){
    html+='<button class="mp-track" data-cp-g="'+i+'" type="button">'+
      '<span class="mp-num">'+(i+1)+'</span>'+
      '<span class="mp-ttl">'+esc(s.t)+'<small>'+esc(s.a)+'</small></span>'+
    '</button>';
  });
  sec.innerHTML=html;
  box.insertBefore(sec,box.firstChild);
}

document.addEventListener('click',function(e){
  var t=e.target; if(!t||!t.closest)return;
  var lk=t.closest('[data-cp-hlink]');
  if(lk){
    e.preventDefault();e.stopPropagation();
    var i=+lk.getAttribute('data-cp-hlink');
    var v=window.prompt('Paste YouTube link or video ID for:\n'+CP_HINDI[i].t,cpStoredId(i)||'');
    if(v===null)return;
    var id=cpExtractId(v);
    if(!id){toast('Invalid link','No video ID found','err');return;}
    cpSaveId(i,id);
    var box=document.getElementById('mp-tracks');
    if(box){var s=box.querySelector('[data-cp-hindi]');if(s)s.remove();}
    paintHindiTracks();
    toast('Saved',CP_HINDI[i].t,'ok');
    return;
  }
  var h=t.closest('[data-cp-h]');
  if(h){
    e.preventDefault();e.stopPropagation();
    var idx=+h.getAttribute('data-cp-h');
    var sid=cpStoredId(idx);
    if(sid)cpYtPlay(sid,CP_HINDI[idx].t);
    else{window.open('https://www.youtube.com/results?search_query='+encodeURIComponent(CP_HINDI[idx].q),'_blank','noopener,noreferrer');toast('YouTube','Tap 🔗 to play it inside the app','ok');}
    return;
  }
  var g=t.closest('[data-cp-g]');
  if(g){
    e.preventDefault();e.stopPropagation();
    var gi=+g.getAttribute('data-cp-g');
    cpYtPlay(CP_GLOBAL[gi].id,CP_GLOBAL[gi].t);
    return;
  }
},true);

function wireMusicUI(){
  var ball=$('#mp-ball'),panel=$('#mp-panel');
  if(!ball)return;
  ball.onclick=function(){ panel.classList.toggle('hidden'); if(!panel.classList.contains('hidden'))paintHindiTracks(); };
  $('#mp-close').onclick=function(){panel.classList.add('hidden');};
  $('#mp-play').innerHTML=SVG.play;
  $('#mp-prev').innerHTML=SVG.prev;
  $('#mp-next').innerHTML=SVG.next;
  $('#mp-play').onclick=function(){
    var icon=$('#mp-play');
    if(icon.innerHTML.indexOf('M6 4')>=0){ icon.innerHTML=SVG.play; ball.classList.remove('playing'); }
    else { icon.innerHTML=SVG.pause; ball.classList.add('playing'); }
    try{var p=YT.get&&YT.get('yt-player');if(p){icon.innerHTML.indexOf('M6 4')>=0?p.pauseVideo():p.playVideo();}}catch(e){}
  };
  $('#mp-addlink-btn').onclick=function(){
    var v=$('#mp-link-input').value.trim();
    var id=cpExtractId(v);
    if(!id){toast('Invalid link','Paste a YouTube URL','err');return;}
    cpYtPlay(id,'Custom track');
    $('#mp-link-input').value='';
  };
}

function openProfile(uid2){
  var p=PROFILES[uid2]||loadLocalUser(uid2)||{id:uid2,username:shortId(uid2),display_name:'Unknown'};
  var isMe=uid2===ME.id;
  var banner=p.banner_url||'';
  var html='<div class="profile-banner" style="'+(banner?'background-image:url('+esc(banner)+')':'')+'">'+
    (isMe?'<button class="pb-edit" id="pf-banner-btn">🖼 Change banner</button>':'')+'</div>'+
    '<div style="padding:0 4px;margin-top:-36px;position:relative">'+
      '<div class="profile-avwrap">'+avatarHTML(uid2,72)+(isMe?'<div class="pa-edit" id="pf-av-btn">✎</div>':'')+'</div>'+
      '<div style="margin-top:10px"><div style="font-family:\'Space Grotesk\';font-size:20px;font-weight:800;'+(isMe?nameStyle():'')+'">'+esc(p.display_name||p.username)+'</div>'+
      '<div style="color:var(--text3);font-size:12.5px">@'+esc(p.username||'')+'</div></div>'+
      (p.bio?'<div style="margin-top:12px;font-size:13px;color:var(--text2);line-height:1.5">'+esc(p.bio)+'</div>':'')+
      '<div class="profile-actions">'+
        (isMe?'<button class="btn primary" id="pf-edit">✎ Edit profile</button>':
             '<button class="btn primary" id="pf-dm">💬 Message</button><button class="btn" id="pf-friend">➕ Friend</button>')+
      '</div>'+
    '</div>';

  openModal(p.display_name||p.username,html,{onMount:function(){
    if(isMe){
      $('#pf-edit').onclick=openProfileEditor;
      $('#pf-av-btn').onclick=openProfileEditor;
      $('#pf-banner-btn').onclick=function(){
        var v=window.prompt('Banner image URL:',banner||'');
        if(v===null)return;
        ME.banner_url=v;saveLocalUser(ME);PROFILES[ME.id]=ME;
        closeModal();openProfile(ME.id);renderAll();
      };
    } else {
      $('#pf-dm').onclick=function(){
        if(!canDM(uid2)){toast('DMs blocked','This member cannot receive DMs','err');return;}
        closeModal();
        var d=DMS.find(function(x){return x.users.indexOf(ME.id)>=0&&x.users.indexOf(uid2)>=0;});
        if(!d){d={id:'d_'+uid(),users:[ME.id,uid2],created:Date.now()};DMS.push(d);Store.saveDms(DMS);}
        openDm(d.id);
      };
      $('#pf-friend').onclick=function(){toast('Friend request','Sent!','ok');closeModal();};
    }
  }});
}

function openProfileEditor(){
  openModal('Edit profile',
    '<div class="field"><label>Display name</label><input id="pe-name" maxlength="40" value="'+esc(ME.display_name||'')+'"></div>'+
    '<div class="field"><label>Username</label><input id="pe-user" maxlength="24" value="'+esc(ME.username||'')+'"><div class="hint">3-24 chars: a-z, 0-9, underscore</div></div>'+
    '<div class="field"><label>Avatar URL</label><input id="pe-av" value="'+esc(ME.avatar_url||'')+'"></div>'+
    '<div class="field"><label>Banner URL</label><input id="pe-ban" value="'+esc(ME.banner_url||'')+'"></div>'+
    '<div class="field"><label>Bio</label><textarea id="pe-bio" maxlength="190">'+esc(ME.bio||'')+'</textarea></div>'+
    '<div class="field"><label>Status</label><select id="pe-status">'+
      ['online','idle','dnd','offline'].map(function(s){return '<option value="'+s+'" '+(ME.status===s?'selected':'')+'>'+s+'</option>';}).join('')+
    '</select></div>',
    {footer:'<button class="btn" id="pe-cancel">Cancel</button><button class="btn primary" id="pe-save">Save</button>',
     onMount:function(){
       $('#pe-cancel').onclick=closeModal;
       $('#pe-save').onclick=function(){
         var u=$('#pe-user').value.trim().toLowerCase();
         if(!/^[a-z0-9_]{3,24}$/.test(u)){toast('Invalid username','3-24 chars a-z 0-9 _','err');return;}
         ME.display_name=$('#pe-name').value.trim()||ME.username;
         ME.username=u;
         ME.avatar_url=$('#pe-av').value.trim();
         ME.banner_url=$('#pe-ban').value.trim();
         ME.bio=$('#pe-bio').value.trim();
         ME.status=$('#pe-status').value;
         saveLocalUser(ME);PROFILES[ME.id]=ME;
         var users=loadLS('cp_local_users',{});
         Object.keys(users).forEach(function(k){if(users[k].id===ME.id){users[k].username=u;users[k].display_name=ME.display_name;saveLS('cp_local_users',users);}});
         closeModal();renderAll();toast('Saved','Profile updated','ok');
       };
     }}
  );
}

function openSearch(){
  var cid=currentChannelId(); if(!cid){toast('Open a channel first','','err');return;}
  openModal('🔍 Search messages',
    '<input class="qs-input" id="sq-input" placeholder="Search in this channel…" autofocus>'+
    '<div class="qs-list" id="sq-res"></div>',
    {onMount:function(){
      var inp=$('#sq-input');
      inp.oninput=function(){
        var q=inp.value.toLowerCase().trim();
        var res=$('#sq-res');
        if(!q){res.innerHTML='';return;}
        var hits=MESSAGES.filter(function(m){return !m.deleted&&String(m.content||'').toLowerCase().indexOf(q)>=0;}).slice(-30).reverse();
        res.innerHTML=hits.length?hits.map(function(m){
          return '<div class="qs-item"><b style="color:var(--accent)">'+esc(userLabel(m.author_id))+'</b> '+esc(String(m.content).slice(0,90))+'</div>';
        }).join(''):'<div style="padding:12px;color:var(--text3);font-size:13px">No matches</div>';
      };
      inp.focus();
    }}
  );
}

function openQuickSwitch(){
  var items=[];
  items.push({t:'🏠 Home',a:function(){goHome();}});
  SERVERS.forEach(function(s){
    items.push({t:'🏰 '+s.name,a:function(){openServer(s.id);}});
    CHANNELS.filter(function(c){return c.server_id===s.id&&c.type==='text'&&canViewChannel(s.id,c.id,ME.id);}).forEach(function(c){
      items.push({t:'# '+c.name+' — '+s.name,a:function(){openChannel(c.id);}});
    });
  });
  DMS.forEach(function(d){
    var o=d.users.find(function(u){return u!==ME.id;})||d.users[0];
    items.push({t:'💬 '+userLabel(o),a:function(){openDm(d.id);}});
  });
  items.push({t:'🎮 Games',a:openGames});
  items.push({t:'🛒 Shop',a:openShop});
  items.push({t:'🌐 Browser',a:openBrowserApp});

  openModal('⚡ Quick switch',
    '<input class="qs-input" id="qs-input" placeholder="Type to filter…" autofocus><div class="qs-list" id="qs-list"></div>',
    {onMount:function(){
      var inp=$('#qs-input'),list=$('#qs-list'),filtered=items;
      function paint(){
        list.innerHTML=filtered.length?filtered.map(function(it,i){
          return '<button class="qs-item" data-qs="'+i+'">'+esc(it.t)+'</button>';
        }).join(''):'<div style="padding:12px;color:var(--text3);font-size:13px">Nothing found</div>';
        $$('[data-qs]',list).forEach(function(b){
          b.onclick=function(){var it=filtered[+b.dataset.qs];closeModal();if(it)it.a();};
        });
      }
      inp.oninput=function(){
        var q=inp.value.toLowerCase();
        filtered=items.filter(function(it){return it.t.toLowerCase().indexOf(q)>=0;});
        paint();
      };
      paint();
      inp.focus();
    }}
  );
}
