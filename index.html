  openOnlineGame(d.game,d.sessionId,d.from,d.bet,true);
}
function openOnlineGame(game,sessionId,opponentId,bet,isHost){
  Game.game=game;Game.session=sessionId;Game.opponent=opponentId;Game.bet=bet||0;Game.done=false;
  Game.myChoice=null;Game.theirChoice=null;
  if(game==='ttt'){Game.board=Array(9).fill('');Game.symbol=isHost?'X':'O';Game.myTurn=isHost;}
  if(Game.ch){try{sb.removeChannel(Game.ch);}catch(e){}}
  Game.ch=sb.channel('game-'+sessionId,{config:{broadcast:{self:false}}});
  Game.ch.on('broadcast',{event:'g'},function(msg){var d=msg.payload||{};if(d.from===ME.id)return;handleGameMessage(d);});
  Game.ch.subscribe();renderGameModal();
}
function gameSend(payload){if(Game.ch){payload.from=ME.id;try{Game.ch.send({type:'broadcast',event:'g',payload:payload});}catch(e){}}}
function handleGameMessage(d){
  if(d.t==='move'&&Game.game==='ttt'){if(Game.board[d.idx]===''&&!Game.done){Game.board[d.idx]=d.sym;Game.myTurn=true;renderGameModal();checkTTT();}}
  else if(d.t==='rps'){Game.theirChoice=d.choice;resolveRPS();}
  else if(d.t==='rematch'){startTTTBoard();renderGameModal();}
}
function startTTTBoard(){Game.board=Array(9).fill('');Game.done=false;Game.myTurn=(Game.symbol==='X');gameSend({t:'rematch'});}
function renderGameModal(){
  var oppName=userLabel(Game.opponent);var body='';
  if(Game.game==='ttt'){
    body='<div class="game-head"><div><div style="font-size:12px;color:var(--text3)">You are</div><div class="game-score">'+Game.symbol+'</div></div>'+
      '<div style="text-align:right"><div style="font-size:12px;color:var(--text3)">'+esc(oppName)+'</div><div class="game-score">'+(Game.symbol==='X'?'O':'X')+'</div></div></div>'+
      '<div style="text-align:center;font-weight:700;margin-bottom:8px" id="ttt-status">'+(Game.done?'Game over':(Game.myTurn?'Your turn':'Their turn...'))+'</div>'+
      '<div class="ttt-grid" id="ttt-grid">'+Game.board.map(function(v,i){return '<button class="ttt-cell" data-ttt="'+i+'" type="button">'+esc(v)+'</button>';}).join('')+'</div>'+
      (Game.bet>0?'<p style="text-align:center;color:var(--gold);font-weight:700">💰 Pot: '+(Game.bet*2)+' coins</p>':'');
  }else if(Game.game==='rps'){
    body='<div class="game-head"><div style="font-weight:700">vs '+esc(oppName)+'</div>'+(Game.bet>0?'<div class="game-score">🪙 '+(Game.bet*2)+'</div>':'')+'</div>'+
      '<div class="rps-choices"><button class="rps-btn" data-rps="rock" type="button">🪨</button>'+
      '<button class="rps-btn" data-rps="paper" type="button">📄</button>'+
      '<button class="rps-btn" data-rps="scissors" type="button">✂️</button></div>'+
      '<div class="rps-result" id="rps-result">'+(Game.myChoice?'Waiting for '+esc(oppName)+'...':'Pick your move!')+'</div>';
  }
  qaModal('<div class="modal-head"><h3>🎮 '+(Game.game==='ttt'?'Tic-Tac-Toe':'Rock Paper Scissors')+'</h3><button class="xbtn" id="qa-x" type="button">'+SVG.x+'</button></div>'+
    '<div class="modal-body">'+body+'</div>');
  var x=document.getElementById('qa-x');if(x)x.onclick=function(){closeQa();gameSend({t:'leave'});};
  if(Game.game==='ttt'){
    $$('#ttt-grid .ttt-cell').forEach(function(btn){
      btn.onclick=function(){
        var i=parseInt(btn.dataset.ttt,10);if(Game.done||!Game.myTurn||Game.board[i]!=='')return;
        Game.board[i]=Game.symbol;Game.myTurn=false;gameSend({t:'move',idx:i,sym:Game.symbol});renderGameModal();checkTTT();
      };
    });
  }
  if(Game.game==='rps'){
    $$('[data-rps]').forEach(function(btn){
      btn.onclick=function(){
        if(Game.myChoice)return;Game.myChoice=btn.dataset.rps;gameSend({t:'rps',choice:Game.myChoice});
        var r=document.getElementById('rps-result');if(r)r.textContent='Waiting for '+oppName+'...';resolveRPS();
      };
    });
  }
}
function checkTTT(){
  var b=Game.board;var lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  var winSym=null,winLine=null;
  lines.forEach(function(l){if(b[l[0]]&&b[l[0]]===b[l[1]]&&b[l[1]]===b[l[2]]){winSym=b[l[0]];winLine=l;}});
  if(winSym){Game.done=true;
    $$('#ttt-grid .ttt-cell').forEach(function(btn,i){if(winLine&&winLine.indexOf(i)>=0)btn.classList.add('win');});
    var st=document.getElementById('ttt-status');if(st)st.textContent=(winSym===Game.symbol?'🎉 You win!':'😢 You lose');
    finishGame(winSym===Game.symbol);return;
  }
  if(b.every(function(v){return v!=='';})){Game.done=true;var st2=document.getElementById('ttt-status');if(st2)st2.textContent='🤝 Draw';finishGame(null);}
}
function resolveRPS(){
  if(!Game.myChoice||!Game.theirChoice)return;
  var me=Game.myChoice,them=Game.theirChoice;var res;
  if(me===them)res='draw';
  else if((me==='rock'&&them==='scissors')||(me==='paper'&&them==='rock')||(me==='scissors'&&them==='paper'))res='win';
  else res='lose';
  var r=document.getElementById('rps-result');
  if(r){var emo={rock:'🪨',paper:'📄',scissors:'✂️'};r.innerHTML=emo[me]+' vs '+emo[them]+' — '+(res==='win'?'🎉 You win!':res==='lose'?'😢 You lose':'🤝 Draw');}
  finishGame(res==='win'?true:res==='lose'?false:null);
}
function finishGame(won){
  if(Game.done===false)Game.done=true;
  if(Game.bet>0){
    if(won===true){addCoins(Game.bet*2);toast('You won!','+'+Game.bet*2+' coins','ok');}
    else if(won===false){toast('You lost','-'+Game.bet+' coins','err');sfxBad();}
    else{addCoins(Game.bet);toast('Draw','Bet refunded','ok');}
  }
  renderPanel();
}

/* FISHING */
function startFishing(){
  var state={active:false,timer:null,endsAt:0,caught:0,coins:0};
  qaModal('<div class="modal-head"><h3>🎣 Fishing Pond</h3><button class="xbtn" id="qa-x" type="button">'+SVG.x+'</button></div>'+
    '<div class="modal-body"><div class="game-head"><div><div style="font-size:11px;color:var(--text3)">BALANCE</div><div class="game-score" id="fish-coins">🪙 '+WALLET.coins+'</div></div>'+
    '<div style="text-align:right"><div class="game-timer" id="fish-timer">—</div><div style="font-size:11px;color:var(--text3)" id="fish-caught">Caught: 0</div></div></div>'+
    '<div class="fish-pond" id="fish-pond"></div>'+
    '<p style="font-size:11.5px;color:var(--text3);margin-top:10px">Tap fish to catch. 🐡 piranha steals coins!</p></div>'+
    '<div class="modal-foot"><button class="btn primary" id="fish-cast" type="button">Cast net (10 🪙)</button></div>');
  $("#qa-x").onclick=function(){stopFishing();closeQa();};
  var pond=$("#fish-pond");
  $("#fish-cast").onclick=function(){
    if(state.active)return;
    if(WALLET.coins<10){toast('Not enough coins','You need 10 coins','err');return;}
    addCoins(-10);var fc=$("#fish-coins");if(fc)fc.textContent='🪙 '+WALLET.coins;
    state.active=true;state.caught=0;state.coins=0;state.endsAt=Date.now()+20000;
    pond.innerHTML='';var fcd=$("#fish-caught");if(fcd)fcd.textContent='Caught: 0';
    var kinds=[{e:'🐟',v:15,w:32},{e:'🐠',v:22,w:24},{e:'🐡',v:-25,w:14},{e:'🦈',v:45,w:10},{e:'🦐',v:12,w:16},{e:'🦑',v:30,w:9},{e:'🐙',v:35,w:6},{e:'🐢',v:18,w:10},{e:'💎',v:120,w:3},{e:'👑',v:200,w:2}];
    for(var i=0;i<9;i++)spawnFish(weightedPick(kinds));
    state.timer=setInterval(function(){
      var left=Math.max(0,state.endsAt-Date.now());var tEl=$("#fish-timer");if(tEl)tEl.textContent=(left/1000).toFixed(1)+'s';
      if(left<=0)endCast();
    },100);
  };
  function weightedPick(arr){var total=0;arr.forEach(function(k){total+=k.w;});var r=Math.random()*total;for(var i=0;i<arr.length;i++){r-=arr[i].w;if(r<=0)return arr[i];}return arr[0];}
  function spawnFish(kind){
    var el=document.createElement('div');el.className='fish-item';el.textContent=kind.e;
    var w=pond.clientWidth||300,h=pond.clientHeight||260;
    var x=Math.random()*Math.max(1,w-40),y=Math.random()*Math.max(1,h-40);
    el.style.left=x+'px';el.style.top=y+'px';
    var vx=(Math.random()*1.6+0.5)*(Math.random()<0.5?-1:1);var vy=(Math.random()*1.0+0.2)*(Math.random()<0.5?-1:1);
    pond.appendChild(el);var alive=true;
    el.addEventListener('click',function(){
      if(!alive||!state.active)return;alive=false;el.classList.add('caught');
      addCoins(kind.v);state.coins+=kind.v;state.caught++;
      var cEl=$("#fish-coins");if(cEl)cEl.textContent='🪙 '+WALLET.coins;
      var caEl=$("#fish-caught");if(caEl)caEl.textContent='Caught: '+state.caught;
      if(kind.v<0){sfxBad();toast('Ouch!','Piranha stole '+Math.abs(kind.v)+' coins','err');}else sfxCoin();
      setTimeout(function(){el.remove();},320);
    });
    (function anim(){
      if(!alive||!state.active)return;
      var cx=parseFloat(el.style.left),cy=parseFloat(el.style.top);
      var w2=pond.clientWidth,h2=pond.clientHeight;cx+=vx;cy+=vy;
      if(cx<0||cx>w2-36)vx=-vx;if(cy<0||cy>h2-36)vy=-vy;
      el.style.left=cx+'px';el.style.top=cy+'px';el.style.transform='scaleX('+(vx<0?-1:1)+')';
      requestAnimationFrame(anim);
    })();
  }
  function endCast(){
    state.active=false;clearInterval(state.timer);
    pond.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:8px">'+
      '<div style="font-size:34px">🪣</div><div style="font-weight:800;font-family:Space Grotesk;font-size:18px;color:var(--accent)">Cast complete!</div>'+
      '<div style="font-size:13px;color:var(--text2)">'+state.caught+' fish, '+(state.coins>=0?'+':'')+state.coins+' coins</div></div>';
    var tEl=$("#fish-timer");if(tEl)tEl.textContent='—';renderPanel();
  }
  function stopFishing(){state.active=false;if(state.timer)clearInterval(state.timer);}
}

/* SNAKE */
function startSnake(){
  var N=15;var snake=[{x:7,y:7}],dir={x:1,y:0},food={x:10,y:7},score=0,dead=false,timer=null;
  qaModal('<div class="modal-head"><h3>🐍 Snake</h3><button class="xbtn" id="qa-x" type="button">'+SVG.x+'</button></div>'+
    '<div class="modal-body"><div class="game-head"><div class="game-score" id="snake-score">0</div>'+
    '<div style="display:flex;gap:6px"><button class="btn sm" data-sd="up" type="button">↑</button><button class="btn sm" data-sd="left" type="button">←</button><button class="btn sm" data-sd="down" type="button">↓</button><button class="btn sm" data-sd="right" type="button">→</button></div></div>'+
    '<div class="snake-grid" id="snake-grid"></div></div>');
  $("#qa-x").onclick=function(){if(timer)clearInterval(timer);document.onkeydown=null;closeQa();};
  function draw(){
    var g=$("#snake-grid");if(!g)return;var cells=[];
    for(var y=0;y<N;y++)for(var x=0;x<N;x++){
      var cls='snake-cell';
      if(snake[0].x===x&&snake[0].y===y)cls+=' head';
      else if(snake.some(function(s){return s.x===x&&s.y===y;}))cls+=' body';
      if(food.x===x&&food.y===y)cls+=' food';
      cells.push('<div class="'+cls+'"></div>');
    }
    g.innerHTML=cells.join('');var sc=$("#snake-score");if(sc)sc.textContent=score;
  }
  function step(){
    if(dead)return;
    var head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
    if(head.x<0||head.y<0||head.x>=N||head.y>=N||snake.some(function(s){return s.x===head.x&&s.y===head.y;})){
      dead=true;clearInterval(timer);var reward=score*2;if(reward>0){addCoins(reward);toast('Game over','+'+reward+' coins','ok');}return;
    }
    snake.unshift(head);
    if(head.x===food.x&&head.y===food.y){score++;sfxCoin();do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)};}while(snake.some(function(s){return s.x===food.x&&s.y===food.y;}));}
    else snake.pop();
    draw();
  }
  function setDir(d){
    if(d==='up'&&dir.y===0)dir={x:0,y:-1};
    if(d==='down'&&dir.y===0)dir={x:0,y:1};
    if(d==='left'&&dir.x===0)dir={x:-1,y:0};
    if(d==='right'&&dir.x===0)dir={x:1,y:0};
  }
  $$('[data-sd]').forEach(function(b){b.onclick=function(){setDir(b.dataset.sd);};});
  document.onkeydown=function(e){if(e.key==='ArrowUp')setDir('up');if(e.key==='ArrowDown')setDir('down');if(e.key==='ArrowLeft')setDir('left');if(e.key==='ArrowRight')setDir('right');};
  draw();timer=setInterval(step,150);
}

function aiReply(input){
  var q=input.toLowerCase().trim();
  var m=q.replace(/[^0-9+\-*/(). %]/g,'');
  if(/^[\d+\-*/(). %]+$/.test(q)&&/[0-9]/.test(q)&&/[+\-*/]/.test(q)){try{var val=Function('"use strict";return ('+m+')')();if(typeof val==='number'&&isFinite(val))return input+' = '+val;}catch(e){}}
  if(/^(hi|hey|hello|yo|sup|hiya)\b/.test(q))return "Heyy 👋 What's good? Want a joke, some math help, or random ideas?";
  if(/how are you/.test(q))return "Running at 100% vibes ⚡ What can I do for you?";
  if(/your name|who are you/.test(q))return "I'm Chatter AI — baked right into Chatter's Paradise.";
  if(/joke|funny|laugh/.test(q)){var jokes=["Why do programmers prefer dark mode? Because light attracts bugs 🐛","I told my Wi-Fi we needed to talk. Now we have no connection. 📡","Why did the scarecrow win an award? He was outstanding in his field 🌾","What do you call a fake noodle? An impasta 🍝"];return jokes[Math.floor(Math.random()*jokes.length)];}
  if(/flip a coin|coin flip/.test(q))return "🪙 "+(Math.random()<0.5?'Heads!':'Tails!');
  if(/roll a? ?dice/.test(q))return "🎲 You rolled a "+(1+Math.floor(Math.random()*6));
  if(/time|clock/.test(q))return "It's "+new Date().toLocaleTimeString()+" ⏰";
  if(/date|today/.test(q))return "Today is "+new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'})+" 📅";
  if(/help|what can you do/.test(q))return "I can: jokes, math, coins, dice, ideas, time/date, and chat. Try: \"joke\", \"2+2*8\", \"flip a coin\".";
  if(/game|play/.test(q))return "Check the 🎮 arcade — fishing, snake, trivia, memory, hangman, typing test and more!";
  if(/coin|money|wallet/.test(q))return "You've got 🪙 "+WALLET.coins+" coins. Daily claim, chat, and games earn more.";
  if(/shop|cosmetic|badge/.test(q))return "The 🛒 shop has game badges, name colors, effects, and themes.";
  if(/role|permission/.test(q))return "Owners and staff can create roles from Server Settings → Roles. Private channels are locked to specific roles.";
  if(/thank/.test(q))return "Anytime 💪";
  if(/bye|later/.test(q))return "Later! Ping me whenever 👋";
  if(/\?$/.test(q))return "Good question. Tell me more and I'll get specific.";
  var generic=["Interesting 🤔 Tell me more.","I hear you. What's the plan?","Big energy. Say more 👀","Noted 📝 What else?"];
  return generic[Math.floor(Math.random()*generic.length)];
}

var MP={open:false,ytPlayer:null,ytReady:false,index:0,playing:false,initialized:false};
window.onYouTubeIframeAPIReady=function(){MP.ytReady=true;if(MP.open)initYT();};
function extractYTId(url){
  if(!url)return null;url=url.trim();
  if(/^[a-zA-Z0-9_-]{11}$/.test(url))return url;
  var m=url.match(/(?:youtu\.be\/|youtube\.com\/(?:.*v=|[^\/]+\/|embed\/|shorts\/|v\/))([\w-]{11})/);
  return m?m[1]:null;
}
function mpInit(){
  var ball=$("#mp-ball"),panel=$("#mp-panel");if(!ball||!panel)return;
  ball.addEventListener('click',function(){MP.open=true;ball.classList.add('hidden');panel.classList.remove('hidden');initYT();});
  $("#mp-close").addEventListener('click',function(){MP.open=false;panel.classList.add('hidden');ball.classList.remove('hidden');});
  $("#mp-play").onclick=function(){if(!MP.ytPlayer){initYT();return;}try{if(MP.playing)MP.ytPlayer.pauseVideo();else MP.ytPlayer.playVideo();}catch(e){}};
  $("#mp-prev").onclick=function(){mpPlayIndex(MP.index-1);};
  $("#mp-next").onclick=function(){mpPlayIndex(MP.index+1);};
  var linkBtn=$("#mp-addlink-btn");
  if(linkBtn)linkBtn.onclick=function(){
    var url=$("#mp-link-input").value.trim();var id=extractYTId(url);
    if(!id){toast('Invalid link','Could not find YouTube video ID','err');return;}
    var existing=TRACKS.findIndex(function(t){return t.id===id;});
    if(existing>=0){mpPlayIndex(existing);toast('Playing','Existing track','ok');}
    else{TRACKS.push({id:id,title:'Pasted track',artist:'YouTube',custom:true});mpPlayIndex(TRACKS.length-1);toast('Added','Playing your link','ok');}
    $("#mp-link-input").value='';
  };
  var linkInput=$("#mp-link-input");if(linkInput)linkInput.addEventListener('keydown',function(e){if(e.key==='Enter')linkBtn.click();});
  mpRenderPanel();
}
function initYT(){
  if(MP.initialized||!MP.ytReady||!window.YT||!window.YT.Player)return;
  MP.initialized=true;
  try{MP.ytPlayer=new YT.Player('yt-player',{height:'1',width:'1',videoId:TRACKS[MP.index].id,playerVars:{autoplay:0,controls:0,disablekb:1,playsinline:1},events:{onReady:function(){mpRenderPanel();},onStateChange:function(ev){MP.playing=(ev.data===1);mpUpdateUI();}}});}catch(e){log('YT init',e);}
}
function mpPlayIndex(i){MP.index=(i+TRACKS.length)%TRACKS.length;if(!MP.ytPlayer){initYT();mpRenderPanel();return;}try{MP.ytPlayer.loadVideoById(TRACKS[MP.index].id);MP.playing=true;}catch(e){}mpRenderPanel();setTimeout(mpUpdateUI,300);}
function mpRenderPanel(){
  var box=$("#mp-tracks");if(!box)return;
  var t=TRACKS[MP.index];
  var titleEl=$("#mp-title");if(titleEl)titleEl.textContent=t.title;
  var artistEl=$("#mp-artist");if(artistEl)artistEl.textContent=t.artist;
  var playEl=$("#mp-play");if(playEl)playEl.innerHTML=MP.playing?SVG.pause:SVG.play;
  var prevEl=$("#mp-prev");if(prevEl)prevEl.innerHTML=SVG.prev;
  var nextEl=$("#mp-next");if(nextEl)nextEl.innerHTML=SVG.next;
  box.innerHTML=TRACKS.map(function(tr,i){
    return '<div class="mp-track '+(i===MP.index?'playing':'')+'" data-mptrack="'+i+'"><span class="mp-num">'+(i+1)+'</span>'+
      '<span class="mp-ttl">'+esc(tr.title)+'<small>'+esc(tr.artist)+'</small></span>'+
      (i===MP.index?'<span>🔊</span>':'')+
      (tr.custom?'<button class="mp-del" data-mpdel="'+i+'" title="Remove">×</button>':'')+'</div>';
  }).join('');
  $$('[data-mptrack]').forEach(function(b){b.onclick=function(e){if(e.target.closest('[data-mpdel]'))return;mpPlayIndex(parseInt(b.dataset.mptrack,10));};});
  $$('[data-mpdel]').forEach(function(b){b.onclick=function(e){e.stopPropagation();var i=parseInt(b.dataset.mpdel,10);if(i<0||i>=TRACKS.length)return;TRACKS.splice(i,1);if(MP.index>=TRACKS.length)MP.index=Math.max(0,TRACKS.length-1);mpRenderPanel();};});
  mpUpdateUI();
}
function mpUpdateUI(){
  var playEl=$("#mp-play");if(playEl)playEl.innerHTML=MP.playing?SVG.pause:SVG.play;
  var ball=$("#mp-ball");if(ball)ball.classList.toggle('playing',MP.playing);
}

  else{showAuth();}
  sb.auth.onAuthStateChange(async function(event,session){
    if(event==='SIGNED_IN'&&session&&(!ME||ME.id!==session.user.id)){SESSION=session;await boot();}
    if(event==='SIGNED_OUT'){showAuth();renderSavedAccounts();}
  });
})();
</script>
</body>
</html>
