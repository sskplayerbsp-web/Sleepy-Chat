<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Quazi Chat — Built for Gen-Z by Gen-Z</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3CradialGradient id='g'%3E%3Cstop offset='0%25' stop-color='%2300ffe0'/%3E%3Cstop offset='100%25' stop-color='%23b44aff'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='42' fill='url(%23g)'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--void:#0a0a0f;--surface:#12121a;--surface2:#1a1a26;--surface3:#22222f;--border:#2a2a3a;--border2:#3a3a4d;--accent:#00ffe0;--accent2:#00c9b4;--cyan:#00ffe0;--purple:#b44aff;--rose:#ff2d6f;--green:#00e676;--amber:#ffab00;--text:#e8e8f0;--text2:#8f8fa8;--text3:#5a5a72;--glow:0 0 14px rgba(0,255,224,.35);--ease:cubic-bezier(.22,.61,.36,1)}
[data-theme="purple"]{--accent:#b44aff;--accent2:#8a2dd6;--glow:0 0 14px rgba(180,74,255,.4)}
[data-theme="pink"]{--accent:#ff2d6f;--accent2:#d6005a;--glow:0 0 14px rgba(255,45,111,.4)}
[data-theme="green"]{--accent:#00e676;--accent2:#00b85c;--glow:0 0 14px rgba(0,230,118,.4)}
[data-theme="orange"]{--accent:#ff9500;--accent2:#d67a00;--glow:0 0 14px rgba(255,149,0,.4)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',system-ui,sans-serif;font-size:14px;background:var(--void);color:var(--text);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(900px 600px at 12% -10%,rgba(0,255,224,.06),transparent 60%),radial-gradient(900px 700px at 95% 110%,rgba(180,74,255,.07),transparent 60%)}
button,input,textarea,select{font:inherit;color:inherit;outline:none;border:none;background:none}
button{cursor:pointer;touch-action:manipulation}
a{color:var(--accent);text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#2c2c3d;border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:#40405a}
.hidden{display:none!important}
h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:8px;font-weight:600;font-size:13px;background:var(--surface2);color:var(--text);border:1px solid var(--border);transition:all .18s var(--ease);white-space:nowrap}
.btn:hover{background:var(--surface3);border-color:var(--border2);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04120f;border-color:transparent;font-weight:700}
.btn.primary:hover{box-shadow:var(--glow)}
.btn.danger{background:rgba(255,45,111,.12);color:#ff7aa2;border-color:rgba(255,45,111,.35)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text2)}
.btn.ghost:hover{background:var(--surface2);color:var(--text)}
.btn.sm{padding:6px 11px;font-size:12px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3)}
.field input,.field textarea,.field select{width:100%;padding:11px 13px;border-radius:8px;background:var(--void);border:1px solid var(--border);color:var(--text);transition:border-color .18s,box-shadow .18s}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,255,224,.12)}
.field textarea{resize:vertical;min-height:80px;font-family:inherit}
.field select{appearance:none;cursor:pointer}
.field .hint{font-size:11px;color:var(--text3)}
.field .hint.ok{color:var(--green)}
.field .hint.err{color:var(--rose)}
.err,.ok{font-size:12.5px;border-radius:8px;transition:all .2s;min-height:0}
.err:not(:empty){padding:10px 13px;background:rgba(255,45,111,.12);border:1px solid rgba(255,45,111,.35);color:#ff8aa8;font-weight:500;margin-top:12px}
.ok:not(:empty){padding:10px 13px;background:rgba(0,230,118,.1);border:1px solid rgba(0,230,118,.3);color:#8affb8;font-weight:500;margin-top:12px}
.avatar{border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;color:#06120f;overflow:hidden;position:relative;user-select:none}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.status-dot{width:11px;height:11px;border-radius:50%;border:2.5px solid var(--surface);position:absolute;right:-1px;bottom:-1px}
.s-online{background:var(--green);box-shadow:0 0 8px rgba(0,230,118,.7)}
.s-idle{background:var(--amber)}.s-dnd{background:var(--rose)}.s-offline{background:#4a4a5e}
.pill-owner{background:rgba(255,171,0,.15);color:var(--amber);font-size:9px;padding:1px 6px;border-radius:99px;text-transform:uppercase;font-weight:700;letter-spacing:.05em;margin-left:5px}

/* ===== AUTH SCREEN ===== */
.auth-screen{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;overflow-y:auto;background:radial-gradient(700px 500px at 20% 10%,rgba(0,255,224,.1),transparent 60%),radial-gradient(700px 500px at 85% 90%,rgba(180,74,255,.13),transparent 60%),var(--void)}
.stars{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.stars::before,.stars::after{content:'';position:absolute;inset:0;background-image:radial-gradient(1.5px 1.5px at 10% 20%,rgba(255,255,255,.8),transparent),radial-gradient(1px 1px at 30% 60%,rgba(0,255,224,.6),transparent),radial-gradient(1.5px 1.5px at 50% 30%,rgba(255,255,255,.7),transparent),radial-gradient(1px 1px at 70% 80%,rgba(180,74,255,.6),transparent),radial-gradient(1.5px 1.5px at 90% 40%,rgba(255,255,255,.8),transparent),radial-gradient(1px 1px at 15% 85%,rgba(0,255,224,.5),transparent),radial-gradient(1.5px 1.5px at 45% 90%,rgba(255,255,255,.6),transparent),radial-gradient(1px 1px at 80% 15%,rgba(180,74,255,.7),transparent);background-size:100% 100%;animation:starTwinkle 4s ease-in-out infinite alternate}
.stars::after{animation-delay:-2s;background-image:radial-gradient(1px 1px at 25% 40%,rgba(255,255,255,.5),transparent),radial-gradient(1.5px 1.5px at 55% 55%,rgba(0,255,224,.6),transparent),radial-gradient(1px 1px at 75% 25%,rgba(255,255,255,.7),transparent),radial-gradient(1.5px 1.5px at 95% 70%,rgba(180,74,255,.5),transparent),radial-gradient(1px 1px at 5% 50%,rgba(255,255,255,.6),transparent),radial-gradient(1.5px 1.5px at 35% 10%,rgba(0,255,224,.7),transparent)}
@keyframes starTwinkle{0%{opacity:.35}100%{opacity:1}}
.auth-card{position:relative;z-index:1;width:100%;max-width:440px;background:rgba(18,18,26,.92);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:20px;padding:36px 30px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.brand{text-align:center;margin-bottom:26px}
.brand-mark{width:76px;height:76px;margin:0 auto 16px;border-radius:24px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(0,255,224,.16),rgba(180,74,255,.16));border:1px solid rgba(0,255,224,.3);animation:markPulse 3s ease-in-out infinite}
.brand-mark svg{width:44px;height:44px}
@keyframes markPulse{0%,100%{box-shadow:0 0 20px rgba(0,255,224,.35)}50%{box-shadow:0 0 40px rgba(0,255,224,.6),0 0 70px rgba(180,74,255,.45)}}
.brand h1{font-size:30px;letter-spacing:.05em;font-weight:800}
.brand h1 span{color:var(--accent);text-shadow:0 0 22px rgba(0,255,224,.6)}
.tagline{display:flex;flex-wrap:wrap;justify-content:center;gap:1px;font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;margin-top:14px;perspective:600px;line-height:1.6}
.tagline .tchar{display:inline-block;background:linear-gradient(135deg,#00ffe0,#b44aff,#ff2d6f,#00ffe0,#b44aff);background-size:400% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:charPop .7s cubic-bezier(.34,1.56,.64,1) both,gradientShift 4s linear infinite;animation-delay:calc(var(--i) * 35ms),0s;text-shadow:0 0 20px rgba(0,255,224,.3)}
.tagline .tspace{display:inline-block;width:7px}
@keyframes charPop{0%{opacity:0;transform:translateY(16px) scale(.3) rotate(-15deg)}60%{opacity:1;transform:translateY(-3px) scale(1.18) rotate(3deg)}100%{opacity:1;transform:none}}
@keyframes gradientShift{0%{background-position:0% 50%}100%{background-position:400% 50%}}
.tabs{display:flex;gap:4px;background:var(--void);padding:4px;border-radius:10px;margin-bottom:22px;border:1px solid var(--border)}
.tab{flex:1;padding:10px;border-radius:7px;font-size:13px;font-weight:600;color:var(--text3);transition:all .2s}
.tab.active{background:var(--surface2);color:var(--accent);box-shadow:inset 0 0 0 1px rgba(0,255,224,.22)}
.divider{display:flex;align-items:center;gap:12px;color:var(--text3);font-size:10.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;margin:18px 0}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.google-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px;border-radius:8px;background:#fff;color:#1f1f1f;font-weight:600;font-size:13.5px;border:1px solid #ddd;transition:all .18s}
.google-btn:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(255,255,255,.15)}
.google-btn svg{width:18px;height:18px}

/* ===== APP ===== */
.app{position:relative;z-index:1;display:grid;grid-template-columns:74px 260px 1fr 240px;height:100vh;height:100dvh}
.app.hide-members{grid-template-columns:74px 260px 1fr}
.app>*{min-height:0;min-width:0}
.rail{background:linear-gradient(180deg,#0c0c13,#0a0a0f);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0;overflow-y:auto;overflow-x:hidden}
.rail-sep{width:34px;height:1px;background:var(--border);flex:none;margin:3px 0}
.rail-btn{position:relative;width:48px;height:48px;flex:none;border-radius:16px;display:flex;align-items:center;justify-content:center;background:var(--surface);color:var(--accent);transition:all .22s var(--ease);overflow:hidden;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px}
.rail-btn:hover{border-radius:14px;box-shadow:var(--glow);transform:translateY(-2px)}
.rail-btn.active{border-radius:14px;box-shadow:var(--glow)}
.rail-btn.active::before{content:'';position:absolute;left:-10px;top:50%;transform:translateY(-50%);width:4px;height:26px;border-radius:0 4px 4px 0;background:var(--accent);box-shadow:var(--glow)}
.rail-btn img{width:100%;height:100%;object-fit:cover}
.rail-btn svg{width:22px;height:22px}
.rail-btn.dashed{background:transparent;border:1.5px dashed rgba(0,255,224,.35)}
.rail-btn.dashed:hover{border-style:solid;background:rgba(0,255,224,.1)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--rose);color:#fff;font-size:10px;font-weight:700}
.panel{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column}
.panel-head{height:50px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--border);font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;cursor:pointer}
.panel-head:hover{background:var(--surface2)}
.panel-head .ttl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel-body{flex:1;min-height:0;overflow-y:auto;padding:10px 8px 14px}
.panel-section{margin-bottom:16px}
.panel-label{padding:6px 8px;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);display:flex;align-items:center;gap:6px}
.panel-label .add{margin-left:auto;opacity:0;transition:opacity .15s;cursor:pointer;width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--text3)}
.panel-label:hover .add{opacity:1}
.panel-label .add:hover{background:rgba(255,255,255,.07);color:var(--accent)}
.row{position:relative;display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:8px;cursor:pointer;color:var(--text2);font-size:13.5px;font-weight:500;transition:background .14s,color .14s;width:100%;text-align:left}
.row:hover{background:rgba(255,255,255,.045);color:var(--text)}
.row.active{background:var(--surface2);color:#fff}
.row.active::before{content:'';position:absolute;left:-8px;top:50%;transform:translateY(-50%);width:3px;height:60%;border-radius:0 3px 3px 0;background:var(--accent);box-shadow:var(--glow)}
.row .txt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{font-size:11px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.row svg{width:16px;height:16px;flex:none;opacity:.75}
.user-bar{flex:none;height:60px;display:flex;align-items:center;gap:9px;padding:0 10px;background:rgba(10,10,15,.55);border-top:1px solid var(--border)}
.user-bar .info{flex:1;min-width:0;cursor:pointer;border-radius:6px;padding:3px 5px;transition:background .15s}
.user-bar .info:hover{background:rgba(255,255,255,.05)}
.user-bar .nm{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-bar .uid{font-size:10.5px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-bar .ctl{width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:all .15s}
.user-bar .ctl:hover{background:rgba(255,255,255,.07);color:var(--accent)}
.user-bar .ctl svg{width:16px;height:16px}
.chat{display:flex;flex-direction:column;background:var(--void);position:relative}
.chat-head{height:50px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--border);background:rgba(10,10,15,.7);backdrop-filter:blur(12px)}
.chat-head .title{display:flex;align-items:center;gap:8px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;min-width:0}
.chat-head .title svg{width:18px;height:18px;flex:none;opacity:.75}
.chat-head .title .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-head .topic{font-size:12px;color:var(--text3);border-left:1px solid var(--border);padding-left:10px;margin-left:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-head .spacer{flex:1}
.chat-head .hbtn{width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:all .15s}
.chat-head .hbtn:hover{background:var(--surface2);color:var(--accent)}
.chat-head .hbtn svg{width:17px;height:17px}
.chat-body{flex:1;min-height:0;overflow-y:auto;padding:16px 0 8px}
.empty{padding:40px 20px;text-align:center;color:var(--text3);font-size:13px}
.empty .big{width:64px;height:64px;margin:0 auto 12px;border-radius:20px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(0,255,224,.14),rgba(180,74,255,.14));border:1px solid rgba(0,255,224,.22)}
.empty .big svg{width:30px;height:30px;color:var(--accent)}
.empty h2{font-size:20px;color:var(--text);margin-bottom:6px;font-family:'Space Grotesk'}
.msg{position:relative;display:flex;gap:13px;padding:4px 20px;transition:background .12s}
.msg:hover{background:rgba(255,255,255,.022)}
.msg .body{flex:1;min-width:0}
.msg .head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.msg .author{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;cursor:pointer}
.msg .author:hover{text-decoration:underline}
.msg .uid{font-size:10.5px;color:var(--text3);background:rgba(0,255,224,.07);padding:1px 6px;border-radius:5px;font-family:ui-monospace,monospace}
.msg .time{font-size:10.5px;color:var(--text3);font-family:ui-monospace,monospace}
.msg .edited{font-size:10px;color:var(--text3)}
.msg .content{font-size:14px;color:#dcdce8;word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap;margin-top:1px}
.msg.deleted .content{color:var(--text3);font-style:italic}
.msg .toolbar{position:absolute;top:-12px;right:22px;display:none;align-items:center;gap:1px;background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:2px;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:5}
.msg:hover .toolbar{display:flex}
.msg .toolbar button{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:all .13s}
.msg .toolbar button:hover{background:rgba(0,255,224,.12);color:var(--accent)}
.msg .toolbar button.danger:hover{background:rgba(255,45,111,.15);color:#ff7aa2}
.msg .toolbar svg{width:15px;height:15px}
.day-sep{display:flex;align-items:center;gap:12px;padding:14px 20px 8px;color:var(--text3);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.day-sep::before,.day-sep::after{content:'';flex:1;height:1px;background:var(--border)}
.typing-bar{flex:none;height:22px;padding:0 20px;font-size:12px;color:var(--text3);display:flex;align-items:center;gap:7px}
.dots{display:inline-flex;gap:3px}
.dots i{width:4px;height:4px;border-radius:50%;background:var(--accent);display:block;animation:tdot 1.3s infinite}
.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}
@keyframes tdot{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-3px);opacity:1}}
.composer-wrap{flex:none;padding:0 20px 18px;position:relative}
.composer{display:flex;align-items:flex-end;gap:6px;padding:9px 11px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;transition:border-color .2s,box-shadow .2s}
.composer:focus-within{border-color:rgba(0,255,224,.4);box-shadow:0 0 0 3px rgba(0,255,224,.07)}
.composer textarea{flex:1;resize:none;max-height:190px;min-height:22px;font-size:14px;line-height:1.5;padding:3px 0;background:none}
.composer textarea::placeholder{color:var(--text3)}
.composer .cbtn{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--text3);transition:all .15s;flex:none;font-size:17px}
.composer .cbtn:hover{background:rgba(255,255,255,.07);color:var(--accent)}
.composer .cbtn svg{width:17px;height:17px}
.composer .send{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04120f;border-radius:8px;width:32px;height:32px}
.composer .send:hover{box-shadow:var(--glow);color:#04120f}
.emoji-picker{position:absolute;bottom:64px;right:12px;width:320px;max-height:260px;overflow-y:auto;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:8px;display:grid;grid-template-columns:repeat(8,1fr);gap:2px;box-shadow:0 20px 50px rgba(0,0,0,.7);z-index:10;animation:mIn .18s var(--ease) both}
.emoji-picker button{width:100%;aspect-ratio:1;border-radius:6px;font-size:20px;display:flex;align-items:center;justify-content:center;transition:all .1s;line-height:1}
.emoji-picker button:hover{background:var(--surface3);transform:scale(1.12)}
.members{background:var(--surface);border-left:1px solid var(--border);overflow-y:auto;padding:14px 10px}
.app.hide-members .members{display:none}
.mgroup{margin-bottom:18px}
.mgroup .glabel{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);padding:0 8px 7px}
.member{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;cursor:pointer;transition:background .14s}
.member:hover{background:rgba(255,255,255,.05)}
.member.offline{opacity:.5}
.member .nm{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.member .uid{font-size:11px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.overlay{position:fixed;inset:0;z-index:300;background:rgba(4,4,8,.75);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.modal{width:100%;max-width:520px;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:0 30px 90px rgba(0,0,0,.7);max-height:88vh;display:flex;flex-direction:column;animation:mIn .26s var(--ease) both}
.modal.wide{max-width:640px}
@keyframes mIn{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}
.modal-head{flex:none;display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:17px}
.modal-body{padding:22px;overflow-y:auto;flex:1}
.modal-foot{flex:none;display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--border);background:rgba(0,0,0,.15)}
.xbtn{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text3);transition:all .15s}
.xbtn:hover{background:var(--surface2);color:var(--text)}
.xbtn svg{width:18px;height:18px}
.menu{position:fixed;z-index:350;min-width:200px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:5px;box-shadow:0 20px 55px rgba(0,0,0,.7);animation:mIn .15s var(--ease) both}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:7px;font-size:13px;color:var(--text2);text-align:left;transition:all .12s}
.menu button:hover{background:rgba(255,255,255,.06);color:var(--text)}
.menu button.danger{color:#ff7aa2}
.menu button.danger:hover{background:rgba(255,45,111,.14)}
.menu .msep{height:1px;background:var(--border);margin:4px 2px}
.menu .mhead{padding:8px 10px 6px;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3)}
.menu svg{width:15px;height:15px;flex:none;opacity:.85}
#toasts{position:fixed;top:20px;right:20px;z-index:500;display:flex;flex-direction:column;gap:9px;pointer-events:none}
.toast{pointer-events:auto;min-width:230px;max-width:340px;padding:12px 15px;background:rgba(26,26,38,.97);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:10px;font-size:13px;box-shadow:0 14px 40px rgba(0,0,0,.6);animation:tInTop .3s var(--ease) both;backdrop-filter:blur(12px)}
@keyframes tInTop{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
.toast.err{border-left-color:var(--rose)}
.toast.ok{border-left-color:var(--green)}
.toast .tt{font-weight:700;font-size:12.5px;margin-bottom:2px}
.toast .tb{color:var(--text2);font-size:12.5px}
.mobile-only{display:none}

/* ===== MUSIC PLAYER ===== */
.music-player{position:fixed;bottom:20px;right:20px;z-index:380;font-family:'Inter',sans-serif}
.mp-collapsed{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--purple));color:#04120f;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 10px 30px rgba(0,255,224,.4);transition:all .2s;animation:mpPulse 2.4s ease-in-out infinite}
.mp-collapsed:hover{transform:scale(1.08)}
@keyframes mpPulse{0%,100%{box-shadow:0 10px 30px rgba(0,255,224,.4)}50%{box-shadow:0 10px 40px rgba(0,255,224,.75),0 0 60px rgba(180,74,255,.45)}}
.mp-expanded{width:340px;background:rgba(18,18,26,.98);border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:0 20px 60px rgba(0,0,0,.7);backdrop-filter:blur(20px);animation:mIn .2s var(--ease) both}
.mp-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.mp-art{width:56px;height:56px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--purple));display:flex;align-items:center;justify-content:center;font-size:24px;flex:none;overflow:hidden;background-size:cover;background-position:center}
.mp-info{flex:1;min-width:0}
.mp-title{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-artist{font-size:12px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-controls{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:12px}
.mp-controls button{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:all .15s}
.mp-controls button:hover{background:var(--surface2);color:var(--accent)}
.mp-controls button svg{width:18px;height:18px}
.mp-controls .mp-play{width:46px;height:46px;background:linear-gradient(135deg,var(--accent),var(--purple));color:#04120f}
.mp-controls .mp-play:hover{transform:scale(1.06);box-shadow:0 0 20px rgba(0,255,224,.5)}
.mp-controls .mp-play svg{width:22px;height:22px}
.mp-actions{display:flex;gap:6px;padding-top:12px;border-top:1px solid var(--border);flex-wrap:wrap}
.mp-actions button{flex:1;min-width:0;padding:7px 8px;border-radius:7px;font-size:11.5px;font-weight:600;background:var(--surface2);color:var(--text2);transition:all .15s;display:flex;align-items:center;justify-content:center;gap:5px}
.mp-actions button:hover{background:var(--surface3);color:var(--accent)}
.mp-actions button.spotify{background:rgba(30,215,96,.12);color:#1ed760}
.mp-actions button.spotify:hover{background:rgba(30,215,96,.2)}
.mp-tracks{max-height:220px;overflow-y:auto;margin-top:8px;border-top:1px solid var(--border);padding-top:8px}
.mp-track{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:7px;cursor:pointer;font-size:12.5px;transition:background .12s}
.mp-track:hover{background:rgba(255,255,255,.05)}
.mp-track.playing{background:rgba(0,255,224,.08);color:var(--accent)}
.mp-track .mp-num{width:16px;color:var(--text3);font-size:11px;font-variant-numeric:tabular-nums;text-align:center;flex:none}
.mp-track .mp-ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mp-track .mp-ttl small{color:var(--text3);display:block;font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mp-hidden{position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0;pointer-events:none}

/* ===== INSTALL BANNER ===== */
.install-banner{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:450;background:rgba(18,18,26,.98);border:1px solid var(--border);border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.7);backdrop-filter:blur(20px);animation:mIn .3s var(--ease) both;max-width:calc(100vw - 40px)}
.install-banner .ib-icon{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--purple));display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.install-banner .ib-text{flex:1;min-width:0}
.install-banner .ib-title{font-weight:700;font-size:13px}
.install-banner .ib-sub{font-size:11.5px;color:var(--text3)}

var audioCtx = null;
function beep(freq, dur, vol){
  if(!SOUND_ON)return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    var o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='sine'; o.frequency.value=freq;
    g.gain.value=vol||0.05;
    o.connect(g); g.connect(audioCtx.destination);
    var t=audioCtx.currentTime;
    g.gain.setValueAtTime(g.gain.value,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.start(t); o.stop(t+dur);
  }catch(e){}
}
function sfxSend(){ beep(880,0.08,0.04); setTimeout(function(){beep(1200,0.06,0.03);},70); }
function sfxRecv(){ beep(660,0.1,0.04); }

/* ===== TAGLINE ANIMATION ===== */
function buildTagline(){
  var wrap = $("#tagline");
  if(!wrap) return;
  var words = ["BUILT","FOR","GEN-Z","BY","GEN-Z"];
  var html = "";
  var idx = 0;
  words.forEach(function(w, wi){
    for(var i=0;i<w.length;i++){
      html += '<span class="tchar" style="--i:'+(idx++)+'">'+w[i]+'</span>';
    }
    if(wi < words.length-1){
      html += '<span class="tspace"></span>';
    }
  });
  wrap.innerHTML = html;
}

  var p=PROFILES[uid]; var s=(p&&p.status)||'online';
  return '<span class="status-dot s-'+s+'"></span>';

function timeLabel(ts){return new Date(ts).toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});}
function dayLabel(d){
  var t=new Date(),y=new Date();y.setDate(t.getDate()-1);
  if(d.toDateString()===t.toDateString())return "Today";
  if(d.toDateString()===y.toDateString())return "Yesterday";
  return d.toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'});
}

/* ===== TOAST / MODAL / MENU ===== */
function toast(title,body,kind){
  var el=document.createElement("div");
  el.className="toast "+(kind||"");
  el.innerHTML='<div class="tt">'+esc(title)+'</div>'+(body?'<div class="tb">'+esc(body)+'</div>':'');
  $("#toasts").appendChild(el);
  setTimeout(function(){el.style.transition="opacity .25s, transform .25s";el.style.opacity="0";el.style.transform="translateX(60px)";setTimeout(function(){el.remove();},260);},3600);
}
function closeModal(){$("#modal-root").innerHTML="";$("#modal-root").onclick=null;}
function openModal(title,body,opts){
  opts=opts||{};
  var root=$("#modal-root");
  root.innerHTML='<div class="overlay" id="modal-overlay"><div class="modal '+(opts.wide?"wide":"")+'">'+
    '<div class="modal-head"><h3>'+esc(title)+'</h3><button class="xbtn" id="modal-x" type="button">'+SVG.x+'</button></div>'+
    '<div class="modal-body" id="modal-body">'+body+'</div>'+

    '</div></div>';

  $("#modal-overlay").addEventListener("mousedown",function(e){if(e.target.id==="modal-overlay")closeModal();});
  if(opts.onMount)opts.onMount();

function confirmModal(title,msg,onYes,danger){

    footer:'<button class="btn" id="cf-no" type="button">Cancel</button><button class="btn '+(danger?"danger":"primary")+'" id="cf-yes" type="button">Confirm</button>',
    onMount:function(){$("#cf-no").onclick=closeModal;$("#cf-yes").onclick=function(){closeModal();onYes();};}

function closeMenu(){$$(".menu").forEach(function(n){n.remove();});}
function openMenu(x,y,items){
  closeMenu();
  var m=document.createElement("div");m.className="menu";
  m.innerHTML=items.map(function(it){
    if(it.sep)return '<div class="msep"></div>';
    if(it.head)return '<div class="mhead">'+esc(it.head)+'</div>';
    return '<button type="button" class="'+(it.danger?"danger":"")+'" data-mi="'+esc(it.id)+'">'+(it.icon||"")+'<span>'+esc(it.label)+'</span></button>';
  }).join("");
  document.body.appendChild(m);
  var w=m.offsetWidth,h=m.offsetHeight;
  m.style.left=Math.max(8,Math.min(x,window.innerWidth-w-10))+"px";
  m.style.top=Math.max(8,Math.min(y,window.innerHeight-h-10))+"px";
  m.addEventListener("click",function(e){
    var b=e.target.closest("[data-mi]");if(!b)return;
    var item=items.filter(function(i){return i.id===b.dataset.mi;})[0];
    closeMenu();if(item&&item.onClick)item.onClick();
  });
  setTimeout(function(){
    function outside(ev){if(!m.contains(ev.target)){closeMenu();document.removeEventListener("mousedown",outside,true);}}
    document.addEventListener("mousedown",outside,true);
  },0);
}

var MP = {idx:0, playing:false, expanded:false, player:null, ready:false, pendingVideo:null};

function ytEnsure(){
  if(window.YT && window.YT.Player){ MP.ready=true; }
}
window.onYouTubeIframeAPIReady = function(){
  MP.ready = true;
  if(MP.pendingVideo){ mpPlayVideo(MP.pendingVideo); MP.pendingVideo=null; }
};

function mpPlayVideo(videoId){
  if(!MP.ready || !window.YT){
    MP.pendingVideo = videoId;
    return;
  }
  if(MP.player && MP.player.loadVideoById){
    MP.player.loadVideoById(videoId);
    MP.playing = true;
    mpUpdateUI();
    return;
  }
  MP.player = new YT.Player('yt-audio', {
    height:'1', width:'1', videoId:videoId,
    playerVars:{autoplay:1, controls:0, playsinline:1},
    events:{
      onStateChange:function(e){
        if(e.data===YT.PlayerState.PLAYING){MP.playing=true;}
        else if(e.data===YT.PlayerState.PAUSED||e.data===YT.PlayerState.ENDED){
          MP.playing=false;
          if(e.data===YT.PlayerState.ENDED) mpNext();
        }
        mpUpdateUI();
      },
      onError:function(e){
        toast("Can't play","YouTube blocked this track. Try another.","err");
        MP.playing=false; mpUpdateUI();
      }
    }
  });
  MP.playing = true;
  mpUpdateUI();
}

function mpPlay(){
  var t = TRACKS[MP.idx]; if(!t) return;
  mpPlayVideo(t.yt);
}
function mpToggle(){
  if(!MP.player){ mpPlay(); return; }
  if(MP.playing){ MP.player.pauseVideo(); MP.playing=false; }
  else { MP.player.playVideo(); MP.playing=true; }
  mpUpdateUI();
}
function mpNext(){ MP.idx=(MP.idx+1)%TRACKS.length; mpPlay(); }
function mpPrev(){ MP.idx=(MP.idx-1+TRACKS.length)%TRACKS.length; mpPlay(); }
function mpPlayIdx(i){ MP.idx=i; mpPlay(); }

function mpUpdateUI(){
  var t = TRACKS[MP.idx] || {title:"No track", artist:""};
  var slot = $("#mp-expanded");
  if(!slot) return;
  var art = $("#mp-art");
  if(art && t.yt){
    art.style.background = "url(https://img.youtube.com/vi/"+t.yt+"/mqdefault.jpg) center/cover";
    art.innerHTML = "";

  var ar = $("#mp-artist"); if(ar) ar.textContent = t.artist;
  var btn = $("#mp-play-btn");
  if(btn) btn.innerHTML = MP.playing ? SVG.pause : SVG.play;
  var list = $("#mp-tracks");
  if(list){
    list.innerHTML = TRACKS.map(function(tr,i){
      return '<div class="mp-track '+(i===MP.idx?'playing':'')+'" data-mp-idx="'+i+'">'+
        '<span class="mp-num">'+(i===MP.idx?(MP.playing?'▶':'⏸'):(i+1))+'</span>'+
        '<span class="mp-ttl">'+esc(tr.title)+'<small>'+esc(tr.artist)+'</small></span></div>';
    }).join("");
  }
}

/* ===== AUTH ===== */
async function doSignup(email,password,username,display){
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))throw new Error("Enter a valid email address.");
  username=String(username||"").trim().toLowerCase();
  if(!/^[a-z0-9_]{3,24}$/.test(username))throw new Error("Username must be 3-24 chars: a-z, 0-9, underscore.");
  if(!password||password.length<6)throw new Error("Password must be at least 6 characters.");
  var ex=await sb.from('profiles').select('id').eq('username',username).maybeSingle();
  if(ex.data)throw new Error("That username is already taken.");
  var { data, error } = await sb.auth.signUp({email:email,password:password,options:{data:{username:username,display_name:display||username}}});
  if(error)throw error;
  return data;
}
async function doLogin(email,password){
  var { data, error } = await sb.auth.signInWithPassword({email:email,password:password});
  if(error)throw error;
  return data;
}
async function doGoogleLogin(){
  var { error } = await sb.auth.signInWithOAuth({
    provider:'google',
    options:{ redirectTo: window.location.origin + window.location.pathname }
  });
  if(error)throw error;
}
async function doLogout(){
  try{await sb.auth.signOut();}catch(e){}

  globalMsgCh=presenceCh=friendsCh=typingCh=serversCh=channelsCh=null;

}

/* ===== PROFILES ===== */
async function loadMe(){
  for(var attempt=0;attempt<10;attempt++){
    var { data, error } = await sb.from('profiles').select('*').eq('id', SESSION.user.id).maybeSingle();
    if(error){log("loadMe",error);return;}
    if(data){ME=data;PROFILES[ME.id]=ME;return;}
    // Profile missing - auto-create (works for Google OAuth)
    if(attempt===0){
      var meta = SESSION.user.user_metadata || {};
      var rawName = meta.username || meta.preferred_username || meta.user_name || (SESSION.user.email||'user').split('@')[0];
      var base = String(rawName).toLowerCase().replace(/[^a-z0-9_]/g,'').slice(0,18) || 'user';
      var candidate = base, n = 1;
      while(true){
        var { data: exists } = await sb.from('profiles').select('id').eq('username',candidate).maybeSingle();
        if(!exists) break;
        candidate = base + n; n++;
        if(n>50) { candidate = base + Math.floor(Math.random()*10000); break; }
      }
      var insert = { id: SESSION.user.id, username: candidate, display_name: meta.full_name || meta.name || candidate };
      var { data: created, error: ce } = await sb.from('profiles').insert(insert).select().single();
      if(!ce && created){ ME=created; PROFILES[ME.id]=ME; return; }
      log("auto-create profile failed", ce);
    }
    await new Promise(function(r){setTimeout(r,400);});
  }
}
async function fetchProfiles(ids){
  var missing=(ids||[]).filter(function(id){return id&&!PROFILES[id];});
  if(!missing.length)return;
  var { data } = await sb.from('profiles').select('*').in('id', missing);
  (data||[]).forEach(function(p){PROFILES[p.id]=p;});
}
async function searchUsers(q){
  q=String(q||"").trim().replace(/^@/,'');
  if(!q)return[];
  var { data } = await sb.from('profiles').select('*').or('username.ilike.%'+q+'%,display_name.ilike.%'+q+'%').limit(20);
  (data||[]).forEach(function(p){PROFILES[p.id]=p;});
  return data||[];
}
async function updateProfile(patch){
  var { error } = await sb.from('profiles').update(patch).eq('id', ME.id);
  if(error)throw error;
  Object.keys(patch).forEach(function(k){ME[k]=patch[k];});
  PROFILES[ME.id]=ME;
  renderUserBar();renderPanel();renderMembers();
}

/* ===== FRIENDS ===== */
async function loadFriends(){
  if(!ME)return;
  var { data } = await sb.from('friendships').select('*').or('user_id.eq.'+ME.id+',friend_id.eq.'+ME.id);
  FRIENDS={accepted:[],incoming:[],outgoing:[]};
  for(var i=0;i<(data||[]).length;i++){
    var f=data[i];
    var other=(f.user_id===ME.id)?f.friend_id:f.user_id;
    if(f.status==='accepted')FRIENDS.accepted.push({id:f.id,other:other});
    else if(f.status==='pending'&&f.requested_by!==ME.id)FRIENDS.incoming.push({id:f.id,other:other});
    else if(f.status==='pending'&&f.requested_by===ME.id)FRIENDS.outgoing.push({id:f.id,other:other});
  }
  var ids=[];
  FRIENDS.accepted.concat(FRIENDS.incoming,FRIENDS.outgoing).forEach(function(f){ids.push(f.other);});
  await fetchProfiles(ids);
}
async function sendFriendRequest(username){
  var clean=String(username||"").trim().replace(/^@/,'').toLowerCase();
  if(!clean)throw new Error("Type a username first.");
  var { data: target } = await sb.from('profiles').select('*').eq('username',clean).maybeSingle();
  if(!target)throw new Error("No user found with @"+clean);
  if(target.id===ME.id)throw new Error("You cannot add yourself.");
  var existing=[].concat(FRIENDS.accepted,FRIENDS.incoming,FRIENDS.outgoing).filter(function(f){return f.other===target.id;});
  if(existing.length)throw new Error("Already friends or request pending.");
  var { error } = await sb.from('friendships').insert({user_id:ME.id,friend_id:target.id,status:'pending',requested_by:ME.id});
  if(error)throw error;
  PROFILES[target.id]=target;
  await loadFriends();
}
async function acceptFriend(id){var {error}=await sb.from('friendships').update({status:'accepted'}).eq('id',id);if(error)throw error;await loadFriends();}
async function removeFriendship(id){var {error}=await sb.from('friendships').delete().eq('id',id);if(error)throw error;await loadFriends();}

async function loadServers(){
  if(!ME)return;
  var { data: sm } = await sb.from('server_members').select('server_id').eq('user_id', ME.id);
  var ids=(sm||[]).map(function(x){return x.server_id;});
  if(!ids.length){SERVERS=[];return;}
  var { data: srv } = await sb.from('servers').select('*').in('id', ids);
  SERVERS=srv||[];
}
async function loadServerMembers(serverId,force){
  var c=SERVER_MEMBERS[serverId];
  if(!force && c && Date.now()-c.ts<60000)return c.ids;
  var { data } = await sb.from('server_members').select('user_id').eq('server_id', serverId);
  var ids=(data||[]).map(function(x){return x.user_id;});
  await fetchProfiles(ids);
  SERVER_MEMBERS[serverId]={ids:ids,ts:Date.now()};
  return ids;
}
async function loadChannels(serverId){
  var { data } = await sb.from('channels').select('*').eq('server_id', serverId).order('position',{ascending:true});
  CHANNELS=data||[];
}
async function createServer(name){
  if(!name||!name.trim())throw new Error("Give your community a name.");
  var { data: srv, error } = await sb.from('servers').insert({name:name.trim(),owner_id:ME.id}).select().single();
  if(error)throw error;
  var { error: e2 } = await sb.from('server_members').insert({server_id:srv.id,user_id:ME.id});
  if(e2)throw e2;
  await sb.from('channels').insert([
    {server_id:srv.id,name:"general",type:"text",category:"Text Channels",topic:"General chat",position:0},

async function inviteToServer(serverId, username){

/* ===== CONVERSATIONS ===== */
async function loadConversations(){
  if(!ME)return;
  var { data: cms } = await sb.from('conversation_members').select('conversation_id').eq('user_id', ME.id);
  var ids=(cms||[]).map(function(c){return c.conversation_id;});
  if(!ids.length){CONVERSATIONS=[];return;}
  var { data: convs } = await sb.from('conversations').select('*').in('id', ids);
  var list=convs||[];
  if(!list.length){CONVERSATIONS=[];return;}
  var { data: allMembers } = await sb.from('conversation_members').select('conversation_id,user_id').in('conversation_id', ids);
  var byConv={};
  (allMembers||[]).forEach(function(m){(byConv[m.conversation_id]=byConv[m.conversation_id]||[]).push(m.user_id);});
  var allIds=[];
  Object.keys(byConv).forEach(function(k){allIds=allIds.concat(byConv[k]);});
  await fetchProfiles(allIds);
  await Promise.all(list.map(async function(c){
    c.memberIds=byConv[c.id]||[];
    var { data: last } = await sb.from('messages').select('*').eq('conversation_id', c.id).order('id',{ascending:false}).limit(1);
    c.lastMessage=(last&&last[0])||null;
  }));
  list.sort(function(a,b){
    var ta=a.lastMessage?new Date(a.lastMessage.created_at).getTime():new Date(a.created_at).getTime();
    var tb=b.lastMessage?new Date(b.lastMessage.created_at).getTime():new Date(b.created_at).getTime();
    return tb-ta;
  });
  CONVERSATIONS=list;
}
async function getOrCreateDM(otherId){
  var { data: myCms } = await sb.from('conversation_members').select('conversation_id').eq('user_id', ME.id);
  var myIds=(myCms||[]).map(function(c){return c.conversation_id;});
  if(myIds.length){
    var { data: theirCms } = await sb.from('conversation_members').select('conversation_id').eq('user_id', otherId).in('conversation_id', myIds);
    for(var i=0;i<(theirCms||[]).length;i++){
      var cid=theirCms[i].conversation_id;
      var { data: conv } = await sb.from('conversations').select('*').eq('id', cid).maybeSingle();
      if(!conv||conv.is_group)continue;
      var { count } = await sb.from('conversation_members').select('*',{count:'exact',head:true}).eq('conversation_id', cid);
      if(count===2)return conv;
    }
  }
  var { data: conv2, error: e1 } = await sb.from('conversations').insert({is_group:false,created_by:ME.id}).select().single();
  if(e1)throw e1;
  var { error: e2 } = await sb.from('conversation_members').insert([
    {conversation_id:conv2.id,user_id:ME.id},
    {conversation_id:conv2.id,user_id:otherId}
  ]);
  if(e2)throw e2;
  return conv2;
}
async function createGroupDM(name, memberIds){
  var ids=[ME.id].concat(memberIds).filter(function(v,i,a){return a.indexOf(v)===i;});
  if(ids.length<3)throw new Error("Pick at least two friends.");
  var { data: conv, error: e1 } = await sb.from('conversations').insert({is_group:true,name:name||"Group",created_by:ME.id}).select().single();
  if(e1)throw e1;
  var rows=ids.map(function(uid){return{conversation_id:conv.id,user_id:uid};});
  var { error: e2 } = await sb.from('conversation_members').insert(rows);
  if(e2)throw e2;
  return conv;
}

/* ===== REALTIME ===== */
function subscribeGlobalMessages(){
  if(globalMsgCh){try{sb.removeChannel(globalMsgCh);}catch(e){}}
  globalMsgCh = sb.channel('global-messages')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},function(payload){
      var m=payload.new;
      var isCurrentConv = CURRENT.type==="dm" && CURRENT.conv && m.conversation_id===CURRENT.conv.id;
      var isCurrentChan = CURRENT.type==="server" && CURRENT.channel && m.channel_id===CURRENT.channel.id;
      if(isCurrentConv || isCurrentChan){
        if(!MESSAGES.some(function(x){return x.id===m.id;})){MESSAGES.push(m);renderMessages(false);}
        if(m.sender_id!==ME.id) sfxRecv();
        return;
      }
      var key = m.conversation_id || m.channel_id;
      if(m.sender_id===ME.id)return;
      UNREAD[key]=(UNREAD[key]||0)+1;
      if(m.conversation_id){
        fetchProfiles([m.sender_id]).then(function(){
          var who=userLabel(m.sender_id);
          var preview=String(m.content||"").slice(0,60);
          toast(who,preview,"ok");
          sfxRecv();
          if("Notification" in window && Notification.permission==="granted"){
            try{new Notification(who,{body:preview});}catch(e){}
          }
        });
      }
      if(m.conversation_id && !CONVERSATIONS.some(function(c){return c.id===m.conversation_id;})){
        loadConversations().then(function(){renderPanel();renderRail();});
      } else {
        if(m.conversation_id){
          var c=CONVERSATIONS.filter(function(x){return x.id===m.conversation_id;})[0];
          if(c)c.lastMessage=m;
        }
        renderPanel();
      }
    })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'messages'},function(payload){
      var m=payload.new;
      var isCurrentConv = CURRENT.type==="dm" && CURRENT.conv && m.conversation_id===CURRENT.conv.id;
      var isCurrentChan = CURRENT.type==="server" && CURRENT.channel && m.channel_id===CURRENT.channel.id;
      if(isCurrentConv||isCurrentChan){
        for(var i=0;i<MESSAGES.length;i++){if(MESSAGES[i].id===m.id){MESSAGES[i]=m;break;}}
        renderMessages(false);
      }
    })
    .subscribe(function(status){log("global messages sub:",status);});
}

function buildMessagesHTML(){
  var h="",lastDay="",lastAuthor=null,lastTs=0;
  for(var i=0;i<MESSAGES.length;i++){
    var m=MESSAGES[i];
    var d=new Date(m.created_at);
    var day=d.toDateString();
    if(day!==lastDay){h+='<div class="day-sep">'+dayLabel(d)+'</div>';lastDay=day;lastAuthor=null;}
    var grouped=lastAuthor===m.sender_id&&(d.getTime()-lastTs)<5*60*1000;
    h+=messageHTML(m,grouped);
    if(!m.deleted){lastAuthor=m.sender_id;lastTs=d.getTime();}
    else {lastAuthor=null;}
  }
  return h;
}
function emptyStateHTML(){
  var title="",intro="";
  if(CURRENT.type==="dm"&&CURRENT.conv){title=convTitle(CURRENT.conv);intro="Say hi to "+esc(title)+"!";}
  else if(CURRENT.type==="server"&&CURRENT.channel){title="#"+esc(CURRENT.channel.name);intro="Welcome to #"+esc(CURRENT.channel.name)+".";}
  else {title="Welcome to Quazi Chat";intro="Pick a conversation, or create a community with the + button.";}
  return '<div class="empty" style="margin-top:12vh"><div class="big">'+SVG.chat+'</div><h2>'+title+'</h2><p style="margin-top:8px">'+intro+'</p></div>';
}
function renderMessages(forceScroll){
  var body=$("#chat-body");
  if(CURRENT.type==="server"&&CURRENT.channel&&CURRENT.channel.type==="voice"){
    body.innerHTML='<div class="empty" style="margin-top:12vh"><div class="big">'+SVG.vol+'</div><h2>'+esc(CURRENT.channel.name)+'</h2><p style="margin-top:8px">Voice channels coming soon.</p></div>';
    return;
  }
  if(!MESSAGES.length){body.innerHTML=emptyStateHTML();return;}
  var stick = forceScroll || (body.scrollHeight - body.scrollTop - body.clientHeight) < 150;
  body.innerHTML=buildMessagesHTML();
  if(stick)requestAnimationFrame(function(){body.scrollTop=body.scrollHeight;});
}
function renderChat(){
  renderMessages(true);
  renderComposer();
  renderTyping();
}
function renderComposer(){
  var wrap=$("#composer-wrap");
  if(CURRENT.type==="server"&&CURRENT.channel&&CURRENT.channel.type!=="text"&&CURRENT.channel.type!=="announcement"){wrap.innerHTML="";return;}
  if(CURRENT.type==="home"){wrap.innerHTML="";return;}
  if(!CURRENT.conv&&!CURRENT.channel){wrap.innerHTML="";return;}
  var editing=!!UI.editing;
  var draft="";
  if(editing){var em=MESSAGES.filter(function(m){return m.id===UI.editing;})[0];draft=em?em.content:"";}
  var ph="Message ";
  if(CURRENT.type==="dm")ph+="#"+convTitle(CURRENT.conv);
  else if(CURRENT.type==="server"&&CURRENT.channel)ph+="#"+CURRENT.channel.name;
  wrap.innerHTML='<div class="composer"><button class="cbtn" id="emoji-btn" type="button" title="Emoji">😀</button><textarea id="composer-input" rows="1" placeholder="'+esc(ph)+'"></textarea><button class="cbtn send" id="send-btn" type="button">'+SVG.send+'</button></div>';
  var ta=$("#composer-input");
  ta.value=draft;
  autosize(ta);
  ta.addEventListener("input",function(){autosize(ta);broadcastTyping();});
  ta.addEventListener("keydown",function(e){
    if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();doSendFromComposer();}
    if(e.key==="Escape"&&UI.editing){UI.editing=null;renderComposer();}
  });
  $("#send-btn").addEventListener("click",doSendFromComposer);
  $("#emoji-btn").addEventListener("click",function(e){
    e.stopPropagation();
    var existing=$("#emoji-picker");
    if(existing){existing.remove();return;}
    var p=document.createElement("div");p.className="emoji-picker";p.id="emoji-picker";
    p.innerHTML=EMOJIS.map(function(em){return '<button type="button">'+em+'</button>';}).join("");
    wrap.appendChild(p);
    p.addEventListener("click",function(ev){
      var b=ev.target.closest("button");if(!b)return;
      var em=b.textContent;
      var ta=$("#composer-input");
      var start=ta.selectionStart||ta.value.length;
      ta.value=ta.value.slice(0,start)+em+ta.value.slice(ta.selectionEnd||start);
      ta.focus();
      ta.selectionStart=ta.selectionEnd=start+em.length;
      autosize(ta);
    });
    setTimeout(function(){
      function outside(ev){if(!p.contains(ev.target)&&ev.target.id!=="emoji-btn"){p.remove();document.removeEventListener("mousedown",outside,true);}}
      document.addEventListener("mousedown",outside,true);
    },0);
  });
  if(editing)ta.focus();
}
function autosize(ta){if(!ta)return;ta.style.height="auto";ta.style.height=Math.min(ta.scrollHeight,190)+"px";}
async function doSendFromComposer(){
  var ta=$("#composer-input");if(!ta)return;
  var text=ta.value.trim();if(!text)return;
  var editingId=UI.editing;
  ta.value="";autosize(ta);
  try{
    if(editingId){UI.editing=null;await editMessage(editingId,text);}
    else{await sendMessage(text);}
  }catch(e){
    toast("Failed to send",e.message||String(e),"err");
    ta.value=text;autosize(ta);
  }
}
function renderTyping(){
  var el=$("#typing-bar");
  if(!ME){el.innerHTML="";return;}
  var ids=Object.keys(TYPING).filter(function(u){return u!==ME.id;});
  if(!ids.length){el.innerHTML="";return;}
  var names=ids.map(userLabel);
  var txt=names.length===1?names[0]+" is typing":names.length===2?names[0]+" and "+names[1]+" are typing":names.length+" people are typing";
  el.innerHTML='<span class="dots"><i></i><i></i><i></i></span><span>'+esc(txt)+'...</span>';
}
async function buildMembersHTML(serverId){
  var ids=await loadServerMembers(serverId);
  ids.sort(function(a,b){
    var sa=ONLINE.has(a)?0:1,sb=ONLINE.has(b)?0:1;
    if(sa!==sb)return sa-sb;
    return userLabel(a).localeCompare(userLabel(b));
  });
  var srv=SERVERS.filter(function(s){return s.id===serverId;})[0];
  var ownerId=srv?srv.owner_id:null;
  var h='<div class="mgroup"><div class="glabel">Members - '+ids.length+'</div>';
  ids.forEach(function(uid){
    var p=PROFILES[uid]||{username:'unknown',display_name:'Unknown'};
    var online=ONLINE.has(uid);
    h+='<div class="member '+(online?'':'offline')+'" data-member="'+esc(uid)+'">'+
      '<div style="position:relative">'+avatarHTML(uid,32)+statusDot(uid)+'</div>'+
      '<div style="flex:1;min-width:0"><div class="nm">'+esc(p.display_name||p.username)+(uid===ownerId?'<span class="pill-owner">owner</span>':'')+
      '</div><div class="uid">@'+esc(p.username)+'</div></div></div>';
  });
  h+='</div>';
  return h;
}
async function renderMembers(){
  if(isMobile()||CURRENT.type!=="server"||!CURRENT.server||!UI.showMembers){$("#members").innerHTML="";return;}
  var srv=CURRENT.server;
  var myReq=++membersReq;
  var h=await buildMembersHTML(srv.id);
  if(myReq!==membersReq||CURRENT.server!==srv)return;
  $("#members").innerHTML=h;
}
async function openMembersModal(){
  if(!CURRENT.server)return;
  openModal("Members",'<div class="empty" style="padding:20px">Loading…</div>');
  var h=await buildMembersHTML(CURRENT.server.id);

}

function openFriends(){
  var tab="all";
  function tabBtn(id,label,count){
    return '<button type="button" data-ftab="'+id+'" style="padding:8px 14px;border-radius:6px;font-size:12.5px;font-weight:600;'+
      (tab===id?'background:var(--surface2);color:var(--accent);box-shadow:inset 0 0 0 1px rgba(0,255,224,.2)':'color:var(--text3)')+'">'+
      label+(count?' ('+count+')':'')+'</button>';
  }
  function row(otherId, actions){
    var p=PROFILES[otherId]||{username:'unknown',display_name:'Unknown'};
    return '<div style="display:flex;align-items:center;gap:12px;padding:10px;border-radius:10px;background:rgba(255,255,255,.03);margin-bottom:8px">'+
      '<div style="position:relative">'+avatarHTML(otherId,40)+statusDot(otherId)+'</div>'+
      '<div style="flex:1;min-width:0"><div style="font-weight:600">'+esc(p.display_name||p.username)+'</div>'+
      '<div style="font-size:12px;color:var(--text3)">@'+esc(p.username)+' - '+(ONLINE.has(otherId)?"online":"offline")+'</div></div>'+
      '<div style="display:flex;gap:6px">'+actions+'</div></div>';
  }
  function draw(){
    var f=FRIENDS;
    var h='<div style="display:flex;gap:3px;background:var(--void);padding:4px;border-radius:8px;border:1px solid var(--border);margin-bottom:20px;overflow-x:auto">'+
      tabBtn("all","All",f.accepted.length)+
      tabBtn("online","Online",f.accepted.filter(function(x){return ONLINE.has(x.other);}).length)+
      tabBtn("pending","Pending",f.incoming.length)+
      tabBtn("add","Add Friend")+'</div>';
    if(tab==="add"){
      h+='<div class="field"><label>Add by username</label><div style="display:flex;gap:8px"><input id="fr-input" placeholder="username" style="flex:1"><button class="btn primary" id="fr-send" type="button">Send</button></div></div>';
    }else if(tab==="pending"){
      h+='<h4 style="margin-bottom:10px;font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em">Incoming</h4>';
      if(!f.incoming.length)h+='<div class="empty" style="padding:14px">Nothing incoming.</div>';
      f.incoming.forEach(function(x){h+=row(x.other,'<button class="btn sm primary" data-fr-accept="'+x.id+'" type="button">Accept</button><button class="btn sm danger" data-fr-reject="'+x.id+'" type="button">Decline</button>');});
      h+='<h4 style="margin:18px 0 10px;font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em">Outgoing</h4>';
      if(!f.outgoing.length)h+='<div class="empty" style="padding:14px">Nothing outgoing.</div>';
      f.outgoing.forEach(function(x){h+=row(x.other,'<button class="btn sm" data-fr-cancel="'+x.id+'" type="button">Cancel</button>');});
    }else{
      var list=f.accepted.slice();
      if(tab==="online")list=list.filter(function(x){return ONLINE.has(x.other);});
      if(!list.length)h+='<div class="empty">Nothing here yet.</div>';
      list.forEach(function(x){
        h+=row(x.other,'<button class="btn sm primary" data-fr-dm="'+esc(x.other)+'" type="button">Message</button>'+
          '<button class="btn sm danger" data-fr-remove="'+x.id+'" type="button">Remove</button>');
      });
    }
    $("#modal-body").innerHTML=h;
    $$("[data-ftab]").forEach(function(b){b.onclick=function(){tab=b.dataset.ftab;draw();};});
    var sbtn=$("#fr-send");
    if(sbtn)sbtn.onclick=async function(){
      var v=($("#fr-input").value||"").trim();
      try{await sendFriendRequest(v);toast("Sent","Friend request sent.","ok");draw();}
      catch(e){toast("Failed",e.message||String(e),"err");}
    };
    var inp=$("#fr-input");
    if(inp)inp.addEventListener("keydown",function(e){if(e.key==="Enter"){$("#fr-send").click();}});
  }
  openModal("Friends",'<div id="friends-box"></div>',{wide:true,onMount:function(){
    $("#friends-box").id="modal-body";
  }});
  draw();
  $("#modal-root").onclick=async function(e){
    var t=e.target.closest("[data-fr-accept],[data-fr-reject],[data-fr-cancel],[data-fr-remove],[data-fr-dm]");
    if(!t)return;
    var d=t.dataset;
    try{
      if(d.frAccept)await acceptFriend(d.frAccept);
      if(d.frReject)await removeFriendship(d.frReject);
      if(d.frCancel)await removeFriendship(d.frCancel);
      if(d.frRemove)await removeFriendship(d.frRemove);
      if(d.frDm){closeModal();await openDMWith(d.frDm);return;}
      draw();
    }catch(err){toast("Error",err.message||String(err),"err");}
  };
}
function openFindUsers(){
  openModal("Find People",
    '<div class="field"><label>Search by username or name</label>'+
    '<div style="display:flex;gap:8px"><input id="find-input" placeholder="Search..." style="flex:1">'+
    '<button class="btn primary" id="find-go" type="button">Search</button></div></div>'+
    '<div style="text-align:center;margin-bottom:14px"><a href="#" id="google-search-link" style="font-size:12px;color:var(--text3)">or search the web →</a></div>'+
    '<div id="find-results" style="margin-top:14px"></div>');
  async function run(){
    var q=$("#find-input").value.trim();
    var results=q?await searchUsers(q):[];
    var box=$("#find-results");
    if(!box)return;
    if(!q){box.innerHTML='<div class="empty">Type a name.</div>';return;}
    if(!results.length){box.innerHTML='<div class="empty">No users matched.</div>';return;}
    box.innerHTML=results.map(function(p){
      var isMe=p.id===ME.id;
      var isFriend=FRIENDS.accepted.some(function(f){return f.other===p.id;});
      var pending=FRIENDS.incoming.concat(FRIENDS.outgoing).some(function(f){return f.other===p.id;});
      var actions;
      if(isMe)actions='<span style="font-size:10px;color:var(--accent);background:rgba(0,255,224,.14);padding:2px 8px;border-radius:99px;text-transform:uppercase;font-weight:700">you</span>';
      else if(isFriend)actions='<button class="btn sm primary" data-find-dm="'+esc(p.id)+'" type="button">Message</button>';
      else if(pending)actions='<span style="font-size:12px;color:var(--text3)">Pending</span>';
      else actions='<button class="btn sm primary" data-find-add="'+esc(p.username)+'" type="button">Add Friend</button>';
      return '<div style="display:flex;align-items:center;gap:12px;padding:10px;border-radius:10px;background:rgba(255,255,255,.03);margin-bottom:8px">'+
        '<div style="position:relative">'+avatarHTML(p.id,44)+statusDot(p.id)+'</div>'+
        '<div style="flex:1;min-width:0"><div style="font-weight:600">'+esc(p.display_name||p.username)+'</div>'+
        '<div style="font-size:12px;color:var(--text3)">@'+esc(p.username)+'</div></div>'+
        '<div style="display:flex;gap:6px">'+actions+'</div></div>';
    }).join("");
  }
  $("#find-go").onclick=run;
  $("#find-input").addEventListener("keydown",function(e){if(e.key==="Enter")run();});
  $("#google-search-link").onclick=function(e){
    e.preventDefault();
    var q=$("#find-input").value.trim();
    window.open("https://www.google.com/search?q="+encodeURIComponent(q||"Quazi Chat"),"_blank");
  };
  $("#modal-root").onclick=async function(e){
    var t=e.target.closest("[data-find-add],[data-find-dm]");if(!t)return;
    try{
      if(t.dataset.findAdd){await sendFriendRequest(t.dataset.findAdd);toast("Sent","Request sent.","ok");run();}
      if(t.dataset.findDm){closeModal();await openDMWith(t.dataset.findDm);}
    }catch(err){toast("Error",err.message||String(err),"err");}
  };
}
function openProfile(uid){
  fetchProfiles([uid]).then(function(){
    var p=PROFILES[uid];if(!p)return;
    var isMe=uid===ME.id;
    var isFriend=FRIENDS.accepted.some(function(f){return f.other===uid;});
    var pending=FRIENDS.incoming.concat(FRIENDS.outgoing).some(function(f){return f.other===uid;});
    var actions="";
    if(isMe)actions='<button class="btn sm primary" data-pd="edit" type="button">Edit Profile</button>';
    else if(isFriend)actions='<button class="btn sm primary" data-pd="dm" type="button">Send Message</button>';
    else if(!pending)actions='<button class="btn sm primary" data-pd="add" type="button">Add Friend</button>';
    else actions='<span style="font-size:12px;color:var(--text3)">Request pending</span>';
    openModal(p.display_name||p.username,
      '<div style="display:flex;gap:16px;align-items:flex-start;margin-bottom:18px">'+
        '<div style="position:relative">'+avatarHTML(uid,72)+statusDot(uid)+'</div>'+
        '<div style="flex:1"><div style="font-family:Space Grotesk;font-size:20px;font-weight:600">'+esc(p.display_name||p.username)+'</div>'+
        '<div style="color:var(--text3);font-size:13px">@'+esc(p.username)+'</div>'+
        '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">'+actions+'</div></div>'+
      '</div>'+
      '<div class="field"><label>Status</label><div style="font-size:13px;color:var(--text2)">'+esc(ONLINE.has(uid)?(p.status||"online"):"offline")+'</div></div>'+
      '<div class="field"><label>About</label><div style="font-size:13px;color:var(--text2);white-space:pre-wrap">'+esc(p.bio||"No bio yet.")+'</div></div>'+
      '<div class="field"><label>Member since</label><div style="font-size:13px;color:var(--text2)">'+new Date(p.created_at).toLocaleDateString()+'</div></div>'
    );
    $("#modal-root").onclick=async function(e){
      var b=e.target.closest("[data-pd]");if(!b)return;
      var a=b.dataset.pd;
      if(a==="edit"){closeModal();openEditProfile();}
      if(a==="dm"){closeModal();await openDMWith(uid);}
      if(a==="add"){
        try{await sendFriendRequest(p.username);toast("Sent","Request sent.","ok");closeModal();}
        catch(err){toast("Error",err.message||String(err),"err");}
      }
    };
  });
}

    '<div class="field"><label>Members</label><div style="max-height:260px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;padding:8px">'+

      return '<label style="display:flex;align-items:center;gap:10px;padding:7px;border-radius:8px;cursor:pointer">'+
        '<input type="checkbox" data-ng="'+esc(f.other)+'" style="accent-color:var(--accent)">'+
        avatarHTML(f.other,30)+'<span>'+esc(p.display_name||p.username)+'</span></label>';
    }).join("")+'</div></div>';
  openModal("New Group DM",h,{
    footer:'<button class="btn" id="ng-no" type="button">Cancel</button><button class="btn primary" id="ng-yes" type="button">Create</button>',
    onMount:function(){
      $("#ng-no").onclick=closeModal;
      $("#ng-yes").onclick=async function(){
        var name=$("#ng-name").value.trim()||"Group DM";
        var ids=$$("[data-ng]").filter(function(c){return c.checked;}).map(function(c){return c.dataset.ng;});
        try{
          var conv=await createGroupDM(name,ids);
          await loadConversations();
          closeModal();
          await goConversation(conv.id);
        }catch(e){toast("Failed",e.message||String(e),"err");}
      };
    }
  });
}

function openStatusMenu(x,y){
  var s=ME.status||"online";
  openMenu(x,y,[
    {head:"Set Status"},
    {id:"online",label:"Online",icon:s==="online"?SVG.check:"",onClick:function(){setStatus("online");}},
    {id:"idle",label:"Idle",icon:s==="idle"?SVG.check:"",onClick:function(){setStatus("idle");}},
    {id:"dnd",label:"Do Not Disturb",icon:s==="dnd"?SVG.check:"",onClick:function(){setStatus("dnd");}},
    {id:"offline",label:"Invisible",icon:s==="offline"?SVG.check:"",onClick:function(){setStatus("offline");}}

async function setStatus(s){
  try{
    await updateProfile({status:s});
    if(presenceCh)try{presenceCh.track({user_id:ME.id,status:s,at:new Date().toISOString()});}catch(e){}
    toast("Updated","Status is "+s+".","ok");
  }catch(e){toast("Error",e.message||String(e),"err");}
}
function resizeImage(file,max,cb){
  var r=new FileReader();
  r.onload=function(ev){
    var img=new Image();
    img.onload=function(){
      var canvas=document.createElement("canvas");
      var scale=Math.min(1,max/Math.max(img.width,img.height));
      canvas.width=Math.round(img.width*scale);
      canvas.height=Math.round(img.height*scale);
      canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
      cb(canvas.toDataURL("image/jpeg",0.82));
    };
    img.src=ev.target.result;
  };
  r.readAsDataURL(file);
}
function syncMobile(){
  var p=$("#panel");if(p)p.classList.toggle("open",UI.panelOpen);
  var bd=$(".backdrop");
  if(UI.panelOpen&&!bd){
    var b=document.createElement("div");b.className="backdrop";
    b.onclick=function(){UI.panelOpen=false;syncMobile();};
    document.body.appendChild(b);
  }else if(!UI.panelOpen&&bd){bd.remove();}
}

/* ===== INSTALL PROMPT ===== */
function promptInstall(){
  if(!deferredInstall){
    toast("Install","Use your browser's menu → 'Add to Home Screen'.","ok");
    return;
  }
  deferredInstall.prompt();
  deferredInstall.userChoice.then(function(c){
    if(c.outcome==='accepted') toast("Installing","Welcome to Quazi Chat!","ok");
    deferredInstall = null;
    var b=$(".install-banner"); if(b) b.remove();
  });
}
window.addEventListener('beforeinstallprompt',function(e){
  e.preventDefault();
  deferredInstall = e;
  if(localStorage.getItem('quazi_install_dismissed')==='1') return;
  var slot = $("#install-slot");
  if(slot && !slot.innerHTML){
    slot.innerHTML =
      '<div class="install-banner">'+
        '<div class="ib-icon">🚀</div>'+
        '<div class="ib-text"><div class="ib-title">Install Quazi Chat</div><div class="ib-sub">Add to home screen for a native experience</div></div>'+
        '<button class="btn primary sm" id="ib-install" type="button">Install</button>'+
        '<button class="btn ghost sm" id="ib-dismiss" type="button">Later</button>'+
      '</div>';
    $("#ib-install").onclick = promptInstall;
    $("#ib-dismiss").onclick = function(){
      localStorage.setItem('quazi_install_dismissed','1');
      slot.innerHTML = '';
    };
  }
});

/* ===== EVENTS ===== */
function wireAuth(){
  $$(".tab").forEach(function(t){
    t.onclick=function(){
      $$(".tab").forEach(function(x){x.classList.remove("active");});
      t.classList.add("active");
      $("#form-login").classList.toggle("hidden",t.dataset.tab!=="login");
      $("#form-signup").classList.toggle("hidden",t.dataset.tab!=="signup");
    };
  });
  var uTimer=null,uInp=$("#su-username");
  uInp.addEventListener("input",function(){
    var v=uInp.value.trim().toLowerCase();uInp.value=v;
    var hint=$("#su-user-hint");hint.className="hint";
    if(!v){hint.textContent="3-24 chars: a-z, 0-9, underscore.";return;}
    clearTimeout(uTimer);hint.textContent="Checking...";
    uTimer=setTimeout(async function(){
      var r=await checkUsername(v);
      hint.className=r.ok?"hint ok":"hint err";
      hint.textContent=r.msg;
    },350);
  });
  $("#form-login").addEventListener("submit",async function(e){
    e.preventDefault();
    var err=$("#li-err");err.textContent="";
    var btn=$("#li-submit");btn.disabled=true;btn.textContent="Signing in...";
    try{
      await doLogin($("#li-email").value.trim(),$("#li-pass").value);
      await boot();
    }catch(ex){
      err.textContent=ex.message||String(ex);
    }finally{btn.disabled=false;btn.textContent="Sign In";}
  });
  $("#form-signup").addEventListener("submit",async function(e){
    e.preventDefault();
    var err=$("#su-err");err.textContent="";var ok=$("#su-ok");ok.textContent="";
    var btn=$("#su-submit");btn.disabled=true;btn.textContent="Creating...";
    try{
      var email=$("#su-email").value.trim();
      var user=$("#su-username").value.trim().toLowerCase();
      var disp=$("#su-display").value.trim()||user;
      var pass=$("#su-pass").value;
      if(pass!==$("#su-confirm").value)throw new Error("Passwords do not match.");
      var res=await doSignup(email,pass,user,disp);
      if(res.session){await boot();toast("Welcome","Account created.","ok");}
      else {ok.textContent="Account created. Check your email then log in.";}
    }catch(ex){
      err.textContent=ex.message||String(ex);
    }finally{btn.disabled=false;btn.textContent="Create Account";}
  });
  $("#google-login").addEventListener("click",async function(){
    try{ await doGoogleLogin(); }
    catch(ex){ toast("Google sign-in failed",ex.message||String(ex),"err"); }
  });
  $("#forgot-link").addEventListener("click",async function(e){
    e.preventDefault();
    var email=$("#li-email").value.trim();
    if(!email){toast("Enter your email first","","err");return;}
    try{
      var { error } = await sb.auth.resetPasswordForEmail(email);
      if(error)throw error;
      toast("Sent","Check your inbox for a reset link.","ok");
    }catch(ex){toast("Error",ex.message||String(ex),"err");}
  });
}

document.addEventListener("click",async function(e){
  var t=e.target;
  var rail=t.closest("[data-rail]");
  if(rail){
    var a=rail.dataset.rail;
    if(a==="home")await goHome();
    if(a==="create-server")openCreateServer();
    if(a==="find")openFindUsers();
    return;
  }
  var srvBtn=t.closest("[data-server]");
  if(srvBtn){await goServer(srvBtn.dataset.server);return;}
  var cv=t.closest("[data-conv]");
  if(cv){await goConversation(cv.dataset.conv);return;}
  var addch=t.closest("[data-addchannel]");
  if(addch){openAddChannel(addch.dataset.addchannel);return;}
  var ch=t.closest("[data-channel]");
  if(ch){await goChannel(ch.dataset.channel);return;}

  var act=t.closest("[data-act]");
  if(act){
    var aa=act.dataset.act;
    if(aa==="toggle-panel"){UI.panelOpen=!UI.panelOpen;syncMobile();return;}
    if(aa==="toggle-members"){
      if(isMobile()){openMembersModal();}
      else{UI.showMembers=!UI.showMembers;$("#app").classList.toggle("hide-members",!UI.showMembers||CURRENT.type!=="server");renderMembers();}
      return;
    }
    if(aa==="friends"){openFriends();return;}
    if(aa==="find"){openFindUsers();return;}
    if(aa==="newgroup"){openNewGroup();return;}
    if(aa==="settings"){openSettings();return;}
    if(aa==="status"){var r=act.getBoundingClientRect();openStatusMenu(r.left-160,r.top-180);return;}
    if(aa==="logout"){await doLogout();return;}
    if(aa==="view-profile"){openProfile(act.dataset.user);return;}
    if(aa==="invite-server"){openInviteServer();return;}
    if(aa==="leave-server"){
      confirmModal("Leave "+CURRENT.server.name+"?","You can rejoin if someone invites you.",async function(){
        try{await leaveServer(CURRENT.server.id);await loadServers();await goHome();toast("Left","","ok");}
        catch(err){toast("Error",err.message||String(err),"err");}
      },true);
      return;
    }
    if(aa==="delete-server"){
      var sid=CURRENT.server.id;
      confirmModal("Delete server?","All channels and messages will be deleted.",async function(){
        try{await deleteServer(sid);await loadServers();await goHome();toast("Deleted","","ok");}
        catch(err){toast("Error",err.message||String(err),"err");}
      },true);
      return;
    }
    if(aa==="delete-channel"&&CURRENT.channel){
      var cid=CURRENT.channel.id, chName=CURRENT.channel.name;
      confirmModal("Delete #"+chName+"?","All messages will be deleted.",async function(){
        try{
          await deleteChannel(cid);
          await loadChannels(CURRENT.server.id);
          var first=CHANNELS.filter(function(c){return c.type==="text";})[0]||CHANNELS[0];
          CURRENT.channel=first||null;
          if(first)await loadMessagesForChannel(first.id); else MESSAGES=[];
          renderAll();
          toast("Deleted","Channel removed.","ok");
        }catch(err){toast("Error",err.message||String(err),"err");}
      },true);
      return;
    }
    if(aa==="edit-msg"){
      UI.editing=act.dataset.msg;renderComposer();
      var ta=$("#composer-input");
      if(ta){ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);}
      return;
    }
    if(aa==="del-msg"){
      var mid=act.dataset.msg;
      confirmModal("Delete message?","This cannot be undone.",async function(){
        try{await deleteMessage(mid);}catch(err){toast("Error",err.message||String(err),"err");}
      },true);
      return;
    }
  }

  var userEl=t.closest("[data-user]");
  if(userEl){openProfile(userEl.dataset.user);return;}
  var memEl=t.closest("[data-member]");
  if(memEl){openProfile(memEl.dataset.member);return;}

  // Music player list
  var mpTrack = t.closest("[data-mp-idx]");
  if(mpTrack){ mpPlayIdx(parseInt(mpTrack.dataset.mpIdx,10)); return; }

  // MP toggle (in case button wasn't re-wired)
  if(t.id==="mp-toggle"){ mpToggleExpand(); return; }
});

window.addEventListener("resize",function(){
  if(!ME)return;
  $("#app").classList.toggle("hide-members", !UI.showMembers || CURRENT.type!=="server" || isMobile());
  if(isMobile()&&UI.panelOpen){UI.panelOpen=false;syncMobile();}
  renderMembers();
});

/* ===== BOOT ===== */
async function boot(){
  var { data:{session} } = await sb.auth.getSession();
  SESSION=session;
  if(!SESSION){showAuth();return;}
  await loadMe();
  if(!ME){showAuth();toast("Profile missing","Try again in a moment.","err");return;}
  showApp();
  subscribePresence();
  subscribeFriendships();
  subscribeServers();
  subscribeGlobalMessages();
  await Promise.all([loadFriends(),loadServers()]);
  renderRail();
  await goHome();
  ytEnsure();
}

(async function init(){
  buildTagline();
  wireAuth();
  // Wire music toggle initially
  var mt = $("#mp-toggle"); if(mt) mt.onclick = mpToggleExpand;
  ytEnsure();
  await boot();
})();
</script>
