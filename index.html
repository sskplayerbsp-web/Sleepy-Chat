<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sleepy-Chat</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='42' fill='%2300ffe0'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--void:#0a0a0f;--surface:#12121a;--surface2:#1a1a26;--surface3:#22222f;--border:#2a2a3a;--border2:#3a3a4d;--cyan:#00ffe0;--purple:#b44aff;--rose:#ff2d6f;--green:#00e676;--amber:#ffab00;--text:#e8e8f0;--text2:#8f8fa8;--text3:#5a5a72;--glow:0 0 14px rgba(0,255,224,.35);--ease:cubic-bezier(.22,.61,.36,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',system-ui,sans-serif;font-size:14px;background:var(--void);color:var(--text);-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(900px 600px at 12% -10%,rgba(0,255,224,.06),transparent 60%),radial-gradient(900px 700px at 95% 110%,rgba(180,74,255,.07),transparent 60%)}
button,input,textarea{font:inherit;color:inherit;outline:none;border:none;background:none}
button{cursor:pointer}
a{color:var(--cyan);text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#2c2c3d;border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:#40405a}
.hidden{display:none!important}
h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:8px;font-weight:600;font-size:13px;background:var(--surface2);color:var(--text);border:1px solid var(--border);transition:all .18s var(--ease);white-space:nowrap}
.btn:hover{background:var(--surface3);border-color:var(--border2);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,var(--cyan),#00c9b4);color:#04120f;border-color:transparent;font-weight:700}
.btn.primary:hover{box-shadow:var(--glow)}
.btn.danger{background:rgba(255,45,111,.12);color:#ff7aa2;border-color:rgba(255,45,111,.35)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text2)}
.btn.ghost:hover{background:var(--surface2);color:var(--text)}
.btn.sm{padding:6px 11px;font-size:12px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3)}
.field input,.field textarea,.field select{width:100%;padding:11px 13px;border-radius:8px;background:var(--void);border:1px solid var(--border);color:var(--text);transition:border-color .18s,box-shadow .18s}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,255,224,.12)}
.field textarea{resize:vertical;min-height:80px;font-family:inherit}
.field select{appearance:none;cursor:pointer}
.field .hint{font-size:11px;color:var(--text3)}
.field .hint.ok{color:var(--green)}
.field .hint.err{color:var(--rose)}
.err,.ok{font-size:12.5px;border-radius:8px;transition:all .2s;min-height:0}
.err:not(:empty){padding:10px 13px;background:rgba(255,45,111,.12);border:1px solid rgba(255,45,111,.35);color:#ff8aa8;font-weight:500;margin-top:12px}
.ok:not(:empty){padding:10px 13px;background:rgba(0,230,118,.1);border:1px solid rgba(0,230,118,.3);color:#8affb8;font-weight:500;margin-top:12px}
.check{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text2);margin-bottom:16px;cursor:pointer}
.check input{width:15px;height:15px;accent-color:var(--cyan);cursor:pointer}
.avatar{border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;color:#06120f;overflow:hidden;position:relative;user-select:none}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.status-dot{width:11px;height:11px;border-radius:50%;border:2.5px solid var(--surface);position:absolute;right:-1px;bottom:-1px}
.s-online{background:var(--green);box-shadow:0 0 8px rgba(0,230,118,.7)}
.s-idle{background:var(--amber)}.s-dnd{background:var(--rose)}.s-offline{background:#4a4a5e}
.auth-screen{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;overflow-y:auto;background:radial-gradient(700px 500px at 20% 10%,rgba(0,255,224,.09),transparent 60%),radial-gradient(700px 500px at 85% 90%,rgba(180,74,255,.11),transparent 60%),var(--void)}
.auth-card{width:100%;max-width:440px;background:rgba(18,18,26,.9);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:18px;padding:34px 30px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.brand{text-align:center;margin-bottom:26px}
.brand-mark{width:64px;height:64px;margin:0 auto 14px;border-radius:20px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(0,255,224,.16),rgba(180,74,255,.16));border:1px solid rgba(0,255,224,.3);box-shadow:var(--glow)}
.brand-mark svg{width:34px;height:34px}
.brand h1{font-size:26px;letter-spacing:.06em}
.brand h1 span{color:var(--cyan);text-shadow:0 0 18px rgba(0,255,224,.55)}
.brand p{font-size:12px;color:var(--text3);letter-spacing:.14em;text-transform:uppercase;margin-top:6px}
.tabs{display:flex;gap:4px;background:var(--void);padding:4px;border-radius:8px;margin-bottom:22px;border:1px solid var(--border)}
.tab{flex:1;padding:9px;border-radius:6px;font-size:13px;font-weight:600;color:var(--text3);transition:all .2s}
.tab.active{background:var(--surface2);color:var(--cyan);box-shadow:inset 0 0 0 1px rgba(0,255,224,.22)}
.app{position:relative;z-index:1;display:grid;grid-template-columns:74px 260px 1fr 240px;height:100vh;height:100dvh}
.app.hide-members{grid-template-columns:74px 260px 1fr}
.app > *{min-height:0;min-width:0}
.rail{background:linear-gradient(180deg,#0c0c13,#0a0a0f);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0;overflow-y:auto;overflow-x:hidden}
.rail-sep{width:34px;height:1px;background:var(--border);flex:none;margin:3px 0}
.rail-btn{position:relative;width:48px;height:48px;flex:none;border-radius:16px;display:flex;align-items:center;justify-content:center;background:var(--surface);color:var(--cyan);transition:all .22s var(--ease);overflow:hidden;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px}
.rail-btn:hover{border-radius:14px;box-shadow:var(--glow);transform:translateY(-2px)}
.rail-btn.active{border-radius:14px;box-shadow:var(--glow)}
.rail-btn.active::before{content:'';position:absolute;left:-10px;top:50%;transform:translateY(-50%);width:4px;height:26px;border-radius:0 4px 4px 0;background:var(--cyan);box-shadow:var(--glow)}
.rail-btn img{width:100%;height:100%;object-fit:cover}
.rail-btn svg{width:22px;height:22px}
.rail-btn.dashed{background:transparent;border:1.5px dashed rgba(0,255,224,.35)}
.rail-btn.dashed:hover{border-style:solid;background:rgba(0,255,224,.1)}
.rail-badge{position:absolute;top:-3px;right:-3px}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--rose);color:#fff;font-size:10px;font-weight:700}
.panel{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column}
.panel-head{height:50px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--border);font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;cursor:pointer}
.panel-head:hover{background:var(--surface2)}
.panel-head .ttl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel-body{flex:1;min-height:0;overflow-y:auto;padding:10px 8px 14px}
.panel-section{margin-bottom:16px}
.panel-label{padding:6px 8px;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);display:flex;align-items:center;gap:6px}
.panel-label .add{margin-left:auto;opacity:0;transition:opacity .15s;cursor:pointer;width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--text3)}
.panel-label:hover .add{opacity:1}
.panel-label .add:hover{background:rgba(255,255,255,.07);color:var(--cyan)}
.row{position:relative;display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:8px;cursor:pointer;color:var(--text2);font-size:13.5px;font-weight:500;transition:background .14s,color .14s;width:100%;text-align:left}
.row:hover{background:rgba(255,255,255,.045);color:var(--text)}
.row.active{background:var(--surface2);color:#fff}
.row.active::before{content:'';position:absolute;left:-8px;top:50%;transform:translateY(-50%);width:3px;height:60%;border-radius:0 3px 3px 0;background:var(--cyan);box-shadow:var(--glow)}
.row .txt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{font-size:11px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.row svg{width:16px;height:16px;flex:none;opacity:.75}
.user-bar{flex:none;height:60px;display:flex;align-items:center;gap:9px;padding:0 10px;background:rgba(10,10,15,.55);border-top:1px solid var(--border)}
.user-bar .info{flex:1;min-width:0;cursor:pointer;border-radius:6px;padding:3px 5px;transition:background .15s}
.user-bar .info:hover{background:rgba(255,255,255,.05)}
.user-bar .nm{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-bar .uid{font-size:10.5px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-bar .ctl{width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:all .15s}
.user-bar .ctl:hover{background:rgba(255,255,255,.07);color:var(--cyan)}
.user-bar .ctl svg{width:16px;height:16px}
.chat{display:flex;flex-direction:column;background:var(--void);position:relative}
.chat-head{height:50px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--border);background:rgba(10,10,15,.7);backdrop-filter:blur(12px)}
.chat-head .title{display:flex;align-items:center;gap:8px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;min-width:0}
.chat-head .title svg{width:18px;height:18px;flex:none;opacity:.75}
.chat-head .title .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-head .topic{font-size:12px;color:var(--text3);border-left:1px solid var(--border);padding-left:10px;margin-left:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-head .spacer{flex:1}
.chat-head .hbtn{width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:all .15s}
.chat-head .hbtn:hover{background:var(--surface2);color:var(--cyan)}
.chat-head .hbtn svg{width:17px;height:17px}
.chat-body{flex:1;min-height:0;overflow-y:auto;padding:16px 0 8px}
.empty{padding:40px 20px;text-align:center;color:var(--text3);font-size:13px}
.empty .big{width:64px;height:64px;margin:0 auto 12px;border-radius:20px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(0,255,224,.14),rgba(180,74,255,.14));border:1px solid rgba(0,255,224,.22)}
.empty .big svg{width:30px;height:30px;color:var(--cyan)}
.empty h2{font-size:20px;color:var(--text);margin-bottom:6px;font-family:'Space Grotesk'}
.msg{position:relative;display:flex;gap:13px;padding:4px 20px;transition:background .12s;animation:msgIn .22s var(--ease) both}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg:hover{background:rgba(255,255,255,.022)}
.msg .body{flex:1;min-width:0}
.msg .head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.msg .author{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;cursor:pointer}
.msg .author:hover{text-decoration:underline}
.msg .uid{font-size:10.5px;color:var(--text3);background:rgba(0,255,224,.07);padding:1px 6px;border-radius:5px;font-family:'JetBrains Mono',monospace}
.msg .time{font-size:10.5px;color:var(--text3);font-family:'JetBrains Mono',monospace}
.msg .edited{font-size:10px;color:var(--text3)}
.msg .content{font-size:14px;color:#dcdce8;word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap;margin-top:1px}
.msg.deleted .content{color:var(--text3);font-style:italic}
.msg .toolbar{position:absolute;top:-12px;right:22px;display:none;align-items:center;gap:1px;background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:2px;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:5}
.msg:hover .toolbar{display:flex}
.msg .toolbar button{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:all .13s}
.msg .toolbar button:hover{background:rgba(0,255,224,.12);color:var(--cyan)}
.msg .toolbar button.danger:hover{background:rgba(255,45,111,.15);color:#ff7aa2}
.msg .toolbar svg{width:15px;height:15px}
.day-sep{display:flex;align-items:center;gap:12px;padding:14px 20px 8px;color:var(--text3);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.day-sep::before,.day-sep::after{content:'';flex:1;height:1px;background:var(--border)}
.typing-bar{flex:none;height:22px;padding:0 20px;font-size:12px;color:var(--text3);display:flex;align-items:center;gap:7px}
.dots{display:inline-flex;gap:3px}
.dots i{width:4px;height:4px;border-radius:50%;background:var(--cyan);display:block;animation:tdot 1.3s infinite}
.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}
@keyframes tdot{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-3px);opacity:1}}
.composer-wrap{flex:none;padding:0 20px 18px}
.composer{display:flex;align-items:flex-end;gap:8px;padding:9px 11px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;transition:border-color .2s,box-shadow .2s}
.composer:focus-within{border-color:rgba(0,255,224,.4);box-shadow:0 0 0 3px rgba(0,255,224,.07)}
.composer textarea{flex:1;resize:none;max-height:190px;min-height:22px;font-size:14px;line-height:1.5;padding:3px 0;background:none}
.composer textarea::placeholder{color:var(--text3)}
.composer .cbtn{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--text3);transition:all .15s;flex:none}
.composer .cbtn:hover{background:rgba(255,255,255,.07);color:var(--cyan)}
.composer .cbtn svg{width:17px;height:17px}
.composer .send{background:linear-gradient(135deg,var(--cyan),#00c9b4);color:#04120f;border-radius:8px;width:32px;height:32px}
.composer .send:hover{box-shadow:var(--glow);color:#04120f}
.members{background:var(--surface);border-left:1px solid var(--border);overflow-y:auto;padding:14px 10px}
.app.hide-members .members{display:none}
.mgroup{margin-bottom:18px}
.mgroup .glabel{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);padding:0 8px 7px}
.member{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;cursor:pointer;transition:background .14s}
.member:hover{background:rgba(255,255,255,.05)}
.member.offline{opacity:.5}
.member .nm{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.member .uid{font-size:11px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.overlay{position:fixed;inset:0;z-index:300;background:rgba(4,4,8,.75);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.modal{width:100%;max-width:520px;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:0 30px 90px rgba(0,0,0,.7);max-height:88vh;display:flex;flex-direction:column;animation:mIn .26s var(--ease) both}
.modal.wide{max-width:640px}
@keyframes mIn{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}
.modal-head{flex:none;display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:17px}
.modal-body{padding:22px;overflow-y:auto;flex:1}
.modal-foot{flex:none;display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--border);background:rgba(0,0,0,.15)}
.xbtn{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text3);transition:all .15s}
.xbtn:hover{background:var(--surface2);color:var(--text)}
.xbtn svg{width:18px;height:18px}
.menu{position:fixed;z-index:350;min-width:200px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:5px;box-shadow:0 20px 55px rgba(0,0,0,.7);animation:mIn .15s var(--ease) both}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:7px;font-size:13px;color:var(--text2);text-align:left;transition:all .12s}
.menu button:hover{background:rgba(255,255,255,.06);color:var(--text)}
.menu button.danger{color:#ff7aa2}
.menu button.danger:hover{background:rgba(255,45,111,.14)}
.menu .msep{height:1px;background:var(--border);margin:4px 2px}
.menu .mhead{padding:8px 10px 6px;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3)}
.menu svg{width:15px;height:15px;flex:none;opacity:.85}
#toasts{position:fixed;bottom:20px;right:20px;z-index:500;display:flex;flex-direction:column;gap:9px;pointer-events:none}
.toast{pointer-events:auto;min-width:230px;max-width:340px;padding:12px 15px;background:rgba(26,26,38,.97);border:1px solid var(--border);border-left:3px solid var(--cyan);border-radius:10px;font-size:13px;box-shadow:0 14px 40px rgba(0,0,0,.6);animation:tIn .3s var(--ease) both}
@keyframes tIn{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
.toast.err{border-left-color:var(--rose)}
.toast.ok{border-left-color:var(--green)}
.toast .tt{font-weight:700;font-size:12.5px;margin-bottom:2px}
.toast .tb{color:var(--text2);font-size:12.5px}
.mobile-only{display:none}
@media (max-width:1050px){.app,.app.hide-members{grid-template-columns:74px 240px 1fr}.members{position:fixed;right:0;top:0;bottom:0;width:250px;transform:translateX(100%);transition:transform .28s;z-index:80;box-shadow:-20px 0 50px rgba(0,0,0,.5)}.members.open{transform:none}}
@media (max-width:760px){.app,.app.hide-members{grid-template-columns:1fr;padding-bottom:60px}.mobile-only{display:flex}.rail{position:fixed;left:0;right:0;bottom:0;top:auto;height:60px;width:auto;flex-direction:row;border-right:none;border-top:1px solid var(--border);padding:0 10px;gap:8px;z-index:60;overflow-x:auto}.rail-sep{width:1px;height:30px;margin:0 2px}.rail-btn{width:42px;height:42px;border-radius:13px}.panel{position:fixed;left:0;top:0;bottom:60px;width:280px;z-index:70;transform:translateX(-100%);transition:transform .28s var(--ease);box-shadow:20px 0 50px rgba(0,0,0,.6)}.panel.open{transform:none}.composer-wrap{padding:0 10px 10px}.msg{padding:4px 12px}.msg .toolbar{right:12px}.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:65}}
</style>

<body>

<div class="auth-screen" id="auth-screen">
  <div class="auth-card">
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#00ffe0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></div>
      <h1>SLEEPY<span>CHAT</span></h1>
      <p>Communities &middot; Friends &middot; Vibes</p>
    </div>
    <div class="tabs">
      <button class="tab active" data-tab="login">Login</button>
      <button class="tab" data-tab="signup">Create Account</button>

/* Utils */
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
function log(){try{console.log.apply(console,["[Sleepy]"].concat([].slice.call(arguments)));}catch(e){}}
function hashHue(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return h;}

/* Avatar / status */
function avatarHTML(uid,size){
  var p=PROFILES[uid]; var s=size||36;
  var name=p?(p.display_name||p.username):"?";
  var initial=name.trim().slice(0,2).toUpperCase();
  var inner=(p&&p.avatar_url)?'<img src="'+esc(p.avatar_url)+'" alt="">':'<span>'+esc(initial)+'</span>';
  var hue=hashHue(uid||"?");
  var bg="linear-gradient(135deg,hsl("+hue+",80%,58%),hsl("+((hue+60)%360)+",80%,52%))";
  return '<div class="avatar" style="width:'+s+'px;height:'+s+'px;font-size:'+Math.round(s*.38)+'px;background:'+bg+'">'+inner+'</div>';
}
function statusDot(uid){
  if(!ONLINE.has(uid))return '<span class="status-dot s-offline"></span>';

}
function userLabel(uid){var p=PROFILES[uid];return p?(p.display_name||p.username):uid;}
function timeLabel(ts){return new Date(ts).toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});}
function dayLabel(d){
  var t=new Date(),y=new Date();y.setDate(t.getDate()-1);
  if(d.toDateString()===t.toDateString())return "Today";
  if(d.toDateString()===y.toDateString())return "Yesterday";
  return d.toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'});
}

    closeMenu();if(item&&item.onClick)item.onClick();
  });
  setTimeout(function(){document.addEventListener("click",function h2(ev){if(!m.contains(ev.target)){closeMenu();document.removeEventListener("click",h2,true);}},true);},0);
}

/* AUTH */
async function doSignup(email,password,username,display){
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))throw new Error("Enter a valid email address.");
  username=String(username||"").trim().toLowerCase();
  if(!/^[a-z0-9_]{3,24}$/.test(username))throw new Error("Username must be 3-24 chars: a-z, 0-9, underscore.");
  if(!password||password.length<6)throw new Error("Password must be at least 6 characters.");
  var ex=await sb.from('profiles').select('id').eq('username',username).maybeSingle();
  if(ex.data)throw new Error("That username is already taken.");
  var { data, error } = await sb.auth.signUp({email:email,password:password,options:{data:{username:username,display_name:display||username}}});
  if(error)throw error;
  return data;
}
async function doLogin(email,password){
  var { data, error } = await sb.auth.signInWithPassword({email:email,password:password});
  if(error)throw error;
  return data;
}
async function doLogout(){
  try{await sb.auth.signOut();}catch(e){}
  SESSION=null;ME=null;PROFILES={};CONVERSATIONS=[];SERVERS=[];CHANNELS=[];MESSAGES=[];
  CURRENT={type:"home",conv:null,server:null,channel:null};
  FRIENDS={accepted:[],incoming:[],outgoing:[]};ONLINE=new Set();UNREAD={};
  [globalMsgCh,presenceCh,friendsCh,typingCh,serversCh,channelsCh].forEach(function(ch){try{if(ch)sb.removeChannel(ch);}catch(e){}});
  globalMsgCh=presenceCh=friendsCh=typingCh=serversCh=channelsCh=null;
  showAuth();
}
async function checkUsername(u){
  if(!/^[a-z0-9_]{3,24}$/.test(u))return{ok:false,msg:"3-24 lowercase letters, numbers, underscore"};
  var { data } = await sb.from('profiles').select('id').eq('username',u).maybeSingle();
  return data?{ok:false,msg:"Already taken"}:{ok:true,msg:"Available"};
}
function showAuth(){$("#auth-screen").classList.remove("hidden");$("#app").classList.add("hidden");}
function showApp(){$("#auth-screen").classList.add("hidden");$("#app").classList.remove("hidden");}

/* PROFILES */
async function loadMe(){
  var { data, error } = await sb.from('profiles').select('*').eq('id', SESSION.user.id).maybeSingle();
  if(error){log("loadMe",error);return;}
  ME=data;if(ME)PROFILES[ME.id]=ME;
}
async function fetchProfiles(ids){
  var missing=(ids||[]).filter(function(id){return id&&!PROFILES[id];});
  if(!missing.length)return;
  var { data } = await sb.from('profiles').select('*').in('id', missing);
  (data||[]).forEach(function(p){PROFILES[p.id]=p;});
}
async function searchUsers(q){
  q=String(q||"").trim().replace(/^@/,'');
  if(!q)return[];
  var { data } = await sb.from('profiles').select('*').or('username.ilike.%'+q+'%,display_name.ilike.%'+q+'%').limit(20);
  (data||[]).forEach(function(p){PROFILES[p.id]=p;});
  return data||[];
}
async function updateProfile(patch){
  var { error } = await sb.from('profiles').update(patch).eq('id', ME.id);
  if(error)throw error;
  Object.keys(patch).forEach(function(k){ME[k]=patch[k];});
  PROFILES[ME.id]=ME;
  renderUserBar();renderPanel();renderChat(false);renderMembers();
}

/* FRIENDS */
async function loadFriends(){
  if(!ME)return;
  var { data } = await sb.from('friendships').select('*').or('user_id.eq.'+ME.id+',friend_id.eq.'+ME.id);
  FRIENDS={accepted:[],incoming:[],outgoing:[]};
  for(var i=0;i<(data||[]).length;i++){
    var f=data[i];
    var other=(f.user_id===ME.id)?f.friend_id:f.user_id;
    if(f.status==='accepted')FRIENDS.accepted.push({id:f.id,other:other});
    else if(f.status==='pending'&&f.requested_by!==ME.id)FRIENDS.incoming.push({id:f.id,other:other});
    else if(f.status==='pending'&&f.requested_by===ME.id)FRIENDS.outgoing.push({id:f.id,other:other});
  }
  var ids=[];
  FRIENDS.accepted.concat(FRIENDS.incoming,FRIENDS.outgoing).forEach(function(f){ids.push(f.other);});
  await fetchProfiles(ids);
}
async function sendFriendRequest(username){
  var clean=String(username||"").trim().replace(/^@/,'').toLowerCase();
  if(!clean)throw new Error("Type a username first.");
  var { data: target } = await sb.from('profiles').select('*').eq('username',clean).maybeSingle();
  if(!target)throw new Error("No user found with @"+clean);
  if(target.id===ME.id)throw new Error("You cannot add yourself.");
  var existing=[].concat(FRIENDS.accepted,FRIENDS.incoming,FRIENDS.outgoing).filter(function(f){return f.other===target.id;});
  if(existing.length)throw new Error("Already friends or request pending.");
  var { error } = await sb.from('friendships').insert({user_id:ME.id,friend_id:target.id,status:'pending',requested_by:ME.id});
  if(error)throw error;
  PROFILES[target.id]=target;
  await loadFriends();
}
async function acceptFriend(id){ var { error } = await sb.from('friendships').update({status:'accepted'}).eq('id',id); if(error)throw error; await loadFriends(); }
async function removeFriendship(id){ var { error } = await sb.from('friendships').delete().eq('id',id); if(error)throw error; await loadFriends(); }

/* SERVERS + CHANNELS */
async function loadServers(){
  if(!ME)return;
  var { data: sm } = await sb.from('server_members').select('server_id').eq('user_id', ME.id);
  var ids=(sm||[]).map(function(x){return x.server_id;});
  if(!ids.length){SERVERS=[];return;}
  var { data: srv } = await sb.from('servers').select('*').in('id', ids);
  SERVERS=srv||[];
}
async function loadServerMembers(serverId){
  var { data } = await sb.from('server_members').select('user_id').eq('server_id', serverId);
  var ids=(data||[]).map(function(x){return x.user_id;});
  await fetchProfiles(ids);
  return ids;
}
async function loadChannels(serverId){
  var { data } = await sb.from('channels').select('*').eq('server_id', serverId).order('position',{ascending:true});
  CHANNELS=data||[];
}
async function createServer(name){
  if(!name||!name.trim())throw new Error("Give your community a name.");
  var { data: srv, error } = await sb.from('servers').insert({name:name.trim(),owner_id:ME.id}).select().single();
  if(error)throw error;
  var { error: e2 } = await sb.from('server_members').insert({server_id:srv.id,user_id:ME.id});
  if(e2)throw e2;
  await sb.from('channels').insert([
    {server_id:srv.id,name:"general",type:"text",category:"Text Channels",topic:"General chat",position:0},
    {server_id:srv.id,name:"lounge",type:"voice",category:"Voice Channels",topic:"Voice hangout",position:1}
  ]);
  await loadServers();
  return srv;
}
async function inviteToServer(serverId, username){
  var clean=String(username||"").trim().replace(/^@/,'').toLowerCase();
  if(!clean)throw new Error("Type a username.");
  var { data: target } = await sb.from('profiles').select('*').eq('username',clean).maybeSingle();
  if(!target)throw new Error("No user found with @"+clean);
  if(target.id===ME.id)throw new Error("You are already in this server.");
  var { data: existing } = await sb.from('server_members').select('*').eq('server_id',serverId).eq('user_id',target.id).maybeSingle();
  if(existing)throw new Error(dnameFromProfile(target)+" is already a member.");
  var { error } = await sb.from('server_members').insert({server_id:serverId,user_id:target.id});
  if(error)throw error;
  PROFILES[target.id]=target;
  return target;
}
function dnameFromProfile(p){return p?(p.display_name||p.username):"User";}
async function createChannel(serverId, name, type, category){
  if(!name||!name.trim())throw new Error("Give the channel a name.");
  name=name.trim().toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9_-]/g,'');
  var { error } = await sb.from('channels').insert({
    server_id:serverId,name:name,type:type||'text',
    category:category||'Text Channels',position:CHANNELS.length
  });
  if(error)throw error;
}
async function deleteChannel(id){
  var { error } = await sb.from('channels').delete().eq('id', id);
  if(error)throw error;
}
async function leaveServer(serverId){
  var { error } = await sb.from('server_members').delete().eq('server_id',serverId).eq('user_id',ME.id);
  if(error)throw error;
}
async function deleteServer(id){
  var { error } = await sb.from('servers').delete().eq('id', id);
  if(error)throw error;
}

/* CONVERSATIONS */
async function loadConversations(){
  if(!ME)return;
  var { data: cms } = await sb.from('conversation_members').select('conversation_id').eq('user_id', ME.id);
  var ids=(cms||[]).map(function(c){return c.conversation_id;});
  if(!ids.length){CONVERSATIONS=[];return;}
  var { data: convs } = await sb.from('conversations').select('*').in('id', ids);
  var out=[];
  for(var i=0;i<(convs||[]).length;i++){
    var c=convs[i];
    var { data: members } = await sb.from('conversation_members').select('user_id').eq('conversation_id', c.id);
    c.memberIds=(members||[]).map(function(m){return m.user_id;});
    await fetchProfiles(c.memberIds);
    var { data: last } = await sb.from('messages').select('*').eq('conversation_id', c.id).order('id',{ascending:false}).limit(1);
    c.lastMessage=(last&&last[0])||null;
    out.push(c);
  }
  out.sort(function(a,b){
    var ta=a.lastMessage?new Date(a.lastMessage.created_at).getTime():new Date(a.created_at).getTime();
    var tb=b.lastMessage?new Date(b.lastMessage.created_at).getTime():new Date(b.created_at).getTime();
    return tb-ta;
  });
  CONVERSATIONS=out;
}
async function getOrCreateDM(otherId){
  var { data: myCms } = await sb.from('conversation_members').select('conversation_id').eq('user_id', ME.id);
  var myIds=(myCms||[]).map(function(c){return c.conversation_id;});
  if(myIds.length){
    var { data: theirCms } = await sb.from('conversation_members').select('conversation_id').eq('user_id', otherId).in('conversation_id', myIds);
    for(var i=0;i<(theirCms||[]).length;i++){
      var cid=theirCms[i].conversation_id;
      var { data: conv } = await sb.from('conversations').select('*').eq('id', cid).maybeSingle();
      if(!conv||conv.is_group)continue;
      var { count } = await sb.from('conversation_members').select('*',{count:'exact',head:true}).eq('conversation_id', cid);
      if(count===2)return conv;
    }
  }
  var { data: conv2, error: e1 } = await sb.from('conversations').insert({is_group:false,created_by:ME.id}).select().single();
  if(e1)throw e1;
  var { error: e2 } = await sb.from('conversation_members').insert([
    {conversation_id:conv2.id,user_id:ME.id},
    {conversation_id:conv2.id,user_id:otherId}
  ]);
  if(e2)throw e2;
  return conv2;
}
async function createGroupDM(name, memberIds){
  var ids=[ME.id].concat(memberIds).filter(function(v,i,a){return a.indexOf(v)===i;});
  if(ids.length<3)throw new Error("Pick at least two friends.");
  var { data: conv, error: e1 } = await sb.from('conversations').insert({is_group:true,name:name||"Group",created_by:ME.id}).select().single();
  if(e1)throw e1;
  var rows=ids.map(function(uid){return{conversation_id:conv.id,user_id:uid};});
  var { error: e2 } = await sb.from('conversation_members').insert(rows);
  if(e2)throw e2;
  return conv;
}

async function loadMessagesForChannel(channelId){

async function sendMessage(text){

async function deleteMessage(id){

/* REALTIME - global message subscription */
function subscribeGlobalMessages(){
  if(globalMsgCh){try{sb.removeChannel(globalMsgCh);}catch(e){}}
  globalMsgCh = sb.channel('global-messages')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},function(payload){
      var m=payload.new;
      // Is this for the currently visible target?
      var isCurrentConv = CURRENT.type==="dm" && CURRENT.conv && m.conversation_id===CURRENT.conv.id;
      var isCurrentChan = CURRENT.type==="server" && CURRENT.channel && m.channel_id===CURRENT.channel.id;
      if(isCurrentConv || isCurrentChan){
        if(!MESSAGES.some(function(x){return x.id===m.id;})){
          MESSAGES.push(m);
          renderChat(true);
        }
        return;
      }
      // Somewhere else: bump unread + update lists + toast
      var key = m.conversation_id || m.channel_id;
      UNREAD[key]=(UNREAD[key]||0)+1;
      if(m.sender_id!==ME.id){
        fetchProfiles([m.sender_id]).then(function(){
          var who=userLabel(m.sender_id);
          var preview=String(m.content||"").slice(0,60);
          toast("New message",""+who+": "+preview,"ok");
          if("Notification" in window && Notification.permission==="granted"){
            try{new Notification(who,{body:preview});}catch(e){}
          }
        });
        // If it's a DM we don't know about yet, reload
        if(m.conversation_id && !CONVERSATIONS.some(function(c){return c.id===m.conversation_id;})){
          loadConversations().then(function(){renderPanel();renderRail();});
        } else {
          // Update last-message preview
          if(m.conversation_id){
            var c=CONVERSATIONS.filter(function(x){return x.id===m.conversation_id;})[0];
            if(c)c.lastMessage=m;
          }
          renderPanel();
        }
      }
    })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'messages'},function(payload){
      var m=payload.new;
      var isCurrentConv = CURRENT.type==="dm" && CURRENT.conv && m.conversation_id===CURRENT.conv.id;
      var isCurrentChan = CURRENT.type==="server" && CURRENT.channel && m.channel_id===CURRENT.channel.id;
      if(isCurrentConv||isCurrentChan){
        for(var i=0;i<MESSAGES.length;i++){ if(MESSAGES[i].id===m.id){ MESSAGES[i]=m; break; } }
        renderChat(false);
      }
    })
    .subscribe(function(status){ log("global messages sub:", status); });
}

function subscribeTyping(target){

function renderChat(scroll){
  var body=$("#chat-body");
  if(CURRENT.type==="server"&&CURRENT.channel&&(CURRENT.channel.type==="voice")){
    body.innerHTML='<div class="empty" style="margin-top:12vh"><div class="big">'+SVG.vol+'</div><h2>'+esc(CURRENT.channel.name)+'</h2><p style="margin-top:8px">Voice channels coming soon.</p></div>';
    $("#composer-wrap").innerHTML="";
    $("#typing-bar").innerHTML="";
    return;
  }
  if(!MESSAGES.length){
    var title="";
    var intro="";
    if(CURRENT.type==="dm"&&CURRENT.conv){title=convTitle(CURRENT.conv);intro="Say hi to "+esc(title)+"!";}
    else if(CURRENT.type==="server"&&CURRENT.channel){title="#"+esc(CURRENT.channel.name);intro="Welcome to #"+esc(CURRENT.channel.name)+".";}
    else {title="Welcome to Sleepy-Chat";intro="Pick a conversation, or create a community with the + button.";}
    body.innerHTML='<div class="empty" style="margin-top:12vh"><div class="big">'+SVG.chat+'</div><h2>'+title+'</h2><p style="margin-top:8px">'+intro+'</p></div>';
    renderComposer();renderTyping();
    return;
  }
  var h="",lastDay="",lastAuthor=null,lastTs=0;
  for(var i=0;i<MESSAGES.length;i++){
    var m=MESSAGES[i];
    var d=new Date(m.created_at);
    var day=d.toDateString();
    if(day!==lastDay){h+='<div class="day-sep">'+dayLabel(d)+'</div>';lastDay=day;lastAuthor=null;}
    var grouped=lastAuthor===m.sender_id&&(d.getTime()-lastTs)<5*60*1000;
    h+=messageHTML(m,grouped);
    lastAuthor=m.sender_id;lastTs=d.getTime();
  }
  body.innerHTML=h;
  if(scroll!==false)requestAnimationFrame(function(){body.scrollTop=body.scrollHeight;});
  renderComposer();
  renderTyping();
}
function messageHTML(m,grouped){
  if(m.deleted)return '<div class="msg deleted"><div style="width:36px;flex:none"></div><div class="body"><div class="content">This message was deleted.</div></div></div>';
  var p=PROFILES[m.sender_id]||{username:'unknown',display_name:'Unknown'};
  var mine=m.sender_id===ME.id;
  var h='<div class="msg" data-msg="'+m.id+'">';
  if(grouped)h+='<div style="width:36px;flex:none"></div>';
  else h+='<div style="position:relative">'+avatarHTML(m.sender_id,36)+statusDot(m.sender_id)+'</div>';
  h+='<div class="body">';
  if(!grouped){
    h+='<div class="head"><span class="author" data-user="'+esc(m.sender_id)+'">'+esc(p.display_name||p.username)+'</span>'+
      '<span class="uid">@'+esc(p.username)+'</span>'+
      '<span class="time">'+timeLabel(m.created_at)+'</span>'+
      (m.edited?'<span class="edited">(edited)</span>':'')+'</div>';
  }
  h+='<div class="content">'+esc(m.content||'')+'</div>';
  h+='</div>';
  h+='<div class="toolbar">';
  if(mine)h+='<button data-act="edit-msg" data-msg="'+m.id+'">'+SVG.pencil+'</button>';
  if(mine)h+='<button class="danger" data-act="del-msg" data-msg="'+m.id+'">'+SVG.trash+'</button>';
  h+='</div></div>';
  return h;
}
function renderComposer(){
  var wrap=$("#composer-wrap");
  if(CURRENT.type==="server"&&CURRENT.channel&&CURRENT.channel.type!=="text"&&CURRENT.channel.type!=="announcement"){
    wrap.innerHTML="";return;
  }
  if(CURRENT.type==="home"){wrap.innerHTML="";return;}
  var editing=!!UI.editing;
  var draft="";
  if(editing){
    var em=MESSAGES.filter(function(m){return m.id===UI.editing;})[0];
    draft=em?em.content:"";
  }
  var ph="Message ";
  if(CURRENT.type==="dm") ph+="#"+convTitle(CURRENT.conv);
  else if(CURRENT.type==="server"&&CURRENT.channel) ph+="#"+CURRENT.channel.name;
  wrap.innerHTML='<div class="composer"><textarea id="composer-input" rows="1" placeholder="'+esc(ph)+'">'+esc(draft)+'</textarea>'+
    '<button class="cbtn send" id="send-btn">'+SVG.send+'</button></div>';
  var ta=$("#composer-input");
  autosize(ta);
  ta.addEventListener("input",function(){autosize(ta);broadcastTyping();});
  ta.addEventListener("keydown",function(e){
    if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();doSendFromComposer();}
    if(e.key==="Escape"&&UI.editing){UI.editing=null;renderComposer();}
  });
  $("#send-btn").addEventListener("click",doSendFromComposer);
  if(editing)ta.focus();
}
function autosize(ta){if(!ta)return;ta.style.height="auto";ta.style.height=Math.min(ta.scrollHeight,190)+"px";}
async function doSendFromComposer(){
  var ta=$("#composer-input");if(!ta)return;
  var text=ta.value.trim();if(!text)return;
  try{
    if(UI.editing){await editMessage(UI.editing,text);UI.editing=null;}
    else {await sendMessage(text);}
    ta.value="";autosize(ta);
  }catch(e){toast("Failed to send",e.message||String(e),"err");}
}
function renderTyping(){
  var el=$("#typing-bar");

  if(!ids.length){el.innerHTML="";return;}
  var names=ids.map(userLabel);
  var txt=names.length===1?names[0]+" is typing":names.length===2?names[0]+" and "+names[1]+" are typing":names.length+" people are typing";
  el.innerHTML='<span class="dots"><i></i><i></i><i></i></span><span>'+esc(txt)+'...</span>';
}

  ids.sort(function(a,b){

  });

function openFriends(){
  var tab="all";
  function tabBtn(id,label,count){
    return '<button data-ftab="'+id+'" style="padding:8px 14px;border-radius:6px;font-size:12.5px;font-weight:600;'+
      (tab===id?'background:var(--surface2);color:var(--cyan);box-shadow:inset 0 0 0 1px rgba(0,255,224,.2)':'color:var(--text3)')+'">'+
      label+(count?' ('+count+')':'')+'</button>';
  }
  function row(otherId, actions){
    var p=PROFILES[otherId]||{username:'unknown',display_name:'Unknown'};
    return '<div style="display:flex;align-items:center;gap:12px;padding:10px;border-radius:10px;background:rgba(255,255,255,.03)">'+
      '<div style="position:relative">'+avatarHTML(otherId,40)+statusDot(otherId)+'</div>'+

      '<div style="font-size:12px;color:var(--text3)">@'+esc(p.username)+' - '+(ONLINE.has(otherId)?"online":"offline")+'</div></div>'+
      '<div style="display:flex;gap:6px">'+actions+'</div></div>';
  }
  function draw(){
    var f=FRIENDS;
    var h='<div style="display:flex;gap:3px;background:var(--void);padding:4px;border-radius:8px;border:1px solid var(--border);margin-bottom:20px;overflow-x:auto">'+
      tabBtn("all","All",f.accepted.length)+
      tabBtn("online","Online",f.accepted.filter(function(x){return ONLINE.has(x.other);}).length)+
      tabBtn("pending","Pending",f.incoming.length)+
      tabBtn("add","Add Friend")+'</div>';
    if(tab==="add"){
      h+='<div class="field"><label>Add by username</label><div style="display:flex;gap:8px"><input id="fr-input" placeholder="username" style="flex:1"><button class="btn primary" id="fr-send">Send</button></div></div>';
    }else if(tab==="pending"){
      h+='<h4 style="margin-bottom:10px;font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em">Incoming</h4>';
      if(!f.incoming.length)h+='<div class="empty" style="padding:14px">Nothing incoming.</div>';
      f.incoming.forEach(function(x){h+=row(x.other,'<button class="btn sm primary" data-fr-accept="'+x.id+'">Accept</button><button class="btn sm danger" data-fr-reject="'+x.id+'">Decline</button>');});
      h+='<h4 style="margin:18px 0 10px;font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em">Outgoing</h4>';
      if(!f.outgoing.length)h+='<div class="empty" style="padding:14px">Nothing outgoing.</div>';
      f.outgoing.forEach(function(x){h+=row(x.other,'<button class="btn sm" data-fr-cancel="'+x.id+'">Cancel</button>');});
    }else{
      var list=f.accepted.slice();
      if(tab==="online")list=list.filter(function(x){return ONLINE.has(x.other);});
      if(!list.length)h+='<div class="empty">Nothing here yet.</div>';
      list.forEach(function(x){
        h+=row(x.other,'<button class="btn sm primary" data-fr-dm="'+esc(x.other)+'">Message</button>'+
          '<button class="btn sm danger" data-fr-remove="'+x.id+'">Remove</button>');
      });
    }
    $("#modal-body").innerHTML=h;
    $$("[data-ftab]").forEach(function(b){b.onclick=function(){tab=b.dataset.ftab;draw();};});
    var sb=$("#fr-send");
    if(sb)sb.onclick=async function(){
      var v=($("#fr-input").value||"").trim();
      try{await sendFriendRequest(v);toast("Sent","Friend request sent.","ok");draw();}
      catch(e){toast("Failed",e.message||String(e),"err");}
    };
    var inp=$("#fr-input");
    if(inp)inp.addEventListener("keydown",function(e){if(e.key==="Enter")$("#fr-send").click();});
  }
  openModal("Friends",'<div id="modal-body"></div>',{wide:true});
  draw();
  $("#modal-root").addEventListener("click",async function(e){
    var t=e.target.closest("[data-fr-accept],[data-fr-reject],[data-fr-cancel],[data-fr-remove],[data-fr-dm]");
    if(!t)return;var d=t.dataset;
    try{
      if(d.frAccept)await acceptFriend(d.frAccept);
      if(d.frReject)await removeFriendship(d.frReject);
      if(d.frCancel)await removeFriendship(d.frCancel);
      if(d.frRemove)await removeFriendship(d.frRemove);
      if(d.frDm){closeModal();await openDMWith(d.frDm);return;}
      draw();
    }catch(err){toast("Error",err.message||String(err),"err");}
  });
}

function resizeImage(file,max,cb){
  var r=new FileReader();
  r.onload=function(ev){
    var img=new Image();
    img.onload=function(){
      var canvas=document.createElement("canvas");
      var scale=Math.min(1,max/Math.max(img.width,img.height));
      canvas.width=Math.round(img.width*scale);
      canvas.height=Math.round(img.height*scale);
      canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
      cb(canvas.toDataURL("image/jpeg",0.82));
    };
    img.src=ev.target.result;
  };
  r.readAsDataURL(file);
}

    var btn=$("#li-submit");btn.disabled=true;btn.textContent="Signing in...";
    try{
      await doLogin($("#li-email").value.trim(),$("#li-pass").value);
      await boot();
    }catch(ex){
      err.textContent=ex.message||String(ex);
    }finally{btn.disabled=false;btn.textContent="Sign In";}
  });
  $("#form-signup").addEventListener("submit",async function(e){
    e.preventDefault();
    var err=$("#su-err");err.textContent="";var ok=$("#su-ok");ok.textContent="";
    var btn=$("#su-submit");btn.disabled=true;btn.textContent="Creating...";

  $("#forgot-link").addEventListener("click",async function(e){

}
document.addEventListener("click",async function(e){
  var t=e.target;
  var rail=t.closest("[data-rail]");
  if(rail){
    var a=rail.dataset.rail;
    if(a==="home")await goHome();
    if(a==="create-server")openCreateServer();
    if(a==="find")openFindUsers();
    return;
  }
  var srvBtn=t.closest("[data-server]");
  if(srvBtn){await goServer(srvBtn.dataset.server);return;}
  var cv=t.closest("[data-conv]");
  if(cv){await goConversation(cv.dataset.conv);return;}
  var ch=t.closest("[data-channel]");
  if(ch&&!t.closest("[data-addchannel]")){await goChannel(ch.dataset.channel);return;}
  var addch=t.closest("[data-addchannel]");
  if(addch){openAddChannel(addch.dataset.addchannel);return;}
  var act=t.closest("[data-act]");
  if(act){
    var aa=act.dataset.act;
    if(aa==="toggle-panel"){UI.panelOpen=!UI.panelOpen;syncMobile();return;}
    if(aa==="friends"){openFriends();return;}
    if(aa==="find"){openFindUsers();return;}
    if(aa==="newgroup"){openNewGroup();return;}
    if(aa==="settings"){openSettings();return;}
    if(aa==="status"){var r=act.getBoundingClientRect();openStatusMenu(r.left-160,r.top-180);return;}
    if(aa==="logout"){await doLogout();return;}
    if(aa==="view-profile"){openProfile(act.dataset.user);return;}
    if(aa==="invite-server"){openInviteServer();return;}
    if(aa==="leave-server"){
      confirmModal("Leave "+CURRENT.server.name+"?","You can rejoin if someone invites you.",async function(){
        try{await leaveServer(CURRENT.server.id);await loadServers();await goHome();toast("Left","","ok");}
        catch(err){toast("Error",err.message||String(err),"err");}
      },true);
      return;
    }
    if(aa==="delete-server"){
      var sid=CURRENT.server.id;
      confirmModal("Delete server?","All channels and messages will be deleted.",async function(){
        try{await deleteServer(sid);await loadServers();await goHome();toast("Deleted","","ok");}
        catch(err){toast("Error",err.message||String(err),"err");}
      },true);
      return;
    }
    if(aa==="delete-channel"&&CURRENT.channel){
      var cid=CURRENT.channel.id;
      confirmModal("Delete #"+CURRENT.channel.name+"?","All messages will be deleted.",async function(){
        try{
          await deleteChannel(cid);
          await loadChannels(CURRENT.server.id);
          var first=CHANNELS.filter(function(c){return c.type==="text";})[0]||CHANNELS[0];
          CURRENT.channel=first||null;
          if(first)await loadMessagesForChannel(first.id);
          renderAll();
        }catch(err){toast("Error",err.message||String(err),"err");}
      },true);
      return;
    }
    if(aa==="toggle-members"){UI.showMembers=!UI.showMembers;UI.panelOpen=false;syncMobile();renderAll();return;}
    if(aa==="edit-msg"){
      UI.editing=Number(act.dataset.msg);renderComposer();
      var ta=$("#composer-input");if(ta){ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);}
      return;
    }
    if(aa==="del-msg"){
      var id=Number(act.dataset.msg);
      confirmModal("Delete message?","This cannot be undone.",async function(){
        try{await deleteMessage(id);}catch(ex){toast("Error",ex.message||String(ex),"err");}
      },true);
      return;
    }
  }
  var usr=t.closest("[data-user]");
  if(usr){openProfile(usr.dataset.user);return;}
  var mbr=t.closest("[data-member]");
  if(mbr){openProfile(mbr.dataset.member);return;}
  var ph=t.closest("#panel-head");
  if(ph&&CURRENT.type==="server"&&CURRENT.server){
    var r2=ph.getBoundingClientRect();
    openServerMenu(r2.left,r2.bottom+4);
    return;
  }
});
document.addEventListener("contextmenu",function(e){
  var sb=null,t=null;
  var srvBtn=e.target.closest("[data-server]");
  if(srvBtn&&CURRENT.server&&srvBtn.dataset.server===CURRENT.server.id){
    e.preventDefault();
    openServerMenu(e.clientX,e.clientY);
  }
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){
    closeMenu();
    if($("#modal-root")&&$("#modal-root").innerHTML)closeModal();
    UI.panelOpen=false;syncMobile();
  }
});

/* BOOT */
async function boot(){
  var { data: { session } } = await sb.auth.getSession();
  if(!session||!session.user){showAuth();return;}
  SESSION=session;
  await loadMe();
  if(!ME){toast("Account incomplete","Log out and try again.","err");await doLogout();return;}
  await Promise.all([loadFriends(),loadServers(),loadConversations()]);
  subscribePresence();
  subscribeFriendships();
  subscribeServers();
  subscribeGlobalMessages();
  renderAll();
  if(SERVERS.length) await goServer(SERVERS[0].id);
  else if(CONVERSATIONS.length) await goConversation(CONVERSATIONS[0].id);
  else CURRENT={type:"home",conv:null,server:null,channel:null};
  log("boot complete for",ME.username);
}
wireAuth();
boot();
sb.auth.onAuthStateChange(function(ev){
  if(ev==="SIGNED_OUT")showAuth();
});

<style>
