<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Chatter's Paradise — Built By Gen-Z For Gen-Z</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3CradialGradient id='g'%3E%3Cstop offset='0%25' stop-color='%2300ffe0'/%3E%3Cstop offset='100%25' stop-color='%23b44aff'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='42' fill='url(%23g)'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--void:#0a0a0f;--surface:#12121a;--surface2:#1a1a26;--surface3:#22222f;--border:#2a2a3a;--border2:#3a3a4d;--accent:#00ffe0;--accent2:#00c9b4;--purple:#b44aff;--rose:#ff2d6f;--green:#00e676;--amber:#ffab00;--gold:#ffd700;--text:#e8e8f0;--text2:#8f8fa8;--text3:#5a5a72;--glow:0 0 14px rgba(0,255,224,.35);--ease:cubic-bezier(.22,.61,.36,1)}
[data-theme="purple"]{--accent:#b44aff;--accent2:#8a2dd6;--glow:0 0 14px rgba(180,74,255,.4)}
[data-theme="pink"]{--accent:#ff2d6f;--accent2:#d6005a;--glow:0 0 14px rgba(255,45,111,.4)}
[data-theme="green"]{--accent:#00e676;--accent2:#00b85c;--glow:0 0 14px rgba(0,230,118,.4)}
[data-theme="orange"]{--accent:#ff9500;--accent2:#d67a00;--glow:0 0 14px rgba(255,149,0,.4)}
[data-theme="blue"]{--accent:#3d8bff;--accent2:#2266d6;--glow:0 0 14px rgba(61,139,255,.4)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',system-ui,sans-serif;font-size:14px;background:var(--void);color:var(--text);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(900px 600px at 12% -10%,rgba(0,255,224,.06),transparent 60%),radial-gradient(900px 700px at 95% 110%,rgba(180,74,255,.07),transparent 60%)}
button,input,textarea,select{font:inherit;color:inherit;outline:none;border:none;background:none}
button{cursor:pointer;touch-action:manipulation}
a{color:var(--accent);text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#2c2c3d;border-radius:99px}
.hidden{display:none!important}
h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:8px;font-weight:600;font-size:13px;background:var(--surface2);color:var(--text);border:1px solid var(--border);transition:all .18s var(--ease);white-space:nowrap}
.btn:hover{background:var(--surface3);border-color:var(--border2);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04120f;border-color:transparent;font-weight:700}
.btn.primary:hover{box-shadow:var(--glow)}
.btn.danger{background:rgba(255,45,111,.12);color:#ff7aa2;border-color:rgba(255,45,111,.35)}
.btn.sm{padding:6px 11px;font-size:12px}.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3)}
.field input,.field textarea,.field select{width:100%;padding:11px 13px;border-radius:8px;background:var(--void);border:1px solid var(--border);color:var(--text);transition:border-color .18s,box-shadow .18s}
.field textarea{resize:vertical;min-height:70px}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,255,224,.12)}
.field .hint{font-size:11px;color:var(--text3)}
.err{font-size:12.5px;border-radius:8px;min-height:0}
.err:not(:empty){padding:10px 13px;background:rgba(255,45,111,.12);border:1px solid rgba(255,45,111,.35);color:#ff8aa8;font-weight:500;margin-top:12px}
.ok{font-size:12.5px;border-radius:8px;min-height:0}
.ok:not(:empty){padding:10px 13px;background:rgba(0,230,118,.1);border:1px solid rgba(0,230,118,.3);color:#8affb8;font-weight:500;margin-top:12px}
.avatar{border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;color:#06120f;overflow:hidden;position:relative;user-select:none}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.status-dot{width:11px;height:11px;border-radius:50%;border:2.5px solid var(--surface);position:absolute;right:-1px;bottom:-1px}
.s-online{background:var(--green);box-shadow:0 0 8px rgba(0,230,118,.7)}
.s-idle{background:var(--amber)}.s-dnd{background:var(--rose)}.s-offline{background:#4a4a5e}
.role-tag{display:inline-block;font-size:8.5px;padding:1px 6px;border-radius:99px;text-transform:uppercase;font-weight:800;letter-spacing:.06em;margin-left:5px;vertical-align:middle}
.role-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;flex:none}

/* AUTH */
.auth-screen{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;overflow-y:auto;background:radial-gradient(700px 500px at 20% 10%,rgba(0,255,224,.1),transparent 60%),radial-gradient(700px 500px at 85% 90%,rgba(180,74,255,.13),transparent 60%),var(--void)}
.stars{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.stars::before,.stars::after{content:'';position:absolute;inset:0;background-image:radial-gradient(1.5px 1.5px at 10% 20%,rgba(255,255,255,.8),transparent),radial-gradient(1px 1px at 30% 60%,rgba(0,255,224,.6),transparent),radial-gradient(1.5px 1.5px at 50% 30%,rgba(255,255,255,.7),transparent);animation:starTwinkle 4s ease-in-out infinite alternate}
.stars::after{animation-delay:-2s;animation-duration:6s}
@keyframes starTwinkle{0%{opacity:.35;transform:scale(1)}100%{opacity:1;transform:scale(1.05)}}
.floating-orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.4;pointer-events:none;z-index:0;animation:orbFloat 18s ease-in-out infinite}
.floating-orb.o1{width:320px;height:320px;background:var(--accent);top:-80px;left:-80px}
.floating-orb.o2{width:400px;height:400px;background:var(--purple);bottom:-120px;right:-100px;animation-delay:-6s}
.floating-orb.o3{width:220px;height:220px;background:var(--rose);top:40%;right:-60px;animation-delay:-12s;opacity:.25}
@keyframes orbFloat{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(40px,-30px) scale(1.08)}66%{transform:translate(-30px,40px) scale(.95)}}
.auth-card{position:relative;z-index:1;width:100%;max-width:460px;background:rgba(18,18,26,.92);backdrop-filter:blur(24px);border:1px solid var(--border);border-radius:24px;padding:34px 28px;box-shadow:0 30px 90px rgba(0,0,0,.7);animation:cardIn .5s var(--ease) both}
@keyframes cardIn{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:none}}
.brand{text-align:center;margin-bottom:22px}
.brand-mark{width:76px;height:76px;margin:0 auto 14px;border-radius:24px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(0,255,224,.16),rgba(180,74,255,.16));border:1px solid rgba(0,255,224,.3);animation:markPulse 3s ease-in-out infinite}
.brand-mark svg{width:44px;height:44px}
@keyframes markPulse{0%,100%{box-shadow:0 0 20px rgba(0,255,224,.35)}50%{box-shadow:0 0 40px rgba(0,255,224,.6),0 0 70px rgba(180,74,255,.45)}}
.brand h1{font-size:28px;letter-spacing:.02em;font-weight:800;line-height:1.15}
.brand h1 span{color:var(--accent);text-shadow:0 0 24px rgba(0,255,224,.7);display:block;font-size:20px;letter-spacing:.35em;margin-top:2px}
.tagline{display:flex;flex-wrap:wrap;justify-content:center;gap:1px;font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;margin-top:12px;line-height:1.6}
.tagline .tchar{display:inline-block;background:linear-gradient(135deg,#00ffe0,#b44aff,#ff2d6f,#00ffe0,#b44aff);background-size:400% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:charPop .7s cubic-bezier(.34,1.56,.64,1) both,gradientShift 4s linear infinite;animation-delay:calc(var(--i) * 30ms),0s}
.tagline .tspace{display:inline-block;width:6px}
@keyframes charPop{0%{opacity:0;transform:translateY(16px) scale(.3) rotate(-15deg)}60%{opacity:1;transform:translateY(-3px) scale(1.18) rotate(3deg)}100%{opacity:1;transform:none}}
@keyframes gradientShift{0%{background-position:0% 50%}100%{background-position:400% 50%}}
.saved-accounts{margin-bottom:20px;padding-bottom:18px;border-bottom:1px solid var(--border)}
.sa-label{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.sa-label::after{content:'';flex:1;height:1px;background:var(--border)}
.sa-list{display:flex;flex-direction:column;gap:6px}
.sa-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--surface2);border:1px solid var(--border);transition:all .15s;text-align:left;width:100%}
.sa-item:hover{background:var(--surface3);border-color:var(--accent);transform:translateX(3px)}
.sa-item .sa-info{flex:1;min-width:0}
.sa-item .sa-name{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sa-item .sa-user{font-size:11px;color:var(--text3)}
.sa-item .sa-del{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:16px;flex:none}
.sa-item .sa-del:hover{background:rgba(255,45,111,.15);color:var(--rose)}
.sa-switch{text-align:center;margin-top:12px;font-size:12px;color:var(--text3)}
.sa-switch button{color:var(--accent);font-weight:600;padding:4px 8px;border-radius:6px}
.sa-switch button:hover{background:rgba(0,255,224,.1)}
.tabs{display:flex;gap:4px;background:var(--void);padding:4px;border-radius:10px;margin-bottom:20px;border:1px solid var(--border)}
.tab{flex:1;padding:10px;border-radius:7px;font-size:13px;font-weight:600;color:var(--text3);transition:all .2s}
.tab.active{background:var(--surface2);color:var(--accent);box-shadow:inset 0 0 0 1px rgba(0,255,224,.22)}
.divider{display:flex;align-items:center;gap:12px;color:var(--text3);font-size:10.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;margin:16px 0}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.google-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px;border-radius:8px;background:#fff;color:#1f1f1f;font-weight:600;font-size:13.5px;border:1px solid #ddd;transition:all .18s}
.google-btn:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(255,255,255,.15)}
.google-btn svg{width:18px;height:18px}

/* APP */
.app{position:relative;z-index:1;display:grid;grid-template-columns:74px 260px 1fr 240px;height:100vh;height:100dvh}
.app.hide-members{grid-template-columns:74px 260px 1fr}
.app>*{min-height:0;min-width:0}
.rail{background:linear-gradient(180deg,#0c0c13,#0a0a0f);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0;overflow-y:auto;overflow-x:hidden}
.rail-sep{width:34px;height:1px;background:var(--border);flex:none;margin:3px 0}
.rail-btn{position:relative;width:48px;height:48px;flex:none;border-radius:16px;display:flex;align-items:center;justify-content:center;background:var(--surface);color:var(--accent);transition:all .22s var(--ease);overflow:hidden;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px}
.rail-btn:hover{border-radius:14px;box-shadow:var(--glow);transform:translateY(-2px)}
.rail-btn.active{border-radius:14px;box-shadow:var(--glow)}
.rail-btn.active::before{content:'';position:absolute;left:-10px;top:50%;transform:translateY(-50%);width:4px;height:26px;border-radius:0 4px 4px 0;background:var(--accent);box-shadow:var(--glow)}
.rail-btn img{width:100%;height:100%;object-fit:cover}
.rail-btn svg{width:22px;height:22px}
.rail-btn.dashed{background:transparent;border:1.5px dashed rgba(0,255,224,.35)}
.rail-btn.dashed:hover{border-style:solid;background:rgba(0,255,224,.1)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--rose);color:#fff;font-size:10px;font-weight:700}
.badge.ping{background:linear-gradient(135deg,var(--rose),var(--purple));animation:pingPulse 1s infinite}
@keyframes pingPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.panel{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column}
.panel-head{height:50px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 14px;border-bottom:1px solid var(--border);font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;gap:6px}
.panel-head .ttl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.panel-head .hbtn{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text3);flex:none;transition:all .15s}
.panel-head .hbtn:hover{background:rgba(255,255,255,.07);color:var(--accent)}
.panel-head .hbtn svg{width:15px;height:15px}
.panel-body{flex:1;min-height:0;overflow-y:auto;padding:10px 8px 14px}
.panel-section{margin-bottom:16px}
.panel-label{padding:6px 8px;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);display:flex;align-items:center;gap:6px}
.panel-label .add{margin-left:auto;opacity:.6;transition:opacity .15s;cursor:pointer;width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--text3)}
.panel-label .add:hover{opacity:1;background:rgba(255,255,255,.07);color:var(--accent)}
.row{position:relative;display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:8px;cursor:pointer;color:var(--text2);font-size:13.5px;font-weight:500;transition:background .14s,color .14s;width:100%;text-align:left}
.row:hover{background:rgba(255,255,255,.045);color:var(--text)}
.row.active{background:var(--surface2);color:#fff}
.row.active::before{content:'';position:absolute;left:-8px;top:50%;transform:translateY(-50%);width:3px;height:60%;border-radius:0 3px 3px 0;background:var(--accent);box-shadow:var(--glow)}
.row .txt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:4px}
.row .sub{font-size:11px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.row svg{width:16px;height:16px;flex:none;opacity:.75}
.row .lock-ico{font-size:11px;opacity:.7}
.user-bar{flex:none;height:62px;display:flex;align-items:center;gap:9px;padding:0 10px;background:rgba(10,10,15,.55);border-top:1px solid var(--border)}
.user-bar .info{flex:1;min-width:0;cursor:pointer;border-radius:6px;padding:3px 5px;transition:background .15s}
.user-bar .info:hover{background:rgba(255,255,255,.05)}
.user-bar .nm{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-bar .uid{font-size:10.5px;color:var(--text3)}
.user-bar .ctl{width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:all .15s}
.user-bar .ctl:hover{background:rgba(255,255,255,.07);color:var(--accent)}
.user-bar .ctl svg{width:16px;height:16px}

/* CHAT */
.chat{display:flex;flex-direction:column;background:var(--void);position:relative}
.chat-head{height:50px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--border);background:rgba(10,10,15,.7);backdrop-filter:blur(12px)}
.chat-head .title{display:flex;align-items:center;gap:8px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;min-width:0}
.chat-head .title svg{width:18px;height:18px;flex:none;opacity:.75}
.chat-head .title .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-head .topic{font-size:12px;color:var(--text3);border-left:1px solid var(--border);padding-left:10px;margin-left:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-head .spacer{flex:1}
.chat-head .hbtn{width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:all .15s}
.chat-head .hbtn:hover{background:var(--surface2);color:var(--accent)}
.chat-head .hbtn svg{width:17px;height:17px}
.chat-body{flex:1;min-height:0;overflow-y:auto;padding:16px 0 8px}
.empty{padding:40px 20px;text-align:center;color:var(--text3);font-size:13px}
.empty .big{width:64px;height:64px;margin:0 auto 12px;border-radius:20px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(0,255,224,.14),rgba(180,74,255,.14));border:1px solid rgba(0,255,224,.22)}
.empty .big svg{width:30px;height:30px;color:var(--accent)}
.empty h2{font-size:20px;color:var(--text);margin-bottom:6px;font-family:'Space Grotesk'}
.msg{position:relative;display:flex;gap:13px;padding:4px 20px;transition:background .12s}
.msg:hover{background:rgba(255,255,255,.022)}
.msg.pinged{background:rgba(255,171,0,.06);border-left:3px solid var(--amber);padding-left:17px}
.msg .body{flex:1;min-width:0}
.msg .head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.msg .author{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center}
.msg .author:hover{text-decoration:underline}
.msg .uid{font-size:10.5px;color:var(--text3);background:rgba(0,255,224,.07);padding:1px 6px;border-radius:5px;font-family:ui-monospace,monospace}
.msg .time{font-size:10.5px;color:var(--text3);font-family:ui-monospace,monospace}
.msg .edited{font-size:10px;color:var(--text3)}
.msg .ping-flag{font-size:9px;color:var(--amber);font-weight:800;text-transform:uppercase;letter-spacing:.05em;background:rgba(255,171,0,.15);padding:1px 6px;border-radius:99px}
.msg .content{font-size:14px;color:#dcdce8;word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap;margin-top:1px}
.msg .content .mention{background:rgba(0,255,224,.18);color:var(--accent);padding:1px 5px;border-radius:4px;font-weight:600}
.msg .content .mention.mine{background:rgba(255,171,0,.25);color:var(--amber);animation:mentionFlash 1.5s}
.msg .content .mention.role{background:rgba(180,74,255,.2);color:var(--purple)}
@keyframes mentionFlash{0%,100%{background:rgba(255,171,0,.25)}50%{background:rgba(255,171,0,.45)}}
.msg.deleted .content{color:var(--text3);font-style:italic}
.msg .toolbar{position:absolute;top:-12px;right:22px;display:none;align-items:center;gap:1px;background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:2px;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:5}
.msg:hover .toolbar{display:flex}
.msg.tools-open .toolbar{display:flex}
.msg .toolbar button{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:all .13s}
.msg .toolbar button:hover{background:rgba(0,255,224,.12);color:var(--accent)}
.msg .toolbar button.danger:hover{background:rgba(255,45,111,.15);color:#ff7aa2}
.msg .toolbar svg{width:15px;height:15px}
.day-sep{display:flex;align-items:center;gap:12px;padding:14px 20px 8px;color:var(--text3);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.day-sep::before,.day-sep::after{content:'';flex:1;height:1px;background:var(--border)}
.typing-bar{flex:none;height:22px;padding:0 20px;font-size:12px;color:var(--text3);display:flex;align-items:center;gap:7px}
.dots{display:inline-flex;gap:3px}
.dots i{width:4px;height:4px;border-radius:50%;background:var(--accent);display:block;animation:tdot 1.3s infinite}
.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}
@keyframes tdot{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-3px);opacity:1}}
.composer-wrap{flex:none;padding:0 20px 18px;position:relative}
.composer{display:flex;align-items:flex-end;gap:6px;padding:9px 11px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;transition:border-color .2s,box-shadow .2s}
.composer:focus-within{border-color:rgba(0,255,224,.4);box-shadow:0 0 0 3px rgba(0,255,224,.07)}
.composer.locked{opacity:.6}
.composer textarea{flex:1;resize:none;max-height:190px;min-height:22px;font-size:16px;line-height:1.5;padding:3px 0;background:none}
.composer textarea::placeholder{color:var(--text3)}
.composer .cbtn{width:34px;height:34px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--text3);transition:all .15s;flex:none;font-size:17px}
.composer .cbtn:hover{background:rgba(255,255,255,.07);color:var(--accent)}
.composer .cbtn svg{width:17px;height:17px}
.composer .send{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04120f;border-radius:8px;width:34px;height:34px}
.composer .send:hover{box-shadow:var(--glow);color:#04120f}
.emoji-picker{position:absolute;bottom:74px;right:12px;width:320px;max-height:260px;overflow-y:auto;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:8px;display:grid;grid-template-columns:repeat(8,1fr);gap:2px;box-shadow:0 20px 50px rgba(0,0,0,.7);z-index:10}
.emoji-picker button{width:100%;aspect-ratio:1;border-radius:6px;font-size:20px;display:flex;align-items:center;justify-content:center;transition:all .1s;line-height:1}
.emoji-picker button:hover{background:var(--surface3);transform:scale(1.12)}
.members{background:var(--surface);border-left:1px solid var(--border);overflow-y:auto;padding:14px 10px}
.app.hide-members .members{display:none}
.mgroup{margin-bottom:18px}
.mgroup .glabel{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);padding:0 8px 7px}
.member{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;cursor:pointer;transition:background .14s}
.member:hover{background:rgba(255,255,255,.05)}
.member.offline{opacity:.5}
.member .nm{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center}
.member .uid{font-size:11px;color:var(--text3)}

/* MODALS */
.overlay{position:fixed;inset:0;z-index:300;background:rgba(4,4,8,.75);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.modal{width:100%;max-width:520px;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:0 30px 90px rgba(0,0,0,.7);max-height:88vh;display:flex;flex-direction:column;animation:mIn .26s var(--ease) both}
.modal.wide{max-width:720px}
@keyframes mIn{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}
.modal-head{flex:none;display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:17px}
.modal-body{padding:22px;overflow-y:auto;flex:1}
.modal-foot{flex:none;display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--border);background:rgba(0,0,0,.15)}
.xbtn{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text3);transition:all .15s}
.xbtn:hover{background:var(--surface2);color:var(--text)}
.xbtn svg{width:18px;height:18px}
#toasts{position:fixed;top:20px;right:20px;z-index:500;display:flex;flex-direction:column;gap:9px;pointer-events:none;max-width:340px}
.toast{pointer-events:auto;min-width:230px;max-width:340px;padding:12px 15px;background:rgba(26,26,38,.97);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:10px;font-size:13px;box-shadow:0 14px 40px rgba(0,0,0,.6);animation:tInTop .3s var(--ease) both;backdrop-filter:blur(12px)}
@keyframes tInTop{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
.toast.err{border-left-color:var(--rose)}.toast.ok{border-left-color:var(--green)}.toast.ping{border-left-color:var(--amber);border-left-width:4px}
.toast .tt{font-weight:700;font-size:12.5px;margin-bottom:2px}
.toast .tb{color:var(--text2);font-size:12.5px}
.mobile-only{display:none}

/* SERVER SETTINGS TABS */
.ss-tabs{display:flex;gap:4px;background:var(--void);padding:4px;border-radius:10px;border:1px solid var(--border);margin-bottom:18px;overflow-x:auto}
.ss-tab{flex:none;padding:8px 14px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--text3);transition:all .15s;white-space:nowrap;cursor:pointer}
.ss-tab.active{background:var(--surface2);color:var(--accent);box-shadow:inset 0 0 0 1px rgba(0,255,224,.2)}
.role-card{display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;background:var(--surface2);border:1px solid var(--border);margin-bottom:8px;transition:all .15s;cursor:pointer;width:100%;text-align:left}
.role-card:hover{border-color:var(--accent);transform:translateX(2px)}
.role-card .rc-name{font-weight:700;font-size:14px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.role-card .rc-count{font-size:11px;color:var(--text3);background:var(--void);padding:2px 8px;border-radius:99px}
.perm-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.perm-toggle{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);cursor:pointer;font-size:12.5px;font-weight:500;transition:all .15s}
.perm-toggle:hover{border-color:var(--border2)}
.perm-toggle.on{border-color:var(--accent);background:rgba(0,255,224,.08);color:var(--accent)}
.perm-toggle input{width:14px;height:14px;accent-color:var(--accent);flex:none}
.color-swatches{display:flex;gap:6px;flex-wrap:wrap}
.color-swatches button{width:32px;height:32px;border-radius:8px;border:2px solid transparent;transition:all .15s}
.color-swatches button:hover{transform:scale(1.08)}
.color-swatches button.sel{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
.channel-priv{display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;background:var(--surface2);border:1px solid var(--border);margin-bottom:8px}
.channel-priv .cp-info{flex:1;min-width:0}
.channel-priv .cp-name{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.channel-priv .cp-sub{font-size:11px;color:var(--text3);margin-top:2px}

/* BROWSER VIEW */
.browser-view{display:flex;flex-direction:column;height:100%;background:var(--void)}
.browser-bar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap}
.browser-bar .bb-nav{display:flex;gap:4px}
.browser-bar .bb-nav button{width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:all .15s}
.browser-bar .bb-nav button:hover{background:var(--surface2);color:var(--accent)}
.browser-bar .bb-nav button:disabled{opacity:.3;cursor:not-allowed}
.browser-bar .bb-url{flex:1;min-width:200px;padding:8px 12px;border-radius:8px;background:var(--void);border:1px solid var(--border);color:var(--text);font-size:13px;font-family:ui-monospace,monospace}
.browser-bar .bb-url:focus{border-color:var(--accent);outline:none}
.browser-bar .bb-go{padding:8px 14px;border-radius:8px;background:var(--accent);color:#04120f;font-weight:700;font-size:12px}
.browser-tabs-bar{display:flex;gap:4px;padding:6px 12px 0;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto}
.browser-tab{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:8px 8px 0 0;background:var(--surface2);border:1px solid var(--border);border-bottom:none;font-size:12px;font-weight:600;color:var(--text2);white-space:nowrap;cursor:pointer;min-width:100px;max-width:180px}
.browser-tab.active{background:var(--void);color:var(--accent);border-color:var(--accent)}
.browser-tab .bt-title{flex:1;overflow:hidden;text-overflow:ellipsis}
.browser-tab .bt-close{width:16px;height:16px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px;flex:none}
.browser-tab .bt-close:hover{background:rgba(255,45,111,.2);color:var(--rose)}
.browser-tab .bt-new{background:transparent;border:1px dashed var(--border);color:var(--text3);min-width:32px;justify-content:center}
.browser-quickbar{display:flex;gap:6px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto}
.browser-quickbar button{padding:6px 11px;border-radius:7px;background:var(--surface2);border:1px solid var(--border);color:var(--text2);font-size:11.5px;font-weight:600;white-space:nowrap;transition:all .15s}
.browser-quickbar button:hover{background:var(--surface3);color:var(--accent);border-color:var(--accent)}
.browser-frame-wrap{flex:1;min-height:0;position:relative;background:#fff}
.browser-frame-wrap iframe{width:100%;height:100%;border:none;display:block}
.browser-overlay{position:absolute;inset:0;background:rgba(10,10,15,.9);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:30px;color:var(--text2)}
.browser-overlay .bo-emoji{font-size:48px}
.browser-overlay .bo-title{font-family:'Space Grotesk';font-size:18px;font-weight:700;color:var(--text)}
.browser-overlay .bo-desc{font-size:13px;max-width:360px;line-height:1.5}

/* PROFILE / BANNER */
.profile-banner{height:140px;background:linear-gradient(135deg,#00ffe0,#b44aff);background-size:cover;background-position:center;position:relative;border-radius:14px 14px 0 0;overflow:hidden}
.profile-banner .pb-edit{position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,.6);color:#fff;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:5px;border:1px solid rgba(255,255,255,.2);cursor:pointer;backdrop-filter:blur(8px)}
.profile-banner .pb-edit:hover{background:rgba(0,0,0,.8)}
.profile-avwrap{position:relative;display:inline-block}
.profile-avwrap .pa-border{border:4px solid var(--surface);border-radius:50%;display:inline-block;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.profile-avwrap .pa-edit{position:absolute;bottom:0;right:0;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#04120f;display:flex;align-items:center;justify-content:center;font-size:14px;border:2px solid var(--surface);cursor:pointer;font-weight:700}
.profile-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.profile-stat{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center}
.profile-stat .ps-v{font-family:'Space Grotesk';font-weight:800;font-size:18px;color:var(--accent)}
.profile-stat .ps-l{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.profile-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.profile-actions .btn{flex:1;min-width:120px}
.session-card{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;font-size:12px;line-height:1.6}
.session-card .sc-head{font-weight:700;font-size:13px;color:var(--accent);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.session-card .sc-row{display:flex;gap:6px;color:var(--text2)}
.session-card .sc-row b{color:var(--text);font-weight:600;min-width:70px}

/* EFFECTS */
.fx-glow{box-shadow:0 0 15px var(--accent),0 0 30px var(--accent);animation:fxGlowPulse 2s ease-in-out infinite}
@keyframes fxGlowPulse{0%,100%{box-shadow:0 0 15px var(--accent),0 0 30px var(--accent)}50%{box-shadow:0 0 25px var(--accent),0 0 50px var(--accent)}}
.fx-sparkle{position:relative}
.fx-sparkle::before,.fx-sparkle::after{content:'✨';position:absolute;font-size:16px;animation:fxSparkleOrbit 3s linear infinite;pointer-events:none;z-index:1}
.fx-sparkle::after{animation-delay:-1.5s;content:'⭐';font-size:12px}
@keyframes fxSparkleOrbit{0%{top:0;left:0;opacity:1}25%{top:0;left:100%;opacity:.7}50%{top:100%;left:100%;opacity:1}75%{top:100%;left:0;opacity:.7}100%{top:0;left:0;opacity:1}}
.fx-flame{position:relative;animation:fxFlameShake .15s infinite}
.fx-flame::before{content:'🔥';position:absolute;font-size:22px;bottom:-10px;left:50%;transform:translateX(-50%);animation:fxFlameFloat 1.2s ease-in-out infinite alternate;z-index:1}
@keyframes fxFlameShake{0%,100%{transform:translate(0,0)}50%{transform:translate(-1px,-1px)}}
@keyframes fxFlameFloat{from{transform:translateX(-50%) scaleY(1);opacity:1}to{transform:translateX(-50%) scaleY(1.15) translateY(-4px);opacity:.85}}
.fx-glitch{position:relative;animation:fxGlitch 2.5s infinite}
@keyframes fxGlitch{0%,90%,100%{transform:none;filter:none}92%{transform:translate(-2px,0);filter:hue-rotate(90deg)}94%{transform:translate(2px,0);filter:hue-rotate(-90deg)}96%{transform:translate(-1px,1px)}}
.name-anim{background-size:400% 100%!important;-webkit-background-clip:text!important;background-clip:text!important;-webkit-text-fill-color:transparent!important;animation:nameGradient 3s linear infinite!important}
@keyframes nameGradient{0%{background-position:0% 50%}100%{background-position:400% 50%}}

/* MUSIC */
.music-player{position:fixed;bottom:20px;right:20px;z-index:380}
.mp-ball{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--purple));color:#04120f;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 10px 30px rgba(0,255,224,.45);animation:mpPulse 2.4s ease-in-out infinite;position:relative;border:none}
.mp-ball:hover{transform:scale(1.06)}
.mp-ball.playing{animation:mpPulse 2.4s ease-in-out infinite,mpSpin 8s linear infinite}
@keyframes mpSpin{to{transform:rotate(360deg)}}
@keyframes mpPulse{0%,100%{box-shadow:0 10px 30px rgba(0,255,224,.4)}50%{box-shadow:0 10px 40px rgba(0,255,224,.8),0 0 60px rgba(180,74,255,.5)}}
.mp-ball .mp-eq{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);display:flex;gap:2px;align-items:flex-end;height:12px;background:rgba(10,10,15,.85);padding:2px 5px;border-radius:6px}
.mp-ball .mp-eq i{width:2.5px;background:var(--accent);border-radius:2px;height:4px}
.mp-ball.playing .mp-eq i:nth-child(1){animation:eqBar .6s ease-in-out infinite}
.mp-ball.playing .mp-eq i:nth-child(2){animation:eqBar .6s ease-in-out infinite .12s}
.mp-ball.playing .mp-eq i:nth-child(3){animation:eqBar .6s ease-in-out infinite .24s}
@keyframes eqBar{0%,100%{height:4px}50%{height:11px}}
.mp-panel{position:absolute;bottom:70px;right:0;width:350px;max-width:calc(100vw - 32px);max-height:calc(100vh - 120px);overflow-y:auto;background:rgba(18,18,26,.98);border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:0 20px 60px rgba(0,0,0,.75);backdrop-filter:blur(20px);animation:mIn .2s var(--ease) both}
.mp-panel-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.mp-panel-head .mp-label{font-size:10.5px;font-weight:700;letter-spacing:.12em;color:var(--text3);flex:1}
.mp-panel-head .xbtn{width:26px;height:26px}
.mp-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.mp-art{width:56px;height:56px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--purple));display:flex;align-items:center;justify-content:center;font-size:24px;flex:none;background-size:cover;background-position:center;overflow:hidden}
.mp-info{flex:1;min-width:0}
.mp-title{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-artist{font-size:12px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-controls{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:12px}
.mp-controls button{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:all .15s}
.mp-controls button:hover{background:var(--surface2);color:var(--accent)}
.mp-controls button svg{width:18px;height:18px}
.mp-controls .mp-play{width:48px;height:48px;background:linear-gradient(135deg,var(--accent),var(--purple));color:#04120f}
.mp-controls .mp-play:hover{transform:scale(1.06);box-shadow:0 0 20px rgba(0,255,224,.5)}
.mp-controls .mp-play svg{width:22px;height:22px}
.mp-addlink{display:flex;gap:6px;margin-bottom:10px}
.mp-addlink input{flex:1;padding:8px 10px;border-radius:8px;background:var(--void);border:1px solid var(--border);color:var(--text);font-size:12px}
.mp-addlink input:focus{border-color:var(--accent);outline:none}
.mp-addlink button{padding:8px 12px;border-radius:8px;background:var(--accent);color:#04120f;font-weight:700;font-size:12px;white-space:nowrap;transition:all .15s}
.mp-tracks{max-height:220px;overflow-y:auto;border-top:1px solid var(--border);padding-top:8px}
.mp-track{display:flex;align-items:center;gap:10px;padding:8px;border-radius:7px;cursor:pointer;font-size:12.5px;transition:background .12s;width:100%;text-align:left;color:var(--text)}
.mp-track:hover{background:rgba(255,255,255,.05)}
.mp-track.playing{background:rgba(0,255,224,.08);color:var(--accent)}
.mp-track .mp-num{width:16px;color:var(--text3);font-size:11px;flex:none;text-align:center}
.mp-track .mp-ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mp-track .mp-ttl small{color:var(--text3);display:block;font-size:10.5px}
.mp-track .mp-del{width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--text3);flex:none;font-size:14px}
.mp-track .mp-del:hover{background:rgba(255,45,111,.15);color:var(--rose)}
.mp-hidden{position:fixed;left:0;bottom:0;width:1px;height:1px;overflow:hidden;opacity:.01;pointer-events:none;z-index:-1}
@media(max-width:760px){.music-player{bottom:calc(80px + env(safe-area-inset-bottom));right:12px}.mp-panel{width:calc(100vw - 24px);max-width:350px}}

/* VOICE */
.voice-bar{position:fixed;top:0;left:0;right:0;z-index:390;background:linear-gradient(135deg,rgba(0,255,224,.14),rgba(180,74,255,.14));border-bottom:1px solid var(--accent);padding:8px 14px;display:flex;align-items:center;gap:10px;backdrop-filter:blur(20px);font-size:13px;flex-wrap:wrap}
.voice-bar .vb-info{flex:1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:120px}
.voice-bar .vb-name{font-weight:700;color:var(--accent)}
.voice-bar .vb-participants{color:var(--text2);font-size:12px}
.voice-bar button{padding:8px 12px;border-radius:8px;font-weight:600;font-size:12px;background:var(--surface2);border:1px solid var(--border);color:var(--text);transition:all .15s;display:flex;align-items:center;gap:5px;min-height:36px}
.voice-bar button:hover{background:var(--surface3);border-color:var(--accent)}
.voice-bar button.danger{background:rgba(255,45,111,.15);color:#ff7aa2;border-color:rgba(255,45,111,.4)}
.voice-bar button.muted{background:rgba(255,45,111,.15);color:#ff7aa2;border-color:rgba(255,45,111,.4)}
.voice-bar button svg{width:15px;height:15px}
.vc-videos{position:fixed;right:14px;bottom:90px;z-index:385;display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow-y:auto;max-width:60vw}
.vc-tile{position:relative;width:180px;height:135px;border-radius:12px;overflow:hidden;background:#000;border:1px solid var(--border);box-shadow:0 10px 30px rgba(0,0,0,.6)}
.vc-tile video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
.vc-tile .vc-name{position:absolute;left:6px;bottom:6px;font-size:10.5px;font-weight:700;background:rgba(0,0,0,.6);padding:2px 7px;border-radius:99px}
@media(max-width:760px){.vc-tile{width:120px;height:90px}.vc-videos{bottom:150px;right:8px}}

/* GAMES */
.games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.game-card{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;transition:all .15s;cursor:pointer;color:var(--text)}
.game-card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:var(--glow)}
.game-card .gc-emoji{font-size:30px}
.game-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border);gap:10px;flex-wrap:wrap}
.game-score{font-family:'Space Grotesk';font-weight:800;font-size:20px;color:var(--accent)}
.game-timer{font-family:ui-monospace,monospace;font-size:13px;color:var(--text2)}
.fish-pond{position:relative;height:320px;background:linear-gradient(180deg,#062a3a,#0a1020);border-radius:14px;overflow:hidden;cursor:crosshair;border:1px solid var(--border);user-select:none}
.fish-item{position:absolute;font-size:30px;cursor:pointer;user-select:none;transition:transform .1s;z-index:2;will-change:transform}
.fish-item:hover{transform:scale(1.2)}
.fish-item.caught{animation:fishPop .3s forwards;pointer-events:none}
@keyframes fishPop{to{transform:scale(1.9);opacity:0}}
.ttt-grid{display:grid;grid-template-columns:repeat(3,90px);grid-gap:6px;justify-content:center;margin:20px auto}
.ttt-cell{width:90px;height:90px;border-radius:12px;background:var(--surface2);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;font-family:'Space Grotesk';cursor:pointer;transition:all .15s;color:var(--text)}
.ttt-cell:hover{background:var(--surface3);border-color:var(--accent)}
.ttt-cell.win{background:rgba(0,230,118,.15);border-color:var(--green);color:var(--green)}
.rps-choices{display:flex;gap:14px;justify-content:center;margin:22px 0;flex-wrap:wrap}
.rps-btn{width:88px;height:88px;font-size:42px;border-radius:16px;background:var(--surface2);border:2px solid var(--border);cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center}
.rps-btn:hover{border-color:var(--accent);transform:scale(1.08);box-shadow:var(--glow)}
.rps-result{font-size:16px;font-weight:700;text-align:center;min-height:24px;margin:12px 0;color:var(--accent)}
.memory-grid{display:grid;grid-template-columns:repeat(4,74px);gap:8px;justify-content:center;margin:14px 0}
.mem-card{width:74px;height:74px;border-radius:10px;background:var(--surface2);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:32px;cursor:pointer;transition:transform .2s;user-select:none}
.mem-card.flipped{background:var(--surface3);border-color:var(--accent)}
.mem-card.matched{background:rgba(0,230,118,.15);border-color:var(--green);cursor:default;opacity:.7}
.reaction-pad{height:220px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk';font-weight:800;font-size:24px;cursor:pointer;text-align:center;padding:20px;transition:background .1s}
.reaction-pad.wait{background:#c0392b;color:#fff}
.reaction-pad.go{background:#27ae60;color:#fff}
.reaction-pad.idle{background:var(--surface2);color:var(--text2);border:2px dashed var(--border)}
.snake-grid{display:grid;grid-template-columns:repeat(15,20px);gap:1px;justify-content:center;margin:14px auto;padding:6px;background:var(--void);border-radius:10px;border:1px solid var(--border);width:max-content}
.snake-cell{width:20px;height:20px;background:var(--surface2);border-radius:2px}
.snake-cell.head{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.snake-cell.body{background:var(--accent2)}
.snake-cell.food{background:var(--rose);border-radius:50%;animation:snakePulse 1s infinite}
@keyframes snakePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.whack-grid{display:grid;grid-template-columns:repeat(3,90px);grid-gap:8px;justify-content:center;margin:16px 0}
.whack-cell{width:90px;height:90px;border-radius:12px;background:var(--surface2);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:40px;cursor:pointer;transition:all .1s;user-select:none}
.whack-cell.active{background:linear-gradient(135deg,#ff9500,#ff2d6f);border-color:var(--gold);animation:whackPop .15s}
@keyframes whackPop{0%{transform:scale(.8)}100%{transform:scale(1)}}
.trivia-q{font-size:16px;font-weight:700;margin-bottom:14px;line-height:1.4}
.trivia-opt{display:flex;flex-direction:column;gap:8px}
.trivia-opt button{padding:12px 14px;border-radius:10px;background:var(--surface2);border:1px solid var(--border);text-align:left;font-weight:600;font-size:14px;transition:all .15s;color:var(--text)}
.trivia-opt button:hover{border-color:var(--accent)}
.trivia-opt button.correct{background:rgba(0,230,118,.18);border-color:var(--green);color:#8affb8}
.trivia-opt button.wrong{background:rgba(255,45,111,.18);border-color:var(--rose);color:#ff8aa8}
.guess-num-display{text-align:center;font-family:'Space Grotesk';font-weight:800;font-size:28px;margin:10px 0;color:var(--accent)}
.guess-hint{text-align:center;font-size:14px;min-height:20px;margin:8px 0;color:var(--amber);font-weight:700}
.hangman-word{text-align:center;font-family:monospace;font-size:28px;font-weight:700;letter-spacing:6px;margin:14px 0;color:var(--accent)}
.hangman-keys{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;max-width:340px;margin:0 auto}
.hangman-keys button{padding:8px;border-radius:6px;background:var(--surface2);border:1px solid var(--border);font-weight:700;font-size:14px;color:var(--text);transition:all .15s;text-transform:uppercase}
.hangman-keys button:hover{background:var(--surface3);border-color:var(--accent)}
.hangman-keys button.used{opacity:.35;pointer-events:none}
.hangman-keys button.correct{background:rgba(0,230,118,.2);border-color:var(--green);color:var(--green)}
.hangman-keys button.wrong{background:rgba(255,45,111,.2);border-color:var(--rose);color:var(--rose)}
.typing-text{background:var(--surface2);padding:14px;border-radius:10px;font-family:monospace;font-size:15px;line-height:1.7;margin-bottom:14px;min-height:80px}
.typing-text .t-ok{color:var(--green)}
.typing-text .t-bad{color:var(--rose);background:rgba(255,45,111,.15)}
.typing-text .t-cur{background:rgba(0,255,224,.3);animation:curBlink 1s infinite}
@keyframes curBlink{0%,100%{background:rgba(0,255,224,.3)}50%{background:rgba(0,255,224,.1)}}

/* SHOP */
.wallet-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;background:linear-gradient(135deg,rgba(255,215,0,.15),rgba(255,171,0,.1));border:1px solid rgba(255,215,0,.3);font-size:12px;font-weight:700;color:var(--gold);cursor:pointer;transition:all .15s}
.shop-tabs{display:flex;gap:4px;background:var(--void);padding:4px;border-radius:10px;border:1px solid var(--border);margin-bottom:18px;overflow-x:auto}
.shop-tab{flex:none;padding:8px 14px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--text3);transition:all .15s;white-space:nowrap;cursor:pointer}
.shop-tab.active{background:var(--surface2);color:var(--accent);box-shadow:inset 0 0 0 1px rgba(0,255,224,.2)}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.shop-card{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;transition:all .15s;cursor:pointer}
.shop-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.shop-card.owned{opacity:.75}
.shop-preview{height:72px;display:flex;align-items:center;justify-content:center;font-size:32px;background:var(--void);border-radius:8px;position:relative;overflow:hidden}
.shop-name{font-weight:700;font-size:13px}
.shop-desc{font-size:11px;color:var(--text3);line-height:1.4}
.shop-price{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;color:var(--gold);margin-top:auto;min-height:22px}
.shop-price .owned-tag{color:var(--green);font-size:10px;text-transform:uppercase}
.shop-price .equip-tag{color:var(--accent);font-size:10px;text-transform:uppercase}

/* AI */
.ai-chat{max-height:44vh;overflow-y:auto;padding-right:4px}
.ai-msg{padding:10px 12px;border-radius:12px;margin-bottom:8px;font-size:14px;line-height:1.55;max-width:88%;white-space:pre-wrap;word-wrap:break-word}
.ai-msg.user{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04120f;margin-left:auto;border-bottom-right-radius:4px}
.ai-msg.assistant{background:var(--surface2);border:1px solid var(--border);border-bottom-left-radius:4px}
.ai-input-row{display:flex;gap:8px;margin-top:14px}
.ai-input-row input{flex:1;padding:11px 13px;border-radius:8px;background:var(--void);border:1px solid var(--border);color:var(--text);font-size:16px}

@media (max-width:1050px){.app,.app.hide-members{grid-template-columns:74px 240px 1fr}.members{position:fixed;right:0;top:0;bottom:0;width:250px;transform:translateX(100%);transition:transform .28s;z-index:80;box-shadow:-20px 0 50px rgba(0,0,0,.5)}.members.open{transform:none}}
@media (max-width:760px){
.app,.app.hide-members{grid-template-columns:1fr;padding-bottom:calc(60px + env(safe-area-inset-bottom))}
.mobile-only{display:flex}
.rail{position:fixed;left:0;right:0;bottom:0;top:auto;height:calc(60px + env(safe-area-inset-bottom));width:auto;flex-direction:row;border-right:none;border-top:1px solid var(--border);padding:0 10px env(safe-area-inset-bottom);gap:8px;z-index:60;overflow-x:auto}
.rail-sep{width:1px;height:30px;margin:0 2px;flex:none}
.rail-btn{width:42px;height:42px;border-radius:13px;flex:none}
.panel{position:fixed;left:0;top:0;bottom:calc(60px + env(safe-area-inset-bottom));width:280px;z-index:70;transform:translateX(-100%);transition:transform .28s var(--ease);box-shadow:20px 0 50px rgba(0,0,0,.6)}
.panel.open{transform:none}
.composer-wrap{padding:0 10px 10px}
.msg{padding:4px 12px}
.msg.pinged{padding-left:9px}
.msg .toolbar{right:12px;display:flex;opacity:.75}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:65}
.btn,.row,.rail-btn,.game-card,.ttt-cell,.mem-card,.rps-btn,.whack-cell{min-height:44px}
.ttt-cell{width:80px;height:80px;font-size:38px}
.ttt-grid{grid-template-columns:repeat(3,80px)}
.whack-cell{width:80px;height:80px}
.whack-grid{grid-template-columns:repeat(3,80px)}
.memory-grid{grid-template-columns:repeat(4,68px)}
.mem-card{width:68px;height:68px}
.fish-pond{height:260px}
.modal{max-height:92vh}
.voice-bar{padding:8px 10px;font-size:12px;flex-wrap:wrap}
.auth-card{padding:26px 20px}
.brand h1{font-size:22px}
.brand h1 span{font-size:16px}
.perm-grid{grid-template-columns:1fr}
.browser-bar .bb-url{min-width:100px}
.browser-tab{min-width:70px;max-width:120px;font-size:11px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============ v3 ADDITIONS ============ */
.cp-ai-bar{display:flex;align-items:center;gap:8px;justify-content:center;margin:10px 0;font-size:11px;color:var(--text3);font-weight:700;letter-spacing:.08em;text-transform:uppercase;flex-wrap:wrap}
.cp-ai-btn{padding:8px 16px;border-radius:99px;background:var(--surface2);border:1px solid var(--border);font-size:12.5px;font-weight:700;color:var(--text2);transition:all .15s;min-height:38px}
.cp-ai-btn.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04120f;border-color:transparent;box-shadow:var(--glow)}
.cp-sitegate{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:28px 22px;text-align:center;background:radial-gradient(700px 420px at 50% 0%,rgba(0,255,224,.09),transparent 62%),var(--void)}
.cp-sg-emoji{font-size:52px;line-height:1}
.cp-sg-title{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:800;color:var(--text)}
.cp-sg-desc{font-size:13px;color:var(--text2);max-width:400px;line-height:1.55}
.cp-sg-host{font-family:ui-monospace,monospace;font-size:11.5px;color:var(--text3);background:var(--surface2);padding:3px 9px;border-radius:99px;border:1px solid var(--border)}
.cp-sg-row{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.cp-framebar{position:absolute;right:12px;bottom:12px;z-index:3;display:flex;gap:6px}
.cp-framebar button{padding:9px 14px;border-radius:99px;background:rgba(10,10,15,.86);color:#fff;font-size:12px;font-weight:700;border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(10px);box-shadow:0 8px 24px rgba(0,0,0,.5);min-height:38px}
.cp-framebar button:hover{background:var(--accent);color:#04120f;border-color:transparent}
.browser-quickbar button[data-cp-site]{display:inline-flex;align-items:center;gap:5px}
.browser-quickbar button[data-cp-site] .cp-ext{font-size:9px;opacity:.55}

/* mobile drawer fix — buttons that always work */
.cp-drawer-btns{display:none;gap:4px}
@media (max-width:1050px){.cp-drawer-btns{display:flex}}
.cp-drawer-btns .hbtn{width:40px;height:40px;border-radius:9px;background:var(--surface2);border:1px solid var(--border);color:var(--text2);display:flex;align-items:center;justify-content:center;flex:none;touch-action:manipulation}
.cp-drawer-btns .hbtn:active{background:var(--accent);color:#04120f}
.cp-drawer-btns .hbtn svg{width:19px;height:19px}

/* invite cards */
.inv-card{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}
.inv-card .ic-code{font-family:ui-monospace,monospace;font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.08em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.inv-card .ic-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.inv-pill{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:99px;background:var(--void);border:1px solid var(--border);color:var(--text2)}
.inv-pill.on{background:rgba(0,230,118,.14);border-color:rgba(0,230,118,.35);color:var(--green)}
.inv-pill.off{background:rgba(255,45,111,.12);border-color:rgba(255,45,111,.3);color:#ff8aa8}
.inv-pill.warn{background:rgba(255,171,0,.14);border-color:rgba(255,171,0,.35);color:var(--amber)}
.inv-row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.inv-row .btn{flex:1;min-width:100px;min-height:40px}

/* bet modal */
.bet-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.bet-opt{padding:12px;border-radius:12px;background:var(--surface2);border:2px solid var(--border);cursor:pointer;text-align:center;transition:all .15s}
.bet-opt:hover{border-color:var(--border2)}
.bet-opt.sel{border-color:var(--accent);background:rgba(0,255,224,.08);box-shadow:var(--glow)}
.bet-opt .bo-e{font-size:26px;display:block;margin-bottom:4px}
.bet-opt .bo-n{font-weight:700;font-size:12.5px}
.bet-opt .bo-s{font-size:10.5px;color:var(--text3);margin-top:2px}
.bet-stake{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.bet-stake button{flex:1;min-width:64px;padding:11px 6px;border-radius:9px;background:var(--surface2);border:1px solid var(--border);font-weight:800;font-size:13px;color:var(--text2);min-height:44px}
.bet-stake button.sel{background:linear-gradient(135deg,var(--gold),var(--amber));color:#1a1100;border-color:transparent}
.bet-status{text-align:center;font-family:'Space Grotesk';font-weight:800;font-size:17px;margin:12px 0;min-height:24px}

/* reactions */
.react-bar{display:flex;gap:3px;flex-wrap:wrap;margin-top:4px}
.react-chip{display:inline-flex;align-items:center;gap:3px;padding:1px 7px;border-radius:99px;background:var(--surface2);border:1px solid var(--border);font-size:11.5px;cursor:pointer;transition:all .12s;line-height:1.6}
.react-chip:hover{border-color:var(--accent)}
.react-chip.mine{background:rgba(0,255,224,.12);border-color:rgba(0,255,224,.4);color:var(--accent)}
.reply-ref{font-size:11px;color:var(--text3);border-left:2px solid var(--border2);padding-left:8px;margin-bottom:3px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reply-ref b{color:var(--text2)}

/* quick switcher */
.qs-input{width:100%;padding:14px 16px;border-radius:12px;background:var(--void);border:1px solid var(--border);font-size:16px;color:var(--text)}
.qs-list{margin-top:10px;max-height:50vh;overflow-y:auto}
.qs-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:9px;cursor:pointer;font-size:13.5px;width:100%;text-align:left;color:var(--text2);min-height:44px}
.qs-item:hover,.qs-item.sel{background:var(--surface2);color:var(--text)}

/* Android tuning */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
@media (max-width:760px){
  input,textarea,select{font-size:16px!important}
  .chat-body,.panel-body,.members,.modal-body,.mp-tracks,.mp-panel,.ai-chat,.browser-frame-wrap{-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .msg .toolbar{opacity:0;pointer-events:none;transition:opacity .15s}
  .msg.tools-open .toolbar{opacity:1;pointer-events:auto}
  .msg .toolbar button{width:34px;height:34px}
  .auth-card,.chat-head,.mp-panel,.toast,.voice-bar{backdrop-filter:none!important}
  .floating-orb{display:none}
  .composer .send,.composer .cbtn{width:38px;height:38px}
  .modal-foot{padding:12px 16px;gap:8px}
  .modal-foot .btn{flex:1;min-height:46px}
}
@media (max-width:420px){
  .ttt-grid{grid-template-columns:repeat(3,72px)}.ttt-cell{width:72px;height:72px;font-size:32px}
  .memory-grid{grid-template-columns:repeat(4,62px);gap:6px}.mem-card{width:62px;height:62px;font-size:26px}
  .whack-grid{grid-template-columns:repeat(3,72px);gap:6px}.whack-cell{width:72px;height:72px;font-size:32px}
  .bet-grid{grid-template-columns:1fr}
}
@supports (height:100dvh){.app{height:100dvh}}
</style>

<body>

<!-- AUTH -->
<div class="auth-screen" id="auth-screen">
  <div class="stars"></div>
  <div class="floating-orb o1"></div>
  <div class="floating-orb o2"></div>
  <div class="floating-orb o3"></div>
  <div class="auth-card">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 100 100" fill="none">
          <defs><radialGradient id="qgrad" cx="50%" cy="50%"><stop offset="0%" stop-color="#00ffe0"/><stop offset="100%" stop-color="#b44aff"/></radialGradient></defs>
          <circle cx="50" cy="50" r="34" fill="url(#qgrad)" opacity=".9"/>
          <circle cx="50" cy="50" r="44" stroke="url(#qgrad)" stroke-width="2.5" stroke-dasharray="8 6" opacity=".8"/>
          <circle cx="50" cy="50" r="12" fill="#0a0a0f"/>
          <circle cx="82" cy="50" r="4" fill="#00ffe0"/>
        </svg>
      </div>
      <h1>CHATTER'S<span>PARADISE</span></h1>
      <div class="tagline" id="tagline"></div>
    </div>
    <div id="saved-accounts-slot"></div>
    <div class="tabs">
      <button class="tab active" data-tab="login" type="button">Login</button>
      <button class="tab" data-tab="signup" type="button">Create Account</button>
    </div>
    <form class="auth-form" id="form-login">
      <div class="field"><label>Email</label><input id="li-email" type="email" placeholder="you@example.com" autocomplete="email"></div>
      <div class="field"><label>Password</label><input id="li-pass" type="password" placeholder="Password" autocomplete="current-password"></div>
      <button class="btn primary block" type="submit" id="li-submit">Sign In</button>
      <div class="err" id="li-err"></div>
      <div class="divider">or</div>
      <button class="google-btn" id="google-login" type="button">
        <svg viewBox="0 0 48 48"><path fill="#4285F4" d="M45.1 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h11.8c-.5 2.7-2 5-4.4 6.6v5.5h7.1c4.2-3.9 6.6-9.6 6.6-16.1z"/><path fill="#34A853" d="M24 46c6 0 11-2 14.7-5.4l-7.1-5.5c-2 1.3-4.5 2.1-7.6 2.1-5.8 0-10.7-3.9-12.5-9.2H4.2v5.7C7.9 41 15.4 46 24 46z"/><path fill="#FBBC05" d="M11.5 28c-.5-1.4-.7-2.9-.7-4.5s.3-3.1.7-4.5V13.3H4.2C2.8 16.1 2 19 2 22s.8 5.9 2.2 8.7l7.3-2.7z"/><path fill="#EA4335" d="M24 10.9c3.3 0 6.2 1.1 8.5 3.3l6.4-6.4C35 4.1 30 2 24 2 15.4 2 7.9 7 4.2 13.3l7.3 5.7c1.8-5.3 6.7-9.1 12.5-9.1z"/></svg>
        Continue with Google
      </button>
      <button class="btn block" id="guest-login" type="button" style="margin-top:10px">👤 Continue as Guest</button>
    </form>
    <form class="auth-form hidden" id="form-signup">
      <div class="field"><label>Email</label><input id="su-email" type="email" placeholder="you@example.com" autocomplete="email"></div>
      <div class="field"><label>Username</label><input id="su-username" maxlength="24" placeholder="chatteruser" autocomplete="username"><div class="hint">3-24 chars: a-z, 0-9, underscore.</div></div>
      <div class="field"><label>Display name</label><input id="su-display" maxlength="40" placeholder="Chatter User"></div>

/* ---------------- mentions ---------------- */
function isMentioned(content){
  if(!ME)return false;
  var text=String(content||'');
  var checks=['@'+(ME.username||''),'@'+String(ME.display_name||'').replace(/\s+/g,'')];
  for(var i=0;i<checks.length;i++){
    if(!checks[i]||checks[i]==='@')continue;
    if(new RegExp('(^|\\s|[.,!?:])'+escapeRegex(checks[i])+'(?=\\s|[.,!?:]|$)','i').test(text))return true;
  }
  if(/@everyone/i.test(text)&&CURRENT.type==='server'&&CURRENT.server)return true;
  return false;
}
function highlightMentions(t){
  if(!ME)return t;
  var out=t;
  var un=escapeRegex(ME.username||'');
  if(un)out=out.replace(new RegExp('@'+un+'(?=\\s|[.,!?:]|$)','gi'),function(m){return '<span class="mention mine">'+m+'</span>';});
  out=out.replace(/@everyone(?=\s|[.,!?:]|$)/gi,function(m){return '<span class="mention">'+m+'</span>';});
  out=out.replace(/@([a-z0-9_]{3,24})(?=\s|[.,!?:]|$)/gi,function(m,p1){if(p1.toLowerCase()===(ME.username||'').toLowerCase())return m;return '<span class="mention">'+m+'</span>';});
  return out;
}

/* --- fire-and-forget Supabase mirrors (silently no-op if tables missing) --- */
async function sbUpsert(table,row){
  if(!sb||!SESSION||!SESSION.access_token)return;
  try{ await sb.from(table).upsert(row); }catch(e){}
}
async function sbDel(table,filter){
  if(!sb||!SESSION||!SESSION.access_token)return;
  try{ var q=sb.from(table).delete(); for(var k in filter)q=q.eq(k,filter[k]); await q; }catch(e){}
}
async function sbSelect(table,filter){
  if(!sb||!SESSION||!SESSION.access_token)return null;
  try{
    var q=sb.from(table).select('*');
    for(var k in (filter||{}))q=q.eq(k,filter[k]);
    var r=await q; if(r.error)return null; return r.data;
  }catch(e){return null;}
}

/* --- realtime bus (Supabase broadcast + BroadcastChannel) --- */
function rtStart(){
  if(BC)BC.onmessage=function(ev){onBus(ev.data&&ev.data.event,ev.data&&ev.data.payload);};
  if(sb&&SESSION){
    try{
      RT=sb.channel('cp_rt_'+SESSION.user_id,{config:{broadcast:{self:false}}});
      RT.on('broadcast',{event:'msg'},function(p){onBus('msg',p.payload);});
      RT.on('broadcast',{event:'presence'},function(p){onBus('presence',p.payload);});
      RT.on('broadcast',{event:'typing'},function(p){onBus('typing',p.payload);});
      RT.on('broadcast',{event:'invite'},function(p){onBus('invite',p.payload);});
      RT.subscribe();
    }catch(e){}
  }
}
function rtSend(event,payload){
  var msg={event:event,payload:payload};
  if(BC)try{BC.postMessage(msg);}catch(e){}
  if(RT)try{RT.send({type:'broadcast',event:event,payload:payload});}catch(e){}
}
function onBus(event,payload){
  if(!payload)return;
  if(event==='msg'){ applyRemoteMessage(payload); return; }
  if(event==='presence'){ ONLINE[payload.uid]=payload.ts; if(CURRENT.type==='server'||CURRENT.type==='dm')renderMembers(); return; }
  if(event==='typing'){ TYPING[payload.cid]=TYPING[payload.cid]||{}; TYPING[payload.cid][payload.uid]=Date.now(); renderTyping(); return; }
  if(event==='invite'){ toast('Server invite','You were added to a server','ok'); }
}
function applyRemoteMessage(m){
  if(!m||!m.channel_id)return;
  var arr=Store.getMsgs(m.channel_id);
  if(!arr.some(function(x){return x.id===m.id;})){
    arr.push(m); Store.saveMsgs(m.channel_id,arr);
    if(CURRENT.type!=='home'&&currentChannelId()===m.channel_id){
      renderMessages(); scrollBottom();
      if(m.author_id!==ME.id)sfxRecv();
    }else{
      UNREAD[m.channel_id]=(UNREAD[m.channel_id]||0)+1;
      renderPanel(); renderRail();
    }
  }
}

function userKey(id){return 'cp_user_'+id;}
function saveLocalUser(u){saveLS(userKey(u.id),u);}
function loadLocalUser(id){return loadLS(userKey(id),null);}

async function doSignup(email,password,username,display){
  email=String(email||'').trim().toLowerCase();
  username=String(username||'').trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))throw new Error('Enter a valid email.');
  if(!/^[a-z0-9_]{3,24}$/.test(username))throw new Error('Username must be 3-24 chars: a-z, 0-9, underscore.');
  if(String(password).length<6)throw new Error('Password must be at least 6 characters.');

  var users=loadLS('cp_local_users',{});
  var taken=Object.keys(users).some(function(k){return users[k].username===username;});
  if(taken)throw new Error('That username is taken.');

  var id='u_'+uid();
  var prof={id:id,username:username,display_name:(display||username),avatar_url:'',status:'online',bio:''};
  users[email]={id:id,username:username,display_name:prof.display_name,password:String(password),created:Date.now()};
  saveLS('cp_local_users',users);
  saveLocalUser(prof);
  PROFILES[id]=prof;
  SESSION={user_id:id,email:email,local:true};
  ME=prof;
  IS_GUEST=false;
  saveLS('cp_session',SESSION);

  /* try real supabase signup in the background */
  if(sb){ try{ await sb.auth.signUp({email:email,password:password,options:{data:{username:username,display_name:prof.display_name}}}); }catch(e){} }
  return prof;
}

async function doLogin(email,password){
  email=String(email||'').trim().toLowerCase();
  var users=loadLS('cp_local_users',{});
  var rec=users[email];
  if(!rec)throw new Error('No account found for that email.');
  if(rec.password!==String(password))throw new Error('Incorrect password.');
  var prof=loadLocalUser(rec.id)||{id:rec.id,username:rec.username,display_name:rec.display_name,avatar_url:'',status:'online',bio:''};
  PROFILES[prof.id]=prof;
  SESSION={user_id:prof.id,email:email,local:true};
  ME=prof;IS_GUEST=false;
  saveLS('cp_session',SESSION);
  saveLocalUser(prof);
  return prof;
}

function doGuest(){
  var id='g_'+uid();
  var prof={id:id,username:'guest_'+shortId(id),display_name:'Guest',avatar_url:'',status:'online',bio:''};
  PROFILES[id]=prof;saveLocalUser(prof);
  SESSION={user_id:id,email:'',local:true,guest:true};
  ME=prof;IS_GUEST=true;
  saveLS('cp_session',SESSION);
  return prof;
}

function signOut(){
  try{ if(sb)sb.auth.signOut(); }catch(e){}
  if(BC)try{BC.close();}catch(e){}
  if(RT)try{RT.unsubscribe();}catch(e){}
  localStorage.removeItem('cp_session');
  location.reload();
}

function wireAppUI(){
  /* drawer buttons for mobile are injected during renderChatHead */
  $('#backdrop').onclick=closeDrawers;
  window.addEventListener('resize',function(){ if(window.innerWidth>1050)closeDrawers(); });

  /* Ctrl/Cmd-K quick switcher */
  document.addEventListener('keydown',function(e){
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); openQuickSwitch(); }
    if(e.key==='Escape'){ closeDrawers(); closeModal(); }
  });

  /* mobile: tap message to show its toolbar */
  document.addEventListener('click',function(e){
    if(window.innerWidth>760)return;
    var t=e.target;
    if(!t||!t.closest)return;
    if(t.closest('.msg .toolbar')||t.closest('a')||t.closest('button'))return;
    var msg=t.closest('.msg'); if(!msg)return;
    var open=msg.classList.contains('tools-open');
    $$('.msg.tools-open').forEach(function(m){m.classList.remove('tools-open');});
    if(!open)msg.classList.add('tools-open');
  },false);
}

function closeDrawers(){
  $('#panel').classList.remove('open');
  $('#members').classList.remove('open');
  $('#backdrop').classList.add('hidden');
  UI.drawer=null;
}
function toggleDrawer(which){
  var p=$('#panel'),m=$('#members'),b=$('#backdrop');
  var isOpen = which==='panel' ? p.classList.contains('open') : m.classList.contains('open');
  closeDrawers();
  if(!isOpen){
    if(which==='panel')p.classList.add('open'); else m.classList.add('open');
    b.classList.remove('hidden');
    UI.drawer=which;
  }
}
