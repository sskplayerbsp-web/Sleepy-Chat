<!-- SLEEPY_DM_DEDUPE_V1 -->
<script>
(function(){
  "use strict";
  if (window.__sleepyDmDedupe) return;
  window.__sleepyDmDedupe = true;
  function log(){ try{console.log.apply(console,["[Dedupe]"].concat([].slice.call(arguments)));}catch(e){} }

  // ============================================================
  // 1. LOCK MAP — one in-flight DM creation per other-user id
  // ============================================================
  window.__dmLocks = window.__dmLocks || {};

  // Replace openDMWith with a lock-aware version
  window.openDMWith = async function(otherUserId){
    if (!otherUserId) return;
    if (otherUserId === window.ME.id) return;

    // Same click again? Reuse the first in-flight operation.
    if (window.__dmLocks[otherUserId]){
      log("reusing in-flight DM for", otherUserId.slice(0,6));
      try {
        var conv = await window.__dmLocks[otherUserId];
        if (conv){
          window.UI.view = "dms";
          window.UI.conversationId = conv.id;
          window.UI.channelId = null;
          window.UI.communityId = null;
          window.renderAll();
        }
      } catch(e){ log("lock wait failed:", e.message); }
      return;
    }

    // Fast path: is this conversation already loaded locally?
    var localConv = (window.CONVERSATIONS || []).filter(function(c){
      return !c.is_group && c.memberIds.length === 2 &&
        c.memberIds.indexOf(window.ME.id) >= 0 &&
        c.memberIds.indexOf(otherUserId) >= 0;
    })[0];

    if (localConv){
      log("existing DM found locally:", localConv.id.slice(0,6));
      window.UI.view = "dms";
      window.UI.conversationId = localConv.id;
      window.UI.channelId = null;
      window.UI.communityId = null;
      window.renderAll();
      return;
    }

    // Slow path: hit the DB, guarded by a lock
    var lockPromise = (async function(){
      try {
        var conv = await window.getOrCreateDM(otherUserId);
        return conv;
      } catch(e){
        log("getOrCreateDM failed:", e.message);
        throw e;
      }
    })();
    window.__dmLocks[otherUserId] = lockPromise;

    try {
      var conv = await lockPromise;
      await window.loadConversations();
      window.UI.view = "dms";
      window.UI.conversationId = conv.id;
      window.UI.channelId = null;
      window.UI.communityId = null;
      window.renderAll();
    } finally {
      delete window.__dmLocks[otherUserId];
    }
  };

  // ============================================================
  // 2. Also patch getOrCreateDM itself in case it's called directly
  // ============================================================
  var origGetOrCreate = window.getOrCreateDM;
  if (typeof origGetOrCreate === "function"){
    window.getOrCreateDM = async function(otherUserId){
      // If a lock exists, chain onto it
      if (window.__dmLocks[otherUserId]) return window.__dmLocks[otherUserId];
      // Otherwise wrap our own
      var p = origGetOrCreate.call(this, otherUserId);
      window.__dmLocks[otherUserId] = p;
      try {
        return await p;
      } finally {
        delete window.__dmLocks[otherUserId];
      }
    };
  }

  // ============================================================
  // 3. BOT DM — ensure only one SleepyBot conversation
  // ============================================================
  var BOT_USERNAME = "sleepybot";
  var botLock = false;

  async function ensureSingleBotDM(){
    if (botLock) return;
    botLock = true;
    try {
      // Find the bot's profile
      var botResp = await sb.from("profiles").select("id").eq("username", BOT_USERNAME).maybeSingle();
      if (!botResp.data) { botLock = false; return; }
      var botId = botResp.data.id;
      if (botId === window.ME.id) { botLock = false; return; }

      // Find all my conversations with the bot
      var myResp = await sb.from("conversation_members").select("conversation_id").eq("user_id", window.ME.id);
      var myIds = (myResp.data || []).map(function(r){ return r.conversation_id; });
      if (!myIds.length) { botLock = false; return; }

      var theirResp = await sb.from("conversation_members")
        .select("conversation_id")
        .eq("user_id", botId)
        .in("conversation_id", myIds);
      var sharedIds = (theirResp.data || []).map(function(r){ return r.conversation_id; });

      // Filter to 1:1 (no other members)
      var botConvs = [];
      for (var i = 0; i < sharedIds.length; i++){
        var cid = sharedIds[i];
        var cResp = await sb.from("conversation_members").select("user_id").eq("conversation_id", cid);
        if ((cResp.data || []).length === 2) botConvs.push(cid);
      }

      if (botConvs.length <= 1) { botLock = false; return; }
      log("found", botConvs.length, "bot DMs — merging");

      // Keep the one with the most recent activity
      var keep = botConvs[0];
      var keepTs = 0;
      for (var j = 0; j < botConvs.length; j++){
        var mResp = await sb.from("messages").select("created_at").eq("conversation_id", botConvs[j]).order("created_at", { ascending: false }).limit(1);
        var ts = (mResp.data && mResp.data[0]) ? new Date(mResp.data[0].created_at).getTime() : 0;
        if (ts > keepTs){ keepTs = ts; keep = botConvs[j]; }
      }

      // Delete the others
      for (var k = 0; k < botConvs.length; k++){
        if (botConvs[k] !== keep){
          try { await sb.from("conversations").delete().eq("id", botConvs[k]); } catch(e){}
        }
      }
      log("bot DMs merged into", keep.slice(0,6));
    } catch(e){
      log("bot dedupe failed:", e.message);
    } finally {
      botLock = false;
    }
  }

  // ============================================================
  // 4. GLOBAL CLEANUP — remove duplicate 1:1 conversations
  // ============================================================
  async function dedupeAllDMs(){
    if (!window.ME || !window.CONVERSATIONS) return 0;
    // Group all my 1:1 conversations by sorted member-pair key
    var groups = {};
    (window.CONVERSATIONS || []).forEach(function(c){
      if (c.is_group) return;
      if (!c.memberIds || c.memberIds.length !== 2) return;
      var key = c.memberIds.slice().sort().join("|");
      if (!groups[key]) groups[key] = [];
      groups[key].push(c);
    });

    var toDelete = [];
    for (var key in groups){
      var list = groups[key];
      if (list.length <= 1) continue;
      // Keep the one with messages, else the oldest
      list.sort(function(a, b){
        var am = a.lastMessage ? 1 : 0;
        var bm = b.lastMessage ? 1 : 0;
        if (am !== bm) return bm - am;      // with-messages first
        return new Date(a.created_at) - new Date(b.created_at);
      });
      for (var i = 1; i < list.length; i++) toDelete.push(list[i]);
    }

    if (!toDelete.length) return 0;
    log("deduping", toDelete.length, "duplicate DM(s)");

    // Delete the duplicates from the server
    for (var j = 0; j < toDelete.length; j++){
      try {
        await sb.from("conversations").delete().eq("id", toDelete[j].id);
      } catch(e){ log("delete failed:", e.message); }
    }

    // Reload conversation list so the UI updates
    try { await window.loadConversations(); } catch(e){}
    try { window.renderPanel(); window.renderRail(); } catch(e){}

    return toDelete.length;
  }

  // ============================================================
  // 5. RUN CLEANUP once after boot
  // ============================================================
  var tries = 0;
  var cleanupTimer = setInterval(async function(){
    tries++;
    if (!window.ME || !window.CONVERSATIONS) return;
    if (!window.loadConversations) return;
    clearInterval(cleanupTimer);

    // Wait a beat so the app fully initialises
    setTimeout(async function(){
      try {
        await window.loadConversations();
        await ensureSingleBotDM();
        var removed = await dedupeAllDMs();
        if (removed > 0){
          try { window.toast("Cleaned up", "Removed " + removed + " duplicate conversation" + (removed === 1 ? "" : "s") + ".", "ok"); } catch(e){}
        }
      } catch(e){ log("cleanup error:", e.message); }
    }, 2500);
  }, 300);

  // ============================================================
  // 6. Also hook into the "Message" button clicks in the friends list
  // ============================================================
  document.addEventListener("click", function(e){
    var btn = e.target.closest("[data-fr-dm]");
    if (!btn) return;
    // Disable the button visually for 1s so rapid clicks don't stack
    if (btn.disabled) return;
    btn.disabled = true;
    setTimeout(function(){ btn.disabled = false; }, 1000);
  }, true);

  log("DM dedupe ready");
})();
</script>

<style>
.ticket-row{position:relative;display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:8px;cursor:pointer;color:var(--text2);font-size:13.5px;font-weight:500;transition:background .14s;width:100%;text-align:left}
.ticket-row:hover{background:rgba(255,255,255,.045);color:var(--text)}
.ticket-row.active{background:var(--surface2);color:#fff}
.ticket-row.active::before{content:'';position:absolute;left:-8px;top:50%;transform:translateY(-50%);width:3px;height:60%;border-radius:0 3px 3px 0;background:var(--purple);box-shadow:0 0 12px rgba(180,74,255,.5)}
.ticket-row .t-emoji{font-size:15px;flex:none;width:18px;text-align:center}
.ticket-row .t-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ticket-row .t-status{font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:99px;flex:none}
.ticket-row .t-status.open{background:rgba(0,230,118,.15);color:var(--green)}
.ticket-row .t-status.closed{background:rgba(90,90,114,.25);color:var(--text3)}
.ticket-row .t-count{font-size:11px;color:var(--text3);font-family:'JetBrains Mono',monospace;flex:none}

.ticket-header-bar{
  display:flex;align-items:center;gap:10px;padding:10px 20px;
  background:linear-gradient(90deg,rgba(180,74,255,.08),rgba(0,255,224,.03));
  border-bottom:1px solid var(--border);
}
.ticket-header-bar .t-badge{
  font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:3px 9px;border-radius:99px;
}
.ticket-header-bar .t-badge.open{background:rgba(0,230,118,.15);color:var(--green)}
.ticket-header-bar .t-badge.closed{background:rgba(90,90,114,.25);color:var(--text3)}
.ticket-header-bar .t-cat{font-size:12px;color:var(--text3);margin-left:auto}

.ticket-intro{padding:24px 20px 8px;text-align:center}
.ticket-intro h2{font-family:'Space Grotesk',sans-serif;font-size:20px;margin-bottom:6px}
.ticket-intro p{font-size:13px;color:var(--text2);max-width:460px;margin:0 auto}

.ticket-msg{position:relative;display:flex;gap:13px;padding:6px 20px;animation:tIn2 .22s ease}
@keyframes tIn2{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ticket-msg:hover{background:rgba(255,255,255,.02)}
.ticket-msg .body{flex:1;min-width:0}
.ticket-msg .head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ticket-msg .author{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px}
.ticket-msg .staff-tag{font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:99px;background:rgba(255,171,0,.16);color:var(--amber)}
.ticket-msg .time{font-size:10.5px;color:var(--text3);font-family:monospace}
.ticket-msg .content{font-size:14px;color:#dcdce8;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;margin-top:2px}

.ticket-closed-note{padding:20px;text-align:center;font-size:13px;color:var(--text3);border-top:1px solid var(--border);margin-top:16px}

.ticket-cat-pick{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.ticket-cat-pick label{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid var(--border);cursor:pointer;transition:all .15s}
.ticket-cat-pick label:hover{border-color:var(--border2);background:rgba(255,255,255,.05)}
.ticket-cat-pick label.sel{border-color:var(--purple);background:rgba(180,74,255,.08);box-shadow:0 0 0 1px rgba(180,74,255,.35)}
.ticket-cat-pick .emoji{font-size:22px;flex:none}
.ticket-cat-pick .body{flex:1;min-width:0}
.ticket-cat-pick .name{font-weight:600;font-size:13.5px;color:var(--text);margin-bottom:2px}
.ticket-cat-pick .desc{font-size:11.5px;color:var(--text3);line-height:1.4}
.ticket-cat-pick input{display:none}
</style>
<script>
(function(){
  "use strict";
  if (window.__sleepyTickets) return;
  window.__sleepyTickets = true;
  function log(){ try{console.log.apply(console,["[Ticket]"].concat([].slice.call(arguments)));}catch(e){} }
  function esc(s){ return window.esc(s); }

  // -------- State --------
  window.TICKET_CATEGORIES = [];
  window.MY_TICKETS = [];        // tickets I created in this server
  window.ALL_TICKETS = [];       // all tickets in this server (if I'm staff)
  window.IS_STAFF = false;
  window.TICKET_MESSAGES = [];
  var ticketSub = null;

  // -------- Helpers --------
  function isInServer(){
    return window.CURRENT && window.CURRENT.type === 'server' && window.CURRENT.server;
  }
  function myTicketIds(){ return (window.MY_TICKETS || []).map(function(t){ return t.id; }); }

  // -------- Load data when entering server --------
  async function loadTicketData(){
    if (!isInServer()) return;
    var srv = window.CURRENT.server;
    try {
      // Am I staff?
      var staffResp = await sb.rpc('is_server_staff', { sid: srv.id, uid: window.ME.id });
      window.IS_STAFF = !!staffResp.data;

      // Categories
      var catResp = await sb.from('ticket_categories')
        .select('*').eq('server_id', srv.id).order('position', { ascending: true });
      window.TICKET_CATEGORIES = catResp.data || [];

      // My tickets
      var mineResp = await sb.from('tickets')
        .select('*').eq('server_id', srv.id).eq('creator_id', window.ME.id)
        .order('created_at', { ascending: false });
      window.MY_TICKETS = mineResp.data || [];

      // All tickets (staff only)
      if (window.IS_STAFF){
        var allResp = await sb.from('tickets')
          .select('*').eq('server_id', srv.id)
          .order('created_at', { ascending: false });
        window.ALL_TICKETS = allResp.data || [];
      } else {
        window.ALL_TICKETS = [];
      }
    } catch(e){
      log("loadTicketData failed:", e.message);
    }
  }

  // -------- Sidebar rendering --------
  function injectTicketsIntoPanel(){
    var body = document.getElementById('panel-body');
    if (!body) return;
    var existing = document.getElementById('tickets-section');
    if (existing) existing.remove();

    if (!isInServer()) return;

    var visible = window.IS_STAFF ? window.ALL_TICKETS : window.MY_TICKETS;
    var open = visible.filter(function(t){ return t.status === 'open'; });
    var closed = visible.filter(function(t){ return t.status === 'closed'; });

    var section = document.createElement('div');
    section.className = 'panel-section';
    section.id = 'tickets-section';

    var headerHTML = '<div class="panel-label">' +
      '<span>Tickets' + (visible.length ? ' (' + open.length + ')' : '') + '</span>' +
      '<span class="add" data-ticket-new title="Create a ticket">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="width:12px;height:12px"><path d="M12 5v14M5 12h14"/></svg>' +
      '</span>' +
    '</div>';

    var listHTML = '';
    if (!visible.length){
      listHTML = '<div style="padding:4px 10px 8px;font-size:12px;color:var(--text3)">No tickets yet.</div>';
    } else {
      var sorted = open.concat(closed);
      listHTML = sorted.map(function(t){
        var cat = (window.TICKET_CATEGORIES || []).filter(function(c){ return c.id === t.category_id; })[0];
        var emoji = cat ? cat.emoji : '🎫';
        var isActive = window.CURRENT.type === 'ticket' && window.CURRENT.ticket && window.CURRENT.ticket.id === t.id;
        var label = cat ? cat.name : 'Ticket';
        if (window.IS_STAFF && t.creator_id !== window.ME.id){
          var p = window.PROFILES[t.creator_id];
          label += ' · ' + (p ? (p.display_name || p.username) : 'user');
        }
        return '<button class="ticket-row ' + (isActive ? 'active' : '') + '" data-ticket-id="' + t.id + '">' +
          '<span class="t-emoji">' + emoji + '</span>' +
          '<span class="t-title">' + esc(label) + '</span>' +
          '<span class="t-status ' + t.status + '">' + t.status + '</span>' +
        '</button>';
      }).join('');
    }

    section.innerHTML = headerHTML + listHTML;

    // Insert after the last channel section, before the action buttons
    var sections = body.querySelectorAll('.panel-section');
    var lastChannelSection = null;
    sections.forEach(function(s){
      if (s.querySelector('[data-channel]')) lastChannelSection = s;
    });
    if (lastChannelSection) lastChannelSection.insertAdjacentElement('afterend', section);
    else body.insertBefore(section, body.firstChild);

    // Wire "create" button
    var createBtn = section.querySelector('[data-ticket-new]');
    if (createBtn) createBtn.onclick = function(e){
      e.stopPropagation();
      openCreateTicketModal();
    };

    // Wire ticket rows
    section.querySelectorAll('[data-ticket-id]').forEach(function(b){
      b.onclick = function(){ openTicket(b.dataset.ticketId); };
    });
  }

  // -------- Create ticket modal --------
  function openCreateTicketModal(){
    if (!isInServer()) return;
    var cats = window.TICKET_CATEGORIES || [];
    if (!cats.length){
      if (window.IS_STAFF){
        window.openModal("Create Ticket", 
          '<p style="color:var(--text2);font-size:13px">This server has no ticket categories yet. Create one first.</p>',
          { footer: '<button class="btn" id="tc-cancel">Close</button><button class="btn primary" id="tc-newcat">Add a Category</button>',
            onMount: function(){
              document.getElementById('tc-cancel').onclick = window.closeModal;
              document.getElementById('tc-newcat').onclick = function(){ window.closeModal(); openCategoryManager(); };
            }});
      } else {
        window.toast("Tickets not set up", "This server hasn't configured any ticket categories yet.", "err");
      }
      return;
    }
    var selected = cats[0].id;

    function catHTML(){
      return cats.map(function(c){
        return '<label class="' + (c.id === selected ? 'sel' : '') + '" data-cat-id="' + c.id + '">' +
          '<span class="emoji">' + c.emoji + '</span>' +
          '<span class="body"><span class="name">' + esc(c.name) + '</span>' +
            (c.description ? '<span class="desc">' + esc(c.description) + '</span>' : '') +
          '</span>' +
        '</label>';
      }).join('');
    }

    window.openModal("Create a Ticket",
      '<p style="color:var(--text2);font-size:13px;margin-bottom:12px">Pick a category. Only you and the staff can see this ticket.</p>' +
      '<div class="ticket-cat-pick" id="tc-cats">' + catHTML() + '</div>' +
      '<div class="field" style="margin-top:16px"><label>Subject (optional)</label>' +
        '<input id="tc-subject" placeholder="Short summary" maxlength="120"></div>',
      { footer: '<button class="btn" id="tc-cancel">Cancel</button><button class="btn primary" id="tc-create">Create Ticket</button>',
        onMount: function(){
          document.getElementById('tc-cats').onclick = function(e){
            var lab = e.target.closest('[data-cat-id]');
            if (!lab) return;
            selected = lab.dataset.catId;
            document.querySelectorAll('#tc-cats label').forEach(function(x){ x.classList.remove('sel'); });
            lab.classList.add('sel');
          };
          document.getElementById('tc-cancel').onclick = window.closeModal;
          document.getElementById('tc-create').onclick = async function(){
            try {
              var subj = document.getElementById('tc-subject').value.trim();
              var r = await sb.from('tickets').insert({
                server_id: window.CURRENT.server.id,
                category_id: selected,
                creator_id: window.ME.id,
                subject: subj,
                status: 'open'
              }).select().single();
              if (r.error) throw r.error;
              window.closeModal();
              await loadTicketData();
              if (window.IS_STAFF){
                var ar = await sb.from('tickets').select('*').eq('server_id', window.CURRENT.server.id).order('created_at', { ascending: false });
                window.ALL_TICKETS = ar.data || [];
              }
              renderPanel();
              openTicket(r.data.id);
              window.toast("Ticket created", "Staff will respond soon.", "ok");
            } catch(e){
              window.toast("Could not create ticket", e.message || String(e), "err");
            }
          };
        }});
  }

  // -------- Category manager (staff only) --------
  function openCategoryManager(){
    if (!isInServer() || !window.IS_STAFF) return;
    var cats = window.TICKET_CATEGORIES || [];

    function listHTML(){
      if (!cats.length) return '<div class="empty" style="padding:14px">No categories yet.</div>';
      return cats.map(function(c){
        return '<div style="display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;background:rgba(255,255,255,.03);margin-bottom:6px">' +
          '<span style="font-size:20px">' + c.emoji + '</span>' +
          '<div style="flex:1;min-width:0">' +
            '<div style="font-weight:600">' + esc(c.name) + '</div>' +
            (c.description ? '<div style="font-size:11.5px;color:var(--text3)">' + esc(c.description) + '</div>' : '') +
          '</div>' +
          '<button class="btn sm danger" data-del-cat="' + c.id + '">Delete</button>' +
        '</div>';
      }).join('');
    }

    window.openModal("Ticket Categories",
      '<p style="color:var(--text2);font-size:13px;margin-bottom:12px">Categories let users pick the right kind of ticket. Only staff can manage these.</p>' +
      '<div id="cm-list">' + listHTML() + '</div>' +
      '<hr style="border:none;border-top:1px solid var(--border);margin:16px 0">' +
      '<div style="display:grid;grid-template-columns:70px 1fr;gap:8px;margin-bottom:10px">' +
        '<input id="cm-emoji" placeholder="🎫" maxlength="4" style="text-align:center;padding:10px;border-radius:8px;background:var(--void);border:1px solid var(--border);font-size:20px">' +
        '<input id="cm-name" placeholder="Category name" maxlength="40" style="padding:10px;border-radius:8px;background:var(--void);border:1px solid var(--border)">' +
      '</div>' +
      '<input id="cm-desc" placeholder="Short description (optional)" maxlength="100" style="width:100%;padding:10px;border-radius:8px;background:var(--void);border:1px solid var(--border);margin-bottom:10px">' +
      '<button class="btn primary" id="cm-add">+ Add Category</button>',
      { wide: true,
        footer: '<button class="btn" id="cm-close">Done</button>',
        onMount: function(){
          document.getElementById('cm-close').onclick = window.closeModal;
          document.getElementById('cm-add').onclick = async function(){
            var emoji = document.getElementById('cm-emoji').value.trim() || '🎫';
            var name = document.getElementById('cm-name').value.trim();
            var desc = document.getElementById('cm-desc').value.trim();
            if (!name) return window.toast("Name required", "", "err");
            try {
              var r = await sb.from('ticket_categories').insert({
                server_id: window.CURRENT.server.id,
                name: name, emoji: emoji, description: desc,
                position: (cats.length || 0)
              }).select().single();
              if (r.error) throw r.error;
              cats.push(r.data);
              document.getElementById('cm-list').innerHTML = listHTML();
              wireDel();
              document.getElementById('cm-name').value = '';
              document.getElementById('cm-desc').value = '';
              window.toast("Added", "Category created.", "ok");
              await loadTicketData();
            } catch(e){ window.toast("Error", e.message || String(e), "err"); }
          };
          function wireDel(){
            document.querySelectorAll('[data-del-cat]').forEach(function(b){
              b.onclick = async function(){
                try {
                  await sb.from('ticket_categories').delete().eq('id', b.dataset.delCat);
                  cats = cats.filter(function(c){ return c.id !== b.dataset.delCat; });
                  document.getElementById('cm-list').innerHTML = listHTML();
                  wireDel();
                  await loadTicketData();
                } catch(e){ window.toast("Error", e.message || String(e), "err"); }
              };
            });
          }
          wireDel();
        }});
  }

  // -------- Open a ticket --------
  async function openTicket(id){
    var t = (window.ALL_TICKETS || []).concat(window.MY_TICKETS || []).filter(function(x){ return x.id === id; })[0];
    if (!t){
      var r = await sb.from('tickets').select('*').eq('id', id).maybeSingle();
      if (r.data) t = r.data;
    }
    if (!t) return;

    window.CURRENT = { type: 'ticket', ticket: t, server: window.CURRENT.server, channel: null, conv: null };
    window.TICKET_MESSAGES = [];

    // Subscribe to realtime for this ticket
    if (ticketSub){ try { sb.removeChannel(ticketSub); } catch(e){} }
    ticketSub = sb.channel('ticket-' + id)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'ticket_messages', filter: 'ticket_id=eq.' + id },
        async function(payload){
          window.TICKET_MESSAGES.push(payload.new);
          if (window.CURRENT.type === 'ticket' && window.CURRENT.ticket.id === id){
            await renderTicketView();
          }
          loadTicketData().then(renderPanel);
        })
      .subscribe();

    // Load messages
    var m = await sb.from('ticket_messages').select('*').eq('ticket_id', id).order('id', { ascending: true }).limit(500);
    window.TICKET_MESSAGES = m.data || [];

    // Ensure sender profiles
    var ids = window.TICKET_MESSAGES.map(function(x){ return x.sender_id; });
    ids.push(t.creator_id);
    await window.fetchProfiles(ids);

    renderChatHead();
    await renderTicketView();
    renderPanel();
  }

  async function renderTicketView(){
    var body = document.getElementById('chat-body');
    if (!body) return;
    var t = window.CURRENT.ticket;
    if (!t) return;

    var cat = (window.TICKET_CATEGORIES || []).filter(function(c){ return c.id === t.category_id; })[0];
    var creator = window.PROFILES[t.creator_id];

    // Header bar
    var headerBar =
      '<div class="ticket-header-bar">' +
        '<span class="t-badge ' + t.status + '">' + t.status + '</span>' +
        '<span style="font-size:12.5px;color:var(--text2)">' +
          (cat ? (cat.emoji + ' ' + esc(cat.name)) : 'Ticket') +
          ' · opened by ' + esc(creator ? (creator.display_name || creator.username) : 'user') +
          ' · ' + new Date(t.created_at).toLocaleString() +
        '</span>' +
        (t.status === 'open' && (window.IS_STAFF || t.creator_id === window.ME.id)
          ? '<button class="btn sm danger" id="ticket-close-btn" style="margin-left:auto">Close Ticket</button>'
          : '') +
      '</div>';

    // Intro card
    var intro = '<div class="ticket-intro">' +
      '<h2>' + (cat ? (cat.emoji + ' ' + esc(cat.name)) : 'Ticket') + '</h2>' +
      '<p>' + (cat ? esc(cat.description || '') : '') + '</p>' +
      (t.subject ? '<div style="margin-top:10px;font-size:13px;color:var(--text2)">Subject: <b>' + esc(t.subject) + '</b></div>' : '') +
    '</div>';

    // Messages
    var msgsHTML = '';
    if (!window.TICKET_MESSAGES.length){
      msgsHTML = '<div style="padding:24px;text-align:center;color:var(--text3);font-size:13px">No messages yet. Say something.</div>';
    } else {
      var lastAuthor = null, lastTs = 0;
      window.TICKET_MESSAGES.forEach(function(m){
        var p = window.PROFILES[m.sender_id] || { username: 'user', display_name: 'User' };
        var grouped = lastAuthor === m.sender_id && (new Date(m.created_at) - lastTs) < 5*60*1000;
        var isStaff = false; // we'd need a server-side check; simplify: show tag if they're not the creator
        if (m.sender_id !== t.creator_id) isStaff = true;
        var html = '<div class="ticket-msg">';
        if (grouped){
          html += '<div style="width:36px;flex:none"></div>';
        } else {
          html += '<div style="position:relative">' + window.avatarHTML(m.sender_id, 36) + '</div>';
        }
        html += '<div class="body">';
        if (!grouped){
          html += '<div class="head">' +
            '<span class="author">' + esc(p.display_name || p.username) + '</span>' +
            (isStaff ? '<span class="staff-tag">staff</span>' : '') +
            '<span class="time">' + new Date(m.created_at).toLocaleTimeString(undefined, { hour:'2-digit', minute:'2-digit' }) + '</span>' +
          '</div>';
        }
        html += '<div class="content">' + esc(m.content) + '</div>';
        html += '</div></div>';
        msgsHTML += html;
        lastAuthor = m.sender_id;
        lastTs = new Date(m.created_at).getTime();
      });
    }

    // Closed note
    var closedNote = '';
    if (t.status === 'closed'){
      closedNote = '<div class="ticket-closed-note">🔒 This ticket is closed. ' +
        (window.IS_STAFF ? 'Reopen it from the header to reply.' : 'Only staff can reply now.') + '</div>';
    }

    body.innerHTML = headerBar + intro + '<div style="padding-bottom:20px">' + msgsHTML + '</div>' + closedNote;

    // Scroll to bottom
    requestAnimationFrame(function(){ body.scrollTop = body.scrollHeight; });

    // Wire close button
    var cb = document.getElementById('ticket-close-btn');
    if (cb) cb.onclick = async function(){
      try {
        await sb.from('tickets').update({ status: 'closed', closed_at: new Date().toISOString(), closed_by: window.ME.id }).eq('id', t.id);
        t.status = 'closed';
        await loadTicketData();
        await renderTicketView();
        renderPanel();
        window.toast("Ticket closed", "", "ok");
      } catch(e){ window.toast("Error", e.message || String(e), "err"); }
    };

    renderComposer();
  }

  // -------- Composer for tickets --------
  var origRenderComposer = window.renderComposer;
  window.renderComposer = function(){
    if (window.CURRENT && window.CURRENT.type === 'ticket'){
      var t = window.CURRENT.ticket;
      var wrap = document.getElementById('composer-wrap');
      if (!wrap) return;
      if (t.status === 'closed'){
        wrap.innerHTML = '<div class="composer" style="opacity:.55"><span style="color:var(--text3);font-size:13px">🔒 This ticket is closed.</span></div>';
        return;
      }
      wrap.innerHTML =
        '<div class="composer">' +
          '<textarea id="composer-input" rows="1" placeholder="Message this ticket..."></textarea>' +
          '<button class="cbtn send" id="send-btn">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><path d="m22 2-7 20-4-9-9-4 20-7z"/></svg>' +
          '</button>' +
        '</div>';
      var ta = document.getElementById('composer-input');
      if (window.autosize) window.autosize(ta);
      ta.addEventListener('input', function(){ if (window.autosize) window.autosize(ta); });
      ta.addEventListener('keydown', function(e){
        if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); ticketSend(); }
      });
      document.getElementById('send-btn').onclick = ticketSend;
      return;
    }
    return origRenderComposer();
  };

  async function ticketSend(){
    var ta = document.getElementById('composer-input');
    if (!ta) return;
    var text = ta.value.trim();
    if (!text) return;
    var t = window.CURRENT.ticket;
    try {
      var r = await sb.from('ticket_messages').insert({
        ticket_id: t.id,
        sender_id: window.ME.id,
        content: text.slice(0, 4000)
      });
      if (r.error) throw r.error;
      ta.value = '';
      if (window.autosize) window.autosize(ta);
    } catch(e){ window.toast("Could not send", e.message || String(e), "err"); }
  }

  // -------- Hook into panel + chat rendering --------
  var origRenderPanel = window.renderPanel;
  window.renderPanel = function(){
    var r = origRenderPanel.apply(this, arguments);
    setTimeout(injectTicketsIntoPanel, 10);
    return r;
  };

  var origRenderChatHead = window.renderChatHead;
  window.renderChatHead = function(){
    if (window.CURRENT && window.CURRENT.type === 'ticket'){
      var el = document.getElementById('chat-head');
      var t = window.CURRENT.ticket;
      var cat = (window.TICKET_CATEGORIES || []).filter(function(c){ return c.id === t.category_id; })[0];
      el.innerHTML =
        '<button class="hbtn mobile-only" data-act="toggle-panel">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="width:20px;height:20px"><path d="M3 6h18M3 12h18M3 18h18"/></svg>' +
        '</button>' +
        '<div class="title"><span style="font-size:16px">' + (cat ? cat.emoji : '🎫') + '</span>' +
        '<span class="txt">' + esc(cat ? cat.name : 'Ticket') + '</span></div>' +
        '<div class="spacer"></div>' +
        (window.IS_STAFF ? '<button class="hbtn" id="ticket-config-btn" title="Ticket categories">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:17px;height:17px"><circle cx="12" cy="12" r="3"/><path d="M12 1v6M12 17v6M4.22 4.22l4.24 4.24M15.54 15.54l4.24 4.24M1 12h6M17 12h6M4.22 19.78l4.24-4.24M15.54 8.46l4.24-4.24"/></svg>' +
        '</button>' : '') +
        '<button class="hbtn" data-act="settings">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:17px;height:17px"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7H1a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 2.6 7a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H7a1.6 1.6 0 0 0 1-1.5V1a2 2 0 1 1 4 0v.1A1.6 1.6 0 0 0 15 2.6a1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V7a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>' +
        '</button>';
      var cfg = document.getElementById('ticket-config-btn');
      if (cfg) cfg.onclick = openCategoryManager;
      return;
    }
    return origRenderChatHead.apply(this, arguments);
  };

  var origRenderChat = window.renderChat;
  window.renderChat = function(scroll){
    if (window.CURRENT && window.CURRENT.type === 'ticket'){
      renderTicketView();
      return;
    }
    return origRenderChat.apply(this, arguments);
  };

  // Load tickets when entering a server
  var origGoServer = window.goServer;
  window.goServer = async function(sid){
    var r = await origGoServer.apply(this, arguments);
    await loadTicketData();
    setTimeout(injectTicketsIntoPanel, 200);
    return r;
  };

  // Also refresh on channel switch (panel re-renders)
  var origGoChannel = window.goChannel;
  window.goChannel = async function(cid){
    var r = await origGoChannel.apply(this, arguments);
    setTimeout(injectTicketsIntoPanel, 200);
    return r;
  };

  // Auto-load on boot if we land in a server
  setTimeout(async function(){
    if (isInServer()){
      await loadTicketData();
      injectTicketsIntoPanel();
    }
  }, 3000);

  log("ticket system ready");
})();
</script>

<script>
(function(){
  "use strict";
  if (window.__sleepyTicketsV2) return;
  window.__sleepyTicketsV2 = true;
  function log(){ try{console.log.apply(console,["[TicketV2]"].concat([].slice.call(arguments)));}catch(e){} }
  function esc(s){ return window.esc(s); }

  // ---------- State ----------
  var cats = [], myTickets = [], allTickets = [], isStaff = false;
  var messages = [];
  var serverSub = null, msgSub = null;
  var currentServerId = null;

  function inServer(){ return window.CURRENT && window.CURRENT.type !== 'dm' && window.CURRENT.server; }

  // ---------- Load ----------
  async function loadAll(){
    if (!inServer()) return;
    var sid = window.CURRENT.server.id;
    try {
      var sr = await sb.rpc('is_server_staff', { sid: sid, uid: window.ME.id });
      isStaff = !!sr.data;

      var cr = await sb.from('ticket_categories').select('*').eq('server_id', sid).order('position');
      cats = cr.data || [];

      var mr = await sb.from('tickets').select('*').eq('server_id', sid).eq('creator_id', window.ME.id).order('created_at', { ascending: false });
      myTickets = mr.data || [];

      if (isStaff){
        var ar = await sb.from('tickets').select('*').eq('server_id', sid).order('created_at', { ascending: false });
        allTickets = ar.data || [];
        var ids = allTickets.map(function(t){ return t.creator_id; }).filter(function(v,i,a){ return a.indexOf(v) === i; });
        if (ids.length) await window.fetchProfiles(ids);
      } else {
        allTickets = [];
      }

      if (currentServerId !== sid || !serverSub){
        currentServerId = sid;
        subscribeServer();
      }
    } catch(e){ log("loadAll:", e.message); }
  }

  async function refreshLists(){
    if (!inServer()) return;
    var sid = window.CURRENT.server.id;
    var mr = await sb.from('tickets').select('*').eq('server_id', sid).eq('creator_id', window.ME.id).order('created_at', { ascending: false });
    myTickets = mr.data || [];
    if (isStaff){
      var ar = await sb.from('tickets').select('*').eq('server_id', sid).order('created_at', { ascending: false });
      allTickets = ar.data || [];
      var ids = allTickets.map(function(t){ return t.creator_id; }).filter(function(v,i,a){ return a.indexOf(v) === i; });
      if (ids.length) await window.fetchProfiles(ids);
    }
  }

  function subscribeServer(){
    if (serverSub){ try { sb.removeChannel(serverSub); } catch(e){} }
    if (!inServer()) return;
    var sid = window.CURRENT.server.id;
    serverSub = sb.channel('srv-tickets-' + sid)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'tickets', filter: 'server_id=eq.' + sid }, function(){
        log("ticket list change");
        refreshLists().then(function(){
          injectChannel();
          if (window.CURRENT && window.CURRENT.type === 'tickets_hub') renderHub();
        });
      })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'ticket_categories', filter: 'server_id=eq.' + sid }, function(){
        sb.from('ticket_categories').select('*').eq('server_id', sid).order('position').then(function(r){
          cats = r.data || [];
          if (window.CURRENT && window.CURRENT.type === 'tickets_hub') renderHub();
        });
      })
      .subscribe(function(s){ log("server sub:", s); });
  }

  // ---------- Sidebar: tickets as a channel entry ----------
  function injectChannel(){
    var body = document.getElementById('panel-body');
    if (!body || !inServer()) return;
    var oldSection = document.getElementById('tickets-section');
    if (oldSection) oldSection.remove();
    var existing = document.getElementById('tickets-channel-entry');
    if (existing) existing.remove();

    // Find last section that has a real channel
    var sections = body.querySelectorAll('.panel-section');
    var lastChannelSection = null;
    sections.forEach(function(s){
      if (s.querySelector('[data-channel]')) lastChannelSection = s;
    });

    var wrap = document.createElement('div');
    wrap.id = 'tickets-channel-entry';
    wrap.className = 'panel-section';
    wrap.style.marginTop = '-8px';

    var isActive = window.CURRENT && window.CURRENT.type === 'tickets_hub';
    var count = isStaff ? allTickets.length : myTickets.length;

    wrap.innerHTML =
      '<button class="row ' + (isActive ? 'active' : '') + '" data-tickets-hub>' +
        '<span style="font-size:15px;flex:none;width:16px;text-align:center;line-height:1;opacity:.9">🎫</span>' +
        '<span class="txt">tickets</span>' +
        (count > 0 ? '<span class="badge" style="background:var(--purple);min-width:18px">' + count + '</span>' : '') +
      '</button>';

    if (lastChannelSection) lastChannelSection.insertAdjacentElement('afterend', wrap);
    else body.insertBefore(wrap, body.firstChild);

    var btn = wrap.querySelector('[data-tickets-hub]');
    if (btn) btn.onclick = openHub;
  }

  // ---------- Hub ----------
  function openHub(){
    window.CURRENT = { type: 'tickets_hub', server: window.CURRENT.server, channel: null, conv: null, ticket: null };
    injectChannel();
    window.renderChatHead();
    renderHub();
    var cw = document.getElementById('composer-wrap');
    if (cw) cw.innerHTML = '';
    var tb = document.getElementById('typing-bar');
    if (tb) tb.innerHTML = '';
  }

  function timeAgo(ts){
    var d = Date.now() - new Date(ts).getTime();
    if (d < 60000) return 'just now';
    if (d < 3600000) return Math.floor(d/60000) + 'm ago';
    if (d < 86400000) return Math.floor(d/3600000) + 'h ago';
    return Math.floor(d/86400000) + 'd ago';
  }

  function renderHub(){
    var body = document.getElementById('chat-body');
    if (!body) return;

    var html = '<div class="ticket-hub">';
    html += '<div class="hero">' +
      '<div class="ico">🎫</div>' +
      '<h2>Tickets</h2>' +
      '<p>Open a private conversation with the staff. Only you and the staff can read your tickets.</p>' +
    '</div>';

    // Categories
    if (cats.length){
      html += '<h3>Open a new ticket</h3><div class="cat-grid">';
      cats.forEach(function(c){
        html += '<button class="cat-btn" data-create="' + c.id + '">' +
          '<span class="emoji">' + c.emoji + '</span>' +
          '<span style="flex:1;min-width:0">' +
            '<span class="name">' + esc(c.name) + '</span>' +
            (c.description ? '<span class="desc">' + esc(c.description) + '</span>' : '') +
          '</span>' +
        '</button>';
      });
      html += '</div>';
    } else {
      html += '<div class="empty-hint">' +
        (isStaff
          ? 'No categories yet. Click <b>Manage Categories</b> at the bottom.'
          : 'The staff hasn\'t set up ticket categories yet.') +
      '</div>';
    }

    // My open tickets
    var myOpen = myTickets.filter(function(t){ return t.status === 'open'; });
    if (myOpen.length){
      html += '<h3>Your open tickets — ' + myOpen.length + '</h3>';
      myOpen.forEach(function(t){
        var c = cats.find(function(x){ return x.id === t.category_id; }) || { emoji: '🎫', name: 'Ticket' };
        html += '<button class="tkt-item" data-open="' + t.id + '">' +
          '<span class="emoji">' + c.emoji + '</span>' +
          '<span class="info"><span class="name">' + esc(c.name) + '</span>' +
            '<span class="meta">' + timeAgo(t.created_at) + (t.subject ? ' · ' + esc(t.subject) : '') + '</span>' +
          '</span>' +
          '<span class="badge open">open</span>' +
        '</button>';
      });
      html += '<div style="height:24px"></div>';
    }

    // All open (staff)
    if (isStaff){
      var staffOpen = allTickets.filter(function(t){ return t.status === 'open'; });
      if (staffOpen.length){
        html += '<h3>All open tickets — ' + staffOpen.length + ' <span style="color:var(--amber);text-transform:none;letter-spacing:0;font-weight:400;margin-left:6px">staff only</span></h3>';
        staffOpen.forEach(function(t){
          var c = cats.find(function(x){ return x.id === t.category_id; }) || { emoji: '🎫', name: 'Ticket' };
          var p = window.PROFILES[t.creator_id] || { username: 'user', display_name: 'User' };
          html += '<button class="tkt-item" data-open="' + t.id + '">' +
            '<span class="emoji">' + c.emoji + '</span>' +
            '<span class="info"><span class="name">' + esc(c.name) + '</span>' +
              '<span class="meta">' + esc(p.display_name || p.username) + ' · ' + timeAgo(t.created_at) + (t.subject ? ' · ' + esc(t.subject) : '') + '</span>' +
            '</span>' +
            '<span class="badge open">open</span>' +
          '</button>';
        });
      }
    }

    // Staff controls
    if (isStaff){
      html += '<div style="text-align:center;padding:24px 0 0;border-top:1px solid var(--border);margin-top:24px">' +
        '<button class="btn" id="manage-cats-btn">Manage Categories</button>' +
      '</div>';
    }

    html += '</div>';
    body.innerHTML = html;

    body.querySelectorAll('[data-create]').forEach(function(b){
      b.onclick = function(){ createTicket(b.dataset.create); };
    });
    body.querySelectorAll('[data-open]').forEach(function(b){
      b.onclick = function(){ openTicket(b.dataset.open); };
    });
    var mc = document.getElementById('manage-cats-btn');
    if (mc) mc.onclick = openCategoryManager;
  }

  // ---------- Create ----------
  async function createTicket(categoryId){
    try {
      var r = await sb.from('tickets').insert({
        server_id: window.CURRENT.server.id,
        category_id: categoryId,
        creator_id: window.ME.id,
        status: 'open'
      }).select().single();
      if (r.error) throw r.error;
      await refreshLists();
      window.toast("Ticket created", "Opening your ticket.", "ok");
      openTicket(r.data.id);
    } catch(e){ window.toast("Could not create ticket", e.message || String(e), "err"); }
  }

  // ---------- Open ----------
  async function openTicket(id){
    var t = allTickets.concat(myTickets).find(function(x){ return x.id === id; });
    if (!t){
      var r = await sb.from('tickets').select('*').eq('id', id).maybeSingle();
      if (r.data) t = r.data;
    }
    if (!t) return;

    window.CURRENT = { type: 'ticket', ticket: t, server: window.CURRENT.server, channel: null, conv: null };

    var m = await sb.from('ticket_messages').select('*').eq('ticket_id', id).order('id', { ascending: true }).limit(500);
    messages = m.data || [];

    var ids = messages.map(function(x){ return x.sender_id; });
    ids.push(t.creator_id);
    await window.fetchProfiles(ids);

    if (msgSub){ try { sb.removeChannel(msgSub); } catch(e){} }
    msgSub = sb.channel('tkt-' + id)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'ticket_messages', filter: 'ticket_id=eq.' + id }, function(payload){
        messages.push(payload.new);
        if (window.CURRENT && window.CURRENT.type === 'ticket' && window.CURRENT.ticket.id === id) renderChat();
      })
      .subscribe();

    injectChannel();
    window.renderChatHead();
    renderChat();
    window.renderComposer();
  }

  // ---------- Render chat ----------
  function renderChat(){
    var body = document.getElementById('chat-body');
    if (!body) return;
    var t = window.CURRENT.ticket;
    if (!t) return;

    var c = cats.find(function(x){ return x.id === t.category_id; }) || { emoji: '🎫', name: 'Ticket' };
    var creator = window.PROFILES[t.creator_id] || { username: 'user', display_name: 'User' };

    var html = '<div class="ticket-strip">' +
      '<span class="badge ' + t.status + '">' + t.status + '</span>' +
      '<span>' + esc(c.name) + '</span>' +
      '<span class="sep">·</span>' +
      '<span>opened by ' + esc(creator.display_name || creator.username) + '</span>' +
      '<span class="sep">·</span>' +
      '<span>' + new Date(t.created_at).toLocaleString() + '</span>' +
    '</div>';

    html += '<div style="padding:18px 0 4px">';
    if (!messages.length){
      html += '<div style="text-align:center;padding:48px 20px;color:var(--text3);font-size:13px">No messages yet. Start the conversation below.</div>';
    } else {
      var lastAuthor = null, lastTs = 0;
      messages.forEach(function(m){
        var p = window.PROFILES[m.sender_id] || { username: 'user', display_name: 'User' };
        var grouped = lastAuthor === m.sender_id && (new Date(m.created_at) - lastTs) < 5 * 60000;
        var staff = m.sender_id !== t.creator_id;
        var mine = m.sender_id === window.ME.id;

        var h = '<div class="msg" style="padding:4px 20px">';
        if (grouped) h += '<div style="width:36px;flex:none"></div>';
        else h += '<div style="position:relative">' + window.avatarHTML(m.sender_id, 36) + '</div>';
        h += '<div style="flex:1;min-width:0">';
        if (!grouped){
          h += '<div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap">' +
            '<span style="font-family:\'Space Grotesk\',sans-serif;font-weight:600;font-size:14px">' + esc(p.display_name || p.username) + '</span>' +
            (staff ? '<span style="font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:99px;background:rgba(255,171,0,.16);color:var(--amber)">staff</span>' : '') +
            (mine ? '<span style="font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:99px;background:rgba(0,255,224,.14);color:var(--cyan)">you</span>' : '') +
            '<span style="font-size:10.5px;color:var(--text3);font-family:monospace">' + new Date(m.created_at).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' }) + '</span>' +
          '</div>';
        }
        h += '<div style="font-size:14px;color:#dcdce8;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;margin-top:1px">' + esc(m.content) + '</div>';
        h += '</div></div>';
        html += h;
        lastAuthor = m.sender_id;
        lastTs = new Date(m.created_at).getTime();
      });
    }
    html += '</div>';

    if (t.status === 'open'){
      html += '<div class="ticket-actions"><div class="row">' +
        '<button class="export-btn" id="tk-export">Export transcript</button>' +
        (isStaff || t.creator_id === window.ME.id ? '<button class="close-btn" id="tk-close">Close & Delete</button>' : '') +
      '</div></div>';
    } else {
      html += '<div style="padding:24px;text-align:center;color:var(--text3);font-size:13px;border-top:1px solid var(--border)">This ticket is closed.</div>';
    }

    body.innerHTML = html;
    requestAnimationFrame(function(){ body.scrollTop = body.scrollHeight; });

    var ex = document.getElementById('tk-export');
    if (ex) ex.onclick = function(){ exportTranscript(t); };
    var cl = document.getElementById('tk-close');
    if (cl) cl.onclick = function(){ closeFlow(t); };
  }

  // ---------- Composer ----------
  function renderComposerTicket(){
    var wrap = document.getElementById('composer-wrap');
    if (!wrap) return;
    var t = window.CURRENT.ticket;
    if (!t || t.status === 'closed'){
      wrap.innerHTML = t ? '<div class="composer" style="opacity:.55"><span style="color:var(--text3);font-size:13px">🔒 This ticket is closed.</span></div>' : '';
      return;
    }
    var c = cats.find(function(x){ return x.id === t.category_id; }) || { name: 'ticket' };
    wrap.innerHTML =
      '<div class="composer">' +
        '<textarea id="composer-input" rows="1" placeholder="Message #' + esc(c.name.toLowerCase().replace(/\s+/g, '-')) + '"></textarea>' +
        '<button class="cbtn send" id="send-btn" title="Send">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><path d="m22 2-7 20-4-9-9-4 20-7z"/></svg>' +
        '</button>' +
      '</div>';
    var ta = document.getElementById('composer-input');
    if (ta){
      if (window.autosize) window.autosize(ta);
      ta.addEventListener('input', function(){ if (window.autosize) window.autosize(ta); });
      ta.addEventListener('keydown', function(e){
        if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendTicketMessage(); }
      });
    }
    var sb2 = document.getElementById('send-btn');
    if (sb2) sb2.onclick = sendTicketMessage;
  }

  async function sendTicketMessage(){
    var ta = document.getElementById('composer-input');
    if (!ta) return;
    var text = ta.value.trim();
    if (!text) return;
    var t = window.CURRENT.ticket;
    try {
      var r = await sb.from('ticket_messages').insert({ ticket_id: t.id, sender_id: window.ME.id, content: text.slice(0, 4000) });
      if (r.error) throw r.error;
      ta.value = '';
      if (window.autosize) window.autosize(ta);
    } catch(e){ window.toast("Could not send", e.message || String(e), "err"); }
  }

  // ---------- Export ----------
  function buildTranscript(t){
    var c = cats.find(function(x){ return x.id === t.category_id; }) || { name: 'Ticket' };
    var lines = [];
    var bar = '═══════════════════════════════════════════════';
    lines.push(bar);
    lines.push('  SLEEPY-CHAT — TICKET TRANSCRIPT');
    lines.push(bar);
    lines.push('  Category: ' + c.name);
    lines.push('  Server:   ' + (window.CURRENT.server ? window.CURRENT.server.name : ''));
    lines.push('  Opened:   ' + new Date(t.created_at).toLocaleString());
    lines.push('  Ticket:   ' + t.id);
    lines.push(bar);
    lines.push('');
    messages.forEach(function(m){
      var p = window.PROFILES[m.sender_id] || { username: 'user', display_name: 'User' };
      var staff = m.sender_id !== t.creator_id ? ' (staff)' : '';
      lines.push('[' + new Date(m.created_at).toLocaleString() + '] ' + (p.display_name || p.username) + staff + ':');
      lines.push('  ' + m.content);
      lines.push('');
    });
    lines.push(bar);
    lines.push('  Exported: ' + new Date().toLocaleString());
    lines.push(bar);
    return lines.join('\n');
  }

  function exportTranscript(t){
    var text = buildTranscript(t);
    var c = cats.find(function(x){ return x.id === t.category_id; }) || { name: 'ticket' };
    var fname = 'ticket-' + c.name.replace(/\s+/g, '-').toLowerCase() + '-' + t.id.slice(0, 8) + '.txt';
    var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = fname;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    window.toast("Transcript saved", fname, "ok");
  }

  // ---------- Close & Delete ----------
  function closeFlow(t){
    var preview = messages.slice(-3).map(function(m){
      var p = window.PROFILES[m.sender_id] || { username: 'user' };
      return '[' + new Date(m.created_at).toLocaleString() + '] ' + (p.display_name || p.username) + ': ' + m.content;
    }).join('\n');
    if (messages.length > 3) preview = '...(' + (messages.length - 3) + ' earlier)\n' + preview;

    window.openModal("Close this ticket?",
      '<p style="font-size:13px;color:var(--text2);line-height:1.55;margin-bottom:14px">' +
        'This will permanently delete the ticket and all ' + messages.length + ' message' + (messages.length === 1 ? '' : 's') + '. You can export the transcript first if you want to keep a copy.' +
      '</p>' +
      '<div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:6px">Preview</div>' +
      '<div class="export-preview">' + esc(preview || '(no messages)') + '</div>',
      { footer: '<button class="btn" id="tk-cancel">Cancel</button>' +
                '<button class="btn" id="tk-export-first">Export & Delete</button>' +
                '<button class="btn danger" id="tk-delete">Delete</button>',
        onMount: function(){
          document.getElementById('tk-cancel').onclick = window.closeModal;
          document.getElementById('tk-export-first').onclick = function(){
            exportTranscript(t);
            setTimeout(function(){ deleteTicket(t); }, 400);
          };
          document.getElementById('tk-delete').onclick = function(){ deleteTicket(t); };
        }
      });
  }

  async function deleteTicket(t){
    try {
      var r = await sb.from('tickets').delete().eq('id', t.id);
      if (r.error) throw r.error;
      window.closeModal();
      await refreshLists();
      window.toast("Ticket closed", "Transcript has been deleted.", "ok");
      openHub();
    } catch(e){ window.toast("Could not close", e.message || String(e), "err"); }
  }

  // ---------- Category manager ----------
  function openCategoryManager(){
    if (!isStaff) return;
    function list(){
      if (!cats.length) return '<div style="padding:16px;text-align:center;color:var(--text3);font-size:13px">No categories yet.</div>';
      return cats.map(function(c){
        return '<div style="display:flex;align-items:center;gap:10px;padding:11px;border-radius:9px;background:rgba(255,255,255,.03);margin-bottom:6px">' +
          '<span style="font-size:20px;width:28px;text-align:center">' + c.emoji + '</span>' +
          '<div style="flex:1;min-width:0"><div style="font-weight:600;font-size:13.5px">' + esc(c.name) + '</div>' +
            (c.description ? '<div style="font-size:11.5px;color:var(--text3);margin-top:2px">' + esc(c.description) + '</div>' : '') +
          '</div>' +
          '<button class="btn sm danger" data-del="' + c.id + '">Delete</button>' +
        '</div>';
      }).join('');
    }
    window.openModal("Manage Ticket Categories",
      '<p style="font-size:13px;color:var(--text2);margin-bottom:14px">Categories become buttons on the Tickets page. Users pick one when opening a ticket.</p>' +
      '<div id="cat-list">' + list() + '</div>' +
      '<hr style="border:none;border-top:1px solid var(--border);margin:16px 0">' +
      '<div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:8px">Add a category</div>' +
      '<div style="display:grid;grid-template-columns:60px 1fr;gap:8px;margin-bottom:8px">' +
        '<input id="cn-emoji" placeholder="🎫" maxlength="4" style="text-align:center;padding:10px;border-radius:8px;background:var(--void);border:1px solid var(--border);font-size:20px">' +
        '<input id="cn-name" placeholder="Category name" maxlength="40" style="padding:10px;border-radius:8px;background:var(--void);border:1px solid var(--border)">' +
      '</div>' +
      '<input id="cn-desc" placeholder="Short description" maxlength="100" style="width:100%;padding:10px;border-radius:8px;background:var(--void);border:1px solid var(--border);margin-bottom:10px">' +
      '<button class="btn primary" id="cn-add">+ Add Category</button>',
      { wide: true,
        footer: '<button class="btn" id="cn-close">Done</button>',
        onMount: function(){
          document.getElementById('cn-close').onclick = window.closeModal;
          document.getElementById('cn-add').onclick = async function(){
            var emoji = document.getElementById('cn-emoji').value.trim() || '🎫';
            var name = document.getElementById('cn-name').value.trim();
            var desc = document.getElementById('cn-desc').value.trim();
            if (!name) return window.toast("Name required", "", "err");
            try {
              var r = await sb.from('ticket_categories').insert({
                server_id: window.CURRENT.server.id, name: name, emoji: emoji, description: desc, position: cats.length
              }).select().single();
              if (r.error) throw r.error;
              cats.push(r.data);
              document.getElementById('cat-list').innerHTML = list();
              wireDel();
              document.getElementById('cn-name').value = '';
              document.getElementById('cn-desc').value = '';
              window.toast("Category added", "", "ok");
              injectChannel();
              if (window.CURRENT.type === 'tickets_hub') renderHub();
            } catch(e){ window.toast("Error", e.message || String(e), "err"); }
          };
          function wireDel(){
            document.querySelectorAll('[data-del]').forEach(function(b){
              b.onclick = async function(){
                try {
                  await sb.from('ticket_categories').delete().eq('id', b.dataset.del);
                  cats = cats.filter(function(x){ return x.id !== b.dataset.del; });
                  document.getElementById('cat-list').innerHTML = list();
                  wireDel();
                  if (window.CURRENT.type === 'tickets_hub') renderHub();
                } catch(e){ window.toast("Error", e.message || String(e), "err"); }
              };
            });
          }
          wireDel();
        }
      });
  }

  // ---------- Overrides ----------
  var origRenderChat = window.renderChat;
  window.renderChat = function(scroll){
    if (window.CURRENT && window.CURRENT.type === 'tickets_hub'){ renderHub(); return; }
    if (window.CURRENT && window.CURRENT.type === 'ticket'){ renderChat(); return; }
    return origRenderChat.apply(this, arguments);
  };

  var origRenderChatHead = window.renderChatHead;
  window.renderChatHead = function(){
    if (window.CURRENT && (window.CURRENT.type === 'tickets_hub' || window.CURRENT.type === 'ticket')){
      var el = document.getElementById('chat-head');
      var t = window.CURRENT.type === 'ticket' ? window.CURRENT.ticket : null;
      var c = t ? cats.find(function(x){ return x.id === t.category_id; }) : null;
      var emoji = window.CURRENT.type === 'tickets_hub' ? '🎫' : (c ? c.emoji : '🎫');
      var label = window.CURRENT.type === 'tickets_hub' ? 'tickets' : (c ? c.name.toLowerCase().replace(/\s+/g, '-') : 'ticket');
      el.innerHTML =
        '<button class="hbtn mobile-only" data-act="toggle-panel">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="width:20px;height:20px"><path d="M3 6h18M3 12h18M3 18h18"/></svg>' +
        '</button>' +
        '<div class="title"><span style="font-size:16px;flex:none">' + emoji + '</span><span class="txt">' + esc(label) + '</span></div>' +
        '<div class="spacer"></div>' +
        (isStaff && window.CURRENT.type === 'tickets_hub'
          ? '<button class="hbtn" id="hdr-cats" title="Manage categories"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:17px;height:17px"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7H1a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 2.6 7a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H7a1.6 1.6 0 0 0 1-1.5V1a2 2 0 1 1 4 0v.1A1.6 1.6 0 0 0 15 2.6a1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V7a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg></button>'
          : '') +
        '<button class="hbtn" data-act="toggle-members" title="Members"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:17px;height:17px"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></button>';
      var hc = document.getElementById('hdr-cats');
      if (hc) hc.onclick = openCategoryManager;
      return;
    }
    return origRenderChatHead.apply(this, arguments);
  };

  var origRenderComposer = window.renderComposer;
  window.renderComposer = function(){
    if (window.CURRENT && window.CURRENT.type === 'tickets_hub'){
      var w = document.getElementById('composer-wrap'); if (w) w.innerHTML = '';
      var tb = document.getElementById('typing-bar'); if (tb) tb.innerHTML = '';
      return;
    }
    if (window.CURRENT && window.CURRENT.type === 'ticket'){ renderComposerTicket(); return; }
    return origRenderComposer.apply(this, arguments);
  };

  var origRenderPanel = window.renderPanel;
  window.renderPanel = function(){
    var r = origRenderPanel.apply(this, arguments);
    setTimeout(injectChannel, 10);
    return r;
  };

  // ---------- Bootstrap ----------
  var origGoServer = window.goServer;
  window.goServer = async function(sid){
    var r = await origGoServer.apply(this, arguments);
    serverSub = null; currentServerId = null;
    await loadAll();
    setTimeout(injectChannel, 200);
    return r;
  };

  var origGoChannel = window.goChannel;
  window.goChannel = async function(cid){
    var r = await origGoChannel.apply(this, arguments);
    setTimeout(injectChannel, 200);
    return r;
  };

  setTimeout(async function(){
    if (inServer()){
      await loadAll();
      setTimeout(injectChannel, 300);
    }
  }, 3000);

  log("tickets v2 ready");
})();
</script>

<!-- SLEEPY_TICKETS_CLEANUP_V1 -->
<script>
(function(){
  "use strict";
  if (window.__sleepyTicketsCleanup) return;
  window.__sleepyTicketsCleanup = true;
  function log(){ try{console.log.apply(console,["[TicketFix]"].concat([].slice.call(arguments)));}catch(e){} }

  // ------------------------------------------------------------
  // 1. Remove v1's tickets-section the moment it appears
  // ------------------------------------------------------------
  function killV1(){
    var v1 = document.getElementById('tickets-section');
    if (v1){ v1.remove(); return true; }
    return false;
  }

  // ------------------------------------------------------------
  // 2. Remove v2's channel entry when not in server view
  // ------------------------------------------------------------
  function inServerView(){
    var c = window.CURRENT;
    if (!c || !c.server) return false;
    if (c.type === 'dm' || c.type === 'home' || c.type === 'dms') return false;
    return true;
  }
  function killV2IfNotServer(){
    if (inServerView()) return;
    var v2 = document.getElementById('tickets-channel-entry');
    if (v2) v2.remove();
  }

  // ------------------------------------------------------------
  // 3. Also nuke any stray duplicate entries (in case both
  //    v1 and v2 injected at once)
  // ------------------------------------------------------------
  function dedupeEntries(){
    var body = document.getElementById('panel-body');
    if (!body) return;
    // Only one tickets-channel-entry allowed
    var entries = body.querySelectorAll('#tickets-channel-entry');
    for (var i = 1; i < entries.length; i++) entries[i].remove();
    // v1 sections: none allowed
    body.querySelectorAll('#tickets-section').forEach(function(el){ el.remove(); });
  }

  function cleanupAll(){
    killV1();
    killV2IfNotServer();
    dedupeEntries();
  }

  // ------------------------------------------------------------
  // 4. Override renderPanel to run cleanup AFTER v1 and v2 have
  //    had their turn (both use 10ms setTimeouts)
  // ------------------------------------------------------------
  var origRenderPanel = window.renderPanel;
  if (typeof origRenderPanel === 'function'){
    window.renderPanel = function(){
      var r = origRenderPanel.apply(this, arguments);
      setTimeout(cleanupAll, 60);
      return r;
    };
  }

  // Safety net — periodic cleanup in case something slips through
  setInterval(cleanupAll, 600);

  // Also run whenever the channel/panel changes
  var origGoChannel = window.goChannel;
  if (typeof origGoChannel === 'function'){
    window.goChannel = async function(cid){
      var r = await origGoChannel.apply(this, arguments);
      setTimeout(cleanupAll, 150);
      return r;
    };
  }
  var origGoHome = window.goHome;
  if (typeof origGoHome === 'function'){
    window.goHome = async function(){
      var r = await origGoHome.apply(this, arguments);
      setTimeout(cleanupAll, 150);
      return r;
    };
  }

  // ------------------------------------------------------------
  // 5. One-time purge of closed tickets left over from v1's UI
  //    (v1's "close" only set status='closed'; v2's design is
  //    "close = delete")
  // ------------------------------------------------------------
  var purged = false;
  async function purgeClosed(){
    if (purged) return;
    if (!window.ME || !window.sb) return;
    purged = true;
    try {
      var r = await sb.from('tickets').select('id').eq('status', 'closed');
      if (r.data && r.data.length){
        for (var i = 0; i < r.data.length; i++){
          await sb.from('tickets').delete().eq('id', r.data[i].id);
        }
        if (window.toast) window.toast("Cleaned up", "Removed " + r.data.length + " old closed ticket" + (r.data.length === 1 ? "" : "s") + ".", "ok");
        log("purged", r.data.length, "closed tickets");
      }
    } catch(e){ log("purge failed:", e.message); }
  }

  setTimeout(purgeClosed, 6000);

  // ------------------------------------------------------------
  // 6. Throttle v2's injectChannel by watching for a storm of
  //    renderPanel calls. If we see more than 5 in 1 second,
  //    disable v1's inject indirectly by... actually we can't.
  //    Just absorb the cost with the cleanup above.
  // ------------------------------------------------------------

  log("tickets cleanup ready");
})();
</script>
