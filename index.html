<script>
(function(){
  "use strict";
  if (window.__sleepyDcBatch) return;
  window.__sleepyDcBatch = true;
  function log(){ try{console.log.apply(console,["[DC]"].concat([].slice.call(arguments)));}catch(e){} }
  function esc(s){ return window.esc(s); }

  /* ============================================================
     1. MARKDOWN
     ============================================================ */
  function mdRender(escapedText){
    var s = escapedText || "";
    // Code blocks first (protect their contents)
    var codeBlocks = [];
    s = s.replace(/```([\s\S]*?)```/g, function(_, code){
      codeBlocks.push(code);
      return "\u0000CB" + (codeBlocks.length - 1) + "\u0000";
    });
    // Inline code (also protected)
    var inlineCodes = [];
    s = s.replace(/`([^`\n]+)`/g, function(_, code){
      inlineCodes.push(code);
      return "\u0000IC" + (inlineCodes.length - 1) + "\u0000";
    });
    // Spoilers
    s = s.replace(/\|\|([^\|]+)\|\|/g, '<span class="spoiler" data-spoiler>$1</span>');
    // Blockquote
    s = s.replace(/^&gt;\s?(.*)$/gm, '<blockquote>$1</blockquote>');
    // Bold
    s = s.replace(/\*\*([^\*\n]+)\*\*/g, '<b>$1</b>');
    // Underline
    s = s.replace(/__([^_\n]+)__/g, '<u>$1</u>');
    // Italic (after bold/underline so those don't eat the asterisks)
    s = s.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<i>$2</i>');
    // Strikethrough
    s = s.replace(/~~([^~\n]+)~~/g, '<s>$1</s>');
    // User mentions - match @token against real usernames
    s = s.replace(/@([a-zA-Z0-9_]+)/g, function(full, name){
      var lower = name.toLowerCase();
      if (lower === "everyone") return '<span class="mention-user" style="background:rgba(255,45,111,.15);color:#ff8aa8">@everyone</span>';
      if (lower === "here") return '<span class="mention-user" style="background:rgba(255,45,111,.15);color:#ff8aa8">@here</span>';
      var found = null;
      for (var uid in window.PROFILES){
        var p = window.PROFILES[uid];
        if (p && (p.username || "").toLowerCase() === lower) { found = uid; break; }
      }
      if (found){
        var isMe = (found === window.ME.id);
        return '<span class="mention-' + (isMe ? 'self' : 'user') + '" data-user="' + found + '">@' + name + '</span>';
      }
      return full;
    });
    // URLs
    s = s.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
    // Restore inline code
    s = s.replace(/\u0000IC(\d+)\u0000/g, function(_, i){
      return '<code>' + inlineCodes[parseInt(i, 10)] + '</code>';
    });
    // Restore code blocks
    s = s.replace(/\u0000CB(\d+)\u0000/g, function(_, i){
      return '<pre>' + codeBlocks[parseInt(i, 10)] + '</pre>';
    });
    return s;
  }
  window.mdRender = mdRender;

  /* ============================================================
     2. OVERRIDE messageHTML (with markdown, pins, replies, attachments)
     ============================================================ */
  var origMessageHTML = window.messageHTML;
  window.messageHTML = function(m, grouped){
    // Build our own content so we control rendering entirely.
    if (m.deleted) return '<div class="msg deleted" data-msg="' + m.id + '"><div style="width:36px;flex:none"></div><div class="body"><div class="content">This message was deleted.</div></div></div>';

    var p = window.PROFILES[m.sender_id] || { username:'unknown', display_name:'Unknown' };
    var mine = m.sender_id === window.ME.id;

    // Role color for username
    var roleColor = null;
    try {
      if (window.CURRENT && window.CURRENT.type === 'server' && window.CURRENT.server) {
        var mr = (window.MEMBER_ROLES || {})[m.sender_id] || [];
        var roles = (window.ROLES || []).filter(function(r){ return mr.indexOf(r.id) >= 0; });
        roles.sort(function(a,b){ return (b.position||0) - (a.position||0); });
        if (roles[0]) roleColor = roles[0].color;
      }
    } catch(e){}
    if (!roleColor && p.accent_color) roleColor = p.accent_color;

    // Reply reference
    var replyRef = "";
    if (m.reply_to_id && !m.deleted) {
      var parent = null;
      for (var i = 0; i < window.MESSAGES.length; i++) if (window.MESSAGES[i].id === m.reply_to_id) { parent = window.MESSAGES[i]; break; }
      if (parent) {
        var pp = window.PROFILES[parent.sender_id] || { username:'user', display_name:'User' };
        replyRef = '<div class="reply-ref" data-jump="' + parent.id + '">' +
          '<span class="bar"></span>' +
          '<span class="who">@' + esc(pp.display_name || pp.username) + '</span>' +
          '<span class="snippet">' + esc(String(parent.content || '').slice(0, 80)) + '</span>' +
        '</div>';
      }
    }

    // Highlight message if I was mentioned
    var highlighted = false;
    if (m.mentions && m.mentions.indexOf(window.ME.id) >= 0) highlighted = true;
    if (/@everyone\b/i.test(m.content || "")) highlighted = true;
    if (/@here\b/i.test(m.content || "")) highlighted = true;

    var h = '<div class="msg' + (highlighted ? ' mention-hit' : '') + '" data-msg="' + m.id + '"' +
            (highlighted ? ' style="background:rgba(255,45,111,.05);border-left:2px solid rgba(255,45,111,.5)"' : '') + '>';

    if (grouped) h += '<div style="width:36px;flex:none"></div>';
    else h += '<div style="position:relative">' + window.avatarHTML(m.sender_id, 36) + window.statusDot(m.sender_id) + '</div>';

    h += '<div class="body">' + replyRef;

    if (!grouped) {
      var nameStyle = roleColor ? ' style="color:' + esc(roleColor) + '"' : '';
      h += '<div class="head">' +
        '<span class="author"' + nameStyle + ' data-user="' + esc(m.sender_id) + '">' + esc(p.display_name || p.username) + '</span>' +
        '<span class="uid">@' + esc(p.username) + '</span>' +
        '<span class="time">' + window.timeLabel(m.created_at) + '</span>' +
        (m.edited ? '<span class="edited">(edited)</span>' : '') +
        (m.pinned ? '<span style="font-size:10px;color:var(--amber);background:rgba(255,171,0,.14);padding:1px 6px;border-radius:99px;text-transform:uppercase;font-weight:700">pinned</span>' : '') +
        '</div>';
    }

    h += '<div class="content msg-content">' + mdRender(esc(m.content || '')) + '</div>';

    // Attachments
    if (m.attachments && m.attachments.length) {
      h += '<div class="attachments">';
      m.attachments.forEach(function(a){
        if (a.type && a.type.indexOf('image/') === 0) {
          h += '<img src="' + esc(a.url) + '" alt="" loading="lazy" data-lightbox="' + esc(a.url) + '">';
        } else {
          h += '<a href="' + esc(a.url) + '" target="_blank" rel="noopener" style="padding:8px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;display:inline-block;font-size:12.5px">' + esc(a.name || 'file') + '</a>';
        }
      });
      h += '</div>';
    }

    h += '</div>';

    // Toolbar
    h += '<div class="toolbar">';
    h += '<button data-act="react" data-msg="' + m.id + '" title="Add reaction"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="15" height="15"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><path d="M9 9h.01M15 9h.01"/></svg></button>';
    h += '<button data-act="reply" data-msg="' + m.id + '" title="Reply"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="15" height="15"><path d="m9 17-6-6 6-6"/><path d="M3 11h11a6 6 0 0 1 6 6v2"/></svg></button>';
    h += '<button data-act="pin" data-msg="' + m.id + '" title="' + (m.pinned ? 'Unpin' : 'Pin') + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M12 17v5"/><path d="M9 10.8V4h6v6.8l2 3.2H7l2-3.2z"/></svg></button>';
    if (mine) h += '<button data-act="edit-msg" data-msg="' + m.id + '" title="Edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>';
    if (mine) h += '<button class="danger" data-act="del-msg" data-msg="' + m.id + '" title="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="15" height="15"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button>';
    h += '</div></div>';
    return h;
  };

  /* ============================================================
     3. PIN MESSAGES
     ============================================================ */
  window.togglePin = async function(messageId){
    var m = null;
    for (var i = 0; i < window.MESSAGES.length; i++) if (window.MESSAGES[i].id === messageId) { m = window.MESSAGES[i]; break; }
    if (!m) return;
    var next = !m.pinned;
    try {
      var { error } = await sb.from('messages').update({ pinned: next }).eq('id', messageId);
      if (error) throw error;
      m.pinned = next;
      window.renderChat(false);
      window.toast(next ? 'Pinned' : 'Unpinned', next ? 'Message pinned to this channel.' : 'Message unpinned.', 'ok');
    } catch(e){ window.toast('Error', e.message || String(e), 'err'); }
  };

  window.openPinsModal = async function(){
    var col = window.CURRENT.type === 'dm' ? 'conversation_id' : 'channel_id';
    var id = window.CURRENT.type === 'dm' ? window.CURRENT.conv.id : window.CURRENT.channel.id;
    var { data, error } = await sb.from('messages').select('*').eq(col, id).eq('pinned', true).order('created_at', { ascending: false });
    if (error) return window.toast('Error', error.message, 'err');
    var rows = data || [];
    var h = '<div class="pins-list">';
    if (!rows.length) h += '<div class="empty" style="padding:20px">No pinned messages yet.</div>';
    for (var i = 0; i < rows.length; i++){
      var m = rows[i];
      var p = window.PROFILES[m.sender_id] || { display_name: 'Unknown' };
      h += '<div class="pin-card" data-pin-jump="' + m.id + '" style="cursor:pointer">' +
        '<div class="who">' + esc(p.display_name || p.username || 'Unknown') + '</div>' +
        '<div style="font-size:13px;color:var(--text2);white-space:pre-wrap">' + esc(String(m.content || '').slice(0, 200)) + '</div>' +
        '<div class="when">' + new Date(m.created_at).toLocaleString() + '</div>' +
        '</div>';
    }
    h += '</div>';
    window.openModal('Pinned Messages', h, {
      onMount: function(){
        document.getElementById('modal-root').addEventListener('click', function(e){
          var c = e.target.closest('[data-pin-jump]');
          if (!c) return;
          window.closeModal();
          setTimeout(function(){
            var el = document.querySelector('[data-msg="' + c.dataset.pinJump + '"]');
            if (el) {
              el.scrollIntoView({ behavior:'smooth', block:'center' });
              el.style.transition = 'background .3s';
              el.style.background = 'rgba(0,255,224,.1)';
              setTimeout(function(){ el.style.background = ''; }, 1500);
            }
          }, 80);
        });
      }
    });
  };

  /* ============================================================
     4. MESSAGE SEARCH
     ============================================================ */
  var SEARCH = "";
  var origRenderChat = window.renderChat;
  window.renderChat = function(scroll){
    origRenderChat(scroll);
    if (SEARCH.trim()){
      var q = SEARCH.trim().toLowerCase();
      document.querySelectorAll('[data-msg]').forEach(function(el){
        var txt = el.textContent.toLowerCase();
        if (txt.indexOf(q) >= 0) el.classList.add('search-hit');
      });
    }
    // If we searched and everything is filtered out, that's fine; hits are highlighted.
  };

  // Add search box to chat header (once)
  function injectSearchBox(){
    var head = document.getElementById('chat-head');
    if (!head) return;
    if (head.querySelector('.search-inline')) return;
    if (!window.CURRENT || (!window.CURRENT.conv && !window.CURRENT.channel)) return;
    var spacer = head.querySelector('.spacer');
    if (!spacer) return;
    var box = document.createElement('div');
    box.className = 'search-inline';
    box.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>' +
      '<input id="msg-search" placeholder="Search messages..." value="' + esc(SEARCH) + '">';
    spacer.parentNode.insertBefore(box, spacer.nextSibling);
    var inp = document.getElementById('msg-search');
    inp.addEventListener('input', function(){
      SEARCH = inp.value;
      window.renderChat(false);
    });
  }

  var origRenderChatHead = window.renderChatHead;
  window.renderChatHead = function(){
    origRenderChatHead();
    setTimeout(injectSearchBox, 0);
  };

  /* ============================================================
     5. EMOJI PICKER IN COMPOSER
     ============================================================ */
  var EMOJIS = [
    "\u{1F600}","\u{1F603}","\u{1F604}","\u{1F601}","\u{1F606}","\u{1F605}","\u{1F923}","\u{1F602}",
    "\u{1F642}","\u{1F643}","\u{1F609}","\u{1F60A}","\u{1F970}","\u{1F60D}","\u{1F618}","\u{1F61C}",
    "\u{1F911}","\u{1F913}","\u{1F60E}","\u{1F973}","\u{1F914}","\u{1F610}","\u{1F611}","\u{1F636}",
    "\u{1F644}","\u{1F62C}","\u{1F620}","\u{1F621}","\u{1F92C}","\u{1F92F}","\u{1F631}","\u{1F622}",
    "\u{1F62D}","\u{1F44D}","\u{1F44E}","\u{1F44C}","\u270C\uFE0F","\u{1F91E}","\u{1F44F}","\u{1F64C}",
    "\u{1F64F}","\u2728","\u2B50","\u{1F525}","\u2764\uFE0F","\u{1F49A}","\u{1F49B}","\u{1F499}",
    "\u{1F49C}","\u{1F5A4}","\u{1F90D}","\u{1F494}","\u{1F319}","\u{1F311}","\u26A1","\u{1F3AE}",
    "\u{1F3A7}","\u{1F4CE}","\u{1F4CC}","\u{1F514}","\u{1F512}","\u{1F680}","\u{1F355}","\u{1F354}",
    "\u2615","\u{1F389}","\u{1F3C6}","\u{1F3AF}","\u{1F4A1}","\u{1F440}","\u{1F4AF}","\u{1F3B5}"
  ];

  window.openComposerEmoji = function(anchor){
    window.closeMenu && window.closeMenu();
    var existing = document.querySelector('.emoji-pick-grid');
    if (existing) { existing.remove(); return; }
    var grid = document.createElement('div');
    grid.className = 'emoji-pick-grid';
    grid.innerHTML = EMOJIS.map(function(e){ return '<button data-emoji="' + e + '">' + e + '</button>'; }).join('');
    document.body.appendChild(grid);
    var r = anchor.getBoundingClientRect();
    var left = Math.max(10, Math.min(r.left - 120, window.innerWidth - 330));
    var top = r.top - 340;
    if (top < 10) top = r.bottom + 8;
    grid.style.left = left + 'px';
    grid.style.top = top + 'px';
    grid.addEventListener('click', function(e){
      var b = e.target.closest('[data-emoji]');
      if (!b) return;
      insertEmoji(b.dataset.emoji);
      grid.remove();
    });
    setTimeout(function(){
      document.addEventListener('click', function h(ev){
        if (!grid.contains(ev.target)) { grid.remove(); document.removeEventListener('click', h, true); }
      }, true);
    }, 0);
  };

  function insertEmoji(emoji){
    var ta = document.getElementById('composer-input');
    if (!ta) return;
    var start = ta.selectionStart || 0;
    var end = ta.selectionEnd || 0;
    ta.value = ta.value.slice(0, start) + emoji + ta.value.slice(end);
    var pos = start + emoji.length;
    ta.setSelectionRange(pos, pos);
    ta.focus();
    if (typeof window.autosize === 'function') window.autosize(ta);
  }

  // Inject the smiley button into the composer
  var origRenderComposer = window.renderComposer;
  window.renderComposer = function(){
    origRenderComposer();
    var composer = document.querySelector('#composer-wrap .composer');
    if (!composer || composer.querySelector('[data-emoji-btn]')) return;
    var attach = composer.querySelector('[data-attach]');
    var send = composer.querySelector('#send-btn');
    var emojiBtn = document.createElement('button');
    emojiBtn.className = 'cbtn';
    emojiBtn.setAttribute('data-emoji-btn', '1');
    emojiBtn.title = 'Emoji';
    emojiBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="17" height="17"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><path d="M9 9h.01M15 9h.01"/></svg>';
    emojiBtn.onclick = function(){ window.openComposerEmoji(emojiBtn); };
    if (attach) composer.insertBefore(emojiBtn, attach);
    else if (send) composer.insertBefore(emojiBtn, send);
    else composer.appendChild(emojiBtn);
  };

  /* ============================================================
     6. RIGHT-CLICK MESSAGE CONTEXT MENU
     ============================================================ */
  document.addEventListener('contextmenu', function(e){
    var msg = e.target.closest('[data-msg]');
    if (!msg) return;
    if (!window.CURRENT || (!window.CURRENT.conv && !window.CURRENT.channel)) return;
    e.preventDefault();
    var id = Number(msg.dataset.msg);
    var m = null;
    for (var i = 0; i < window.MESSAGES.length; i++) if (window.MESSAGES[i].id === id) { m = window.MESSAGES[i]; break; }
    if (!m) return;
    var mine = m.sender_id === window.ME.id;
    var items = [];
    items.push({ id:'copy', label:'Copy Text', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>', onClick: function(){
      navigator.clipboard.writeText(m.content || '').then(function(){ window.toast('Copied', '', 'ok'); }).catch(function(){});
    }});
    items.push({ id:'reply', label:'Reply', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="15" height="15"><path d="m9 17-6-6 6-6"/><path d="M3 11h11a6 6 0 0 1 6 6v2"/></svg>', onClick: function(){ window.startReply(id); }});
    items.push({ id:'pin', label: m.pinned ? 'Unpin' : 'Pin', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="15" height="15"><path d="M12 17v5"/><path d="M9 10.8V4h6v6.8l2 3.2H7l2-3.2z"/></svg>', onClick: function(){ window.togglePin(id); }});
    if (mine) {
      items.push({ sep:true });
      items.push({ id:'edit', label:'Edit', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>', onClick: function(){
        window.UI.editing = id;
        window.renderComposer();
        var ta = document.getElementById('composer-input');
        if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
      }});
      items.push({ id:'delete', label:'Delete Message', danger:true, icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>', onClick: function(){
        window.confirmModal('Delete message?', 'This cannot be undone.', async function(){
          try { await window.deleteMessage(id); } catch(e){ window.toast('Error', e.message || String(e), 'err'); }
        }, true);
      }});
    }
    window.openMenu(e.clientX, e.clientY, items);
  });

  /* ============================================================
     7. SPOILER REVEAL ON CLICK
     ============================================================ */
  document.addEventListener('click', function(e){
    var sp = e.target.closest('.spoiler');
    if (sp && !sp.classList.contains('revealed')){
      sp.classList.add('revealed');
    }
  });

  /* ============================================================
     8. WIRE PIN BUTTON IN TOOLBAR
     ============================================================ */
  document.addEventListener('click', function(e){
    var pin = e.target.closest('[data-act="pin"]');
    if (pin) { e.preventDefault(); e.stopPropagation(); window.togglePin(Number(pin.dataset.msg)); return; }
    var pinBtn = e.target.closest('[data-act="pins"]');
    if (pinBtn) { e.preventDefault(); e.stopPropagation(); window.openPinsModal(); return; }
  }, true);

  /* ============================================================
     9. SERVER ICON UPLOAD
     ============================================================ */
  window.openChangeServerIcon = function(){
    var srv = window.CURRENT.server;
    if (!srv || srv.owner_id !== window.ME.id) return window.toast('Owner only', 'Only the server owner can change the icon.', 'err');
    var inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'image/*';
    inp.onchange = async function(e){
      var f = e.target.files[0]; if (!f) return;
      try {
        window.toast('Uploading', 'Server icon uploading...', 'ok');
        var ext = (f.name.split('.').pop() || 'png').toLowerCase();
        var path = window.ME.id + '/server-' + srv.id + '-' + Date.now() + '.' + ext;
        var { error } = await sb.storage.from('avatars').upload(path, f, { contentType: f.type, upsert: true });
        if (error) throw error;
        var { data: pub } = sb.storage.from('avatars').getPublicUrl(path);
        var { error: e2 } = await sb.from('servers').update({ icon_url: pub.publicUrl }).eq('id', srv.id);
        if (e2) throw e2;
        srv.icon_url = pub.publicUrl;
        for (var i = 0; i < window.SERVERS.length; i++) if (window.SERVERS[i].id === srv.id) window.SERVERS[i].icon_url = pub.publicUrl;
        window.renderRail();
        window.renderAll && window.renderAll();
        window.toast('Icon updated', '', 'ok');
      } catch(err){ window.toast('Upload failed', err.message || String(err), 'err'); }
    };
    inp.click();
  };

  // Extend the server menu with Change Icon
  var origOpenServerMenu = window.openServerMenu;
  window.openServerMenu = function(x, y){
    if (!window.CURRENT.server) return;
    var srv = window.CURRENT.server;
    var isOwner = srv.owner_id === window.ME.id;
    var items = [{ head: srv.name }];
    items.push({ id:'invite', label:'Invite People', icon: window.SVG.users, onClick: window.openInviteServer });
    if (isOwner){
      items.push({ id:'icon', label:'Change Icon', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="15" height="15"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>', onClick: window.openChangeServerIcon });
      items.push({ id:'addch', label:'Create Channel', icon: window.SVG.plus, onClick: function(){ window.openAddChannel('Text Channels'); } });
      items.push({ id:'roles', label:'Manage Roles', icon: window.SVG.tag, onClick: window.openRolesModal });
      items.push({ sep:true });
      items.push({ id:'del', label:'Delete Server', icon: window.SVG.trash, danger:true, onClick: function(){
        window.confirmModal('Delete ' + srv.name + '?', 'All channels and messages will be deleted.', async function(){
          try { await window.deleteServer(srv.id); await window.loadServers(); await window.goHome(); }
          catch(e){ window.toast('Error', e.message || String(e), 'err'); }
        }, true);
      }});
    } else {
      items.push({ sep:true });
      items.push({ id:'leave', label:'Leave Server', icon: window.SVG.logout, danger:true, onClick: async function(){
        try { await window.leaveServer(srv.id); await window.loadServers(); await window.goHome(); }
        catch(e){ window.toast('Error', e.message || String(e), 'err'); }
      }});
    }
    window.openMenu(x, y, items);
  };

  /* ============================================================
     10. IDLE AUTO-DETECTION
     ============================================================ */
  var lastActivity = Date.now();
  var IDLE_MS = 5 * 60 * 1000;
  var isIdle = false;
  function markActive(){
    lastActivity = Date.now();
    if (isIdle){
      isIdle = false;
      if (window.ME && window.ME.status === 'idle'){
        window.updateProfile({ status: 'online' }).catch(function(){});
        if (window.presenceCh) try { window.presenceCh.track({ user_id: window.ME.id, status: 'online', at: new Date().toISOString() }); } catch(e){}
      }
    }
  }
  ['mousemove','keydown','click','scroll','touchstart'].forEach(function(ev){
    document.addEventListener(ev, markActive, { passive: true });
  });
  setInterval(function(){
    if (!window.ME) return;
    if (window.ME.status !== 'online') return;
    if (Date.now() - lastActivity > IDLE_MS && !isIdle){
      isIdle = true;
      window.updateProfile({ status: 'idle' }).catch(function(){});
      if (window.presenceCh) try { window.presenceCh.track({ user_id: window.ME.id, status: 'idle', at: new Date().toISOString() }); } catch(e){}
    }
  }, 30000);

  log("batch ready");
})();
</script>

/* ---- Profile card banner with effect ---- */

</style>
<script>
(function(){
  "use strict";
  if (window.__sleepyCosmetics) return;
  window.__sleepyCosmetics = true;
  function log(){ try{console.log.apply(console,["[Cos]"].concat([].slice.call(arguments)));}catch(e){} }
  function esc(s){ return window.esc(s); }

  // ---- Registry ------------------------------------------------------------
  var DECOS = ['none','neon','inferno','aurora','gold','frost','circuit','void'];
  var PLATES = ['none','cyan','rose','sunset','midnight','forest','cosmic','rainbow'];
  var EFFECTS = ['none','sparkle','grid','aurora','frost'];

  function decoFor(uid){ var p = window.PROFILES[uid]; return (p && p.avatar_decoration && DECOS.indexOf(p.avatar_decoration) >= 0) ? p.avatar_decoration : 'none'; }
  function plateFor(uid){ var p = window.PROFILES[uid]; return (p && p.nameplate && PLATES.indexOf(p.nameplate) >= 0) ? p.nameplate : 'none'; }
  function effectFor(uid){ var p = window.PROFILES[uid]; return (p && p.profile_effect && EFFECTS.indexOf(p.profile_effect) >= 0) ? p.profile_effect : 'none'; }
  window.decoFor = decoFor; window.plateFor = plateFor; window.effectFor = effectFor;

  function nameplateClass(uid){
    var v = plateFor(uid);
    return v === 'none' ? '' : (' nameplate np-' + v);
  }
  window.nameplateClass = nameplateClass;

  // ---- Override avatarHTML ------------------------------------------------
  var origAvatarHTML = window.avatarHTML;
  window.avatarHTML = function(uid, size){
    var s = size || 36;
    var deco = decoFor(uid);
    var inner = origAvatarHTML(uid, s);
    if (deco === 'none') return inner;
    return '<div class="avatar-wrap" style="width:' + s + 'px;height:' + s + 'px">' +
      inner +
      '<div class="avatar-deco deco-' + deco + '"></div>' +
    '</div>';
  };

  // ---- Override messageHTML to inject nameplate ---------------------------
  var origMessageHTML = window.messageHTML;
  window.messageHTML = function(m, grouped){
    var html = origMessageHTML(m, grouped);
    if (grouped) return html;
    var plate = nameplateClass(m.sender_id);
    if (!plate) return html;
    // Find the author span and wrap its inner text
    html = html.replace(
      /(<span class="author"[^>]*data-user="[^"]+"[^>]*>)([^<]+)(<\/span>)/,
      function(_, open, inner, close){
        // Only wrap once
        if (open.indexOf('nameplate') >= 0) return _;
        return open.replace('class="author"', 'class="author' + plate + '"') + inner + close;
      }
    );
    return html;
  };

  // ---- Override renderMembers to inject nameplate -------------------------
  var origRenderMembers = window.renderMembers;
  window.renderMembers = async function(){
    await origRenderMembers();
    var el = document.getElementById('members');
    if (!el) return;
    // For every member card, wrap its name span with the plate class if the user has one
    el.querySelectorAll('[data-member]').forEach(function(card){
      var uid = card.getAttribute('data-member');
      var plate = nameplateClass(uid);
      if (!plate) return;
      var nm = card.querySelector('.nm');
      if (!nm || nm.querySelector('.nameplate')) return;
      // Wrap the first text node in a nameplate span (keep any pills outside)
      var firstText = '';
      for (var i = 0; i < nm.childNodes.length; i++){
        if (nm.childNodes[i].nodeType === 3 && nm.childNodes[i].textContent.trim()){
          firstText = nm.childNodes[i].textContent;
          nm.childNodes[i].textContent = '';
          break;
        }
      }
      if (firstText){
        var wrap = document.createElement('span');
        wrap.className = 'nameplate np-' + plateFor(uid);
        wrap.textContent = firstText;
        nm.insertBefore(wrap, nm.firstChild);
      }
    });
  };

  // ---- Override openProfile to show effect + decoration + nameplate -------
  var origOpenProfile = window.openProfile;
  window.openProfile = function(uid){
    // Small delay so fetchProfiles resolves first (orig does the same)
    origOpenProfile(uid);
    setTimeout(function(){
      var p = window.PROFILES[uid];
      if (!p) return;
      var card = document.querySelector('#modal-body .profile-card');
      if (!card) return;

      // Inject effect layer into banner
      var effect = effectFor(uid);
      var banner = card.querySelector('.banner');
      if (banner && effect !== 'none' && !banner.querySelector('.peffect')){
        var div = document.createElement('div');
        div.className = 'peffect pe-' + effect;
        banner.appendChild(div);
        banner.classList.add('profile-banner');
      }

      // Show nameplate on the profile's display name
      var plate = plateFor(uid);
      if (plate !== 'none'){
        var nameEl = card.querySelector('div[style*="font-size:20px"]') || card.querySelector('.body > div > div');
        if (nameEl && !nameEl.querySelector('.nameplate')){
          var txt = nameEl.textContent;
          nameEl.innerHTML = '<span class="nameplate np-' + plate + '">' + esc(txt) + '</span>';
        }
      }
    }, 250);
  };

  // ---- Override openEditProfile to add cosmetics pickers ------------------
  var origEditProfile = window.openEditProfile;
  window.openEditProfile = function(){
    origEditProfile();
    setTimeout(injectCosmeticPickers, 60);
  };

  function swatchHTML(kind, value, current){
    // kind: 'deco' | 'plate' | 'effect'
    var isSel = (value === current) ? ' sel' : '';
    if (value === 'none'){
      return '<div class="cos-swatch none' + isSel + '" data-cos="' + kind + '" data-cos-value="none" title="None"></div>';
    }
    if (kind === 'deco'){
      return '<div class="cos-swatch' + isSel + '" data-cos="deco" data-cos-value="' + value + '" title="' + value + '">' +
        '<div class="demo-avatar"><div class="avatar-deco deco-' + value + '" style="inset:-4px"></div></div>' +
      '</div>';
    }
    if (kind === 'plate'){
      return '<div class="cos-swatch' + isSel + '" data-cos="plate" data-cos-value="' + value + '" title="' + value + '">' +
        '<span class="plate-demo np-' + value + '">Aa</span>' +
      '</div>';
    }
    // effect
    return '<div class="cos-swatch' + isSel + '" data-cos="effect" data-cos-value="' + value + '" title="' + value + '" style="padding:0">' +
      '<div class="banner-demo peffect pe-' + value + '" style="position:relative;border-radius:10px"></div>' +
    '</div>';
  }

  function injectCosmeticPickers(){
    var body = document.getElementById('modal-body');
    if (!body) return;
    if (body.querySelector('[data-cos-section]')) return;
    var me = window.ME;
    if (!me) return;

    var html =
      '<div class="cos-section" data-cos-section>' +
        '<h4>Avatar Decoration</h4>' +
        '<div class="cos-grid">' +
          DECOS.map(function(v){ return swatchHTML('deco', v, me.avatar_decoration || 'none'); }).join('') +
        '</div>' +
      '</div>' +
      '<div class="cos-section">' +
        '<h4>Nameplate</h4>' +
        '<div class="cos-grid">' +
          PLATES.map(function(v){ return swatchHTML('plate', v, me.nameplate || 'none'); }).join('') +
        '</div>' +
      '</div>' +
      '<div class="cos-section">' +
        '<h4>Profile Effect</h4>' +
        '<div class="cos-grid">' +
          EFFECTS.map(function(v){ return swatchHTML('effect', v, me.profile_effect || 'none'); }).join('') +
        '</div>' +
      '</div>';

    // Insert before the footer (or at the end if no footer)
    var footer = body.parentElement.querySelector('.modal-foot');
    var holder = document.createElement('div');
    holder.innerHTML = html;
    if (footer) body.appendChild(holder.firstElementChild);
    else body.appendChild(holder.firstElementChild);
    // Append the other two sections
    while (holder.firstElementChild) body.appendChild(holder.firstElementChild);

    // Previews update live
    body.addEventListener('click', function(e){
      var sw = e.target.closest('[data-cos]');
      if (!sw) return;
      var kind = sw.dataset.cos;
      var value = sw.dataset.cosValue;
      // selection highlight within its own group
      var grid = sw.closest('.cos-grid');
      grid.querySelectorAll('.cos-swatch').forEach(function(x){ x.classList.remove('sel'); });
      sw.classList.add('sel');

      // Live preview in the modal header avatar
      if (kind === 'deco'){
        me.avatar_decoration = value;
        refreshHeaderPreview();
      } else if (kind === 'plate'){
        me.nameplate = value;
      } else {
        me.profile_effect = value;
      }
    }, true);
  }

  function refreshHeaderPreview(){
    // Repaint the avatar preview at the top of Edit Profile modal
    var container = document.querySelector('#modal-body div[style*="width:84px"]') ||
                    document.querySelector('#modal-body div[style*="width:72px"]');
    if (!container) return;
    var uid = window.ME.id;
    // Rebuild the avatar with the new decoration
    container.innerHTML = window.avatarHTML(uid, 84);
  }

  // ---- Persist cosmetics on Save ------------------------------------------
  // Wrap the existing Save handler by capturing clicks on #ep-yes
  document.addEventListener('click', async function(e){
    var saveBtn = e.target.closest('#ep-yes');
    if (!saveBtn) return;
    // The main handler fires after this (bubble phase), so queue our own save
    // using the values already stashed on ME.
    setTimeout(async function(){
      try {
        await window.updateProfile({
          avatar_decoration: window.ME.avatar_decoration || 'none',
          nameplate: window.ME.nameplate || 'none',
          profile_effect: window.ME.profile_effect || 'none'
        });
      } catch(err){ /* silent - main save shows its own toast */ }
    }, 0);
  });

  // Also ensure the Edit Profile open loads current values from the server row
  var origFetchProfiles = window.fetchProfiles;
  window.fetchProfiles = async function(ids){
    await origFetchProfiles(ids);
    // Nothing extra needed - values come from the row itself
  };

  log("cosmetics ready");
})();
</script>

<!-- SLEEPY_OFFICIAL_V1 -->
<style>
.rail-btn.official{background:linear-gradient(135deg,rgba(0,255,224,.14),rgba(180,74,255,.14));border:1px solid rgba(0,255,224,.45)}
.rail-btn.official:hover{box-shadow:0 0 18px rgba(0,255,224,.55);transform:translateY(-2px)}
.rail-btn.official.active{background:linear-gradient(135deg,rgba(0,255,224,.22),rgba(180,74,255,.22));box-shadow:0 0 20px rgba(0,255,224,.6)}
.rail-btn.official .star{position:absolute;top:2px;left:2px;font-size:11px;line-height:1;pointer-events:none;text-shadow:0 0 6px rgba(0,255,224,.9)}
.rail-btn.official.active::before{background:linear-gradient(180deg,#00ffe0,#b44aff)}
.rail-divider{width:34px;height:1px;background:linear-gradient(90deg,transparent,rgba(0,255,224,.4),transparent);flex:none;margin:6px 0}
</style>
<script>
(function(){
  "use strict";
  if (window.__sleepyOfficial) return;
  window.__sleepyOfficial = true;
  function log(){ try{console.log.apply(console,["[Official]"].concat([].slice.call(arguments)));}catch(e){} }

  // ---- 1. Ensure we're in the official server on boot -------------------
  var ensureTries = 0;
  async function ensureMembership(){
    if (!window.ME) return false;
    try {
      var { data: official } = await sb.from('servers').select('*').eq('is_official', true).limit(1).maybeSingle();
      if (!official) return true; // no official server yet -> nothing to join
      var { data: mine } = await sb.from('server_members').select('*')
        .eq('server_id', official.id).eq('user_id', window.ME.id).maybeSingle();
      if (!mine) {
        await sb.from('server_members').insert({ server_id: official.id, user_id: window.ME.id });
        log("auto-joined official server");
        await window.loadServers();
        window.renderRail();
      }
      return true;
    } catch(e){ log("ensure error", e.message || e); return false; }
  }

  // Retry until ME is ready
  var bootInt = setInterval(async function(){
    ensureTries++;
    if (window.ME && window.ME.id) {
      clearInterval(bootInt);
      await ensureMembership();
      // After joining, if we were on home, hop into official #general
      setTimeout(async function(){
        if (window.CURRENT && window.CURRENT.type === "home") {
          var official = (window.SERVERS || []).filter(function(s){ return s.is_official; })[0];
          if (official) {
            try { await window.goServer(official.id); } catch(e){}
          }
        }
      }, 400);
    }
    if (ensureTries > 100) clearInterval(bootInt);
  }, 150);

  // ---- 2. Pin and highlight the official server in the rail -------------
  var origRenderRail = window.renderRail;
  window.renderRail = function(){
    origRenderRail();
    var rail = document.getElementById('rail');
    if (!rail) return;

    // Sort so official is right after the home button
    var officialBtns = [];
    var otherServerBtns = [];
    rail.querySelectorAll('[data-server]').forEach(function(btn){
      var sid = btn.getAttribute('data-server');
      var isOfficial = (window.SERVERS || []).some(function(s){ return s.id === sid && s.is_official; });
      if (isOfficial) { btn.classList.add('official'); officialBtns.push(btn); }
      else otherServerBtns.push(btn);
    });

    if (officialBtns.length){
      // Insert a divider after the official one if not present
      officialBtns.forEach(function(b){
        if (!b.querySelector('.star')) {
          var star = document.createElement('span');
          star.className = 'star';
          star.textContent = '\u2605';
          b.appendChild(star);
        }
        // Move to just after the home button
        var homeBtn = rail.querySelector('[data-rail="home"]');
        if (homeBtn) homeBtn.insertAdjacentElement('afterend', b);
      });
      // Add a divider after the last official button if not present
      var lastOfficial = officialBtns[officialBtns.length - 1];
      if (lastOfficial && (!lastOfficial.nextElementSibling || !lastOfficial.nextElementSibling.classList.contains('rail-divider'))){
        var divider = document.createElement('div');
        divider.className = 'rail-divider';
        lastOfficial.insertAdjacentElement('afterend', divider);
      }
    }
  };

  // ---- 3. Prevent leaving the official server ---------------------------
  var origLeaveServer = window.leaveServer;
  window.leaveServer = async function(serverId){
    try {
      var srv = (window.SERVERS || []).filter(function(s){ return s.id === serverId; })[0];
      if (srv && srv.is_official){
        window.toast("Official server", "The official Sleepy-Chat server cannot be left.", "err");
        return;
      }
    } catch(e){}
    return origLeaveServer(serverId);
  };

  // Also block the "Leave Server" item in the server menu for official
  var origOpenServerMenu = window.openServerMenu;
  window.openServerMenu = function(x, y){
    if (!window.CURRENT.server) return;
    var srv = window.CURRENT.server;
    var isOfficial = !!srv.is_official;
    var isOwner = srv.owner_id === window.ME.id;

    if (isOfficial){
      // Reduced menu: everyone can invite, nobody can leave/delete
      var items = [{ head: srv.name + " \u2605" }];
      items.push({ id:"invite", label:"Invite People", icon: window.SVG.users, onClick: window.openInviteServer });
      window.openMenu(x, y, items);
      return;
    }
    return origOpenServerMenu(x, y);
  };

  // Also block the header dropdown for official servers
  document.addEventListener("click", function(e){
    if (!window.CURRENT || window.CURRENT.type !== "server" || !window.CURRENT.server) return;
    if (!window.CURRENT.server.is_official) return;
    var ph = e.target.closest("#panel-head");
    if (!ph) return;
    e.stopImmediatePropagation();
    e.stopPropagation();
    e.preventDefault();
    var r = ph.getBoundingClientRect();
    var items = [
      { head: window.CURRENT.server.name + " \u2605" },
      { id:"invite", label:"Invite People", icon: window.SVG.users, onClick: window.openInviteServer }
    ];
    window.openMenu(r.left, r.bottom + 4, items);
  }, true);

  // ---- 4. Chat header: hide "leave" controls for official ---------------
  // (Handled by openServerMenu override above)

  log("official chat wired");
})();
</script>

.role-checks input{accent-color:var(--cyan);width:15px;height:15px;cursor:pointer}
.role-checks .dot{width:10px;height:10px;border-radius:50%;flex:none}

<script>
(function(){
  "use strict";
  if (window.__sleepyChanPerm) return;
  window.__sleepyChanPerm = true;
  function log(){ try{console.log.apply(console,["[Perm]"].concat([].slice.call(arguments)));}catch(e){} }
  function esc(s){ return window.esc(s); }

  // ---------------------------------------------------------------
  // 1. Permission check on the client (mirrors the SQL logic)
  // ---------------------------------------------------------------
  window.canSendInChannel = function(ch, srv, uid){
    if (!ch || !srv) return false;
    uid = uid || (window.ME && window.ME.id);
    if (srv.owner_id === uid) return true;
    var mode = ch.send_mode || 'everyone';
    if (mode === 'owner') return false;
    if (mode === 'everyone'){
      if (srv.is_official) return true;
      // non-official: must be a member
      // We already trust server membership because the user is viewing it
      return true;
    }
    if (mode === 'roles'){
      var allowed = ch.send_roles || [];
      if (!allowed.length) return false;
      var my = (window.MEMBER_ROLES && window.MEMBER_ROLES[uid]) || [];
      for (var i = 0; i < my.length; i++) if (allowed.indexOf(my[i]) >= 0) return true;
      return false;
    }
    return true;
  };

  // ---------------------------------------------------------------
  // 2. Channel settings modal — add send-mode section
  // ---------------------------------------------------------------
  var origOpenChannelSettings = window.openChannelSettings;
  window.openChannelSettings = function(chId){
    var ch = (window.CHANNELS || []).filter(function(c){ return c.id === chId; })[0];
    if (!ch) return;
    var srv = window.CURRENT.server;
    if (!srv) return;
    var isOwner = srv.owner_id === (window.ME && window.ME.id);
    var canManage = isOwner; // for now only owner can edit
    if (!canManage) return window.toast("Owner only", "Only the server owner can change channel settings.", "err");

    // Ensure roles list is loaded
    (async function(){
      // Make sure we have all roles
      try {
        var { data: roles } = await sb.from('server_roles')
          .select('*').eq('server_id', srv.id).order('position', { ascending: false });
        var allRoles = roles || [];
        var mode = ch.send_mode || 'everyone';
        var sendRoles = ch.send_roles || [];

        function roleCheckboxHTML(r){
          var checked = sendRoles.indexOf(r.id) >= 0 ? 'checked' : '';
          return '<label><input type="checkbox" data-role="'+r.id+'" '+checked+'>' +
            '<span class="dot" style="background:'+esc(r.color)+'"></span>' +
            '<span>'+esc(r.name)+'</span></label>';
        }

        var rolesSectionHTML = '';
        if (allRoles.length === 0){
          rolesSectionHTML = '<div class="hint" style="padding-left:26px">' +
            'You have no roles yet. Create roles in <b>Server menu → Manage Roles</b>, then come back to assign who can post here.</div>';
        } else {
          rolesSectionHTML =
            '<div class="role-checks" id="perm-roles" style="display:'+(mode === 'roles' ? 'flex' : 'none')+'">' +
            allRoles.map(roleCheckboxHTML).join('') +
            '</div>';
        }

        var body =
          '<div class="field"><label>Channel name</label>' +
            '<input id="cs-name" value="'+esc(ch.name)+'" maxlength="40"></div>' +
          '<div class="field"><label>Topic</label>' +
            '<input id="cs-topic" value="'+esc(ch.topic || '')+'" maxlength="120"></div>' +
          '<div class="field"><label>Category</label>' +
            '<input id="cs-cat" value="'+esc(ch.category || 'Text Channels')+'" maxlength="40"></div>' +

          '<hr style="border:none;border-top:1px solid var(--border);margin:20px 0">' +

          '<div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:10px">' +
            'Who can send messages here?' +
          '</div>' +

          '<div class="perm-block '+(mode === 'everyone' ? 'sel' : '')+'" data-mode="everyone">' +
            '<div class="head"><span class="perm-rad"></span><b>Everyone in this server</b></div>' +
            '<div class="desc">Any member can post. This is the default for chat channels.</div>' +
          '</div>' +

          '<div class="perm-block '+(mode === 'roles' ? 'sel' : '')+'" data-mode="roles">' +
            '<div class="head"><span class="perm-rad"></span><b>Specific roles only</b></div>' +
            '<div class="desc">Only members with one of the roles you tick below can post. Great for staff channels.</div>' +
            rolesSectionHTML +
          '</div>' +

          '<div class="perm-block '+(mode === 'owner' ? 'sel' : '')+'" data-mode="owner">' +
            '<div class="head"><span class="perm-rad"></span><b>Only the server owner</b></div>' +
            '<div class="desc">Just you can post. This is the <b>announcements</b> pattern — everyone can read, only you write.</div>' +
          '</div>';

        window.openModal("Channel Settings — #" + ch.name, body, {
          footer: '<button class="btn danger" id="cs-del">Delete Channel</button>' +
                  '<button class="btn" id="cs-no">Cancel</button>' +
                  '<button class="btn primary" id="cs-yes">Save</button>',
          onMount: function(){
            var currentMode = mode;

            // Handle mode selection
            document.querySelectorAll('.perm-block').forEach(function(block){
              block.onclick = function(e){
                // Ignore clicks inside the role checkboxes
                if (e.target.closest('.role-checks')) return;
                currentMode = block.dataset.mode;
                document.querySelectorAll('.perm-block').forEach(function(b){ b.classList.remove('sel'); });
                block.classList.add('sel');
                var rc = document.getElementById('perm-roles');
                if (rc) rc.style.display = currentMode === 'roles' ? 'flex' : 'none';
              };
            });

            document.getElementById('cs-no').onclick = window.closeModal;

            document.getElementById('cs-yes').onclick = async function(){
              try {
                var newName = document.getElementById('cs-name').value.trim().toLowerCase().replace(/\s+/g,'-') || ch.name;
                var newTopic = document.getElementById('cs-topic').value;
                var newCat = document.getElementById('cs-cat').value.trim() || ch.category || 'Text Channels';

                var pickedRoles = [];
                document.querySelectorAll('#perm-roles input[data-role]').forEach(function(cb){
                  if (cb.checked) pickedRoles.push(cb.dataset.role);
                });

                var patch = {
                  name: newName,
                  topic: newTopic,
                  category: newCat,
                  send_mode: currentMode,
                  send_roles: currentMode === 'roles' ? pickedRoles : []
                };
                var { error } = await sb.from('channels').update(patch).eq('id', chId);
                if (error) throw error;

                // Update local cache
                Object.assign(ch, patch);

                window.closeModal();
                await window.loadChannels(srv.id);
                window.renderPanel();
                window.renderChat(false);
                window.toast("Saved", "Channel updated.", "ok");
              } catch(e){
                window.toast("Error", e.message || String(e), "err");
              }
            };

            document.getElementById('cs-del').onclick = function(){
              window.confirmModal("Delete #" + ch.name + "?", "All messages in this channel will be deleted.", async function(){
                try {
                  await sb.from('channels').delete().eq('id', chId);
                  await window.loadChannels(srv.id);
                  var first = (window.CHANNELS || []).filter(function(c){ return c.type === 'text'; })[0] || (window.CHANNELS || [])[0];
                  window.CURRENT.channel = first || null;
                  if (first) await window.loadMessagesForChannel(first.id);
                  window.renderAll();
                } catch(e){ window.toast("Error", e.message || String(e), "err"); }
              }, true);
            };
          }
        });
      } catch(e){
        log("channel settings error", e);
        window.toast("Error", e.message || String(e), "err");
      }
    })();
  };

  // ---------------------------------------------------------------
  // 3. Composer permission gate
  // ---------------------------------------------------------------
  var origRenderComposer = window.renderComposer;
  window.renderComposer = function(){
    // If we're in a channel where we can't send, replace composer entirely
    if (window.CURRENT && window.CURRENT.type === 'server' && window.CURRENT.channel) {
      var ch = window.CURRENT.channel;
      var srv = window.CURRENT.server;
      var canPost = window.canSendInChannel(ch, srv);
      if (!canPost) {
        var wrap = document.getElementById('composer-wrap');
        if (wrap) {
          var reason = '';
          if (ch.send_mode === 'owner') {
            reason = 'Only the server owner can post in #' + esc(ch.name) + '.';
          } else if (ch.send_mode === 'roles') {
            var roleNames = [];
            var allowed = ch.send_roles || [];
            (window.ROLES || []).forEach(function(r){
              if (allowed.indexOf(r.id) >= 0) roleNames.push(r.name);
            });
            reason = roleNames.length
              ? 'Only members with these roles can post here: ' + esc(roleNames.join(', '))
              : 'Only members with specific roles can post here.';
          } else {
            reason = 'You do not have permission to post here.';
          }
          wrap.innerHTML =
            '<div class="composer-locked">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                '<rect x="4" y="11" width="16" height="10" rx="2"/>' +
                '<path d="M8 11V8a4 4 0 0 1 8 0v3"/>' +
              '</svg>' +
              '<span>' + reason + '</span>' +
            '</div>';
          return;
        }
      }
    }
    return origRenderComposer();
  };

  // ---------------------------------------------------------------
  // 4. Sidebar lock indicator
  // ---------------------------------------------------------------
  var origRenderChannelPanel = window.renderChannelPanel;
  window.renderChannelPanel = function(){
    origRenderChannelPanel();
    var body = document.getElementById('panel-body');
    if (!body) return;
    body.querySelectorAll('[data-channel]').forEach(function(btn){
      var cid = btn.dataset.channel;
      var ch = (window.CHANNELS || []).filter(function(c){ return c.id === cid; })[0];
      if (!ch) return;
      var mode = ch.send_mode || 'everyone';
      // Only add a lock if the mode restricts posting
      if (mode === 'owner' || mode === 'roles') {
        if (btn.querySelector('.channel-lock')) return;
        var lock = document.createElement('span');
        lock.className = 'channel-lock';
        lock.title = mode === 'owner' ? 'Only the server owner can post' : 'Only specific roles can post';
        lock.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px">' +
          '<rect x="4" y="11" width="16" height="10" rx="2"/>' +
          '<path d="M8 11V8a4 4 0 0 1 8 0v3"/>' +
        '</svg>';
        // Insert before the badge/preview area
        var txt = btn.querySelector('.txt');
        if (txt) txt.insertAdjacentElement('afterend', lock);
      }
    });
  };

  // ---------------------------------------------------------------
  // 5. Auto-open announcements when landing on official server
  // ---------------------------------------------------------------
  // Optional: when the user first lands on the official server, prefer
  // #general; the existing behaviour already does that. We don't change it.

  log("channel permissions ready");
})();
</script>
