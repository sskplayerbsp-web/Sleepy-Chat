<script>
(function(){
  "use strict";
  if (window.__sleepyVoiceDebug) return;
  window.__sleepyVoiceDebug = true;
  function log(){ try{console.log.apply(console,["[VD]"].concat([].slice.call(arguments)));}catch(e){} }

  // ============================================================
  // 1. FIX GLARE — polite/impolite peer negotiation
  // ============================================================
  // WebRTC glare: both peers send offers at the same time and both
  // try to setRemoteDescription(offer) while an offer is in flight.
  // Standard fix: one peer is "polite" (yields), the other "impolite"
  // (ignores incoming offers during its own negotiation). The rule:
  // the peer with the alphabetically GREATER id is polite.

  function isPolite(myId, theirId){
    return String(myId) > String(theirId);
  }

  // Replace createOffer to use perfect negotiation
  window.__voiceCreateOffer = async function(peerId, iceServers){
    var cs = window.callState;
    if (!cs) return;

    // If we already have a peer connection, don't create another
    if (cs.peers[peerId]) {
      log("peer already exists:", peerId);
      return cs.peers[peerId];
    }

    var pc = new RTCPeerConnection({ iceServers: iceServers });
    cs.peers[peerId] = pc;

    // Track making-offer state to detect glare
    pc.__makingOffer = false;
    pc.__polite = isPolite(window.ME.id, peerId);

    pc.onnegotiationneeded = async function(){
      try {
        pc.__makingOffer = true;
        await pc.setLocalDescription();
        cs.signalingChannel.send({
          type: 'broadcast', event: 'offer',
          payload: { from: window.ME.id, sdp: pc.localDescription }
        });
        log("offer sent to", peerId);
      } catch(e){
        log("negotiation failed:", e.message);
      } finally {
        pc.__makingOffer = false;
      }
    };

    // Add our local tracks
    cs.localStream.getTracks().forEach(function(track){
      pc.addTrack(track, cs.localStream);
    });

    // Receive remote tracks
    pc.ontrack = function(event){
      log("got remote track from", peerId, "kind:", event.track.kind);
      attachRemoteMedia(peerId, event.streams[0]);
    };

    pc.onicecandidate = function(event){
      if (event.candidate){
        cs.signalingChannel.send({
          type: 'broadcast', event: 'ice-candidate',
          payload: { from: window.ME.id, candidate: event.candidate }
        });
      }
    };

    pc.onconnectionstatechange = function(){
      log("peer", peerId, "state:", pc.connectionState);
      updateDebugPanel();
      updateDockStatus();
      if (pc.connectionState === 'failed'){
        log("connection failed for", peerId, "- closing");
        closePeer(peerId);
      }
    };

    pc.oniceconnectionstatechange = function(){
      log("peer", peerId, "ICE:", pc.iceConnectionState);
      updateDebugPanel();
    };

    // Trigger negotiation
    if (pc.signalingState === 'stable'){
      pc.__makingOffer = true;
      try {
        var offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        cs.signalingChannel.send({
          type: 'broadcast', event: 'offer',
          payload: { from: window.ME.id, sdp: pc.localDescription }
        });
        log("offer sent to", peerId);
      } catch(e){
        log("createOffer failed:", e.message);
      } finally {
        pc.__makingOffer = false;
      }
    }

    return pc;
  };

  // Replace handleOffer with glare-aware version
  window.__voiceHandleOffer = async function(peerId, sdp, iceServers){
    var cs = window.callState;
    if (!cs) return;

    var pc = cs.peers[peerId];

    // If we don't have a connection yet, create one
    if (!pc){
      pc = new RTCPeerConnection({ iceServers: iceServers });
      cs.peers[peerId] = pc;
      pc.__makingOffer = false;
      pc.__polite = isPolite(window.ME.id, peerId);

      cs.localStream.getTracks().forEach(function(track){
        pc.addTrack(track, cs.localStream);
      });

      pc.ontrack = function(event){
        log("got remote track from", peerId, "kind:", event.track.kind);
        attachRemoteMedia(peerId, event.streams[0]);
      };

      pc.onicecandidate = function(event){
        if (event.candidate){
          cs.signalingChannel.send({
            type: 'broadcast', event: 'ice-candidate',
            payload: { from: window.ME.id, candidate: event.candidate }
          });
        }
      };

      pc.onconnectionstatechange = function(){
        log("peer", peerId, "state:", pc.connectionState);
        updateDebugPanel();
        updateDockStatus();
        if (pc.connectionState === 'failed') closePeer(peerId);
      };
    }

    try {
      // Glare detection: if we're making an offer and incoming is also an offer
      var offerCollision = pc.__makingOffer || pc.signalingState !== 'stable';
      var polite = pc.__polite;

      // Impolite peer ignores the incoming offer during a collision
      if (offerCollision && !polite){
        log("impolite - ignoring incoming offer from", peerId);
        return;
      }

      // Polite peer rolls back and accepts the incoming offer
      if (offerCollision && polite){
        log("polite - rolling back to accept offer from", peerId);
        try {
          await pc.setLocalDescription({ type: 'rollback' });
        } catch(e){ log("rollback failed:", e.message); }
      }

      await pc.setRemoteDescription(new RTCSessionDescription(sdp));
      var answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);

      cs.signalingChannel.send({
        type: 'broadcast', event: 'answer',
        payload: { from: window.ME.id, sdp: pc.localDescription }
      });
      log("answer sent to", peerId);
    } catch(e){
      log("handleOffer failed for", peerId, ":", e.message);
    }
  };

  // ============================================================
  // 2. ATTACH REMOTE MEDIA properly (fixes autoplay/silence)
  // ============================================================
  function attachRemoteMedia(peerId, stream){
    var cs = window.callState;

    // AUDIO — always attach, but respect deafen state
    var audio = cs.audioElements[peerId];
    if (!audio){
      audio = document.createElement('audio');
      audio.autoplay = true;
      audio.playsInline = true;
      audio.id = 'call-audio-' + peerId;
      audio.setAttribute('data-peer', peerId);
      document.body.appendChild(audio);
      cs.audioElements[peerId] = audio;
    }
    audio.srcObject = stream;
    // Explicit play call — sometimes autoplay is blocked
    var p = audio.play();
    if (p && p.catch){
      p.catch(function(err){
        log("audio play() rejected:", err.message, "- will retry on next user gesture");
        // Retry on any click
        var retry = function(){
          audio.play().catch(function(){});
          document.removeEventListener('click', retry, true);
        };
        document.addEventListener('click', retry, true);
      });
    }
    audio.muted = !!cs.deafened;

    // VIDEO — only if the stream has a video track
    if (stream.getVideoTracks().length){
      var vid = cs.videoElements[peerId];
      if (!vid){
        vid = document.createElement('video');
        vid.autoplay = true;
        vid.playsInline = true;
        vid.id = 'call-video-' + peerId;
        cs.videoElements[peerId] = vid;
      }
      vid.srcObject = stream;
      vid.play().catch(function(){});
      renderVideoGrid();
    }
  }

  // ============================================================
  // 3. HOOK INTO EXISTING CODE — replace createOffer / handleOffer
  // ============================================================
  // The original voice code calls `createOffer` and `handleOffer` as
  // local functions. They're not on window, so we can't wrap them
  // directly. Instead, we intervene at the signaling layer: whenever
  // the signaling channel receives an offer/answer, we route it
  // through our glare-safe versions.
  //
  // We also wrap joinVoice so that after it sets up signaling, we
  // install our own handler that replaces the built-in one.

  var origJoinVoice = window.joinVoice;
  if (typeof origJoinVoice === 'function'){
    window.joinVoice = async function(channelId, withVideo){
      // Let the original join run first
      var result = await origJoinVoice.call(this, channelId, withVideo);

      // Now that signalingChannel exists, override the offer/answer handlers
      setTimeout(function(){
        var cs = window.callState;
        if (!cs || !cs.signalingChannel) return;

        log("installing glare-safe offer handler");

        // We can't remove individual listeners from a Supabase channel,
        // so we intercept by keeping a reference to the "active" peers map
        // and letting our createOffer/handleOffer overwrite entries.
        // The original handlers will still fire, but our versions will
        // win because they check `cs.peers[peerId]` and reuse the connection.

        // Kick off an initial negotiation with everyone we can see
        sb.from('voice_participants')
          .select('user_id')
          .eq('channel_id', channelId)
          .then(function(resp){
            var others = (resp.data || [])
              .map(function(r){ return r.user_id; })
              .filter(function(uid){ return uid !== window.ME.id; });
            log("existing participants to connect to:", others.length);
            others.forEach(function(peerId){
              if (!cs.peers[peerId]){
                window.__voiceCreateOffer(peerId, cs.iceServers || [{ urls: 'stun:stun.l.google.com:19302' }]);
              }
            });
          });
      }, 300);

      // Show debug panel
      setTimeout(renderDebugPanel, 400);

      return result;
    };
  }

  // ============================================================
  // 4. DIAGNOSTIC PANEL
  // ============================================================
  function renderDebugPanel(){
    var existing = document.getElementById('voice-debug');
    if (existing) return;
    var panel = document.createElement('div');
    panel.id = 'voice-debug';
    panel.className = 'voice-debug';
    document.body.appendChild(panel);
    updateDebugPanel();
  }

  function updateDebugPanel(){
    var panel = document.getElementById('voice-debug');
    if (!panel) return;
    var cs = window.callState;
    if (!cs || !cs.channelId){
      panel.innerHTML = '<h5>Voice Debug</h5><div class="row">Not in a call</div>' +
        '<button id="vd-refresh">Refresh</button>';
      wireRefresh(panel);
      return;
    }

    var peerIds = Object.keys(cs.peers);
    var audioCount = Object.keys(cs.audioElements).length;
    var videoCount = Object.keys(cs.videoElements).length;

    var html = '<h5>Voice Debug</h5>';
    html += '<div class="row"><span>Peers</span><b>' + peerIds.length + '</b></div>';
    html += '<div class="row"><span>Audio elements</span><b>' + audioCount + '</b></div>';
    html += '<div class="row"><span>Video elements</span><b>' + videoCount + '</b></div>';

    // Per-peer state
    peerIds.forEach(function(pid, i){
      var pc = cs.peers[pid];
      var state = pc.connectionState || 'new';
      var iceState = pc.iceConnectionState || 'new';
      var cls = 'wait';
      if (state === 'connected') cls = 'ok';
      else if (state === 'failed' || state === 'closed') cls = 'bad';
      var shortId = pid.slice(0, 8);
      html += '<div class="row ' + cls + '"><span>peer ' + shortId + '</span><b>' + state + '/' + iceState + '</b></div>';
    });

    // Audio element states
    for (var pid in cs.audioElements){
      var a = cs.audioElements[pid];
      var paused = a.paused ? 'paused' : 'playing';
      var muted = a.muted ? 'muted' : 'unmuted';
      html += '<div class="row ' + (paused === 'playing' ? 'ok' : 'bad') + '">' +
        '<span>audio ' + pid.slice(0, 6) + '</span><b>' + paused + ' ' + muted + '</b></div>';
    }

    // Tip
    if (peerIds.length === 0){
      html += '<div class="tip">No peers yet. If other accounts have joined, this should show them within a few seconds. Check that the voice_participants table exists.</div>';
    } else if (peerIds.some(function(pid){ return cs.peers[pid].connectionState === 'connected'; })){
      html += '<div class="tip">Connected. If you still hear nothing on the SAME machine, Chrome\'s echo cancellation is silencing the audio. Use headphones, or test on TWO devices.</div>';
    } else {
      html += '<div class="tip">Peers found but not connected. Wait 5-10 seconds — WebRTC usually connects within that time. If states stay "connecting" or "new", TURN is likely needed.</div>';
    }

    html += '<button id="vd-refresh">Refresh</button>';
    panel.innerHTML = html;
    wireRefresh(panel);
  }

  function wireRefresh(panel){
    var b = panel.querySelector('#vd-refresh');
    if (b) b.onclick = updateDebugPanel;
  }

  // Refresh debug panel every 2 seconds
  setInterval(function(){
    if (window.callState && window.callState.channelId) updateDebugPanel();
  }, 2000);

  // ============================================================
  // 5. DOCK STATUS INDICATOR
  // ============================================================
  function updateDockStatus(){
    var dock = document.getElementById('voice-dock');
    if (!dock) return;
    var cs = window.callState;
    var peerIds = Object.keys(cs.peers);
    if (!peerIds.length) return;

    var connected = peerIds.filter(function(pid){
      return cs.peers[pid].connectionState === 'connected';
    }).length;

    // Find or create the status chip
    var chip = dock.querySelector('.peer-status');
    if (!chip){
      chip = document.createElement('span');
      chip.className = 'peer-status';
      var names = dock.querySelector('.names');
      if (names) names.insertAdjacentElement('afterend', chip);
    }
    chip.textContent = connected + '/' + peerIds.length;
    chip.classList.remove('ok', 'wait', 'bad');
    if (connected === peerIds.length && peerIds.length > 0) chip.classList.add('ok');
    else if (connected === 0) chip.classList.add('bad');
    else chip.classList.add('wait');
    chip.title = connected + ' of ' + peerIds.length + ' peers connected';
    chip.onclick = function(){
      var panel = document.getElementById('voice-debug');
      if (panel) panel.remove();
      else renderDebugPanel();
    };
  }

  // ============================================================
  // 6. CLEANUP — remove debug panel when leaving call
  // ============================================================
  var origLeaveVoice = window.leaveVoice;
  if (typeof origLeaveVoice === 'function'){
    window.leaveVoice = async function(){
      var panel = document.getElementById('voice-debug');
      if (panel) panel.remove();
      return origLeaveVoice.call(this);
    };
  }

  log("voice debug + glare fix ready");
})();
</script>

<script>
(function(){
  "use strict";
  if (window.__sleepySimpleVoice) return;
  window.__sleepySimpleVoice = true;
  function log(){ try{console.log.apply(console,["[Voice]"].concat([].slice.call(arguments)));}catch(e){} }

  // ============================================================
  // SIMPLE STATE
  // ============================================================
  window.vs = {
    channelId: null,
    stream: null,
    muted: false,
    deafened: false,
    video: false,
    peers: {},           // peerId -> { pc, pendingIce: [], remoteSet: false, retries: 0 }
    signaling: null,
    presence: null,
    ice: null,
    status: 'idle',      // 'idle' | 'connecting' | 'connected' | 'failed'
    uiTimer: null,
  };

  // ============================================================
  // HARD RESET — clean up everything from a previous session
  // ============================================================
  async function hardReset(){
    var s = window.vs;

    // Stop any existing mic/camera
    if (s.stream){
      try { s.stream.getTracks().forEach(function(t){ t.stop(); }); } catch(e){}
      s.stream = null;
    }

    // Close every peer connection
    for (var pid in s.peers){
      try { s.peers[pid].pc.close(); } catch(e){}
    }
    s.peers = {};

    // Remove every audio element
    document.querySelectorAll('[data-voice-audio]').forEach(function(el){ el.remove(); });

    // Unsubscribe signaling + presence
    if (s.signaling){ try { sb.removeChannel(s.signaling); } catch(e){} s.signaling = null; }
    if (s.presence){ try { sb.removeChannel(s.presence); } catch(e){} s.presence = null; }

    // Remove this user from voice_participants entirely
    if (window.ME){
      try {
        await sb.from('voice_participants').delete().eq('user_id', window.ME.id);
      } catch(e){ log("cleanup failed:", e.message); }
    }

    // Remove any debug panels
    var dbg = document.getElementById('voice-debug');
    if (dbg) dbg.remove();

    // Remove old dock
    var dock = document.getElementById('voice-dock');
    if (dock) dock.remove();

    s.status = 'idle';
    s.channelId = null;
  }

  // ============================================================
  // MEDIA ACQUISITION
  // ============================================================
  async function getStream(video){
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      throw new Error("Your browser doesn't support mic/camera access.");
    }
    if (!window.isSecureContext && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1'){
      throw new Error("Mic and camera need HTTPS. Open the site over https://");
    }
    return navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      video: video ? { width: 640, height: 480 } : false
    });
  }

  async function getIce(){
    if (window.vs.ice) return window.vs.ice;
    try {
      var session = await sb.auth.getSession();
      var token = session && session.data && session.data.session && session.data.session.access_token;
      if (!token) throw new Error("no auth");
      var res = await fetch(SUPABASE_URL + "/functions/v1/turn-credentials", {
        method: "POST",
        headers: { "Authorization": "Bearer " + token, "apikey": SUPABASE_ANON_KEY }
      });
      if (!res.ok) throw new Error("TURN " + res.status);
      var data = await res.json();
      window.vs.ice = data.iceServers;
    } catch(e){
      log("TURN unavailable, using public STUN");
      window.vs.ice = [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" }
      ];
    }
    return window.vs.ice;
  }

  // ============================================================
  // PEER CREATION with ICE buffering
  // ============================================================
  function createPeer(peerId){
    var s = window.vs;
    if (s.peers[peerId]) return s.peers[peerId];

    var pc = new RTCPeerConnection({ iceServers: s.ice || [] });
    var peer = {
      pc: pc,
      pendingIce: [],
      remoteSet: false,
      retries: 0,
      polite: String(window.ME.id) > String(peerId),
      makingOffer: false,
    };
    s.peers[peerId] = peer;

    // Local tracks
    s.stream.getTracks().forEach(function(track){
      pc.addTrack(track, s.stream);
    });

    // Remote media
    pc.ontrack = function(event){
      log("remote track from", peerId.slice(0,6), "kind:", event.track.kind);
      attachRemote(peerId, event.streams[0]);
    };

    // ICE candidates → send to peer
    pc.onicecandidate = function(event){
      if (event.candidate){
        s.signaling.send({
          type: 'broadcast', event: 'ice',
          payload: { from: window.ME.id, candidate: event.candidate }
        });
      }
    };

    // Connection state → update UI + retry on fail
    pc.onconnectionstatechange = function(){
      var st = pc.connectionState;
      log("peer", peerId.slice(0,6), "state:", st);
      refreshStatus();
      if (st === 'failed'){
        if (peer.retries < 2){
          peer.retries++;
          log("retrying peer", peerId.slice(0,6), "attempt", peer.retries);
          closePeer(peerId);
          setTimeout(function(){ makeOffer(peerId); }, 800);
        } else {
          log("giving up on", peerId.slice(0,6));
          closePeer(peerId);
          s.status = 'failed';
          refreshStatus();
        }
      } else if (st === 'connected'){
        s.status = 'connected';
        refreshStatus();
      }
    };

    return peer;
  }

  // ============================================================
  // OFFER / ANSWER — with glare-safe negotiation
  // ============================================================
  async function makeOffer(peerId){
    var s = window.vs;
    if (!s.signaling) return;
    var peer = s.peers[peerId] || createPeer(peerId);
    var pc = peer.pc;

    try {
      peer.makingOffer = true;
      var offer = await pc.createOffer();
      if (pc.signalingState !== 'stable'){
        log("skip offer — not stable:", pc.signalingState);
        return;
      }
      await pc.setLocalDescription(offer);
      s.signaling.send({
        type: 'broadcast', event: 'offer',
        payload: { from: window.ME.id, sdp: pc.localDescription }
      });
      log("offer sent to", peerId.slice(0,6));
    } catch(e){
      log("makeOffer error:", e.message);
    } finally {
      peer.makingOffer = false;
    }
  }

  async function handleOffer(peerId, sdp){
    var s = window.vs;
    var peer = s.peers[peerId] || createPeer(peerId);
    var pc = peer.pc;

    try {
      var collision = peer.makingOffer || pc.signalingState !== 'stable';
      if (collision && !peer.polite){
        log("impolite — ignoring offer from", peerId.slice(0,6));
        return;
      }
      if (collision && peer.polite){
        try { await pc.setLocalDescription({ type: 'rollback' }); } catch(e){}
      }

      await pc.setRemoteDescription(new RTCSessionDescription(sdp));
      peer.remoteSet = true;
      flushIce(peer);

      var answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      s.signaling.send({
        type: 'broadcast', event: 'answer',
        payload: { from: window.ME.id, sdp: pc.localDescription }
      });
      log("answer sent to", peerId.slice(0,6));
    } catch(e){
      log("handleOffer error:", e.message);
    }
  }

  async function handleAnswer(peerId, sdp){
    var s = window.vs;
    var peer = s.peers[peerId];
    if (!peer) return;
    try {
      if (peer.pc.signalingState === 'have-local-offer'){
        await peer.pc.setRemoteDescription(new RTCSessionDescription(sdp));
        peer.remoteSet = true;
        flushIce(peer);
        log("answer accepted from", peerId.slice(0,6));
      }
    } catch(e){
      log("handleAnswer error:", e.message);
    }
  }

  async function handleIce(peerId, candidate){
    var s = window.vs;
    var peer = s.peers[peerId];
    if (!peer){
      // Peer not yet created — create one so we can buffer
      peer = createPeer(peerId);
    }
    if (!peer.remoteSet){
      // Buffer until remote description is set
      peer.pendingIce.push(candidate);
      return;
    }
    try {
      await peer.pc.addIceCandidate(new RTCIceCandidate(candidate));
    } catch(e){
      log("ICE add error:", e.message);
    }
  }

  async function flushIce(peer){
    while (peer.pendingIce.length){
      var c = peer.pendingIce.shift();
      try { await peer.pc.addIceCandidate(new RTCIceCandidate(c)); } catch(e){}
    }
  }

  function closePeer(peerId){
    var s = window.vs;
    var peer = s.peers[peerId];
    if (!peer) return;
    try { peer.pc.close(); } catch(e){}
    delete s.peers[peerId];
    var el = document.getElementById('voice-audio-' + peerId);
    if (el) el.remove();
    var vid = document.getElementById('voice-video-' + peerId);
    if (vid) vid.remove();
  }

  function attachRemote(peerId, stream){
    var s = window.vs;

    // Audio element
    var audio = document.getElementById('voice-audio-' + peerId);
    if (!audio){
      audio = document.createElement('audio');
      audio.id = 'voice-audio-' + peerId;
      audio.setAttribute('data-voice-audio', '1');
      audio.autoplay = true;
      audio.playsInline = true;
      document.body.appendChild(audio);
    }
    audio.srcObject = stream;
    audio.muted = !!s.deafened;
    var p = audio.play();
    if (p && p.catch){
      p.catch(function(){
        // Autoplay blocked — retry on next click
        var retry = function(){
          audio.play().catch(function(){});
          document.removeEventListener('click', retry, true);
        };
        document.addEventListener('click', retry, true);
      });
    }

    // Video element
    if (stream.getVideoTracks().length){
      renderVideoGrid();
    }
  }

  // ============================================================
  // JOIN / LEAVE
  // ============================================================
  window.joinVoice = async function(channelId, withVideo){
    // If already in this channel, do nothing
    if (window.vs.channelId === channelId) return;

    // Full cleanup of any previous session
    await hardReset();

    log("joining", channelId, "video:", withVideo);
    window.vs.channelId = channelId;
    window.vs.status = 'connecting';
    window.vs.video = !!withVideo;

    // Get mic (+ camera)
    try {
      window.vs.stream = await getStream(withVideo);
    } catch(e){
      window.vs.status = 'idle';
      window.vs.channelId = null;
      window.toast("Couldn't start mic", e.message || String(e), "err");
      throw e;
    }

    // Get ICE servers
    await getIce();

    // Announce presence in the DB
    try {
      await sb.from('voice_participants').upsert({
        channel_id: channelId,
        user_id: window.ME.id,
        is_muted: false,
        is_deafened: false,
        is_video_on: !!withVideo
      });
    } catch(e){ log("participant upsert failed:", e.message); }

    // Set up signaling channel
    var sigName = "voice-sig-" + channelId;
    window.vs.signaling = sb.channel(sigName, { config: { broadcast: { self: false } } });

    window.vs.signaling
      .on('broadcast', { event: 'offer' }, function(p){
        if (p.payload.from === window.ME.id) return;
        handleOffer(p.payload.from, p.payload.sdp);
      })
      .on('broadcast', { event: 'answer' }, function(p){
        if (p.payload.from === window.ME.id) return;
        handleAnswer(p.payload.from, p.payload.sdp);
      })
      .on('broadcast', { event: 'ice' }, function(p){
        if (p.payload.from === window.ME.id) return;
        handleIce(p.payload.from, p.payload.candidate);
      })
      .on('broadcast', { event: 'bye' }, function(p){
        if (p.payload.from === window.ME.id) return;
        closePeer(p.payload.from);
      })
      .subscribe(async function(status){
        if (status === 'SUBSCRIBED'){
          log("signaling ready");
          // Tell everyone we're here
          window.vs.signaling.send({
            type: 'broadcast', event: 'hello',
            payload: { from: window.ME.id }
          });
          // Find who's already here and connect to them
          connectToExisting(channelId);
        }
      });

    // Also listen for "hello" so existing members create offers to newcomers
    window.vs.signaling.on('broadcast', { event: 'hello' }, function(p){
      if (p.payload.from === window.ME.id) return;
      log("newcomer:", p.payload.from.slice(0,6));
      // If we're the existing member, we create the offer
      if (!window.vs.peers[p.payload.from]){
        setTimeout(function(){ makeOffer(p.payload.from); }, 400);
      }
    });

    // Presence channel to know when peers leave
    var presName = "voice-pres-" + channelId;
    window.vs.presence = sb.channel(presName, { config: { presence: { key: window.ME.id } } });
    window.vs.presence
      .on('presence', { event: 'leave' }, function(o){ closePeer(o.key); })
      .subscribe(async function(status){
        if (status === 'SUBSCRIBED'){
          await window.vs.presence.track({ user_id: window.ME.id });
        }
      });

    // UI
    renderDock();
    window.renderChat(false);
    window.toast("Joined call", "You're in the voice channel.", "ok");
  };

  async function connectToExisting(channelId){
    try {
      var resp = await sb.from('voice_participants').select('user_id').eq('channel_id', channelId);
      var others = (resp.data || [])
        .map(function(r){ return r.user_id; })
        .filter(function(uid){ return uid !== window.ME.id; });
      log("connecting to existing:", others.length);
      // Don't create offers immediately — wait for hello handshake
      // (avoids glare where both sides offer at the same time)
      others.forEach(function(peerId){
        setTimeout(function(){
          if (!window.vs.peers[peerId]){
            makeOffer(peerId);
          }
        }, 300 + Math.random() * 400);
      });
    } catch(e){ log("connectToExisting error:", e.message); }
  }

  window.leaveVoice = async function(){
    var s = window.vs;
    if (s.signaling){
      try {
        s.signaling.send({ type: 'broadcast', event: 'bye', payload: { from: window.ME.id } });
      } catch(e){}
    }
    await hardReset();
    window.renderChat(false);
    window.toast("Left call", "", "ok");
  };

  // ============================================================
  // MUTE / DEAFEN / VIDEO
  // ============================================================
  window.toggleMute = function(){
    var s = window.vs;
    if (!s.stream) return;
    s.muted = !s.muted;
    s.stream.getAudioTracks().forEach(function(t){ t.enabled = !s.muted; });
    if (s.channelId){
      sb.from('voice_participants').update({ is_muted: s.muted })
        .eq('channel_id', s.channelId).eq('user_id', window.ME.id).then(function(){});
    }
    renderDock();
  };

  window.toggleDeafen = function(){
    var s = window.vs;
    s.deafened = !s.deafened;
    document.querySelectorAll('[data-voice-audio]').forEach(function(el){
      el.muted = s.deafened;
    });
    renderDock();
  };

  window.toggleVideo = function(){
    var s = window.vs;
    if (!s.stream) return;
    s.video = !s.video;
    s.stream.getVideoTracks().forEach(function(t){ t.enabled = s.video; });
    if (s.channelId){
      sb.from('voice_participants').update({ is_video_on: s.video })
        .eq('channel_id', s.channelId).eq('user_id', window.ME.id).then(function(){});
    }
    renderDock();
    renderVideoGrid();
  };

  // ============================================================
  // UI — CLEAN VOICE DOCK
  // ============================================================
  function refreshStatus(){
    // Determine aggregate status from all peers
    var s = window.vs;
    var ids = Object.keys(s.peers);
    if (ids.length === 0){
      s.status = 'connecting';
    } else {
      var connected = ids.filter(function(pid){ return s.peers[pid].pc.connectionState === 'connected'; }).length;
      var failed = ids.filter(function(pid){ return s.peers[pid].pc.connectionState === 'failed'; }).length;
      if (connected === ids.length) s.status = 'connected';
      else if (failed > 0 && connected === 0) s.status = 'failed';
      else s.status = 'connecting';
    }
    renderDock();
  }

  function renderDock(){
    var s = window.vs;
    var existing = document.getElementById('voice-dock');
    if (existing) existing.remove();
    if (!s.channelId) return;

    var ch = (window.CHANNELS || []).filter(function(c){ return c.id === s.channelId; })[0];
    var chName = ch ? ch.name : 'call';
    var peers = Object.keys(s.peers).length;

    var label = {
      connecting: 'Connecting',
      connected: 'Connected',
      failed: 'Connection failed',
      idle: 'Idle'
    }[s.status] || 'Idle';

    var dock = document.createElement('div');
    dock.id = 'voice-dock';
    dock.className = 'voice-dock';
    dock.innerHTML =
      '<span class="status ' + s.status + '"><i></i>' + label + '</span>' +
      '<span class="divider"></span>' +
      '<span class="count">' + (peers + 1) + ' in #' + chName + '</span>' +
      (s.status === 'failed' ? '<button id="vd-retry" title="Retry" style="color:var(--amber)">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>' +
      '</button>' : '') +
      '<button id="vd-mute" class="' + (s.muted ? 'on' : '') + '" title="Mute">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1M12 18v4M8 22h8"/></svg>' +
      '</button>' +
      '<button id="vd-deafen" class="' + (s.deafened ? 'on' : '') + '" title="Deafen">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>' +
      '</button>' +
      '<button id="vd-video" class="' + (s.video ? 'on' : '') + '" title="Camera">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="m22 8-6 4 6 4V8z"/></svg>' +
      '</button>' +
      '<button id="vd-leave" class="danger" title="Leave">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>' +
      '</button>';

    document.body.appendChild(dock);

    document.getElementById('vd-mute').onclick = window.toggleMute;
    document.getElementById('vd-deafen').onclick = window.toggleDeafen;
    document.getElementById('vd-video').onclick = window.toggleVideo;
    document.getElementById('vd-leave').onclick = window.leaveVoice;
    var rt = document.getElementById('vd-retry');
    if (rt) rt.onclick = retryAllPeers;
  }

  function retryAllPeers(){
    var s = window.vs;
    for (var pid in s.peers) closePeer(pid);
    s.status = 'connecting';
    renderDock();
    connectToExisting(s.channelId);
  }

  function renderVideoGrid(){
    var s = window.vs;
    var grid = document.getElementById('voice-video-grid');
    var hasVideo = s.video || Object.keys(s.peers).some(function(pid){
      return document.getElementById('voice-video-' + pid);
    });
    if (!hasVideo){
      if (grid) grid.remove();
      return;
    }
    if (!grid){
      grid = document.createElement('div');
      grid.id = 'voice-video-grid';
      grid.style.cssText = 'position:fixed;inset:0;z-index:300;background:rgba(4,4,8,.92);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;cursor:pointer';
      grid.onclick = function(e){ if (e.target === grid) grid.remove(); };
      document.body.appendChild(grid);
    }
    var tiles = '<div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:1200px">';
    if (s.video && s.stream){
      tiles += '<div style="width:280px;height:210px;background:#000;border-radius:12px;overflow:hidden;position:relative">' +
        '<video id="voice-self-video" autoplay playsinline muted style="width:100%;height:100%;object-fit:cover"></video>' +
        '<div style="position:absolute;bottom:6px;left:8px;font-size:11px;background:rgba(0,0,0,.6);padding:2px 6px;border-radius:4px">You</div>' +
      '</div>';
    }
    for (var pid in s.peers){
      var p = window.PROFILES[pid] || { display_name: 'User' };
      var hasVid = document.getElementById('voice-video-' + pid);
      if (!hasVid) continue;
      tiles += '<div style="width:280px;height:210px;background:#000;border-radius:12px;overflow:hidden;position:relative">' +
        '<video id="voice-remote-' + pid + '" autoplay playsinline style="width:100%;height:100%;object-fit:cover"></video>' +
        '<div style="position:absolute;bottom:6px;left:8px;font-size:11px;background:rgba(0,0,0,.6);padding:2px 6px;border-radius:4px">' + window.esc(p.display_name || p.username) + '</div>' +
      '</div>';
    }
    tiles += '</div>';
    grid.innerHTML = tiles;
    var self = document.getElementById('voice-self-video');
    if (self && s.stream) self.srcObject = s.stream;
    for (var pid2 in s.peers){
      var el = document.getElementById('voice-remote-' + pid2);
      var src = document.getElementById('voice-video-' + pid2);
      if (el && src && src.srcObject) el.srcObject = src.srcObject;
    }
  }

  // ============================================================
  // CHANNEL UI — clean Join panel
  // ============================================================
  async function renderVoiceJoinPanel(ch){
    var body = document.getElementById('chat-body');
    if (!body) return;

    var pIds = [];
    try {
      var resp = await sb.from('voice_participants').select('user_id').eq('channel_id', ch.id);
      pIds = (resp.data || []).map(function(r){ return r.user_id; });
      if (pIds.length) await window.fetchProfiles(pIds);
    } catch(e){}

    var isIn = window.vs.channelId === ch.id;

    var peopleHtml = '';
    if (pIds.length){
      peopleHtml = '<div class="people">' + pIds.map(function(uid){
        return '<div class="person">' +
          window.avatarHTML(uid, 48) +
          '<div class="nm">' + window.esc(window.userLabel(uid)) + '</div>' +
        '</div>';
      }).join('') + '</div>';
    } else {
      peopleHtml = '<div class="empty-line">Nobody is here yet. Be the first.</div>';
    }

    var buttons = isIn
      ? '<button class="btn danger" data-voice="leave">Leave Call</button>' +
        '<button class="btn ' + (window.vs.video ? '' : 'primary') + '" data-voice="toggle-video">' +
          (window.vs.video ? 'Camera Off' : 'Camera On') + '</button>'
      : '<button class="btn primary" data-voice="join-voice">Join Voice</button>' +
        '<button class="btn primary" style="background:linear-gradient(135deg,#b44aff,#7c2fd6);color:#fff" data-voice="join-video">Join Video</button>';

    body.innerHTML =
      '<div class="voice-join-panel">' +
        '<div class="ring">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M11 5 6 9H3v6h3l5 4V5z"/>' +
            '<path d="M15.5 8.5a5 5 0 0 1 0 7"/>' +
            '<path d="M18.5 5.5a9 9 0 0 1 0 13"/>' +
          '</svg>' +
        '</div>' +
        '<h2>' + window.esc(ch.name) + '</h2>' +
        '<div class="sub">' + (ch.topic ? window.esc(ch.topic) : 'Voice & video channel') + '</div>' +
        peopleHtml +
        '<div class="buttons">' + buttons + '</div>' +
      '</div>';

    var comp = document.getElementById('composer-wrap');
    if (comp) comp.innerHTML = '';
    var typ = document.getElementById('typing-bar');
    if (typ) typ.innerHTML = '';

    body.querySelectorAll('[data-voice]').forEach(function(btn){
      btn.onclick = function(){
        var a = btn.dataset.voice;
        if (a === 'join-voice') window.joinVoice(ch.id, false);
        else if (a === 'join-video') window.joinVoice(ch.id, true);
        else if (a === 'leave') window.leaveVoice();
        else if (a === 'toggle-video') window.toggleVideo();
      };
    });
  }

  // Override renderChat for voice channels
  var origRenderChat = window.renderChat;
  window.renderChat = function(scroll){
    if (window.CURRENT && window.CURRENT.type === 'server' && window.CURRENT.channel){
      var ch = window.CURRENT.channel;
      if (ch.type === 'voice' || ch.type === 'video'){
        renderVoiceJoinPanel(ch);
        return;
      }
    }
    return origRenderChat(scroll);
  };

  // Refresh the participant list every few seconds while viewing a voice channel
  setInterval(function(){
    if (!window.CURRENT || !window.CURRENT.channel) return;
    if (window.CURRENT.channel.type !== 'voice' && window.CURRENT.channel.type !== 'video') return;
    window.renderChat(false);
  }, 5000);

  // ============================================================
  // CLEANUP on page unload
  // ============================================================
  window.addEventListener('beforeunload', function(){
    if (window.vs && window.vs.channelId && window.ME){
      // Fire and forget — can't await during unload
      try {
        sb.from('voice_participants').delete()
          .eq('channel_id', window.vs.channelId)
          .eq('user_id', window.ME.id);
      } catch(e){}
    }
  });

  log("simple voice ready");
})();
</script>

<script>
(function(){
  "use strict";
  if (window.__sleepyVoicePolish) return;
  window.__sleepyVoicePolish = true;
  function log(){ try{console.log.apply(console,["[Polish]"].concat([].slice.call(arguments)));}catch(e){} }
  function esc(s){ return window.esc(s); }

  // ============================================================
  // PART 1 — FIX STATUS: show "Connected" as soon as any peer connects
  // ============================================================
  // The old logic required ALL peers connected. With ghost peers, that
  // never happened. New logic: as long as one peer is connected, we say
  // Connected. If some are still pending, show "Connected (2/3)".

  function computeStatus(){
    var s = window.vs;
    if (!s) return 'idle';
    var ids = Object.keys(s.peers);
    if (!ids.length) return s.status === 'failed' ? 'failed' : 'connecting';
    var connected = 0, failed = 0, pending = 0;
    ids.forEach(function(pid){
      var st = s.peers[pid].pc.connectionState;
      if (st === 'connected') connected++;
      else if (st === 'failed' || st === 'closed') failed++;
      else pending++;
    });
    if (connected > 0 && pending === 0 && failed === 0) return 'connected';
    if (connected > 0 && (pending > 0 || failed > 0)) return 'connected-partial';
    if (connected === 0 && failed === ids.length) return 'failed';
    if (connected === 0 && pending > 0){
      // If we've been waiting too long, mark failed
      if (s.__waitSince && Date.now() - s.__waitSince > 20000) return 'failed';
      return 'connecting';
    }
    return 'connected';
  }

  // Override renderDock to use the new status
  var origRenderDock = window.renderDock;
  // renderDock is a private function, not exposed. Instead we patch the
  // global toggle functions and just rebuild the dock periodically.
  function rebuildDock(){
    if (!window.vs || !window.vs.channelId){
      var d = document.getElementById('voice-dock');
      if (d) d.remove();
      return;
    }
    var s = window.vs;
    var status = computeStatus();
    s.status = status;

    // Update the status label in the existing dock
    var dock = document.getElementById('voice-dock');
    if (!dock){
      // Let the original render call happen
      return;
    }
    var statusEl = dock.querySelector('.status');
    if (statusEl){
      var cls = status === 'connected-partial' ? 'connected-partial' : status;
      statusEl.className = 'status ' + cls;
      var label = {
        connecting: 'Connecting',
        connected: 'Connected',
        'connected-partial': 'Connected',
        failed: 'Connection failed',
        idle: 'Idle'
      }[status] || 'Idle';
      // Append count if partial
      var ids = Object.keys(s.peers);
      var connected = ids.filter(function(pid){ return s.peers[pid].pc.connectionState === 'connected'; }).length;
      if (status === 'connected-partial') label += ' (' + connected + '/' + ids.length + ')';
      statusEl.innerHTML = '<i></i>' + label;
    }
    // Update count
    var countEl = dock.querySelector('.count');
    if (countEl){
      var ch = (window.CHANNELS || []).filter(function(c){ return c.id === s.channelId; })[0];
      var chName = ch ? ch.name : 'call';
      countEl.textContent = (Object.keys(s.peers).length + 1) + ' in #' + chName;
    }
  }

  // Run every 2 seconds to keep the dock in sync
  setInterval(rebuildDock, 2000);
  // Also track when we started connecting
  var origJoin = window.joinVoice;
  if (typeof origJoin === 'function'){
    window.joinVoice = async function(cid, vid){
      if (window.vs) window.vs.__waitSince = Date.now();
      var r = await origJoin.call(this, cid, vid);
      setTimeout(rebuildDock, 500);
      return r;
    };
  }

  // ============================================================
  // PART 2 — GHOST USER CLEANUP
  // ============================================================
  // When a tab is closed, the participant row stays in the DB.
  // Fixes:
  //   a) Heartbeat: our own row updates joined_at every 20s
  //   b) Filter: hide participants whose joined_at is older than 90s
  //   c) Unload: best-effort delete via sendBeacon-style fetch

  var HEARTBEAT_MS = 20000;
  var STALE_MS = 90000;
  var hbTimer = null;

  function startHeartbeat(){
    stopHeartbeat();
    if (!window.ME) return;
    hbTimer = setInterval(function(){
      if (!window.vs || !window.vs.channelId) return;
      sb.from('voice_participants')
        .update({ joined_at: new Date().toISOString() })
        .eq('channel_id', window.vs.channelId)
        .eq('user_id', window.ME.id)
        .then(function(){});
    }, HEARTBEAT_MS);
  }
  function stopHeartbeat(){
    if (hbTimer) { clearInterval(hbTimer); hbTimer = null; }
  }

  // Patch joinVoice to start the heartbeat
  var prevJoin2 = window.joinVoice;
  if (typeof prevJoin2 === 'function'){
    window.joinVoice = async function(cid, vid){
      var r = await prevJoin2.call(this, cid, vid);
      startHeartbeat();
      return r;
    };
  }
  // Patch leaveVoice to stop it
  var prevLeave2 = window.leaveVoice;
  if (typeof prevLeave2 === 'function'){
    window.leaveVoice = async function(){
      stopHeartbeat();
      return prevLeave2.call(this);
    };
  }

  // Best-effort cleanup on tab close / unload
  window.addEventListener('beforeunload', function(){
    if (!window.vs || !window.vs.channelId || !window.ME) return;
    // Use synchronous XMLHttpRequest as a last resort - most reliable for unload
    try {
      var url = SUPABASE_URL + '/rest/v1/voice_participants?channel_id=eq.'
        + encodeURIComponent(window.vs.channelId)
        + '&user_id=eq.' + encodeURIComponent(window.ME.id);
      var xhr = new XMLHttpRequest();
      xhr.open('DELETE', url, false); // synchronous
      xhr.setRequestHeader('apikey', SUPABASE_ANON_KEY);
      xhr.setRequestHeader('Authorization', 'Bearer ' + SUPABASE_ANON_KEY);
      xhr.send();
    } catch(e){}
  });

  // Override voice participant loading to filter stale rows
  var origRender = window.renderChat;
  window.renderChat = function(scroll){
    // Only intercept if we're rendering a voice channel
    if (window.CURRENT && window.CURRENT.channel &&
        (window.CURRENT.channel.type === 'voice' || window.CURRENT.channel.type === 'video')){
      // Let the original render run, but patch its participant query by
      // intercepting the DOM after a tick and removing stale avatars.
      var r = origRender.call(this, scroll);
      setTimeout(function(){
        pruneStaleFromVoicePanel();
      }, 400);
      return r;
    }
    return origRender.call(this, scroll);
  };

  function pruneStaleFromVoicePanel(){
    // Query the DB for fresh participants and re-render if any are stale
    if (!window.CURRENT || !window.CURRENT.channel) return;
    var chId = window.CURRENT.channel.id;
    sb.from('voice_participants')
      .select('user_id, joined_at')
      .eq('channel_id', chId)
      .then(function(resp){
        var rows = resp.data || [];
        var now = Date.now();
        var stale = rows.filter(function(r){
          return now - new Date(r.joined_at).getTime() > STALE_MS;
        });
        if (stale.length){
          // Delete stale rows quietly
          stale.forEach(function(row){
            sb.from('voice_participants')
              .delete()
              .eq('channel_id', chId)
              .eq('user_id', row.user_id)
              .then(function(){});
          });
          log("pruned " + stale.length + " stale participants");
        }
      });
  }

  // Also prune on boot - clean up any ghost rows on app load
  setTimeout(function(){
    if (!window.ME) return;
    // Get every voice_participants row where the heartbeat is stale
    sb.from('voice_participants')
      .select('channel_id, user_id, joined_at')
      .then(function(resp){
        var rows = resp.data || [];
        var now = Date.now();
        rows.forEach(function(r){
          if (now - new Date(r.joined_at).getTime() > STALE_MS){
            sb.from('voice_participants')
              .delete()
              .eq('channel_id', r.channel_id)
              .eq('user_id', r.user_id)
              .then(function(){});
          }
        });
      });
  }, 3000);

  // ============================================================
  // PART 3 — DEVICE-AWARE PWA INSTALL PROMPT
  // ============================================================
  // Shows ONCE per device. Phone gets "Add to Home Screen" steps.
  // Desktop gets an Install button (uses the beforeinstallprompt event
  // when available, otherwise shows manual steps).

  var STORAGE_KEY = 'sleepychat.install.dismissed.v2';
  var deferredPrompt = null;

  function isStandalone(){
    return window.matchMedia('(display-mode: standalone)').matches ||
           window.navigator.standalone === true ||
           document.referrer.indexOf('android-app://') === 0;
  }

  function deviceKind(){
    var ua = navigator.userAgent;
    if (/iPad|Tablet|PlayBook|Silk/i.test(ua)) return 'tablet';
    if (/Android|iPhone|iPod|Mobile|Windows Phone/i.test(ua)) return 'phone';
    return 'desktop';
  }

  function isIOS(){
    return /iPhone|iPad|iPod/i.test(navigator.userAgent) && !window.MSStream;
  }

  function isAndroid(){
    return /Android/i.test(navigator.userAgent);
  }

  function isChrome(){ return /Chrome/i.test(navigator.userAgent) && !/Edge|OPR/i.test(navigator.userAgent); }
  function isEdge(){ return /Edg\//i.test(navigator.userAgent); }
  function isFirefox(){ return /Firefox|FxiOS/i.test(navigator.userAgent); }
  function isSafari(){
    return /Safari/i.test(navigator.userAgent) && !/Chrome|CriOS|FxiOS|Edg/i.test(navigator.userAgent);
  }

  function buildInstallHTML(){
    var kind = deviceKind();
    var iconSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>' +
      '<polyline points="7 10 12 15 17 10"/>' +
      '<line x1="12" y1="15" x2="12" y2="3"/>' +
    '</svg>';

    if (kind === 'phone' && isIOS()){
      return {
        title: 'Install Sleepy-Chat',
        body: 'Add Sleepy-Chat to your home screen for the full app experience.',
        steps: 'Tap the <b>Share</b> button at the bottom of Safari, then scroll and tap <b>Add to Home Screen</b>, then <b>Add</b>.',
        showInstallButton: false
      };
    }
    if (kind === 'phone' && isAndroid()){
      return {
        title: 'Install Sleepy-Chat',
        body: 'Add Sleepy-Chat to your home screen for instant access.',
        steps: deferredPrompt
          ? 'Tap <b>Install</b> to add Sleepy-Chat to your home screen.'
          : 'Open the browser menu (⋮), then tap <b>Install app</b> or <b>Add to Home screen</b>.',
        showInstallButton: !!deferredPrompt
      };
    }
    if (kind === 'tablet'){
      return {
        title: 'Install Sleepy-Chat',
        body: 'Add Sleepy-Chat to your device for the full app experience.',
        steps: 'Open the browser menu, then choose <b>Install app</b> or <b>Add to Home screen</b>.',
        showInstallButton: !!deferredPrompt
      };
    }
    // Desktop
    var browserHint = 'Look for the install icon in your browser\'s address bar.';
    if (isChrome())   browserHint = 'Click the <b>install icon</b> in the address bar (top-right of the URL), or open the browser menu → <b>Install Sleepy-Chat</b>.';
    if (isEdge())     browserHint = 'Click the <b>install icon</b> next to the URL, or go to menu (⋯) → <b>Apps</b> → <b>Install this site as an app</b>.';
    if (isSafari())   browserHint = 'In Safari, go to <b>File</b> → <b>Add to Dock</b>.';
    if (isFirefox())  browserHint = 'Firefox desktop doesn\'t support installing websites as apps. Try Chrome or Edge for the best experience.';
    return {
      title: 'Install Sleepy-Chat as an app',
      body: 'Get Sleepy-Chat in its own window, no browser tabs, no URL bar.',
      steps: browserHint,
      showInstallButton: !!deferredPrompt
    };
  }

  function showInstallPrompt(){
    // Skip if already installed as app
    if (isStandalone()) return;
    // Skip if dismissed before
    try { if (localStorage.getItem(STORAGE_KEY) === '1') return; } catch(e){}
    // Skip if already shown on this page load
    if (document.getElementById('sc-install')) return;

    var info = buildInstallHTML();
    var el = document.createElement('div');
    el.id = 'sc-install';
    el.innerHTML =
      '<div class="ico">' + info.iconSvg + '</div>' +
      '<div class="body">' +
        '<h4>' + info.title + '</h4>' +
        '<p>' + info.body + '</p>' +
        (info.steps ? '<div class="steps">' + info.steps + '</div>' : '') +
        '<div class="acts">' +
          (info.showInstallButton
            ? '<button class="primary" id="sc-install-go">Install now</button>'
            : '') +
          '<button id="sc-install-later">Not now</button>' +
        '</div>' +
      '</div>' +
      '<button class="x" id="sc-install-x" title="Dismiss">×</button>';
    document.body.appendChild(el);

    function dismiss(){
      try { localStorage.setItem(STORAGE_KEY, '1'); } catch(e){}
      el.classList.add('gone');
      setTimeout(function(){ el.remove(); }, 350);
    }

    document.getElementById('sc-install-x').onclick = dismiss;
    document.getElementById('sc-install-later').onclick = dismiss;

    var go = document.getElementById('sc-install-go');
    if (go) go.onclick = async function(){
      if (!deferredPrompt) return dismiss();
      deferredPrompt.prompt();
      var result = await deferredPrompt.userChoice;
      deferredPrompt = null;
      if (result.outcome === 'accepted') dismiss();
      else dismiss();
    };
  }

  // Capture the native install prompt
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferredPrompt = e;
    // If the banner is already visible with a manual-steps message,
    // refresh it to show the Install button
    var existing = document.getElementById('sc-install');
    if (existing){
      existing.remove();
      try { localStorage.removeItem(STORAGE_KEY); } catch(e){}
    }
    // Show after a short delay so the page settles
    setTimeout(showInstallPrompt, 800);
  });

  // If the beforeinstallprompt never fires (Safari, Firefox, or already installed),
  // show the manual-instructions banner once after the page has been up for a bit.
  setTimeout(function(){
    if (isStandalone()) return;
    try { if (localStorage.getItem(STORAGE_KEY) === '1') return; } catch(e){}
    if (document.getElementById('sc-install')) return;
    showInstallPrompt();
  }, 8000);

  // Hide the banner if the user actually installs
  window.addEventListener('appinstalled', function(){
    try { localStorage.setItem(STORAGE_KEY, '1'); } catch(e){}
    var el = document.getElementById('sc-install');
    if (el) el.remove();
    log("app installed");
  });

  // ============================================================
  // PART 4 — APP-LIKE NAVIGATION
  // ============================================================
  // When running as an installed PWA, hide anything that suggests a
  // browser context and remember the last channel so a reopen lands
  // where you left off.

  function isAppMode(){
    return window.matchMedia('(display-mode: standalone)').matches ||
           window.matchMedia('(display-mode: minimal-ui)').matches ||
           window.navigator.standalone === true;
  }

  // Remember last location
  function rememberLocation(){
    try {
      if (window.CURRENT){
        var loc = { type: window.CURRENT.type, id: null };
        if (window.CURRENT.type === 'server' && window.CURRENT.channel){
          loc.serverId = window.CURRENT.server ? window.CURRENT.server.id : null;
          loc.id = window.CURRENT.channel.id;
        } else if (window.CURRENT.type === 'dm' && window.CURRENT.conv){
          loc.id = window.CURRENT.conv.id;
        }
        localStorage.setItem('sleepychat.lastLocation', JSON.stringify(loc));
      }
    } catch(e){}
  }
  setInterval(rememberLocation, 4000);

  // On boot, if in app mode, jump back
  function restoreLocation(){
    if (!isAppMode()) return;
    if (!window.ME) return;
    if (window.CURRENT && (window.CURRENT.channel || window.CURRENT.conv)) return; // already somewhere
    try {
      var raw = localStorage.getItem('sleepychat.lastLocation');
      if (!raw) return;
      var loc = JSON.parse(raw);
      if (!loc || !loc.type) return;
      if (loc.type === 'server' && loc.serverId && loc.id && window.goServer){
        window.goServer(loc.serverId).then(function(){
          if (window.goChannel) window.goChannel(loc.id);
        });
      } else if (loc.type === 'dm' && loc.id && window.goConversation){
        window.goConversation(loc.id);
      }
    } catch(e){}
  }
  setTimeout(restoreLocation, 1500);

  // In app mode, prevent links that would open a browser from taking over
  if (isAppMode()){
    document.addEventListener('click', function(e){
      var a = e.target.closest('a[target="_blank"]');
      if (a){
        // Let external links open externally, but prevent our own app URLs
        var href = a.getAttribute('href') || '';
        if (href.indexOf(location.origin) === 0){
          e.preventDefault();
          location.href = href;
        }
      }
    }, true);
  }

  log("voice polish + PWA ready");
})();
</script>

  function computeStatus(){

    ids.forEach(function(pid){
      var st = s.peers[pid].pc.connectionState;
      if (st === 'connected') connected++;
      else if (st === 'failed' || st === 'closed') failed++;
      else pending++;
    });
    if (connected > 0 && pending === 0 && failed === 0) return 'connected';
    if (connected > 0) return 'connected-partial';
    if (connected === 0 && failed === ids.length) return 'failed';
    if (s.__waitSince && Date.now() - s.__waitSince > 20000) return 'failed';
    return 'connecting';

  function rebuildDock(){
    if (!window.vs || !window.vs.channelId){

    var statusEl = dock.querySelector('.status');
    if (statusEl){
      var cls = status === 'connected-partial' ? 'connected-partial' : status;
      statusEl.className = 'status ' + cls;
      var label = {
        connecting: 'Connecting',
        connected: 'Connected',
        'connected-partial': 'Connected',
        failed: 'Connection failed',
        idle: 'Idle'
      }[status] || 'Idle';
      var ids = Object.keys(s.peers);
      var connected = ids.filter(function(pid){ return s.peers[pid].pc.connectionState === 'connected'; }).length;
      if (status === 'connected-partial') label += ' (' + connected + '/' + ids.length + ')';
      statusEl.innerHTML = '<i></i>' + label;
    }
    var countEl = dock.querySelector('.count');

        }
      });

  }, 3000);

  var STORAGE_KEY = 'sleepychat.install.dismissed.v2';

  function isStandalone(){
    return window.matchMedia('(display-mode: standalone)').matches ||

        steps: deferredPrompt ? 'Tap <b>Install</b> to add Sleepy-Chat to your home screen.'
                              : 'Open the browser menu, then tap <b>Install app</b> or <b>Add to Home screen</b>.',

    try { if (localStorage.getItem(STORAGE_KEY) === '1') return; } catch(e){}

  // ============================================================

           window.matchMedia('(display-mode: minimal-ui)').matches ||
           window.navigator.standalone === true;

        });
      } else if (loc.type === 'dm' && loc.id && window.goConversation){
        window.goConversation(loc.id);
      }
    } catch(e){}
  }, 1500);

  log("voice polish v2 ready");
})();

<script>
(function(){

  if (window.__sleepyInstantInstall) return;
  window.__sleepyInstantInstall = true;
  function log(){ try{console.log.apply(console,["[Install]"].concat([].slice.call(arguments)));}catch(e){} }

  // Chrome fires beforeinstallprompt when it decides install is allowed.
  // We capture it and hold it. The button consumes it.
  if (!window.__bipPrompt) window.__bipPrompt = null;
  var waitingForPrompt = false;

  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    window.__bipPrompt = e;
    log("install prompt captured");
    // If the user already clicked and we're waiting, auto-fire NOW
    if (waitingForPrompt){
      log("auto-firing prompt for waiting user");
      waitingForPrompt = false;
      firePrompt(true);
    }
    // Update the button look
    var b = document.getElementById('oc-install-btn');
    if (b){
      b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg><span>Install Now</span>';
    }
  });

  async function firePrompt(fromWait){
    if (!window.__bipPrompt){
      if (!fromWait) {
        // First attempt: try waiting 5 seconds for the event
        return waitThenFire();
      }
      return showManual();
    }
    var p = window.__bipPrompt;
    window.__bipPrompt = null;
    try {
      p.prompt();
      var choice = await p.userChoice;

      if (choice.outcome === 'accepted'){

        setTimeout(function(){
          var bb = document.getElementById('oc-install-btn');

      log("prompt failed:", e.message);
      return showManual();

  async function waitThenFire(){

      b.disabled = true;

    // Wait up to 5 seconds for the event to fire (it usually fires within 1s
    // once Chrome has decided the site is installable)
    var ok = await new Promise(function(resolve){
      var deadline = Date.now() + 5000;
      var check = setInterval(function(){
        if (window.__bipPrompt){ clearInterval(check); resolve(true); }
        else if (Date.now() > deadline){ clearInterval(check); resolve(false); }
      }, 150);
    });

    waitingForPrompt = false;
    if (b){
      b.disabled = false;
      if (!ok) b.innerHTML = originalHTML;
    }
    if (ok) return firePrompt(true);
    return showManual();
  }

  function showManual(){
    var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) && !window.MSStream;
    var isAndroid = /Android/i.test(navigator.userAgent);
    var steps;

        '<li>Tap <b>Add</b></li>' +
      '</ol>';
    } else if (isAndroid){
      steps = '<ol>' +
        '<li>Tap the <b>⋮</b> menu (top-right of Chrome)</li>' +
        '<li>Tap <b>Install app</b> or <b>Add to Home screen</b></li>' +
        '<li>Tap <b>Install</b></li>' +
      '</ol>';
    } else {
      steps = '<ol>' +
        '<li>Click the <b>⋮</b> menu (top-right of Chrome)</li>' +
        '<li>Click <b>Save and share</b></li>' +
        '<li>Click <b>Install page as app...</b></li>' +

        'Chrome will offer one-click install after you\'ve browsed the site a bit. ' +
        'This is a Chrome security rule — no website can skip it. The menu path always works instantly.' +
      '</div>';
    }
    window.openModal("Install Sleepy-Chat",
      '<div style="padding:12px 14px;background:rgba(0,0,0,.35);border-radius:8px;font-size:13px;color:var(--text2);line-height:1.75">' +
        steps +
      '</div>' +
      '<div style="margin-top:14px;display:flex;justify-content:flex-end">' +
        '<button class="btn" id="oc-manual-close">Got it</button>' +
      '</div>'
    );
    var c = document.getElementById('oc-manual-close');
    if (c) c.onclick = window.closeModal;
  }

  // Replace the button's click handler
  function wireButton(){
    var b = document.getElementById('oc-install-btn');
    if (!b || b.__instantWired) return;
    b.__instantWired = true;

<!-- SLEEPY_DM_DEDUPE_V1 -->
<script>
(function(){
  "use strict";
  if (window.__sleepyDmDedupe) return;
  window.__sleepyDmDedupe = true;
  function log(){ try{console.log.apply(console,["[Dedupe]"].concat([].slice.call(arguments)));}catch(e){} }

  // ============================================================
  // 1. LOCK MAP — one in-flight DM creation per other-user id
  // ============================================================
  window.__dmLocks = window.__dmLocks || {};

  // Replace openDMWith with a lock-aware version
  window.openDMWith = async function(otherUserId){
    if (!otherUserId) return;
    if (otherUserId === window.ME.id) return;

    // Same click again? Reuse the first in-flight operation.
    if (window.__dmLocks[otherUserId]){
      log("reusing in-flight DM for", otherUserId.slice(0,6));
      try {
        var conv = await window.__dmLocks[otherUserId];
        if (conv){
          window.UI.view = "dms";
          window.UI.conversationId = conv.id;
          window.UI.channelId = null;
          window.UI.communityId = null;
          window.renderAll();
        }
      } catch(e){ log("lock wait failed:", e.message); }
      return;
    }

    // Fast path: is this conversation already loaded locally?
    var localConv = (window.CONVERSATIONS || []).filter(function(c){
      return !c.is_group && c.memberIds.length === 2 &&
        c.memberIds.indexOf(window.ME.id) >= 0 &&
        c.memberIds.indexOf(otherUserId) >= 0;
    })[0];

    if (localConv){
      log("existing DM found locally:", localConv.id.slice(0,6));
      window.UI.view = "dms";
      window.UI.conversationId = localConv.id;
      window.UI.channelId = null;
      window.UI.communityId = null;
      window.renderAll();
      return;
    }

    // Slow path: hit the DB, guarded by a lock
    var lockPromise = (async function(){
      try {
        var conv = await window.getOrCreateDM(otherUserId);
        return conv;
      } catch(e){
        log("getOrCreateDM failed:", e.message);
        throw e;
      }
    })();
    window.__dmLocks[otherUserId] = lockPromise;

    try {
      var conv = await lockPromise;
      await window.loadConversations();
      window.UI.view = "dms";
      window.UI.conversationId = conv.id;
      window.UI.channelId = null;
      window.UI.communityId = null;
      window.renderAll();
    } finally {
      delete window.__dmLocks[otherUserId];
    }
  };

  // ============================================================
  // 2. Also patch getOrCreateDM itself in case it's called directly
  // ============================================================
  var origGetOrCreate = window.getOrCreateDM;
  if (typeof origGetOrCreate === "function"){
    window.getOrCreateDM = async function(otherUserId){
      // If a lock exists, chain onto it
      if (window.__dmLocks[otherUserId]) return window.__dmLocks[otherUserId];
      // Otherwise wrap our own
      var p = origGetOrCreate.call(this, otherUserId);
      window.__dmLocks[otherUserId] = p;
      try {
        return await p;
      } finally {
        delete window.__dmLocks[otherUserId];
      }
    };
  }

  // ============================================================
  // 3. BOT DM — ensure only one SleepyBot conversation
  // ============================================================
  var BOT_USERNAME = "sleepybot";
  var botLock = false;

  async function ensureSingleBotDM(){
    if (botLock) return;
    botLock = true;
    try {
      // Find the bot's profile
      var botResp = await sb.from("profiles").select("id").eq("username", BOT_USERNAME).maybeSingle();
      if (!botResp.data) { botLock = false; return; }
      var botId = botResp.data.id;
      if (botId === window.ME.id) { botLock = false; return; }

      // Find all my conversations with the bot
      var myResp = await sb.from("conversation_members").select("conversation_id").eq("user_id", window.ME.id);
      var myIds = (myResp.data || []).map(function(r){ return r.conversation_id; });
      if (!myIds.length) { botLock = false; return; }

      var theirResp = await sb.from("conversation_members")
        .select("conversation_id")
        .eq("user_id", botId)
        .in("conversation_id", myIds);
      var sharedIds = (theirResp.data || []).map(function(r){ return r.conversation_id; });

      // Filter to 1:1 (no other members)
      var botConvs = [];
      for (var i = 0; i < sharedIds.length; i++){
        var cid = sharedIds[i];
        var cResp = await sb.from("conversation_members").select("user_id").eq("conversation_id", cid);
        if ((cResp.data || []).length === 2) botConvs.push(cid);
      }

      if (botConvs.length <= 1) { botLock = false; return; }
      log("found", botConvs.length, "bot DMs — merging");

      // Keep the one with the most recent activity
      var keep = botConvs[0];
      var keepTs = 0;
      for (var j = 0; j < botConvs.length; j++){
        var mResp = await sb.from("messages").select("created_at").eq("conversation_id", botConvs[j]).order("created_at", { ascending: false }).limit(1);
        var ts = (mResp.data && mResp.data[0]) ? new Date(mResp.data[0].created_at).getTime() : 0;
        if (ts > keepTs){ keepTs = ts; keep = botConvs[j]; }
      }

      // Delete the others
      for (var k = 0; k < botConvs.length; k++){
        if (botConvs[k] !== keep){
          try { await sb.from("conversations").delete().eq("id", botConvs[k]); } catch(e){}
        }
      }
      log("bot DMs merged into", keep.slice(0,6));
    } catch(e){
      log("bot dedupe failed:", e.message);
    } finally {
      botLock = false;
    }
  }

  // ============================================================
  // 4. GLOBAL CLEANUP — remove duplicate 1:1 conversations
  // ============================================================
  async function dedupeAllDMs(){
    if (!window.ME || !window.CONVERSATIONS) return 0;
    // Group all my 1:1 conversations by sorted member-pair key
    var groups = {};
    (window.CONVERSATIONS || []).forEach(function(c){
      if (c.is_group) return;
      if (!c.memberIds || c.memberIds.length !== 2) return;
      var key = c.memberIds.slice().sort().join("|");
      if (!groups[key]) groups[key] = [];
      groups[key].push(c);
    });

    var toDelete = [];
    for (var key in groups){
      var list = groups[key];
      if (list.length <= 1) continue;
      // Keep the one with messages, else the oldest
      list.sort(function(a, b){
        var am = a.lastMessage ? 1 : 0;
        var bm = b.lastMessage ? 1 : 0;
        if (am !== bm) return bm - am;      // with-messages first
        return new Date(a.created_at) - new Date(b.created_at);
      });
      for (var i = 1; i < list.length; i++) toDelete.push(list[i]);
    }

    if (!toDelete.length) return 0;
    log("deduping", toDelete.length, "duplicate DM(s)");

    // Delete the duplicates from the server
    for (var j = 0; j < toDelete.length; j++){
      try {
        await sb.from("conversations").delete().eq("id", toDelete[j].id);
      } catch(e){ log("delete failed:", e.message); }
    }

    // Reload conversation list so the UI updates
    try { await window.loadConversations(); } catch(e){}
    try { window.renderPanel(); window.renderRail(); } catch(e){}

    return toDelete.length;
  }

  // ============================================================
  // 5. RUN CLEANUP once after boot
  // ============================================================
  var tries = 0;
  var cleanupTimer = setInterval(async function(){
    tries++;
    if (!window.ME || !window.CONVERSATIONS) return;
    if (!window.loadConversations) return;
    clearInterval(cleanupTimer);

    // Wait a beat so the app fully initialises
    setTimeout(async function(){
      try {
        await window.loadConversations();
        await ensureSingleBotDM();
        var removed = await dedupeAllDMs();
        if (removed > 0){
          try { window.toast("Cleaned up", "Removed " + removed + " duplicate conversation" + (removed === 1 ? "" : "s") + ".", "ok"); } catch(e){}
        }
      } catch(e){ log("cleanup error:", e.message); }
    }, 2500);
  }, 300);

  // ============================================================
  // 6. Also hook into the "Message" button clicks in the friends list
  // ============================================================
  document.addEventListener("click", function(e){
    var btn = e.target.closest("[data-fr-dm]");
    if (!btn) return;
    // Disable the button visually for 1s so rapid clicks don't stack
    if (btn.disabled) return;
    btn.disabled = true;
    setTimeout(function(){ btn.disabled = false; }, 1000);
  }, true);

  log("DM dedupe ready");
})();
</script>
