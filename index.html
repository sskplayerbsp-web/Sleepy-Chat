<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Chatter's Paradise — Built By Gen-Z For Gen-Z</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3CradialGradient id='g'%3E%3Cstop offset='0%25' stop-color='%2300ffe0'/%3E%3Cstop offset='100%25' stop-color='%23b44aff'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='42' fill='url(%23g)'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--void:#0a0a0f;--surface:#12121a;--surface2:#1a1a26;--surface3:#22222f;--border:#2a2a3a;--border2:#3a3a4d;--accent:#00ffe0;--accent2:#00c9b4;--purple:#b44aff;--rose:#ff2d6f;--green:#00e676;--amber:#ffab00;--gold:#ffd700;--text:#e8e8f0;--text2:#8f8fa8;--text3:#5a5a72;--glow:0 0 14px rgba(0,255,224,.35);--ease:cubic-bezier(.22,.61,.36,1)}
[data-theme="purple"]{--accent:#b44aff;--accent2:#8a2dd6;--glow:0 0 14px rgba(180,74,255,.4)}
[data-theme="pink"]{--accent:#ff2d6f;--accent2:#d6005a;--glow:0 0 14px rgba(255,45,111,.4)}
[data-theme="green"]{--accent:#00e676;--accent2:#00b85c;--glow:0 0 14px rgba(0,230,118,.4)}
[data-theme="orange"]{--accent:#ff9500;--accent2:#d67a00;--glow:0 0 14px rgba(255,149,0,.4)}
[data-theme="blue"]{--accent:#3d8bff;--accent2:#2266d6;--glow:0 0 14px rgba(61,139,255,.4)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',system-ui,sans-serif;font-size:14px;background:var(--void);color:var(--text);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(900px 600px at 12% -10%,rgba(0,255,224,.06),transparent 60%),radial-gradient(900px 700px at 95% 110%,rgba(180,74,255,.07),transparent 60%)}
button,input,textarea,select{font:inherit;color:inherit;outline:none;border:none;background:none}
button{cursor:pointer;touch-action:manipulation}
a{color:var(--accent);text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#2c2c3d;border-radius:99px}
.hidden{display:none!important}
h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:8px;font-weight:600;font-size:13px;background:var(--surface2);color:var(--text);border:1px solid var(--border);transition:all .18s var(--ease);white-space:nowrap}
.btn:hover{background:var(--surface3);border-color:var(--border2);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04120f;border-color:transparent;font-weight:700}
.btn.danger{background:rgba(255,45,111,.12);color:#ff7aa2;border-color:rgba(255,45,111,.35)}
.btn.sm{padding:6px 11px;font-size:12px}.btn.block{width:100%}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3)}
.field input,.field textarea,.field select{width:100%;padding:11px 13px;border-radius:8px;background:var(--void);border:1px solid var(--border);color:var(--text);font-size:14px}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,255,224,.12)}
.field .hint{font-size:11px;color:var(--text3)}
.err,.ok{font-size:12.5px;border-radius:8px;min-height:0;margin-top:12px}
.err:not(:empty){padding:10px 13px;background:rgba(255,45,111,.12);border:1px solid rgba(255,45,111,.35);color:#ff8aa8}
.ok:not(:empty){padding:10px 13px;background:rgba(0,230,118,.1);border:1px solid rgba(0,230,118,.3);color:#8affb8}
.avatar{border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;color:#06120f;overflow:hidden;position:relative;user-select:none}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.status-dot{width:11px;height:11px;border-radius:50%;border:2.5px solid var(--surface);position:absolute;right:-1px;bottom:-1px}
.s-online{background:var(--green);box-shadow:0 0 8px rgba(0,230,118,.7)}.s-idle{background:var(--amber)}.s-dnd{background:var(--rose)}.s-offline{background:#4a4a5e}
.role-tag{display:inline-block;font-size:8.5px;padding:1px 6px;border-radius:99px;text-transform:uppercase;font-weight:800;letter-spacing:.06em;margin-left:5px;vertical-align:middle}
.role-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;flex:none}
.auth-screen{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;overflow-y:auto;background:radial-gradient(700px 500px at 20% 10%,rgba(0,255,224,.1),transparent 60%),radial-gradient(700px 500px at 85% 90%,rgba(180,74,255,.13),transparent 60%),var(--void)}
.floating-orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.4;pointer-events:none;z-index:0;animation:orbFloat 18s ease-in-out infinite}
.floating-orb.o1{width:320px;height:320px;background:var(--accent);top:-80px;left:-80px}
.floating-orb.o2{width:400px;height:400px;background:var(--purple);bottom:-120px;right:-100px;animation-delay:-6s}
.floating-orb.o3{width:220px;height:220px;background:var(--rose);top:40%;right:-60px;animation-delay:-12s;opacity:.25}
@keyframes orbFloat{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(40px,-30px) scale(1.08)}66%{transform:translate(-30px,40px) scale(.95)}}
.auth-card{position:relative;z-index:1;width:100%;max-width:460px;background:rgba(18,18,26,.92);backdrop-filter:blur(24px);border:1px solid var(--border);border-radius:24px;padding:34px 28px;box-shadow:0 30px 90px rgba(0,0,0,.7)}
.brand{text-align:center;margin-bottom:22px}
.brand-mark{width:76px;height:76px;margin:0 auto 14px;border-radius:24px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(0,255,224,.16),rgba(180,74,255,.16));border:1px solid rgba(0,255,224,.3)}
.brand-mark svg{width:44px;height:44px}
.brand h1{font-size:28px;letter-spacing:.02em;font-weight:800;line-height:1.15}
.brand h1 span{color:var(--accent);text-shadow:0 0 24px rgba(0,255,224,.7);display:block;font-size:20px;letter-spacing:.35em;margin-top:2px}
.tagline{display:flex;flex-wrap:wrap;justify-content:center;gap:1px;font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;margin-top:12px;line-height:1.6}
.tagline .tchar{display:inline-block;background:linear-gradient(135deg,#00ffe0,#b44aff,#ff2d6f,#00ffe0,#b44aff);background-size:400% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline .tspace{display:inline-block;width:6px}
.saved-accounts{margin-bottom:20px;padding-bottom:18px;border-bottom:1px solid var(--border)}
.sa-label{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.sa-label::after{content:'';flex:1;height:1px;background:var(--border)}
.sa-list{display:flex;flex-direction:column;gap:6px}
.sa-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--surface2);border:1px solid var(--border);text-align:left;width:100%}
.sa-item:hover{background:var(--surface3);border-color:var(--accent)}
.sa-item .sa-info{flex:1;min-width:0}
.sa-item .sa-name{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sa-item .sa-user{font-size:11px;color:var(--text3)}
.sa-item .sa-del{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:16px;flex:none}
.sa-switch{text-align:center;margin-top:12px;font-size:12px;color:var(--text3)}
.sa-switch button{color:var(--accent);font-weight:600;padding:4px 8px;border-radius:6px}
.tabs{display:flex;gap:4px;background:var(--void);padding:4px;border-radius:10px;margin-bottom:20px;border:1px solid var(--border)}
.tab{flex:1;padding:10px;border-radius:7px;font-size:13px;font-weight:600;color:var(--text3)}
.tab.active{background:var(--surface2);color:var(--accent);box-shadow:inset 0 0 0 1px rgba(0,255,224,.22)}
.divider{display:flex;align-items:center;gap:12px;color:var(--text3);font-size:10.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;margin:16px 0}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.app{position:relative;z-index:1;display:grid;grid-template-columns:74px 260px 1fr 240px;height:100vh;height:100dvh}
.app>*{min-height:0;min-width:0}
.rail{background:linear-gradient(180deg,#0c0c13,#0a0a0f);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0;overflow-y:auto;overflow-x:hidden}
.rail-sep{width:34px;height:1px;background:var(--border);flex:none;margin:3px 0}
.rail-btn{position:relative;width:48px;height:48px;flex:none;border-radius:16px;display:flex;align-items:center;justify-content:center;background:var(--surface);color:var(--accent);overflow:hidden;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px}
.rail-btn.active{border-radius:14px;box-shadow:var(--glow)}
.rail-btn img{width:100%;height:100%;object-fit:cover}
.rail-btn svg{width:22px;height:22px}
.rail-btn.dashed{background:transparent;border:1.5px dashed rgba(0,255,224,.35)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--rose);color:#fff;font-size:10px;font-weight:700}
.panel{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column}
.panel-head{height:50px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 14px;border-bottom:1px solid var(--border);font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;gap:6px}
.panel-head .ttl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.panel-head .hbtn{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text3);flex:none}
.panel-head .hbtn svg{width:15px;height:15px}
.panel-body{flex:1;min-height:0;overflow-y:auto;padding:10px 8px 14px}
.panel-section{margin-bottom:14px}
.panel-label{padding:6px 8px;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);display:flex;align-items:center;gap:6px}
.panel-label .add{margin-left:auto;width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--text3);cursor:pointer}
.row{position:relative;display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:8px;cursor:pointer;color:var(--text2);font-size:13.5px;font-weight:500;width:100%;text-align:left}
.row:hover{background:rgba(255,255,255,.045);color:var(--text)}
.row.active{background:var(--surface2);color:#fff}
.row .txt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:4px}
.row svg{width:16px;height:16px;flex:none;opacity:.75}
.row.app-row{background:linear-gradient(135deg,rgba(0,255,224,.05),rgba(180,74,255,.05));border:1px solid var(--border)}
.row.app-row:hover{background:linear-gradient(135deg,rgba(0,255,224,.12),rgba(180,74,255,.12));border-color:var(--accent)}
.user-bar{flex:none;height:62px;display:flex;align-items:center;gap:9px;padding:0 10px;background:rgba(10,10,15,.55);border-top:1px solid var(--border)}
.user-bar .info{flex:1;min-width:0;cursor:pointer;border-radius:6px;padding:3px 5px}
.user-bar .nm{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-bar .uid{font-size:10.5px;color:var(--text3)}
.user-bar .ctl{width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--text2)}
.user-bar .ctl svg{width:16px;height:16px}
.chat{display:flex;flex-direction:column;background:var(--void);position:relative}
.chat-head{height:50px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--border);background:rgba(10,10,15,.7);backdrop-filter:blur(12px)}
.chat-head .title{display:flex;align-items:center;gap:8px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;min-width:0}
.chat-head .title svg{width:18px;height:18px;flex:none;opacity:.75}
.chat-head .title .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-head .spacer{flex:1}
.chat-head .hbtn{width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--text2)}
.chat-head .hbtn svg{width:17px;height:17px}
.chat-body{flex:1;min-height:0;overflow-y:auto;padding:16px 0 8px}
.empty{padding:40px 20px;text-align:center;color:var(--text3);font-size:13px}
.empty .big{width:64px;height:64px;margin:0 auto 12px;border-radius:20px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(0,255,224,.14),rgba(180,74,255,.14));border:1px solid rgba(0,255,224,.22)}
.empty .big svg{width:30px;height:30px;color:var(--accent)}
.empty h2{font-size:20px;color:var(--text);margin-bottom:6px;font-family:'Space Grotesk'}
.home-view{padding:32px 20px;max-width:720px;margin:0 auto}
.home-title{font-family:'Space Grotesk';font-size:26px;font-weight:800;margin-bottom:6px}
.home-sub{color:var(--text3);font-size:13px;margin-bottom:24px}
.home-apps{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:24px}
@media(min-width:600px){.home-apps{grid-template-columns:repeat(4,1fr)}}
.home-app{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:18px 12px;text-align:center;cursor:pointer;transition:all .15s}
.home-app:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--glow)}
.home-app .ha-emoji{font-size:32px;display:block;margin-bottom:8px}
.home-app .ha-name{font-weight:700;font-size:13px}
.home-servers h3{font-size:14px;margin-bottom:10px;color:var(--text2)}
.home-server{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;cursor:pointer;margin-bottom:8px;width:100%;text-align:left;color:var(--text)}
.home-server:hover{border-color:var(--accent)}
.home-server .hs-name{font-weight:700;font-size:13px;flex:1}
.home-server .hs-count{font-size:11px;color:var(--text3)}
.msg{position:relative;display:flex;gap:13px;padding:4px 20px}
.msg.pinged{background:rgba(255,171,0,.06);border-left:3px solid var(--amber);padding-left:17px}
.msg .body{flex:1;min-width:0}
.msg .head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.msg .author{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center}
.msg .time{font-size:10.5px;color:var(--text3);font-family:ui-monospace,monospace}
.msg .edited{font-size:10px;color:var(--text3)}
.msg .ping-flag{font-size:9px;color:var(--amber);font-weight:800;text-transform:uppercase;letter-spacing:.05em;background:rgba(255,171,0,.15);padding:1px 6px;border-radius:99px}
.msg .content{font-size:14px;color:#dcdce8;word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap;margin-top:1px}
.msg .content .mention{background:rgba(0,255,224,.18);color:var(--accent);padding:1px 5px;border-radius:4px;font-weight:600}
.msg .content .mention.mine{background:rgba(255,171,0,.25);color:var(--amber)}
.msg.deleted .content{color:var(--text3);font-style:italic}
.msg .toolbar{position:absolute;top:-12px;right:22px;display:none;align-items:center;gap:1px;background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:2px;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:5}
.msg:hover .toolbar{display:flex}
.msg.tools-open .toolbar{display:flex}
.msg .toolbar button{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text2)}
.msg .toolbar button.danger:hover{background:rgba(255,45,111,.15);color:#ff7aa2}
.msg .toolbar svg{width:15px;height:15px}
.day-sep{display:flex;align-items:center;gap:12px;padding:14px 20px 8px;color:var(--text3);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.day-sep::before,.day-sep::after{content:'';flex:1;height:1px;background:var(--border)}
.typing-bar{flex:none;height:22px;padding:0 20px;font-size:12px;color:var(--text3);display:flex;align-items:center;gap:7px}
.composer-wrap{flex:none;padding:0 20px 18px;position:relative}
.composer{display:flex;align-items:flex-end;gap:6px;padding:9px 11px;background:var(--surface2);border:1px solid var(--border);border-radius:12px}
.composer.locked{opacity:.6}
.composer textarea{flex:1;resize:none;max-height:190px;min-height:22px;font-size:16px;line-height:1.5;padding:3px 0;background:none;color:var(--text)}
.composer .cbtn{width:34px;height:34px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--text3);flex:none;font-size:17px}
.composer .cbtn svg{width:17px;height:17px}
.composer .send{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04120f;border-radius:8px;width:34px;height:34px}
.emoji-picker{position:absolute;bottom:74px;right:12px;width:320px;max-height:260px;overflow-y:auto;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:8px;display:grid;grid-template-columns:repeat(8,1fr);gap:2px;box-shadow:0 20px 50px rgba(0,0,0,.7);z-index:10}
.emoji-picker button{width:100%;aspect-ratio:1;border-radius:6px;font-size:20px;display:flex;align-items:center;justify-content:center;line-height:1}
.members{background:var(--surface);border-left:1px solid var(--border);overflow-y:auto;padding:14px 10px}
.mgroup{margin-bottom:18px}
.mgroup .glabel{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);padding:0 8px 7px}
.member{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;cursor:pointer}
.member:hover{background:rgba(255,255,255,.05)}
.member.offline{opacity:.5}
.member .nm{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center}
.member .uid{font-size:11px;color:var(--text3)}
.overlay{position:fixed;inset:0;z-index:300;background:rgba(4,4,8,.75);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.modal{width:100%;max-width:520px;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:0 30px 90px rgba(0,0,0,.7);max-height:88vh;display:flex;flex-direction:column}
.modal.wide{max-width:720px}
.modal-head{flex:none;display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:17px}
.modal-body{padding:22px;overflow-y:auto;flex:1}
.modal-foot{flex:none;display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--border);background:rgba(0,0,0,.15)}
.xbtn{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text3)}
.xbtn svg{width:18px;height:18px}
#toasts{position:fixed;top:20px;right:20px;z-index:500;display:flex;flex-direction:column;gap:9px;pointer-events:none;max-width:340px}
.toast{pointer-events:auto;min-width:230px;max-width:340px;padding:12px 15px;background:rgba(26,26,38,.97);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:10px;font-size:13px;box-shadow:0 14px 40px rgba(0,0,0,.6)}
.toast.err{border-left-color:var(--rose)}.toast.ok{border-left-color:var(--green)}.toast.ping{border-left-color:var(--amber);border-left-width:4px}

/* ============ AUTH ============ */
function saveLocalUser(u){if(!u||!u.id)return;saveLS('cp_user_'+u.id,u);}
function loadLocalUser(id){return loadLS('cp_user_'+id,null);}

async function loadSupabaseProfile(user){
  var p=null;
  if(sb){
    var tries=['profiles','users'];
    for(var i=0;i<tries.length;i++){
      try{var r=await sb.from(tries[i]).select('*').eq('id',user.id).maybeSingle();if(r&&r.data){p=r.data;break;}}catch(e){}
    }
  }
  var meta=user.user_metadata||{};
  return {
    id:user.id,
    username:p&&p.username||meta.username||('user_'+String(user.id).slice(0,6)),
    display_name:p&&p.display_name||meta.display_name||(p&&p.username)||meta.username||(user.email?user.email.split('@')[0]:'User'),
    avatar_url:p&&p.avatar_url||meta.avatar_url||'',
    banner_url:p&&p.banner_url||'',
    bio:p&&p.bio||'',
    status:p&&p.status||'online'
  };
}

async function trySupabaseLogin(email,password){
  if(!sb)return null;
  try{
    var r=await sb.auth.signInWithPassword({email:email,password:password});
    if(r.error)return {error:r.error.message};
    if(!r.data||!r.data.user)return {error:'no-user'};
    return {user:r.data.user,session:r.data.session};
  }catch(e){
    return {error:e.message||String(e)};
  }
}

async function doLogin(email,password){
  email=String(email||'').trim().toLowerCase();
  password=String(password||'');
  if(!email||!password)throw new Error('Email and password required.');

  /* 1. Supabase first — this is where ORIGINAL accounts live */
  if(sb){
    var r=await trySupabaseLogin(email,password);
    if(r&&r.user){
      var prof=await loadSupabaseProfile(r.user);
      PROFILES[prof.id]=prof;
      SESSION={user_id:r.user.id,email:r.user.email,user:r.user,access_token:r.session&&r.session.access_token,supabase:true};
      saveLS('cp_session',SESSION);
      saveLocalUser(prof);
      ME=prof;IS_GUEST=false;
      rememberAccount(email);
      return prof;
    }
  }

  /* 2. Local fallback — cp_local_users */
  var users=loadLS('cp_local_users',{});
  var rec=users[email];
  if(rec){
    if(rec.password!==password)throw new Error('Incorrect password.');
    var prof2=loadLocalUser(rec.id)||{id:rec.id,username:rec.username,display_name:rec.display_name,avatar_url:'',status:'online',bio:''};
    PROFILES[prof2.id]=prof2;
    SESSION={user_id:prof2.id,email:email,local:true};
    saveLS('cp_session',SESSION);
    saveLocalUser(prof2);
    ME=prof2;IS_GUEST=false;
    rememberAccount(email);
    return prof2;
  }

  /* 3. Last resort — is this a saved account whose profile we still have? */
  var saved=loadLS('cp_accounts',[]).find(function(a){return (a.email||'').toLowerCase()===email;});
  if(saved&&saved.id){
    var p3=loadLocalUser(saved.id);
    if(p3){
      PROFILES[p3.id]=p3;
      SESSION={user_id:p3.id,email:email,local:true};
      saveLS('cp_session',SESSION);
      ME=p3;IS_GUEST=false;
      rememberAccount(email);
      return p3;
    }
  }

  throw new Error('We could not verify this account. If you created it before, sign in on the same device you originally used, or with the exact email + password you signed up with.');
}

async function doSignup(email,password,username,display){
  email=String(email||'').trim().toLowerCase();
  username=String(username||'').trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))throw new Error('Enter a valid email.');
  if(!/^[a-z0-9_]{3,24}$/.test(username))throw new Error('Username must be 3-24 chars: a-z, 0-9, underscore.');
  if(String(password).length<6)throw new Error('Password must be at least 6 characters.');

  if(sb){
    try{
      var r=await sb.auth.signUp({email:email,password:password,options:{data:{username:username,display_name:display||username}}});
      if(!r.error&&r.data&&r.data.user){
        var prof={id:r.data.user.id,username:username,display_name:display||username,avatar_url:'',status:'online',bio:''};
        PROFILES[prof.id]=prof;
        try{await sb.from('profiles').upsert({id:prof.id,username:username,display_name:prof.display_name});}catch(e){}
        SESSION={user_id:r.data.user.id,email:r.data.user.email,user:r.data.user,access_token:r.data.session&&r.data.session.access_token,supabase:true};
        saveLS('cp_session',SESSION);
        saveLocalUser(prof);
        ME=prof;IS_GUEST=false;
        rememberAccount(email);
        return prof;
      }
      if(r.error&&/already registered|already exists/i.test(r.error.message))throw new Error('That email is already registered — sign in instead.');
    }catch(e){if(/already/i.test(e.message))throw e;}
  }

  var users=loadLS('cp_local_users',{});
  if(Object.keys(users).some(function(k){return users[k].username===username;}))throw new Error('That username is taken.');
  var id='u_'+uid();
  var prof2={id:id,username:username,display_name:display||username,avatar_url:'',status:'online',bio:''};
  users[email]={id:id,username:username,display_name:prof2.display_name,password:password,created:Date.now()};
  saveLS('cp_local_users',users);
  saveLocalUser(prof2);
  PROFILES[id]=prof2;
  SESSION={user_id:id,email:email,local:true};
  saveLS('cp_session',SESSION);
  ME=prof2;IS_GUEST=false;
  rememberAccount(email);
  return prof2;
}

function doGuest(){
  var id='g_'+uid();
  var prof={id:id,username:'guest_'+shortId(id),display_name:'Guest',avatar_url:'',status:'online',bio:''};
  PROFILES[id]=prof;saveLocalUser(prof);
  SESSION={user_id:id,email:'',local:true,guest:true};
  ME=prof;IS_GUEST=true;
  saveLS('cp_session',SESSION);
  return prof;
}

function rememberAccount(email){
  if(!ME)return;
  var list=loadLS('cp_accounts',[]).filter(function(a){return a.id!==ME.id;});
  list.unshift({id:ME.id,email:email||(SESSION&&(SESSION.email||(SESSION.user&&SESSION.user.email)))||'',username:ME.username,display_name:ME.display_name,avatar_url:ME.avatar_url||'',ts:Date.now()});
  saveLS('cp_accounts',list.slice(0,10));
}

function renderSavedAccounts(){
  var slot=$('#saved-accounts-slot');if(!slot)return;
  /* combine all sources */
  var orig=loadLS('cp_accounts',[]);
  var local=loadLS('cp_local_users',{});
  var seen={},list=[];
  orig.forEach(function(a){
    if(a&&a.id&&!seen[a.id]){
      seen[a.id]=1;
      list.push({id:a.id,email:(a.email||'').toLowerCase(),username:a.username,display_name:a.display_name,avatar_url:a.avatar_url||''});
    }
  });
  Object.keys(local).forEach(function(email){
    var u=local[email];if(!u||!u.id||seen[u.id])return;
    seen[u.id]=1;
    list.push({id:u.id,email:email,username:u.username,display_name:u.display_name,avatar_url:''});
  });
  if(!list.length){slot.innerHTML='';return;}
  slot.innerHTML='<div class="saved-accounts"><div class="sa-label">Saved accounts — tap to sign in</div><div class="sa-list">'+
    list.slice(0,8).map(function(a){
      PROFILES[a.id]=PROFILES[a.id]||{id:a.id,username:a.username,display_name:a.display_name,avatar_url:a.avatar_url};
      return '<button class="sa-item" data-sa-id="'+esc(a.id)+'" data-sa-email="'+esc(a.email||'')+'" type="button">'+
        avatarHTML(a.id,36)+
        '<div class="sa-info"><div class="sa-name">'+esc(a.display_name||a.username||'Unknown')+'</div>'+
        '<div class="sa-user">@'+esc(a.username||'')+' · '+esc(a.email||'')+'</div></div>'+
        '<span class="sa-del" data-sa-remove="'+esc(a.id)+'" title="Remove">×</span></button>';
    }).join('')+
    '</div><div class="sa-switch">or <button type="button" id="sa-new">sign in with another account</button></div></div>';
  $$('[data-sa-id]').forEach(function(b){
    b.onclick=function(e){
      if(e.target.closest('[data-sa-remove]'))return;
      if(b.dataset.saEmail)$('#li-email').value=b.dataset.saEmail;
      $('#li-pass').value='';$('#li-pass').focus();
      switchAuthTab('login');
    };
  });
  $$('[data-sa-remove]').forEach(function(b){
    b.onclick=function(e){
      e.stopPropagation();
      var id=b.dataset.saRemove;
      saveLS('cp_accounts',loadLS('cp_accounts',[]).filter(function(a){return a.id!==id;}));
      renderSavedAccounts();
    };
  });
  var nb=$('#sa-new');if(nb)nb.onclick=function(){$('#li-email').value='';$('#li-pass').value='';$('#li-email').focus();};
}

  $('#form-signup').classList.toggle('hidden',tab!=='signup');

  $$('.tab').forEach(function(t){t.onclick=function(){switchAuthTab(t.dataset.tab);};});
  $('#form-login').onsubmit=async function(e){
    e.preventDefault();
    var btn=$('#li-submit');btn.disabled=true;btn.textContent='Signing in…';

    e.preventDefault();

  };

async function boot(){
  Store.load();
  $('#auth-screen').classList.remove('hidden');
  renderSavedAccounts();   /* ALWAYS render first — old accounts visible */

  if(sb){
    try{
      var r=await sb.auth.getSession();
      if(r&&r.data&&r.data.session&&r.data.session.user){
        var u=r.data.session.user;
        var prof=await loadSupabaseProfile(u);
        PROFILES[prof.id]=prof;
        ME=prof;
        SESSION={user_id:u.id,email:u.email,user:u,access_token:r.data.session.access_token,supabase:true};
        saveLS('cp_session',SESSION);
        saveLocalUser(prof);
        IS_GUEST=false;
        return enterApp();
      }
    }catch(e){}
  }

  var saved=loadLS('cp_session',null);
  if(saved&&saved.user_id){
    var p=loadLocalUser(saved.user_id);
    if(p){ME=p;PROFILES[p.id]=p;SESSION=saved;IS_GUEST=!!saved.guest;return enterApp();}
  }

  wireAuthUI();
  var code=inviteCodeFromUrl();
  if(code)toast('Invite detected','Sign in to join the server','ok');
}

function ensureOfficialServer(){
  if(!ME)return;
  var srv=SERVERS.find(function(s){return s.id===OFFICIAL_SERVER_ID;});
  if(!srv){
    SERVERS.push({id:OFFICIAL_SERVER_ID,name:"Chatter's Paradise Official",icon:'',owner_id:'system',created:Date.now(),official:true});
    getServerRoles(OFFICIAL_SERVER_ID);
  }
  if(!CHANNELS.find(function(c){return c.id==='c_official_general';})){CHANNELS.push({id:'c_official_general',server_id:OFFICIAL_SERVER_ID,name:'general',type:'text',topic:'Welcome to Paradise 👋 Say hi!',position:0});}
  if(!CHANNELS.find(function(c){return c.id==='c_official_random';})){CHANNELS.push({id:'c_official_random',server_id:OFFICIAL_SERVER_ID,name:'random',type:'text',topic:'Anything goes 🎲',position:1});}
  if(!CHANNELS.find(function(c){return c.id==='c_official_voice';})){CHANNELS.push({id:'c_official_voice',server_id:OFFICIAL_SERVER_ID,name:'Voice Lounge',type:'voice',topic:'',position:2});}
  if(!MEMBERS[OFFICIAL_SERVER_ID])MEMBERS[OFFICIAL_SERVER_ID]={};
  if(!MEMBERS[OFFICIAL_SERVER_ID][ME.id])MEMBERS[OFFICIAL_SERVER_ID][ME.id]={perms:{dm:true,games:true,voice:true},joinedAt:Date.now(),autoJoined:true};
  Store.saveServers();Store.saveChannels();Store.saveMembers();
}

function enterApp(){
  $('#auth-screen').classList.add('hidden');
  $('#app').classList.remove('hidden');
  loadWallet();loadShop();
  ensureOfficialServer();
  ONLINE[ME.id]=Date.now();
  rtStart();
  wireAppUI();
  /* land on official #general */
  var off=SERVERS.find(function(s){return s.id===OFFICIAL_SERVER_ID;});
  var ch=CHANNELS.find(function(c){return c.server_id===OFFICIAL_SERVER_ID&&c.type==='text';});
  if(off&&ch)CURRENT={type:'server',server:off,channel:ch,conv:null};
  renderAll();
  heartbeat();
  handleInviteFromUrl();
}

function heartbeat(){
  setInterval(function(){
    if(!ME)return;
    ONLINE[ME.id]=Date.now();
    rtSend('presence',{uid:ME.id,ts:Date.now()});
    if(CURRENT.type==='server')renderMembers();
  },30000);
}

/* ============ REALTIME ============ */
async function sbUpsert(t,row){if(!sb||!SESSION)return;try{await sb.from(t).upsert(row);}catch(e){}}
function rtStart(){
  if(BC)BC.onmessage=function(ev){onBus(ev.data&&ev.data.event,ev.data&&ev.data.payload);};
  if(sb&&SESSION&&SESSION.access_token){
    try{
      RT=sb.channel('cp_rt_'+SESSION.user_id,{config:{broadcast:{self:false}}});
      RT.on('broadcast',{event:'msg'},function(p){onBus('msg',p.payload);});
      RT.on('broadcast',{event:'presence'},function(p){onBus('presence',p.payload);});
      RT.subscribe();
    }catch(e){}
  }
}
function rtSend(event,payload){
  var msg={event:event,payload:payload};
  if(BC)try{BC.postMessage(msg);}catch(e){}
  if(RT)try{RT.send({type:'broadcast',event:event,payload:payload});}catch(e){}
}
function onBus(event,payload){
  if(!payload)return;
  if(event==='msg')applyRemoteMessage(payload);
  else if(event==='presence'){ONLINE[payload.uid]=payload.ts;if(CURRENT.type==='server')renderMembers();}
}
function applyRemoteMessage(m){
  if(!m||!m.channel_id)return;
  var arr=Store.getMsgs(m.channel_id);
  if(!arr.some(function(x){return x.id===m.id;})){
    arr.push(m);Store.saveMsgs(m.channel_id,arr);
    if(currentChannelId()===m.channel_id){renderChatBody();if(m.author_id!==ME.id)sfxRecv();}
    else{UNREAD[m.channel_id]=(UNREAD[m.channel_id]||0)+1;renderPanel();renderRail();}
  }
}

function wireAppUI(){
  $('#backdrop').onclick=closeDrawers;
  window.addEventListener('resize',function(){if(window.innerWidth>1050)closeDrawers();});
  document.addEventListener('keydown',function(e){
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openQuickSwitch();}
    if(e.key==='Escape'){closeDrawers();closeModal();}
  });
  document.addEventListener('click',function(e){
    if(window.innerWidth>760)return;
    var t=e.target;if(!t||!t.closest)return;
    if(t.closest('.msg .toolbar')||t.closest('a')||t.closest('button'))return;
    var msg=t.closest('.msg');if(!msg)return;
    var open=msg.classList.contains('tools-open');
    $$('.msg.tools-open').forEach(function(m){m.classList.remove('tools-open');});
    if(!open)msg.classList.add('tools-open');
  },false);
}
function closeDrawers(){$('#panel').classList.remove('open');$('#members').classList.remove('open');$('#backdrop').classList.add('hidden');}
function toggleDrawer(which){
  var p=$('#panel'),m=$('#members'),b=$('#backdrop');
  var isOpen=which==='panel'?p.classList.contains('open'):m.classList.contains('open');
  closeDrawers();
  if(!isOpen){if(which==='panel')p.classList.add('open');else m.classList.add('open');b.classList.remove('hidden');}
}

function renderMessageHTML(m){

  var content=m.deleted?'<span style="color:var(--text3);font-style:italic">message deleted</span>':highlightMentions(esc(m.content||''));

  var reacts='';
  if(m.reactions&&Object.keys(m.reactions).length){
    reacts='<div class="react-bar">'+Object.keys(m.reactions).map(function(e){
      var arr=m.reactions[e]||[];
      return '<span class="react-chip '+(arr.indexOf(ME.id)>=0?'mine':'')+'" data-react="'+esc(e)+'" data-mid="'+esc(m.id)+'">'+e+' '+arr.length+'</span>';
    }).join('')+'</div>';

  return '<div class="msg '+(pinged?'pinged':'')+' '+(m.deleted?'deleted':'')+'" data-mid="'+esc(m.id)+'">'+

      '<div class="head"><span class="author" data-author="'+esc(m.author_id)+'" style="'+(m.author_id===ME.id?nameStyle():'')+'">'+esc(userLabel(m.author_id))+'</span>'+

      replyHtml+'<div class="content">'+content+'</div>'+reacts+
    '</div><div class="toolbar">'+
      '<button data-tool="react">'+SVG.smile+'</button><button data-tool="reply">'+SVG.reply+'</button>'+
      (isMine&&!m.deleted?'<button data-tool="edit">'+SVG.pencil+'</button>':'')+
      (canDelete&&!m.deleted?'<button class="danger" data-tool="delete">'+SVG.trash+'</button>':'')+

function wireMessages(root){
  $$('[data-author]',root).forEach(function(a){a.onclick=function(){openProfile(a.dataset.author);};});
  $$('.msg',root).forEach(function(el){
    var mid=el.dataset.mid;
    $$('[data-tool]',el).forEach(function(b){
      b.onclick=function(e){
        e.stopPropagation();var t=b.dataset.tool;
        if(t==='react')openReactionPicker(mid);
        if(t==='reply')setReply(mid);
        if(t==='edit')editMessage(mid);
        if(t==='delete')deleteMessage(mid);
      };
    });
    $$('[data-react]',el).forEach(function(c){c.onclick=function(){toggleReaction(mid,c.dataset.react);};});
  });
}

var EMOJIS=['😀','😂','🥹','😍','🤩','😎','🤔','😴','😭','😡','🥳','🤯','👍','👎','👏','🙏','💪','🔥','✨','💯','❤️','💔','🎉','🎮','⚡','🌈','🍕','🍦','☕','🚀','🌟','👑','💎','🎵','🎧','📌','✅','❌','⚠️','🫡'];

function renderComposer(){
  var wrap=$('#composer-wrap');if(!wrap)return;
  if(CURRENT.type==='home'){wrap.innerHTML='';return;}
  var canSend=true;
  if(CURRENT.type==='server'&&CURRENT.server&&CURRENT.channel)canSend=hasServerPerm(CURRENT.server.id,ME.id,PERMS.SEND_MESSAGES)&&canViewChannel(CURRENT.server.id,CURRENT.channel.id,ME.id);
  if(!canSend){wrap.innerHTML='<div class="composer locked"><div style="flex:1;padding:8px;color:var(--text3);font-size:13px">You do not have permission to send messages here.</div></div>';return;}
  wrap.innerHTML=(replyTo?'<div style="font-size:11.5px;color:var(--text3);padding:0 4px 6px">Replying to <b style="color:var(--text2)">'+esc(replyTo.name)+'</b> · <button id="cancel-reply" style="color:var(--rose);font-weight:700">cancel</button></div>':'')+
    '<div class="composer"><button class="cbtn" id="emoji-btn">'+SVG.smile+'</button>'+
    '<textarea id="msg-input" rows="1" placeholder="Message '+(CURRENT.channel?'#'+esc(CURRENT.channel.name):'')+'"></textarea>'+
    '<button class="cbtn send" id="send-btn">'+SVG.send+'</button></div>';
  var ta=$('#msg-input');
  ta.addEventListener('input',function(){ta.style.height='auto';ta.style.height=Math.min(190,ta.scrollHeight)+'px';});
  ta.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}});
  $('#send-btn').onclick=sendMessage;
  $('#emoji-btn').onclick=function(e){e.stopPropagation();openEmojiPicker();};
  var cr=$('#cancel-reply');if(cr)cr.onclick=function(){replyTo=null;renderComposer();};
  ta.focus();
}

function openEmojiPicker(){
  var existing=$('.emoji-picker');if(existing){existing.remove();return;}
  var p=document.createElement('div');p.className='emoji-picker';
  p.innerHTML=EMOJIS.map(function(e){return '<button type="button">'+e+'</button>';}).join('');
  p.onclick=function(e){if(e.target.tagName==='BUTTON'){var ta=$('#msg-input');if(ta){ta.value+=e.target.textContent;ta.focus();}p.remove();}};
  $('#composer-wrap').appendChild(p);
  setTimeout(function(){document.addEventListener('click',function h(){var pp=$('.emoji-picker');if(pp)pp.remove();document.removeEventListener('click',h);});},50);
}

function setReply(mid){var m=MESSAGES.find(function(x){return x.id===mid;});if(!m)return;replyTo={id:mid,name:userLabel(m.author_id)};renderComposer();var ta=$('#msg-input');if(ta)ta.focus();}

function sendMessage(){
  var ta=$('#msg-input');if(!ta)return;
  var text=ta.value.trim();if(!text)return;
  var cid=currentChannelId();if(!cid)return;
  var m={id:'m_'+uid(),channel_id:cid,author_id:ME.id,content:text,created:Date.now(),edited:false,deleted:false,reply_to:replyTo?replyTo.id:null,reactions:{}};
  var arr=Store.getMsgs(cid);arr.push(m);Store.saveMsgs(cid,arr);
  MESSAGES=arr;replyTo=null;
  ta.value='';ta.style.height='auto';
  renderChatBody();renderComposer();sfxSend();
  rtSend('msg',m);
  sbUpsert('cp_messages',{id:m.id,channel_id:cid,author_id:ME.id,content:text,created_at:new Date(m.created).toISOString()});
}

function editMessage(mid){
  var m=MESSAGES.find(function(x){return x.id===mid;});if(!m)return;
  openModal('Edit message','<div class="field"><label>Message</label><textarea id="edit-ta" style="min-height:100px">'+esc(m.content)+'</textarea></div>',{
    footer:'<button class="btn" id="ed-c">Cancel</button><button class="btn primary" id="ed-s">Save</button>',
    onMount:function(){$('#ed-c').onclick=closeModal;$('#ed-s').onclick=function(){m.content=$('#edit-ta').value;m.edited=true;Store.saveMsgs(m.channel_id,Store.getMsgs(m.channel_id).map(function(x){return x.id===m.id?m:x;}));closeModal();renderChatBody();};}
  });
}
function deleteMessage(mid){
  var m=MESSAGES.find(function(x){return x.id===mid;});if(!m)return;
  confirmModal('Delete message','This cannot be undone.',function(){m.deleted=true;m.content='';Store.saveMsgs(m.channel_id,Store.getMsgs(m.channel_id).map(function(x){return x.id===m.id?m:x;}));renderChatBody();},true);
}
function openReactionPicker(mid){
  openModal('Add reaction','<div style="display:grid;grid-template-columns:repeat(8,1fr);gap:4px">'+EMOJIS.map(function(e){return '<button class="btn" data-emo="'+esc(e)+'" style="font-size:20px;padding:6px;min-height:42px">'+e+'</button>';}).join('')+'</div>',{
    onMount:function(){$$('[data-emo]').forEach(function(b){b.onclick=function(){closeModal();toggleReaction(mid,b.dataset.emo);};});}
  });
}
function toggleReaction(mid,emoji){
  var m=MESSAGES.find(function(x){return x.id===mid;});if(!m)return;
  m.reactions=m.reactions||{};var arr=m.reactions[emoji]||[];
  var idx=arr.indexOf(ME.id);if(idx>=0)arr.splice(idx,1);else arr.push(ME.id);
  if(arr.length)m.reactions[emoji]=arr;else delete m.reactions[emoji];
  Store.saveMsgs(m.channel_id,Store.getMsgs(m.channel_id).map(function(x){return x.id===m.id?m:x;}));
  renderChatBody();
}

function renderMembers(){
  var box=$('#members');if(!box)return;
  if(CURRENT.type!=='server'||!CURRENT.server){box.innerHTML='';return;}

  var html='<div class="mgroup"><div class="glabel">Online — '+online.length+'</div>';

    html+='<div class="member" data-mem="'+esc(u)+'">'+avatarHTML(u,32)+statusDot(u)+
      '<div style="min-width:0"><div class="nm" style="'+(u===ME.id?nameStyle():'')+'">'+esc(userLabel(u))+roleTagHTML(sid,u)+'</div>'+
      '<div class="uid">@'+esc((PROFILES[u]&&PROFILES[u].username)||shortId(u))+'</div></div></div>';
  });

function goHome(){CURRENT={type:'home',server:null,channel:null,conv:null};closeDrawers();renderAll();}
function openServer(sid){
  var srv=SERVERS.find(function(s){return s.id===sid;});if(!srv)return;
  var chans=CHANNELS.filter(function(c){return c.server_id===sid&&c.type==='text'&&canViewChannel(sid,c.id,ME.id);});
  CURRENT={type:'server',server:srv,channel:chans[0]||null,conv:null};
  if(chans[0])UNREAD[chans[0].id]=0;
  closeDrawers();renderAll();
}
function openChannel(cid){
  var c=CHANNELS.find(function(x){return x.id===cid;});if(!c)return;
  var srv=SERVERS.find(function(s){return s.id===c.server_id;});
  CURRENT={type:'server',server:srv,channel:c,conv:null};UNREAD[cid]=0;closeDrawers();renderAll();
}
function openDm(did){var d=DMS.find(function(x){return x.id===did;});if(!d)return;CURRENT={type:'dm',server:null,channel:null,conv:d};closeDrawers();renderAll();}

function inviteUrl(code){return location.origin+location.pathname+'#invite='+code;}
function inviteCodeFromUrl(){var m=(location.hash||'').match(/invite=([A-Za-z0-9]+)/);if(m)return m[1];try{var p=new URLSearchParams(location.search);if(p.get('invite'))return p.get('invite');}catch(e){}return null;}
function clearInviteFromUrl(){try{history.replaceState(null,'',location.origin+location.pathname);}catch(e){}}

function redeemInvite(code){
  var inv=INVITES[code];
  if(!inv){toast('Invalid','','err');return;}
  if(inv.expires&&Date.now()>inv.expires){toast('Expired','','err');return;}
  if(inv.maxUses&&inv.uses>=inv.maxUses){toast('Maxed out','','err');return;}
  var srv=SERVERS.find(function(s){return s.id===inv.serverId;});
  if(!srv){srv={id:inv.serverId,name:'Invited Server',icon:'',owner_id:inv.inviterId,created:Date.now()};SERVERS.push(srv);CHANNELS.push({id:'c_'+uid(),server_id:srv.id,name:'general',type:'text',topic:'',position:0});Store.saveServers();Store.saveChannels();}
  if((MEMBERS[srv.id]||{})[ME.id]){toast('Already joined','','ok');openServer(srv.id);return;}
  MEMBERS[srv.id]=MEMBERS[srv.id]||{};
  MEMBERS[srv.id][ME.id]={perms:Object.assign({},inv.perms),joinedAt:Date.now(),viaInvite:code};
  inv.uses=(inv.uses||0)+1;
  Store.saveMembers();Store.saveInvites();
  toast('Joined!','Welcome to '+srv.name,'ok');
  openServer(srv.id);
}
function handleInviteFromUrl(){
  var code=inviteCodeFromUrl();if(!code)return;

  if(!INVITES[code]){toast('Invite','Not valid on this device','err');return;}

  );
}

  }
  openModal(title,html,{
    footer:'<button class="btn primary block" id="gm-start">▶ Play</button>',
    onMount:function(){

      var initD=diff?$$('[data-diff]').find(function(x){return x.dataset.diff===diff;}):null;if(initD)initD.classList.add('sel');

function startGame(id){
  if(id==='ttt')return gameMenu('❌⭕ Tic-Tac-Toe',{modes:['ai','friend'],diffs:true},function(mode,diff){playTTT(mode,diff);});
  if(id==='rps')return gameMenu('✊✋✌️ Rock Paper Scissors',{modes:['ai','friend'],diffs:true},function(mode,diff){playRPS(mode,diff);});
  if(id==='guess')return gameMenu('🔢 Number Guess',{modes:['ai','friend']},function(mode){playGuess(mode);});
  if(id==='trivia')return gameMenu('🧩 Trivia',{modes:['solo','ai'],diffs:true},function(mode,diff){playTrivia(mode,diff);});
  if(id==='memory')return gameMenu('🧠 Memory Match',{modes:['solo','friend']},function(mode){playMemory(mode);});
  if(id==='hangman')return gameMenu('🔤 Hangman',{modes:['solo','friend']},function(mode){playHangman(mode);});
  if(id==='typing')return gameMenu('⌨️ Typing Race',{modes:['solo','ai'],diffs:true},function(mode,diff){playTyping(mode,diff);});
  if(id==='reaction')return gameMenu('⚡ Reaction',{modes:['solo','ai'],diffs:true},function(mode,diff){playReaction(mode,diff);});
  if(id==='whack')return playWhack();
  if(id==='snake')return playSnake();
  if(id==='bet')return openBetSetup();
}

var TT_WINS=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function ttWinner(b){for(var i=0;i<TT_WINS.length;i++){var L=TT_WINS[i];if(b[L[0]]&&b[L[0]]===b[L[1]]&&b[L[0]]===b[L[2]])return b[L[0]];}return b.indexOf('')<0?'draw':null;}
function ttMinimax(b,me,turn,depth){
  var w=ttWinner(b);if(w==='draw')return{score:0};if(w)return{score:w===me?10-depth:depth-10};
  var best={score:turn===me?-Infinity:Infinity,move:null};
  for(var i=0;i<9;i++){if(b[i])continue;b[i]=turn;var r=ttMinimax(b,me,turn==='X'?'O':'X',depth+1);b[i]='';if(turn===me?r.score>best.score:r.score<best.score)best={score:r.score,move:i};}
  return best;
}
function playTTT(mode,diff){
  var state={board:Array(9).fill(''),turn:'X',over:false},isAI=mode==='ai';
  openModal('❌⭕ '+(isAI?'VS AI':'VS Friend'),
    '<div class="game-head"><div class="game-score" id="ttt-st">'+(isAI?'Your turn':'X\'s turn')+'</div></div>'+
    '<div class="ttt-grid">'+Array(9).fill(0).map(function(_,i){return '<div class="ttt-cell" data-i="'+i+'"></div>';}).join('')+'</div>',
    {onMount:function(){
      function paint(){$$('.ttt-cell').forEach(function(c,i){c.textContent=state.board[i];});var w=ttWinner(state.board);if(w){state.over=true;$('#ttt-st').textContent=w==='draw'?'Draw!':(w==='X'?'X wins!':'O wins!');}else $('#ttt-st').textContent=isAI?(state.turn==='X'?'Your turn':'Bot thinking…'):state.turn+'’s turn';}
      function aiMove(){
        if(state.over)return;var b=state.board.slice();
        var emp=b.map(function(v,i){return v?null:i;}).filter(function(x){return x!==null;});
        if(!emp.length)return;var move;
        if(diff==='easy')move=emp[Math.floor(Math.random()*emp.length)];
        else if(diff==='normal')move=Math.random()<0.65?ttMinimax(b,'O','O',0).move:emp[Math.floor(Math.random()*emp.length)];
        else move=ttMinimax(b,'O','O',0).move;
        state.board[move]='O';state.turn='X';paint();
      }
      $$('.ttt-cell').forEach(function(c){c.onclick=function(){var i=+c.dataset.i;if(state.over||state.board[i])return;if(isAI&&state.turn!=='X')return;state.board[i]=state.turn;state.turn=state.turn==='X'?'O':'X';paint();if(isAI&&!state.over)setTimeout(aiMove,300);};});

function cpExtractId(u){if(!u)return '';u=String(u).trim();if(/^[\w-]{11}$/.test(u))return u;var m=u.match(/(?:v=|\/embed\/|youtu\.be\/|\/shorts\/|\/v\/|\/live\/)([\w-]{11})/);return m?m[1]:'';}

var cpYt=null,cpYtWait=null;
function cpYtWith(fn){if(window.YT&&window.YT.Player)return fn();if(cpYtWait&&cpYtWait._t)return;cpYtWait=fn;cpYtWait._t=setInterval(function(){if(window.YT&&window.YT.Player){clearInterval(cpYtWait._t);var f=cpYtWait;cpYtWait=null;f();}},250);}
function ensureYtHost(){
  var host=document.getElementById('cp-yt-host');
  if(!host){host=document.createElement('div');host.id='cp-yt-host';host.className='mp-hidden';host.innerHTML='<div id="cp-yt-player"></div>';document.body.appendChild(host);}
  return host;
}
function cpPauseAppPlayer(){try{var p=YT.get&&YT.get('yt-player');if(p&&p.pauseVideo)p.pauseVideo();}catch(e){}}

/* Play a specific video by ID */
function cpYtPlayVideo(id,label){
  cpYtWith(function(){
    ensureYtHost();
    try{
      if(!cpYt){cpYt=new YT.Player('cp-yt-player',{height:'180',width:'320',videoId:id,playerVars:{autoplay:1,controls:0,playsinline:1}});}
      else{cpYt.loadVideoById(id);cpYt.playVideo();}
      cpPauseAppPlayer();
      toast('🎧 Playing',label||'','ok');
    }catch(e){cpOpenGoogle(label||id);}
  });
}

/* Play by SEARCH — uses YouTube's listType=search (no redirect) */
function cpYtPlaySearch(query,label){
  cpYtWith(function(){
    ensureYtHost();
    try{
      if(!cpYt){
        cpYt=new YT.Player('cp-yt-player',{
          height:'180',width:'320',
          playerVars:{autoplay:1,controls:0,playsinline:1,listType:'search',list:query},
          events:{onError:function(e){cpOpenGoogle(query);}}
        });
      } else {
        try{cpYt.loadPlaylist({list:query,listType:'search',index:0,startSeconds:0});}
        catch(e){cpOpenGoogle(query);return;}
      }
      cpPauseAppPlayer();
      toast('🎧 Playing',label||'','ok');
    }catch(e){cpOpenGoogle(query);}
  });
}

document.addEventListener('click',function(e){
  var t=e.target;if(!t||!t.closest)return;
  var lk=t.closest('[data-cp-hlink]');
  if(lk){
    e.preventDefault();e.stopPropagation();
    var i=+lk.getAttribute('data-cp-hlink');
    var v=window.prompt('Paste YouTube link or 11-char ID for:\n'+CP_HINDI[i].t,cpStoredId(i)||'');
    if(v===null)return;
    var id=cpExtractId(v);if(!id){toast('Invalid','No video ID','err');return;}
    cpSaveId(i,id);
    var box=document.getElementById('mp-tracks');
    if(box){var s=box.querySelector('[data-cp-hindi]');if(s)s.remove();}
    paintHindiTracks();toast('Saved','Plays in-page now','ok');return;
  }
  var h=t.closest('[data-cp-h]');
  if(h){
    e.preventDefault();e.stopPropagation();
    var idx=+h.getAttribute('data-cp-h'),sid=cpStoredId(idx);
    if(sid)cpYtPlayVideo(sid,CP_HINDI[idx].t);
    else cpYtPlaySearch(CP_HINDI[idx].q,CP_HINDI[idx].t);   /* in-page via search */
    return;
  }
  var g=t.closest('[data-cp-g]');
  if(g){
    e.preventDefault();e.stopPropagation();
    var gi=+g.getAttribute('data-cp-g');
    cpYtPlayVideo(CP_GLOBAL[gi].id,CP_GLOBAL[gi].t);return;
  }
},true);
function wireMusicUI(){
  var ball=$('#mp-ball'),panel=$('#mp-panel');if(!ball)return;

  $('#mp-close').onclick=function(){panel.classList.add('hidden');};
  $('#mp-play').innerHTML=SVG.play;$('#mp-prev').innerHTML=SVG.prev;$('#mp-next').innerHTML=SVG.next;
  $('#mp-play').onclick=function(){
    var icon=$('#mp-play');
    if(icon.innerHTML.indexOf('M6 4')>=0){icon.innerHTML=SVG.play;ball.classList.remove('playing');}
    else{icon.innerHTML=SVG.pause;ball.classList.add('playing');}
    try{var p=YT.get&&YT.get('yt-player');if(p){icon.innerHTML.indexOf('M6 4')>=0?p.pauseVideo():p.playVideo();}}catch(e){}
