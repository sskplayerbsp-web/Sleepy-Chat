<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Quazi Chat — Built By Gen-Z For Gen-Z</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3CradialGradient id='g'%3E%3Cstop offset='0%25' stop-color='%2300ffe0'/%3E%3Cstop offset='100%25' stop-color='%23b44aff'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='42' fill='url(%23g)'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--void:#0a0a0f;--surface:#12121a;--surface2:#1a1a26;--surface3:#22222f;--border:#2a2a3a;--border2:#3a3a4d;--accent:#00ffe0;--accent2:#00c9b4;--purple:#b44aff;--rose:#ff2d6f;--green:#00e676;--amber:#ffab00;--gold:#ffd700;--text:#e8e8f0;--text2:#8f8fa8;--text3:#5a5a72;--glow:0 0 14px rgba(0,255,224,.35);--ease:cubic-bezier(.22,.61,.36,1)}
[data-theme="purple"]{--accent:#b44aff;--accent2:#8a2dd6;--glow:0 0 14px rgba(180,74,255,.4)}
[data-theme="pink"]{--accent:#ff2d6f;--accent2:#d6005a;--glow:0 0 14px rgba(255,45,111,.4)}
[data-theme="green"]{--accent:#00e676;--accent2:#00b85c;--glow:0 0 14px rgba(0,230,118,.4)}
[data-theme="orange"]{--accent:#ff9500;--accent2:#d67a00;--glow:0 0 14px rgba(255,149,0,.4)}
[data-theme="blue"]{--accent:#3d8bff;--accent2:#2266d6;--glow:0 0 14px rgba(61,139,255,.4)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',system-ui,sans-serif;font-size:14px;background:var(--void);color:var(--text);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(900px 600px at 12% -10%,rgba(0,255,224,.06),transparent 60%),radial-gradient(900px 700px at 95% 110%,rgba(180,74,255,.07),transparent 60%)}
button,input,textarea,select{font:inherit;color:inherit;outline:none;border:none;background:none}
button{cursor:pointer;touch-action:manipulation}
a{color:var(--accent);text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#2c2c3d;border-radius:99px}::-webkit-scrollbar-thumb:hover{background:#40405a}
.hidden{display:none!important}
h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:8px;font-weight:600;font-size:13px;background:var(--surface2);color:var(--text);border:1px solid var(--border);transition:all .18s var(--ease);white-space:nowrap}
.btn:hover{background:var(--surface3);border-color:var(--border2);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04120f;border-color:transparent;font-weight:700}
.btn.primary:hover{box-shadow:var(--glow)}
.btn.danger{background:rgba(255,45,111,.12);color:#ff7aa2;border-color:rgba(255,45,111,.35)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text2)}
.btn.ghost:hover{background:var(--surface2);color:var(--text)}
.btn.sm{padding:6px 11px;font-size:12px}.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3)}
.field input,.field textarea,.field select{width:100%;padding:11px 13px;border-radius:8px;background:var(--void);border:1px solid var(--border);color:var(--text);transition:border-color .18s,box-shadow .18s}
.field textarea{resize:vertical;min-height:70px}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,255,224,.12)}
.field .hint{font-size:11px;color:var(--text3)}.field .hint.ok{color:var(--green)}.field .hint.err{color:var(--rose)}
.err,.ok{font-size:12.5px;border-radius:8px;transition:all .2s;min-height:0}
.err:not(:empty){padding:10px 13px;background:rgba(255,45,111,.12);border:1px solid rgba(255,45,111,.35);color:#ff8aa8;font-weight:500;margin-top:12px}
.ok:not(:empty){padding:10px 13px;background:rgba(0,230,118,.1);border:1px solid rgba(0,230,118,.3);color:#8affb8;font-weight:500;margin-top:12px}
.avatar{border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;color:#06120f;overflow:hidden;position:relative;user-select:none}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.status-dot{width:11px;height:11px;border-radius:50%;border:2.5px solid var(--surface);position:absolute;right:-1px;bottom:-1px}
.s-online{background:var(--green);box-shadow:0 0 8px rgba(0,230,118,.7)}
.s-idle{background:var(--amber)}.s-dnd{background:var(--rose)}.s-offline{background:#4a4a5e}
.pill-owner{background:rgba(255,171,0,.15);color:var(--amber);font-size:9px;padding:1px 6px;border-radius:99px;text-transform:uppercase;font-weight:700;letter-spacing:.05em;margin-left:5px}
.guest-badge{font-size:9px;padding:1px 6px;border-radius:99px;background:rgba(255,171,0,.15);color:var(--amber);text-transform:uppercase;font-weight:700;letter-spacing:.05em;margin-left:5px;vertical-align:middle}
.auth-screen{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;overflow-y:auto;background:radial-gradient(700px 500px at 20% 10%,rgba(0,255,224,.1),transparent 60%),radial-gradient(700px 500px at 85% 90%,rgba(180,74,255,.13),transparent 60%),var(--void)}
.stars{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.stars::before,.stars::after{content:'';position:absolute;inset:0;background-image:radial-gradient(1.5px 1.5px at 10% 20%,rgba(255,255,255,.8),transparent),radial-gradient(1px 1px at 30% 60%,rgba(0,255,224,.6),transparent),radial-gradient(1.5px 1.5px at 50% 30%,rgba(255,255,255,.7),transparent);animation:starTwinkle 4s ease-in-out infinite alternate}
.stars::after{animation-delay:-2s}
@keyframes starTwinkle{0%{opacity:.35}100%{opacity:1}}
.auth-card{position:relative;z-index:1;width:100%;max-width:440px;background:rgba(18,18,26,.92);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:20px;padding:36px 30px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.brand{text-align:center;margin-bottom:26px}
.brand-mark{width:76px;height:76px;margin:0 auto 16px;border-radius:24px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(0,255,224,.16),rgba(180,74,255,.16));border:1px solid rgba(0,255,224,.3);animation:markPulse 3s ease-in-out infinite}
.brand-mark svg{width:44px;height:44px}
@keyframes markPulse{0%,100%{box-shadow:0 0 20px rgba(0,255,224,.35)}50%{box-shadow:0 0 40px rgba(0,255,224,.6),0 0 70px rgba(180,74,255,.45)}}
.brand h1{font-size:30px;letter-spacing:.05em;font-weight:800}
.brand h1 span{color:var(--accent);text-shadow:0 0 22px rgba(0,255,224,.6)}
.tagline{display:flex;flex-wrap:wrap;justify-content:center;gap:1px;font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;margin-top:14px;line-height:1.6}
.tagline .tchar{display:inline-block;background:linear-gradient(135deg,#00ffe0,#b44aff,#ff2d6f,#00ffe0,#b44aff);background-size:400% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:charPop .7s cubic-bezier(.34,1.56,.64,1) both,gradientShift 4s linear infinite;animation-delay:calc(var(--i) * 35ms),0s}
.tagline .tspace{display:inline-block;width:7px}
@keyframes charPop{0%{opacity:0;transform:translateY(16px) scale(.3) rotate(-15deg)}60%{opacity:1;transform:translateY(-3px) scale(1.18) rotate(3deg)}100%{opacity:1;transform:none}}
@keyframes gradientShift{0%{background-position:0% 50%}100%{background-position:400% 50%}}
.tabs{display:flex;gap:4px;background:var(--void);padding:4px;border-radius:10px;margin-bottom:22px;border:1px solid var(--border)}
.tab{flex:1;padding:10px;border-radius:7px;font-size:13px;font-weight:600;color:var(--text3);transition:all .2s}
.tab.active{background:var(--surface2);color:var(--accent);box-shadow:inset 0 0 0 1px rgba(0,255,224,.22)}
.divider{display:flex;align-items:center;gap:12px;color:var(--text3);font-size:10.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;margin:18px 0}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.google-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px;border-radius:8px;background:#fff;color:#1f1f1f;font-weight:600;font-size:13.5px;border:1px solid #ddd;transition:all .18s}
.google-btn:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(255,255,255,.15)}
.google-btn svg{width:18px;height:18px}
.app{position:relative;z-index:1;display:grid;grid-template-columns:74px 260px 1fr 240px;height:100vh;height:100dvh}
.app.hide-members{grid-template-columns:74px 260px 1fr}
.app>*{min-height:0;min-width:0}
.rail{background:linear-gradient(180deg,#0c0c13,#0a0a0f);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0;overflow-y:auto;overflow-x:hidden}
.rail-sep{width:34px;height:1px;background:var(--border);flex:none;margin:3px 0}
.rail-btn{position:relative;width:48px;height:48px;flex:none;border-radius:16px;display:flex;align-items:center;justify-content:center;background:var(--surface);color:var(--accent);transition:all .22s var(--ease);overflow:hidden;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px}
.rail-btn:hover{border-radius:14px;box-shadow:var(--glow);transform:translateY(-2px)}
.rail-btn.active{border-radius:14px;box-shadow:var(--glow)}
.rail-btn.active::before{content:'';position:absolute;left:-10px;top:50%;transform:translateY(-50%);width:4px;height:26px;border-radius:0 4px 4px 0;background:var(--accent);box-shadow:var(--glow)}
.rail-btn img{width:100%;height:100%;object-fit:cover}
.rail-btn svg{width:22px;height:22px}
.rail-btn.dashed{background:transparent;border:1.5px dashed rgba(0,255,224,.35)}
.rail-btn.dashed:hover{border-style:solid;background:rgba(0,255,224,.1)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--rose);color:#fff;font-size:10px;font-weight:700}
.panel{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column}
.panel-head{height:50px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--border);font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px}
.panel-head .ttl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel-body{flex:1;min-height:0;overflow-y:auto;padding:10px 8px 14px}
.panel-section{margin-bottom:16px}
.panel-label{padding:6px 8px;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);display:flex;align-items:center;gap:6px}
.panel-label .add{margin-left:auto;opacity:.6;transition:opacity .15s;cursor:pointer;width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--text3)}
.panel-label .add:hover{opacity:1;background:rgba(255,255,255,.07);color:var(--accent)}
.row{position:relative;display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:8px;cursor:pointer;color:var(--text2);font-size:13.5px;font-weight:500;transition:background .14s,color .14s;width:100%;text-align:left}
.row:hover{background:rgba(255,255,255,.045);color:var(--text)}
.row.active{background:var(--surface2);color:#fff}
.row.active::before{content:'';position:absolute;left:-8px;top:50%;transform:translateY(-50%);width:3px;height:60%;border-radius:0 3px 3px 0;background:var(--accent);box-shadow:var(--glow)}
.row .txt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{font-size:11px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.row svg{width:16px;height:16px;flex:none;opacity:.75}
.user-bar{flex:none;height:60px;display:flex;align-items:center;gap:9px;padding:0 10px;background:rgba(10,10,15,.55);border-top:1px solid var(--border)}
.user-bar .info{flex:1;min-width:0;cursor:pointer;border-radius:6px;padding:3px 5px;transition:background .15s}
.user-bar .info:hover{background:rgba(255,255,255,.05)}
.user-bar .nm{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-bar .uid{font-size:10.5px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-bar .ctl{width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:all .15s}
.user-bar .ctl:hover{background:rgba(255,255,255,.07);color:var(--accent)}
.user-bar .ctl svg{width:16px;height:16px}
.chat{display:flex;flex-direction:column;background:var(--void);position:relative}
.chat-head{height:50px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--border);background:rgba(10,10,15,.7);backdrop-filter:blur(12px)}
.chat-head .title{display:flex;align-items:center;gap:8px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;min-width:0}
.chat-head .title svg{width:18px;height:18px;flex:none;opacity:.75}
.chat-head .title .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-head .topic{font-size:12px;color:var(--text3);border-left:1px solid var(--border);padding-left:10px;margin-left:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-head .spacer{flex:1}
.chat-head .hbtn{width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:all .15s}
.chat-head .hbtn:hover{background:var(--surface2);color:var(--accent)}
.chat-head .hbtn svg{width:17px;height:17px}
.chat-body{flex:1;min-height:0;overflow-y:auto;padding:16px 0 8px}
.empty{padding:40px 20px;text-align:center;color:var(--text3);font-size:13px}
.empty .big{width:64px;height:64px;margin:0 auto 12px;border-radius:20px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(0,255,224,.14),rgba(180,74,255,.14));border:1px solid rgba(0,255,224,.22)}
.empty .big svg{width:30px;height:30px;color:var(--accent)}
.empty h2{font-size:20px;color:var(--text);margin-bottom:6px;font-family:'Space Grotesk'}
.msg{position:relative;display:flex;gap:13px;padding:4px 20px;transition:background .12s}
.msg:hover{background:rgba(255,255,255,.022)}
.msg .body{flex:1;min-width:0}
.msg .head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.msg .author{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;cursor:pointer}
.msg .author:hover{text-decoration:underline}
.msg .uid{font-size:10.5px;color:var(--text3);background:rgba(0,255,224,.07);padding:1px 6px;border-radius:5px;font-family:ui-monospace,monospace}
.msg .time{font-size:10.5px;color:var(--text3);font-family:ui-monospace,monospace}
.msg .edited{font-size:10px;color:var(--text3)}
.msg .content{font-size:14px;color:#dcdce8;word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap;margin-top:1px}
.msg.deleted .content{color:var(--text3);font-style:italic}
.msg .toolbar{position:absolute;top:-12px;right:22px;display:none;align-items:center;gap:1px;background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:2px;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:5}
.msg:hover .toolbar{display:flex}
.msg .toolbar button{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:all .13s}
.msg .toolbar button:hover{background:rgba(0,255,224,.12);color:var(--accent)}
.msg .toolbar button.danger:hover{background:rgba(255,45,111,.15);color:#ff7aa2}
.msg .toolbar svg{width:15px;height:15px}
.day-sep{display:flex;align-items:center;gap:12px;padding:14px 20px 8px;color:var(--text3);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.day-sep::before,.day-sep::after{content:'';flex:1;height:1px;background:var(--border)}
.typing-bar{flex:none;height:22px;padding:0 20px;font-size:12px;color:var(--text3);display:flex;align-items:center;gap:7px}
.dots{display:inline-flex;gap:3px}
.dots i{width:4px;height:4px;border-radius:50%;background:var(--accent);display:block;animation:tdot 1.3s infinite}
.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}
@keyframes tdot{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-3px);opacity:1}}
.composer-wrap{flex:none;padding:0 20px 18px;position:relative}
.composer{display:flex;align-items:flex-end;gap:6px;padding:9px 11px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;transition:border-color .2s,box-shadow .2s}
.composer:focus-within{border-color:rgba(0,255,224,.4);box-shadow:0 0 0 3px rgba(0,255,224,.07)}
.composer textarea{flex:1;resize:none;max-height:190px;min-height:22px;font-size:16px;line-height:1.5;padding:3px 0;background:none}
.composer textarea::placeholder{color:var(--text3)}
.composer .cbtn{width:34px;height:34px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--text3);transition:all .15s;flex:none;font-size:17px}
.composer .cbtn:hover{background:rgba(255,255,255,.07);color:var(--accent)}
.composer .cbtn svg{width:17px;height:17px}
.composer .send{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04120f;border-radius:8px;width:34px;height:34px}
.composer .send:hover{box-shadow:var(--glow);color:#04120f}
.emoji-picker{position:absolute;bottom:74px;right:12px;width:320px;max-height:260px;overflow-y:auto;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:8px;display:grid;grid-template-columns:repeat(8,1fr);gap:2px;box-shadow:0 20px 50px rgba(0,0,0,.7);z-index:10}
.emoji-picker button{width:100%;aspect-ratio:1;border-radius:6px;font-size:20px;display:flex;align-items:center;justify-content:center;transition:all .1s;line-height:1}
.emoji-picker button:hover{background:var(--surface3);transform:scale(1.12)}
.members{background:var(--surface);border-left:1px solid var(--border);overflow-y:auto;padding:14px 10px}
.app.hide-members .members{display:none}
.mgroup{margin-bottom:18px}
.mgroup .glabel{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);padding:0 8px 7px}
.member{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;cursor:pointer;transition:background .14s}
.member:hover{background:rgba(255,255,255,.05)}
.member.offline{opacity:.5}
.member .nm{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.member .uid{font-size:11px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.overlay{position:fixed;inset:0;z-index:300;background:rgba(4,4,8,.75);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.modal{width:100%;max-width:520px;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:0 30px 90px rgba(0,0,0,.7);max-height:88vh;display:flex;flex-direction:column;animation:mIn .26s var(--ease) both}
.modal.wide{max-width:680px}
@keyframes mIn{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}
.modal-head{flex:none;display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:17px}
.modal-body{padding:22px;overflow-y:auto;flex:1}
.modal-foot{flex:none;display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--border);background:rgba(0,0,0,.15)}
.xbtn{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text3);transition:all .15s}
.xbtn:hover{background:var(--surface2);color:var(--text)}
.xbtn svg{width:18px;height:18px}
#toasts{position:fixed;top:20px;right:20px;z-index:500;display:flex;flex-direction:column;gap:9px;pointer-events:none}
.toast{pointer-events:auto;min-width:230px;max-width:340px;padding:12px 15px;background:rgba(26,26,38,.97);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:10px;font-size:13px;box-shadow:0 14px 40px rgba(0,0,0,.6);animation:tInTop .3s var(--ease) both;backdrop-filter:blur(12px)}
@keyframes tInTop{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
.toast.err{border-left-color:var(--rose)}.toast.ok{border-left-color:var(--green)}
.toast .tt{font-weight:700;font-size:12.5px;margin-bottom:2px}
.toast .tb{color:var(--text2);font-size:12.5px}
.mobile-only{display:none}

/* ============ MUSIC PLAYER (draggable, clamped) ============ */
.music-player{position:fixed;z-index:380;touch-action:none;will-change:left,top}
.mp-ball{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--purple));color:#04120f;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 10px 30px rgba(0,255,224,.45);transition:transform .18s var(--ease);animation:mpPulse 2.4s ease-in-out infinite;cursor:grab;position:relative}
.mp-ball:active{cursor:grabbing;transform:scale(.94)}
.mp-ball.spin{animation:mpSpin 3s linear infinite,mpPulse 2.4s ease-in-out infinite}
@keyframes mpSpin{to{transform:rotate(360deg)}}
@keyframes mpPulse{0%,100%{box-shadow:0 10px 30px rgba(0,255,224,.4)}50%{box-shadow:0 10px 40px rgba(0,255,224,.8),0 0 60px rgba(180,74,255,.5)}}
.mp-ball .mp-eq{position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);display:flex;gap:2px;align-items:flex-end;height:12px}
.mp-ball .mp-eq i{width:3px;background:#04120f;border-radius:2px;animation:eqBar .8s ease-in-out infinite}
.mp-ball .mp-eq i:nth-child(1){height:5px;animation-delay:0s}
.mp-ball .mp-eq i:nth-child(2){height:10px;animation-delay:.15s}
.mp-ball .mp-eq i:nth-child(3){height:7px;animation-delay:.3s}
@keyframes eqBar{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
.mp-panel{width:330px;max-width:calc(100vw - 24px);background:rgba(18,18,26,.98);border:1px solid var(--border);border-radius:16px;padding:12px;box-shadow:0 20px 60px rgba(0,0,0,.75);backdrop-filter:blur(20px);animation:mIn .2s var(--ease) both;cursor:default}
.mp-dragbar{display:flex;align-items:center;gap:8px;margin-bottom:10px;cursor:grab;user-select:none;touch-action:none}
.mp-dragbar:active{cursor:grabbing}
.mp-dragbar .grip{width:34px;height:5px;border-radius:99px;background:var(--border2);flex:none}
.mp-dragbar .sp{flex:1}
.mp-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.mp-art{width:56px;height:56px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--purple));display:flex;align-items:center;justify-content:center;font-size:24px;flex:none;overflow:hidden;background-size:cover;background-position:center}
.mp-info{flex:1;min-width:0}
.mp-title{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-artist{font-size:12px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-controls{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:10px}
.mp-controls button{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:all .15s}
.mp-controls button:hover{background:var(--surface2);color:var(--accent)}
.mp-controls button svg{width:18px;height:18px}
.mp-controls .mp-play{width:46px;height:46px;background:linear-gradient(135deg,var(--accent),var(--purple));color:#04120f}
.mp-controls .mp-play:hover{transform:scale(1.06);box-shadow:0 0 20px rgba(0,255,224,.5)}
.mp-controls .mp-play svg{width:22px;height:22px}
.mp-tracks{max-height:180px;overflow-y:auto;border-top:1px solid var(--border);padding-top:8px}
.mp-track{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:7px;cursor:pointer;font-size:12.5px;transition:background .12s;width:100%;text-align:left;color:var(--text)}
.mp-track:hover{background:rgba(255,255,255,.05)}
.mp-track.playing{background:rgba(0,255,224,.08);color:var(--accent)}
.mp-track .mp-num{width:16px;color:var(--text3);font-size:11px;flex:none}
.mp-track .mp-ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mp-track .mp-ttl small{color:var(--text3);display:block;font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mp-hidden{position:fixed;left:0;bottom:0;width:1px;height:1px;overflow:hidden;opacity:.01;pointer-events:none;z-index:-1}

/* ============ VOICE / CALL BAR + VIDEO ============ */
.voice-bar{position:fixed;top:0;left:0;right:0;z-index:390;background:linear-gradient(135deg,rgba(0,255,224,.14),rgba(180,74,255,.14));border-bottom:1px solid var(--accent);padding:8px 14px;display:flex;align-items:center;gap:10px;backdrop-filter:blur(20px);font-size:13px;flex-wrap:wrap}
.voice-bar .vb-info{flex:1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:120px}
.voice-bar .vb-name{font-weight:700;color:var(--accent)}
.voice-bar .vb-participants{color:var(--text2);font-size:12px}
.voice-bar button{padding:8px 12px;border-radius:8px;font-weight:600;font-size:12px;background:var(--surface2);border:1px solid var(--border);color:var(--text);transition:all .15s;display:flex;align-items:center;gap:5px;min-height:36px}
.voice-bar button:hover{background:var(--surface3);border-color:var(--accent)}
.voice-bar button.danger{background:rgba(255,45,111,.15);color:#ff7aa2;border-color:rgba(255,45,111,.4)}
.voice-bar button.muted{background:rgba(255,45,111,.15);color:#ff7aa2;border-color:rgba(255,45,111,.4)}
.voice-bar button svg{width:15px;height:15px}
.vc-videos{position:fixed;right:14px;bottom:90px;z-index:385;display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow-y:auto;max-width:60vw}
.vc-tile{position:relative;width:180px;height:135px;border-radius:12px;overflow:hidden;background:#000;border:1px solid var(--border);box-shadow:0 10px 30px rgba(0,0,0,.6)}
.vc-tile video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
.vc-tile .vc-name{position:absolute;left:6px;bottom:6px;font-size:10.5px;font-weight:700;background:rgba(0,0,0,.6);padding:2px 7px;border-radius:99px}
.vc-tile .vc-mute{position:absolute;right:6px;top:6px;font-size:12px;background:rgba(0,0,0,.6);padding:1px 6px;border-radius:99px}
@media(max-width:760px){.vc-tile{width:120px;height:90px}.vc-videos{bottom:150px;right:8px}}

/* ============ CALL MODAL ============ */
.call-modal{text-align:center;padding:26px 18px}
.call-modal .call-avatar{width:100px;height:100px;margin:0 auto 18px;position:relative;animation:callRing 1s infinite}
@keyframes callRing{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.call-modal .call-name{font-size:22px;font-weight:800;font-family:'Space Grotesk';margin-bottom:6px}
.call-modal .call-status{color:var(--text2);font-size:14px;margin-bottom:24px}
.call-modal .call-actions{display:flex;gap:16px;justify-content:center}
.call-modal .call-btn{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;transition:all .15s}
.call-modal .call-btn.accept{background:linear-gradient(135deg,#00e676,#00b85c);color:#fff;animation:callRing 1.5s infinite}
.call-modal .call-btn.decline{background:linear-gradient(135deg,#ff2d6f,#d6005a);color:#fff}
.call-modal .call-btn:hover{transform:scale(1.08)}

/* ============ GAMES ============ */
.games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.game-card{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;transition:all .15s;cursor:pointer;color:var(--text)}
.game-card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:var(--glow)}
.game-card .gc-emoji{font-size:30px}
.game-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border);gap:10px;flex-wrap:wrap}
.game-score{font-family:'Space Grotesk';font-weight:800;font-size:20px;color:var(--accent)}
.game-timer{font-family:ui-monospace,monospace;font-size:13px;color:var(--text2)}
.fish-pond{position:relative;height:320px;background:linear-gradient(180deg,#062a3a,#0a1020);border-radius:14px;overflow:hidden;cursor:crosshair;border:1px solid var(--border);user-select:none}
.fish-item{position:absolute;font-size:30px;cursor:pointer;user-select:none;transition:transform .1s;z-index:2;will-change:transform}
.fish-item:hover{transform:scale(1.2)}
.fish-item.caught{animation:fishPop .3s forwards;pointer-events:none}
@keyframes fishPop{to{transform:scale(1.9);opacity:0}}
.ttt-grid{display:grid;grid-template-columns:repeat(3,90px);grid-gap:6px;justify-content:center;margin:20px auto}
.ttt-cell{width:90px;height:90px;border-radius:12px;background:var(--surface2);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;font-family:'Space Grotesk';cursor:pointer;transition:all .15s;color:var(--text)}
.ttt-cell:hover{background:var(--surface3);border-color:var(--accent)}
.ttt-cell.win{background:rgba(0,230,118,.15);border-color:var(--green);color:var(--green)}
.rps-choices{display:flex;gap:14px;justify-content:center;margin:22px 0;flex-wrap:wrap}
.rps-btn{width:88px;height:88px;font-size:42px;border-radius:16px;background:var(--surface2);border:2px solid var(--border);cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center}
.rps-btn:hover{border-color:var(--accent);transform:scale(1.08);box-shadow:var(--glow)}
.rps-result{font-size:16px;font-weight:700;text-align:center;min-height:24px;margin:12px 0;color:var(--accent)}
.rps-scoreline{display:flex;justify-content:center;gap:22px;font-family:'Space Grotesk';font-size:18px;font-weight:700;margin-top:8px}
.memory-grid{display:grid;grid-template-columns:repeat(4,74px);gap:8px;justify-content:center;margin:14px 0}
.mem-card{width:74px;height:74px;border-radius:10px;background:var(--surface2);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:32px;cursor:pointer;transition:transform .2s;user-select:none}
.mem-card.flipped{background:var(--surface3);border-color:var(--accent)}
.mem-card.matched{background:rgba(0,230,118,.15);border-color:var(--green);cursor:default;opacity:.7}
.reaction-pad{height:220px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk';font-weight:800;font-size:24px;cursor:pointer;text-align:center;padding:20px;transition:background .1s}
.reaction-pad.wait{background:#c0392b;color:#fff}
.reaction-pad.go{background:#27ae60;color:#fff}
.reaction-pad.idle{background:var(--surface2);color:var(--text2);border:2px dashed var(--border)}
.snake-grid{display:grid;grid-template-columns:repeat(15,20px);gap:1px;justify-content:center;margin:14px auto;padding:6px;background:var(--void);border-radius:10px;border:1px solid var(--border);width:max-content}
.snake-cell{width:20px;height:20px;background:var(--surface2);border-radius:2px}
.snake-cell.head{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.snake-cell.body{background:var(--accent2)}
.snake-cell.food{background:var(--rose);border-radius:50%;animation:snakePulse 1s infinite}
@keyframes snakePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}

/* ============ BROWSER ============ */
.browser-bar{display:flex;gap:6px;margin-bottom:12px}
.browser-bar input{flex:1;padding:11px 13px;border-radius:8px;background:var(--void);border:1px solid var(--border);color:var(--text)}
.browser-bar input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(0,255,224,.12)}
.browser-frame{width:100%;height:420px;border-radius:12px;border:1px solid var(--border);background:#fff}
.browser-quick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.browser-quick button{padding:7px 11px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);color:var(--text2);font-size:12px;font-weight:600;transition:all .15s}
.browser-quick button:hover{background:var(--surface3);color:var(--accent);border-color:var(--accent)}

/* ============ INVITES ============ */
.invite-card{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px}
.invite-card .pub{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
.invite-card .priv{font-size:12px;color:var(--amber);margin-top:3px}
.invite-card .meta{font-size:11px;color:var(--text3);margin-top:6px;display:flex;flex-wrap:wrap;gap:10px}

/* ============ AI ============ */
.ai-msg{padding:10px 12px;border-radius:12px;margin-bottom:8px;font-size:14px;line-height:1.55;max-width:88%;white-space:pre-wrap;word-wrap:break-word}
.ai-msg.user{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04120f;margin-left:auto;border-bottom-right-radius:4px}
.ai-msg.assistant{background:var(--surface2);border:1px solid var(--border);border-bottom-left-radius:4px}
.ai-msg.typing{color:var(--text3);font-style:italic}
.ai-input-row{display:flex;gap:8px;margin-top:14px}
.ai-input-row input{flex:1;padding:11px 13px;border-radius:8px;background:var(--void);border:1px solid var(--border);color:var(--text);font-size:16px}
.ai-input-row input:focus{border-color:var(--accent);outline:none}
.ai-chat{max-height:44vh;overflow-y:auto;padding-right:4px}

/* ============ SHOP ============ */
.wallet-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;background:linear-gradient(135deg,rgba(255,215,0,.15),rgba(255,171,0,.1));border:1px solid rgba(255,215,0,.3);font-size:12px;font-weight:700;color:var(--gold);cursor:pointer;transition:all .15s}
.wallet-pill:hover{background:linear-gradient(135deg,rgba(255,215,0,.25),rgba(255,171,0,.2));transform:translateY(-1px)}
.shop-tabs{display:flex;gap:4px;background:var(--void);padding:4px;border-radius:10px;border:1px solid var(--border);margin-bottom:18px;overflow-x:auto}
.shop-tab{flex:none;padding:8px 14px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--text3);transition:all .15s;white-space:nowrap;cursor:pointer}
.shop-tab.active{background:var(--surface2);color:var(--accent);box-shadow:inset 0 0 0 1px rgba(0,255,224,.2)}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.shop-card{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;transition:all .15s;cursor:pointer}
.shop-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.shop-card.owned{opacity:.75}
.shop-card.rarity-rare{border-color:rgba(0,255,224,.4)}
.shop-card.rarity-epic{border-color:rgba(180,74,255,.5);box-shadow:0 0 15px rgba(180,74,255,.15)}
.shop-card.rarity-legendary{border-color:rgba(255,215,0,.5);box-shadow:0 0 20px rgba(255,215,0,.2)}
.shop-preview{height:72px;display:flex;align-items:center;justify-content:center;font-size:32px;background:var(--void);border-radius:8px;position:relative;overflow:hidden}
.shop-name{font-weight:700;font-size:13px}
.shop-desc{font-size:11px;color:var(--text3);line-height:1.4}
.shop-price{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;color:var(--gold);margin-top:auto;min-height:22px}
.shop-price .owned-tag{color:var(--green);font-size:10px;text-transform:uppercase}
.shop-price .equip-tag{color:var(--accent);font-size:10px;text-transform:uppercase}
.badge-icon{font-size:14px;margin-left:4px;vertical-align:middle}

/* ============ PROFILE ============ */
.profile-hero{border-radius:14px;padding:22px;background:linear-gradient(135deg,rgba(0,255,224,.12),rgba(180,74,255,.12));border:1px solid var(--border);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.profile-hero .ph-info{flex:1;min-width:140px}
.profile-hero .ph-name{font-family:'Space Grotesk';font-size:22px;font-weight:800;line-height:1.2}
.profile-hero .ph-user{font-size:13px;color:var(--text2);margin-top:2px}
.profile-hero .ph-bio{font-size:13px;color:var(--text2);margin-top:10px;line-height:1.5;white-space:pre-wrap}
.profile-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.profile-stat{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center}
.profile-stat .ps-v{font-family:'Space Grotesk';font-weight:800;font-size:18px;color:var(--accent)}
.profile-stat .ps-l{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.profile-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

/* ============ EFFECTS ============ */
.fx-glow{box-shadow:0 0 15px var(--accent),0 0 30px var(--accent);animation:fxGlowPulse 2s ease-in-out infinite}
@keyframes fxGlowPulse{0%,100%{box-shadow:0 0 15px var(--accent),0 0 30px var(--accent)}50%{box-shadow:0 0 25px var(--accent),0 0 50px var(--accent)}}
.fx-sparkle{position:relative}
.fx-sparkle::before,.fx-sparkle::after{content:'✨';position:absolute;font-size:16px;animation:fxSparkleOrbit 3s linear infinite;pointer-events:none;z-index:1}
.fx-sparkle::after{animation-delay:-1.5s;content:'⭐';font-size:12px}
@keyframes fxSparkleOrbit{0%{top:0;left:0;opacity:1}25%{top:0;left:100%;opacity:.7}50%{top:100%;left:100%;opacity:1}75%{top:100%;left:0;opacity:.7}100%{top:0;left:0;opacity:1}}
.fx-flame{position:relative;animation:fxFlameShake .15s infinite}
.fx-flame::before{content:'🔥';position:absolute;font-size:22px;bottom:-10px;left:50%;transform:translateX(-50%);animation:fxFlameFloat 1.2s ease-in-out infinite alternate;z-index:1}
@keyframes fxFlameShake{0%,100%{transform:translate(0,0)}50%{transform:translate(-1px,-1px)}}
@keyframes fxFlameFloat{from{transform:translateX(-50%) scaleY(1);opacity:1}to{transform:translateX(-50%) scaleY(1.15) translateY(-4px);opacity:.85}}
.fx-glitch{position:relative;animation:fxGlitch 2.5s infinite}
@keyframes fxGlitch{0%,90%,100%{transform:none;filter:none}92%{transform:translate(-2px,0);filter:hue-rotate(90deg)}94%{transform:translate(2px,0);filter:hue-rotate(-90deg)}96%{transform:translate(-1px,1px)}}
.name-anim{background-size:400% 100%!important;-webkit-background-clip:text!important;background-clip:text!important;-webkit-text-fill-color:transparent!important;animation:nameGradient 3s linear infinite!important}
@keyframes nameGradient{0%{background-position:0% 50%}100%{background-position:400% 50%}}

@media (max-width:1050px){.app,.app.hide-members{grid-template-columns:74px 240px 1fr}.members{position:fixed;right:0;top:0;bottom:0;width:250px;transform:translateX(100%);transition:transform .28s;z-index:80;box-shadow:-20px 0 50px rgba(0,0,0,.5)}.members.open{transform:none}}
@media (max-width:760px){
.app,.app.hide-members{grid-template-columns:1fr;padding-bottom:calc(60px + env(safe-area-inset-bottom))}
.mobile-only{display:flex}
.rail{position:fixed;left:0;right:0;bottom:0;top:auto;height:calc(60px + env(safe-area-inset-bottom));width:auto;flex-direction:row;border-right:none;border-top:1px solid var(--border);padding:0 10px env(safe-area-inset-bottom);gap:8px;z-index:60;overflow-x:auto}
.rail-sep{width:1px;height:30px;margin:0 2px;flex:none}
.rail-btn{width:42px;height:42px;border-radius:13px;flex:none}
.panel{position:fixed;left:0;top:0;bottom:calc(60px + env(safe-area-inset-bottom));width:280px;z-index:70;transform:translateX(-100%);transition:transform .28s var(--ease);box-shadow:20px 0 50px rgba(0,0,0,.6)}
.panel.open{transform:none}
.composer-wrap{padding:0 10px 10px}
.msg{padding:4px 12px}
.msg .toolbar{right:12px;display:flex;opacity:.75}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:65}
.btn,.row,.rail-btn,.game-card,.ttt-cell,.mem-card,.rps-btn{min-height:44px}
.ttt-cell{width:80px;height:80px;font-size:38px}
.ttt-grid{grid-template-columns:repeat(3,80px)}
.memory-grid{grid-template-columns:repeat(4,68px)}
.mem-card{width:68px;height:68px}
.fish-pond{height:260px}
.modal{max-height:92vh}
.browser-frame{height:330px}
.voice-bar{padding:8px 10px;font-size:12px;flex-wrap:wrap}
.music-player{z-index:400}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>

<!-- ================= AUTH ================= -->
<div class="auth-screen" id="auth-screen">

  }catch(e){}
}

   ========================================================= */
async function loadMe(){
  for(var attempt=0;attempt<10;attempt++){
    var r=await sb.from('profiles').select('*').eq('id',SESSION.user.id).maybeSingle();
    if(r.error){log("loadMe",r.error);}
    if(r.data){ME=r.data;PROFILES[ME.id]=ME;return;}
    if(attempt===0){
      var meta=SESSION.user.user_metadata||{};
      var rawName=meta.username||meta.preferred_username||meta.user_name||(SESSION.user.email||'user').split('@')[0];
      var base=String(rawName).toLowerCase().replace(/[^a-z0-9_]/g,'').slice(0,18)||'user';
      var candidate=base,n=1;
      while(true){
        var ex=await sb.from('profiles').select('id').eq('username',candidate).maybeSingle();
        if(!ex.data)break;
        candidate=base+n;n++;
        if(n>50){candidate=base+Math.floor(Math.random()*10000);break;}
      }
      var insert={id:SESSION.user.id,username:candidate,display_name:meta.full_name||meta.name||candidate};
      var created=await sb.from('profiles').insert(insert).select().single();
      if(!created.error&&created.data){ME=created.data;PROFILES[ME.id]=ME;return;}
      log("auto-create failed",created.error);
    }
    await new Promise(function(r){setTimeout(r,400);});
  }
}
async function fetchProfiles(ids){
  var missing=(ids||[]).filter(function(id){return id&&!PROFILES[id];});
  if(!missing.length)return;
  var uniq=[];missing.forEach(function(x){if(uniq.indexOf(x)<0)uniq.push(x);});
  var r=await sb.from('profiles').select('*').in('id',uniq);
  (r.data||[]).forEach(function(p){PROFILES[p.id]=p;});
}
async function updateProfile(patch){
  var r=await sb.from('profiles').update(patch).eq('id',ME.id);
  if(r.error){
    // retry without optional columns that may not exist
    var safe={};['display_name','status','avatar_url','username'].forEach(function(k){if(patch[k]!==undefined)safe[k]=patch[k];});
    var r2=await sb.from('profiles').update(safe).eq('id',ME.id);
    if(r2.error)throw r2.error;
    Object.keys(safe).forEach(function(k){ME[k]=safe[k];});
  }else{
    Object.keys(patch).forEach(function(k){ME[k]=patch[k];});
  }
  PROFILES[ME.id]=ME;
  renderUserBar();renderPanel();renderMembers();renderChat();
}

async function loadFriends(){
  if(!ME)return;
  var r=await sb.from('friendships').select('*').or('user_id.eq.'+ME.id+',friend_id.eq.'+ME.id);
  FRIENDS={accepted:[],incoming:[],outgoing:[]};
  (r.data||[]).forEach(function(f){
    var other=(f.user_id===ME.id)?f.friend_id:f.user_id;
    if(f.status==='accepted')FRIENDS.accepted.push({id:f.id,other:other});
    else if(f.status==='pending'&&f.requested_by!==ME.id)FRIENDS.incoming.push({id:f.id,other:other});
    else if(f.status==='pending'&&f.requested_by===ME.id)FRIENDS.outgoing.push({id:f.id,other:other});
  });
  var ids=[];FRIENDS.accepted.concat(FRIENDS.incoming,FRIENDS.outgoing).forEach(function(f){ids.push(f.other);});
  await fetchProfiles(ids);
}
async function sendFriendRequest(username){
  var clean=String(username||"").trim().replace(/^@/,'').toLowerCase();
  if(!clean)throw new Error("Type a username first.");
  var t=await sb.from('profiles').select('*').eq('username',clean).maybeSingle();
  if(!t.data)throw new Error("No user found with @"+clean);
  if(t.data.id===ME.id)throw new Error("You cannot add yourself.");
  var existing=[].concat(FRIENDS.accepted,FRIENDS.incoming,FRIENDS.outgoing).filter(function(f){return f.other===t.data.id;});
  if(existing.length)throw new Error("Already friends or pending.");
  var r=await sb.from('friendships').insert({user_id:ME.id,friend_id:t.data.id,status:'pending',requested_by:ME.id});
  if(r.error)throw r.error;
  PROFILES[t.data.id]=t.data;
  await loadFriends();
}

async function createChannel(serverId,name,type,category){
  if(!name||!name.trim())throw new Error("Give the channel a name.");
  var ch=await sb.from('channels').select('*').eq('server_id',serverId);
  var list=ch.data||[];
  var texts=list.filter(function(c){return c.type==='text';}).length;
  var voices=list.filter(function(c){return c.type==='voice';}).length;
  if((type||'text')==='voice'){ if(voices>=MAX_VOICE_CHANNELS) throw new Error('Voice channel limit reached ('+MAX_VOICE_CHANNELS+' per server).'); }
  else { if(texts>=MAX_TEXT_CHANNELS) throw new Error('Text channel limit reached ('+MAX_TEXT_CHANNELS+' per server).'); }
  name=name.trim().toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9_-]/g,'');
  if(!name)throw new Error('Invalid channel name.');
  var r=await sb.from('channels').insert({server_id:serverId,name:name,type:type||'text',category:category||'Text Channels',position:list.length});
  if(r.error)throw r.error;
}

async function loadConversations(){
  if(!ME)return;
  var cms=await sb.from('conversation_members').select('conversation_id').eq('user_id',ME.id);
  var ids=(cms.data||[]).map(function(c){return c.conversation_id;});
  if(!ids.length){CONVERSATIONS=[];return;}
  var convs=await sb.from('conversations').select('*').in('id',ids);
  var list=convs.data||[];
  if(!list.length){CONVERSATIONS=[];return;}
  var allMembers=await sb.from('conversation_members').select('conversation_id,user_id').in('conversation_id',ids);
  var byConv={};
  (allMembers.data||[]).forEach(function(m){(byConv[m.conversation_id]=byConv[m.conversation_id]||[]).push(m.user_id);});
  var allIds=[];Object.keys(byConv).forEach(function(k){allIds=allIds.concat(byConv[k]);});
  await fetchProfiles(allIds);
  await Promise.all(list.map(async function(c){
    c.memberIds=byConv[c.id]||[];
    var last=await sb.from('messages').select('*').eq('conversation_id',c.id).order('id',{ascending:false}).limit(1);
    c.lastMessage=(last.data&&last.data[0])||null;
  }));
  list.sort(function(a,b){
    var ta=a.lastMessage?new Date(a.lastMessage.created_at).getTime():new Date(a.created_at||0).getTime();
    var tb=b.lastMessage?new Date(b.lastMessage.created_at).getTime():new Date(b.created_at||0).getTime();
    return tb-ta;
  });
  CONVERSATIONS=list;
}
async function getOrCreateDM(otherId){
  var myCms=await sb.from('conversation_members').select('conversation_id').eq('user_id',ME.id);
  var myIds=(myCms.data||[]).map(function(c){return c.conversation_id;});
  if(myIds.length){
    var theirCms=await sb.from('conversation_members').select('conversation_id').eq('user_id',otherId).in('conversation_id',myIds);
    for(var i=0;i<(theirCms.data||[]).length;i++){
      var cid=theirCms.data[i].conversation_id;
      var conv=await sb.from('conversations').select('*').eq('id',cid).maybeSingle();
      if(!conv.data||conv.data.is_group)continue;
      var cnt=await sb.from('conversation_members').select('*',{count:'exact',head:true}).eq('conversation_id',cid);
      if(cnt.count===2)return conv.data;
    }
  }
  var conv2=await sb.from('conversations').insert({is_group:false,created_by:ME.id}).select().single();
  if(conv2.error)throw conv2.error;
  var ins=await sb.from('conversation_members').insert([{conversation_id:conv2.data.id,user_id:ME.id},{conversation_id:conv2.data.id,user_id:otherId}]);

  if(globalMsgCh){try{sb.removeChannel(globalMsgCh);}catch(e){}}
  globalMsgCh=sb.channel('global-messages')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},function(payload){
      var m=payload.new;
      var isCurConv=CURRENT.type==="dm"&&CURRENT.conv&&m.conversation_id===CURRENT.conv.id;
      var isCurChan=CURRENT.type==="server"&&CURRENT.channel&&m.channel_id===CURRENT.channel.id;
      if(isCurConv||isCurChan){
        if(!MESSAGES.some(function(x){return x.id===m.id;})){
          fetchProfiles([m.sender_id]).then(function(){
            if(MESSAGES.some(function(x){return x.id===m.id;}))return;
            MESSAGES.push(m);renderChat();
          });
        }
        if(m.sender_id!==ME.id)sfxRecv();
        return;
      }
      var key=m.conversation_id||m.channel_id;
      if(m.sender_id===ME.id)return;
      UNREAD[key]=(UNREAD[key]||0)+1;
      if(m.conversation_id){
        fetchProfiles([m.sender_id]).then(function(){
          var who=userLabel(m.sender_id);
          var previewTxt=String(m.content||"").slice(0,60);
          toast(who,previewTxt,"ok");sfxRecv();
        });
      }
      if(m.conversation_id&&!CONVERSATIONS.some(function(c){return c.id===m.conversation_id;})){
        loadConversations().then(function(){renderPanel();renderRail();});
      }else{
        if(m.conversation_id){
          var c=CONVERSATIONS.filter(function(x){return x.id===m.conversation_id;})[0];
          if(c)c.lastMessage=m;
        }
        renderPanel();
      }
    })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'messages'},function(payload){
      var m=payload.new;
      var isCurConv=CURRENT.type==="dm"&&CURRENT.conv&&m.conversation_id===CURRENT.conv.id;
      var isCurChan=CURRENT.type==="server"&&CURRENT.channel&&m.channel_id===CURRENT.channel.id;
      if(isCurConv||isCurChan){
        for(var i=0;i<MESSAGES.length;i++){if(MESSAGES[i].id===m.id){MESSAGES[i]=m;break;}}
        renderChat();
      }
    })
    .subscribe();
}

  try{typingCh.send({type:'broadcast',event:'typing',payload:{user_id:ME.id}});}catch(e){}
}

},1000);

function renderComposer(wrap){
  var key=CURRENT.type+':'+(CURRENT.conv?CURRENT.conv.id:(CURRENT.channel?CURRENT.channel.id:''));
  if(composerKey===key&&wrap.querySelector('#c-input'))return;
  composerKey=key;
  wrap.innerHTML='<div class="composer"><button class="cbtn" type="button" id="c-emoji" title="Emoji">😀</button>'+
    '<textarea id="c-input" rows="1" placeholder="Message..."></textarea>'+
    '<button class="cbtn send" type="button" id="c-send" title="Send">'+SVG.send+'</button></div>';
  var ta=$("#c-input");
  ta.addEventListener('input',function(){
    ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,190)+'px';
    broadcastTyping();
  });
  ta.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&!e.shiftKey&&!isMobile()){e.preventDefault();doSend();}
  });
  $("#c-send").onclick=doSend;
  $("#c-emoji").onclick=function(){
    var picker=document.createElement('div');
    picker.className='emoji-picker';
    picker.innerHTML=EMOJIS.map(function(e){return '<button type="button">'+e+'</button>';}).join('');
    picker.addEventListener('click',function(e){
      var b=e.target.closest('button');if(!b)return;
      ta.value+=b.textContent;ta.focus();picker.remove();
    });
    wrap.appendChild(picker);
    setTimeout(function(){
      document.addEventListener('mousedown',function close(ev){
        if(!picker.contains(ev.target)){picker.remove();document.removeEventListener('mousedown',close);}
      });
    },0);
  };
  function doSend(){
    var text=ta.value.trim();if(!text)return;
    ta.value='';ta.style.height='auto';
    sendMessage(text).catch(function(e){toast('Send failed',e.message,'err');});
  }
}

/* =========================================================
   VOICE / VIDEO  (WebRTC mesh over Supabase broadcast)
   ========================================================= */
var VC={room:null,ch:null,peers:{},stream:null,muted:false,camOn:false,video:false,label:''};

function vcSend(payload){
  if(!VC.ch)return;
  try{VC.ch.send({type:'broadcast',event:'vc',payload:payload});}catch(e){}
}
function vcPeersCount(){return Object.keys(VC.peers).length;}

async function joinCall(roomKey,opts){
  opts=opts||{};
  if(VC.room===roomKey&&VC.ch){
    if(opts.video&&!VC.camOn)await enableCamera();
    renderVoiceBar();return;
  }
  if(VC.room)leaveCall();
  VC.room=roomKey;VC.video=!!opts.video;VC.muted=false;
  VC.label = roomKey.indexOf('dm:')===0 ? 'Direct Call' : 'Voice Channel';
  try{
    VC.stream=await navigator.mediaDevices.getUserMedia({audio:true,video:VC.video?{width:{ideal:640},height:{ideal:480},facingMode:'user'}:false});
  }catch(e){
    try{
      VC.stream=await navigator.mediaDevices.getUserMedia({audio:true});
      VC.video=false;
      toast('Camera unavailable','Joined with audio only','err');
    }catch(e2){
      toast('Mic blocked','Allow microphone access to join calls','err');
      VC.room=null;VC.stream=null;return;
    }
  }
  VC.camOn=VC.stream.getVideoTracks().length>0;
  VC.muted=false;

  var ch=sb.channel('voice-'+roomKey,{config:{broadcast:{self:false}}});
  VC.ch=ch;
  ch.on('broadcast',{event:'vc'},function(msg){
    var d=msg.payload||msg;
    if(!d||!d.t)return;
    if(d.from===ME.id)return;
    if(d.to&&d.to!==ME.id)return;
    handleVcSignal(d);
  });
  ch.subscribe(async function(status){
    if(status==='SUBSCRIBED'){
      await new Promise(function(r){setTimeout(r,150);});
      vcSend({t:'join',from:ME.id,video:VC.camOn});
    }
  });
  renderVoiceBar();renderVideoTiles();
  toast('Connected',(VC.video?'Video':'Voice')+' call active','ok');
}

async function enableCamera(){
  if(!VC.stream)return;
  if(VC.camOn){VC.camOn=true;return;}
  try{
    var s=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:640},height:{ideal:480}}});
    var track=s.getVideoTracks()[0];
    VC.stream.addTrack(track);
    Object.keys(VC.peers).forEach(function(id){
      try{VC.peers[id].pc.addTrack(track,VC.stream);}catch(e){}
    });
    // renegotiate
    Object.keys(VC.peers).forEach(async function(id){
      var peer=VC.peers[id];
      try{
        var offer=await peer.pc.createOffer();
        await peer.pc.setLocalDescription(offer);
        vcSend({t:'offer',from:ME.id,to:id,sdp:peer.pc.localDescription});
      }catch(e){}
    });
    VC.camOn=true;
  }catch(e){toast('Camera error',e.message||'Not available','err');}
}

function handleVcSignal(d){
  if(d.t==='join'){
    createPeer(d.from,true);
  }else if(d.t==='leave'){
    destroyPeer(d.from);
  }else if(d.t==='offer'){
    createPeer(d.from,false);
    var peer=VC.peers[d.from];if(!peer)return;
    peer.pc.setRemoteDescription(new RTCSessionDescription(d.sdp)).then(async function(){
      var ans=await peer.pc.createAnswer();
      await peer.pc.setLocalDescription(ans);
      vcSend({t:'answer',from:ME.id,to:d.from,sdp:peer.pc.localDescription});
    }).catch(function(e){log('offer err',e);});
  }else if(d.t==='answer'){
    var p2=VC.peers[d.from];if(!p2)return;
    p2.pc.setRemoteDescription(new RTCSessionDescription(d.sdp)).catch(function(e){log('ans err',e);});
  }else if(d.t==='ice'){
    var p3=VC.peers[d.from];if(!p3||!d.c)return;
    p3.pc.addIceCandidate(new RTCIceCandidate(d.c)).catch(function(){});
  }
}

function createPeer(id,initiator){
  if(VC.peers[id])return VC.peers[id];
  var pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]});
  var entry={pc:pc,stream:new MediaStream()};
  VC.peers[id]=entry;
  if(VC.stream){
    VC.stream.getTracks().forEach(function(t){try{pc.addTrack(t,VC.stream);}catch(e){}});
  }
  pc.onicecandidate=function(e){
    if(e.candidate)vcSend({t:'ice',from:ME.id,to:id,c:e.candidate});
  };
  pc.ontrack=function(e){
    entry.stream.addTrack(e.track);
    renderVideoTiles();
  };
  pc.onconnectionstatechange=function(){
    if(pc.connectionState==='failed'||pc.connectionState==='closed')destroyPeer(id);
  };
  if(initiator){
    pc.createOffer().then(function(o){return pc.setLocalDescription(o);}).then(function(){
      vcSend({t:'offer',from:ME.id,to:id,sdp:pc.localDescription});
    }).catch(function(e){log('offer create',e);});
  }
  renderVoiceBar();
  return entry;
}
function destroyPeer(id){
  var p=VC.peers[id];
  if(!p)return;
  try{p.pc.close();}catch(e){}
  delete VC.peers[id];
  renderVoiceBar();renderVideoTiles();
}
function toggleMute(){
  if(!VC.stream)return;
  VC.muted=!VC.muted;
  VC.stream.getAudioTracks().forEach(function(t){t.enabled=!VC.muted;});
  renderVoiceBar();
}
async function toggleCamera(){
  if(!VC.stream)return;
  if(VC.camOn){
    VC.stream.getVideoTracks().forEach(function(t){t.enabled=false;});
    VC.camOn=false;
    renderVoiceBar();renderVideoTiles();
  }else{
    var existing=VC.stream.getVideoTracks();
    if(existing.length){
      existing.forEach(function(t){t.enabled=true;});
      VC.camOn=true;
      renderVoiceBar();renderVideoTiles();
    }else{
      await enableCamera();
      renderVoiceBar();renderVideoTiles();
    }
  }
}
function leaveCall(){
  if(!VC.room&&!VC.ch){renderVoiceBar();return;}
  vcSend({t:'leave',from:ME.id});
  Object.keys(VC.peers).forEach(destroyPeer);
  VC.peers={};
  if(VC.ch){try{sb.removeChannel(VC.ch);}catch(e){}VC.ch=null;}
  if(VC.stream){VC.stream.getTracks().forEach(function(t){t.stop();});VC.stream=null;}
  VC.room=null;VC.camOn=false;VC.muted=false;
  renderVoiceBar();renderVideoTiles();renderPanel();renderChatHead();
}
function renderVoiceBar(){
  var slot=$("#voice-bar-slot");if(!slot)return;
  if(!VC.room){slot.innerHTML='';return;}
  var label=VC.label;
  if(CURRENT.type==='server'&&CURRENT.channel&&VC.room==='ch:'+CURRENT.channel.id)label=CURRENT.channel.name;
  slot.innerHTML='<div class="voice-bar">'+
    '<div class="vb-info"><span class="vb-name">🔊 '+esc(label)+'</span>'+
    '<span class="vb-participants">'+(1+vcPeersCount())+' connected</span></div>'+
    '<button id="vc-mute" class="'+(VC.muted?'muted':'')+'" type="button">'+(VC.muted?SVG.micOff:SVG.mic)+' '+(VC.muted?'Unmute':'Mute')+'</button>'+
    '<button id="vc-cam" class="'+(!VC.camOn?'muted':'')+'" type="button">'+SVG.video+' '+(VC.camOn?'Cam Off':'Cam On')+'</button>'+
    '<button id="vc-leave" class="danger" type="button">'+SVG.phoneOff+' Leave</button>'+
    '</div>';
  var m=$("#vc-mute");if(m)m.onclick=toggleMute;
  var c=$("#vc-cam");if(c)c.onclick=toggleCamera;
  var l=$("#vc-leave");if(l)l.onclick=leaveCall;
}
function renderVideoTiles(){
  var host=$("#vc-videos");if(!host)return;
  if(!VC.room||!VC.camOn){host.innerHTML='';}
  else{
    host.innerHTML='<div class="vc-tile"><video id="vc-local" autoplay playsinline muted></video><span class="vc-name">You</span></div>';
    var v=document.getElementById('vc-local');
    if(v&&VC.stream)v.srcObject=VC.stream;
  }
  Object.keys(VC.peers).forEach(function(id){
    var entry=VC.peers[id];
    var hasVideo=entry.stream.getVideoTracks().length>0;
    if(!hasVideo)return;
    var tile=document.createElement('div');
    tile.className='vc-tile';tile.dataset.peer=id;
    tile.innerHTML='<video autoplay playsinline></video><span class="vc-name">'+esc(userLabel(id))+'</span>';
    host.appendChild(tile);
    var vv=tile.querySelector('video');
    vv.srcObject=entry.stream;
    vv.play().catch(function(){});
  });
}

var Game={ch:null,session:null,game:null,opponent:null,bet:0,symbol:null,board:null,myTurn:false,myChoice:null,theirChoice:null,done:false};

function showChallengeInvite(d){

      '</div>'+

      '<button class="btn primary" id="ch-accept" type="button">Accept &amp; Play</button></div>'
    );
    $("#ch-decline").onclick=function(){
      sendChallengeReply(d.from,d.game,d.bet,d.sessionId,false);
      closeQa();
    };
    $("#ch-accept").onclick=function(){
      if(d.bet>0&&WALLET.coins<d.bet){toast('Not enough coins','You need '+d.bet+' coins','err');return;}
      if(d.bet>0)addCoins(-d.bet);
      sendChallengeReply(d.from,d.game,d.bet,d.sessionId,true);
      closeQa();
      openOnlineGame(d.game,d.sessionId,d.from,d.bet,false);
    };
  });
}
function handleChallengeReply(d){
  if(!d.accept){toast('Challenge declined','They said no 😔','err');return;}
  if(d.bet>0){
    if(WALLET.coins<d.bet){toast('Not enough coins','You needed '+d.bet,'err');return;}
    addCoins(-d.bet);
  }
  openOnlineGame(d.game,d.sessionId,d.from,d.bet,true);
}

function openOnlineGame(game,sessionId,opponentId,bet,isHost){
  Game.game=game;Game.session=sessionId;Game.opponent=opponentId;Game.bet=bet||0;Game.done=false;
  Game.myChoice=null;Game.theirChoice=null;
  if(game==='ttt'){Game.board=Array(9).fill('');Game.symbol=isHost?'X':'O';Game.myTurn=isHost;}
  if(Game.ch){try{sb.removeChannel(Game.ch);}catch(e){}}
  Game.ch=sb.channel('game-'+sessionId,{config:{broadcast:{self:false}}});
  Game.ch.on('broadcast',{event:'g'},function(msg){
    var d=msg.payload||{};
    if(d.from===ME.id)return;
    handleGameMessage(d);
  });
  Game.ch.subscribe();
  renderGameModal(isHost);
}
function gameSend(payload){if(Game.ch){payload.from=ME.id;try{Game.ch.send({type:'broadcast',event:'g',payload:payload});}catch(e){}}}
function handleGameMessage(d){
  if(d.t==='move'&&Game.game==='ttt'){
    if(Game.board[d.idx]===''&&!Game.done){
      Game.board[d.idx]=d.sym;
      Game.myTurn=true;
      renderGameModal();
      checkTTT();
    }
  }else if(d.t==='rps'){
    Game.theirChoice=d.choice;
    resolveRPS();
  }else if(d.t==='rematch'){
    startTTTBoard();
    renderGameModal();
  }
}
function startTTTBoard(){
  Game.board=Array(9).fill('');Game.done=false;
  Game.myTurn=(Game.symbol==='X');
  gameSend({t:'rematch'});
}
function renderGameModal(){
  var oppName=userLabel(Game.opponent);
  var body='';
  if(Game.game==='ttt'){
    body='<div class="game-head"><div><div style="font-size:12px;color:var(--text3)">You are</div><div class="game-score">'+Game.symbol+'</div></div>'+
      '<div style="text-align:right"><div style="font-size:12px;color:var(--text3)">'+esc(oppName)+'</div><div class="game-score">'+(Game.symbol==='X'?'O':'X')+'</div></div></div>'+
      '<div style="text-align:center;font-weight:700;margin-bottom:8px" id="ttt-status">'+(Game.done?'Game over':(Game.myTurn?'Your turn':'Their turn...'))+'</div>'+
      '<div class="ttt-grid" id="ttt-grid">'+Game.board.map(function(v,i){
        return '<button class="ttt-cell" data-ttt="'+i+'" type="button">'+esc(v)+'</button>';
      }).join('')+'</div>'+
      (Game.bet>0?'<p style="text-align:center;color:var(--gold);font-weight:700">💰 Pot: '+(Game.bet*2)+' coins</p>':'');
  }else if(Game.game==='rps'){
    body='<div class="game-head"><div style="font-weight:700">vs '+esc(oppName)+'</div>'+(Game.bet>0?'<div class="game-score">🪙 '+(Game.bet*2)+'</div>':'')+'</div>'+
      '<div class="rps-choices">'+
      '<button class="rps-btn" data-rps="rock" type="button">🪨</button>'+
      '<button class="rps-btn" data-rps="paper" type="button">📄</button>'+
      '<button class="rps-btn" data-rps="scissors" type="button">✂️</button></div>'+
      '<div class="rps-result" id="rps-result">'+(Game.myChoice?'Waiting for '+esc(oppName)+'...':'Pick your move!')+'</div>';
  }
  qaModal('<div class="modal-head"><h3>🎮 '+(Game.game==='ttt'?'Tic-Tac-Toe':'Rock Paper Scissors')+'</h3><button class="xbtn" id="qa-x" type="button">'+SVG.x+'</button></div>'+
    '<div class="modal-body">'+body+'</div>');
  var x=document.getElementById('qa-x');if(x)x.onclick=function(){closeQa();gameSend({t:'leave'});};

  if(Game.game==='ttt'){
    $$('#ttt-grid .ttt-cell').forEach(function(btn){
      btn.onclick=function(){
        var i=parseInt(btn.dataset.ttt,10);
        if(Game.done||!Game.myTurn||Game.board[i]!=='')return;
        Game.board[i]=Game.symbol;Game.myTurn=false;
        gameSend({t:'move',idx:i,sym:Game.symbol});
        renderGameModal();checkTTT();
      };
    });
  }
  if(Game.game==='rps'){
    $$('[data-rps]').forEach(function(btn){
      btn.onclick=function(){
        if(Game.myChoice)return;
        Game.myChoice=btn.dataset.rps;
        gameSend({t:'rps',choice:Game.myChoice});
        var r=document.getElementById('rps-result');
        if(r)r.textContent='Waiting for '+oppName+'...';
        resolveRPS();
      };
    });
  }
}
function checkTTT(){
  var b=Game.board;
  var lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  var winSym=null,winLine=null;
  lines.forEach(function(l){
    if(b[l[0]]&&b[l[0]]===b[l[1]]&&b[l[1]]===b[l[2]]){winSym=b[l[0]];winLine=l;}
  });
  if(winSym){
    Game.done=true;
    lines.forEach(function(l){if(winLine&&l.join()===winLine.join()){}});
    $$('#ttt-grid .ttt-cell').forEach(function(btn,i){if(winLine&&winLine.indexOf(i)>=0)btn.classList.add('win');});
    var st=document.getElementById('ttt-status');
    if(st)st.textContent=(winSym===Game.symbol?'🎉 You win!':'😢 You lose');
    finishGame(winSym===Game.symbol);
    return;
  }
  if(b.every(function(v){return v!=='';})){
    Game.done=true;
    var st2=document.getElementById('ttt-status');
    if(st2)st2.textContent='🤝 Draw';
    finishGame(null);
  }
}
function resolveRPS(){
  if(!Game.myChoice||!Game.theirChoice)return;
  var me=Game.myChoice,them=Game.theirChoice;
  var res;
  if(me===them)res='draw';
  else if((me==='rock'&&them==='scissors')||(me==='paper'&&them==='rock')||(me==='scissors'&&them==='paper'))res='win';
  else res='lose';
  var r=document.getElementById('rps-result');
  if(r){
    var emo={rock:'🪨',paper:'📄',scissors:'✂️'};
    r.innerHTML=emo[me]+' vs '+emo[them]+' — '+(res==='win'?'🎉 You win!':res==='lose'?'😢 You lose':'🤝 Draw');
  }
  finishGame(res==='win'?true:res==='lose'?false:null);
}
function finishGame(won){
  if(Game.done===false)Game.done=true;
  if(Game.bet>0){
    if(won===true){addCoins(Game.bet*2);toast('You won!','+'+Game.bet*2+' coins','ok');}
    else if(won===false){toast('You lost','-'+Game.bet+' coins','err');sfxBad();}
    else {addCoins(Game.bet);toast('Draw','Bet refunded','ok');}
  }
  renderPanel();
}

function startFishing(){
  var state={active:false,fish:[],timer:null,endsAt:0,caught:0,coins:0};
  qaModal('<div class="modal-head"><h3>🎣 Fishing Pond</h3><button class="xbtn" id="qa-x" type="button">'+SVG.x+'</button></div>'+
    '<div class="modal-body">'+
    '<div class="game-head"><div><div style="font-size:11px;color:var(--text3)">BALANCE</div><div class="game-score" id="fish-coins">🪙 '+WALLET.coins+'</div></div>'+
    '<div style="text-align:right"><div class="game-timer" id="fish-timer">—</div><div style="font-size:11px;color:var(--text3)" id="fish-caught">Caught: 0</div></div></div>'+
    '<div class="fish-pond" id="fish-pond"></div>'+
    '<p style="font-size:11.5px;color:var(--text3);margin-top:10px">Tap fish to catch them. Careful — the 🐡 piranha steals coins!</p>'+
    '</div>'+
    '<div class="modal-foot"><button class="btn primary" id="fish-cast" type="button">Cast net (10 🪙)</button></div>');
  $("#qa-x").onclick=function(){stopFishing();closeQa();};
  $("#fish-cast").onclick=function(){castNet();};

  var pond=$("#fish-pond");
  function castNet(){
    if(state.active)return;
    if(WALLET.coins<10){toast('Not enough coins','You need 10 coins to cast','err');return;}
    addCoins(-10);
    $("#fish-coins").textContent='🪙 '+WALLET.coins;
    state.active=true;state.caught=0;state.coins=0;state.endsAt=Date.now()+20000;
    pond.innerHTML='';
    $("#fish-caught").textContent='Caught: 0';
    var kinds=[
      {e:'🐟',v:15,w:32},{e:'🐠',v:22,w:24},{e:'🐡',v:-25,w:14},{e:'🦈',v:45,w:10},
      {e:'🦐',v:12,w:16},{e:'🦑',v:30,w:9},{e:'🐙',v:35,w:6},{e:'🐢',v:18,w:10},
      {e:'💎',v:120,w:3},{e:'👑',v:200,w:2}
    ];
    for(var i=0;i<9;i++){
      var pick=weightedPick(kinds);
      spawnFish(pick);
    }
    state.timer=setInterval(function(){
      var left=Math.max(0,state.endsAt-Date.now());
      $("#fish-timer").textContent=(left/1000).toFixed(1)+'s';
      if(left<=0)endCast();
    },100);
  }
  function weightedPick(arr){
    var total=0;arr.forEach(function(k){total+=k.w;});
    var r=Math.random()*total;
    for(var i=0;i<arr.length;i++){r-=arr[i].w;if(r<=0)return arr[i];}
    return arr[0];
  }
  function spawnFish(kind){
    var el=document.createElement('div');
    el.className='fish-item';
    el.textContent=kind.e;
    var w=pond.clientWidth||300,h=pond.clientHeight||260;
    var x=Math.random()*Math.max(1,w-40),y=Math.random()*Math.max(1,h-40);
    el.style.left=x+'px';el.style.top=y+'px';
    var vx=(Math.random()*1.6+0.5)*(Math.random()<0.5?-1:1);
    var vy=(Math.random()*1.0+0.2)*(Math.random()<0.5?-1:1);
    pond.appendChild(el);
    var alive=true;
    el.addEventListener('click',function(ev){
      if(!alive||!state.active)return;
      alive=false;
      el.classList.add('caught');
      addCoins(kind.v);
      state.coins+=kind.v;state.caught++;
      $("#fish-coins").textContent='🪙 '+WALLET.coins;
      $("#fish-caught").textContent='Caught: '+state.caught;
      if(kind.v<0){sfxBad();toast('Ouch!','Piranha stole '+Math.abs(kind.v)+' coins','err');}
      else sfxCoin();
      setTimeout(function(){el.remove();},320);
    });
    (function anim(){
      if(!alive||!state.active)return;
      var cx=parseFloat(el.style.left),cy=parseFloat(el.style.top);
      var w2=pond.clientWidth,h2=pond.clientHeight;
      cx+=vx;cy+=vy;
      if(cx<0||cx>w2-36)vx=-vx;
      if(cy<0||cy>h2-36)vy=-vy;
      el.style.left=cx+'px';el.style.top=cy+'px';
      el.style.transform='scaleX('+(vx<0?-1:1)+')';
      requestAnimationFrame(anim);
    })();
  }
  function endCast(){
    state.active=false;
    clearInterval(state.timer);
    pond.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:8px">'+
      '<div style="font-size:34px">🪣</div>'+
      '<div style="font-weight:800;font-family:Space Grotesk;font-size:18px;color:var(--accent)">Cast complete!</div>'+
      '<div style="font-size:13px;color:var(--text2)">You caught '+state.caught+' fish and '+(state.coins>=0?'earned +':'lost ')+Math.abs(state.coins)+' coins</div></div>';
    $("#fish-timer").textContent='—';
    renderPanel();
  }
  function stopFishing(){state.active=false;if(state.timer)clearInterval(state.timer);}
}

/* ---------------- SNAKE ---------------- */
function startSnake(){
  var N=15;
  var snake=[{x:7,y:7}],dir={x:1,y:0},food={x:10,y:7},score=0,dead=false,timer=null;
  qaModal('<div class="modal-head"><h3>🐍 Snake</h3><button class="xbtn" id="qa-x" type="button">'+SVG.x+'</button></div>'+
    '<div class="modal-body"><div class="game-head"><div class="game-score" id="snake-score">0</div>'+
    '<div style="display:flex;gap:6px"><button class="btn sm" data-sd="up" type="button">↑</button><button class="btn sm" data-sd="left" type="button">←</button><button class="btn sm" data-sd="down" type="button">↓</button><button class="btn sm" data-sd="right" type="button">→</button></div></div>'+
    '<div class="snake-grid" id="snake-grid"></div></div>');
  $("#qa-x").onclick=function(){if(timer)clearInterval(timer);closeQa();};
  function draw(){
    var g=$("#snake-grid");if(!g)return;
    var cells=[];
    for(var y=0;y<N;y++)for(var x=0;x<N;x++){
      var cls='snake-cell';
      if(snake[0].x===x&&snake[0].y===y)cls+=' head';
      else if(snake.some(function(s){return s.x===x&&s.y===y;}))cls+=' body';
      if(food.x===x&&food.y===y)cls+=' food';
      cells.push('<div class="'+cls+'"></div>');
    }
    g.innerHTML=cells.join('');
    var sc=$("#snake-score");if(sc)sc.textContent=score;
  }
  function step(){
    if(dead)return;
    var head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
    if(head.x<0||head.y<0||head.x>=N||head.y>=N||snake.some(function(s){return s.x===head.x&&s.y===head.y;})){
      dead=true;clearInterval(timer);
      var reward=score*2;
      if(reward>0){addCoins(reward);toast('Game over','+'+reward+' coins','ok');}
      return;
    }
    snake.unshift(head);
    if(head.x===food.x&&head.y===food.y){
      score++;sfxCoin();
      do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)};}
      while(snake.some(function(s){return s.x===food.x&&s.y===food.y;}));
    }else snake.pop();
    draw();
  }
  function setDir(d){
    if(d==='up'&&dir.y===0)dir={x:0,y:-1};
    if(d==='down'&&dir.y===0)dir={x:0,y:1};
    if(d==='left'&&dir.x===0)dir={x:-1,y:0};
    if(d==='right'&&dir.x===0)dir={x:1,y:0};
  }
  $$('[data-sd]').forEach(function(b){b.onclick=function(){setDir(b.dataset.sd);};});
  document.onkeydown=function(e){
    if(e.key==='ArrowUp')setDir('up');
    if(e.key==='ArrowDown')setDir('down');
    if(e.key==='ArrowLeft')setDir('left');
    if(e.key==='ArrowRight')setDir('right');
  };
  draw();
  timer=setInterval(step,150);
}

function aiReply(input){
  var q=input.toLowerCase().trim();

  // math
  var m=q.replace(/[^0-9+\-*/(). %]/g,'');
  if(/^[\d+\-*/(). %]+$/.test(q)&&/[0-9]/.test(q)&&/[+\-*/]/.test(q)){
    try{
      // eslint-disable-next-line no-new-func
      var val=Function('"use strict";return ('+m+')')();
      if(typeof val==='number'&&isFinite(val))return input+' = '+val;
    }catch(e){}
  }
  if(/^(hi|hey|hello|yo|sup|hiya)\b/.test(q))return "Heyy 👋 What's good? Want a joke, some math help, or random ideas?";
  if(/how are you/.test(q))return "Running at 100% vibes ⚡ What can I do for you?";
  if(/your name|who are you/.test(q))return "I'm Quazi AI — baked right into Quazi Chat. No API keys, no limits, just vibes.";
  if(/joke|funny|laugh/.test(q)){
    var jokes=[
      "Why do programmers prefer dark mode? Because light attracts bugs 🐛",
      "I told my Wi-Fi we needed to talk. Now we have no connection. 📡",
      "Why did the scarecrow win an award? He was outstanding in his field 🌾",
      "What do you call a fake noodle? An impasta 🍝",
      "My code doesn't have bugs, it has randomly generated features ✨"
    ];
    return jokes[Math.floor(Math.random()*jokes.length)];
  }
  if(/flip a coin|coin flip|heads or tails/.test(q))return "🪙 "+(Math.random()<0.5?'Heads!':'Tails!');
  if(/roll a? ?dice|roll a die/.test(q))return "🎲 You rolled a "+(1+Math.floor(Math.random()*6));
  if(/time|clock/.test(q))return "It's "+new Date().toLocaleTimeString()+" where you are ⏰";
  if(/date|today/.test(q))return "Today is "+new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'})+" 📅";
  if(/help|what can you do|commands/.test(q))return "I can: tell jokes, do math, flip coins, roll dice, give ideas, tell time/date, and chat. Try: \"joke\", \"2+2*8\", \"flip a coin\".";
  if(/love|crush/.test(q))return "Ooh 👀 Shoot your shot — the worst that happens is a no. You got this.";
  if(/sad|depressed|down bad|lonely/.test(q))return "That sucks, genuinely. Talk to someone you trust, and be kind to yourself today 💙 I'm here if you want to vent.";
  if(/study|homework|exam/.test(q))return "Pro tip: 25 min focus, 5 min break (Pomodoro). Phone in another room. Works better than 3 hours of doom-scrolling 📚";
  if(/game|play/.test(q))return "Open the 🎮 arcade in the rail! Fishing, Snake, Memory, Tic-Tac-Toe, RPS — and you can bet coins on challenges 💰";
  if(/coin|money|wallet|rich/.test(q))return "You've got 🪙 "+WALLET.coins+" coins. Claim your daily, chat to earn, and fish for more. Piranhas will rob you though 🐡";
  if(/shop|cosmetic|badge|theme/.test(q))return "The 🛒 shop has game badges, name gradients, effects, and themes. Buy, equip, flex 😎";
  if(/thank/.test(q))return "Anytime 💪";
  if(/bye|later|cya/.test(q))return "Later! Ping me whenever 👋";
  if(/\?$/.test(q))return "Good question. My honest take: it depends on what you actually want out of it. Tell me more and I'll get specific.";
  var generic=[
    "Interesting 🤔 Tell me more.",
    "I hear you. What's the plan?",
    "That's valid. Want ideas or just vibes?",
    "Big energy. Say more 👀",
    "Noted 📝 What else?"
  ];
  return generic[Math.floor(Math.random()*generic.length)];
}
